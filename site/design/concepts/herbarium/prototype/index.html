l=\"z\">0–3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Speaker (50 mm CDS-5076, 7.6 deep) on the back panel's inner face<\/td>\n<td data-label=\"z\">3–10.6<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Main board (lead-free keep-out over the speaker and battery)<\/td>\n<td data-label=\"z\">top ≈ 14.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Pot body (7 [ENG]) against the shell's underside<\/td>\n<td data-label=\"z\">14.5–21.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>Top face (shell, 2.5)<\/strong><\/td>\n<td data-label=\"z\"><strong>21.5–24<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">White key surface / sharps<\/td>\n<td data-label=\"z\"><strong>24 / 26<\/strong> (strip C on spacers, R4: level with the panel)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Knob tops (KN1250 10.45) / CUTOFF (12.15)<\/td>\n<td data-label=\"z\">≈ 34.5 / 36.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Inside R3 (≈ 36 body, ≤ 40 to knob tops) with margin. FOLD and HUSH state their own.<\/p>\n<p><strong>Speaker<\/strong> (eng E-L2): bottom-firing, centre <strong>(240, 113)<\/strong> in the ONE SHEET frame. Why there: ≥ 60 mm from the nearest Hall sensors (sharps' magnets at y ≈ 50), and inside the outline (radius 25 → y 88–138). <strong>Eng to confirm ≥ 30 mm from the ladder and expo arrays<\/strong> at layout (the ladder now sits under the IV / P2 area). FOLD: a rectangular speaker on the lid, firing up (FOLD file).<\/p>\n<p><strong>Jacks (H9):<\/strong> 6 × 3.5 mm + USB-C + micro-USB (7 with eng's single-USB option) on an <strong>I/O board screwed to the inside of the rear wall<\/strong> (bosses inside; the jack barrels sit flush in the wall holes; no outside nuts). One cable to the main board. Rear wall x 150–270. FOLD: lid's right wall.<\/p>\n<p><strong>Power switch:<\/strong> recessed slide switch on the I/O board, in the rear wall (H7).<\/p>\n<h2>5. Unibody: how the flat ones are built (HUSH, ONE SHEET)<\/h2>\n<p><strong>The owner's picture: \"the controls are installed from behind and then a panel screwed in on the back.\"<\/strong> So:<\/p>\n<ul>\n<li><strong>The shell is one closed-top body<\/strong>: top face, the rounded edges and the four walls in one piece. The top has only holes: pot bushings, toggle bushings, the stick slot, the LEDs, and the key window.<\/li>\n<li><strong>Everything goes in from underneath<\/strong>: main board, strip C, I/O board, battery, speaker.<\/li>\n<li><strong>A back panel closes it<\/strong>, screwed from underneath. <strong>No fastener on the top or the walls.<\/strong><\/li>\n<\/ul>\n<h3>Retaining pots and toggles without top nuts<\/h3>\n<ul>\n<li>Pots and toggles are <strong>board-mounted<\/strong>. The main board is screwed <strong>up<\/strong> to printed bosses in the shell: <strong>10 × M3 into heat-set inserts<\/strong>, placed on the break lines and between rows so every row has a boss within ≈ 30 mm. Screwing the board up pulls each pot body tight against the shell's underside.<\/li>\n<li><strong>Anti-rotation:<\/strong> each 9 mm pot's anti-rotation tab drops into a 1 mm slot printed in the underside of the shell, so turning a knob can't twist the pot. The board takes the push of a knob through the bosses.<\/li>\n<li><strong>Bushings<\/strong> come up ≈ 2.5 mm above the face, hidden under the knob skirt. No nut, no washer on top. If a pot wobbles in a print, a thin flush nut in a 1.2 mm counterbore is the fallback (still under the knob, so it never reads as a screw).<\/li>\n<li><strong>Toggles:<\/strong> the same way, with a printed anti-rotation key. Their bats stand up through 6.5 mm holes.<\/li>\n<\/ul>\n<h3>Keys through the top face<\/h3>\n<ul>\n<li>Strip C (with 25 switches and sensors) screws <strong>up<\/strong> to four bosses under the key zone. The switch stems stand in the <strong>key window<\/strong>: one opening x 3–273, y 3–49.5, with the 2.4 mm front wall in front of it.<\/li>\n<li><strong>The key tops go on last, from above<\/strong>, pressed onto the stems through the window (they're the only parts fitted from the top). A top comes off with a fingernail.<\/li>\n<\/ul>\n<h3>The stick<\/h3>\n<ul>\n<li>The Delrin gate plate drops into a pocket on the shell's underside and is held by the main board. The stick rises through the slot, and <strong>its cap goes on after<\/strong> (eng §v1.5b order).<\/li>\n<\/ul>\n<h3>Assembly order (F9)<\/h3>\n<ol>\n<li>Shell face down on a towel.<\/li>\n<li>Press in the heat-set inserts.<\/li>\n<li>Gate plate into its pocket.<\/li>\n<li>Main board in: shafts, bushings and stick up through their holes; screw it up (10 × M3).<\/li>\n<li>Strip C onto its 4 bosses.<\/li>\n<li>I/O board onto the rear-wall bosses; plug its cable into the main board.<\/li>\n<li>Battery (on a strap on the back panel) and speaker (glued to the back panel) on their JST leads; plug in.<\/li>\n<li>Back panel on: <strong>8 × M3 from underneath<\/strong> into the shell's bottom rim. Feet go on the panel.<\/li>\n<li>Flip it over. Press the key tops on, push the knobs on, fit the stick cap.<\/li>\n<\/ol>\n<h3>Service (F10)<\/h3>\n<ul>\n<li><strong>Back panel off (8 screws):<\/strong> battery, speaker, BOOTSEL (the Pico faces down on the board) and every solder joint on the board's underside are reachable.<\/li>\n<li><strong>Board out:<\/strong> pull the knobs and the stick cap, undo 10 screws, lower the board.<\/li>\n<li><strong>One key:<\/strong> pull its top from above. A switch: strip C out from below (4 screws).<\/li>\n<\/ul>\n<h3>The print and the \"unibody\" question (Vector Space printers)<\/h3>\n<ul>\n<li><strong>The shell must print face down<\/strong> (best surface, legends by one filament swap; and ONE SHEET's whole idea is the face-down first layer).<\/li>\n<li><strong>One piece needs a bed ≥ ≈ 285 mm<\/strong> (ONE SHEET 276 × 140; HUSH 290 × 144):<\/li>\n<li>Prusa MK3 / MK4 / Core One: ≈ 250 × 210 → <strong>no<\/strong>, even diagonally [CALC].<\/li>\n<li>TAZ 6: 280 × 280 (UNVERIFIED at Vector Space) → ONE SHEET fits with ≈ 2 mm a side and no brim: <strong>marginal<\/strong>. HUSH: no.<\/li>\n<li>Voron 2.4 / Trident: comes in 250 / 300 / 350 sizes; which one Vector Space has is UNVERIFIED. 350 fits both.<\/li>\n<li>Gigabot: ≈ 590 class (UNVERIFIED) fits both.<\/li>\n<li><strong>Recommendation:<\/strong><\/li>\n<li><strong>ONE SHEET:<\/strong> print in one piece on the Voron if it's the 350 (ask Vector Space); otherwise the split below.<\/li>\n<li><strong>HUSH:<\/strong> split. The felt covers the seam completely, so there's no reason to queue for a big printer.<\/li>\n<li><strong>Split that doesn't read as a seam:<\/strong> at <strong>x = 122.5<\/strong>, the one break line that runs straight through the whole panel. The face's sunk break groove (0.6 × 1.2 mm) is centred on the joint, so the joint sits at the bottom of a groove you'd see anyway. Inside: a 10 mm printed lap along the joint with 3 × M3 from inside; the back panel spans the joint and stiffens it. Parts: left 122.5 × 140, right 153.5 × 140 → both fit a 250 × 210 bed ✓. On the walls the joint shows only on the front wall (a 3 mm-tall line under key E-F, in the shadow of the key fronts) and the rear wall.<\/li>\n<\/ul>\n<h2>6. Shared interaction details (unchanged unless stated)<\/h2>\n<ul>\n<li>Status light: one bicolour LED at (262, 68), states per <code>jobs.md<\/code>.<\/li>\n<li>Stick gate: Delrin, fore-aft slot, stem + 0.3 mm, full throw (up and down).<\/li>\n<li>VEL toggle: ON-OFF-ON, LOUD / BOTH / FILT, read through a spare CD4067 channel [ENG]; three-word scale.<\/li>\n<li>RANGE: engraved 6-position scale (LO, 32', 16', 8', 4', 2') [ENG].<\/li>\n<li>Keys: short tops (S1) everywhere. Piano-length tops = +$29.85 stabilisers, variant only.<\/li>\n<\/ul>\n<h2>7. Rule R4 (still binding)<\/h2>\n<ul>\n<li>Nothing stands proud of the panel among the knobs (no dividers, walls, ridges, raised plates); separations are flush.<\/li>\n<li>Nothing rises between keys and controls; white keys within ≈ 3 mm of the panel.<\/li>\n<li>Side and rear rims allowed only ≥ 12 mm from any knob edge (this is why FOLD is 286, not 276).<\/li>\n<\/ul>\n<h2>8. Eng questions raised by rev 6<\/h2>\n<ul>\n<li><strong>E-L9<\/strong> main board ≈ 268 × 85 (flat concepts): does the voice fit? FOLD's two-board split: see FOLD.<\/li>\n<li><strong>E-L1<\/strong> closed (stick and MOD on the main board).<\/li>\n<li>Speaker (240, 113): ≥ 30 mm from the ladder/expos at layout?<\/li>\n<li>Still open from before: E-L8 (18T push-on knobs on the pots, WAVE shafts), #2765 cap ≤ 12 mm in hand.<\/li>\n<\/ul>", "lead": "Status: rev 6, 2026-11-12 (concept round 4). Active: HUSH, FOLD, ONE SHEET. TYPE CASE and HYMNAL are paused; their own files keep the rev 5 numbers (298 × 180, common layout with the stick column), and nothing here applies to them.", "jump": ["1. The logical split: a PLAY row and the VOICE", "2. Plan and coordinates (ONE SHEET frame: 276 wide)", "3. Boards (eng question E-L9)", "4. Heights and section", "5. Unibody: how the flat ones are built (HUSH, ONE SHEET)", "6. Shared interaction details (unchanged unless stated)", "7. Rule R4 (still binding)", "8. Eng questions raised by rev 6"], "code": "D-003"}, "D-011": {"kind": "doc", "sub": "doc", "title": "FOLD · how it works", "stage": "Lock", "status": "locked in v1.1", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "versions/v1.1/fold/how-it-works.md", "html": "<h1>FOLD: how it works (systems)<\/h1>\n<p>Kind: <strong>a hinge<\/strong> (two parts that close on each other). Pole: designed for use. Body: <strong>self-protecting<\/strong> (closed it's a clamshell). <strong>Rev 5.1, 2026-11-12 (FOLD round 5).<\/strong> Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> (rev 6.1) and <code>../../jobs.md<\/code>.<\/p>\n<blockquote>\n<p><strong>Rev 5.7 (2026-11-13): standing angle 105° → 120°.<\/strong> Owner: \"a bit less steep so the front face catches more light\". Supersedes rev 5.5's angle and stay numbers; the mechanism is unchanged.\n- <strong>Angle: 120° from the base<\/strong>, so the panel faces 30° up.\n  - <strong>Light:<\/strong> the panel catches ≈ 1.9× the overhead light it got at 105° (cos 60° vs cos 75°).\n  - <strong>Legends:<\/strong> a seated player looks down at ≈ 30–40°, so 120° puts the panel close to square-on to the eye.\n  - <strong>Reach:<\/strong> the back row moves from y 126 / z 107 to y 147 / z 99, ≈ 79 mm behind the PLAY row: still a short reach.\n  - <strong>Why not 125°:<\/strong> it adds only 0.3× more light, but moves the back row 6 mm further away and brings more lamp glare on the face.\n- <strong>Stays, re-done<\/strong> [CALC]: same pivot (d 30, lid back edge).\n  - <strong>Length 44.4 mm<\/strong> (stows at d 30–74.4); swing 120° to the hard stop; 60° to the table.\n  - <strong>Rubber tip at y 167<\/strong>, 59 mm behind the base (FOLD-113: 188).\n- <strong>Tipping:<\/strong>\n  - <strong>Push<\/strong> (normal to the panel, at a back-row knob tip): <strong>≈ 6.8 N to tip (FOLD-113: 6.0 N), ≥ 5 ✓.<\/strong> At 120° the push runs more downward, which helps.\n  - <strong>Backward:<\/strong> the combined centre of gravity (y ≈ 97) sits 70 mm in front of the stay tips, so it can't fall back.\n  - <strong>Forward:<\/strong> the lid's own centre of gravity is behind the hinge axis, so it rests on the stays.\n  - Weights are still ESTIMATE (base 0.40, lid 0.35–0.40 kg).\n- <strong>Clearance:<\/strong> V1's knob tips sit ≈ 24 mm above the base's rear rim.<\/p>\n<p><strong>Rev 5.6 (pre-build, 2026-11-13). Supersedes the I/O, AFTERTOUCH and digital-placement text below.<\/strong>\n- <strong>1. I/O vs the stay groove.<\/strong>\n  - <strong>Moving the jacks to the lid's left end doesn't fix it:<\/strong> there's a stay in <em>both<\/em> end faces, at the same d 30–82.4, by design. Raising the jacks above the groove doesn't work either: under the lid plate there's only 10.6 mm (z 2–12.6), and the groove takes z ≈ 1–10.\n  - <strong>Fix: split the I/O by where its circuit lives.<\/strong>\n    - <strong>(a) The audio and CV jacks + power switch move to the lid's far wall<\/strong> (phones, line out, EXT in, filter CV in, pitch CV out, gate out), x ≈ 60–230, clear of the corner magnets.\n      - Flat, that's the instrument's rear: cables leave away from the keys (F8 ✓). Standing, they leave the top edge and hang behind. Closed, they're on the bar's front face.\n      - The I/O board stands inside the far wall at d ≈ 92–104. The FX row's pot pins must face the hinge, which leaves ≈ 2 mm clear.\n    - <strong>(b) Base right end face, straight off the Daisy Seed: MIDI IN (TRS) at y 70, MIDI OUT (TRS) at y 80, USB-C at y 90–99<\/strong> (10 mm pitch).\n      - <strong>MIDI IN was missing; it's now added.<\/strong>\n      - Jack bodies occupy x ≈ 272–286, clear of TAP (261, 68; footprint to x 267).\n      - Low-profile THT jacks on the base board (centre z ≈ 9, under the 13.1 plate underside). USB-C sits on the Seed in its floor cutout (z ≈ 4–7).\n      - All three sit behind the key zone (y ≥ 52) in the 15.6 wall.\n  - <strong>The stays stay symmetric.<\/strong> Neither end face of the lid carries I/O.\n- <strong>2. AFTERTOUCH re-placed in FOLD<\/strong> (flat concepts keep the visual designer's spot):\n  - The visual designer's (176.75, d 26) passes on its own. But its mirror slot (109.25, d 26), where the new PARA toggle belongs, lands 2.06 mm from CUTOFF when closed (rule ≥ 3), so the pair can't mirror there.\n  - <strong>So the pair moves outward: PARA (93.9, d 26)<\/strong>, at the end of OSCILLATORS beside FREQ 2, <strong>and AFTERTOUCH (192.1, d 26)<\/strong>, at the head of CONTOURS beside F ATTACK.\n  - Mirrored, 3.0 from the breaks, 3.5 from the neighbouring knobs. Closed, they land on the landing strip (plan gaps 3.56 to GLIDE / ECHO REPEATS).\n  - Checker 0 violations for both variants.\n  - <strong>Visual:<\/strong> move FOLD's AFTERTOUCH and add PARA; legends right-aligned to their toggles (legend check).\n- <strong>3. Daisy Seed: the base<\/strong>, confirming eng (<code>daisy-switch-notes.md<\/code> §7: \"put the Seed and wet path in the base\").\n  - <strong>Position:<\/strong> the base rear strip at x ≈ 200–272, y 80 to D − 4. That's ≥ 30 mm from the ladder (x ≤ 170) and from the Hall sensors (y ≤ 51), as §5 requires.\n  - <strong>USB-C<\/strong> faces the right end face.\n  - <strong>Height:<\/strong> under the base plate there's 7 mm above the board, so the Seed sits <strong>in a base-board cutout on the floor<\/strong>, with 11.1 mm from floor to plate. Seated height is UNVERIFIED (8–8.4 + socket); <strong>the spike must measure it.<\/strong> If it's &gt; 11, there's no FOLD half that takes it without +mm.\n  - <strong>This moves all digital to the base.<\/strong> The ribbon list (rev 5.1) must be redone by eng from <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a>: pitch/CV DAC outputs cross to the lid; MIDI/USB no longer do.\n- <strong>4. PARA toggle:<\/strong> as item 2 (FOLD) and common rev 7.3 (flat concepts).<\/p>\n<p><strong>Rev 5.5 (2026-11-13): standing lid. Owner: \"some sort of method for the top case to stand up … should blend into the case\"; \"It is not a requirement that you can change the angle\".<\/strong>\n- <strong>One standing angle: the lid opens to 105°, leaning 15° back from vertical.<\/strong> The lid also keeps flat (180°) and closed.\n- <strong>Why 105° and not 90°:<\/strong>\n  - At 90° the lid's weight sits right over the hinge axis, so a knock tips it either way.\n  - At 105° its weight leans back onto the stop, so it holds itself up with no detent or friction hinge.\n  - The panel tilts toward a seated eye line.\n  - Reach is fine: the back row sits ≈ 106 mm up (FOLD-113: 127), about 98 mm from the PLAY row.\n- <strong>The tip-over finding [CALC; weights ESTIMATE 0.40 kg base, 0.35–0.40 kg lid]:<\/strong> a hinge stop alone isn't enough.\n  - Upright, the lid's weight is over the base's rear edge, so a <strong>≈ 1.5–1.8 N push<\/strong> on a back-row knob would tip the whole instrument backwards.\n  - A stop must carry the push <em>to the table<\/em>, not just lock the hinge.\n- <strong>Mechanism: two brass lid-stays set into the lid's end faces<\/strong> (writing-box stays, matching the brass back screws).\n  - <strong>Part:<\/strong> each stay is a 3 × 8 mm brass flat bar, <strong>52.4 mm long<\/strong>, pivoting on a pin at <strong>d 30 from the hinge edge, at the lid back's edge<\/strong>.\n  - <strong>Stowed:<\/strong> it lies flush in a 3.5 mm groove in the end face, running toward the far edge (d 30–82.4). The end wall there is ≥ 8 mm thick locally; the board starts at x 12.\n  - <strong>Deployed:<\/strong> it swings out 140° to a <strong>hard stop in its pivot boss<\/strong> and stands at 65° to the table. Its <strong>rubber tip<\/strong> lands at y 162 (FOLD-113: 183), 54 mm behind the base.\n  - Lid + stay + table form a triangle. A knob push compresses the stays into the table.\n  - <strong>Tip threshold rises to ≈ 5 N.<\/strong> Turning a knob pushes ≈ 1–3 N.\n  - <strong>Stall-free:<\/strong> the lid's weight keeps it on the stays.\n  - The hinge stays a plain pin; the knuckles are unchanged.\n- <strong>Flows:<\/strong>\n  - <strong>Stand:<\/strong> open past 120°, flip both stays out, lower the lid onto them.\n  - <strong>Flat:<\/strong> lift the lid, fold the stays into the end faces, lower it flat; it works as before, with nothing proud.\n  - <strong>Closed:<\/strong> the stays are flush. They show only as brass lines on the ends.\n- <strong>Clearances:<\/strong> standing, V1's knob tips sit ≈ 15 mm above the base's rear rim, and the PLAY row is 40 mm in front of the axis.\n- <strong>J15/J3:<\/strong> adds a standing play state.\n- <strong>Eng/maker:<\/strong> confirm the weights and the pivot boss strength in PETG (or a brass insert); choose the rubber tip.<\/p>\n<p><strong>Rev 5.4 / DRIFT (2026-11-13). Supersedes 7.1's PLAY-right and back-row text.<\/strong> Owner: \"I like the idea of drift, but I'd want it to be controllable\". DRIFT is a firmware random pitch wander; fully left = rock-steady.\n- <strong>Back row = the chain in one line<\/strong>, mirrored about the centre:\n  - <strong>DRIFT 79.5<\/strong> (source, under the FREQ column)\n  - ECHO TYPE 108.5 · ECHO TIME 128.5\n  - REVERB DECAY 157.5 · REVERB TYPE 177.5\n  - <strong>VOLUME 206.5<\/strong> (out, under the loudness column)\n  - Breaks at 94 / 143 / 192.\n- <strong>PLAY right:<\/strong> ECHO REPEATS 199 · ECHO MIX 219 · REVERB MIX 239 · <strong>TAP 261<\/strong>. TAP is played in rhythm, and it mirrors the bend stick.\n- <strong>Why:<\/strong> one added knob makes the count odd, so a lone DRIFT can't be mirrored. <strong>DRIFT ↔ VOLUME<\/strong> pairs source with output; TAP moves to the PLAY row to keep that row at 4 + 3 + 4. The checkers pass with 0 violations and mirror 0.00 in every row.\n- <strong>Cost:<\/strong> VOLUME sits on the back row (≈ 78 mm behind the PLAY row), and TAP is away from TIME. Sizes are unchanged (FOLD-105 108, FOLD-113 129). The back row is the lid's third row, landing over the whites. DRIFT is firmware on the Pico (DAC offsets); its pot needs one lid mux channel. <strong>Eng.<\/strong><\/p>\n<p><strong>Rev 5.3 (round 5 final, 2026-11-13): full FX. SUPERSEDES 5.2 AND THE DIMENSIONS BELOW WHERE THEY DIFFER<\/strong>\n- <strong>Base PLAY right:<\/strong> ECHO REPEATS 199 · ECHO MIX 219 · REVERB MIX 239 · <strong>VOLUME 261 (back on the face; the lid wheel and wall toggle are dropped)<\/strong>.\n- <strong>Lid FX row = a third lid row 23 behind V2<\/strong>, landing over the whites when closed (4.0 clear): ECHO TYPE 95.5 · ECHO TIME 115.5 | TAP 143 | REVERB DECAY 170.5 · REVERB TYPE 190.5, own breaks 130 / 156.\n- Checker <code>fold_r5_check.py<\/code>: 0 violations, mirror 0.00 in all rows.\n- <strong>Why a third lid row and not elsewhere:<\/strong>\n  - the band can't hold controls (the PLAY row parks under it);\n  - the base's landing strip is V1's.\n  - Lid rows can only land between base y 23.45 (far-rim margin) and 54.6, so V2 + FX at 23 pitch is the only fit.\n- <strong>FOLD-105 → halves 286 × 108<\/strong> (open 216, closed ≈ 50.1):\n  - rows d 14.45 / 60.85 / 83.85;\n  - <strong>PLAY → V1 54.45 ✓<\/strong>, V1 → V2 46.4, V2 → FX 23;\n  - band under the plate 32.4: cells (x 15–103, 183–271) + speaker centred (x 113–173);\n  - lid board 262 × 102 − 4,750 − 1,800 = 20,174 ≥ 19,500 ✓ (+674).\n- <strong>FOLD-113 → halves 286 × 129<\/strong> (open 258):\n  - rows d 14.45 / 82.45 / 105.45;\n  - <strong>PLAY → V1 75.45 ✗ (breaks the director's ≤ 60 blocker).<\/strong> The 52 mm bay forces V2 to 82.45, the FX row adds 23, and the far rim adds 23.45, so D ≥ 129.\n  - <strong>Gap, 22 Wh and full FX can't all hold in FOLD.<\/strong> Recommend FOLD-105 as <em>the<\/em> FOLD. Show FOLD-113 only so the owner can see why.\n- <strong>FX module:<\/strong> eng says it \"lives with the Pico (base)\", but in FOLD the Pico is on the lid board. <strong>Eng to resolve:<\/strong>\n  - (a) shield in the lid: +1,800 mm², so FOLD-105 → D ≈ 113 (gap 59.45, still ✓);\n  - (b) shield in the base, with I2S crossing (about 5 fast digital lines on the ribbon's digital edge);\n  - (c) Pico + shield both in the base.\n  - <strong>Dimensions above assume the shield in the base, (b)/(c).<\/strong>\n- <strong>Base mux:<\/strong> keys + stick + MOD + GLIDE + CUTOFF + TUNE = 30, + REPEATS, ECHO MIX, REVERB MIX = <strong>33 &gt; 32<\/strong>. So a 3rd CD4067 in the base (≈ $1), or read the 3 on the lid mux via the ribbon spares. <strong>Eng.<\/strong>\n- <strong>Ribbon:<\/strong> VOLUME lines return to pins 31–34 as in rev 5.1, plus the FX send/return (eng: 2 guarded analog lines) on pins 17–19.\n- <strong>Key edge:<\/strong> unchanged (FOLD = option B; A possible).<\/p>\n<p><strong>Rev 5.2 (2026-11-13): echo + reverb. Supersedes the FX and VOLUME text below.<\/strong>\n- <strong>Owner:<\/strong> \"I want echo and reverb\", so plan for 4–5 controls.\n- <strong>The PLAY row's right section is now the FX group:<\/strong> ECHO TIME 199, ECHO REPEATS 219, REVERB 239, FX MIX 261. The slots are unchanged and the mirror still holds (checker relabelled, 0 violations).\n- <strong>VOLUME leaves the face.<\/strong> It becomes a <strong>thumbwheel in the lid's right wall<\/strong> beside the phones jack, at d ≈ 10–20 (open y ≈ 120, by the right hand), z ≈ 20–30 open.\n  - VOLUME then never crosses the ribbon.\n  - This is the trade that gives the FX 4 face slots and keeps 4 + 3 + 4. Part UNVERIFIED.\n- <strong>The FX MODE toggle (ECHO / BOTH / REVERB, if the chip needs one)<\/strong> goes on the lid's right wall with the jacks.\n- <strong>5 knobs:<\/strong> see the trades in <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> rev 7. FOLD has no rear band, so the third-row option isn't available here.\n- <strong>The echo/reverb circuit goes on the base board, not the lid.<\/strong>\n  - Eng's <code>effects.md<\/code> assumed the lid, which would add ≈ 6–8 mm of depth. The base has room (≈ 31–36 % fill), and TIME stays local, which answers eng's pin-6 worry.\n  - Proposal: PT2399 + reverb at x ≈ 200–272, y ≥ 80 (≥ 30 mm from the Hall strip and from the ladder at x ≤ 170). The muxes/LDO move to x ≈ 15–60. Eng to confirm the select routing.\n- <strong>Ribbon:<\/strong>\n  - pin 31 = VCA out → FX (base);\n  - pin 33 = FX out → VOLUME wheel (lid);\n  - pin 34 GND;\n  - pins 17–19 = MODE control lines from the wall toggle.\n- <strong>Key edge:<\/strong> FOLD already has keys 1.9 above the base plate, behind a 4 mm rim flush with the plate. That reads as option B, a low lip.\n  - Option A for FOLD: keys up 0.6 (to 18.1, 2.5 proud), with a skirted front over a 2.4 wall at z ≈ 11 (as ONE SHEET A).\n  - <strong>Default: B.<\/strong> It's the base's R3 meeting edge, and it protects the keys when closed.<\/p>\n<\/blockquote>\n<p><strong>Why rev 5 / 5.1:<\/strong>\n- <strong>Owner:<\/strong>\n  - On the battery and depth: \"Show me both\". So FOLD comes in <strong>two variants<\/strong>, FOLD-105 (slim battery) and FOLD-113 (big battery).\n  - \"there's still something off about the controls layout that doesn't feel balanced yet\". So <strong>balance is now an explicit design goal<\/strong>, with its logic stated below.\n  - He wants a built-in delay/echo (eng is scoping it, likely 3 controls). So <strong>an FX group has a fixed, balanced home now<\/strong>, so it doesn't re-break the layout later.\n- <strong>Director (round-4 FOLD fixes, <a href=\"#i-R-002\"><code>../../scores.md<\/code><\/a>):<\/strong>\n  - the mid-deck gap is a blocker (≤ ≈ 60 between rows when open);\n  - CUTOFF and EMPHASIS side by side;\n  - section names black;\n  - the signal map only if a strip remains.\n- <strong>Eng (<code>/home/claude/model-d/eng/fold-answers.md<\/code>):<\/strong>\n  - the ladder moves to the base: EMPHASIS beside CUTOFF, the lid needs ≈ 2,000 mm² less board, and the mixer bus crosses on the far, guarded edge of the ribbon;\n  - <strong>recount:<\/strong> rev 4.2's lid board was ≈ 20,260 mm², under the 21,500 minimum. Fixed below.<\/p>\n<p><strong>Settled and kept:<\/strong>\n- the walnut + white Proof look;\n- block and pickguard, screws from behind;\n- the PLAY (base) / VOICE (lid) split;\n- heights, so closed is still ≈ 50.1;\n- the I/O on the lid's right wall;\n- the magnets.<\/p>\n<p><strong>What rev 5.1 changes on purpose:<\/strong> FOLD now has <strong>its own x layout<\/strong> (no longer the common x + 5), because balance needs it. The common layout still governs HUSH and ONE SHEET.<\/p>\n<hr />\n<h2>1. Balance: the logic, stated<\/h2>\n<p>What felt off in rev 4.x, read structurally:\n1. <strong>Ragged rows.<\/strong>\n   - The lid rows had holes in different places: V1 was empty at x 119.5 / 178 / 258, and V2 at 23.5 (TUNE had no partner).\n   - V1 also ended 33 mm short on the right, while V2 started 20 mm late on the left.\n   - So the lid's mass leaned diagonally.\n2. <strong>Breaks that didn't line up across the hinge.<\/strong> The PLAY row broke at 127.5 / 233 and the VOICE at 127.5 / 186, so the sections didn't stack.\n3. <strong>CUTOFF 2 mm off centre, in a row whose groups had unequal masses<\/strong> (6 | 6 | 2 items). The hero knob sat in the middle of nothing in particular.\n4. <strong>Uneven gaps:<\/strong> PLAY → VOICE 119 mm, then rows 23 apart.<\/p>\n<p><strong>The rules rev 5.1 follows:<\/strong>\n- <strong>B1. Mirror across the width.<\/strong> Every row is mirror-symmetric about the instrument's centreline, <strong>x 143<\/strong>: <em>slot<\/em> positions mirror exactly (the checker prints 0.00 mm worst offset for all three rows). <em>Contents<\/em> follow signal flow left to right, so the symmetry is in mass, not meaning.\n- <strong>B2. One set of break lines for both halves: x 101.5 and 184.5<\/strong> (symmetric about 143). Open, each base section sits directly under its lid section, and the sections read as three columns down the whole deck:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Left (x 16–101.5)<\/th>\n<th>Centre (101.5–184.5)<\/th>\n<th>Right (184.5–270)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Column\">Lid (VOICE)<\/td>\n<td data-label=\"Left (x 16–101.5)\"><strong>OSCILLATORS<\/strong><\/td>\n<td data-label=\"Centre (101.5–184.5)\"><strong>MIXER<\/strong> (+ the routing switches at its two edges)<\/td>\n<td data-label=\"Right (184.5–270)\"><strong>CONTOURS<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Column\">Base (PLAY)<\/td>\n<td data-label=\"Left (x 16–101.5)\"><strong>PITCH<\/strong>: bend, mod, tune, glide<\/td>\n<td data-label=\"Centre (101.5–184.5)\"><strong>FILTER<\/strong>: CUTOFF, EMPHASIS, CONTOUR AMT<\/td>\n<td data-label=\"Right (184.5–270)\"><strong>ECHO + OUT<\/strong>: time, repeats, mix, volume<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each column is a stage: source → shape → output. The centre column is the filter, fed by the mixer straight above it (the mixer bus → ladder is also the shortest wire).\n- <strong>B3. The hero on the axis.<\/strong> EMPHASIS sits exactly on x 143, with CUTOFF and CONTOUR AMT at ± 24. The two lights (not-in-control, status) flank EMPHASIS at ± 12, behind the row. <strong>CUTOFF is the big red knob at the left of the filter pair, where the right hand lands first from the stick<\/strong> (reach 94, was 120).\n- <strong>B4. No holes.<\/strong> Every lid column holds two controls (front and back), so both VOICE rows have <strong>13 slots at identical x<\/strong>. The base row has 11 knobs + the stick.\n- <strong>B5. One rhythm of rows.<\/strong> Open, the rows step back at <strong>one pitch<\/strong>:\n  - <strong>FOLD-105:<\/strong> PLAY → V1 → V2 = <strong>52.45 / 52.45<\/strong>.\n  - <strong>FOLD-113:<\/strong> <strong>60.45 / 68.0<\/strong>. This is deliberately weighted: the big cells set the second step, and the larger band is where the battery and the grille live.\n- <strong>B6. Empty areas fall in bands, full width, each with a job.<\/strong> No corner voids, nothing lopsided:\n  1. the <strong>landing strip<\/strong> (base, behind the PLAY row): V1 parks there when closed;\n  2. the <strong>band<\/strong> (lid, between V1 and V2): the battery under it, with <strong>the speaker grille centred on x 143<\/strong>;\n  3. the <strong>far strip<\/strong>: the name, centred.<\/p>\n<p>Open, the deck reads in alternating layers, controls / band / controls / band, symmetric about the centreline.\n- <strong>B7. Mass between the halves.<\/strong> The base carries the keys (full width, the heaviest mass) plus one full row. The lid carries two full rows. The fold pairs them as interlocking teeth, not as mirror images: mirroring about the seam is impossible by construction, because a lid control at the mirror position of a base control lands right on it when closed. So <strong>the halves balance by rhythm (B5) and by shared columns (B2), not by reflection.<\/strong><\/p>\n<p><strong>What balance cost:<\/strong>\n- <strong>TUNE moves to the base<\/strong> (PITCH group, beside bend and glide, as in the Model D's controllers).\n- <strong>MOD MIX moves to the lid<\/strong> (centre column, beside the mixer).\n- The <strong>four set-before-playing switches leave the base<\/strong> for the lid's switch slots: OSC MOD, FILTER MOD, KBD CTRL, VEL.<\/p>\n<p>The base row becomes purely <strong>what the hands do during a note<\/strong>, and the echo controls join it, because throwing the echo is played.<\/p>\n<p><strong>What balance gained, functionally:<\/strong>\n- reach stick → CUTOFF 94 (was 120);\n- osc 3 no longer crosses the ribbon (MOD MIX and OSC MOD are now on the lid with the oscillators), so the worst aggressor is off the hinge;\n- the ribbon core shrinks from 37 to 21 signal lines (§4).<\/p>\n<p><strong>Random draw<\/strong> (real RNG): \"Change instrument roles\" + surveying.\n- <em>Roles:<\/em> the filler strip behind the PLAY row becomes the landing for V1, and the switches swap halves with the echo.\n- <em>Surveying:<\/em> every row is reported as a station with its open position and closed landing (the survey tables). And the centreline x 143 is the datum every row is set out from, which is where B1 came from.<\/p>\n<hr />\n<h2>2. The move that closes the mid-deck gap<\/h2>\n<ul>\n<li><strong>The geometry.<\/strong> Closed, a lid control at distance d from the hinge lands at base y = D − d.<\/li>\n<li>In rev 4.2 every lid row had to land <em>in front of<\/em> the PLAY row, so the gap was ≈ 2D − 115. Every mm of depth counted twice: 119 mm at D 116.<\/li>\n<li><strong>Rev 5: V1 lands <em>behind<\/em> the PLAY row,<\/strong> on the base's landing strip, the plate the extra depth created.<\/li>\n<li>So V1 sits at <strong>d 14.45<\/strong>: knob edges 7 mm from the seam (the R2 break margin, since the seam <em>is<\/em> the PLAY|VOICE break).<\/li>\n<li>The gap becomes D + 14.45 − 68.<\/li>\n<li><strong>V2 still lands over the keys.<\/strong><\/li>\n<li><strong>The base's PLAY knobs land under the band between V1 and V2.<\/strong> So the band is forced, and its width is set by the battery.<\/li>\n<\/ul>\n<hr />\n<h2>3. Side by side<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>FOLD-105 (slim battery)<\/strong><\/th>\n<th><strong>FOLD-113 (big battery)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Battery<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">4 × PiShop 952540 (9.5 × 25 × 40, 750 mAh, PCM), 1S4P, <strong>11.1 Wh<\/strong><\/td>\n<td data-label=\"FOLD-113 (big battery)\">2 × 755060-class (≤ 9.5 × 50 × 60, ≈ 3000 mAh), <strong>22.2 Wh<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Runtime at 2.0 / 3.6 W (eng ESTIMATE)<\/td>\n<td data-label=\"FOLD-105 (slim battery)\"><strong>≈ 4.5 h / 2.4 h<\/strong><\/td>\n<td data-label=\"FOLD-113 (big battery)\"><strong>≈ 9.0 h / 4.7 h<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Charge at 1 A [CALC]<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">≈ 3.3 h<\/td>\n<td data-label=\"FOLD-113 (big battery)\">≈ 6.6 h<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Each half<\/strong><\/td>\n<td data-label=\"FOLD-105 (slim battery)\"><strong>286 × 106<\/strong><\/td>\n<td data-label=\"FOLD-113 (big battery)\"><strong>286 × 114<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Closed / open<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">286 × 106 × ≈ 50.1 / 286 × 212<\/td>\n<td data-label=\"FOLD-113 (big battery)\">286 × 114 × ≈ 50.1 / 286 × 228<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>PLAY → V1 (centres)<\/strong><\/td>\n<td data-label=\"FOLD-105 (slim battery)\"><strong>52.45<\/strong> ✓<\/td>\n<td data-label=\"FOLD-113 (big battery)\"><strong>60.45<\/strong> (≈ 60, 0.45 over the literal target)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">V1 → V2 pitch / clear band<\/td>\n<td data-label=\"FOLD-105 (slim battery)\"><strong>52.45 / 37.55<\/strong> (even rhythm)<\/td>\n<td data-label=\"FOLD-113 (big battery)\">68.0 / 53.1 (weighted by the battery)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Landing strip (CUTOFF edge → V1 knob edge)<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">34.6<\/td>\n<td data-label=\"FOLD-113 (big battery)\">42.6<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Far strip (V2 edge → rim)<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">27.65<\/td>\n<td data-label=\"FOLD-113 (big battery)\">20.1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Key front → back row<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">172.9<\/td>\n<td data-label=\"FOLD-113 (big battery)\">196.45<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Lid board [CALC; eng's formula, ladder in base]<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">262 × 100 − 4,750 − 1,800 = <strong>19,650 ≥ 19,500 ✓<\/strong><\/td>\n<td data-label=\"FOLD-113 (big battery)\">262 × 108 − 6,760 − 1,800 = <strong>19,736 ≥ 19,500 ✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Battery cost (eng)<\/td>\n<td data-label=\"FOLD-105 (slim battery)\">$40.75 (+ ≈ $0.50–1.70 fuse/PTCs)<\/td>\n<td data-label=\"FOLD-113 (big battery)\">$40.85<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why 106 and 114, not 105 and 113:<\/strong> eng's formula, D ≥ 6 + (21,300 + A)/262, gives 105.43 and 113.10. Rounded down, the lid board would be short:\n- 112 mm² at 105 (19,388);\n- 26 mm² at 113 (19,474).<\/p>\n<p>That's the rev 4.2 slip again, so I rounded up. The names stay as the owner heard them. The margins are thin and rest on eng's ≈ 2,000 mm² ladder saving (an ESTIMATE).<\/p>\n<p>For comparison: rev 4.2 had PLAY → VOICE 118.65 and open 234; the flat concepts have PLAY → V1 32.<\/p>\n<p><strong>Layout check: <code>../_mock-src/fold_r5_check.py<\/code>, 0 violations for both variants.<\/strong>\n- <strong>Same rules as <code>layout_r4_check.py<\/code>:<\/strong> pitch 20, 24 within CUTOFF/EMPHASIS/CONTOUR AMT, gaps ≥ 1.5, knobs ≥ 7 and toggles ≥ 3 from breaks.\n- <strong>Added:<\/strong>\n  - the seam as the horizontal break (≥ 7);\n  - base edges ≥ 10, lid rims ≥ 12 (they rise);\n  - knuckles ≥ 5;\n  - the far rim;\n  - <strong>closed landing:<\/strong> every lid control ≥ 3 in plan from every base control, and ≥ 2.0 above what it lands on;\n  - <strong>mirror symmetry<\/strong>: 0.00 mm worst offset in all rows.<\/p>\n<hr />\n<h2>4. Coordinates (both variants; FOLD x, 286 wide)<\/h2>\n<h3>Base PLAY row, y 68: what the hands do during a note<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>Items (x)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Section\"><strong>PITCH<\/strong> (x 16–101.5)<\/td>\n<td data-label=\"Items (x)\">BEND stick 25 · MOD 47 · <strong>TUNE 67<\/strong> · GLIDE 87<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Section\"><em>break 101.5<\/em><\/td>\n<td data-label=\"Items (x)\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Section\"><strong>FILTER<\/strong> (101.5–184.5)<\/td>\n<td data-label=\"Items (x)\"><strong>CUTOFF 119<\/strong> (red 1083) · <strong>EMPHASIS 143<\/strong> (axis) · CONTOUR AMT 167 · lights: not-in-control (131, 81), status (155, 81)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Section\"><em>break 184.5<\/em><\/td>\n<td data-label=\"Items (x)\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Section\"><strong>FX<\/strong> (184.5–270)<\/td>\n<td data-label=\"Items (x)\"><strong>ECHO TIME 199 · ECHO REPEATS 219 · REVERB 239 · FX MIX 261<\/strong> (rev 5.2: VOLUME is now a wheel in the lid's right wall)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Mirror pairs:<\/strong> 25 ↔ 261, 47 ↔ 239, 67 ↔ 219, 87 ↔ 199, 119 ↔ 167, 131 ↔ 155.<\/li>\n<li><strong>Pitches:<\/strong><\/li>\n<li>22 between the stick and MOD, mirrored by MIX → VOLUME;<\/li>\n<li>20 elsewhere;<\/li>\n<li>24 in the filter trio;<\/li>\n<li>32 across each break (knob edges 7 from the break).<\/li>\n<\/ul>\n<p><strong>The FX group:<\/strong>\n- <strong>Three slots now.<\/strong> Until eng confirms, a printed plate legend can mark them as reserved, or they can be fitted blank.\n- <strong>If eng lands on 2 controls<\/strong>, VOLUME moves to 239 and the 261 slot is left blank. Never reflow the row.\n- <strong>If eng wants a 4th<\/strong> (for example a delay/echo character switch), there's no free legal slot: every row is full and symmetric. The cleanest trade would be to fold the echo's MIX into a push-pull on VOLUME, or to drop the VEL toggle to a menu. That's an owner/eng decision, stated now so it doesn't surprise anyone later.\n- Signal flow is VCA → echo → VOLUME, so the knob order follows it.<\/p>\n<h3>Lid VOICE: two rows, 13 slots each, identical x<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>x<\/th>\n<th>23.5<\/th>\n<th>43.5<\/th>\n<th>63.5<\/th>\n<th>83.5<\/th>\n<th><em>101.5<\/em><\/th>\n<th>109.25 (t)<\/th>\n<th>123<\/th>\n<th><strong>143<\/strong><\/th>\n<th>163<\/th>\n<th>176.75 (t)<\/th>\n<th><em>184.5<\/em><\/th>\n<th>202.5<\/th>\n<th>222.5<\/th>\n<th>242.5<\/th>\n<th>262.5 (t)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"x\"><strong>V1 (front)<\/strong><\/td>\n<td data-label=\"23.5\">RANGE 1<\/td>\n<td data-label=\"43.5\">RANGE 2<\/td>\n<td data-label=\"63.5\">RANGE 3<\/td>\n<td data-label=\"83.5\">FREQ 2<\/td>\n<td data-label=\"101.5\"><\/td>\n<td data-label=\"109.25 (t)\">OSC MOD<\/td>\n<td data-label=\"123\">OSC 1<\/td>\n<td data-label=\"143\">OSC 3<\/td>\n<td data-label=\"163\">MOD MIX<\/td>\n<td data-label=\"176.75 (t)\">FILTER MOD<\/td>\n<td data-label=\"184.5\"><\/td>\n<td data-label=\"202.5\">F ATTACK<\/td>\n<td data-label=\"222.5\">F DECAY<\/td>\n<td data-label=\"242.5\">F SUSTAIN<\/td>\n<td data-label=\"262.5 (t)\">KBD CTRL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>V2 (back)<\/strong><\/td>\n<td data-label=\"23.5\">WAVE 1<\/td>\n<td data-label=\"43.5\">WAVE 2<\/td>\n<td data-label=\"63.5\">WAVE 3<\/td>\n<td data-label=\"83.5\">FREQ 3<\/td>\n<td data-label=\"101.5\"><\/td>\n<td data-label=\"109.25 (t)\">OSC 3 CTL<\/td>\n<td data-label=\"123\">OSC 2<\/td>\n<td data-label=\"143\">NOISE/EXT<\/td>\n<td data-label=\"163\">SOURCE (t)<\/td>\n<td data-label=\"176.75 (t)\">VEL<\/td>\n<td data-label=\"184.5\"><\/td>\n<td data-label=\"202.5\">L ATTACK<\/td>\n<td data-label=\"222.5\">L DECAY<\/td>\n<td data-label=\"242.5\">L SUSTAIN<\/td>\n<td data-label=\"262.5 (t)\">DECAY<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Section logic:<\/strong>\n- <strong>OSCILLATORS:<\/strong> one column per VCO (RANGE over WAVE), then FREQ 2 / FREQ 3.\n- <strong>MIXER:<\/strong> 4 levels around the axis, plus MOD MIX (it mixes the modulation sources) next to SOURCE (which picks the noise/ext source).\n  - <strong>Switches sit on the edge of the section they act on.<\/strong> OSC MOD and OSC 3 CTL are on the oscillator side, at 109.25. FILTER MOD and VEL are on the contours/filter side, at 176.75.\n- <strong>CONTOURS:<\/strong>\n  - front row = <strong>how the filter follows the note<\/strong>: F A, F D, F S + KBD CTRL (keyboard tracking);\n  - back row = <strong>how loudness follows the note<\/strong>: L A, L D, L S + DECAY (release).\n- <strong>Toggle slots<\/strong> are minimum-legal: 1.7 mm to the neighbouring knob, 3.15 to the break.<\/p>\n<p><strong>Mass, stated:<\/strong> the lid's right end is a toggle column, while its left end is a knob column (RANGE 1 / WAVE 1), so the right is lighter. <strong>Deliberately weighted:<\/strong> directly in front of it is the base's VOLUME, the heaviest knob in the echo group, and the FOLD-105 grille is now centred, so nothing else pulls right.<\/p>\n<hr />\n<h2>5. FOLD-105 (slim battery)<\/h2>\n<p><strong>Halves:<\/strong>\n- <strong>Base<\/strong> 286 × 106 × 15.6;\n- <strong>lid<\/strong> 286 × 106 × 34.5.<\/p>\n<p><strong>Closed<\/strong> 286 × 106 × ≈ 50.1. <strong>Open<\/strong> 286 × 212.<\/p>\n<p><strong>Base, y from the front edge:<\/strong>\n| y | Zone |\n|---|---|\n| 0–4 | front rim, flush, R 3 |\n| 4.5–34.5 / 36.5–50.5 | whites (17.5) / sharps (19.5) |\n| 52–102 | base plate, face 15.6 |\n| <strong>68<\/strong> | <strong>PLAY row<\/strong> |\n| 78.4–102 | <strong>landing strip<\/strong>: flush. Closed, V1 parks at y 84.1–99.0 |\n| 102–106 | rear rim, flush |<\/p>\n<p><strong>Lid, d from the hinge edge (open y = 106 + d):<\/strong>\n| d | Zone |\n|---|---|\n| 0–7 | seam margin (no wall: R4) |\n| <strong>14.45<\/strong> | <strong>V1<\/strong> (open y 120.45) |\n| 21.9–59.45 | <strong>band<\/strong>, 37.55 clear. Closed, the PLAY row sits under it (CUTOFF spans d 27.6–48.4). Cells and speaker are under it; the <strong>grille is centred on x 143<\/strong> |\n| <strong>66.9<\/strong> | <strong>V2<\/strong> (open y 172.9) |\n| 74.35–102 | far strip, 27.65: <strong>name inlay centred on x 143<\/strong> |\n| 102–106 | far rim (V2 edge → rim inner face 27.65 ≥ 12 ✓) |<\/p>\n<p><strong>Closed survey:<\/strong>\n| Row | Open y | Lands at base y | Over | z clearance | Plan gap |\n|---|---|---|---|---|---|\n| V1 | 120.45 | 91.55 (84.1–99.0) | landing strip | <strong>5.9<\/strong> | 5.7 to CUTOFF's rear edge |\n| V2 | 172.9 | 39.1 (31.65–46.55) | sharps (and whites) | <strong>2.0<\/strong> | 11.05 to CUTOFF's front edge |\n| PLAY | 68 | under band d 38 | lid plate 35 | <strong>5.9<\/strong> (CUTOFF 7.25) | — |<\/p>\n<ul>\n<li><strong>Stick:<\/strong> under the band, as before (cap ≤ 17.4 above the plate; check the #2765 in hand).<\/li>\n<li><strong>TUNE:<\/strong> now in the base, so the old TUNE/stick clash is gone for good.<\/li>\n<\/ul>\n<p><strong>Battery bay, speaker, board: laid out symmetrically<\/strong>\n- Under the band (it has 38.45 under the plate, d 22.45–60.9):\n  - <strong>cells in two pairs:<\/strong> x 15–103 and 183–271, d 28.2–55.2 (each pair 88 × 27);\n  - <strong>speaker<\/strong> (PUI ASE06008MR-LW150-R, 60 × 30 × 10.3) <strong>centred<\/strong>: x 113–173, d 26.7–56.7, open centre (143, 147.7).\n- <strong>Pot footprints<\/strong> (ESTIMATE; eng to confirm from the A-5622 drawing): 8 mm on the pin side, 6 on the other.\n  - V1 pins face the band (they reach d 22.45);\n  - V2 pins face the far rim.\n- <strong>Lid board:<\/strong> one piece with <strong>three windows<\/strong> (cells / speaker / cells). The strip under V1 joins the rest through two <strong>10 mm bridges<\/strong> (x 103–113 and 173–183), which carry V1's 13 controls.\n  - <strong>Eng check:<\/strong> ≈ 40 traces per bridge over 2 layers.\n  - Fallback: a separate V1 strip board on a short jumper.\n- <strong>Height:<\/strong> cells 9.5 in 10.6, so 1.1 swell. Measure one first; if it's &gt; 9.6, use 3 × USE-803048-class (eng §1.4.6).\n- <strong>Holding and wiring:<\/strong>\n  - printed cradles screwed to the lid floor (2 × M2.5 each), with foam pads (no compression);\n  - a star harness, then a 2 A fuse, then <strong>one JST-PH<\/strong> to the bq25185 by the right-wall I/O board;\n  - XH → PH adapter; optional ≈ 1 A PTC per cell.\n- <strong>Access:<\/strong>\n  1. Undo the 6 screws on the lid's back.\n  2. Push the pickguard out.\n  3. Lift it ≈ 20 mm and unplug the PH plug.\n  4. Lift the pickguard out. The cells are in their cradles.\n- <strong>No hatch:<\/strong> the block stays unibody.\n- The speaker is far from the ladder (which is in the base), so the ≥ 55 mm rule is met.<\/p>\n<hr />\n<h2>6. FOLD-113 (big battery)<\/h2>\n<p><strong>Halves:<\/strong>\n- <strong>Base<\/strong> 286 × 114 × 15.6;\n- <strong>lid<\/strong> 286 × 114 × 34.5.<\/p>\n<p><strong>Closed<\/strong> 286 × 114 × ≈ 50.1. <strong>Open<\/strong> 286 × 228.<\/p>\n<p><strong>Base:<\/strong> as FOLD-105 up to the PLAY row, then the plate runs 52–110, the <strong>landing strip<\/strong> 78.4–110 (V1 parks at y 92.1–107.0), and the rear rim 110–114.<\/p>\n<p><strong>Lid (open y = 114 + d):<\/strong>\n| d | Zone |\n|---|---|\n| 0–7 | seam margin |\n| <strong>14.45<\/strong> | <strong>V1<\/strong> (open y 128.45) |\n| 21.9–75.0 | <strong>band<\/strong>, 53.1 clear. Closed, the PLAY row sits under it (CUTOFF spans d 35.6–56.4). Cells and speaker are under it; the grille is centred on x 143 |\n| <strong>82.45<\/strong> | <strong>V2<\/strong> (open y 196.45) |\n| 89.9–110 | far strip, 20.1: name, centred |\n| 110–114 | far rim (20.1 ≥ 12 ✓) |<\/p>\n<p><strong>Why V2 sits at d 82.45 (not 66.85, the knob-rule minimum):<\/strong>\n- Each 50 mm-wide cell needs a 52 mm-deep window clear of pot footprints, d 23.45–75.45. That pushes V2's footprint to 76.45, so V2 sits at 82.45.\n- There's no other home:\n  - the far strip has ≈ 20 under the plate;\n  - the base's rear strip is ≤ 35 deep;\n  - under the keys there's 2.5 mm.\n- <strong>So the big pack costs 8 mm of depth <em>and<\/em> a weighted rhythm (60.45 / 68) with a 53 mm band.<\/strong><\/p>\n<p><strong>Closed survey:<\/strong>\n| Row | Open y | Lands at base y | Over | z clearance | Plan gap |\n|---|---|---|---|---|---|\n| V1 | 128.45 | 99.55 (92.1–107.0) | landing strip | <strong>5.9<\/strong> | 13.7 to CUTOFF's rear edge |\n| V2 | 196.45 | 31.55 (24.1–39.0) | whites, sharp fronts | <strong>4.0 / 2.0<\/strong> | 18.6 |\n| PLAY | 68 | under band d 46 | lid plate 35 | <strong>5.9<\/strong> | — |<\/p>\n<p><strong>Bay, speaker, board (symmetric):<\/strong>\n- <strong>cells<\/strong> one each side: x 15–80 and 206–271, d 23.45–75.45 (each 65 × 52; together eng's 130 × 52);\n- <strong>speaker centred:<\/strong> x 113–173, d 34.45–64.45, open centre (143, 163.45);\n- <strong>lid board:<\/strong> one piece, with windows for cell / speaker / cell and <strong>33 mm bridges<\/strong> at x 80–113 and 173–206 (comfortable).<\/p>\n<p>Holding, harness and access are as FOLD-105.<\/p>\n<hr />\n<h2>7. Shared by both variants<\/h2>\n<h3>What sits where in the base (eng to confirm placement)<\/h3>\n<ul>\n<li><strong>Ladder filter:<\/strong> on the base board, behind the FILTER section, x ≈ 95–170, y 75 to D − 11.<\/li>\n<li>CUTOFF, EMPHASIS and CONTOUR AMT are all local.<\/li>\n<li>No wire of the emphasis loop crosses the hinge.<\/li>\n<li><strong>The rest of the board:<\/strong><\/li>\n<li><strong>2 × CD4067 + LD1117<\/strong> at x ≈ 230–272, next to the ribbon's digital edge, ≥ 30 mm from the ladder;<\/li>\n<li><strong>ribbon header<\/strong> at x 176–227, y D − 9.5 to D − 3.5.<\/li>\n<li><strong>Base board<\/strong> 270 × (D − 8), so 270 × 98 / 270 × 106. Behind the keys it has ≈ 13,800 / 15,900 mm², so the ladder's tight 66–70 % fill becomes <strong>≈ 36 % / 31 %<\/strong> [CALC].<\/li>\n<li><strong>Room for the echo circuit too.<\/strong> Keep any clocked delay chip (PT2399-class) ≥ 30 mm from the ladder and its expo pair.<\/li>\n<li><strong>Base mux channels:<\/strong> the keys, stick, MOD, GLIDE and CUTOFF stay; VEL leaves; TUNE joins if it's read digitally. That's 30 of 32.<\/li>\n<li><strong>The FX pots can't also be muxed<\/strong> (that would make 33). Either they're analog pots on the echo chip, or a third mux is needed. <strong>Eng.<\/strong><\/li>\n<li><strong>Heights (eng):<\/strong><\/li>\n<li>7 mm under the base plate;<\/li>\n<li>electrolytics lie flat;<\/li>\n<li>film caps ≤ 6.5 mm;<\/li>\n<li>nothing on the underside.<\/li>\n<\/ul>\n<h3>Hinge ribbon: 40-way, 1.27 mm (50.8 wide), ≈ 80 mm rolling loop under the TPU flap, crossing at x 176–227<\/h3>\n<p>Moving MOD MIX, OSC MOD, FILTER MOD and KBD CTRL to the lid, next to their sources, <strong>takes osc 3 off the ribbon<\/strong> and leaves <strong>21 signal lines<\/strong>.\n- <strong>Headers:<\/strong>\n  - base: on the landing strip's underside;\n  - lid: along the hinge edge <strong>in front of V1's pots<\/strong>, d 2.5–8.5. V1's pot bodies start at 9.7, so the gap is 1.2 mm (tight).\n- <strong>The IDC must be low-profile<\/strong> (7 mm under the plate). If it isn't, use an IDC without strain relief, or 2 × 20-way. <strong>Eng.<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Pins<\/th>\n<th>Lines<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Pins\">1–4<\/td>\n<td data-label=\"Lines\">+5 V, +5 V, GND, GND (sensor tr>\n<td data-label=\"Pins\">32<\/td>\n<td data-label=\"Lines\">GND<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\">33<\/td>\n<td data-label=\"Lines\">VOLUME wiper → output stage<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\">34<\/td>\n<td data-label=\"Lines\">GND (VOLUME's ground leg)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\">35<\/td>\n<td data-label=\"Lines\">filter out → VCA (≈ 1 V, ≈ 1 k)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\">36–38<\/td>\n<td data-label=\"Lines\">GND × 3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\"><strong>39<\/strong><\/td>\n<td data-label=\"Lines\"><strong>mixer bus → ladder input<\/strong>: the sensitive line (eng's <code>emi<\/code> rules). 31 conductors from S3, ground on both sides<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pins\">40<\/td>\n<td data-label=\"Lines\">GND<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Eng to confirm:<\/strong><\/li>\n<li>this order;<\/li>\n<li>whether TUNE is analog;<\/li>\n<li>the bench test on pin 39 (pass ≤ −70 dB, <code>fold-answers.md<\/code> §2.6).<\/li>\n<li><strong>A 34-way would carry the core.<\/strong> The 40-way keeps the FX reserve and the guard spacing.<\/li>\n<\/ul>\n<h3>Hinge<\/h3>\n<ul>\n<li>Knuckles at the rear corners, <strong>narrowed to x 0–10 and 276–286<\/strong> (were 0–14).<\/li>\n<li>V1 now sits at the hinge edge: RANGE 1's edge (16.05) gets 6.05 (≥ 5).<\/li>\n<li>On the right, KBD CTRL's edge (267.1) gets 8.9.<\/li>\n<li>M4 shoulder bolt, axis at z ≈ 25: the lid lies flat at 180°.<\/li>\n<li><strong>Lugs:<\/strong> ≈ 4.5–5 mm each in 10 mm. <strong>Maker check<\/strong> in PETG; a brass sleeve is the fallback.<\/li>\n<li><strong>Swing [CALC]:<\/strong> V1's nearest point is ≈ 8 mm from the axis and swings over the top. It only comes down at landing (z 21.4, over the landing strip). The base controls are ≥ 27 mm from the axis.<\/li>\n<li><strong>Latch:<\/strong> two 6 mm magnets in the lid's far corners over washers in the base's front corners.<\/li>\n<\/ul>\n<h3>Heights (unchanged)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>z<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Part\">Base block<\/td>\n<td data-label=\"z\">15.6 (floor 2; board top 6.1; pot bodies 7; plate 2.5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Whites / sharps<\/td>\n<td data-label=\"z\">17.5 / 19.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Base knob tops / CUTOFF<\/td>\n<td data-label=\"z\">29.1 / 27.75<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Lid block<\/td>\n<td data-label=\"z\">34.5 (hollow 19.4 + plate 2.5 + pots 7 + board 1.6 + tails 2 + back 2)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Under the lid plate<\/td>\n<td data-label=\"z\">10.6 (cells 9.5, speaker 10.3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>Closed<\/strong><\/td>\n<td data-label=\"z\"><strong>≈ 50.1<\/strong> (lean ≈ 49.2)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Open: lid plate / lid rims<\/td>\n<td data-label=\"z\">15.1 (flush seam, 0.5 below the base plate) / 34.5 (19.4 above, ≥ 12 from every knob edge)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Closed from the back<\/h3>\n<ul>\n<li>There's still <strong>no wall on the lid's hinge edge<\/strong> (R4), so closed there's a <strong>19.4 mm slot<\/strong> between the knuckles (x 10–276).<\/li>\n<li><strong>New:<\/strong> V1's controls sit <strong>7 mm inside it<\/strong> (were ≈ 18). That's the price of the gap fix. Stated for J6.<\/li>\n<\/ul>\n<h3>Unchanged from rev 4 (in force)<\/h3>\n<ul>\n<li><strong>Idea:<\/strong> two halves that protect each other. Each half is a hollowed walnut block with a white pickguard dropped in. Keys and what you play in one half, the voice in the other. It folds like a book laid open flat.<\/li>\n<li><strong>Principles:<\/strong>\n  1. Open flat, never raised.\n  2. <strong>Each half guards the other.<\/strong> Closed, V1 parks behind the PLAY row, V2 sits over the keys, and the PLAY row sits under the band.\n  3. Block and pickguard.\n  4. <strong>The fold line is the logic line.<\/strong> The base holds what the hands do during a note (now including the filter circuit and the echo); the lid holds the voice and the switches you set beforehand.\n  5. One cable crosses, and the hinges sit at the ends.\n  6. <strong>New: one centreline, three columns<\/strong> (B1–B2): the deck is set out from x 143, with the same breaks on both halves.<\/li>\n<li><strong>Build:<\/strong><\/li>\n<li>Blocks are printed trays: plan corners R 12, outer edges R 6, meeting edges R 3, with a 2 mm plate ledge.<\/li>\n<li>Plates are 2.5 mm white, printed face down, legends by one swap.<\/li>\n<li><strong>6 × M3 from behind<\/strong> into standoffs, plus 2 push-out holes. No fastener on the white face.<\/li>\n<li>The I/O board is inside the lid's right wall.<\/li>\n<li>Key tops and knobs go on last.<\/li>\n<li><strong>Assembly (F9):<\/strong>\n  1. Print.\n  2. Press in the inserts.\n  3. Screw the boards to the plates.\n  4. Lid only: fit the cradles, cells and speaker.\n  5. Lay each plate assembly in its block.\n  6. Plug the ribbon, the I/O cable and the battery plug.\n  7. 6 screws from behind.\n  8. Fit the key tops and knobs.\n  9. Pin the hinges.<\/li>\n<li><strong>Service (F10):<\/strong> 6 screws, push out, lift. The battery is as above. A key: pull its top.<\/li>\n<li><strong>Print:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>FOLD-105<\/th>\n<th>FOLD-113<\/th>\n<th>One piece needs<\/th>\n<th>Fallback<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Blocks<\/td>\n<td data-label=\"FOLD-105\">286 × 106 × 15.6 / 34.5<\/td>\n<td data-label=\"FOLD-113\">286 × 114 × 15.6 / 34.5<\/td>\n<td data-label=\"One piece needs\">Voron 350 / Gigabot (UNVERIFIED)<\/td>\n<td data-label=\"Fallback\">lap joint at x 101.5 or 184.5 (now on the break lines)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Plates<\/td>\n<td data-label=\"FOLD-105\">≈ 278 × 98<\/td>\n<td data-label=\"FOLD-113\">≈ 278 × 106<\/td>\n<td data-label=\"One piece needs\">≥ 285<\/td>\n<td data-label=\"Fallback\">split at x 143? <strong>No:<\/strong> that cuts through EMPHASIS/OSC 3/NOISE. Split at <strong>x 184.5<\/strong> (pieces ≤ 180.5 wide: needs a ≥ 185 bed, so Prusa MK4 ✓)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Filament ≈ $8–10 / $9–11 (ESTIMATE).\n- <strong>States:<\/strong>\n  - carry: closed walnut bar;\n  - play: open flat, reading keys → PLAY → landing strip → seam → V1 → band (grille) → V2 → far strip (name);\n  - lap;\n  - shelf on its left end;\n  - service.\n- <strong>Flows:<\/strong>\n  - F1: open → lid flat → power (right wall) → play.\n  - F5: power off → fold → magnets.\n  - F8: cables on the lid's right wall.\n  - F11: hand marks on the centred name inlay.\n- <strong>R4:<\/strong>\n  - keys 1.9 above the plate; rims flush;\n  - flush seam, no hinge-edge wall;\n  - lid rims on the sides and far edge only, ≥ 12 from knobs;\n  - knuckles only at the corners.\n- <strong>Cost (ESTIMATE):<\/strong> enclosure, hardware, 40-way ribbon and speaker ≈ $21–26, plus the battery ($40.75 / $40.85). The echo circuit is eng's to cost.<\/p>\n<hr />\n<h2>8. For the visual designer (structure → look; your calls flagged)<\/h2>\n<ol>\n<li><strong>Draw to the coordinates in §4–6.<\/strong> It's a new x layout: mirror about x 143, breaks at 101.5 / 184.5 on both halves.<\/li>\n<li><strong>Make the three columns legible across the hinge<\/strong> (B2): the same break lines on both plates, and section names black, one swap. The column reading (PITCH under OSCILLATORS, FILTER under MIXER, ECHO + OUT under CONTOURS) is the balance; let the type show it.<\/li>\n<li><strong>The band<\/strong> (lid, between V1 and V2): the grille is centred on x 143. The rest is cream over the cells.\n   - <strong>This is the strip the signal map could use<\/strong> (a strip remains, and it has a job). Or use column ticks tying RANGE to WAVE across the band in FOLD-113, where the rows are 68 apart. Your call.<\/li>\n<li><strong>The landing strip<\/strong> (base): flush. A fine parking line for V1 is optional.<\/li>\n<li><strong>The FX slots<\/strong> (199 / 219 / 239): until eng confirms, draw them as real knobs labelled time / repeats / mix.<\/li>\n<li>Name inlay centred in the far strip. Knuckles are 10 wide. EMPHASIS is a plain black knob on the axis; the two lights flank it.<\/li>\n<\/ol>\n<h2>9. Open questions<\/h2>\n<ul>\n<li><strong>Eng:<\/strong><\/li>\n<li>the echo circuit: which part, base or lid board, analog pots or muxed (a 3rd mux)?<\/li>\n<li>TUNE analog or digital;<\/li>\n<li>the 40-way order;<\/li>\n<li>the lid IDC (1.2 mm in front of V1, height under 7 mm);<\/li>\n<li>the pot footprint (8 / 6 ESTIMATE);<\/li>\n<li>FOLD-105's 10 mm board bridges;<\/li>\n<li>the base placement;<\/li>\n<li>the lid-board margins (+150 / +236 mm²);<\/li>\n<li>the pin 39 bench test.<\/li>\n<li><strong>Maker:<\/strong><\/li>\n<li>the 10 mm knuckle lugs;<\/li>\n<li>measure one 952540 (≤ 9.6);<\/li>\n<li>Vector Space bed sizes.<\/li>\n<li><strong>Owner (via the orchestrator):<\/strong><\/li>\n<li>FOLD-105 vs FOLD-113: ≈ 4.5 h / 2.4 h with an even rhythm, against ≈ 9 h / 4.7 h with +8 mm and a weighted rhythm (53 mm band);<\/li>\n<li>he hasn't seen TUNE in the base or the switches moved to the lid; that follows from his \"balanced\" note;<\/li>\n<li>V1 now shows 7 mm inside the closed back slot;<\/li>\n<li>a 4th echo control would need a trade (§4: a push-pull on VOLUME, or VEL to a menu).<\/li>\n<li><strong>Cross-concept:<\/strong> HUSH and ONE SHEET will also need an FX home. They still use the common layout, so that's a separate pass.<\/li>\n<li><strong>Coverage:<\/strong> <code>coverage.md<\/code> is round 4. Re-walk it when rev 5.1 scores 9+. Expected changes:<\/li>\n<li>J3 ✓ (EMPHASIS beside CUTOFF, reach 94);<\/li>\n<li>J7 ✓ (internal battery);<\/li>\n<li>J6 ◐ (back slot);<\/li>\n<li>J16: likely stronger (one row in the base; 3 aligned columns);<\/li>\n<li>a <strong>new job<\/strong> for the owner's echo request, to add to <code>jobs.md<\/code> once eng scopes it.<\/li>\n<\/ul>", "lead": "Kind: a hinge (two parts that close on each other). Pole: designed for use. Body: self-protecting (closed it's a clamshell). Rev 5.1, 2026-11-12 (FOLD round 5). Read with ../common-how-it-works.md (rev 6.1) and ../../jobs.md.", "jump": ["1. Balance: the logic, stated", "2. The move that closes the mid-deck gap", "3. Side by side", "4. Coordinates (both variants; FOLD x, 286 wide)", "5. FOLD-105 (slim battery)", "6. FOLD-113 (big battery)", "7. Shared by both variants", "8. For the visual designer (structure → look; your calls flagged)", "9. Open questions"], "code": "D-011", "group": "FOLD"}, "D-013": {"kind": "doc", "sub": "doc", "title": "HUSH · how it works", "stage": "Lock", "status": "locked in v1.1", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "versions/v1.1/hush/how-it-works.md", "html": "<h1>HUSH: how it works (systems)<\/h1>\n<p>Kind: <strong>a material<\/strong>. Pole: sauce. <strong>Rev 6, 2026-11-12 (concept round 4).<\/strong> Printed shell + wool felt only (the ply tray is retired). Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> (<strong>rev 6<\/strong>) and <code>../../jobs.md<\/code>.<\/p>\n<blockquote>\n<p><strong>Rev 7.4: PARA legend fits by mirroring AFTERTOUCH's<\/strong> (labels can't stack 3 deep there).\n- <strong>Name:<\/strong> \"PARA\", <strong>left-aligned 5.6 mm to the RIGHT of the toggle<\/strong>, in the strip between OSC 1 and OSC 2. It mirrors AFTERTOUCH's label, which sits right-aligned to the left of its own toggle.\n- <strong>Positions:<\/strong> shortened to <strong>1 · P · 4<\/strong> (MONO / PARA / PARA+4). These are the only words that change.\n- <strong>ONE SHEET:<\/strong> that strip is ≥ 8 mm tall across x 114–123 [CALC], so it takes two lines of 1.37 caps: \"PARA\" over \"1 · P · 4\".\n- <strong>HUSH:<\/strong> the tags narrow it to 4.3–5 mm, so there's room for one line only. \"1 / P / 4\" is pressed as three 1.2 mm glyphs stacked at the toggle's three throw heights (y 109 / 111.5 / 114), right beside it, and \"PARA\" follows at x ≈ 119.5–124.5 on y 111.5.<\/p>\n<p><strong>Rev 7.3 (pre-build, 2026-11-13): switch pair.<\/strong>\n- <strong>AFTERTOUCH confirmed where the visual designer placed it:<\/strong> VELOCITY's column, y 111.5, between the VOICE rows (FILTER MOD / AFTERTOUCH / VELOCITY). The two key-response switches stack.\n- <strong>Its empty mirror slot is now filled by the new PARA toggle (3-way MONO / PARA / PARA+4)<\/strong> at the oscillator-side switch column, y 111.5 (OSC MOD / PARA / OSC 3 CTL). ONE SHEET x 104.25, HUSH x 111.25; AFTERTOUCH ONE SHEET 171.75, HUSH 178.75.\n- <strong>Why:<\/strong> PARA decides how the keys are assigned to the oscillators, so it sits with the oscillator switches. AFTERTOUCH is how the keys respond, so it sits with VELOCITY. They mirror about the centre.\n- Checkers 0 violations, mirror 0.00.\n- <strong>Legend check (visual):<\/strong> PARA's three position words need the same treatment as AFTERTOUCH's label (right-aligned, left of the toggle). OSC MOD and OSC 3 CTL labels go above their toggles, mirroring VELOCITY and SOURCE.<\/p>\n<p><strong>Rev 7.2 / DRIFT (2026-11-13). Supersedes 7.1's PLAY-right and back-row text.<\/strong> Owner: \"I like the idea of drift, but I'd want it to be controllable\". DRIFT is a firmware random pitch wander; fully left = rock-steady.\n- <strong>Back row = the chain in one line<\/strong>, mirrored about the centre:\n  - <strong>DRIFT 81.5<\/strong> (source, under the FREQ column)\n  - ECHO TYPE 110.5 · ECHO TIME 130.5\n  - REVERB DECAY 159.5 · REVERB TYPE 179.5\n  - <strong>VOLUME 208.5<\/strong> (out, under the loudness column)\n  - Breaks at 96 / 145 / 194.\n- <strong>PLAY right:<\/strong> ECHO REPEATS 201 · ECHO MIX 221 · REVERB MIX 241 · <strong>TAP 263<\/strong>. TAP is played in rhythm, and it mirrors the bend stick.\n- <strong>Why:<\/strong> one added knob makes the count odd, so a lone DRIFT can't be mirrored. <strong>DRIFT ↔ VOLUME<\/strong> pairs source with output; TAP moves to the PLAY row to keep that row at 4 + 3 + 4. The checkers pass with 0 violations and mirror 0.00 in every row.\n- <strong>Cost:<\/strong> VOLUME sits on the back row (≈ 78 mm behind the PLAY row), and TAP is away from TIME. Sizes are unchanged.<\/p>\n<p><strong>Rev 7.1 (round 5 final):<\/strong>\n- <strong>Layout:<\/strong> common rev 7.1 + 7.\n  - PLAY right: REPEATS 201, ECHO MIX 221, REVERB MIX 241, <strong>VOLUME 263<\/strong>.\n  - FX row y 146: ECHO TYPE 97.5, TIME 117.5 | TAP 145 | DECAY 172.5, REVERB TYPE 192.5. Breaks 132 / 158.\n- <strong>Body 290 × 186.<\/strong> The FX row clears the rear R 44 corners (all FX x between 44 and 246). The bay moves back with the board.\n- No side-wall wheel. Tags on every control.\n- Key edge A/B as rev 7.<\/p>\n<p><strong>Rev 7 (round 5, 2026-11-13). Supersedes the layout and front edge below.<\/strong>\n- <strong>Layout and FX:<\/strong> common rev 7 in the HUSH frame (x = FOLD x + 2, centre 145, breaks 103.5 / 186.5).\n  - PLAY: stick 27, MOD 49, TUNE 69, GLIDE 89 | CUTOFF 121, EMPHASIS 145, CONTOUR AMT 169 | ECHO TIME 201, REPEATS 221, REVERB 241, FX MIX 263.\n  - The VOICE uses the common rev 7 columns + 7.\n  - <strong>Tags:<\/strong> every face control has one, including the 4 FX knobs.\n  - <strong>VOLUME:<\/strong> a thumbwheel punched through the felt in the right wall; the felt is bound round the slot.\n  - <strong>FX MODE toggle:<\/strong> rear wall with the jacks.\n  - <strong>Body:<\/strong> ≈ 290 × 184 (ESTIMATE). The rear R 44 corners and the bay move back with the board.\n  - Checked: every knob on the flat top (≥ 12 from the edges), 0 violations (<code>_mock-src/flat_r5_check.py<\/code>).\n- <strong>Key edge, two options.<\/strong> Peg heads stand <strong>6.5 above the felt by mechanism<\/strong>: 2.5 travel to the collar plus a ≈ 4 mm head. \"2–3 proud\" isn't possible with pegs; they're already well proud, so they can be felt.\n  - <strong>A, at the edge, no lip:<\/strong>\n    - The <strong>front edge round-over tightens from r 12 to r 4<\/strong> (sides and back keep r 12; the front corners blend r 4 → 12, so <strong>add this to the corner blocking test<\/strong>).\n    - The pegs move forward 6: whites at <strong>y 13.5<\/strong> (head front 7.15 from the front face; collar edge exactly on the flat at 4), sharps at y 36. Arms and strip C move forward 6 too (strip C y ≈ 2–50).\n    - The PLAY row stays at 68.\n    - In front of the heads there's only 7 mm of felt falling over a tight edge.\n  - <strong>B, small lip:<\/strong> the round-4 geometry. The r 12 felt brow is the lip: flush at 25.5 and 13 mm deep. Peg heads at y 19.5 (13.15 from the front), 6.5 above it.<\/p>\n<p><strong>Rev 6.2: internal battery bay (owner: \"What do you mean there's no battery … we are designing this\").<\/strong>\n- <strong>Bay:<\/strong> x 27–157 × y 106–172, z 1.5–12.9 (<strong>130 × 66 × 11.4 clear<\/strong>). It sits under the main board at the rear-left, under the VOICE oscillators and the rear band, clear of the speaker.\n- <strong>Holds:<\/strong> 2 pouch cells of ≤ 9.9 thick × 50 × 60 (e.g. 2 × 3000 mAh ≈ 22 Wh, ≈ 5–10 h at eng's 2.2–4.2 W; cell choice and wiring with eng).\n- <strong>The height:<\/strong> 1.5 mm comes from a pocket in the back panel; the board's underside has a lead-free keep-out over the bay.\n- <strong>Why not under the keys:<\/strong> under strip C there's only ≈ 6.5 mm.\n- <strong>Access:<\/strong> the cells strap to the back panel's inner face on JST leads. Back panel off (8 screws underneath) → unplug → swap.<\/p>\n<p><strong>Rev 6.1 (eng round 4):<\/strong>\n- <strong>290 × 176<\/strong> (was 144). The main board ≈ 268 × 115 runs y ≈ 58–173, so the body grows behind the back row. Keys, pegs and rows are unchanged.\n- The felt rear band (y ≈ 132–164 flat) is plain felt; the name can be embroidered there.\n- Rear plan corners stay R 44.\n- Knobs: 18T push-on on T18 pots, tops ≈ 39.\n- Eng confirms strip C (y 8–56) and the main board (from y 58) side by side ✓.\n- Felt flat-equivalent grows to ≈ 392 × 278 (hood size UNVERIFIED).\n- Print split at x 129.5 → 129.5 × 176 and 160.5 × 176, both ✓ on a 250 × 210 bed.<\/p>\n<\/blockquote>\n<p><strong>What changed in rev 6 (owner):<\/strong>\n- \"Hush should be more rounded around the edges, organically, so the felt can wrap seamlessly around it\": a pebble-like shell; the felt now covers <strong>top, edges and sides<\/strong> and ends only underneath.\n- Unibody, \"controls installed from behind and then a panel screwed in on the back\": closed-top shell loaded from underneath; every fastener underneath.\n- Keys to the front edge, logical split, narrower: <strong>298 × 180 → 290 × 144<\/strong> (common rev 6 layout, +7 in x).\n- No sleeve, flap or case this round.<\/p>\n<h2>The idea<\/h2>\n<p>The owner's hardest feel rule is \"as silent as possible\", and silence is made of felt. <strong>The material that makes it quiet is the material of the whole outside: one seamless skin of grey wool felt wrapped over a soft printed body, with maple pegs for keys rising through it.<\/strong><\/p>\n<h2>Design principles (each follows from the idea)<\/h2>\n<ol>\n<li><strong>The skin is a working part.<\/strong> Each peg head lands on a felt collar just before the switch bottoms: felt is the silent bottom stop. <em>Because<\/em> if felt makes it quiet, the felt you see must be working.<\/li>\n<li><strong>One skin, no edges.<\/strong> The felt runs over the top, round every edge and down every side, and ends only underneath. The body is rounded so it can. <em>Because<\/em> a soft object has no corners to knock and no seams to pick at (owner, rev 6).<\/li>\n<li><strong>Nothing hard touches the hand except what plays.<\/strong> Pegs, knobs, stick: hard. Everything else: felt.<\/li>\n<li><strong>Nothing shouts / one hard material: a tag per knob<\/strong> (visual r3). Grey wool, maple, cream knobs; a printed tag under every knob carries its scale, because felt can't hold a fine mark.<\/li>\n<li><strong>Wear parts are separate.<\/strong> Collars are punched rings, replaceable; the skin itself comes off and goes back on.<\/li>\n<\/ol>\n<h2>Keys: maple pegs on Choc V2 silent<\/h2>\n<ul>\n<li><strong>Pegs:<\/strong> 1/2 in (12.7 mm) maple mushroom button plugs. <strong>Each peg is centred over its switch stem<\/strong> (eng E-L5: \"mechanically best, no rocking\"); a laser-cut acrylic arm carries the MX cross pocket under the peg and the D31 magnet <strong>10.5 mm behind the stem<\/strong>.<\/li>\n<li><strong>Whites:<\/strong> pegs at <strong>y 19.5<\/strong>, x 19 + 18n (n = 0…14: x 19 … 271). Arm y ≈ 12–33 (stem 19.5, magnet 30).<\/li>\n<li><strong>Sharps:<\/strong> pegs at <strong>y 42<\/strong>, at the white boundaries in piano positions. Arm y ≈ 34.5–56 (stem 42, magnet 52.5). White arm ends (33) and sharp housings (34.5) clear by 1.5 mm.<\/li>\n<li><strong>Strip C:<\/strong> y ≈ 8–56, x 10–280. The main board starts at y ≈ 58 (PLAY pot bodies at 68 ± 5) ✓.<\/li>\n<li><strong>Velocity and the felt stop:<\/strong> unchanged from rev 5 (eng E-L5 §3.3: contact at 2.5 ± 0.2 of 2.8 mm comes after the fit window in every tolerance case). <strong>Holes clear the moving shank ≥ 0.5 mm radial; the head overlaps the hole<\/strong> (no drag).<\/li>\n<li><strong>Collars:<\/strong> punched 19 mm rings of 3 mm F3 felt, each in a 1 mm counterbore in the shell, so the collar top is flush with the 2 mm skin (25.5). The peg head's underside is 2.5 above the collar at rest (28); head top ≈ 32.<\/li>\n<li><strong>Fitting:<\/strong> pegs press into their arms <strong>from above, last<\/strong> (like the key tops in common §5). A peg pulls out by hand.<\/li>\n<\/ul>\n<h2>Body<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\"><strong>Outer<\/strong><\/td>\n<td data-label=\"Spec\"><strong>290 × 176<\/strong> (rev 6.1); felt surface (deck = panel) at <strong>25.5<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Plan corners<\/td>\n<td data-label=\"Spec\">front <strong>R 20<\/strong>, rear <strong>R 44<\/strong> (organic: the back rounds off more than the playing edge). Front corners are limited by the end pegs: C (19, 19.5) must sit on the flat [CALC: 7.45 from the corner centre, flat radius 8]<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Edge section<\/strong><\/td>\n<td data-label=\"Spec\">top round-over <strong>r 12<\/strong> all round → a short near-vertical side (≈ 7.5) → bottom round-under <strong>r 6<\/strong> → flat bottom. The felt follows all of it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Flat top<\/td>\n<td data-label=\"Spec\">from 12 in at every edge: every peg, knob and tag sits on the flat (checked: front peg heads at y 13.15, last knob edge y 130.45 vs 132, side margins ≥ 12.65)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Shell<\/strong><\/td>\n<td data-label=\"Spec\">printed, closed top (2.5 thick, top surface 23.5), walls 2.4; ribs at y 85.4 and 111.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Layout<\/td>\n<td data-label=\"Spec\">common rev 6 + 7 in x (PLAY row y 68; VOICE y 100 / 123). Sections are told apart by the tags and the felt between them (no grooves in felt)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Tags<\/td>\n<td data-label=\"Spec\">printed ring + name under each knob (visual r3), set into a punched hole in the felt, flush; a sleeve on the tag presses into the shell hole around the bushing and holds it (and pins the felt). MIDI dots on the tags<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Stick<\/td>\n<td data-label=\"Spec\">Delrin gate in a pocket under the shell; a printed tag around the slot; cap on after<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Lights<\/td>\n<td data-label=\"Spec\">status (269, 68), \"not in control\" (159, 79): through punched holes, each in a small printed bezel tag<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Jacks, power<\/td>\n<td data-label=\"Spec\">I/O board inside the rear wall (common §4); the felt is cut around the 7–8 ports (small round holes, like a laptop sleeve's)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Speaker<\/td>\n<td data-label=\"Spec\">bottom, centre (247, 113), through a grille in the back panel<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Battery<\/td>\n<td data-label=\"Spec\">on the back panel's inner face, under the main board's keep-out<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Heights:<\/strong> felt 25.5; knob tops ≈ 36, CUTOFF ≈ 37.6; peg heads ≈ 32 (R3 ✓). Board top ≈ 14, pot bodies 14–21 under the 21–23.5 shell face.<\/p>\n<h2>The felt: how it wraps seamlessly<\/h2>\n<p><strong>The problem [CALC]:<\/strong> a flat sheet can't follow a corner that's curved both ways (in plan and in section) without spare material. At a front corner (plan R 20, edge r 12) the sheet has ≈ 25 % too much material at the side's widest point, more as it turns under. A pressed F3 sheet can't take that up; it would pucker or need a cut.<\/p>\n<p><strong>Default: block it like a hat.<\/strong> Use a <strong>wool felt hat hood (capeline)<\/strong> and steam-block it over the printed shell, the way a milliner blocks a hat over a wooden block. <strong>The shell is the hat block.<\/strong> Wet wool felt stretches and shrinks to a compound curve, then sets dry. Hoods are made to do exactly this (crowns are much deeper curves than these corners).\n- Thickness: hat felt is ≈ 1.5–2 mm (UNVERIFIED for a given hood). The shell's top sits at 23.5 for a 2 mm skin; the stop is the separate F3 collars, so skin thickness doesn't touch velocity.\n- Size [CALC]: flat-equivalent ≈ 392 × 246 mm (top + both wraps + 15 mm turn-ins); a large capeline should cover it (sizes and price UNVERIFIED; ESTIMATE $15–35).\n- Holes: punched from inside after blocking, <strong>using the shell's own holes as the template<\/strong>.<\/p>\n<p><strong>Fallback: the F3 sheet<\/strong> (one 12 × 12 in sheet won't reach any more: 290 + 2 × 51 = 392 &gt; 305; it needs a 12 × 24 in or a roll). It wraps the straight edges cleanly. At each of the four corners the spare material goes into <strong>one dart<\/strong> cut from the turn-in up to the side's widest point and butted with a hidden stitch. Seen from above and from the front it's seamless; at the corners, a fine line shows on the side.<\/p>\n<p><strong>Where the felt ends:<\/strong> <strong>underneath only.<\/strong> The skin turns under the bottom round (r 6) and ends ≈ 15 mm in, lying in a 2 mm recessed land around the shell's bottom rim. A thin printed <strong>binding ring<\/strong> (290 × 144 outer, 15 wide) clamps it there with 10 × M3 from underneath. The back panel sits inside the ring with its own screws, so <strong>opening the back never releases the felt<\/strong>.<\/p>\n<p><strong>Test before committing (one evening):<\/strong> print a 100 × 100 corner of the shell (plan R 20, edge r 12). Block (a) a hood offcut and (b) an F3 square over it with steam; photograph both.<\/p>\n<h2>Build and service (common §5, with these differences)<\/h2>\n<ul>\n<li><strong>F9 order:<\/strong>\n  1. Print the shell (split at x 129.5, the full-depth break line, on Prusa beds; the felt hides the joint).\n  2. Block the felt over the empty shell; dry; trim the turn-ins.\n  3. Punch the holes from inside.\n  4. Fit the collars, then the binding ring.\n  5. Load from underneath as common §5 (gate, main board, strip C, I/O, battery and speaker on the back panel).\n  6. Back panel on.\n  7. Flip it; press in the tags, the pegs and the knobs; fit the stick cap.<\/li>\n<li><strong>F10 Service:<\/strong><\/li>\n<li>Back panel off (8 screws): battery, speaker, BOOTSEL, board underside.<\/li>\n<li>Board out: knobs and tags off the top (pull), 10 screws, lower it.<\/li>\n<li>A key: pull its peg from above.<\/li>\n<li><strong>Collars:<\/strong> pull the peg and lift the collar out.<\/li>\n<li><strong>Skin:<\/strong> pull the knobs, tags and pegs, undo the binding ring, lift the skin off; re-block or replace.<\/li>\n<\/ul>\n<h2>Wear plan<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Where<\/th>\n<th>What wears<\/th>\n<th>Replacement<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Where\">Peg collars<\/td>\n<td data-label=\"What wears\">compress where heads land<\/td>\n<td data-label=\"Replacement\">punched F3 rings, lift out; spares from any F3 offcut<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Where\">Front edge (palm)<\/td>\n<td data-label=\"What wears\">grime, pilling<\/td>\n<td data-label=\"Replacement\">the skin is one piece now (a palm strip would be a seam): brush it, steam it; replace the skin when it's done<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Where\">Around CUTOFF and the stick<\/td>\n<td data-label=\"What wears\">finger contact<\/td>\n<td data-label=\"Replacement\">already on printed tags and Delrin<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>Form<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">Play<\/td>\n<td data-label=\"Form\">on its back panel's feet; a soft grey pebble with pegs<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">On a lap<\/td>\n<td data-label=\"Form\">felt all round, warm, silent; speaker muffled (as all)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Carry<\/td>\n<td data-label=\"Form\"><strong>not designed this round<\/strong> (owner deferred); the felt outside makes it the most bag-tolerant of the three<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Keep it out (J18)<\/td>\n<td data-label=\"Form\">keyhole slot in the back panel<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Flows that differ from common<\/h2>\n<ul>\n<li><strong>F1:<\/strong> out of the bag, on the table or lap, power (rear), play.<\/li>\n<li><strong>F4:<\/strong> separate c
