mechanism without touching electronics<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Hall sensor and magnet tolerance<\/td>\n<td data-label=\"L\">L<\/td>\n<td data-label=\"Mitigation\">Self-learning per-key range; 5 spare sensors<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Ladder at ±9 V vs. original ±10 V<\/td>\n<td data-label=\"L\">L<\/td>\n<td data-label=\"Mitigation\">Re-run the CA-72 ladder model at ±9 V before layout (sim/)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Tariff and duty figures change<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">JLC charges DDP at checkout, so the number is known before paying<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "lead": "Status: rev 0, 2026-11-12; latest rev 14 (2026-11-13, owner decision: channel aftertouch with its own switch; §v1.12, aftertouch.md); rev 13 (2026-11-13, Daisy Seed replaces the Pico 2; §v1.11); rev 12 FOLD only: fold-answers.md; rev 11 bat", "jump": ["v1.0 Bottom line (one unit, one-off)", "v1.1 What of the old $150/$200 tiers is included", "v1.2 Locked spec", "v1.3 One-unit BOM (one-off)", "v1.4 Keys (rev 4): one switch per key, owner-cut key tops", "v1.4b Velocity keys, through-hole only (rev 6: owner \"i want velocity\")", "v1.5 Bend/mod (rev 5): cheapest bought options, incl. mini joysticks", "v1.6 Internal battery: in or out", "v1.7 Remaining ESTIMATE items", "v1.8 New risks", "v1.9 Cost-cut ladder toward ≈ $200 (one unit; rev 3, final numbers in §v1.10)", "v1.10 Clean one-unit totals (rev 4): the numbers to show the owner", "v1.11 Rev 13: Daisy Seed as the digital brain (owner decision, 2026-11-13)", "v1.12 Rev 14: channel aftertouch (owner decision, 2026-11-13)", "0. Bottom line", "1. What \"the spirit\" is", "2. Spec: \"$100\" tier", "3. Bottom-up BOM (\"$100\" tier)", "4. Calibration: \"no rigmarole\" still holds", "5. Tiers: what each buys back", "6. Risks specific to the budget variant"], "code": "D-019", "causedBy": "B"}, "D-031": {"kind": "doc", "sub": "doc", "title": "Pin check and audio-quality check", "stage": "Spec", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "rev 0 · 13 Nov"}], "path": "eng/daisy-pin-and-audio-check.md", "html": "<h1>Pin check and audio-quality check: Daisy Seed vs Pico 2 + SGTL5000<\/h1>\n<p>Status: rev 0, 2026-11-13. Answers the owner: \"Check the pin thing. Audio feels the most important since we're introducing digital stuff.\"\nCompares (A) <strong>Pico 2 + Teensy Audio Shield Rev D (SGTL5000) + 74HC595<\/strong> (<code>single-chip-research.md<\/code> §1.6) with (B) <strong>Daisy Seed as the only digital chip<\/strong>.\nI/O list from <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> rev 12 (§v1.2, Part 2 §4) and the control counts in <a href=\"#i-D-003\"><code>design/concepts/common-how-it-works.md<\/code><\/a> rev 7.1.\nConventions as in <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a>. Link = read this session. <strong>UNVERIFIED<\/strong> = a source exists but I couldn't confirm the figure. <strong>ESTIMATE<\/strong> = my number. [ENG] = engineering judgement. [CALC] = arithmetic.<\/p>\n<hr />\n<h2>0. Bottom line<\/h2>\n<ol>\n<li><strong>Daisy Seed pins: everything fits on the 31 header GPIO with 5 spare, and no expander is needed.<\/strong> Three things to note:\n   - The codec, SDRAM and QSPI flash use <strong>none<\/strong> of the header pins.\n   - <strong>TIM5 is a 32-bit timer with all 4 channels on header pins<\/strong> (D25, D24, D28, D16). That gives 3 VCO counters plus a 4th for filter-scale cal.\n   - TIM3 provides the 3 PWM CVs. MIDI in and out and SPI each get their own peripheral.<\/li>\n<li><strong>Pico 2 + SGTL5000 also fits, but with 0 spare, and only with the 74HC595.<\/strong> The earlier claim holds for the list it counted. That list missed two items:\n   - <strong>A 4th count input for the automatic filter-scale cal.<\/strong> v1.2 promises this cal, and Part 2 §4 wires the ladder to a count input.\n   - <strong>TRS MIDI out<\/strong>, if it's wanted. The locked spec has MIDI in only.<\/li>\n<\/ol>\n<p>Neither fits on the Pico without another workaround (§2.3). There is also a power-up hazard: <strong>the 74HC595 would drive the sensor-LDO enable<\/strong>, and its outputs are random at power-up (§2.2).\n3. <strong>Audio: the Daisy wins on all four axes.<\/strong>\n   - <strong>Converter:<\/strong> wet-path noise floor <strong>8–18 dB lower<\/strong>, ADC distortion <strong>≈ 20–25 dB lower<\/strong>.\n   - <strong>DSP throughput:<\/strong> ≈ 5–7× (ESTIMATE).\n   - <strong>Memory:<\/strong> ≈ 1 MB of on-chip SRAM plus 64 MB SDRAM, against 520 KB shared with the control firmware. Long halls in float, CloudSeed-class reverbs and multi-second tape echo fit only on the Daisy.\n   - <strong>Pin room.<\/strong><\/p>\n<p>The <strong>Pico Plus 2 closes only the echo-length gap.<\/strong> Its PSRAM is too slow for reverb taps (§3.5).\n4. <strong>Recommendation, with audio weighted highest: switch to the Daisy Seed (buy a Seed3 or a 65 MB Seed2 DFM, $34.99).<\/strong> Keep the dry path analog. The costs:\n   - ≈ +$19;\n   - ≈ +0.3–0.6 W;\n   - porting the control firmware off PIO (§1.4).<\/p>\n<p>If the owner won't take those costs, the best audio on the Pico path is <strong>PCM1808 + PCM5102A instead of the SGTL5000<\/strong>. Its converter is roughly PCM3060-class and it frees 2 pins, but DSP and memory stay Pico-sized and the PCM1808 comes only from marketplace sellers.<\/p>\n<hr />\n<h2>1. Daisy Seed pin check<\/h2>\n<h3>1.1 Which Seed you'd actually get<\/h3>\n<p>libDaisy's board-detect code (<a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/daisy_seed.h\" rel=\"noopener\" target=\"_blank\">daisy_seed.h<\/a>, <a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/daisy_seed.cpp\" rel=\"noopener\" target=\"_blank\">daisy_seed.cpp<\/a>, read via raw.githubusercontent) names five versions:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>libDaisy name<\/th>\n<th>Common name<\/th>\n<th>Codec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"libDaisy name\">DAISY_SEED<\/td>\n<td data-label=\"Common name\">Rev 4 (original)<\/td>\n<td data-label=\"Codec\"><strong>AK4556<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"libDaisy name\">DAISY_SEED_1_1<\/td>\n<td data-label=\"Common name\">Rev 5<\/td>\n<td data-label=\"Codec\"><strong>WM8731<\/strong> (I2C-configured)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"libDaisy name\">DAISY_SEED_2_DFM<\/td>\n<td data-label=\"Common name\">Seed2 DFM<\/td>\n<td data-label=\"Codec\"><strong>PCM3060<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"libDaisy name\">DAISY_SEED_1_2<\/td>\n<td data-label=\"Common name\"><strong>Rev 7<\/strong><\/td>\n<td data-label=\"Codec\"><strong>PCM3060<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"libDaisy name\">DAISY_SEED_3<\/td>\n<td data-label=\"Common name\"><strong>Seed3<\/strong><\/td>\n<td data-label=\"Codec\"><strong>TI TAC5242<\/strong>, USB-C, \"pin-compatible\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Seed3 launched July 2026.<\/strong> It has the \"same MCU\", USB-C and a \"new audio codec … 32-bit, 192kHz\". A forum user reports Electrosmith \"are no longer selling the previous Daisy Seed version\" (<a href=\"https://forum.pedalpcb.com/threads/new-pin-for-pin-compatible-daisyseed-seed3.29897/latest\" rel=\"noopener\" target=\"_blank\">PedalPCB Seed3 thread<\/a>, Jul 24–Aug 24 2026).<\/li>\n<li>From Nov 1 2026, \"the 65MB Seed2 DFM and Seed3 go from $29.99 to $34.99\" (<a href=\"https://forum.pedalpcb.com/threads/free-stock-price-tracker-for-daisy-seeds-heads-up-prices-change-nov-1.30660/latest\" rel=\"noopener\" target=\"_blank\">PedalPCB tracker, Oct 26 2026<\/a>).<\/li>\n<li><strong>So a new purchase is a Seed3 (TAC5242) or a Seed2 DFM (PCM3060). A Rev 7 from reseller stock is also PCM3060.<\/strong> All are pin-compatible for this map.<\/li>\n<li>The TAC5242 identification comes only from libDaisy's comment; Electrosmith's page wasn't readable here (UNVERIFIED).<\/li>\n<\/ul>\n<h3>1.2 Pins consumed on-module (not on the header)<\/h3>\n<p>From <a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/daisy_seed.cpp\" rel=\"noopener\" target=\"_blank\">daisy_seed.cpp<\/a>:\n- <strong>Codec:<\/strong> SAI1 on PE2 (MCLK), PE3 and PE6 (data), PE4 (FS), PE5 (SCK). Codec reset/de-emphasis on PB11.\n- <strong>QSPI flash:<\/strong> PF6–PF10, PG6.\n- <strong>Board detect:<\/strong> PD3–PD5, PH6. <strong>User LED:<\/strong> PC7. <strong>Test point:<\/strong> PG14.\n- <strong>SDRAM:<\/strong> the FMC bus (ports D–I), internal. Not listed in the files read, but none of it is a header pin.\n- <strong>USB device (MIDI, DFU):<\/strong> the on-module USB FS port, internal.<\/p>\n<p><strong>Result: none of D0–D30 is taken by the codec, SDRAM or flash.<\/strong> Header pins 16–21 are audio in L/R, audio out L/R, AGND and +3V3A (<a href=\"https://www.electrokit.com/upload/product/41020/41020659/Daisy_Seed_datasheet_v1.0.5.pdf\" rel=\"noopener\" target=\"_blank\">Seed datasheet v1.0.5, mirror<\/a>).<\/p>\n<p><strong>Software conflicts to respect:<\/strong>\n- <strong>libDaisy's <code>System<\/code> runs TIM2 as its free-running µs timer<\/strong> (<a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/sys/system.cpp\" rel=\"noopener\" target=\"_blank\">system.cpp<\/a>). <strong>Use TIM5 for the counters<\/strong>; it sits on the same pins, PA0–PA3.\n- libDaisy's default pin for TIM3 CH2 is the on-board LED (PC7). Name PA7 explicitly.<\/p>\n<h3>1.3 Timer, ADC and peripheral facts used<\/h3>\n<ul>\n<li><strong>Timer channel pins<\/strong> come from libDaisy <a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/per/pwm.h\" rel=\"noopener\" target=\"_blank\">pwm.h<\/a>. TIM3 and TIM4 are 16-bit; TIM5 is 32-bit.<\/li>\n<li><strong>TIM5:<\/strong> CH1 PA0 = D25, CH2 PA1 = D24, CH3 PA2 = D28, CH4 PA3 = D16.<\/li>\n<li><strong>TIM3:<\/strong> CH1 PA6 = D19 or PB4 = D9; CH2 PA7 = D18 or PB5 = D10; CH3 PC8 = D4; CH4 PB1 = D17 or PC9 = D3.<\/li>\n<li><strong>TIM4:<\/strong> CH1–CH4 on PB6–PB9 = D13, D14, D11, D12. These clash with USART1 and I2C1, so TIM4 isn't used here.<\/li>\n<li>The datasheet also lists TIM2 CH1–4 on PA0/PA5, PA1, PA2, PA3.<\/li>\n<li><strong>ADC:<\/strong> 12 inputs (A0–A11), 16-bit. Header pins 24, 25, 28, 29 and 30 (D17, D18, D21, D22, D23) are <strong>3.3 V-only<\/strong>; the rest are 5 V-tolerant (datasheet).<\/li>\n<li>libDaisy's built-in mux reader handles at most <strong>8 channels per mux, 3 select lines<\/strong> (<a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/per/adc.cpp\" rel=\"noopener\" target=\"_blank\">adc.cpp<\/a>). Our CD4067s need 4 selects, so the scanner is custom code (§1.4).<\/li>\n<li><strong>Clock:<\/strong> libDaisy defaults to 400 MHz CPU (480 MHz \"Boost\"), with timer clock = 2 × PCLK1 (<a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/sys/system.h\" rel=\"noopener\" target=\"_blank\">system.h<\/a>, <a href=\"https://github.com/electro-smith/libDaisy/blob/master/src/per/tim.cpp\" rel=\"noopener\" target=\"_blank\">tim.cpp<\/a>). That gives ≈ 200 MHz at the default and 240 MHz in Boost; the PCLK1 value is UNVERIFIED.<\/li>\n<\/ul>\n<h3>1.4 Allocation table (Daisy Seed; header pin in brackets)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Seed pin<\/th>\n<th>MCU pin / function<\/th>\n<th>Why this pin<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Need\"><strong>VCO 1 frequency count<\/strong><\/td>\n<td data-label=\"Seed pin\">D25 [32]<\/td>\n<td data-label=\"MCU pin / function\">PA0 <strong>TIM5_CH1<\/strong> input capture<\/td>\n<td data-label=\"Why this pin\">32-bit timer<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\"><strong>VCO 2 count<\/strong><\/td>\n<td data-label=\"Seed pin\">D24 [31]<\/td>\n<td data-label=\"MCU pin / function\">PA1 TIM5_CH2<\/td>\n<td data-label=\"Why this pin\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\"><strong>VCO 3 count<\/strong><\/td>\n<td data-label=\"Seed pin\">D28 [35]<\/td>\n<td data-label=\"MCU pin / function\">PA2 TIM5_CH3<\/td>\n<td data-label=\"Why this pin\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\"><strong>Filter self-osc count<\/strong> (filter-scale cal)<\/td>\n<td data-label=\"Seed pin\">D16 [23]<\/td>\n<td data-label=\"MCU pin / function\">PA3 TIM5_CH4<\/td>\n<td data-label=\"Why this pin\">Free 4th channel on the same timer<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">PWM CV: VCA balance (auto-null)<\/td>\n<td data-label=\"Seed pin\">D4 [5]<\/td>\n<td data-label=\"MCU pin / function\">PC8 TIM3_CH3<\/td>\n<td data-label=\"Why this pin\">16-bit PWM<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">PWM CV: mod depth (AS3360 A)<\/td>\n<td data-label=\"Seed pin\">D9 [10]<\/td>\n<td data-label=\"MCU pin / function\">PB4 TIM3_CH1<\/td>\n<td data-label=\"Why this pin\">Free because SPI runs TX-only (no MISO)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">PWM CV: velocity (AS3360 B)<\/td>\n<td data-label=\"Seed pin\">D18 [25]<\/td>\n<td data-label=\"MCU pin / function\">PA7 TIM3_CH2<\/td>\n<td data-label=\"Why this pin\">3.3 V-only pin, output: fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">SPI SCK → 2× MCP4822<\/td>\n<td data-label=\"Seed pin\">D8 [9]<\/td>\n<td data-label=\"MCU pin / function\">PG11 SPI1_SCK<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">SPI MOSI<\/td>\n<td data-label=\"Seed pin\">D10 [11]<\/td>\n<td data-label=\"MCU pin / function\">PB5 SPI1_MOSI<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">DAC 1 CS<\/td>\n<td data-label=\"Seed pin\">D7 [8]<\/td>\n<td data-label=\"MCU pin / function\">PG10 SPI1_NSS (or GPIO)<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">DAC 2 CS<\/td>\n<td data-label=\"Seed pin\">D0 [1]<\/td>\n<td data-label=\"MCU pin / function\">PB12 GPIO<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">CD4067 S0 / S1 / S2 / S3<\/td>\n<td data-label=\"Seed pin\">D2 [3] / D1 [2] / D6 [7] / D3 [4]<\/td>\n<td data-label=\"MCU pin / function\">PC10 / PC11 / PC12 / PC9<\/td>\n<td data-label=\"Why this pin\"><strong>All on port C<\/strong>, so one DMA write to GPIOC→BSRR steps all four [ENG]<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Mux A → ADC<\/td>\n<td data-label=\"Seed pin\">D15 [22]<\/td>\n<td data-label=\"MCU pin / function\">PC0 (A0)<\/td>\n<td data-label=\"Why this pin\">Pins with no timer use<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Mux B → ADC<\/td>\n<td data-label=\"Seed pin\">D20 [27]<\/td>\n<td data-label=\"MCU pin / function\">PC1 (A5)<\/td>\n<td data-label=\"Why this pin\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Mux C → ADC<\/td>\n<td data-label=\"Seed pin\">D21 [28]<\/td>\n<td data-label=\"MCU pin / function\">PC4 (A6)<\/td>\n<td data-label=\"Why this pin\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">TRS MIDI in<\/td>\n<td data-label=\"Seed pin\">D14 [15]<\/td>\n<td data-label=\"MCU pin / function\">PB7 USART1_RX<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\"><strong>TRS MIDI out<\/strong> (optional, free here)<\/td>\n<td data-label=\"Seed pin\">D13 [14]<\/td>\n<td data-label=\"MCU pin / function\">PB6 USART1_TX<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">USB-MIDI device<\/td>\n<td data-label=\"Seed pin\">on-module USB<\/td>\n<td data-label=\"MCU pin / function\">OTG FS (internal)<\/td>\n<td data-label=\"Why this pin\">0 header pins<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Gate out<\/td>\n<td data-label=\"Seed pin\">D26 [33]<\/td>\n<td data-label=\"MCU pin / function\">PD11 GPIO<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Status LED red / green<\/td>\n<td data-label=\"Seed pin\">D27 [34] / D5 [6]<\/td>\n<td data-label=\"MCU pin / function\">PG9 / PD2<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">\"Not in control\" LED<\/td>\n<td data-label=\"Seed pin\">D19 [26]<\/td>\n<td data-label=\"MCU pin / function\">PA6<\/td>\n<td data-label=\"Why this pin\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">LM386 enable<\/td>\n<td data-label=\"Seed pin\">D22 [29]<\/td>\n<td data-label=\"MCU pin / function\">PA5<\/td>\n<td data-label=\"Why this pin\">3.3 V-only, output<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Sensor-LDO P-FET enable<\/td>\n<td data-label=\"Seed pin\">D23 [30]<\/td>\n<td data-label=\"MCU pin / function\">PA4<\/td>\n<td data-label=\"Why this pin\">3.3 V-only, output; <strong>defined low at reset (no expander)<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">Audio in/out<\/td>\n<td data-label=\"Seed pin\">pins 16–19, AGND 20<\/td>\n<td data-label=\"MCU pin / function\">on-module codec<\/td>\n<td data-label=\"Why this pin\">0 GPIO<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\">FX controls (8), 25 Halls, Pico-read pots, stick, VEL toggle<\/td>\n<td data-label=\"Seed pin\">mux channels<\/td>\n<td data-label=\"MCU pin / function\">—<\/td>\n<td data-label=\"Why this pin\">≈ 45 of 48, unchanged<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Need\"><strong>Spare<\/strong><\/td>\n<td data-label=\"Seed pin\"><strong>D11, D12<\/strong> (I2C1, for a future MCP4728 or OLED), <strong>D17<\/strong> (A2: a dedicated VCA-null sense ADC, or spare), <strong>D29, D30<\/strong> (USB-HS D−/D+; free if no second USB)<\/td>\n<td data-label=\"MCU pin / function\"><\/td>\n<td data-label=\"Why this pin\"><strong>5 spare<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Used: 26 of 31. It fits, with no external part.<\/strong><\/p>\n<p><strong>Option:<\/strong> use the Seed's two <strong>12-bit DC DAC outputs (D22, D23)<\/strong> for VCA balance and velocity instead of PWM. That removes PWM ripple. LM386/LDO enable then move to D11/D12, leaving 3 spare. Noise of the on-chip DAC is UNVERIFIED, so keep PWM as the default.<\/p>\n<p><strong>Frequency counter check [CALC]:<\/strong>\n- At a 200 MHz timer clock, a 20 kHz VCO gives 10,000 counts per period. With the capture prescaler at ÷8 that's 80,000 counts, ≈ 0.02 cents resolution.\n- 10 Hz gives 20 M counts per period. The 32-bit counter wraps at 21 s, so there's no overflow handling.\n- Each channel captures into its own register, and DMA (via DMAMUX) can log every edge, so the CPU is out of the timing loop. <strong>This is equivalent to the Pico's PIO reciprocal counter.<\/strong> TIM5 DMA request availability is per the STM32H7 reference manual, not read this session (UNVERIFIED).\n- Inputs need the same 100 k + clamp as today. Clamp to 3.3 V even though D16/D24/D25/D28 are 5 V-tolerant.<\/p>\n<p><strong>Key scan check [ENG]:<\/strong>\n- A timer triggers the ADC (3 channels in scan, DMA to RAM), and a second DMA stream steps S0–S3 through port C's BSRR on the same timer.\n- 48 mux positions × 4 kHz ≈ 192 k conversions/s over 3 ADC channels: well inside the H750's ADC.\n- This is the same hardware-paced design as <code>single-chip-research.md<\/code> §1.4, ported from PIO to timer + DMA. <strong>Porting effort: about 1 weekend for scan + counters + PWM (ESTIMATE).<\/strong><\/p>\n<p><strong>Logic levels:<\/strong> the Seed is 3.3 V logic, like the Pico, so CD4067/MCP4822/6N138 interfacing is unchanged.<\/p>\n<hr />\n<h2>2. Pico 2 + SGTL5000 shield + 74HC595 pin check<\/h2>\n<h3>2.1 Allocation (Pico 2 header: GP0–22, GP26–28 = 26 GPIO)<\/h3>\n<p>RP2350 function-select facts: UART0 RX on GP1; I2C0 on GP8/9; SPI0 on GP17–19; GPOUT0 on GP21 (GPOUT1–3 are GP23–25, which aren't on the Pico 2 header); ADC on GP26–28. These are well-known RP2350 mappings, not re-read this session (UNVERIFIED).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>GP<\/th>\n<th>Use<\/th>\n<th>GP<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"GP\">0<\/td>\n<td data-label=\"Use\">I2S DIN (from codec, PIO)<\/td>\n<td data-label=\"GP\">14<\/td>\n<td data-label=\"Use\">I2S BCLK (PIO side-set)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">1<\/td>\n<td data-label=\"Use\">UART0 RX: MIDI in<\/td>\n<td data-label=\"GP\">15<\/td>\n<td data-label=\"Use\">I2S LRCLK (side-set, must be consecutive with BCLK)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">2–4<\/td>\n<td data-label=\"Use\">VCO 1–3 count (PIO)<\/td>\n<td data-label=\"GP\">16<\/td>\n<td data-label=\"Use\">74HC595 latch (RCLK)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">5<\/td>\n<td data-label=\"Use\">PWM: VCA balance<\/td>\n<td data-label=\"GP\">17<\/td>\n<td data-label=\"Use\">SPI0 CS: DAC 1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">6<\/td>\n<td data-label=\"Use\">PWM: mod depth<\/td>\n<td data-label=\"GP\">18<\/td>\n<td data-label=\"Use\">SPI0 SCK (+ 595 SRCLK)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">7<\/td>\n<td data-label=\"Use\">PWM: velocity<\/td>\n<td data-label=\"GP\">19<\/td>\n<td data-label=\"Use\">SPI0 TX (+ 595 SER)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">8 / 9<\/td>\n<td data-label=\"Use\">I2C0 SDA / SCL: SGTL5000 control<\/td>\n<td data-label=\"GP\">20<\/td>\n<td data-label=\"Use\">DAC 2 CS<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">10–13<\/td>\n<td data-label=\"Use\">CD4067 S0–S3<\/td>\n<td data-label=\"GP\">21<\/td>\n<td data-label=\"Use\"><strong>GPOUT0 → SGTL5000 MCLK<\/strong> (12.288 MHz = 147.456 MHz / 12, integer)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"GP\">26–28<\/td>\n<td data-label=\"Use\">ADC: mux A/B/C<\/td>\n<td data-label=\"GP\">22<\/td>\n<td data-label=\"Use\">I2S DOUT (to codec)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>74HC595 outputs:<\/strong> Q0 gate, Q1/Q2 status LED R/G, Q3 not-in-control LED, Q4 LM386 enable, Q5 sensor-LDO enable, Q6–Q7 spare.<\/p>\n<p><strong>Total: 26 of 26. It fits with 0 spare,<\/strong> confirming <code>single-chip-research.md<\/code> §1.6.<\/p>\n<h3>2.2 Hazards in the Pico plan<\/h3>\n<ol>\n<li><strong>595 power-up state.<\/strong> The 595's output register comes up random. Q5 (sensor-LDO P-FET) could switch the 150–250 mA sensor load on at power-up, which is exactly the boost-stall case <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> §v1.6 sequences against.\n   - The fix without a pin: an RC on /OE (≈ 100 k / 1 µF, ≈ 100 ms) holding the outputs Hi-Z, with pull-ups/pull-downs setting safe states, and firmware loading the 595 before the RC times out.\n   - That needs the Pico 2 boot-to-main time to come in under ≈ 50 ms (UNVERIFIED; measure it in the §6 spike).<\/li>\n<li><strong>SGTL5000 PLL mode forces the codec to be I2S master<\/strong> (datasheet p. 32). Either feed a synchronous MCLK (256 × fs) from GPOUT0, as above, or run the PIO as I2S slave.<\/li>\n<li><strong>RP2350 A2 erratum E9<\/strong> (internal pull-downs latch; noted for the Pico Plus 2 in <code>single-chip-research.md<\/code> §1.3). Use external resistors on the count and MIDI inputs. Whether current Pico 2 stock has the fix is UNVERIFIED.<\/li>\n<\/ol>\n<h3>2.3 What doesn't fit on the Pico<\/h3>\n<ul>\n<li><strong>Filter-scale cal count input (4th counter): no pin.<\/strong> Workaround [ENG]: wire-OR the filter comparator and VCO 3's square into GP4 through two open-collector stages enabled by 595 Q6/Q7. During filter cal, VCO 3 is gated off.<\/li>\n<li><strong>TRS MIDI out: no pin.<\/strong> The 595 can't run a UART. To get it: the Pico Plus 2's extra GPIO (which pins are UNVERIFIED), or swap the SGTL5000 for PCM1808 + PCM5102A, which has no I2C and frees GP8/GP9.<\/li>\n<li><strong>No spare for anything added at schematic capture.<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>3. Audio quality (the owner's priority)<\/h2>\n<h3>3.1 Converter datasheet figures<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>SGTL5000<\/strong> (Teensy shield Rev D)<\/th>\n<th><strong>PCM3060<\/strong> (Rev 7, Seed2 DFM)<\/th>\n<th><strong>TAC5242<\/strong> (Seed3)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Source<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\"><a href=\"https://pjrc.com/teensy/SGTL5000.pdf\" rel=\"noopener\" target=\"_blank\">NXP datasheet (PJRC copy)<\/a><\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\"><a href=\"https://www.ti.com/lit/gpn/PCM3060\" rel=\"noopener\" target=\"_blank\">TI datasheet<\/a><\/td>\n<td data-label=\"TAC5242 (Seed3)\"><a href=\"https://ti.com/lit/gpn/TAC5242\" rel=\"noopener\" target=\"_blank\">TI datasheet<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">ADC SNR / DR<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\"><strong>85 dB<\/strong> at 1.8 V; <strong>90 dB<\/strong> at 3.3 V (−60 dB input) (pp. 7–8)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\"><strong>99 dB<\/strong> typ (95 min), A-wtd, 48 kHz (p. 4)<\/td>\n<td data-label=\"TAC5242 (Seed3)\"><strong>110 dB<\/strong> single-ended; 119 dB differential (A-wtd, 3.3 V)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">ADC THD+N<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\"><strong>−72 dB<\/strong> at 3.3 V (p. 8)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\"><strong>−93 dB<\/strong> (p. 4)<\/td>\n<td data-label=\"TAC5242 (Seed3)\"><strong>−98 dB<\/strong> (differential, −1 dBFS)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">DAC SNR / DR (line out)<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\"><strong>100 dB<\/strong> at 3.3 V, 95 dB at 1.8 V (pp. 7–8)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\"><strong>103–104 dB<\/strong> single-ended (p. 5)<\/td>\n<td data-label=\"TAC5242 (Seed3)\"><strong>111 dB<\/strong> single-ended; 120 dB differential<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">DAC THD+N<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\"><strong>−85 dB<\/strong> (pp. 7–8)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\"><strong>−93 dB<\/strong> single-ended (p. 5)<\/td>\n<td data-label=\"TAC5242 (Seed3)\"><strong>−96 dB<\/strong> single-ended<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Line-in full scale<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\">2.83 Vpp at 3.3 V VDDA; 1.60 Vpp at 1.8 V (p. 6); 29 kΩ<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\">0.6·VCC = 3 Vpp at 5 V<\/td>\n<td data-label=\"TAC5242 (Seed3)\">1 Vrms single-ended (≈ 2.83 Vpp)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Line-out full scale<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\">2.61 Vpp at 3.3 V; 320 Ω out, ≥ 10 kΩ load (p. 6)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\">0.8·VCC = 4 Vpp single-ended<\/td>\n<td data-label=\"TAC5242 (Seed3)\">1 Vrms single-ended<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Word length / rates<\/td>\n<td data-label=\"SGTL5000 (Teensy shield Rev D)\">16/20/24/32-bit I2S; 8–96 kHz; <strong>48 kHz supported<\/strong> (pp. 12–13, 32)<\/td>\n<td data-label=\"PCM3060 (Rev 7, Seed2 DFM)\">16/24-bit; ADC 16–96 kHz, DAC to 192 kHz<\/td>\n<td data-label=\"TAC5242 (Seed3)\">24/32-bit; 8–192 kHz<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Notes:<\/strong>\n- <strong>Seed board-level figures:<\/strong> the Seed's audio pins are single-ended, so the single-ended columns apply.\n  - The \"−120 dB\" in an Electrosmith email matches the TAC5242's <em>differential<\/em> figure, not what the Seed pins will deliver (UNVERIFIED).\n  - A Seed3 user measured a \"lower noise floor\" than the old Seed (PedalPCB thread, Jul 29 2026).\n  - The older Seed datasheet gives AC-coupled inputs, 3.6 Vpp (≈ 1 Vrms) full scale, ≈ 30 kΩ in, ≈ 100 Ω line out (datasheet v1.0.5, pre-Seed3).\n- <strong>SGTL5000 VDDA on the PJRC shield<\/strong> (1.8 V or 3.3 V) is UNVERIFIED. The difference is 5 dB on the ADC. PJRC states only \"16 bit, 44.1 kHz … CD quality\" (<a href=\"https://www.pjrc.com/store/teensy3_audio.html\" rel=\"noopener\" target=\"_blank\">PJRC<\/a>).\n- <strong>The SGTL5000's headphone output uses a virtual ground<\/strong> (its HP_VGND pin). Don't tie it to system ground; use LINE OUT only. PJRC does warn about this, but the page wasn't re-read this session (UNVERIFIED).\n- <strong>Earlier Seeds:<\/strong> WM8731 (Rev 5), with forum reports of a ≈ 13 dB higher noise floor (thread title only, UNVERIFIED); AK4556 (Rev 4). Avoid used Rev 5 boards.<\/p>\n<h3>3.2 What it means for this synth (wet path only; dry stays analog) [CALC + ESTIMATE]<\/h3>\n<p><strong>ADC → DSP → DAC chain noise<\/strong> (power sum, 3.3 V supplies, single-ended):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Codec<\/th>\n<th>Chain noise re full scale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Codec\">SGTL5000<\/td>\n<td data-label=\"Chain noise re full scale\"><strong>−89.6 dB<\/strong> (−85 dB if VDDA is 1.8 V)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Codec\">PCM3060<\/td>\n<td data-label=\"Chain noise re full scale\"><strong>−97.5 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Codec\">TAC5242<\/td>\n<td data-label=\"Chain noise re full scale\"><strong>−107.5 dB<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Referred to the dry signal's peak:<\/strong>\n- Scale the synth so its hottest patch (full EMPHASIS, overdriven mixer) peaks at −6 dBFS.\n- The wet return is at −6 dB.\n- <strong>Worst case:<\/strong> TAPE repeats near runaway, where noise recirculates at a gain of 1/(1−g²): +7 dB at g = 0.9, +12 dB at g = 0.97. Add a long HALL tail on top: ≈ +10 dB.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Codec<\/th>\n<th>Typical<\/th>\n<th>Worst case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Codec\">SGTL5000<\/td>\n<td data-label=\"Typical\"><strong>−90 dB<\/strong><\/td>\n<td data-label=\"Worst case\"><strong>−80 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Codec\">PCM3060<\/td>\n<td data-label=\"Typical\"><strong>−98 dB<\/strong><\/td>\n<td data-label=\"Worst case\"><strong>−88 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Codec\">TAC5242<\/td>\n<td data-label=\"Typical\"><strong>−108 dB<\/strong><\/td>\n<td data-label=\"Worst case\"><strong>−98 dB<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Against the analog voice's own floor<\/strong> (≈ −80 to −90 dB re peak; ESTIMATE, not measured):\n- <strong>SGTL5000:<\/strong> in the worst case it sits <em>at<\/em> the voice's own hiss, so tails in quiet passages get audibly noisier (≈ +3 dB of hiss). Its −72 dB ADC THD is inaudible under a reverb but is the weakest link for a CLEAN echo.\n- <strong>PCM3060:<\/strong> sits 8–18 dB under the voice's hiss. Inaudible.\n- <strong>TAC5242:<\/strong> sits 18–28 dB under. Inaudible.<\/p>\n<p><strong>Mitigation on either platform [ENG]: a gate-aware input mute.<\/strong> The MCU knows when the VCA is closed, so it can ramp the FX <em>input<\/em> to zero between notes while tails ring on. No new ADC noise enters during silence. This narrows, but doesn't close, the SGTL5000 gap during held notes.<\/p>\n<p><strong>Analog interface (same for both):<\/strong>\n- One TL072 stage sets the level to ≈ −6 dBFS peak at the codec's full scale (2.6–3 Vpp), with soft diode clipping ahead of the ADC.\n- The delta-sigma ADCs need only a simple RC anti-alias filter. Add an RC after the DAC to strip out-of-band noise before the output mixer and LM386.\n- TL072 noise (≈ 18 nV/√Hz → ≈ 2.5 µV in band) is ≈ 25 dB below even the SGTL5000's ≈ 56 µV floor [CALC], so it's not a factor.\n- On the Daisy, return the codec's AGND (pin 20) to the analog star point. The shield has only one GND.\n- <strong>Keep the dry path analog and never switched<\/strong> (<code>single-chip-research.md<\/code> §5.1). It costs nothing and removes latency and converter colour from the dry sound on both platforms.<\/p>\n<h3>3.3 Processing headroom: float on both<\/h3>\n<ul>\n<li><strong>Both use 32-bit float in the DSP:<\/strong><\/li>\n<li>The RP2350's M33 has a single-precision FPU.<\/li>\n<li>The H750's M7 has a double-precision FPU, but float32 is the norm in DaisySP.<\/li>\n<li>Float32 gives a 24-bit mantissa (≈ 144 dB per operation) and an 8-bit exponent, so neither will clip internally. Fixed vs float is <strong>not<\/strong> a difference between A and B.<\/li>\n<li><strong>The real difference is storage:<\/strong><\/li>\n<li>Pico RAM forces <strong>16-bit delay-line storage<\/strong> (<code>single-chip-research.md<\/code> §1.3). That's a −96 dBFS quantisation floor per pass, under the SGTL5000's own floor, so it's acceptable with that codec. In recirculating reverb tanks it adds a little noise per pass. Mutable's 16-bit-storage reverbs show it can sound good [ENG].<\/li>\n<li>The Daisy can store everything as float.<\/li>\n<li>Paired with a 107 dB TAC5242, 16-bit storage <em>would<\/em> become the limit. That's another reason the better codec only pays off with Daisy-class RAM.<\/li>\n<\/ul>\n<h3>3.4 CPU and memory for top-quality algorithms (48 kHz, float32) [ESTIMATE]<\/h3>\n<p>Budgets:\n- <strong>Pico core 1:<\/strong> 3,125 cycles/sample at 150 MHz, ≈ 2–3 cycles per multiply-accumulate.\n- <strong>Daisy:<\/strong> 8,333 cycles/sample at 400 MHz (10,000 at 480). The M7 is dual-issue, so ≈ 1–1.5 cycles per multiply-accumulate with buffers in SRAM/TCM.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Algorithm (quality version)<\/th>\n<th>Work per sample (stereo out)<\/th>\n<th>Working memory<\/th>\n<th><strong>Pico core 1<\/strong><\/th>\n<th><strong>Daisy<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Algorithm (quality version)\">Tape echo (cubic read, wow/flutter, saturation, filters)<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 150–250 cyc (Pico)<\/td>\n<td data-label=\"Working memory\">4 s float = 768 KB; 16-bit = 384 KB<\/td>\n<td data-label=\"Pico core 1\">5–8 %; <strong>≈ 3.8 s max<\/strong> at 16-bit<\/td>\n<td data-label=\"Daisy\">≈ 1–2 %; <strong>minutes<\/strong> (SDRAM)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\">Multi-head tape (RE-201-style, 3 heads + spring)<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 400–600<\/td>\n<td data-label=\"Working memory\">≈ 1 s × 3 heads share one buffer<\/td>\n<td data-label=\"Pico core 1\">13–19 %, fits<\/td>\n<td data-label=\"Daisy\">≈ 3 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\">Dattorro plate<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 300–450<\/td>\n<td data-label=\"Working memory\">≈ 36 k samples: 72 KB (16-bit) / 144 KB (float)<\/td>\n<td data-label=\"Pico core 1\">10–15 %, fits at 16-bit<\/td>\n<td data-label=\"Daisy\">≈ 2–3 %, float<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\">FDN hall, 8 lines<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 400–600<\/td>\n<td data-label=\"Working memory\">≈ 0.75–1.5 s total: 72–144 KB (16-bit)<\/td>\n<td data-label=\"Pico core 1\">13–19 %, fits at 16-bit<\/td>\n<td data-label=\"Daisy\">≈ 3–4 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\"><strong>Long hall: FDN-16, long predelay, stereo, float<\/strong><\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 1,200–1,800<\/td>\n<td data-label=\"Working memory\">≈ 1.5 s + 0.5 s predelay ≈ 380 KB float<\/td>\n<td data-label=\"Pico core 1\"><strong>38–58 %, and RAM doesn't fit next to an echo<\/strong><\/td>\n<td data-label=\"Daisy\">≈ 8–12 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\"><strong>CloudSeed-class<\/strong> (8 late lines, 6-stage modulated diffusers per line, 30-tap multitap, stereo)<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 3,000–4,000 ops → 7–10 k cyc (Pico) / 3.5–5 k (Daisy)<\/td>\n<td data-label=\"Working memory\">≈ 1–3 MB float<\/td>\n<td data-label=\"Pico core 1\"><strong>≈ 220–330 %: doesn't run, doesn't fit<\/strong><\/td>\n<td data-label=\"Daisy\"><strong>≈ 40–60 %: runs, with buffers in SDRAM; full-size presets may not<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\">Shimmer (plate + 2-grain pitch shift)<\/td>\n<td data-label=\"Work per sample (stereo out)\">≈ 550–750<\/td>\n<td data-label=\"Working memory\">+ ≈ 40 KB<\/td>\n<td data-label=\"Pico core 1\">18–24 %<\/td>\n<td data-label=\"Daisy\">≈ 4 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Algorithm (quality version)\">Long looper / reverse / freeze echo (&gt; 10 s)<\/td>\n<td data-label=\"Work per sample (stereo out)\">small<\/td>\n<td data-label=\"Working memory\">≥ 1.9 MB<\/td>\n<td data-label=\"Pico core 1\"><strong>no<\/strong><\/td>\n<td data-label=\"Daisy\">yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Reading:<\/strong>\n- <strong>What the Pico can do well:<\/strong> its four planned types (TAPE/BBD/CLEAN + PLATE/HALL/SPRING/SHIMMER at single-hall size), at 16-bit storage, with ≈ 3.8 s of echo.\n- <strong>What it can't do:<\/strong> a lush long hall in float, CloudSeed, long or multi-feature tape delays, or several of these at once.\n- <strong>What the Daisy can do:<\/strong> all of them, with headroom left for running echo + big reverb + modulation at the same time.<\/p>\n<p><strong>Daisy caveats:<\/strong>\n- The H750 has <strong>128 KB of internal flash<\/strong>. A large program runs from QSPI (XIP) or is copied to the 512 KB AXI SRAM by the Daisy bootloader, which takes RAM from the reverbs. Plan reverb buffers in D2 SRAM and SDRAM accordingly [ENG].\n- Random access to SDRAM is slower than SRAM. Keep the dense reverb taps in SRAM and long linear buffers in SDRAM.<\/p>\n<h3>3.5 Does a Pimoroni Pico Plus 2 (8 MB PSRAM) close the gap? [ENG/ESTIMATE]<\/h3>\n<ul>\n<li><strong>Echo length: yes.<\/strong><\/li>\n<li>8 MB ≈ 87 s at 16-bit (<code>single-chip-research.md<\/code> §1.3).<\/li>\n<li>Echo access is sequential (1 write and ≈ 4 adjacent reads per sample, mostly in one cache line), so cache stalls stay at a few percent.<\/li>\n<li>Block DMA of 32-sample chunks avoids the cache altogether.<\/li>\n<li><strong>Reverb quality: no.<\/strong><\/li>\n<li>Assume QSPI PSRAM at ≈ 75 MHz (UNVERIFIED clock). An uncached random 32-bit read is command + address + wait + data ≈ 20+ clocks ≈ 0.3 µs.<\/li>\n<li>A float hall/CloudSeed with ≈ 40–50 scattered taps per sample needs ≈ 2–2.4 M random accesses/s, which is ≈ 0.6–0.7 s of stall per second. That's on top of the 16 KB XIP cache shared with code.<\/li>\n<li>So reverbs stay in the 520 KB SRAM, and the Pico's limits on reverb size and float storage remain.<\/li>\n<li><strong>CPU:<\/strong> unchanged at 150 MHz. CloudSeed still doesn't run.<\/li>\n<li><strong>Converter:<\/strong> unchanged (still the SGTL5000).<\/li>\n<\/ul>\n<p>The Plus 2 also adds GPIO via its connectors (which pins: UNVERIFIED) and carries the E9 pull-down caveat.<\/p>\n<hr />\n<h2>4. Recommendation (audio weighted highest)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Criterion<\/th>\n<th>Weight<\/th>\n<th>Pico 2 + SGTL5000<\/th>\n<th>Daisy Seed (Seed3 / Seed2 DFM)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Criterion\">Converter noise and distortion (wet)<\/td>\n<td data-label=\"Weight\"><strong>Highest<\/strong><\/td>\n<td data-label=\"Pico 2 + SGTL5000\">85–90 dB ADC, −72 dB THD: at the voice's floor in the worst case<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">99–110 dB, −93 to −98 dB: inaudible<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">DSP and memory for \"great models, several types\"<\/td>\n<td data-label=\"Weight\"><strong>High<\/strong><\/td>\n<td data-label=\"Pico 2 + SGTL5000\">Good plate/spring/small hall/tape at 16-bit, ≈ 3.8 s echo<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">Float everything, CloudSeed-class, long halls, minutes of echo<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">Pins<\/td>\n<td data-label=\"Weight\">Medium<\/td>\n<td data-label=\"Pico 2 + SGTL5000\">26/26 with a 595; filter-cal counter and MIDI out don't fit; 595 power-up hazard<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">26/31, no expander, 4th counter and MIDI out free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">Cost<\/td>\n<td data-label=\"Weight\">Medium<\/td>\n<td data-label=\"Pico 2 + SGTL5000\">≈ $15.55 + $0.50<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\"><strong>$34.99 (≈ +$19)<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">Power<\/td>\n<td data-label=\"Weight\">Medium<\/td>\n<td data-label=\"Pico 2 + SGTL5000\">≈ +0.1–0.25 W<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">≈ +0.4–0.8 W (ESTIMATE): runtime ≈ −10–20 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">Firmware<\/td>\n<td data-label=\"Weight\">Low–medium<\/td>\n<td data-label=\"Pico 2 + SGTL5000\">Control side as planned + audio core<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">Control drivers ported to timers/DMA (≈ 1 weekend); audio framework turnkey<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Criterion\">Supply<\/td>\n<td data-label=\"Weight\">Medium<\/td>\n<td data-label=\"Pico 2 + SGTL5000\">Low risk<\/td>\n<td data-label=\"Daisy Seed (Seed3 / Seed2 DFM)\">Seed3 in production since Jul 2026; prices rose Nov 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pick: Daisy Seed as the single digital chip.<\/strong>\n- It is the better audio engine on every measured axis, and it removes the Pico plan's 0-spare pin squeeze and the 595 power-up hazard.\n- <strong>Buy a Seed3 or a 65 MB Seed2 DFM. Avoid used Rev 5 (WM8731) boards.<\/strong>\n- Keep the MCP4822s for pitch, and keep the dry path analog.<\/p>\n<p><strong>Gate before layout:<\/strong> re-aim the one-evening spike in <code>single-chip-research.md<\/code> §6 at the Daisy:\n- TIM5 capture ×4 on a function generator;\n- a timer + DMA CD4067 scan at 4 kHz/key;\n- Dattorro + tape echo running;\n- then measure codec output noise with the synth's level stage.<\/p>\n<p><strong>If the owner won't take +$19 / +0.5 W:<\/strong> stay on the Pico, but replace the SGTL5000 with <strong>PCM1808 + PCM5102A<\/strong>.\n- <strong>Converter:<\/strong> PCM1808 ≈ 99 dB ADC and PCM5102A ≈ 112 dB DAC; the PCM1808 figure is UNVERIFIED this session, and the PCM5102A figure is Adafruit's listing as cited in <code>single-chip-research.md<\/code> §1.5. That's ≈ PCM3060-class.\n- <strong>Pins:<\/strong> it frees GP8/GP9 for the filter counter and MIDI out.\n- <strong>What doesn't change:<\/strong> DSP and memory limits are as in §3.4.\n- <strong>Sourcing:<\/strong> the PCM1808 module is marketplace-only.<\/p>", "lead": "Status: rev 0, 2026-11-13. Answers the owner: \"Check the pin thing. Audio feels the most important since we're introducing digital stuff.\" Compares (A) Pico 2 + Teensy Audio Shield Rev D (SGTL5000) + 74HC595 (single-chip-research.md §1.6) w", "jump": ["0. Bottom line", "1. Daisy Seed pin check", "2. Pico 2 + SGTL5000 shield + 74HC595 pin check", "3. Audio quality (the owner's priority)", "4. Recommendation (audio weighted highest)"], "code": "D-031", "causedBy": "Check the pin thing. Audio feels the most important since we're introducing digital stuff"}, "D-032": {"kind": "doc", "sub": "doc", "title": "Daisy Seed, from first principles", "stage": "Spec", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "rev 0 · 13 Nov"}], "path": "eng/daisy-first-principles.md", "html": "<h1>Daisy Seed, from first principles: every subsystem it touches<\/h1>\n<p>Status: rev 0, 2026-11-13. Answers the owner (<a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>, after \"Switch to Daisy Seed\"): \"Also the key thing you need to port - go back to first principles and see if there's a better way with Daisy seed. Do this with all the things Daisy seed affects\".<\/p>\n<p><strong>Scope.<\/strong> For each subsystem the Seed touches, this doc works through four steps:\n1. what the job fundamentally needs;\n2. the best Daisy-native way to do it;\n3. how that compares with the Pico-era design (<a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> rev 12, <code>velocity-and-keys-v2.md<\/code>, <code>single-chip-research.md<\/code>) and with the straight port (<a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §1.4);\n4. a recommendation.<\/p>\n<p><strong>What doesn't change.<\/strong> The voice stays analog, as the owner decided: VCOs, ladder, contours, VCA, noise, and osc 3 as the LFO.<\/p>\n<p><strong>Conventions<\/strong> as in <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a>:\n- A link means I read the source this session.\n- <strong>UNVERIFIED<\/strong> = a source exists but I couldn't confirm the figure.\n- <strong>ESTIMATE<\/strong> = my number.\n- [ENG] = engineering judgement. [CALC] = arithmetic.<\/p>\n<p><strong>Sources read this session:<\/strong>\n- <strong>Seed datasheet:<\/strong> <a href=\"https://www.electrokit.com/upload/product/41020/41020659/Daisy_Seed_datasheet_v1.0.5.pdf\" rel=\"noopener\" target=\"_blank\">Daisy Seed datasheet v1.0.5<\/a>, cited as \"Seed DS\".\n- <strong>H750 datasheet:<\/strong> <a href=\"https://cdn.sparkfun.com/assets/b/6/0/6/b/stm32h750ib.pdf\" rel=\"noopener\" target=\"_blank\">STM32H750 datasheet DS12556<\/a>, cited as \"H750 DS\". Its rev Y tables were the ones I could read.\n- <strong>ADC app note:<\/strong> <a href=\"https://www.st.com/resource/en/application_note/an5354-getting-started-with-16bit-adc-on-stm32h7-mcus-stmicroelectronics.pdf\" rel=\"noopener\" target=\"_blank\">ST AN5354, 16-bit ADC on STM32H7<\/a>.\n- <strong>DAC datasheet:<\/strong> <a href=\"https://people.ece.cornell.edu/land/courses/ece4760/PIC32/Microchip_stuff/MCP4822_DAC.pdf\" rel=\"noopener\" target=\"_blank\">MCP4822 datasheet<\/a>.\n- <strong>Hall sensor datasheet:<\/strong> <a href=\"https://atom.ubbcluj.ro/alpar/datasheets/sensors_actuators/Honeywell%20SS49E.pdf\" rel=\"noopener\" target=\"_blank\">Honeywell SS49E<\/a>.\n- <strong>libDaisy USB:<\/strong> <a href=\"https://electro-smith.github.io/libDaisy/class_usb_handle.html\" rel=\"noopener\" target=\"_blank\">libDaisy UsbHandle<\/a>.<\/p>\n<hr />\n<h2>0. Bottom line<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Subsystem<\/th>\n<th>Straight port (<a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a>)<\/th>\n<th><strong>Daisy-native recommendation<\/strong><\/th>\n<th>Why it's better<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">1<\/td>\n<td data-label=\"Subsystem\">Keys + velocity<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">3× CD4067, a timer + DMA scan at 4 kHz per key<\/td>\n<td data-label=\"Daisy-native recommendation\"><strong>3× CD74HC4067 on 3 separate ADCs: ADC1 + ADC2 simultaneous for the keys, ADC3 for controls. Hardware-paced at ≈ 8–10 kHz per key with 4× hardware oversampling.<\/strong> Optional Hall <strong>group power-gating<\/strong>, decoded from the mux selects (0 extra pins)<\/td>\n<td data-label=\"Why it&#x27;s better\">Velocity error ≈ 1.0 → ≈ 0.35 MIDI steps at ff (ESTIMATE). Gating could save <strong>≈ 0.45–0.95 W<\/strong>, more than the Daisy costs (bench-gated)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2<\/td>\n<td data-label=\"Subsystem\">Autotune / pitch<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">TIM5 ×4 (3 VCOs + filter comparator)<\/td>\n<td data-label=\"Daisy-native recommendation\"><strong>TIM5 CH1–3 for the VCOs, unchanged, now also closing the loop on held notes. The filter-scale cal moves to the codec's free right input channel.<\/strong> Codec L (the FX send) doubles as the VCA auto-null monitor<\/td>\n<td data-label=\"Why it&#x27;s better\">Timer capture beats the codec for VCOs on every axis. The codec beats the comparator for the filter. Frees D16 and a comparator<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">3<\/td>\n<td data-label=\"Subsystem\">Pots / switches<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">Muxes on the key scan<\/td>\n<td data-label=\"Daisy-native recommendation\">Same 3 muxes. The controls get their own ADC (ADC3). 10 kHz raw → 1 kHz control rate, with oversampling + 1-pole + deadband. Jump-on-move with a \"not in control\" LED<\/td>\n<td data-label=\"Why it&#x27;s better\">46 of 48 channels used. Noise is far below 1 step of any MIDI CC<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">4<\/td>\n<td data-label=\"Subsystem\">CVs<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">2× MCP4822 (pitch ×3 + keytrack) + 3 PWM<\/td>\n<td data-label=\"Daisy-native recommendation\"><strong>4× MCP4822: coarse + fine for each VCO (fine at 1/64), plus keytrack and CUTOFF. The Seed's 2 internal DACs drive velocity and mod depth. One PWM is left, for the static VCA balance<\/strong><\/td>\n<td data-label=\"Why it&#x27;s better\">Pitch steps go from <strong>2.3 cents → ≈ 0.04 cent<\/strong>. <strong>DRIFT needs this<\/strong>: slow wander in 2.3-cent steps would audibly staircase. No PWM ripple on any audible CV. Fixes a gap: <strong>CUTOFF had no CV channel<\/strong> in the Pico-era list. ≈ +$8<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">5<\/td>\n<td data-label=\"Subsystem\">MIDI / USB<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">Seed's internal USB, plus USART1<\/td>\n<td data-label=\"Daisy-native recommendation\"><strong>One rear USB-C:<\/strong> VBUS goes to the charger; D± go to the <strong>Seed's own USB port<\/strong> through a cut cable (Seed VBUS not connected). Gives USB-MIDI and ROM DFU firmware updates on the same port. TRS in on USART1 RX (PB7 is 5 V-tolerant); TRS out optional<\/td>\n<td data-label=\"Why it&#x27;s better\">Matches E3 (\"one port for everything\") with 0 header pins, and keeps D29/D30 free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">6<\/td>\n<td data-label=\"Subsystem\">Effects path<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">VCA out → codec → wet sum<\/td>\n<td data-label=\"Daisy-native recommendation\">Same topology. <strong>The wet return carries no dry copy<\/strong> (otherwise 1–2 ms comb filtering against the analog dry path). Mix in DSP; one fixed analog summing resistor. Gate-aware input mute<\/td>\n<td data-label=\"Why it&#x27;s better\">Dry path is analog and never switched. Latency only touches the wet signal<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">7<\/td>\n<td data-label=\"Subsystem\">Power<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">—<\/td>\n<td data-label=\"Daisy-native recommendation\">Seed ≈ <strong>+0.3–1.0 W<\/strong> over the Pico (ESTIMATE; measure). Run at 400 MHz with WFI idle. Cell voltage on a direct ADC3 pin for a battery gauge and a low-battery warning; optional charger STAT and VBUS-detect pins<\/td>\n<td data-label=\"Why it&#x27;s better\">Runtime ≈ −10 to −30 % without gating. With Hall gating it's ≈ break-even<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">8<\/td>\n<td data-label=\"Subsystem\">Other<\/td>\n<td data-label=\"Straight port (daisy-pin-and-audio-check.md)\">—<\/td>\n<td data-label=\"Daisy-native recommendation\">Store the autotune and key tables in the Seed's QSPI flash, so boot is fast and verified in the background. DRIFT added on the fine DACs inside the closed loop. Mod-VCA feedthrough nulled by measuring pitch on TIM5 (optional)<\/td>\n<td data-label=\"Why it&#x27;s better\">No new parts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pins: 27 required of 31.<\/strong> Up to 3 more are optional (MIDI out, charger STAT, VBUS detect), and D16 is spare (§9).<\/p>\n<p><strong>Parts delta against the straight Daisy port:<\/strong>\n- +2 MCP4822;\n- CD4067 → CD74HC4067;\n- a USB cable to cut;\n- optional 74HC139 + 4 PNP for Hall gating;\n- −2 PWM RC networks;\n- −1 filter comparator.<\/p>\n<p><strong>Net ≈ +$11–15<\/strong> (ESTIMATE).<\/p>\n<p><strong>Risk:<\/strong> low–medium. All of it is firmware on known peripherals, except three bench unknowns:\n- SS49E power-on time (only matters for gating);\n- Seed current draw;\n- the Seed input's AC-coupling corner.<\/p>\n<p><strong>Gate:<\/strong> the breadboard spike in §10 (≈ 2 evenings). Pass before layout.<\/p>\n<hr />\n<h2>1. Key sensing + velocity<\/h2>\n<h3>1.1 What the job needs<\/h3>\n<ul>\n<li><strong>25 position sensors.<\/strong> Hall + magnet under Choc V2 silent switches; the physical keys are locked (<code>velocity-and-keys-v2.md<\/code> §2).<\/li>\n<li><strong>Velocity:<\/strong> a least-squares slope of linearised depth against time, over 15–75 % of a 2.8 mm stroke.<\/li>\n<li>The fastest strike crosses the window in ≈ 1.4 ms at 1 m/s (<code>keys-answers.md<\/code> §3).<\/li>\n<li>Accuracy is set by <strong>samples per stroke × noise per sample<\/strong>.<\/li>\n<li><strong>Note on/off:<\/strong> hysteresis at 0.70 / 0.40 depth, with partial re-strikes (<code>keys-answers.md<\/code> §4).<\/li>\n<li><strong>Latency:<\/strong> &lt; 1 ms from crossing to gate, and &lt; 2 ms for the CV to settle.<\/li>\n<li><strong>Hall-strip power: 150–250 mA (0.6–1.25 W at 5 V via the LDO).<\/strong> This is the largest load in the digital domain (<code>round4-answers.md<\/code> §3.1).<\/li>\n<\/ul>\n<h3>1.2 What the H750 offers<\/h3>\n<ul>\n<li><strong>Three 16-bit ADCs.<\/strong> ADC1 and ADC2 can run in <strong>dual simultaneous mode<\/strong>. Three-ADC operation reaches 10.5 Msps total on BGA packages (AN5354 pp. 16–17).<\/li>\n<li><strong>Rates:<\/strong> 3.6 Msps per ADC on fast channels with BOOST, 2.0 Msps without, 1.0 Msps on slow channels (H750 DS Table 85). The figure is package-dependent (AN5354 p. 15). The Seed's MCU package is UNVERIFIED, but even 1 Msps is ≈ 10× what's needed.<\/li>\n<li><strong>Hardware oversampling 2×–1024×.<\/strong> Measured ENOB is 13.7 bits at 1×, 14.5 at 4× and 15.1 at 16× (differential; AN5354 p. 6). Single-ended at 16-bit: <strong>ENOB 11.6–12 bits, SNR 72–74 dB<\/strong> (H750 DS Table 85).<\/li>\n<li><strong>ADC3 is reachable on two Seed header pins:<\/strong><\/li>\n<li>PC0 = ADC123_INP10 = Seed A0/D15;<\/li>\n<li>PC1 = ADC123_INP11 = Seed A5/D20 (H750 DS Table 7).<\/li>\n<\/ul>\n<p>Every other Seed analog pin is ADC1/ADC2-only. So <strong>three truly parallel conversion paths exist on the header.<\/strong>\n- <strong>Sample capacitor 4 pF; external source impedance up to 50 kΩ<\/strong> (H750 DS Table 85).<\/p>\n<h3>1.3 Options from first principles<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Pins<\/th>\n<th>Per-key rate<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Option\"><strong>No muxes<\/strong><\/td>\n<td data-label=\"Pins\">25 ADC pins needed; only 9 are free after TIM5<\/td>\n<td data-label=\"Per-key rate\">—<\/td>\n<td data-label=\"Verdict\">Impossible on the Seed header<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">External SPI ADCs (4× MCP3208-class DIP, 32 channels)<\/td>\n<td data-label=\"Pins\">4 CS + SPI shared<\/td>\n<td data-label=\"Per-key rate\">≈ 3 kHz (100 ksps parts, ESTIMATE)<\/td>\n<td data-label=\"Verdict\">Worse: 12-bit, slower, ≈ $16 (ESTIMATE). Out<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">8:1 muxes (74HC4051): 4 for keys + 3 for controls<\/td>\n<td data-label=\"Pins\">7 ADC + 3 selects = <strong>10<\/strong><\/td>\n<td data-label=\"Per-key rate\">≈ 20 kHz<\/td>\n<td data-label=\"Verdict\">ADC speed isn't the bottleneck, so it costs 3 pins for nothing. Out<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\"><strong>3× 16:1 (74HC4067), one per ADC (pick)<\/strong><\/td>\n<td data-label=\"Pins\">3 ADC + 4 selects = <strong>7<\/strong><\/td>\n<td data-label=\"Per-key rate\"><strong>≈ 10–20 kHz<\/strong> raw<\/td>\n<td data-label=\"Verdict\">Same pins as the Pico plan; settle time dominates; the rate is far beyond need<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Scan timing [CALC]:<\/strong>\n- <strong>Per step:<\/strong>\n  - mux settle ≈ 1 µs (CD74HC4067 Ron ≈ 70–100 Ω, <code>keys-answers.md<\/code> §3);\n  - then <strong>all three ADCs convert at once<\/strong>: 4× oversampled at ≈ 0.3–0.5 µs per conversion ≈ 1.5–2 µs.\n  - ≈ 3 µs per step in total.\n- <strong>Per frame:<\/strong> 16 steps ≈ 50 µs, so ≈ 20 kHz possible.\n- <strong>Design point: a timer-paced 8–10 kHz frame.<\/strong> That's 2× the Pico design's samples per stroke, each 2× quieter (4× oversampling).\n- <strong>ADC3 slow channel:<\/strong> ADC3 on PC0 is a slow channel (1 Msps; the fast/slow class of INP10 is per AN5354 pp. 7–8, UNVERIFIED for this pin). At 1 Msps it still finishes inside the step without oversampling. Controls get averaged across frames instead (§3).<\/p>\n<p><strong>Velocity accuracy [CALC, scaled from <code>keys-answers.md<\/code> §3 Monte Carlo]:<\/strong>\n- The LS slope error scales as σ/√N:\n  - 2× the samples → ÷1.41;\n  - 4× oversampling halves σ → ÷2.\n- Choc at 1.5 m/s: <strong>1.0 → ≈ 0.35 MIDI steps RMS<\/strong>; at 1.0 m/s, 0.7 → ≈ 0.25.\n- Full 7-bit velocity with margin, and enough for 14-bit high-resolution velocity on USB.\n- <strong>Caveat:<\/strong> the SS49E publishes no noise figure (datasheet p. 1: \"low noise output\", no number). If sensor noise exceeds ADC noise, oversampling buys less. The spike measures it (§10).<\/p>\n<p><strong>Hardware pacing (no CPU in the timing loop) [ENG]:<\/strong>\n- One advanced timer, two compare events:\n  - CC1 fires a DMA write of the next select code to <strong>GPIOC→BSRR<\/strong>. S0–S3 stay on PC9–PC12, all on port C, as in <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §1.4.\n  - CC2, ≈ 1 µs later, triggers ADC1+2 (dual mode) and ADC3.\n- <strong>DMA:<\/strong> ADC1+2 use one stream (packed 32-bit); ADC3 its own.\n- <strong>Firmware traps:<\/strong>\n  - On the H750, ADC3 lives in the D3 domain. Its DMA may need BDMA with buffers in SRAM4. Whether DMAMUX1 also serves ADC3 is UNVERIFIED (check RM0433).\n  - Put all DMA buffers in non-cacheable D2 SRAM (libDaisy's DMA section), or the M7 D-cache serves stale samples.\n- <strong>Sample times:<\/strong> each sample carries the timestamp of its slot (step index × step time). The LS fit uses true times, so skew within a frame costs nothing.<\/p>\n<h3>1.4 Different sensing, now that there's CPU?<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Idea<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Idea\">Continuous position for aftertouch<\/td>\n<td data-label=\"Verdict\"><strong>No.<\/strong> The Halls already track position continuously, but the Choc hits a hard bottom at 2.8 mm. The only \"pressure\" is the silent damper's squish, maybe ≈ 0.1–0.3 mm (UNVERIFIED), which isn't repeatable enough to play. Try it on the bench (§10) as an experimental \"squeeze\"; don't promise it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Idea\">Release velocity<\/td>\n<td data-label=\"Verdict\"><strong>Yes, free.<\/strong> The same slope fit on the up-stroke, sent as MIDI note-off velocity. It can also optionally shorten the contour release (firmware only, no analog change). Owner's call; default off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Idea\">Per-key calibration<\/td>\n<td data-label=\"Verdict\"><strong>Yes, already planned<\/strong>, now better: per-key rest/bottom learning <strong>plus a per-key field-curve LUT and a supply-ratio correction<\/strong>. The Hall LDO rail is read on one mux channel, so the SS49E's supply-proportional output (datasheet p. 1) is divided out against the Seed's ADC reference<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Idea\">Adjustable actuation depth / velocity curve<\/td>\n<td data-label=\"Verdict\">Free firmware settings (via a hold-TAP combination or MIDI)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Idea\">Optical (TCRT5000-class) or capacitive sensing<\/td>\n<td data-label=\"Verdict\">Out. Optical draws similar or higher LED current, and capacitive sensing gives worse velocity resolution. No gain<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1.5 Hall group power-gating (the biggest power win, bench-gated)<\/h3>\n<ul>\n<li><strong>Idea:<\/strong><\/li>\n<li>Split the strip into <strong>4 groups<\/strong> by mux step: (S3, S2) = 00/01/10/11, so each group is 4 steps × 2 key muxes ≤ 8 sensors.<\/li>\n<li>A <strong>74HC139<\/strong> decodes S3/S2 directly into 4 active-low outputs. Each drives a <strong>2N3906 PNP high-side switch<\/strong> (base resistor) feeding its group.<\/li>\n<li><strong>Zero GPIO.<\/strong> Only the group being scanned is powered.<\/li>\n<li><strong>Timing [CALC]:<\/strong><\/li>\n<li>frame = 4 × (T_on + 4 steps × 3 µs);<\/li>\n<li>T_on = 25 µs → 148 µs → <strong>6.8 kHz per key<\/strong> (still above the 4 kHz design number);<\/li>\n<li>T_on = 50 µs → 4.3 kHz.<\/li>\n<li><strong>Saving:<\/strong> sensor duty 25 %, so <strong>≈ 75 % of 0.6–1.25 W ≈ 0.45–0.95 W<\/strong> [CALC]. The LD1117 also runs cool, and the boost-stall risk at power-up shrinks.<\/li>\n<li><strong>Unknown:<\/strong> the SS49E power-on (start-up) time is <strong>not specified<\/strong>. The datasheet gives only a 3 µs response time (p. 2). <strong>Measure it<\/strong> on the spike: power-step a sensor and scope the output settling to 0.1 %.<\/li>\n<li>If it settles in ≤ 50 µs, adopt gating.<\/li>\n<li>If not, leave the decoder and PNPs unfitted, with their footprints on the strip.<\/li>\n<li><strong>PNP drop (≈ 0.1–0.2 V):<\/strong> the ratio correction (§1.4) absorbs it.<\/li>\n<li><strong>Cost ≈ +$0.70<\/strong> (74HC139 ≈ $0.50 + 4 × 2N3906 + resistors; ESTIMATE).<\/li>\n<\/ul>\n<h3>1.6 Recommendation<\/h3>\n<ul>\n<li><strong>Muxes:<\/strong> 3× <strong>CD74HC4067<\/strong> on ADC1 (PC4 / A6), ADC2 (PB1 / A2) and ADC3 (PC0 / A0).<\/li>\n<li><strong>Scan:<\/strong> hardware-paced at an 8–10 kHz frame, 4× oversampling, LS-slope velocity.<\/li>\n<li><strong>Gating:<\/strong> footprints for Hall group gating, fitted if the SS49E power-on test passes.<\/li>\n<li><strong>Against the Pico era:<\/strong><\/li>\n<li>same 7 pins;<\/li>\n<li>2× rate and ½ noise;<\/li>\n<li>a parallel controls ADC;<\/li>\n<li>possibly −0.45 to −0.95 W.<\/li>\n<li><strong>Parts:<\/strong> CD4067 → CD74HC4067, +$0.6–1.2 (ESTIMATE); gating +$0.70 optional.<\/li>\n<li><strong>Risk:<\/strong> L. The DMA plumbing (BDMA for ADC3, cache) is the main firmware trap.<\/li>\n<\/ul>\n<hr />\n<h2>2. Autotune and pitch measurement<\/h2>\n<h3>2.1 What the job needs<\/h3>\n<ul>\n<li><strong>Measure each VCO's frequency<\/strong> across ≈ 8 octaves. Error ≪ 1 cent: target &lt; ±1 cent tracking (<code>architecture.md<\/code> §7 targets).<\/li>\n<li><strong>Fast at boot.<\/strong><\/li>\n<li><strong>Continuous while playing<\/strong>, for drift and background re-tune.<\/li>\n<li><strong>All 3 VCOs<\/strong>, because the mixer levels are analog pots and the firmware <strong>cannot mute<\/strong> an oscillator.<\/li>\n<li><strong>Filter scale:<\/strong> self-oscillation frequency against the keytrack/cutoff CV, ±10 cents over 3 octaves (<code>architecture.md<\/code> §7).<\/li>\n<li><strong>VCA balance:<\/strong> the CV feedthrough step at the VCA output.<\/li>\n<\/ul>\n<h3>2.2 TIM5 input capture vs codec input<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>TIM5 input capture<\/strong> (straight-port plan)<\/th>\n<th><strong>Codec input + DSP pitch detection<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Pins<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">1 per VCO (D25/D24/D28) + 100 k + clamp each<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">0 GPIO <strong>if<\/strong> one signal. For 3 VCOs: a 4:1 analog mux (CD4052) + 2 select GPIO, because a single summed input can't separate 3 unmuteable VCOs reliably<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Resolution<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">Timer clock ≈ 200–240 MHz. At 4 kHz, ≈ 50–60 k counts per period ≈ <strong>0.03 cent per single period<\/strong>. Averaging N periods is better [CALC; clock UNVERIFIED, <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §1.3]<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">Band-limited to &lt; 24 kHz at 48 kHz fs. Sub-sample zero-crossing interpolation: σ_t ≈ noise/slew. At 80 dB SNR that's ≈ 0.03 cent per cycle on a sine [CALC]. Comparable on a clean sine, worse on a square through the decimation filter (ringing) [ENG]<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Simultaneity<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\"><strong>All 3 at once<\/strong>, continuously<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">One at a time through the mux<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Range<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">0.1 Hz (32-bit wraps at ≈ 18 s) up to ≫ 20 kHz<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">≥ the AC-coupling corner (UNVERIFIED, Seed input 30 kΩ, cap unknown) up to ≈ 20 kHz<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Latency<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">One period, plus averaging<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">One audio block plus a window (≈ 10–50 ms)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">CPU<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">≈ 0 (DMA logs edges)<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">Small, but on the audio core<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Interaction with FX<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">None<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">Uses the codec's only free input channel. L carries the synth FX send; R is free (stereo in, Seed DS p. 3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Extra parts<\/td>\n<td data-label=\"TIM5 input capture (straight-port plan)\">Clamp per VCO (already planned)<\/td>\n<td data-label=\"Codec input + DSP pitch detection\">CD4052 + buffer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Verdict:<\/strong>\n- <strong>VCOs → TIM5 CH1–3.<\/strong> It wins on simultaneity, continuity, pins, CPU and range. The codec route is a step backwards for VCOs.\n- <strong>Filter → codec R input.<\/strong> The filter's self-oscillation is a sine, so it needs no comparator. And because <strong>TIM5 already knows all 3 VCO frequencies<\/strong>, the DSP can find the self-oscillation peak <em>even with oscillators audible in the mix<\/em> (the Pico plan's comparator couldn't).\n  - It also measures amplitude, so it can detect resonance onset automatically.\n  - Precision ≈ 0.004 cent over 50 cycles [CALC] against a ±10-cent need.\n  - Cal points ≥ 100 Hz stay clear of the unknown AC-coupling corner.\n- <strong>VCA auto-null → codec L.<\/strong> L is the post-VCA FX send. The feedthrough \"thump\" is a transient, which an AC-coupled input passes. The servo minimises thump energy below ≈ 50 Hz at 24-bit resolution [ENG; method UNVERIFIED].\n  - Fallback: a DC sense on the spare ADC3 pin (D20 is taken by the battery; use mux channel 47 or D16).<\/p>\n<h3>2.3 Closed-loop pitch on held notes (new; needs §4's fine DAC)<\/h3>\n<ul>\n<li><strong>Loop:<\/strong> while a note is held, TIM5 averages ≥ 50 ms of periods per VCO and trims that VCO's <strong>fine<\/strong> DAC toward target + DRIFT offset.<\/li>\n<li>τ ≈ 2 s, step &lt; 0.1 cent: inaudible, and it never locks the VCOs together, because each tracks its own target.<\/li>\n<li><strong>What it corrects:<\/strong><\/li>\n<li>coarse-DAC DNL (±0.75 LSB max, MCP4822 DS p. 3);<\/li>\n<li>reference tempco (45 ppm/°C typ, 160 max over 0–85 °C, p. 4);<\/li>\n<li>thermal drift.<\/li>\n<li><strong>Freeze rule:<\/strong> freeze the loop when period variance shows FM. OSC MOD on, or glide/bend moving, is visible as variance. The firmware can't read the analog OSC MOD toggle, so detect by variance [ENG].<\/li>\n<li><strong>Boot:<\/strong> store per-VCO tables in QSPI flash. At power-on, run a 3-point verify (≈ 0.3 s) instead of a full sweep. Run a full re-sweep only if the verify fails or on request (hold TAP at power-on).<\/li>\n<\/ul>\n<h3>2.4 Recommendation, pins, parts, risk<\/h3>\n<ul>\n<li><strong>Pins:<\/strong><\/li>\n<li>TIM5 CH1–3 on D25, D24, D28.<\/li>\n<li><strong>D16 is freed<\/strong> (TIM5 CH4 reserved as the comparator fallback).<\/li>\n<li>Codec R in = ladder output (pre-VCA) through a TL072 half at −6 dBFS.<\/li>\n<li>Codec L = FX send (§6).<\/li>\n<li><strong>Parts:<\/strong> −1 comparator/clamp, +1 buffer half: <strong>≈ $0<\/strong>.<\/li>\n<li><strong>Risk:<\/strong> L for the VCOs. L–M for codec-based filter cal and the thump servo (new firmware), with the comparator/DC-sense fallbacks kept as footprints.<\/li>\n<li><strong>Against the Pico era:<\/strong> PIO counters ≈ TIM5. The codec adds a better filter cal and a better VCA null for free.<\/li>\n<\/ul>\n<hr />\n<h2>3. Pot and switch scanning<\/h2>\n<h3>3.1 What the job needs<\/h3>\n<p><strong>22 control channels:<\/strong>\n- RANGE ×3;\n- FREQ 2 and FREQ 3;\n- TUNE;\n- GLIDE;\n- CUTOFF;\n- MOD dial;\n- bend X;\n- VELOCITY toggle;\n- 8 FX controls: 5 pots, 2 four-way rotaries, TAP;\n- DRIFT;\n- Hall-rail monitor.<\/p>\n<p>Battery goes direct (§7). With 25 keys that's <strong>46 of 48 mux channels, 2 spare<\/strong>.<\/p>\n<p><strong>Requirements:<\/strong>\n- no audible zipper on CUTOFF;\n- no jitter-driven MIDI CC spam;\n- jump-on-move for MIDI-controllable parameters;\n- ≤ 5 ms response.<\/p>\n<h3>3.2 Daisy-native design [ENG]<\/h3>\n<ul>\n<li><strong>Mux layout:<\/strong><\/li>\n<li><strong>Mux C (ADC3) carries 16 controls.<\/strong><\/li>\n<li>The other 6 controls, plus the Hall-rail monitor, ride mux B (ADC2) channels 9–15, after keys 17–25.<\/li>\n<li>Every control is sampled every frame (8–10 kHz).<\/li>\n<li><strong>Signal chain per control:<\/strong>\n  1. average 8–10 frames → 1 kHz;\n  2. 1-pole smoother (τ ≈ 5–10 ms; ≈ 2 ms for CUTOFF and bend);\n  3. a <strong>deadband of ≈ 0.1 % FS<\/strong> for change detection and MIDI CC output.<\/li>\n<li><strong>Effective resolution:<\/strong> ≈ 12 ENOB single-ended (H750 DS Table 85) plus averaging → ≈ 14 bits [CALC]. That's 100× finer than 7-bit CC and supports 14-bit CC.<\/li>\n<li><strong>Hardware:<\/strong><\/li>\n<li>10–100 nF at each pot wiper. With a 10 k pot (≤ 2.5 kΩ source) it's ≤ 250 µs: an HF filter, and a charge reservoir for the 4 pF sample cap.<\/li>\n<li><strong>No cap on the Hall channels<\/strong> (velocity bandwidth).<\/li>\n<li>Lay out pot wiring away from the key-mux outputs.<\/li>\n<li><strong>Rotary TYPE switches and the VELOCITY toggle:<\/strong> resistor ladders with ±⅓-step windows, 20 ms debounce, and hysteresis.<\/li>\n<li><strong>TAP:<\/strong> a mux channel with a pull-up and 5 ms debounce. Also the boot gesture (full autotune / DFU) and the filter-cal gesture (EMPHASIS full + hold TAP).<\/li>\n<li><strong>Jump-on-move:<\/strong><\/li>\n<li>When MIDI (or a stored state) sets a parameter, its pot goes \"not in control\" and the LED lights.<\/li>\n<li>It retakes control once it moves &gt; 1.5 % from where it was when control was lost, then jumps to the pot's position. This is the owner's \"jump-on-move\".<\/li>\n<li>Knob-only controls send no MIDI; MIDI never flips switches (owner rules).<\/li>\n<li><strong>Against the Pico era:<\/strong> same 3 muxes and same pins. The controls now get their own converter, so key timing and control reads never contend.<\/li>\n<li><strong>Risk:<\/strong> L. <strong>Cost:<\/strong> caps ≈ $0.30.<\/li>\n<\/ul>\n<hr />\n<h2>4. CV generation<\/h2>\n<h3>4.1 What the job needs<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>CV<\/th>\n<th>Accuracy needed<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"CV\">VCO 1–3 pitch<\/td>\n<td data-label=\"Accuracy needed\">≈ 0.2 cent steps over ≈ 8 octaves for smooth glide, bend and <strong>DRIFT<\/strong>; ±1 cent absolute after autotune<\/td>\n<td data-label=\"Notes\">1 mV at the expo ≈ 1.2 cents (<code>answers-E1-E10.md<\/code>). DRIFT is a slow wander of a few cents, so steps of 2.3 cents would be audible stairs<\/td>\n<\/tr>\n<tr>\n<td data-label=\"CV\">Filter keytrack<\/td>\n<td data-label=\"Accuracy needed\">12-bit is fine (≈ 6 cents per step on a filter, <code>architecture-v2.md<\/code>)<\/td>\n<td data-label=\"Notes\">Through the KEYBOARD CONTROL toggle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"CV\"><strong>CUTOFF<\/strong> (pot / MIDI CC + velocity offset)<\/td>\n<td data-label=\"Accuracy needed\">12-bit with slew<\/td>\n<td data-label=\"Notes\"><strong>Gap found:<\/strong> the Pico-era channel list had no CV for CUTOFF (<code>velocity-and-keys-v2.md<\/code> §1.1 flagged it UNVERIFIED; <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> lists only 3 PWMs)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"CV\">Velocity (AS3360 B)<\/td>\n<td data-label=\"Accuracy needed\">10-bit, settles &lt; 1 ms, no ripple<\/td>\n<td data-label=\"Notes\">Audible as gain<\/td>\n<\/tr>\n<tr>\n<td data-label=\"CV\">Mod depth (AS3360 A)<\/td>\n<td data-label=\"Accuracy needed\">10-bit, low noise<\/td>\n<td data-label=\"Notes\">Audible as modulation depth<\/td>\n<\/tr>\n<tr>\n<td data-label=\"CV\">VCA balance<\/td>\n<td data-label=\"Accuracy needed\">Static DC trim<\/td>\n<td data-label=\"Notes\">Set at autotune<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>4.2 Options<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Facts<\/th>\n<th>Fit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Source\"><strong>MCP4822<\/strong> (12-bit, SPI)<\/td>\n<td data-label=\"Facts\">DNL ±0.2 typ / ±0.75 max LSB, <strong>monotonic<\/strong>; INL ±2 typ / ±12 max; ref 2.048 V, 45 ppm/°C typ; 1.2 µV/√Hz; 4.5 µs settling; 20 MHz SPI (DS pp. 3–4)<\/td>\n<td data-label=\"Fit\">Pitch: 2.3 cents per step over 8 octaves, so it needs coarse + fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Source\"><strong>Seed internal DAC<\/strong> (2 ch, PA4/PA5)<\/td>\n<td data-label=\"Facts\">DNL <strong>±2 LSB typ<\/strong>, INL ±4 typ; SNR 67.8 dB / ENOB 10.9; 1.7 µs settling; buffer-off range 0–VREF+ at ≤ 50 pF (H750 DS Tables 87–88). Reference = the Seed's 3V3A<\/td>\n<td data-label=\"Fit\"><strong>Not for pitch:<\/strong> non-monotonic risk, and the reference is a supply. <strong>Good for velocity and mod depth:<\/strong> no ripple, instant, 0 parts<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Source\">PWM (TIM3) + 2-pole RC<\/td>\n<td data-label=\"Facts\">Amplitude = the MCU's digital 3.3 V (noisy); ripple vs settling trade (<code>velocity-and-keys-v2.md<\/code> §1.1)<\/td>\n<td data-label=\"Fit\">Fine for a static DC trim (VCA balance). Avoid it on audible CVs now that better is free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Source\">Dithered 12-bit + RC + TIM5 loop<\/td>\n<td data-label=\"Facts\">Sub-LSB on average, but <strong>continuous 48 kHz SPI traffic<\/strong> next to analog CV lines, plus a pitch-CV RC lag<\/td>\n<td data-label=\"Fit\">Rejected: it trades a known noise source for resolution [ENG]<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Source\">16-bit through-hole DAC (LTC1655 DIP-8 class)<\/td>\n<td data-label=\"Facts\">1 channel per chip; price UNVERIFIED (≈ $10–15 ESTIMATE)<\/td>\n<td data-label=\"Fit\">3 chips ≈ $30–45. Coarse + fine with the TIM5 loop gets equal results for ≈ $8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>4.3 Recommendation [ENG]<\/h3>\n<p><strong>Allocation:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chip / source<\/th>\n<th>Ch A<\/th>\n<th>Ch B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Chip / source\">MCP4822 #1<\/td>\n<td data-label=\"Ch A\">VCO 1 coarse<\/td>\n<td data-label=\"Ch B\">VCO 1 fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">MCP4822 #2<\/td>\n<td data-label=\"Ch A\">VCO 2 coarse<\/td>\n<td data-label=\"Ch B\">VCO 2 fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">MCP4822 #3<\/td>\n<td data-label=\"Ch A\">VCO 3 coarse<\/td>\n<td data-label=\"Ch B\">VCO 3 fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">MCP4822 #4<\/td>\n<td data-label=\"Ch A\">Filter keytrack<\/td>\n<td data-label=\"Ch B\"><strong>CUTOFF<\/strong> (+ velocity offset in firmware)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">Seed DAC1_OUT1 (D23, PA4)<\/td>\n<td data-label=\"Ch A\">Velocity → AS3360 B (buffer off → TL072 scale/RC)<\/td>\n<td data-label=\"Ch B\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">Seed DAC1_OUT2 (D22, PA5)<\/td>\n<td data-label=\"Ch A\">Mod depth → AS3360 A<\/td>\n<td data-label=\"Ch B\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Chip / source\">TIM3_CH3 PWM (D4, PC8)<\/td>\n<td data-label=\"Ch A\">VCA balance (static; heavy RC, ≈ 10 Hz)<\/td>\n<td data-label=\"Ch B\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Fine channel:<\/strong>\n- It sums into each VCO's CV summer through a resistor <strong>64×<\/strong> the coarse one (e.g. 100 k : 6.8 M, any value, calibrated).\n- Fine span ≈ 64 coarse LSB ≈ 150 cents, so <strong>fine LSB ≈ 0.036 cent<\/strong> [CALC].\n- TIM5 measures the fine scale at autotune. Coarse DNL and reference drift are trimmed out by the held-note loop (§2.3).\n- <strong>DRIFT = a firmware random walk on the fine channel<\/strong>, inside the loop, so 0 really is rock steady.<\/p>\n<p><strong>Updates:<\/strong>\n- at control rate (1–2 kHz) and only when values change: glide, bend and drift tick at ≤ 2 kHz;\n- LDAC tied low;\n- one SPI bus, 4 CS.<\/p>\n<p><strong>Supply check:<\/strong> the MCP4822's logic-high threshold scales with VDD (0.7 × VDD typical for this family, UNVERIFIED this session). Run the DACs at <strong>3.3 V with G = 1 (2.048 V FS) and TL072 gain<\/strong>, or the Seed's 3.3 V logic may not drive them at 5 V. This applied to the Pico design too, so check it at schematic capture.<\/p>\n<p><strong>Summary:<\/strong>\n- <strong>Pins:<\/strong> SPI SCK + MOSI + 4 CS = 6, plus 2 DAC pins and 1 PWM.\n- <strong>Against the Pico era:<\/strong> 4 + 3 PWM → 8 MCP + 2 DAC + 1 PWM.\n- <strong>Parts:<\/strong> +2 MCP4822 (≈ $7.98 at the TME $3.99 basis, <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> §v1.3), +6 resistors, −2 PWM RC networks. <strong>≈ +$8.<\/strong>\n- <strong>Risk:<\/strong> L. Coarse + fine summing is standard, and calibration is automatic via TIM5.<\/p>\n<hr />\n<h2>5. MIDI and USB<\/h2>\n<h3>5.1 What the job needs<\/h3>\n<ul>\n<li>USB-MIDI device and TRS MIDI in (locked spec).<\/li>\n<li><strong>One rear USB-C for charging + MIDI + firmware<\/strong> (E3, <code>answers-E1-E10.md<\/code>).<\/li>\n<li>MIDI clock for FX sync.<\/li>\n<li>No ground-loop surprises.<\/li>\n<\/ul>\n<h3>5.2 Daisy facts<\/h3>\n<ul>\n<li>The Seed has <strong>two USB peripherals<\/strong>:<\/li>\n<li>the on-board port (OTG FS);<\/li>\n<li>\"external USB pins\": D29/D30 = PB14/PB15, USB_HS D−/D+ (Seed DS p. 3).<\/li>\n<li>libDaisy can transmit on either (\"TransmitInternal … on board USB FS port\", \"TransmitExternal … external USB Pins\", <a href=\"https://electro-smith.github.io/libDaisy/class_usb_handle.html\" rel=\"noopener\" target=\"_blank\">UsbHandle<\/a>).<\/li>\n<li><strong>Firmware updates by DFU<\/strong> run on the on-board port. That the STM32 ROM DFU is on OTG FS only is UNVERIFIED; check AN2606.<\/li>\n<li>The Seed may be powered from VIN and USB at once (Seed DS p. 2).<\/li>\n<\/ul>\n<h3>5.3 Options<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>U1: rear USB-C → <strong>Seed's own port<\/strong> (pick)<\/th>\n<th>U2: rear USB-C → D29/D30<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Wiring<\/td>\n<td data-label=\"U1: rear USB-C → Seed&#x27;s own port (pick)\">Adafruit #4090 breakout ($3.45, <code>answers-E1-E10.md<\/code> E3). VBUS → bq25185 charger. <strong>D+/D−/GND twisted pair → a cut USB cable plugged into the Seed<\/strong> (micro-B on Rev 7 / Seed2 DFM, C on Seed3). <strong>Seed VBUS wire not connected<\/strong>: the Seed runs from VIN<\/td>\n<td data-label=\"U2: rear USB-C → D29/D30\">Same breakout; D± to header pins 36/37<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">USB-MIDI<\/td>\n<td data-label=\"U1: rear USB-C → Seed&#x27;s own port (pick)\">Yes<\/td>\n<td data-label=\"U2: rear USB-C → D29/D30\">Yes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Firmware update via the rear
