trong>≤ Ø 16<\/strong> (18 mm pitch leaves ≥ 2 mm between heads)<\/td>\n<td data-label=\"Who makes it\">buy caps; the shaft is either a <strong>bought dowel<\/strong> (e.g. 1/4\" = 6.35, glued into the cap and into a Ø 6.4 socket in the printed carrier) or <strong>printed into the carrier<\/strong> (a Ø 6 printed stem: snug, glued)<\/td>\n<td data-label=\"Feel\">turned wood<\/td>\n<td data-label=\"Notes\">needs a cap supplier that publishes head Ø, height and bore Ø × depth (<strong>none checked yet<\/strong>); a dowel adds a glue joint. The carrier, stop and velocity are as §10.2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">D. <strong>Flat tops<\/strong> (v1.1 FOLD)<\/td>\n<td data-label=\"Head\">printed or laser-cut<\/td>\n<td data-label=\"Who makes it\">print, or laser at Vector Space (allowed, not leaned on)<\/td>\n<td data-label=\"Feel\">flat key<\/td>\n<td data-label=\"Notes\">no peg height cost; closed back to ≈ 50.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>11. No machining: every part CATHEDRAL had him cut or drill<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Was<\/th>\n<th>Now<\/th>\n<th>Cost (rough)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Part\"><strong>Lid stays<\/strong> (2)<\/td>\n<td data-label=\"Was\">cut + drilled from 3 × 8 brass bar<\/td>\n<td data-label=\"Now\"><strong>(a) metal-printed 316L stainless by a service<\/strong> (JLC3DP BJ-316L: \"From $5.0\", max 100 mm, walls &gt; 1.5, tolerance ±0.3 mm, checked on jlc3dp.com). The stay is 3 × 8 × 44.4, inside every limit. The pivot hole prints undersize, then a bought shoulder screw. <strong>(b) printed PETG at 5 × 8<\/strong> (the 3 mm section is too slender in plastic; the end-face groove widens to 5.5)<\/td>\n<td data-label=\"Cost (rough)\">(a) ≈ $5–15 each + shipping, <strong>UNVERIFIED<\/strong> beyond \"from $5\"; (b) pennies<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>Hidden-hinge brass leaves<\/strong> (4, §1)<\/td>\n<td data-label=\"Was\">cut from flat bar<\/td>\n<td data-label=\"Now\"><strong>(a) metal-printed 316L<\/strong> (2 × 10 × 20 is ≥ the 1.5 wall and 5 mm minimum) or <strong>(b) printed in the wall<\/strong> (PETG, strength UNVERIFIED), with a <strong>bought<\/strong> Ø 3 dowel pin or M3 shoulder screw. Or the <strong>knuckles<\/strong> (printed lugs + a bought M4 shoulder bolt, as v1.1: no machining)<\/td>\n<td data-label=\"Cost (rough)\">(a) ≈ $5 each, <strong>UNVERIFIED<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Hinge \"brass sleeve fallback\" (v1.1)<\/td>\n<td data-label=\"Was\">tube cut to length<\/td>\n<td data-label=\"Now\"><strong>bought oilite bronze bushing<\/strong> (sized, off the shelf)<\/td>\n<td data-label=\"Cost (rough)\">≈ $1, UNVERIFIED<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Acrylic peg arms<\/td>\n<td data-label=\"Was\">laser-cut<\/td>\n<td data-label=\"Now\"><strong>printed carriers<\/strong> (§10.2)<\/td>\n<td data-label=\"Cost (rough)\">pennies<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Felt collars / rings<\/td>\n<td data-label=\"Was\">punched<\/td>\n<td data-label=\"Now\">hand punch (bought tool) or <strong>bought pre-cut washers<\/strong><\/td>\n<td data-label=\"Cost (rough)\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Inserts, magnets, screws, feet, pins<\/td>\n<td data-label=\"Was\">—<\/td>\n<td data-label=\"Now\">all bought; heat-set inserts go in with a soldering iron (not machining)<\/td>\n<td data-label=\"Cost (rough)\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">\"Real planed walnut later\" (FOLD's long-term idea)<\/td>\n<td data-label=\"Was\">planed and routed blocks<\/td>\n<td data-label=\"Now\"><strong>machining: flag.<\/strong> Stays a future option only, by a woodworker; the build is printed (wood-fill / walnut-tone)<\/td>\n<td data-label=\"Cost (rough)\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Spine (if kept)<\/td>\n<td data-label=\"Was\">bookcloth cut with scissors<\/td>\n<td data-label=\"Now\">as is (not machining)<\/td>\n<td data-label=\"Cost (rough)\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Metal-printed brass or bronze:<\/strong> I couldn't check a service's price or availability this session, so <strong>UNVERIFIED<\/strong>. 316L at JLC3DP is the one I checked. It's stainless, not brass-coloured: a brass look would be paint or plating, or brass from a service once checked.<\/p>\n<h2>12. No spine: routing cables through the hinge, and what answers the back slot (owner 14:4x)<\/h2>\n<p><strong>Owner:<\/strong> \"I don't want a spine can we route cables through a hinge.\"<\/p>\n<h3>12.1 Through the hinge: not the ribbon; possible with round cables through hollow corner knuckles, at a cost<\/h3>\n<p><strong>The 40-way ribbon can't go through any hinge.<\/strong>\n- It's 50.8 mm wide and flat, and it crosses the seam at x 176–227 in a rolling loop.\n- A flat ribbon can't twist 180° in a knuckle's ≈ 9 mm length.<\/p>\n<p><strong>What a through-hinge needs:<\/strong>\n- The ribbon replaced by <strong>two round multi-core cables<\/strong>, one through each rear-corner knuckle, along the axis (z 26.3).\n- The ribbon list is 21 signal lines plus grounds (v1.1 §Hinge ribbon), so each cable carries ≈ 12–20 cores, <strong>≤ ≈ 5 mm OD<\/strong> (part UNVERIFIED).\n- <strong>Pin 39<\/strong> (mixer bus → ladder, the sensitive line) goes in its own <strong>shielded<\/strong> core, and eng's noise test (pass ≤ −70 dB) has to be redone.\n- <strong>A hollow pin.<\/strong> Bought: unthreaded round spacers / standoffs with a clear bore (Ø 10 OD × ≈ 5.3 ID class, UNVERIFIED stock), cut by the maker, not by him. Or <strong>metal-printed 316L<\/strong> (JLC3DP: walls &gt; 1.5, so Ø 8.5 × 5.5 bore, ≤ 100 long ✓; from $5, UNVERIFIED beyond that).\n- <strong>Bigger knuckle barrels:<\/strong> Ø 9.6 → <strong>≥ Ø 13–14<\/strong> to hold that pin. Open, the corner barrels rise to z ≈ 33 (were 30.9). That's <strong>more visible, not less<\/strong>.\n- <strong>Twist:<\/strong> 180° of rotation over ≈ 9 mm of axis won't do. Each cable needs a <strong>service loop inside both halves<\/strong> behind the knuckle. Space at the rear corners is UNVERIFIED (base: landing strip above, Daisy rear right).\n- <strong>Headers move to the corners on both boards:<\/strong> a board change (eng).<\/p>\n<p><strong>Against my hidden side-pivot (§1):<\/strong> incompatible. The pivot lives in 4 mm walls, with no room for a bore. <strong>It's one or the other:<\/strong>\n- <strong>hidden pins<\/strong> (cables stay in the seam), or\n- <strong>hollow knuckles<\/strong> (cables in the hinge, barrels a bit bigger).<\/p>\n<p><strong>Printed hollow hinges<\/strong> (print-in-place or a printed barrel) exist in PETG. At Ø 13 with a 5.5 bore the wall is 3.75, but strength under the stand load and the lid's weight is <strong>UNVERIFIED<\/strong>, so I'd use a 316L or bought pin inside a printed barrel.<\/p>\n<p><strong>⚑ D+O and eng:<\/strong> cables-through-hinge changes both boards' headers and the cable spec. It's worth it only if the owner prefers it to hidden pins.<\/p>\n<h3>12.2 With no spine: the back slot (21.9 × 266, closed) — options, not picking<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>What<\/th>\n<th>Answers<\/th>\n<th>Costs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">S0<\/td>\n<td data-label=\"What\"><strong>Leave it open<\/strong> (v1.1 as locked)<\/td>\n<td data-label=\"Answers\">nothing; J6 ◐ (grit, knobs visible 7 mm inside)<\/td>\n<td data-label=\"Costs\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">S1<\/td>\n<td data-label=\"What\"><strong>Design it as an arcade:<\/strong> dark interior behind the slot; the visible tops of V1's knobs read as a row of columns. CATHEDRAL: the clerestory<\/td>\n<td data-label=\"Answers\">how it looks, not grit<\/td>\n<td data-label=\"Costs\">$0 (paint the lid's hinge-edge interior)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">S2<\/td>\n<td data-label=\"What\"><strong>Cables through the hinge (12.1)<\/strong>, so the ribbon loop no longer shows in the slot either<\/td>\n<td data-label=\"Answers\">removes the cable from view<\/td>\n<td data-label=\"Costs\">board and cable changes; bigger knuckles; loses hidden pins<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">S3<\/td>\n<td data-label=\"What\"><strong>A sleeve<\/strong> (case work)<\/td>\n<td data-label=\"Answers\">grit and protection<\/td>\n<td data-label=\"Costs\">his \"case\" topic was deferred for HUSH / ONE SHEET; FOLD was meant to self-protect<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">S4<\/td>\n<td data-label=\"What\">A rigid lip or flap<\/td>\n<td data-label=\"Answers\">—<\/td>\n<td data-label=\"Costs\"><strong>can't<\/strong>: raised among the knobs when open (R4), §1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">S5<\/td>\n<td data-label=\"What\">The spine<\/td>\n<td data-label=\"Answers\">full closure<\/td>\n<td data-label=\"Costs\"><strong>declined by the owner<\/strong>; listed only because it's the only full closure<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>13. Brass / black keys, or all brass (owner: \"Could 3d print and reminds me of a cathedral\")<\/h2>\n<p><strong>Form:<\/strong> a <strong>hollow cap<\/strong> over the printed carrier (§10.2) replaces the wood plug head. Same Ø 12.7 dome, wall ≈ 0.8–1.0, glued onto the carrier's cup.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How<\/th>\n<th>Mass per cap [CALC, ESTIMATE]<\/th>\n<th>Cost × 25<\/th>\n<th>Wear<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Option\"><strong>Cast brass<\/strong> (wax print, lost-wax cast by a service)<\/td>\n<td data-label=\"How\">i.materialise brass (checked: cast from printed wax; min wall 0.6, detail 0.35, max 88 × 88 × 125; finishes natural PU-coated, gold, <strong>black colour-plated<\/strong>, chrome; electroplating adds €5–9 per model; base price not published)<\/td>\n<td data-label=\"Mass per cap [CALC, ESTIMATE]\">hollow ≈ 2–3 g; solid head ≈ 4–5 g (brass ≈ 8.5 g/cm³)<\/td>\n<td data-label=\"Cost × 25\"><strong>UNVERIFIED<\/strong>: quote by upload. Plating alone adds €125–225 for 25<\/td>\n<td data-label=\"Wear\">uncoated brass darkens / greens; PU coat wears at touch points (uneven patina); black plating wears through to brass where fingers land (a \"worn organ stop\" look, or a flaw)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\"><strong>Metal print 316L<\/strong> (JLC3DP)<\/td>\n<td data-label=\"How\">steel, not brass-coloured (plate or paint for brass / black)<\/td>\n<td data-label=\"Mass per cap [CALC, ESTIMATE]\">≈ same as brass (7.9 g/cm³)<\/td>\n<td data-label=\"Cost × 25\">≥ 25 × $5 = <strong>≥ $125 UNVERIFIED<\/strong> (only \"from $5\" checked)<\/td>\n<td data-label=\"Wear\">steel doesn't patina; plating wears as above<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\"><strong>Brass-look printed<\/strong><\/td>\n<td data-label=\"How\">brass/copper-filled PLA (hand-polishes to a metal sheen, no machining) or silk-gold PLA; black PETG for sharps<\/td>\n<td data-label=\"Mass per cap [CALC, ESTIMATE]\">metal-fill ≈ 0.8–1.2 g; silk ≈ 0.5 g<\/td>\n<td data-label=\"Cost × 25\">pennies (filament)<\/td>\n<td data-label=\"Wear\">metal-fill burnishes and darkens like metal; silk PLA scuffs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Feel on a Choc V2<\/strong> (≈ 35–43 gf per switch, eng <code>velocity-and-keys-v2.md<\/code> S3):\n- A 2–3 g hollow brass cap is ≈ 5–8 % of the spring force: it feels slightly lighter at the top. Negligible.\n- A <strong>solid 4–5 g head is ≈ 10–14 %<\/strong>: noticeably lighter, and a firmer top-out on release.\n- The <strong>silent Choc damps both strokes<\/strong>, so bounce shouldn't become audible (<strong>UNVERIFIED<\/strong>: test one key).\n- <strong>Recommend hollow caps if metal.<\/strong><\/p>\n<p><strong>Velocity:<\/strong>\n- <strong>Brass is non-magnetic<\/strong> (copper-zinc, μr ≈ 1). It doesn't bend the D31's field. The magnet sits in the carrier's arm 10.5 behind the stem anyway, not under the cap.\n- Eddy-current drag at key speeds near a 4.76 mm magnet: negligible (ESTIMATE).\n- A heavier cap slows the stroke for the same finger force, so velocity reads slightly lower. <strong>If every key has the same cap mass, one calibration covers it.<\/strong>\n- <strong>Mixing brass naturals with plastic sharps<\/strong> gives two masses, so the firmware needs a per-group velocity curve (eng: trivial, but note it). Black-plated brass sharps avoid it.\n- <strong>316L steel is weakly magnetic after printing<\/strong> (austenitic, but printed/sintered parts can show some ferromagnetism, ESTIMATE). Near the magnet arm it could pull the field slightly. Brass doesn't.<\/p>\n<p><strong>Height:<\/strong> a hollow cap can be shallower than a wood head (it isn't limited by plug stock). With dome height ≈ 4, the head top = deck + 2.8 + 4 = <strong>6.8<\/strong>, and FOLD's closed height stays as CHAMBER's 52.7 [CALC].<\/p>\n<p><strong>CATHEDRAL reading:<\/strong>\n- <strong>All brass<\/strong> rhymes the keys with the façade's brass line work: <strong>one metal, fewer colours<\/strong>, his ask.\n- <strong>Brass + black<\/strong> reads as organ stops and pipes.\n- Colour is the visual designer's call; the numbers above hold for both.<\/p>\n<h2>14. Speaker placement, round 2 (owner: \"I don't like the speaker on the key side but I also don't like the eye shape\")<\/h2>\n<p><strong>Kept:<\/strong> B's single effects row on the lid's back row (his \"FX together\" ask stands). <strong>Ruled out:<\/strong> a speaker grille on the base's top face (key side), and any lens or vesica.<\/p>\n<p><strong>The space facts<\/strong> (v1.1 FOLD-105):\n- the lid's under-plate depth is <strong>10.6 mm<\/strong> (speaker 60 × 30 × 10.3 lies flat; it can't stand on edge);\n- the band is d 21.9–59.45, with <strong>≈ 22 mm clear for a grille<\/strong> between the \"mixer\" heading and V2's legends (visual's figure);\n- the lid end faces carry the stays (d 30–74.4);\n- the far wall carries the I/O board (x 60–230, d 92–104);\n- base under-plate space is ≈ 11.1.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Placement<\/th>\n<th>Sound path<\/th>\n<th>Table / lap / grass<\/th>\n<th>What moves<\/th>\n<th>Checks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>P1. Band, fires up, non-lens grille<\/strong><\/td>\n<td data-label=\"Placement\">the speaker stays where v1.1 has it: x 113–173, d 26.7–56.7, under the band plate. The grille is <strong>(a) a rounded rectangle ≈ 56 × 18, r ≈ 6<\/strong> or <strong>(b) an arcade of vertical slots<\/strong> (≈ 11 slots, pitch 5, width 2, lengths stepping ≈ 8 → 18 → 8: a pipe-tower silhouette, not a lens)<\/td>\n<td data-label=\"Sound path\">up through the lid plate. <strong>Open flat:<\/strong> straight up, at the player's chest. <strong>Standing 120°:<\/strong> the panel faces 30° up, so the speaker faces the player<\/td>\n<td data-label=\"Table / lap / grass\">best of the set: unobstructed in all three. On grass the lid is clear of it<\/td>\n<td data-label=\"What moves\"><strong>nothing<\/strong> (speaker, board windows and ribbon as v1.1)<\/td>\n<td data-label=\"Checks\">grille open area: (b) ≈ 290 mm² vs today's ≈ 440 (fewer slots → ≈ −35 %, UNVERIFIED acoustically; widen slots to 2.5 to recover); grille vs V2 legends and the mixer heading (§7 checker once modelled)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>P2. Through the lid back (the façade speaks)<\/strong><\/td>\n<td data-label=\"Placement\">the same speaker, same x / d, flipped: it fires <strong>out through the lid back<\/strong>. The openings are slots set into the façade, inside x 113–173, d 26.7–56.7, i.e. within the centre pipes (the owner draws the pipes; the openings follow his lines)<\/td>\n<td data-label=\"Sound path\"><strong>Standing 120°:<\/strong> the lid back faces back and up, so it fires at the listener across from you. The organ speaks from its façade; the player hears it by reflection. <strong>Open flat:<\/strong> the lid back sits on its feet (≈ 3 mm gap), firing into the table. <strong>Closed:<\/strong> faces up (off anyway)<\/td>\n<td data-label=\"Table / lap / grass\">standing: loud to the listener, softer to the player. Flat on a table: muffled and dark (boundary-loaded through a 3 mm gap, like ONE SHEET's bottom speaker). Lap: muffled. Grass: absorbed<\/td>\n<td data-label=\"What moves\"><strong>no controls.<\/strong> The speaker mounts to the lid back's inner face instead of under the plate. The band plate becomes plain (no grille at all)<\/td>\n<td data-label=\"Checks\">openings vs his pipe lines; dust/water path through the façade; feet height raised to ≥ 6 so flat-open isn't choked (UNVERIFIED gain)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>P3. Base underside, fires down<\/strong><\/td>\n<td data-label=\"Placement\">the speaker in the base's freed right end (B: x 186–270, y 55–82), lying on the floor, firing <strong>through the base bottom<\/strong>; nothing on the base top<\/td>\n<td data-label=\"Sound path\">down into whatever it's on, out through the feet gap<\/td>\n<td data-label=\"Table / lap / grass\">table: muffled and dark (as P2 flat). Lap: smothered. Grass: absorbed. <strong>Weakest outdoors<\/strong><\/td>\n<td data-label=\"What moves\">no controls. <strong>Base board change<\/strong> (speaker window); the <strong>Daisy (rear right) clash is UNVERIFIED<\/strong><\/td>\n<td data-label=\"Checks\">is \"key side\" visual (grille on top) or the base half at all? If the latter, P3 is out too<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>P1c. An off-centre circle in the band<\/strong> (owner: \"go back to a circle and maybe not centered?\"; he prefers lines running up and down).\n- <strong>Method:<\/strong> measured on rb.Cathedral(\"B\") with Kalam (<code>/tmp/circ.py<\/code> uses <code>branch_check.py<\/code> §7's machinery). Largest circle clear of every legend (≥ 1.5), every V1 / V2 / switch control (≥ 1.5) and every tick (≥ 1.0) [CHECK].\n- <strong>Largest circle by position along the band:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Position (x)<\/th>\n<th>Largest Ø<\/th>\n<th>At depth d<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Position (x)\">158–176<\/td>\n<td data-label=\"Largest Ø\"><strong>≈ 25–27<\/strong><\/td>\n<td data-label=\"At depth d\">≈ 36.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position (x)\">116–128<\/td>\n<td data-label=\"Largest Ø\">≈ 24<\/td>\n<td data-label=\"At depth d\">≈ 36<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position (x)\">230–236<\/td>\n<td data-label=\"Largest Ø\">≈ 25<\/td>\n<td data-label=\"At depth d\">≈ 35<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position (x)\">80–110 and 194–206 (the switch columns)<\/td>\n<td data-label=\"Largest Ø\">≈ 11–17<\/td>\n<td data-label=\"At depth d\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position (x)\">the axis, 134–152<\/td>\n<td data-label=\"Largest Ø\">≈ 18.5–20 (the \"mixer\" heading and NOISE / EXT's legend crowd it)<\/td>\n<td data-label=\"At depth d\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>So the centre is the worst place for a circle and off-centre is the best.<\/strong><\/li>\n<li><strong>Pick that keeps the speaker where it is<\/strong> (window x 113–173, d 26.7–56.7):<\/li>\n<li><strong>centre (160, d 37), Ø 25<\/strong>, 17 mm right of the axis, still entirely over the cone (x 147.5–172.5);<\/li>\n<li>mirror at (126, d 36), Ø 24, if he prefers left.<\/li>\n<li><strong>Nothing moves.<\/strong><\/li>\n<li><strong>Further out<\/strong> (x ≈ 233, Ø 25) means swapping the speaker with the right-hand cells: a lid board window change (eng). Not needed.<\/li>\n<li><strong>Closed:<\/strong> the band lands over the base PLAY row, but a grille is flush and the speaker depth is unchanged, so <strong>there's no closing clearance issue anywhere in the band.<\/strong><\/li>\n<li><strong>Open area<\/strong> (vertical slots, pitch 2.3, width 1.25, ≈ 54 % open) [CALC]:<\/li>\n<li>circle Ø 25 ≈ <strong>265 mm²<\/strong> (Ø 27 ≈ 310);<\/li>\n<li>the vertical-slot tower ≈ 290;<\/li>\n<li>today's grille ≈ 440.<\/li>\n<li>Circle and tower are within ≈ ±10 % of each other, and both ≈ 35–40 % below today (loudness UNVERIFIED; wider slots recover some).<\/li>\n<\/ul>\n<p><strong>Rejected, with reasons:<\/strong>\n- <strong>Lid end walls:<\/strong> the speaker would have to stand on edge (30 &gt; 10.6 under the plate), and the end faces carry the stays' grooves.\n- <strong>Lid far wall:<\/strong> the I/O board and jacks fill x 60–230; behind the wall are the FX pots.\n- <strong>Hinge zone / base rear wall:<\/strong> open, it faces the lid's hinge wall across a 2 mm gap.\n- <strong>Two small speakers:<\/strong> quieter in total, and no space either side of the band's cells.<\/p>\n<p><strong>A consequence of B with the speaker not in the base:<\/strong> the base PLAY row's right end (x 186–270) is <strong>empty<\/strong>. ⚑ D+O, options:\n1. <strong>VOLUME and TAP come back to the base right<\/strong> (TAP is played in rhythm; VOLUME is \"out\"). The lid row is then DRIFT | echo ×4 | reverb ×3, and FREE / SYNC stays by TIME. His \"together\" holds for every effect control; out and tempo sit with the hands.\n2. <strong>The PLAY row is re-centred<\/strong> across 286 (pitch | filter only), leaving equal margins.\n3. <strong>The maker's lozenge and the two lights<\/strong> go there.<\/p>\n<p><strong>My read (not a pick):<\/strong> P1 is the only placement that's as loud as today in every place he plays, and it moves nothing. P2 is the CATHEDRAL idea (the façade speaks) but trades the player's sound and flat-table loudness for the listener's. P3 is the quietest.<\/p>\n<h2>15. Stereo (owner: \"the verb and delay are stereo…should we have two? Also is there stereo output?\")<\/h2>\n<p><strong>Today:<\/strong>\n- One mono output path: VCA → output mixer → VOLUME → LM386 → speaker, with phones / line from the LM386 through a series R (<a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a>).\n- FOLD's far wall has <strong>PHONES and LINE OUT<\/strong> as two jacks; ONE SHEET has one PHONES jack.\n- The Daisy already computes <strong>wet L / R<\/strong> and its codec is <strong>stereo out<\/strong>. Eng drew \"stereo to phones optional\" (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §6.2).\n- The effects that are truly stereo: PING-PONG, and reverb width (eng's libraries are stereo plate / ping-pong, <code>single-chip-research.md<\/code> §3).<\/p>\n<h3>15.1 Stereo output: cheap, no new jacks<\/h3>\n<p><strong>What it takes:<\/strong>\n- <strong>Daisy and codec: nothing new.<\/strong> Both codec outputs are already wired as wet L / R. 0 pins.\n- <strong>Two output summing nodes<\/strong> (one TL072: dry + wet L, dry + wet R).\n  - <strong>The dry voice is mono, so it sits in the centre of both channels.<\/strong> One VCA can't be stereo.\n  - Only the echo and reverb spread.\n- <strong>VOLUME becomes a dual-gang 9 mm pot<\/strong> (same knob, same place; part / spline UNVERIFIED). The other route is the dry level on one gang plus the Daisy scaling the wet by reading VOLUME's wiper, but then the wet and dry tapers must match (eng).\n- <strong>A stereo headphone driver<\/strong> replaces \"phones from the LM386 through a series R\": a DIP dual op-amp that drives 32 Ω (NJM4556A class, UNVERIFIED part and price).\n- <strong>The LM386 stays for the speaker<\/strong>, fed the mono sum (L + R)/2. PING-PONG in mono becomes CLEAN with alternating tone, as eng's table already says.\n- <strong>Jacks: none added.<\/strong> FOLD's PHONES and LINE OUT become <strong>TRS stereo<\/strong>, as does ONE SHEET's PHONES. <strong>His \"no extra patch points\" holds.<\/strong>\n  - A <strong>mono plug in a stereo jack hears L only<\/strong> (R shorts to sleeve through its series R), so a mono cable loses the right-hand ping-pong repeats.\n  - The fix is a switched TRS jack that sums to mono when a mono plug goes in (UNVERIFIED part).\n- <strong>Cost:<\/strong> ≈ <strong>$3–5<\/strong> (TL072 + headphone driver + dual pot + passives; ESTIMATE, UNVERIFIED). <strong>Power:<\/strong> a few mA, only with phones in.\n- <strong>⚑ D+O:<\/strong> it changes the output stage, VOLUME's part and the jacks' wiring. <strong>No control moves.<\/strong><\/p>\n<h3>15.2 Two speakers: honest answer, not worth it here<\/h3>\n<p><strong>Audible?<\/strong>\n- Two drivers ≈ 200–250 mm apart, at 0.5–0.6 m (seated, playing), span ≈ 20–25° [CALC]. That's laptop-speaker stereo: a little width close up, and PING-PONG audible as left / right.\n- At a bench friend's 1–2 m, and outdoors (no reflections), it <strong>collapses to near mono<\/strong>.\n- Small 60 × 30 drivers have no bass either way. <strong>Two drivers mostly buy loudness<\/strong> (≈ +3 dB), <strong>not stereo.<\/strong><\/p>\n<p><strong>Where (his rules: not on the key side, no eye shape; vertical lines or an off-centre circle in the band):<\/strong>\n- To be 200 mm apart they'd sit at x ≈ 40 and ≈ 245, <strong>over the battery cells<\/strong> (FOLD-105's four cells fill x 15–103 and 183–271 under the band; the lid has 10.6 mm under the plate and nowhere else).\n- That means <strong>giving up cell space<\/strong>, on a battery already ≈ 1.9–3.9 h [CALC].\n- The band's clear circles there are uneven: Ø ≈ 18–20 at x ≈ 40–44, Ø ≈ 23–25 at x ≈ 236–242 [CHECK, §14]. So two matching round grilles would be ≤ Ø 18.<\/p>\n<p><strong>Cost and power:<\/strong>\n- ≈ +$2–3 (a second speaker; a stereo amp or a second LM386; eng's basis: speaker + LM386 ≈ $2.20).\n- A little more draw at the same loudness per driver.\n- The real cost is <strong>battery capacity and a lid board change<\/strong>.<\/p>\n<h3>15.3 Recommendation (superseded in part by 15.4: decided stereo phones + stereo line out, one speaker)<\/h3>\n<ul>\n<li><strong>Yes to stereo output, no to a second speaker.<\/strong><\/li>\n<li>Stereo phones and line out give him the real stereo echo and reverb wherever stereo can be heard (headphones, a recorder, a PA), for ≈ $3–5, with no new jack and no control moved.<\/li>\n<li>A second speaker in this box gives little stereo beyond arm's length, nothing outdoors, and costs battery he may need in the park.<\/li>\n<li><strong>Spec change for the director, then the owner:<\/strong> stereo TRS outputs + dual-gang VOLUME + a headphone driver. The speaker stays mono (P1 / circle per §14).<\/li>\n<\/ul>\n<h3>15.4 Owner decision and the FX pan (owner: \"Stereo phones is fine but I need to pan the signal into the effects\")<\/h3>\n<p><strong>Decided:<\/strong> stereo <strong>phones<\/strong>, <strong>one speaker<\/strong>.\n<strong>Decided (owner: \"Stereo line out\"):<\/strong> <strong>stereo PHONES and stereo LINE OUT (both TRS), one speaker.<\/strong> No new jacks; LINE OUT gets its own stereo line driver (the second half of the summing TL072 pair, or a second TL072: ESTIMATE ≈ +$0.50).<\/p>\n<p><strong>Mono on a TS cable (owner: \"Left channel should be mono tho if stereo isn't plugged in\"): LINE OUT, required.<\/strong>\n- <strong>Why a switched jack can't do it alone:<\/strong> a jack's normal contacts open for <em>any<\/em> plug. A TS plug differs only in that its sleeve <strong>grounds the ring contact<\/strong>. So the jack can't tell TS from TRS mechanically; the circuit has to sense the grounded ring.\n- <strong>Sensing (proposal):<\/strong>\n  - The ring is driven through its usual series resistor (≈ 100 Ω, so a short is harmless).\n  - On the jack side, a <strong>1 MΩ bias to 3.3 V<\/strong> goes through a <strong>100 k / 1 µF low-pass<\/strong> (≈ 0.1 s, strips the audio) into a <strong>spare mux channel<\/strong> (an ADC read, 0 Daisy pins) or a spare ADC pin.\n  - Readings [CALC]: <strong>TS plug ≈ 0 V<\/strong>; TRS into an AC-coupled input or an empty jack ≈ 3.3 V; TRS into a DC-coupled 10 k input ≈ 33 mV.\n  - <strong>Threshold ≈ 10 mV, 50 ms debounce, with hysteresis.<\/strong> The 1 MΩ bias puts at most ≈ 33 mV of DC into someone's DC-coupled input; a stronger bias would read more cleanly but leak more DC.\n  - <strong>UNVERIFIED<\/strong> (eng: bench it with a real TS and a real TRS cable into a mixer and an interface).\n- <strong>Action:<\/strong> on TS, the Daisy sends the wet as <strong>(L + R)/2 on both codec outputs<\/strong>. The tip (L = dry + wet) then carries the full mono mix; the ring is shorted and silent.\n  - Cost: the stereo phones go mono too while a TS cable sits in LINE OUT (they share the wet outputs). That's a firmware-only route.\n  - The analog alternative that keeps the phones stereo: a <strong>74HC4053<\/strong> analog switch (generic part, ≈ $0.50, UNVERIFIED stock) adds R into the LINE OUT's left driver when the sense trips. The Daisy flips it from the same reading (1 GPIO via the 74HC595 latch, eng).\n- <strong>Jack:<\/strong> any 3.5 mm stereo (TRS) PCB jack; switches aren't needed for this. For example <strong>CUI Devices SJ1-3523N<\/strong> (part number not checked this session: <strong>UNVERIFIED<\/strong>), the same part as PHONES.\n- <strong>Phones: not applied.<\/strong> A 32 Ω headphone on the ring looks like a short to this sensor, so it can't tell TS from TRS. Mono TS headphones are rare. With a TS plug in PHONES you hear L only (dry + wet L); the FX PAN's centre still puts the effects in L.\n- <strong>⚑ D+O:<\/strong> part of §15's output-stage change.<\/p>\n<p><strong>FX PAN ⚑ D+O (adds one control):<\/strong>\n- <strong>Where the pan happens: in the Daisy, on the effects input.<\/strong>\n  - The FX send is mono: the post-VCA voice into codec IN L (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §6.2).\n  - The DSP places it in the stereo field <strong>before<\/strong> echo and reverb.\n  - Cost: <strong>one 9 mm pot on one mux channel<\/strong>, 0 Daisy pins. In layout B the four moved controls already shift mux load from base to lid (base −4, lid +5 with PAN), so <strong>eng to confirm the lid mux count<\/strong>. PAN can be read on a base mux channel through a ribbon spare if the lid mux is full.\n  - <strong>Analog pan rejected:<\/strong> the dry voice never enters the DSP, and panning it would need a stereo analog path after a mono VCA (a pan pot feeding the two summing nodes). That's more parts, and it isn't what he asked for: \"pan the signal <strong>into the effects<\/strong>\".\n- <strong>What it pans:<\/strong> <strong>only the effects send.<\/strong>\n  - The dry voice stays centred on the phones (mono VCA).\n  - What moves is where the echoes and reverb start: PING-PONG's first repeat, and the reverb's image.\n- <strong>Pan law: constant sum (L + R = 1, −6 dB at centre).<\/strong>\n  - <strong>The speaker hears no change of effect level as he pans<\/strong>, because it plays the mono sum.\n  - On phones the centre sounds ≈ 3 dB quieter than an equal-power law would. Eng can soften it to −4.5 dB; that's a firmware constant.\n- <strong>Range and centre:<\/strong>\n  - full left ↔ full right;\n  - <strong>centre detent:<\/strong> a 9 mm centre-detent pot if one exists in the T18 spline (<strong>part UNVERIFIED<\/strong>);\n  - otherwise a <strong>firmware dead zone of ±3 % at centre<\/strong>, no part needed.\n  - Fully left or right: the send enters one side only, so on PING-PONG the repeats then alternate from that side.\n- <strong>MIDI (owner: \"Yea sure on midi\"): FX PAN receives CC 10, jump-on-move as usual.<\/strong>\n  - It joins the MIDI-controllable set, so it gets the engraved MIDI dot and lights the not-in-control light while CC 10 holds it. <strong>Whether it also sends CC 10 when moved is open with the owner<\/strong> (jobs F7 step 7 assumed knobs send; he hasn't confirmed). §15.5 moves CC 10 to DRY PAN.\n  - The Daisy reads it anyway, so it costs firmware only.\n  - <strong>What it pans<\/strong> (owner asked: \"is it sending the delay through the pan too or just the dry\"): <strong>the send into echo and reverb.<\/strong> The repeats and the reverb come out panned; the dry voice stays centred.\n    - The reverb is stereo, so its tail <strong>spreads around<\/strong> the panned position rather than sitting hard on one side.\n    - PING-PONG starts on the panned side and then alternates.\n- <strong>Where it sits (layout B's effects row, d 83.85):<\/strong> <strong>FX PAN 240 | VOLUME 260<\/strong>, one \"where it goes\" group after the reverb break (225.5).\n  - The logical spot, the start of the chain before ECHO, has no room: it would shift the echo group +10 and push FREE / SYNC onto OSC 3 CTL (−0.4).\n  - <strong>[CHECK §9, second run]: 0 violations<\/strong> (pitch, gaps, breaks, edges, far rim, closed landing over pegs). VOLUME's edge sits 18.55 from the outside (rule ≥ 16).\n  - <strong>Labels:<\/strong> \"pan\" (legend in front, d ≈ 73) clears L SUSTAIN's knob by ≈ 3.7 and the DECAY toggle by more [CALC]. The model needs PAN added so §7 can measure it (visual).\n  - Legend: <strong>\"fx pan\"<\/strong>, so nobody reads it as a master pan.\n- <strong>Consequence:<\/strong> the base PLAY row's right end (x 186–270) is still empty (§14 options 2–3). Option 1 (VOLUME and TAP back to the base) would split PAN from VOLUME.<\/p>\n<h3>15.5 Dry pan, delay pan, and FOLLOW ⚑ D+O (owner: \"No the pan would be audio signal… pan just the delay separately from the full dry… have the pan signals sync\"; then \"Follow dry\")<\/h3>\n<p><strong>What he wants:<\/strong>\n1. a pan for the <strong>full dry voice on the outputs<\/strong>;\n2. a <strong>separate pan for the delay<\/strong>;\n3. a link so the <strong>delay pan follows the dry pan, same side<\/strong>.<\/p>\n<p>No tempo auto-pan (the earlier draft is withdrawn).<\/p>\n<p><strong>Signal flow:<\/strong><\/p>\n<pre><code>voice (mono, analog) ─► [DRY PAN: dual digital pot, analog audio] ─► L sum / R sum ─► phones, line out (stereo), speaker (mono sum)\n            └─ FX send (follows DRY PAN in DSP) ─► reverb in (stereo)\n               └─► ECHO ─► [DELAY PAN, DSP; = DRY PAN when FOLLOW] ─┬► L / R sums (ECHO MIX)\n                                                                     └► reverb in (stereo)\nreverb out (stereo) ─► L / R sums (REVERB MIX)\n<\/code><\/pre>\n<p><strong>1. DRY PAN: analog audio, set by the Daisy (recommended route).<\/strong>\n- The <strong>knob is a plain control pot on a mux channel<\/strong> (DC, read by the Daisy). The <strong>audio goes through a dual digital potentiometer<\/strong> wired as two complementary dividers into the L and R summing nodes: L = a, R = 1 − a, a <strong>constant-sum law<\/strong>.\n- <strong>Part:<\/strong> Microchip <strong>MCP4251-103<\/strong> (dual 10 k, 257 steps, SPI, DIP-14). <strong>UNVERIFIED<\/strong> this session (part, price ≈ $1.5, stock).\n  - It runs at 5 V, so the audio is AC-coupled and biased at mid-rail (eng: headroom, THD, wiper noise).\n  - One SPI chip-select: a spare Daisy pin or the 74HC595 latch (control rate is fine).\n- <strong>The dry stays analog.<\/strong> No converter touches it; the digipot is a resistor network. It does add a part in the dry path, so eng should confirm it meets \"the dry path analog and never switched\" (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §6.1) in spirit.\n- <strong>Why not a passive pan pot:<\/strong>\n  - a passive pot (a dual-gang: one gang audio, one gang DC so the Daisy knows its position for FOLLOW) works, but <strong>can't take MIDI<\/strong>;\n  - the pan's CC 10 was already decided. The digipot gives CC 10, FOLLOW and jump-on-move from one knob.\n  - <strong>Fallback:<\/strong> the passive dual-gang, knob-only, with FOLLOW still possible.<\/p>\n<p><strong>2. DELAY PAN: in the DSP.<\/strong>\n- It places the echo's output on the outputs <strong>and<\/strong> where it enters the reverb, so the reverb image follows the repeats.\n- Reverbs take <strong>stereo input<\/strong> (PLATE / SPRING / SHIMMER get two input diffusers: ≈ +10–15 % of one reverb's load, ESTIMATE). The pans cost nothing measurable.\n- <strong>PING-PONG:<\/strong> the repeats alternate starting on the pan's side.<\/p>\n<p><strong>3. FOLLOW: one 2-way toggle, OFF / FOLLOW.<\/strong>\n- <strong>FOLLOW:<\/strong> the delay pan takes the dry pan's position (same side, his answer). The DELAY PAN knob is inactive.\n- <strong>OFF:<\/strong> the delay pan goes back to its own knob. The toggle's position shows the state; no jump surprises beyond that.\n- <strong>The old VOICE PAN<\/strong> (the send into the effects) <strong>merges into DRY PAN.<\/strong> The Daisy places the voice's send where the dry sits, so the dry's reverb starts on its side. No extra knob.<\/p>\n<p><strong>What each output hears<\/strong> (constant-sum laws throughout):\n- <strong>Speaker<\/strong> (mono sum (L + R)/2): <strong>no level change<\/strong> as either pan moves.\n- <strong>Phones / line out with a stereo plug:<\/strong> both pans as set.\n- <strong>LINE OUT with a TS (mono) plug:<\/strong> the tip must carry L + R. With the dry now panned in analog, the firmware wet-mono trick (§15.4) <strong>isn't enough<\/strong> (a dry panned right would vanish from the tip). So the <strong>74HC4053 analog-switch route becomes required<\/strong>: on TS it sums R into the LINE OUT's left driver. Generic part ≈ $0.50, UNVERIFIED.\n- <strong>Phones with a TS plug:<\/strong> L only, as stated in §15.4 (a dry panned right is quiet there). Accepted.<\/p>\n<p><strong>MIDI:<\/strong>\n- DRY PAN <strong>receives CC 10<\/strong>, jump-on-move (the digipot makes this possible).\n- DELAY PAN <strong>receives CC 102<\/strong> (proposal, undefined CC), jump-on-move.\n- <strong>FOLLOW is a switch: MIDI never flips switches<\/strong>, as the rule says.\n- <strong>Whether moving these knobs (or any MIDI-controllable knob, or the keys) <em>sends<\/em> MIDI is open with the owner.<\/strong> It's not assumed here.<\/p>\n<p><strong>Placement (layout B's effects row, d 83.85) [CHECK §9, fourth run: 0 violations]:<\/strong>\n- <strong>DRIFT 33.5 | ECHO: TYPE 62.5 · TIME 82.5 · REPEATS 102.5 · MIX 122.5 · DELAY PAN 142.5 | REVERB: TYPE 171.5 · DECAY 191.5 · MIX 211.5 | DRY PAN 240.5 · VOLUME 260.5<\/strong>;\n- <strong>FOLLOW toggle at (250.5, d 73)<\/strong>, in front, between DRY PAN and VOLUME (nearest: L SUSTAIN 2.50, DRY PAN 2.71, VOLUME 2.71);\n- breaks 48 / 157 / 226; FREE / SYNC unchanged.\n- <strong>DRY PAN and VOLUME legends go behind their knobs<\/strong> (the toggle sits where their legends were); words \"off\" / \"follow\" beside the toggle.\n- The model needs these for §7's label check (visual).\n- <strong>TAP moves back to the base, x 261<\/strong> (v1.1 spot) ⚑.<\/p>\n<p><strong>Cost, power, mux (ESTIMATE, UNVERIFIED):<\/strong>\n- digipot ≈ $1.5, two pots + knobs ≈ $1.8, toggle ≈ $0.5, 74HC4053 ≈ $0.5: <strong>≈ $4–5<\/strong> over §15.1's stereo stage.\n- Mux: <strong>+3 channels<\/strong> (2 pots, 1 toggle) on top of B's moves (eng: lid mux count).\n- 1 SPI chip-select. A few mA.<\/p>\n<h2>9. Open questions<\/h2>\n<ol>\n<li><strong>⚑ D+O:<\/strong> option B (all FX + VOLUME on the lid back row, speaker in the base PLAY row: costs reach and v1.1's \"amounts in front\") or option A (layout as is; the gap becomes a rose-window band)?<\/li>\n<li><strong>Owner:<\/strong> spine: none, body colour, or oxblood?<\/li>\n<li><strong>Eng:<\/strong> side-pivot strength in PETG with brass leaves; screw-through foot part; base speaker vs the Daisy's place; ribbon changes in B.<\/li>\n<li><strong>Visual:<\/strong> with B chosen, a model so the checker can run labels (§7 of <code>branch_check.py<\/code>).<\/li>\n<li><strong>Owner:<\/strong> keys A / B / C / D (§10.4). Before A: buy one pack and measure the head height.<\/li>\n<li><strong>Owner:<\/strong> stays and hinge leaves metal-printed (316L) or printed PETG; brass colour by plating/paint, or a checked brass service.<\/li>\n<li><strong>Owner ⚑ D+O:<\/strong> hidden pins (cables in the seam) or hollow knuckles (cables through the hinge, bigger barrels, board change)? And the back slot: S0–S3 (§12.2).<\/li>\n<li><strong>Owner:<\/strong> keys in cast brass (hollow), 316L, or brass-look print; all brass or brass + black (§13). A one-key feel test before ordering 25.<\/li>\n<\/ol>\n<p>NEXT: product designer (visual focus) — the colours, the woody engraving, the grille pattern and the plate rounding are theirs, and options A/B need their look before the director weighs ⚑ B.<\/p>", "lead": "> ## Team rulings in force (director, CATHEDRAL steer 1; these supersede the options below where they differ) > 1. All 8 plate corners R 7.7 (§4). > 2. Feet: >    - screw-through rubber feet at the 4 corner screws (16 / 270, d 12 and d 96),", "jump": ["0. What I assumed his words point at", "1. Hidden hinge(s) in the gap: not possible as a hidden *axis*; possible as hidden *pins in the side walls*", "2. The speaker and the gap", "3. Feet that are also the case screws", "4. Faceplate rounding", "5. \"The screen\" (the speaker grille), rounded", "6. If the spine goes: what it was solving", "7. CATHEDRAL as a point of view: what changes in the structure", "8. Not mine (the visual designer's), noted for completeness", "10. Keys, redone around real parts; and no machining anywhere (owner 14:30–14:34)", "11. No machining: every part CATHEDRAL had him cut or drill", "12. No spine: routing cables through the hinge, and what answers the back slot (owner 14:4x)", "13. Brass / black keys, or all brass (owner: \"Could 3d print and reminds me of a cathedral\")", "14. Speaker placement, round 2 (owner: \"I don't like the speaker on the key side but I also don't like the eye shape\")", "15. Stereo (owner: \"the verb and delay are stereo…should we have two? Also is there stereo output?\")", "9. Open questions"], "code": "D-110"}, "D-040": {"kind": "doc", "sub": "doc", "title": "Echo clock (FREE / SYNC)", "stage": "Spec", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "design/branches/echo-clock.md", "html": "<h1>Echo under MIDI clock: how it behaves (systems, branches turn 1, 2026-11-13)<\/h1>\n<blockquote>\n<p><strong>Rev 1.1 (2026-11-13, concept turn 1).<\/strong> Owner chose <strong>option B<\/strong> (11:58, <a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>). Placement checked with labels (<a href=\"#i-D-003\"><code>concepts/common-how-it-works.md<\/code><\/a> §2):\n- ONE SHEET frame (128.0, 132.7); FOLD lid (133.0, d 70.6).\n- <strong>Throw left / right<\/strong> (\"free\" left, \"sync\" right). Fore / aft has no room for its words.\n- TIME's and DECAY's legends move behind their knobs.\n- TIME's two scales are printed over <strong>±135°<\/strong>; firmware clamps the last 15° at each end.<\/p>\n<\/blockquote>\n<p>Applies to every branch and, if the owner wants, to the v1.1 concepts as a firmware + one-switch change (the locks themselves are not edited). Same firmware for ONE SHEET and FOLD; only where a new switch would sit differs.<\/p>\n<p>Owner (verbatim): \"also i want to make sure the delay can be timed to the midi if there is midi tempo control\" · follow-up: \"am i missing a control to turn that tempo sync on / off?\"<\/p>\n<p><strong>Short answer to the follow-up: yes, you are.<\/strong> The spec reads MIDI clock but has no visible way to choose \"follow the clock\" or \"ignore it\". Eng's research note proposed a hidden gesture (hold TAP + turn TIME, <code>eng/single-chip-research.md<\/code> §5.2), which never reached the panel spec. Below are the two honest options. <strong>Option B adds a control, so it's an owner decision.<\/strong> Systems recommends B.<\/p>\n<p>Marks: <strong>[ENG]<\/strong> = from the eng docs. <strong>[CALC]<\/strong> = my arithmetic. <strong>PROPOSAL<\/strong> = systems design, not yet approved.<\/p>\n<hr />\n<h2>1. What the hardware can already do [ENG]<\/h2>\n<ul>\n<li>Clock arrives on <strong>both transports<\/strong>: USB-MIDI (Seed's own port via the rear USB-C) and TRS MIDI IN (6N138 → USART1_RX). \"Both transports are parsed on the control path and feed the FX tempo. 0 pins.\" (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §5.4.)<\/li>\n<li>The echo runs in DSP, wet only, mixed in DSP; \"MIDI-synced repeats\" and click-free crossfades are listed as reasons for DSP mixing (§6.2).<\/li>\n<li>Long buffers live in the Seed's SDRAM (§6.2). A 10 s stereo float buffer is 10 × 48,000 × 2 × 4 B ≈ 3.8 MB [CALC], a small slice of the 64 MB. <strong>Buffer length is not a limit<\/strong> on synced divisions.<\/li>\n<li>Panel parts in force: echo TYPE (4-way rotary), TIME (pot, no detents), REPEATS, ECHO MIX, TAP (momentary), one bicolour status light (H7). All read through the mux, ≈ 45 of 48 channels used (<code>single-chip-research.md<\/code> §5.2). <strong>One spare-ish mux channel is enough for one more switch<\/strong> (46 of 48).<\/li>\n<li>TAP already carries gestures: hold at power-on = full autotune / DFU; EMPHASIS full + hold TAP = filter cal; hold TAP = battery % query (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §3.2, §7.3).<\/li>\n<li>Rules that bind: \"knob-only controls send no MIDI\", \"MIDI never flips switches\". FX controls are not MIDI-controllable in the spec.<\/li>\n<\/ul>\n<h2>2. The question, stated plainly (draw: \"State the problem in words as clearly as possible\")<\/h2>\n<p>Sync on/off is really one question: <strong>does TIME mean milliseconds or beats?<\/strong>\n- In milliseconds, the echo is free: TIME sets a length, TAP sets a length.\n- In beats, TIME picks a <strong>note division<\/strong> of a tempo, and the tempo comes from the MIDI clock if there is one, or from TAP if there isn't.<\/p>\n<p>So the control isn't \"MIDI on / off\". It's <strong>which scale TIME is read on<\/strong>. That makes the panel tell the truth (J4: the knob positions are the state).<\/p>\n<h2>3. Option A: no new control (automatic + hidden override). $0<\/h2>\n<ul>\n<li>Clock present → the echo follows it; TIME becomes a division picker.<\/li>\n<li>Clock absent → free milliseconds.<\/li>\n<li>To stay free while a clock is running: hold TAP and turn TIME (eng's gesture). Release: the status light confirms with 2 flashes.<\/li>\n<li><strong>Cost:<\/strong> $0, no panel change.<\/li>\n<li><strong>Against:<\/strong> the mode lives in memory, not on the panel. In a DAW that sends clock all the time, the echo silently changes meaning when he plugs in, and the TIME knob's position stops matching what he hears. It overloads TAP (already 3 gestures). His own question shows he expected a switch.<\/li>\n<\/ul>\n<h2>4. Option B: a SYNC switch, FREE / SYNC. ≈ $1 · <strong>OWNER CHOSE B (2026-11-13 11:58)<\/strong><\/h2>\n<p><strong>Part:<\/strong> the same mini toggle as the panel's others (one element of each kind), ON-ON, 2 positions. One mux channel (→ 46 / 48). Cost ≈ $1 with nut (ESTIMATE, same part family as VEL/PARA). Placement: the visual designer's call per concept; systems' constraint is <strong>near TIME and readable from the playing position<\/strong>, on the panel or on the jack wall. On the panel it breaks the current mirror, so each branch must find its partner or its reason.<\/p>\n<p><strong>TIME carries two printed scales<\/strong>, one per switch position (machine-marked, H6):\n- <strong>FREE:<\/strong> ≈ 20 ms → 2 s, log taper (PROPOSAL; the range isn't in the spec yet).\n- <strong>SYNC:<\/strong> 9 zones, short → long, ≈ 30° each with hysteresis so a zone never flickers:\n  <code>1/16 · 1/8T · 1/16. · 1/8 · 1/4T · 1/8. · 1/4 · 1/4. · 1/2<\/code> (PROPOSAL). Dotted eighth sits near the middle, where the dub throw lives.<\/p>\n<h3>Behaviour table (PROPOSAL)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>SYNC switch<\/th>\n<th>MIDI clock<\/th>\n<th>TIME means<\/th>\n<th>TAP does<\/th>\n<th>Echo length<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"SYNC switch\">FREE<\/td>\n<td data-label=\"MIDI clock\">absent<\/td>\n<td data-label=\"TIME means\">ms<\/td>\n<td data-label=\"TAP does\">tap 2+ times: echo length = the tap interval<\/td>\n<td data-label=\"Echo length\">TIME, or the last tap until TIME moves (jump-on-move)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"SYNC switch\">FREE<\/td>\n<td data-label=\"MIDI clock\">present<\/td>\n<td data-label=\"TIME means\">ms<\/td>\n<td data-label=\"TAP does\">same as above; <strong>the clock is ignored<\/strong><\/td>\n<td data-label=\"Echo length\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"SYNC switch\">SYNC<\/td>\n<td data-label=\"MIDI clock\">absent<\/td>\n<td data-label=\"TIME means\">division<\/td>\n<td data-label=\"TAP does\">tap 2+ times: sets the <strong>tempo<\/strong> (the tap is the quarter note)<\/td>\n<td data-label=\"Echo length\">division × tapped tempo (default: last tempo, kept in flash; 120 BPM on first ever boot)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"SYNC switch\">SYNC<\/td>\n<td data-label=\"MIDI clock\">present<\/td>\n<td data-label=\"TIME means\">division<\/td>\n<td data-label=\"TAP does\"><strong>nothing to the tempo<\/strong>: the clock has it. Status light gives 1 short amber flash to say so<\/td>\n<td data-label=\"Echo length\">division × clock tempo<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Clock handling (firmware)<\/h3>\n<ul>\n<li><strong>Lock:<\/strong> after 24 ticks (one beat) with stable spacing. Tempo = rolling average over the last 24 ticks, then smoothed; the echo updates only when the smoothed tempo moves &gt; 0.5 %, so USB jitter never makes TAPE warble.<\/li>\n<li><strong>Lost:<\/strong> no tick for 500 ms (that covers tempos down to 60 / (24 × 0.5) = 5 BPM [CALC]). The echo <strong>holds the last tempo<\/strong>; nothing jumps. TAP becomes live again.<\/li>\n<li><strong>START (0xFA):<\/strong> no effect on the echo (a delay line has no bar position). <strong>STOP (0xFC):<\/strong> tails keep ringing; the echo is never cut.<\/li>\n<li><strong>Both transports sending:<\/strong> USB wins while it's ticking; TRS takes over after USB has been silent 500 ms. (PROPOSAL; eng may prefer \"first to arrive wins\". Low stakes.)<\/li>\n<li><strong>Tempo or division changes:<\/strong> TAPE and BBD <strong>glide<\/strong> (≈ 150 ms, like a tape motor changing speed: the pitch bend is the character). CLEAN and PING-PONG <strong>crossfade<\/strong> between two read heads (≈ 50 ms), so there's no pitch artefact.<\/li>\n<li><strong>PING-PONG:<\/strong> the division is per side (L, then R).<\/li>\n<li><strong>Longest echo:<\/strong> 1/2 note. At 40 BPM that's 3 s [CALC]; inside the buffer.<\/li>\n<li><strong>ECHO MIX at 0:<\/strong> the echo still tracks tempo, so bringing it up lands in time.<\/li>\n<\/ul>\n<h3>Feedback (status light, H7 kept)<\/h3>\n<p>Low-priority flashes; tune-failed and low-battery always win.\n- After a tap tempo: the light flashes the tempo 4 times (green, 40 ms), then returns to normal. (This is the visual designer's v1.1 proposal; systems adopts it.)\n- Clock locks while in SYNC: 2 green flashes on the beat. Clock lost: 2 amber flashes.\n- TAP pressed while the clock has it: 1 short amber flash.\n- <strong>Alternative for the director/owner:<\/strong> a lit TAP cap blinking the echo tempo all the time (the pedal convention). Clearer, especially in sun, but it's a second light and breaks H7.<\/p>\n<h3>What doesn't change<\/h3>\n<ul>\n<li>No MIDI CC for TIME or the switch (\"knob-only controls send no MIDI\"; \"MIDI never flips switches\").<\/li>\n<li>Little D does <strong>not<\/strong> send clock out. <strong>Scope question for the owner:<\/strong> would he want the tapped tempo sent as clock on USB/TRS OUT, to drive a drum machine in the park? Firmware only, but it's new behaviour.<\/li>\n<\/ul>\n<h2>5. Flow: F13 Echo in time with a MIDI clock (job J19b–d)<\/h2>\n<ol>\n<li>Connect the clock source: USB-C to a computer/DAW, or TRS MIDI IN from a drum machine or sequencer.<\/li>\n<li>(Option B) SYNC switch → SYNC. (Option A: nothing.)<\/li>\n<li>Start the clock. Status light: 2 green flashes = locked.<\/li>\n<li>Turn ECHO MIX up; pick a division on TIME's SYNC scale (e.g. 1/8.); REPEATS to taste.<\/li>\n<li>Change tempo on the source: the echo follows (TAPE glides, CLEAN crossfades).<\/li>\n<li>Stop the clock: tails ring; the echo holds the tempo (2 amber flashes).<\/li>\n<li>Want free time back: SYNC switch → FREE; TIME reads milliseconds again. (Option A: hold TAP, turn TIME.)<\/li>\n<\/ol>\n<h2>6. Flow: F14 Tap tempo with no clock (the park case)<\/h2>\n<ol>\n<li>SYNC → SYNC. Tap TAP 2–4 times on the quarter note (taps &gt; 2.5 s apart start over).<\/li>\n<li>Light flashes the tempo 4 times. Pick a division on TIME.<\/li>\n<li>Or SYNC → FREE and tap the echo length itself.<\/li>\n<\/ol>\n<h2>7. Open, for eng (none blocks the design)<\/h2>\n<ul>\n<li>FREE range (20 ms–2 s) and the 9 divisions: confirm against the echo models.<\/li>\n<li>Tap-interval and clock-tempo limits (proposal: 30–300 BPM).<\/li>\n<li>Mux channel 46 confirmed free on the right mux for each concept (FOLD's base mux was at 33/32 before the 3rd mux).<\/li>\n<\/ul>", "lead": "> Rev 1.1 (2026-11-13, concept turn 1). Owner chose option B (11:58, design/owner.md). Placement checked with labels (concepts/common-how-it-works.md §2): > - ONE SHEET frame (128.0, 132.7); FOLD lid (133.0, d 70.6). > - Throw left / right ", "jump": ["1. What the hardware can already do [ENG]", "2. The question, stated plainly (draw: \"State the problem in words as clearly as possible\")", "3. Option A: no new control (automatic + hidden override). $0", "4. Option B: a SYNC switch, FREE / SYNC. ≈ $1 · **OWNER CHOSE B (2026-11-13 11:58)**", "5. Flow: F13 Echo in time with a MIDI clock (job J19b–d)", "6. Flow: F14 Tap tempo with no clock (the park case)", "7. Open, for eng (none blocks the design)"], "code": "D-040"}, "R-001": {"kind": "record", "sub": "record", "title": "Owner record (the instrument)", "stage": "Concept", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "design/owner.md", "html": "<h1>Owner direction — Little D (budget instrument)<\/h1>\n<p>Shared owner history for the whole project (both instruments): /home/claude/model-d/archive/full-instrument/owner.md — read it; most decisions there apply here too.<\/p>\n<h2>2026-11-12 — start of Little D design work<\/h2>\n<p>Owner (verbatim): \"Pause the designers on the full instrument and let's focus on the budget one for now. I want designs for the budget one and I want the enclosure to be coherent in form with some clear perspective. Design principles with a solid basis of logic in the idea of the thing. Get creative here.\"\nRecorded as:\n- Full instrument design PAUSED. Little D is the focus.\n- Wants designs (concepts) for Little D.\n- The enclosure must be coherent in form, with a clear point of view.\n- The design should rest on explicit design principles that follow logically from the idea of the thing (what it is), not decoration.\n- Creative licence: \"Get creative here.\"<\/p>\n<h2>Decisions already made that bind Little D (from the shared history; see eng/budget-variant.md)<\/h2>\n<ul>\n<li>One test unit; owner builds it. Hand-soldered through-hole only; SMD only as ready-made plug-in modules. Bare boards; prefer quantity-1 fabs.<\/li>\n<li>Voice: 3 VCOs, all original waveforms, original-style chips (modern equivalents e.g. AS3046; no vintage parts), ladder filter with mixer overdrive, 2 analog contours with overshoot, VCA, glide, autotune (no manual calibration).<\/li>\n<li>Keys: 25 minimum (two octaves); velocity REQUIRED; as silent as possible; \"feel like an instrument\" (not clicky); real bought parts — no 3D-printed keys/knobs/wheels; owner may laser/CNC-cut parts himself at Vector Space (key tops OK); no harvested keybeds. Key mechanism being rethought from first principles (archive/full-instrument/concepts/keys/first-principles.md when done).<\/li>\n<li>Bend/mod: bend = joystick restricted to one direction, springs back; mod = a control that stays put (dial or fader); mod depth MIDI-controllable (jump-on-move).<\/li>\n<li>MIDI: USB-MIDI + 3.5 mm TRS MIDI in; MIDI-controllable params per eng; knob-only controls send no MIDI; MIDI never flips switches.<\/li>\n<li>Built-in speaker (LM386) + outputs. No additional patch points beyond pitch CV/gate out + filter CV in.<\/li>\n<li>Power: USB power bank or internal LiPo (open; ~+$21 for internal).<\/li>\n<li>Size: portable; OP-1 is a loose reference only (\"it should feel good to use\"). Eng's working box ~285 × 160 × 30 mm.<\/li>\n<li>Cost is the owner's main concern (current estimate ~$239–320 one unit). Enclosure: laser-cut/CNC at Vector Space (material cost) preferred.<\/li>\n<li>Owner wants to SEE visual mocks to judge looks.<\/li>\n<\/ul>\n<h2>2026-11-12 — owner answers (asked one at a time at the owner's request: \"Also ask me open qs one at a time\")<\/h2>\n<p>Q: self-protecting body (~+$10–20) vs separate sleeve? → Owner: \"Show me both\" — decide after seeing mocks; keep both kinds in the set.\nQ: what should velocity change? → Owner: \"Both, with a switch\" — a switch selects velocity → loudness / filter / both.\nQ: bend up+down or up only? → Owner: \"Up and down\" — one axis, springs to centre (as assumed).\nQ: avoid the Moog look entirely? → Owner (verbatim): \"Nods are fine but I want to see breadth of explorstion\" — subtle nods to the Model D are allowed (no copying); priority is a broad range of exploration across the concepts.\nQ: is ~36 mm body thickness OK? → Owner (verbatim): \"I have no idea you tell me. How tall is op1\" → Orchestrator answered: OP-1 is 13.5 mm (TE spec); recommended ~36 mm body / ≤40 mm to knob tops for Little D (full-size knobs, key travel, jacks). Treat as the working decision unless the owner objects.\nQ: bare vs standard printed board? → Owner: \"Standard (printed)\" — solder mask + silkscreen.\nQ: flat piano tops vs maple pegs? → Owner: \"Show me both\".\nQ: build the first two real keys (C, C#) as the one feel check? → Owner (verbatim): \"I don't want to build custom keys\"\nRecorded as: owner does NOT want to build a custom key mechanism (this challenges RAIL / FLOAT / COMB, which are owner-built). Conflicts with earlier constraints (no harvested keybed; no bare mini keybed sold to individuals; real parts; velocity; silent). Orchestrator asking the owner to choose among the remaining routes.\nQ: which key route (bought switches + snap-on tops / full-size Fatar / silicone pads / reconsider harvesting)? → Owner: \"Whatever the design needs\"\nRecorded as: key route is the design team's call per concept, within: no custom-built key MECHANISM by the owner (no rods/tubes/flexure assemblies to build) — prefer bought mechanisms (switches, pads, bought keybed) with minimal assembly; harvesting still not chosen by owner (he didn't select it); velocity + silence still required.<\/p>\n<h2>2026-11-12 — owner feedback on round-1 sheets (seen marked rough)<\/h2>\n<p>Owner (verbatim): \"Typecase hush and hymnal are really cool. I like those. I have some feedback though. The filter sections should not be raised. That would make the knobs Hard to access. And I want to see a version of one sheet that is made from a 3-D printed enclosure. I feel like hush could similarly be made from a 3-D printed enclosure, and then the wool felt applied. That's super interesting. I also in the old diagrams, I really liked the idea of a two-part folding unit. I liked the one that was walnut with the white panel. I'd like to see something like that in this round that is foldable with the controls on the top part and with a white panel that gets screwed into a darker surrounding area. I don't think I wanna make it out of walnut, but that's a possibility. I have some at my house that I could plane. I'd like to see that first explored as 3-D printable.\"\nRecorded as:\n- LIKED: TYPE CASE, HUSH, HYMNAL.\n- RULE: no raised filter section (or raised control section) — it makes knobs hard to reach. Applies to all concepts.\n- ADD: a ONE SHEET version made as a 3D-printed enclosure.\n- ADD: HUSH as a 3D-printed enclosure with wool felt applied over it (\"super interesting\").\n- ADD: a two-part FOLDING unit, like the earlier full-instrument concepts (owner recalls \"walnut with the white panel\" — likely a mix of round-1 CASE clamshell / MOTTO; the full-instrument mocks are in archive/full-instrument/concepts/ incl. archive): controls on the top (lid) part, a white panel screwed into a darker surround. Explore FIRST as 3D-printable; walnut (owner has some at home he could plane) is a possible later material.\n- 3D-printed ENCLOSURES are now welcome (earlier \"real parts\" rule covers knobs/keys/touched controls, not the enclosure). Vector Space printers: Prusa MK3/MK4/Core One (~250 mm beds), TAZ6, Voron Trident/2.4, Gigabot (larger; volumes unverified) — a 298 mm body needs a split or a large printer.\n- UNDER GLASS (director's replacement for ONE SHEET) was not yet shown to the owner and he didn't mention it.\nOwner (verbatim): \"Also important to note, little D is a terrible name. It sounds like little penis. I could see big D energy or just big energy or something like that, but the name needs work.\"\nRecorded as: DROP \"Little D\" as a name (working folder path stays design/ for continuity). The budget instrument needs a real name; owner floated \"big D energy\" / \"big energy\" as directions. Naming to be explored by the design team; until then call it \"the budget instrument\" in owner-facing material.\nOwner (verbatim): \"I actually think this is going to be the real instrument I'm trying to make the most interesting thing overall and it's this for me\"\nRecorded as: the budget instrument is now THE instrument — the main project and the one the owner most wants to make interesting. The full instrument stays paused (no decision to cancel it). Aim for the most interesting result overall.\nOwner clarification (verbatim): \"On the type case feedback whati was talking about was the dividers that got in the way of the knobs\"\nRecorded as: the \"raised\" complaint was about TYPE CASE's section DIVIDERS getting in the way of the knobs — remove them (e.g. flush engraved grooves/inlays, or separations that don't rise above the panel). The owner did NOT object to the front rail; the systems designer's flat-front-rail change was an over-reading — the design team may restore the round-1 front rail/lip if it served the concept (bag protection), as long as nothing gets in the way of the knobs.\nOwner (verbatim): \"That includes the separator between keys and controls too\"\nRecorded as: the separator between keys and controls (TYPE CASE's front rail) also goes — nothing raised between the keys and the controls. The systems designer's flat-front / keys-near-panel-height rule stands after all.\nOwner (verbatim): \"Use another method of separation if you think it's important to feel the sections\"\nRecorded as: if tactile section-finding matters, use a different, non-obstructing method (e.g. texture changes, shallow grooves, a different knob shape/colour per section, raised dots below the panel plane) — designers' call; nothing may rise in the way of the knobs.<\/p>\n<h2>2026-11-12 — after seeing the four 9s (HUSH, FOLD, TYPE CASE, HYMNAL)<\/h2>\n<p>Owner (verbatim): \"Let's pause on everything but hush fold and one sheet.<\/p>\n<p>On hush and one sheet — I'd like the enclosure to be as \"unibody\" (on each half with fold) as possible. Screws in the back instead of front, etc, where panels need to be installed. Hush should be more rounded around the edges, organically, so the felt can wrap seamlessly around it. Folds original color way was way better lets go back to that vibe. Also the knob layout is adding extra space in front of the keyboard that's awkward, I like the keys right up to the edge, so rework the knobs to be logically split, and maybe it could get a bit narrower. Let's not worry about a case for hush or one sheet yet\"\nRecorded as:\n- ACTIVE: HUSH, FOLD, ONE SHEET. PAUSED: TYPE CASE, HYMNAL (both scored 9; kept on file).\n- UNIBODY: HUSH and ONE SHEET enclosures as close to a single seamless body as possible; for FOLD, each half a unibody. Fasteners hidden — screws from the back/underside, not the front/top, wherever panels are installed.\n- HUSH: rounded, organic edges all round so the felt wraps seamlessly over them.\n- FOLD: return to its ORIGINAL colourway vibe (owner's words; interpretation being confirmed — likely the round-2 FOLD: white faceplates, dark housing, blue knobs, cream CUTOFF).\n- LAYOUT (all three): no awkward extra space in front of the keyboard — keys run right up to the front edge. Rework the knob layout so it's logically split (e.g. rows/sections arranged to free that front space), and it may get a bit narrower.\n- NO carry case/sleeve/flap work for HUSH or ONE SHEET for now.\nQ: FOLD \"original colourway\" = round-2 blue-knob FOLD, or the old walnut + white from the full-instrument mocks? → Owner: \"The old walnut + white\" — the walnut-with-white-panel look from the full-instrument mockups (see archive/full-instrument/concepts/archive-315mm/, case/, look-sheet.png; owner earlier: \"I liked the one that was walnut with the white panel\"). Walnut-toned housing (printed in a walnut-like colour first; real planed walnut later) with a white panel.\nOrchestrator note: the \"walnut + white\" look the owner means is almost certainly the \"Proof\" look (walnut ply body, cream/white panel, black knobs and legends, red CUTOFF) shown on the full-instrument look sheet: /home/claude/model-d/archive/full-instrument/concepts/look-sheet.png (top-right). FOLD should return to that vibe: walnut-toned housing (printed in a walnut-like filament first; real planed walnut later), cream/white panel, black knobs, red CUTOFF.\nOwner (verbatim): \"I also liked the rounded edges of the original fold with flat top and bottom. I imagine the housing being a hollowed out block that the face plate with filters and keyed get installed in, sort of like a guitar with pickguard that has controls attachdd\"\nRecorded as (FOLD, and a construction idea that suits the unibody brief generally):\n- Keep the ORIGINAL FOLD's rounded edges with flat top and bottom faces.\n- Construction metaphor: a guitar body + pickguard. The housing is a hollowed-out solid block (unibody); a faceplate carrying the controls (knobs etc. — \"filters\" likely means the filter/controls) and the keys installs into the hollow, like a pickguard with controls attached. The faceplate/pickguard is the white panel; the block is the walnut-toned body.\nOwner (verbatim): \"The screw placement is malleable but yes screw from back is ideal.\"\nRecorded as: screws from the back are IDEAL but not mandatory — flexible where the pickguard construction needs top fixings (keep them tidy/intentional).\nOwner (verbatim): \"One sheet and hush feel like the controls are installed from behind and then a panel screwed in on the back\"\nRecorded as: ONE SHEET and HUSH construction — unibody shell open at the back/underside; controls (boards, pots, keys) install from behind through that opening, poking up through the closed top face; then a back panel screws on to close it. (FOLD uses the guitar block + pickguard logic instead.)\nOwner (verbatim), on \"no battery fits FOLD's lid, default to a USB power bank\": \"What do you mean there's no battery thing enough we are designing this\"\nRecorded as: an INTERNAL battery is expected — the enclosure must be designed around one (\"completely portable\"). The \"no battery fits\" finding only applied to the 30 mm lid band; find space (e.g. flat pouch cells under the key board or main board, a deeper/thicker section, the base half) in all three concepts. Battery life target not yet stated (orchestrator proposed ~4–5 h).\nQ: FOLD with the ladder filter moved to the base (EMPHASIS beside CUTOFF) — big 22 Wh battery with 113 mm halves, or slim 11 Wh (4× PiShop 952540) with 105 mm halves? → Owner: \"Show me both\".\nPending owner answer: ONE SHEET needs a ~1 h, 80×80 mm test print at Vector Space to prove its surface finish — print it, or drop ONE SHEET?<\/p>\n<h2>2026-11-12 22:30 — owner feedback on round 4<\/h2>\n<p>Owner (verbatim): \"On fold — there's still something off about the controls layout that doesn't feel balanced yet. On one sheet I love the rings texture — can we figure out how to reduce and only use no texture and that texture? Also I'm thinking — Is there a way for us to build in some effects, mainly a delay and echo? Also both of them have a lip after the keys — I want to make sure the keys are somewhat raised so you can feel them at minimum, and I'm not fully understanding the press mechanism, I may want them at the edge altogether depending on if they're like real keys. Can you draw the mechanism for me in a diagram. I'd also like front views of all of these so I can see the details.\"\nRecorded as:\n- FOLD: control layout still feels unbalanced — rework for visual/functional balance.\n- ONE SHEET: LOVES the rings texture (the concentric rings under knobs); reduce the finish vocabulary to exactly two: no texture, and the rings texture.\n- NEW FEATURE REQUEST: built-in effects, mainly a delay and echo — engineering to propose options.\n- KEYS (HUSH, ONE SHEET): there's a lip/edge in front of the keys; keys should be at least somewhat raised so they can be felt; owner may want keys right at the edge with no lip, depending on whether they behave like real keys. Owner wants a diagram of the key press mechanism.\n- Wants FRONT VIEWS (elevations) of all concepts to see details.\nOrchestrator showed a key-mechanism side-view diagram and explained honestly: short-travel (2.8 mm) button-keys, not pivoting piano keys.\nQ: keys at the front edge with no lip, standing ~2–3 mm proud of the panel? → Owner: \"Show me both\" (at-edge raised vs keep a small lip) — decide from front views.\nQ: echo — PT2399 (cheap, ~0.5 s, no sync) vs digital delay on a 2nd Pico (sync, 4+ s)? → Owner (verbatim): \"Is there a single chip that could handle all of it? We could go back to first principles a bit have an agent research\"\nRecorded as: research from first principles whether ONE chip can handle all of it — the delay/echo (incl. sync and longer delays) and ideally the existing digital duties (MIDI, autotune, key scanning, control CVs) — rather than adding chips. Owner wants a research agent on it.\nOwner (verbatim, 2026-11-13 09:02): \"I want echo and reverb\"\nRecorded as: effects scope = ECHO and REVERB (reverb newly in scope; earlier docs said reverb out of scope — superseded).\nOwner (verbatim): \"Delay and verb can be digital\"\nRecorded as: CONFIRMED — the delay/echo and reverb may be digital (the synth voice stays analog).\nOwner (verbatim): \"I would want great models tho — would be cool if digital could do more than one type.\"\nRecorded as: effect QUALITY matters — great-sounding models (not toy delay/reverb); multiple types selectable (e.g. tape echo / clean digital delay; plate / hall / spring reverb).\nResearch result (eng/single-chip-research.md): existing Pico 2's second core runs echo + reverb with a Teensy Audio Shield Rev D (SGTL5000) module + 74HC595 + TL072, ≈$22–25; echo types TAPE/BBD/CLEAN/PING-PONG, reverb PLATE/HALL/SPRING/SHIMMER; MIDI clock sync; one-evening breadboard test before board order; Daisy Seed is the fallback.\nQ: FX controls — full 8 (echo TYPE, reverb TYPE, TIME, REPEATS, ECHO MIX, DECAY, REVERB MIX, TAP) vs compact 5? → Owner: \"Full 8, grow the panel\".\nOwner (verbatim): \"Check the pin thing. Audio feels the most important since we're introducing digital stuff\"\nRecorded as: verify whether the Daisy Seed's exposed pins can handle all control duties (3 VCO frequency counts via timer input capture, key/knob mux scanning, PWM CVs, DAC buses, MIDI, FX controls). PRIORITY: AUDIO QUALITY of the digital effects is the most important factor in the Pico-vs-Daisy choice.\nOwner (verbatim): \"I like the idea of drift, but I'd want it to be controllable\"\nRecorded as: ADD a controllable DRIFT (firmware-generated slow random pitch wander per oscillator, 0 = rock steady autotuned) — a panel control (knob), placement for the design team; affects layout (+1 control).\nOwner (verbatim): \"On fold, we should build some sort of method for the top case to stand up, either at a full 90° or some useful angle. It should fit the design language of the device and should blend into the case\"\nRecorded as: FOLD's lid must also be able to stand up — at 90° or another useful playing angle (in addition to lying flat at 180°) — via a mechanism that fits FOLD's design language and blends into the case (no bolted-on prop).\nOwner (verbatim): \"It is not a requirement that you can change the angle\"\nRecorded as: one fixed standing angle is fine (plus flat/closed); no adjustable-angle mechanism needed.\nPin/audio check (eng/daisy-pin-and-audio-check.md): Daisy Seed fits all I/O (26/31 pins; TIM5 32-bit counters ×4); Pico plan fits only 26/26 and misses filter-cal counter + MIDI out. Codecs: SGTL5000 85–90 dB ADC vs PCM3060 99 dB vs TAC5242 110 dB. Daisy runs lush hall reverbs (CloudSeed) the Pico can't.\nQ: switch the digital brain to the Daisy Seed? → Owner: \"Switch to Daisy Seed\".\nDECISION: Daisy Seed (Seed3 or 65 MB Seed2 DFM, current revision; avoid used Rev 5) replaces the Pico 2 as the single digital chip (control + echo/reverb). Dry voice path stays analog. Breadboard spike before layout re-aimed at Daisy.\nOwner (verbatim): \"Also the key thing you need to port - go back to first principles and see if there's a better way with Daisy seed. Do this with all the things Daisy seed affects\"\nRecorded as: re-derive from first principles every digital subsystem the Daisy Seed touches (key scanning/velocity, autotune frequency measurement, pot scanning, CV generation, MIDI/USB, FX, power) for the best Daisy-native approach — not a straight port of the Pico design.\nDaisy first-principles design: eng/daisy-first-principles.md (3 muxes on separate ADCs, Hall power-gating, TIM5 VCO counting + codec right-channel filter cal, coarse+fine pitch DACs, CUTOFF CV gap fixed, single rear USB-C, wet-only FX return, +$11–15, 27/31 pins, two-evening breadboard test).\nQ: add a 3.5 mm TRS MIDI OUT jack (free in pins)? → Owner: \"Add MIDI out\".\nOwner (verbatim), on adding channel aftertouch via a pressure strip under the key strip: \"i think it needs its own switch but yes now i want it\"\nRecorded as: ADD channel aftertouch (pressure strip under a compliantly mounted key strip, one Daisy ADC input), with its OWN destination switch (separate from the velocity LOUD/BOTH/FILT switch) — e.g. VIBRATO (mod depth) / OFF / FILTER; sent over MIDI out too. +1 toggle on the panel.\nExplore reports: explore/easier-cheaper.md, explore/cooler.md, explore/poly-hybrid.md (recommendation: stay with the Model D-based build; add paraphonic mode; Juno-60-style poly or Synthi-style lunchbox as a later instrument).\nQ: add paraphonic mode? → Owner (verbatim): \"would love to add it but how would keytracking work with the different oscillators?\" — wants it, pending an answer on key tracking.\nOrchestrator explained paraphonic key tracking (each note tracks; RANGE kept; FREQ 2/3 become fine detune in PARA; filter tracks highest note by default, changeable via key combo; shared envelopes) and voice allocation (next free oscillator; spare oscillators double, lowest note; oldest-note stealing; PARA+4 uses the Daisy's digital 4th osc).\nOwner (verbatim): \"how does it know what note to send to what oscillator\" → answered; then \"yeah so firmware could even improve the paraphonic control over time right?\" → yes (USB-C firmware updates; hardware limits: one filter, shared analog envelopes, 3 analog VCOs + digital 4th).\nRecorded as: PARAPHONIC MODE APPROVED (MONO / PARA / PARA+4 toggle). Firmware is updatable and expected to evolve.\nRound 5 sheets (A + D for HUSH, ONE SHEET, FOLD-105; E for FOLD) sent to owner after director scored all three 9.\nQ: key edge A (keys at the edge, raised, no lip) or B (small lip)? → Owner: \"A: keys at the edge\". DECISION: edge A for HUSH and ONE SHEET.\nQ: which concept to build? → Owner (verbatim): \"i think the fold's angle should be a bit less steep so the front face catches more light. also i want the bend slider to be a joystick (is it a snap to center fader or what? cant remember where we landed there)\" — no pick yet.\nRecorded as: FOLD standing lid should lean back further (less steep than 105°) so the panel face catches more light. Bend control must be (and read as) a JOYSTICK — orchestrator to clarify current design (spring-to-centre mini thumbstick gated by a slot to one axis, which reads like a fader).\n2026-11-13 Owner (verbatim): \"actually forget i said that. just lock all of these as official versions and create a way for me to get a new orchestrator involved. i just saw that you compacted.\"\nRecorded as: HUSH, ONE SHEET, FOLD-105 (round 5, plus FOLD 120° stand spec + bend-reads-as-joystick redraw in progress) LOCKED as official v1 → versions/v1/. Owner leans toward building ONE SHEET or FOLD (undecided). The creative-rounds request in the same message was WITHDRAWN by the owner (\"forget i said that\") — do not act on it unless he raises it again.\n2026-11-13 Owner (verbatim): \"oh do those first\" (the 120° stand + joystick redraw, before the git move) · repo: \"heres the repo when this is done. dont assume it needs to be zipped https://github.com/adamtrabold/big-energy\"\nRecorded as: FOLD stand 120° + bend drawn unmistakably as a joystick (round opening, stem, cap; B-sheet callout) + FOLD sheet D MIDI IN fix → director held all three at 9 → locked as v1.1 (versions/v1.1/), superseding v1 sheets. Repo adamtrabold/big-energy is the working home (plain files).\n2026-11-13 Owner (verbatim): \"why in the design folder are the folders instrument and little-d? that doesn't really follow the versioning in a way that's easy to understand\" → \"yes and also let's resolve that verisoning thing i mentioned\"\nRecorded as: repo restructured: versions/ (v1, v1.1) at top with VERSIONS.md; design/ = the instrument being built (was design/little-d); archive/ = full-instrument, paused concepts, superseded FOLD sheets. FOLD files drop the -105 suffix. Locked folders are never edited; new locks go to versions/vN + a VERSIONS.md line.<\/p>\n<h2>2026-11-13 11:47 — branched creative rounds (the request is back on)<\/h2>\n<p>Owner (verbatim): \"i think i want to move forward with one sheet and the fold (can't decide yet, but the internals are probably the same eh?). but first i'd like to take these versions and do some creative rounds (again, using the randomness principles) to explore how to add some more personality. i <em>love<\/em> the peg keys on the hush, for example, and those on the fold may add an \"organ like\" feel or something idk. im not saying that is an official direction to explore, but im saying we need to push for more of an even more holistic <em>point of view<\/em> / concept in some branched versions (i may still come back to these). follow principles of design of furniture (theres even a great book on this called principles of design), instruments, tools, but also artistic inspirational forms and emotion. i want to take this to the park and be inspired. also i want to make sure the delay can be timed to the midi if there is midi tempo control\"\nRecorded as:\n- Leaning toward ONE SHEET and FOLD (still undecided). Orchestrator answered: the electronics and spec are shared; the board split differs (FOLD has a hinge cable, ONE SHEET is one deck).\n- NEW WORK: branched creative rounds starting from the v1.1 versions, using real randomness (as in earlier jams), to add PERSONALITY and push each branch toward a more holistic point of view / concept. The v1.1 locks stay as they are; he may come back to them.\n- LOVES HUSH's peg keys.
