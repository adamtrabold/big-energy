-wall.jpg<\/code><\/td>\n<td data-label=\"Status, my honest read\">Shown as a straight elevation on a wall: the honest view of a wall object. The cleat itself is behind (systems §5).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Open<\/h2>\n<ul>\n<li>The bone + walnut pair in hand (above).<\/li>\n<li>Whether the butterfly on an end butt reads as \"Nakashima\" to someone who knows (precedent UNVERIFIED).<\/li>\n<li>POWER's legend position depends on the real offcut's edge.<\/li>\n<\/ul>", "lead": "Seed: ONE SHEET (v1.1, 276 × 180). Kind: furniture. Point of view: from tool to tree, front to back. Exact at the playing edge, free at the rear. Emotion: longing. Flat keys (the set's non-peg answer). Read with how-it-works.md (systems rev", "jump": ["Images", "Systems' changes: I accept them", "Principles", "Look", "Motion and feedback", "What it had to prove (director)", "Open"], "group": "BUTTERFLY", "code": "D-108"}, "D-107": {"kind": "doc", "sub": "doc", "title": "BUTTERFLY · how it works", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1"}], "path": "design/branches/concepts/butterfly/how-it-works.md", "html": "<h1>BUTTERFLY: how it works (systems)<\/h1>\n<blockquote>\n<p><strong>Status 2026-11-13: RETIRED (director, round 1: 6).<\/strong> Kept for the record. Donors to other branches: the tabletop-over-apron rear (jacks sheltered under an overhang) and the live edge as a horizon.<\/p>\n<\/blockquote>\n<p>Seed: <strong>ONE SHEET<\/strong> (v1.1, 276 × 180). Kind: furniture. Point of view: <strong>from tool to tree, front to back<\/strong>: exact at the playing edge, free at the rear. Emotion: longing. Flat keys (the set's non-peg answer, director). Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>, <a href=\"#i-D-015\"><code>versions/v1.1/one-sheet/how-it-works.md<\/code><\/a>, <a href=\"#i-D-003\"><code>versions/v1.1/common-how-it-works.md<\/code><\/a> and <code>design/jobs.md<\/code> rev 5.<\/p>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (systems first).<\/strong> Numbers marked [CHECK] come from <code>../branch_check.py<\/code> §3.<\/p>\n<h2>1. What changes from ONE SHEET, and what doesn't<\/h2>\n<p><strong>Unchanged:<\/strong> the printed shell's outline (276 × 180), heights, every control, the main board, the <strong>I/O board on the printed rear wall with the jack barrels flush in its holes<\/strong>, the speaker, the battery, the back panel, v1.1's grooves and type.<\/p>\n<p><strong>Changes:<\/strong>\n1. <strong>The joint moves to y 165.0<\/strong> (§2).\n2. <strong>The rear band becomes a walnut top, laid on the shell like a tabletop on its apron<\/strong> (§3).\n3. <strong>Two bookmatched leaves joined on the axis by one butterfly<\/strong> (§4).\n4. <strong>A French-cleat slot<\/strong> in the back panel, to hang (§5).\n5. <strong>FREE / SYNC<\/strong> at (128.0, 132.7) in v1.1 ONE SHEET style, with the label fixes in common §2 (TIME / DECAY legends behind; MIXER heading to y 136).<\/p>\n<h2>2. Where the joint can go [CHECK]<\/h2>\n<ul>\n<li>At the visual designer's <strong>y 160, the joint cuts four type-fan names<\/strong>: tape and ping-pong (ECHO TYPE), plate and shimmer (REVERB TYPE). Those names sit at y ≈ 159–160. The ECHO / REVERB headings (baseline 161.8, tops 163.4) would land on the wood just behind.<\/li>\n<li><strong>The joint must sit at y ≥ 164.9 → y 165.0.<\/strong> That's 11.5 behind the FX knob edges (153.45) and 1.5 behind the headings' tops. Every legend stays on the print.<\/li>\n<li>Wood from the joint to the printed rear wall: <strong>15.0 mm<\/strong> at the deepest notch of the live edge (the director asked for ≈ 20; 15 is what the legends leave).<\/li>\n<\/ul>\n<h2>3. Construction: the top and the apron (why the jacks aren't drilled through wood)<\/h2>\n<p><strong>Drilling the jacks through the wood fails<\/strong> [CALC]:\n- the rail is 15 mm deep at its thinnest, and more where the edge wanders;\n- a 3.5 mm plug's shaft is ≈ 14–15 mm long (ESTIMATE), so plugs wouldn't reach a jack mounted on the rail's inside face;\n- moulded plug bodies need bores ≈ 8–10 mm wide (ESTIMATE);\n- the live face is irregular, so no I/O board can sit flush behind it.<\/p>\n<p><strong>What works, and it's honest furniture: a tabletop over an apron.<\/strong>\n- <strong>The printed shell keeps its rear wall<\/strong> (y 177.6–180) with the I/O board and the flush jacks exactly as v1.1.\n- <strong>Behind the joint, the shell's top steps down 6 mm<\/strong> (a rebate, y 165–180, z 18–24).\n- <strong>The walnut leaves (≈ 6 mm thick) lie in the rebate, flush with the face<\/strong> (z 24). Their live edge <strong>overhangs the printed rear wall<\/strong> by the edge's wander: <strong>0 at the deepest notch, ≈ 10–12 at the peaks<\/strong> (recommend ≤ 12). Overall depth <strong>≈ 180–192<\/strong>; the printed body stays 180.\n- <strong>The jacks sit under the overhang<\/strong>, sheltered like a drawer under a tabletop; cables leave under the live edge. Jack centres z ≈ 8–12 vs the leaf underside z 18: clear.\n- <strong>Jack legends:<\/strong> they were printed on the rear band (y 171); now they're <strong>laser-engraved into the walnut<\/strong>, located from the straight joint edge (one fence, no jig for a wandering edge).\n- <strong>Fixing:<\/strong> screws from inside, up through the rebate floor into the leaves, in <strong>holes slotted front to back<\/strong> for wood movement. Across the grain the leaves are only ≈ 15–27 mm, so seasonal movement is ≲ 0.5 mm (ESTIMATE).\n- <strong>Lighter than it looks<\/strong> (director): ≈ 6 mm of walnut, the shell hollow as before. Walnut ≈ 276 × 25 × 6 ≈ 41 cm³ ≈ 25–30 g (ESTIMATE).<\/p>\n<h2>4. The leaves and the butterfly<\/h2>\n<ul>\n<li><strong>Grain runs along x<\/strong>: a live edge always runs along the grain, so the two leaves meet <strong>end to end at x 138<\/strong>. That makes it a <strong>butt (end) match<\/strong>, not a side-by-side bookmatch.<\/li>\n<li>Resaw one offcut into two leaves; flip the second end for end. Its live edge then mirrors the first about the axis (the director's \"the wild edge mirrored about the centre\").<\/li>\n<li><strong>End grain to end grain glues badly.<\/strong> <strong>The butterfly really is the joint<\/strong>: one walnut-contrast key (wenge / bog oak), ≈ 20 × 10 on top, inlaid ≈ 3 mm (half the leaf), across x 138.<\/li>\n<li>It holds wood to wood (the director's condition).<\/li>\n<li>Nakashima's butterflies usually cross long-grain splits. <strong>This use across an end butt is less traditional (precedent UNVERIFIED)<\/strong>, though it does carry the joint.<\/li>\n<li>Each leaf ≈ 138 long: short offcuts, a small bench, cheap (ESTIMATE).<\/li>\n<\/ul>\n<h2>5. Hanging (J18, a real job here)<\/h2>\n<ul>\n<li><strong>French-cleat slot<\/strong> routed at 45° along the back panel's rear zone, <strong>y ≈ 150–170, x ≈ 40–200<\/strong>. It clears the speaker (x 215–265, y 88–138).<\/li>\n<li>Hung, the instrument's rear (the tree side) is up, the knobs face the room, and the keys are at the bottom.<\/li>\n<li><strong>Battery strap position on the back panel vs the slot: UNVERIFIED<\/strong> (check at layout).<\/li>\n<li>The cleat carries ≈ 1 kg (ESTIMATE). A 3 mm printed back panel needs a doubler or a printed rib under the slot (maker).<\/li>\n<\/ul>\n<h2>6. States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What it is<\/th>\n<th>Systems notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>Closed<\/strong><\/td>\n<td data-label=\"What it is\">n/a<\/td>\n<td data-label=\"Systems notes\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Carried<\/strong><\/td>\n<td data-label=\"What it is\">in a bag<\/td>\n<td data-label=\"Systems notes\">the live edge is the only proud thing (≤ 12 behind the rear wall); oiled walnut, no sharp bark (ease it by hand, director)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Flat<\/strong><\/td>\n<td data-label=\"What it is\">table, lap, bench<\/td>\n<td data-label=\"Systems notes\">as ONE SHEET<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Hanging<\/strong><\/td>\n<td data-label=\"What it is\">on a wall cleat, tree side up<\/td>\n<td data-label=\"Systems notes\">§5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Outdoors<\/strong><\/td>\n<td data-label=\"What it is\">grass, sun<\/td>\n<td data-label=\"Systems notes\">walnut and PETG are both fine in sun; the speaker fires down (weak outdoors, UNVERIFIED); status light hood (common §3)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>7. Can't verify here<\/h2>\n<p>Printed cream beside real oiled walnut looking intended (the director's (a), visual) · the butterfly on an end butt as a precedent · battery strap vs cleat · the back panel's strength under the cleat · plug lengths (≈ 14–15 mm is typical, not measured).<\/p>", "lead": "> Status 2026-11-13: RETIRED (director, round 1: 6). Kept for the record. Donors to other branches: the tabletop-over-apron rear (jacks sheltered under an overhang) and the live edge as a horizon.", "jump": ["1. What changes from ONE SHEET, and what doesn't", "2. Where the joint can go [CHECK]", "3. Construction: the top and the apron (why the jacks aren't drilled through wood)", "4. The leaves and the butterfly", "5. Hanging (J18, a real job here)", "6. States", "7. Can't verify here"], "group": "BUTTERFLY", "code": "D-107"}, "DIPTYCH-standing": {"kind": "image", "sub": "render", "title": "DIPTYCH standing on its red cords and brass feet (the director's test a)", "short": "standing", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-standing.jpg", "thumb": "media/t/DIPTYCH-standing.jpg", "w": 1400, "h": 1013, "orig": "1998 × 1446", "path": "design/branches/concepts/diptych/img/diptych-standing.jpg"}], "group": "DIPTYCH", "src": "media/DIPTYCH-standing.jpg", "thumb": "media/t/DIPTYCH-standing.jpg", "w": 1400, "h": 1013, "orig": "1998 × 1446", "path": "design/branches/concepts/diptych/img/diptych-standing.jpg", "code": "DIPTYCH-standing"}, "DIPTYCH-standing-side-exact": {"kind": "image", "sub": "drawing", "title": "Standing, right-end elevation, exact: 120°, the cord as drawn (38.4°; target 37.4°), feet 59 mm behind (test c)", "short": "standing side exact", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-standing-side-exact.jpg", "thumb": "media/t/DIPTYCH-standing-side-exact.jpg", "w": 1600, "h": 1443, "orig": "2856 × 2576", "path": "design/branches/concepts/diptych/img/diptych-standing-side-exact.png"}], "group": "DIPTYCH", "src": "media/DIPTYCH-standing-side-exact.jpg", "thumb": "media/t/DIPTYCH-standing-side-exact.jpg", "w": 1600, "h": 1443, "orig": "2856 × 2576", "path": "design/branches/concepts/diptych/img/diptych-standing-side-exact.png", "code": "DIPTYCH-standing-side-exact"}, "DIPTYCH-time-dial": {"kind": "image", "sub": "drawing", "title": "TIME's dial, the hero: black ms scale, red divisions, FREE / SYNC in front (14.48 px per mm, 10 mm bar; test b)", "short": "time dial · 1:1 at 14.48 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-time-dial.jpg", "thumb": "media/t/DIPTYCH-time-dial.jpg", "w": 1072, "h": 724, "orig": "1072 × 724", "path": "design/branches/concepts/diptych/img/diptych-time-dial-14.48px-per-mm.png"}], "group": "DIPTYCH", "src": "media/DIPTYCH-time-dial.jpg", "thumb": "media/t/DIPTYCH-time-dial.jpg", "w": 1072, "h": 724, "orig": "1072 × 724", "path": "design/branches/concepts/diptych/img/diptych-time-dial-14.48px-per-mm.png", "code": "DIPTYCH-time-dial"}, "DIPTYCH-lid-left-graduations": {"kind": "image", "sub": "drawing", "title": "Graduations across the lid's left half: red hairlines, black majors, engraved roman caps (test d)", "short": "lid left graduations · 1:1 at 14.48 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-lid-left-graduations.jpg", "thumb": "media/t/DIPTYCH-lid-left-graduations.jpg", "w": 1600, "h": 1275, "orig": "2072 × 1651", "path": "design/branches/concepts/diptych/img/diptych-lid-left-graduations-14.48px-per-mm.png"}], "group": "DIPTYCH", "src": "media/DIPTYCH-lid-left-graduations.jpg", "thumb": "media/t/DIPTYCH-lid-left-graduations.jpg", "w": 1600, "h": 1275, "orig": "2072 × 1651", "path": "design/branches/concepts/diptych/img/diptych-lid-left-graduations-14.48px-per-mm.png", "code": "DIPTYCH-lid-left-graduations"}, "DIPTYCH-open": {"kind": "image", "sub": "render", "title": "DIPTYCH open flat", "short": "open", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-open.jpg", "thumb": "media/t/DIPTYCH-open.jpg", "w": 1400, "h": 1040, "orig": "1974 × 1466", "path": "design/branches/concepts/diptych/img/diptych-open.jpg"}], "group": "DIPTYCH", "src": "media/DIPTYCH-open.jpg", "thumb": "media/t/DIPTYCH-open.jpg", "w": 1400, "h": 1040, "orig": "1974 × 1466", "path": "design/branches/concepts/diptych/img/diptych-open.jpg", "code": "DIPTYCH-open"}, "DIPTYCH-closed": {"kind": "image", "sub": "render", "title": "DIPTYCH closed", "short": "closed", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-closed.jpg", "thumb": "media/t/DIPTYCH-closed.jpg", "w": 1400, "h": 791, "orig": "2253 × 1273", "path": "design/branches/concepts/diptych/img/diptych-closed.jpg"}], "group": "DIPTYCH", "src": "media/DIPTYCH-closed.jpg", "thumb": "media/t/DIPTYCH-closed.jpg", "w": 1400, "h": 791, "orig": "2253 × 1273", "path": "design/branches/concepts/diptych/img/diptych-closed.jpg", "code": "DIPTYCH-closed"}, "DIPTYCH-top": {"kind": "image", "sub": "drawing", "title": "DIPTYCH true-scale top view: 14.48 px per mm", "short": "top · 1:1 at 14.48 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/DIPTYCH-top.jpg", "thumb": "media/t/DIPTYCH-top.jpg", "w": 1600, "h": 1225, "orig": "4200 × 3215", "path": "design/branches/concepts/diptych/img/diptych-top-14.48px-per-mm.png"}], "group": "DIPTYCH", "src": "media/DIPTYCH-top.jpg", "thumb": "media/t/DIPTYCH-top.jpg", "w": 1600, "h": 1225, "orig": "4200 × 3215", "path": "design/branches/concepts/diptych/img/diptych-top-14.48px-per-mm.png", "code": "DIPTYCH-top"}, "D-106": {"kind": "doc", "sub": "doc", "title": "DIPTYCH · how it looks and feels", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1"}], "path": "design/branches/concepts/diptych/how-it-looks-and-feels.md", "html": "<h1>DIPTYCH: how it looks and feels (visual)<\/h1>\n<p>Seed: FOLD-105 (v1.1). Kind: a field instrument. <strong>Point of view (director): a pocket instrument for reading the day outdoors.<\/strong> It opens, stands on its cords, and its TIME dial tells time two ways. Emotion: wonder. Flat keys (v1.1). Read with <a href=\"#i-D-105\"><code>how-it-works.md<\/code><\/a> (systems rev 1) and <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>.<\/p>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (visual).<\/strong> Images in <code>img/<\/code> (from <code>_mock-src/rb.py<\/code> + <code>figs_rb.py<\/code>).<\/p>\n<h2>Images<\/h2>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-standing.jpg\" width=\"1400\" height=\"1013\" alt=\"DIPTYCH standing on its red cords and brass feet (the director's test a)\" loading=\"lazy\"><\/span><figcaption>DIPTYCH standing on its red cords and brass feet (the director's test a) · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-standing-side-exact.jpg\" width=\"1600\" height=\"1443\" alt=\"Standing, right-end elevation, exact: 120°, the cord as drawn (38.4°; target 37.4°), feet 59 mm behind (test c)\" loading=\"lazy\"><\/span><figcaption>Standing, right-end elevation, exact: 120°, the cord as drawn (38.4°; target 37.4°), feet 59 mm behind (test c) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-time-dial.jpg\" width=\"1072\" height=\"724\" alt=\"TIME's dial, the hero: black ms scale, red divisions, FREE / SYNC in front (14.48 px per mm, 10 mm bar; test b)\" loading=\"lazy\"><\/span><figcaption>TIME's dial, the hero: black ms scale, red divisions, FREE / SYNC in front (14.48 px per mm, 10 mm bar; test b) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-lid-left-graduations.jpg\" width=\"1600\" height=\"1275\" alt=\"Graduations across the lid's left half: red hairlines, black majors, engraved roman caps (test d)\" loading=\"lazy\"><\/span><figcaption>Graduations across the lid's left half: red hairlines, black majors, engraved roman caps (test d) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-open.jpg\" width=\"1400\" height=\"1040\" alt=\"DIPTYCH open flat\" loading=\"lazy\"><\/span><figcaption>DIPTYCH open flat · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-closed.jpg\" width=\"1400\" height=\"791\" alt=\"DIPTYCH closed\" loading=\"lazy\"><\/span><figcaption>DIPTYCH closed · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/DIPTYCH-top.jpg\" width=\"1600\" height=\"1225\" alt=\"DIPTYCH true-scale top view: 14.48 px per mm\" loading=\"lazy\"><\/span><figcaption>DIPTYCH true-scale top view: 14.48 px per mm · drawing<\/figcaption><\/figure>\n<h2>Systems' change (fold-out feet): accepted, with a pushback on what it costs the idea<\/h2>\n<ul>\n<li><strong>Physics wins:<\/strong> cords alone tip at 0.8 N, and a knob turn pushes 1–3 N. The feet (brass bar, tips 59 behind the base, 6.9 N) are drawn.<\/li>\n<li><strong>The cost, plainly:<\/strong> v1.1 stood on 2 stays that did both jobs. DIPTYCH stands on 2 cords + 2 feet + 4 eyes and must be set up in order (feet first). That's the weakest part of the concept. In the standing render the cords at the end faces read as \"strings\", but the feet are just a mechanism.<\/li>\n<li><strong>The alternative to weigh (director's call):<\/strong> keep v1.1's brass stays and drop the cords. DIPTYCH then stands on its faces alone (the dial, the graduations, red and black on white) and loses the latitude story. My view: <strong>the faces carry DIPTYCH; the cords are a charming fact, not its spine.<\/strong><\/li>\n<li><strong>Numbers don't match yet:<\/strong><\/li>\n<li>drawn as systems describe it (lid eye on the hinge-axis line at s 60, base eye at y 53.2, z 9), the cord sits at <strong>38.4°, not 37.4°<\/strong>;<\/li>\n<li>the elevation says so rather than fudging it;<\/li>\n<li>systems to reconcile (≈ 1°: a small move of the base eye, ≈ +2 mm forward [rough]).<\/li>\n<\/ul>\n<h2>Principles<\/h2>\n<ol>\n<li><strong>Two hour systems, one dial.<\/strong>\n   - TIME carries the ms scale in black and the note divisions in red.\n   - The FREE / SYNC toggle in front picks which one you're reading, as a diptych carried common and Italian hours on one face.<\/li>\n<li><strong>Every scale is engraved.<\/strong> Every knob gets a fine graduation:\n   - 31 red hairlines at 10°;\n   - 11 black majors at 30°;\n   - RANGE and WAVE keep only their black position ticks.\n   - <em>Because<\/em> \"be extravagant\" costs nothing in a face-down print, and the fine rings are what makes it an instrument for reading.<\/li>\n<li><strong>Red names the parts; black is what you read.<\/strong>\n   - Section names and the rules in red. Legends and major ticks in black, in an engraved roman (EB Garamond caps).\n   - <em>Because<\/em> that's the diptych's own colour code, and it keeps the two FOLD branches apart (below).<\/li>\n<li><strong>The string is the stay.<\/strong> Two red braided cords from the lid end faces to the base end faces, at the latitude of home. The feet stop the tip (above).<\/li>\n<li><strong>The maker's cartouche.<\/strong> A small notched red cartouche on the axis, blank until he names it.<\/li>\n<\/ol>\n<h2>How it stays apart from CHAMBER (director's cut condition)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>CHAMBER<\/th>\n<th>DIPTYCH<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Where the ornament is<\/td>\n<td data-label=\"CHAMBER\">outside (the lid back)<\/td>\n<td data-label=\"DIPTYCH\">the inside faces<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Type<\/td>\n<td data-label=\"CHAMBER\">his FOLD hand (Kalam), serif only on RANGE<\/td>\n<td data-label=\"DIPTYCH\">engraved roman caps everywhere<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Colour<\/td>\n<td data-label=\"CHAMBER\">dark walnut + brass lines<\/td>\n<td data-label=\"DIPTYCH\">red + black on white<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Keys<\/td>\n<td data-label=\"CHAMBER\">reversed pegs<\/td>\n<td data-label=\"DIPTYCH\">v1.1 flat keys<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Stand<\/td>\n<td data-label=\"CHAMBER\">v1.1 brass stays<\/td>\n<td data-label=\"DIPTYCH\">red cords + brass feet<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Emotion<\/td>\n<td data-label=\"CHAMBER\">joy<\/td>\n<td data-label=\"DIPTYCH\">wonder<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Side by side (<code>chamber-open.jpg<\/code> vs <code>diptych-open.jpg<\/code>), they read as two different instruments: one is a handwritten console in a dark case, the other an engraved field instrument. <strong>My read: they separate.<\/strong><\/p>\n<h2>Look<\/h2>\n<ul>\n<li><strong>Body:<\/strong> v1.1 FOLD walnut-tone; real walnut later.<\/li>\n<li><strong>Pickguards:<\/strong> v1.1 cream with the 45° bevel.<\/li>\n<li><strong>Rules:<\/strong> thin red (0.44 wide), not v1.1's 1.2 warm grey.<\/li>\n<li><strong>Type:<\/strong><\/li>\n<li>legends: EB Garamond Medium caps 2.0;<\/li>\n<li>section names: EB Garamond Italic, red, 1.9–2.1 (PITCH, FILTER, EFFECTS &amp; OUT; OSCILLATORS, MIXER, CONTOURS; ECHO, REVERB);<\/li>\n<li>type names: Garamond caps 1.3.<\/li>\n<li><strong>TIME's dial (the hero), over ±135° (common §2):<\/strong><\/li>\n<li>inner: 11 black ms ticks, with \"20\" and \"2s\" at the ends;<\/li>\n<li>outer: 9 red division marks (tick, dot for dotted, triangle for triplet), with <strong>1/16, 1/8, 1/4, 1/2<\/strong> written at r + 5.<\/li>\n<li>Smallest type 1.1 mm (\"20\", \"2s\"), division numbers 1.25. Legible at 1:1 in the crop; whether 1.1 mm roman figures survive a 0.4 nozzle face-down print is UNVERIFIED (coupon).<\/li>\n<li><strong>FREE / SYNC:<\/strong> black-bat toggle at lid (133, d 70.6), FREE left and SYNC right, Garamond caps.<\/li>\n<li>The graduations on OSC 2 and NOISE / EXT stop 35° either side of the top, so the words never sit on hairlines.<\/li>\n<li><strong>Cords:<\/strong> 2 mm braid in deep red (#a8322a), the dial's red. <strong>Not<\/strong> white or blue (that's rigging).<\/li>\n<li>Flush brass eyes; a brass snap at the base eye.<\/li>\n<li>Stowed: in the end-seam groove (systems).<\/li>\n<li><strong>Feet:<\/strong> 3 × 8 brass bar, pivoting from the base underside near each end; black rubber tips at y 167.<\/li>\n<li><strong>Cartouche:<\/strong> a red notched outline, 16 × 5, on the axis at d 94.6 (v1.1's lozenge no longer fits between the moved TIME and DECAY legends).<\/li>\n<li><strong>Status light:<\/strong> hooded.<\/li>\n<li><strong>Two filament swaps<\/strong> (red, black), not v1.1's one: print time, not money (systems).<\/li>\n<\/ul>\n<h2>Motion and feedback<\/h2>\n<ul>\n<li>Standing: feet out (they swing back and click into a detent; UNVERIFIED part), then the cords clip.<\/li>\n<li>The red cord drawn taut at the latitude is the \"opening the dial\" moment.<\/li>\n<li>The light: as v1.1 (H7 tempo flash), with echo-clock.md's lock / loss flashes.<\/li>\n<\/ul>\n<h2>What it had to prove (director)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Must prove<\/th>\n<th>Where<\/th>\n<th>Status, my honest read<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Must prove\">(a) standing with cords reads \"field instrument\", not \"boat rigging\"<\/td>\n<td data-label=\"Where\"><code>diptych-standing.jpg<\/code><\/td>\n<td data-label=\"Status, my honest read\">Red cords + red engraving + roman caps: it reads as one instrument, not a boat. The brass feet sticking out behind are the least graceful part.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(b) TIME dial, both scales legible at ≥ 1.05<\/td>\n<td data-label=\"Where\"><code>diptych-time-dial-14.48px-per-mm.png<\/code><\/td>\n<td data-label=\"Status, my honest read\">Legible on screen at native resolution. Print legibility at 1.1 mm: coupon.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(c) cord geometry, tension, tip<\/td>\n<td data-label=\"Where\"><code>diptych-standing-side-exact.png<\/code><\/td>\n<td data-label=\"Status, my honest read\">Feet 59 behind, 120°, cord as drawn 38.4° (see above). Tension and tip: systems' numbers.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(d) the whole panel with graduations stays calm at arm's length<\/td>\n<td data-label=\"Where\"><code>diptych-open.jpg<\/code>, <code>diptych-standing.jpg<\/code><\/td>\n<td data-label=\"Status, my honest read\">Calm: the hairlines are fine and red, so at arm's length they read as a tint round each knob, not as lines. Up close they're the point.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Open<\/h2>\n<ul>\n<li>Stays vs cords + feet (director).<\/li>\n<li>Reconcile 38.4° vs 37.4° (systems).<\/li>\n<li>A print coupon of the TIME dial at 1:1.<\/li>\n<\/ul>", "lead": "Seed: FOLD-105 (v1.1). Kind: a field instrument. Point of view (director): a pocket instrument for reading the day outdoors. It opens, stands on its cords, and its TIME dial tells time two ways. Emotion: wonder. Flat keys (v1.1). Read with ", "jump": ["Images", "Systems' change (fold-out feet): accepted, with a pushback on what it costs the idea", "Principles", "How it stays apart from CHAMBER (director's cut condition)", "Look", "Motion and feedback", "What it had to prove (director)", "Open"], "group": "DIPTYCH", "code": "D-106"}, "D-105": {"kind": "doc", "sub": "doc", "title": "DIPTYCH · how it works", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1"}], "path": "design/branches/concepts/diptych/how-it-works.md", "html": "<h1>DIPTYCH: how it works (systems)<\/h1>\n<blockquote>\n<p><strong>Status 2026-11-13: KILLED (director, round 1).<\/strong> The spine failed physically (§1: 0.8 N with cords alone). Donor: the red/black TIME dial with written divisions; any branch may adopt it. Common §2's geometry applies.<\/p>\n<\/blockquote>\n<p>Seed: <strong>FOLD-105<\/strong> (v1.1). Kind: a field instrument. Point of view (director): <strong>a pocket instrument for reading the day outdoors.<\/strong> It opens, stands on its cords, and its TIME dial tells time two ways. Emotion: wonder. Flat keys (v1.1). Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>, <a href=\"#i-D-011\"><code>versions/v1.1/fold/how-it-works.md<\/code><\/a> (rev 5.7) and <code>design/jobs.md<\/code> rev 5.<\/p>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (systems first).<\/strong> Numbers marked [CHECK] come from <code>../branch_check.py<\/code> §5.<\/p>\n<h2>1. Headline finding: the cords can set the angle, but they can't stop it tipping [CHECK]<\/h2>\n<ul>\n<li><strong>The model:<\/strong> v1.1 weights (base 0.40, lid 0.375 kg, ESTIMATE); combined CG y 97; hinge axis y 109, z 25. The push is normal to the panel at a back-row knob tip.<\/li>\n<li><strong>The model checks out against v1.1:<\/strong> with the brass stays (tips at y 167) it gives <strong>6.9 N<\/strong> to tip; v1.1 recorded 6.8.<\/li>\n<li><strong>Cords alone: 0.8 N to tip.<\/strong> A cord between lid and base holds the hinge angle, but it adds no ground contact. The whole instrument still pivots on the base's rear edge (y 108), with its CG only 11 mm in front of it. Turning a knob pushes ≈ 1–3 N, so <strong>it would fall over backwards while you play.<\/strong> A real diptych dial never had a knob turned on it.<\/li>\n<li><strong>≥ 5 N needs ground contact at y ≥ 153: feet ≥ 45 mm behind the base.<\/strong><\/li>\n<\/ul>\n<p><strong>Proposal: cords + base feet.<\/strong>\n- <strong>Two brass feet<\/strong> (the v1.1 stay part: 3 × 8 brass flat bar) pivot out of grooves <strong>in the base underside<\/strong>, near the end faces, with rubber tips at <strong>y 167<\/strong> (59 mm behind the base, as v1.1) → <strong>6.9 N<\/strong>. A 50 mm reach gives 5.7 N.\n- Stowed, they're flush in the underside.\n- <strong>The cords set the 120° angle; the feet stop the tip.<\/strong> That's one more part than v1.1, where the stays did both, so it's a cost to weigh. The honest alternative: keep v1.1's stays and drop the cords, which removes DIPTYCH's first principle. <strong>Director's call.<\/strong>\n- <strong>Bonus:<\/strong> no stay grooves in the lid end faces, so v1.1's open must-fix (the stay groove vs the lid-wall jacks) disappears.<\/p>\n<h2>2. Cord geometry: the latitude (37.4°, Lynchburg) [CHECK]<\/h2>\n<p>The cord runs on each end face, from the lid end face to the base end face (anchor z ≈ 9), at 37.4° to the base.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Lid attachment (along the lid)<\/th>\n<th>Base anchor y<\/th>\n<th>Cord<\/th>\n<th>Tension per cord (lid weight + 5 N push)<\/th>\n<th>At the PLAY row (y 68)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Lid attachment (along the lid)\">s 100 (director's, top corner)<\/td>\n<td data-label=\"Base anchor y\">27.8<\/td>\n<td data-label=\"Cord\">167 mm<\/td>\n<td data-label=\"Tension per cord (lid weight + 5 N push)\">≈ 8 N<\/td>\n<td data-label=\"At the PLAY row (y 68)\"><strong>24 mm above the base top<\/strong>: where the left hand rests by the stick (x 25) and the right by TAP (x 261). Snag risk, high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Lid attachment (along the lid)\"><strong>s 60 (pick)<\/strong><\/td>\n<td data-label=\"Base anchor y\"><strong>53.2<\/strong><\/td>\n<td data-label=\"Cord\"><strong>110 mm<\/strong><\/td>\n<td data-label=\"Tension per cord (lid weight + 5 N push)\"><strong>≈ 13 N<\/strong><\/td>\n<td data-label=\"At the PLAY row (y 68)\"><strong>≈ 5 mm above the base top<\/strong>, at the end face, 25 mm outboard of the stick / TAP axes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Lid attachment (along the lid)\">s 40<\/td>\n<td data-label=\"Base anchor y\">65.8<\/td>\n<td data-label=\"Cord\">82 mm<\/td>\n<td data-label=\"Tension per cord (lid weight + 5 N push)\">≈ 20 N<\/td>\n<td data-label=\"At the PLAY row (y 68)\">through the base top: no<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pick s 60:<\/strong>\n- The latitude angle holds (37.4°).\n- The cord stays low past the hands.\n- The base anchor at y 53 is 14 mm clear of MIDI IN (y 70) on the right end face.\n- The lid end faces carry no I/O.\n- <strong>Hand clearance is still UNVERIFIED.<\/strong> The left hand's heel may rest on the cord. Prove it with a cardboard mock and a real hand, as part of the director's (a).<\/p>\n<p><strong>Hardware (proposal):<\/strong>\n- 2 mm pre-stretched polyester (or Dyneema) braid.\n- Flush countersunk brass eyes on the lid end face (d 60) and on the base end face (y 53).\n- The cord is fixed at the lid; its free end has a small brass snap that clips to the base eye.\n- 13 N per cord is far under any 2 mm braid's break load (ESTIMATE). <strong>Creep would drift the angle<\/strong>: pre-stretched line, UNVERIFIED over months.\n- The eyes go into brass threaded inserts in PETG.<\/p>\n<p><strong>Stowage:<\/strong>\n- Closed, the attachment points sit ≈ 25 mm apart [CALC, rough], so ≈ 85 mm of each cord is slack.\n- Unclip it and lay it in a <strong>2 mm groove along the closed bar's end-face seam<\/strong> (base / lid meeting line, 108 mm long ≥ 85). A flush pin holds the snap.\n- <strong>Maker check, UNVERIFIED.<\/strong><\/p>\n<p><strong>It's a hidden fact, not a sundial<\/strong> (director). No working dial is claimed.<\/p>\n<h2>3. TIME's two scales are the hero (J24, J25)<\/h2>\n<ul>\n<li><strong>FREE / SYNC at lid (133, d 70.6)<\/strong>, a black FOLD toggle, \"free\" / \"sync\" beside it (common §2).<\/li>\n<li><strong>TIME's dial, printed over ±135°:<\/strong><\/li>\n<li>inner ring ms (r + 0.9 … 1.9);<\/li>\n<li>outer ring 9 divisions (r + 2.4 … 3.6);<\/li>\n<li>firmware clamps the last 15° at each end;<\/li>\n<li>TIME's legend sits behind the knob (d ≈ 96.9), 1.35 behind the outer ring [CHECK].<\/li>\n<li>Number labels and fine graduations: the visual designer's. Space outside r + 3.6 is tight (ECHO TYPE's fan names sit ≈ 5–6 mm to the left; not computed per label here). <strong>To prove: the 1:1 crop (director's (b)).<\/strong><\/li>\n<li><strong>\"Graduations everywhere\":<\/strong> fine scales on every knob are allowed by the v1.1 tick radii (r + 0.9 … 1.9). <strong>Two fills (red + black) mean two filament swaps<\/strong>, not one (v1.1 has one). That's a print-time cost, not $0 in time.<\/li>\n<\/ul>\n<h2>4. States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What it is<\/th>\n<th>Systems notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>Closed<\/strong><\/td>\n<td data-label=\"What it is\">the two leaves shut; ≈ 286 × 108 × 50.1 (v1.1)<\/td>\n<td data-label=\"Systems notes\">cords in the end-seam grooves; feet flush in the underside<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Carried<\/strong><\/td>\n<td data-label=\"What it is\">a bar, in a pocket of a bag<\/td>\n<td data-label=\"Systems notes\">nothing proud: the snaps sit on their flush pins<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Flat (180°)<\/strong><\/td>\n<td data-label=\"What it is\">on the table<\/td>\n<td data-label=\"Systems notes\">cords unclipped and stowed; feet stowed; lid back on its feet<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Standing (120°)<\/strong><\/td>\n<td data-label=\"What it is\">open past 120°, clip both cords, swing the feet out, set it down<\/td>\n<td data-label=\"Systems notes\">the cords hold 120°, the feet stop tipping (6.9 N). Order: <strong>feet first, then cords<\/strong> (with the cords on and the feet in, a knob turn tips it)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Outdoors<\/strong><\/td>\n<td data-label=\"What it is\">park, bench<\/td>\n<td data-label=\"Systems notes\">slim pack ≈ 1.9–3.9 h [CALC]; status hood (common §3); the lid speaker faces you; the cords at the end faces sit in your friend's sightline at the bench (they read as the instrument's \"strings\": visual's job)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The order hazard:<\/strong> clip the cords with the feet still stowed, and the instrument stands but tips at 0.8 N. <strong>Mitigation (proposal):<\/strong> the cord snaps clip onto the base eyes only through a slot that the deployed foot uncovers. Feet out, then cords: an interlock with no extra part, UNVERIFIED as a mechanism.<\/p>\n<h2>5. Can't verify here<\/h2>\n<p>Hand vs cord (mock) · cord creep · feet pivot strength in the PETG base (brass insert) · the end-seam stowage groove · real weights (v1.1 ESTIMATEs) · the interlock slot · the TIME dial's legibility at 1:1.<\/p>", "lead": "> Status 2026-11-13: KILLED (director, round 1). The spine failed physically (§1: 0.8 N with cords alone). Donor: the red/black TIME dial with written divisions; any branch may adopt it. Common §2's geometry applies.", "jump": ["1. Headline finding: the cords can set the angle, but they can't stop it tipping [CHECK]", "2. Cord geometry: the latitude (37.4°, Lynchburg) [ ds": "ok thats fine if its not private", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "16:23", "ask": null, "words": "im going to put the github on github pages so i can easily access it from there instead of here. i want all review and logs and documents there, not here", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "16:22", "ask": null, "words": "the workflow im much more interested in is controlling it from another device or mainly a DAW. im not so worried about using it as a controller for other things. but if it's free we could explore it", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "16:18", "ask": null, "words": "heres what im thinking -- we need on that site architectural documentation and clear docs for each featureset. lets start defining this stuff and writing it down 1 by 1 in an easily delineated fashion, so we can make sure the architectural decisions are sound across the device. sorry i didnt mean is usbmidi capable of send, but rather are we already doing send. if we do send then we gotta think about ALL of the features, and this is pretty definitively not a midi controller. though if it's free it could be.", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "16:18", "ask": null, "words": "yes but first walk me through the midi implementation", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:54", "ask": null, "words": "Follow dry", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:53", "ask": null, "words": "No the pan would be audio signal. Basically I’d like to pan just the delay separately from the full dry but also I’d like to be able to have the pan signals sync", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:50", "ask": null, "words": "I think I’d like to pan the delay into the reverb separately from the dry signal but also would want to be able to sync that", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:50", "ask": null, "words": "Run this all through a dedicated audio engineer / synth expert for gotchas and unexpected functionality that doesn’t make sense", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:44", "ask": null, "words": "Yea sure on midi. And is it sending the delay through the pan too or just the dry", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:24", "ask": null, "words": "Left channel should be mono tho if stereo isn’t plugged in", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:23", "ask": null, "words": "Stereo line out", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:22", "ask": null, "words": "Stereo phones is fine but I need to pan the signal into the effects", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:18", "ask": null, "words": "Also occurs to me that the verb and delay are stereo…should we have two? Also is there stereo output?", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:12", "ask": null, "words": "I like the idea of the lines going up and down vs sideways. Or we could go back to a circle and maybe not centered?", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "15:07", "ask": null, "words": "I don’t like the speaker on the key side but I also don’t like the eye shape", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:41", "ask": null, "words": "Premade wooden caps on a shaft that also is premade or part of the key is fine too just thinking", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:40", "ask": null, "words": "I don’t want a spine can we route cables through a hinge. Engraving texture I meant fine line texture — I’ll probably do a design for the pipe lines. And what about brass and black keys? Or all brass? Could 3d print and reminds me of a cathedral", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:34", "ask": null, "words": "They can be printed externally too - I know you can get metal prints", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:33", "ask": null, "words": "I don’t know how to machine — the keys need to be printed or purchasable", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:12", "ask": null, "words": "i'm not sure i like the oxblood spine, it feels unnecessary. also the hunges on this... is there any way we could do a more hidden hinge or hidden hinges in the gap? if not these are fine. i also want to work on the speaker placement and design metaphors a bit.. the speaker palcement creates an odd gap between some of the elements, and the effects & out is real far from echo and reveb controls... those should be together. i also wonder if the protective feet couldn't be one with the screws that screw the case in so they aren't visible. i'd like the engraving texture in the case to be more ", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "14:12", "ask": null, "words": "i want to lock in on cathedral and fold right now. what are the differences between them so i can find the best middle ground", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "13:13", "ask": null, "words": "dont render a bunch of images unnecessarily", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "12:41", "ask": null, "words": "i really only want images for things that need to be images -- text should be html and stuff", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "12:39", "ask": null, "words": "dont do phone first -- do images that will be great on the site that i can view responsively", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "12:33", "ask": null, "words": "why make anything on a3 at all? im not in europe and im not printing", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "11:58", "ask": "echo sync — A (automatic, hidden hold-TAP + turn-TIME override, $0) or B (FREE / llators?", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "i think it needs its own switch but yes now i want it", "caused": [{"ba": "after", "code": "D-019", "note": "rev 14"}, {"ba": "after", "code": "D-034", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": "add a 3.5 mm TRS MIDI OUT jack (free in pins)?", "words": "Add MIDI out", "caused": [{"ba": "after", "code": "D-019", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "Also the key thing you need to port - go back to first principles and see if there's a better way with Daisy seed. Do this with all the things Daisy seed affects", "caused": [{"ba": "after", "code": "D-032", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": "switch the digital brain to the Daisy Seed?", "words": "Switch to Daisy Seed", "caused": [{"ba": "before", "code": "D-031", "note": ""}, {"ba": "after", "code": "D-032", "note": ""}, {"ba": "after", "code": "D-019", "note": "rev 13"}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "It is not a requirement that you can change the angle", "caused": [{"ba": "after", "code": "FOLD-E", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "On fold, we should build some sort of method for the top case to stand up, either at a full 90° or some useful angle. It should fit the design language of the device and should blend into the case", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "I like the idea of drift, but I'd want it to be controllable", "caused": [{"ba": "after", "code": "D-019", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "Check the pin thing. Audio feels the most important since we're introducing digital stuff", "caused": [{"ba": "after", "code": "D-031", "note": ""}]}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": "FX controls — full 8 (echo TYPE, reverb TYPE, TIME, REPEATS, ECHO MIX, DECAY, REVERB MIX, TAP) vs compact 5?", "words": "Full 8, grow the panel", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "I would want great models tho — would be cool if digital could do more than one type.", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "Delay and verb can be digital", "caused": []}, {"date": "13 Nov", "iso": "2026-11-13", "time": "09:02", "ask": null, "words": "I want echo and reverb", "caused": [{"ba": "after", "code": "D-019", "note": ""}]}, {"date": "12 Nov", "iso": "2026-11-12", "time": "22:30", "ask": "echo — PT2399 (cheap, ~0.5 s, no sync) vs digital delay on a 2nd Pico (sync, 4+ s)?", "words": "Is there a single chip that could handle all of it? We could go back to first principles a bit have an agent research", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": "22:30", "ask": "keys at the front edge with no lip, standing ~2–3 mm proud of the panel?", "words": "Show me both", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": "22:30", "ask": null, "words": "On fold — there's still something off about the controls layout that doesn't feel balanced yet. On one sheet I love the rings texture — can we figure out how to reduce and only use no texture and that texture? Also I'm thinking — Is there a way for us to build in some effects, mainly a delay and echo? Also both of them have a lip after the keys — I want to make sure the keys are somewhat raised so you can feel them at minimum, and I'm not fully understanding the press mechanism, I may want them at the edge altogether depending on if they're like real keys. Can you draw the mechanism for me in a diagram. I'd also like front views of all of these so I can see the details.", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": n ke little penis. I could see big D energy or just big energy or something like that, but the name needs work.", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": null, "words": "Typecase hush and hymnal are really cool. I like those. I have some feedback though. The filter sections should not be raised. That would make the knobs Hard to access. And I want to see a version of one sheet that is made from a 3-D printed enclosure. I feel like hush could similarly be made from a 3-D printed enclosure, and then the wool felt applied. That's super interesting. I also in the old diagrams, I really liked the idea of a two-part folding unit. I liked the one that was walnut with the white panel. I'd like to see something like that in this round that is foldable with the controls on the top part and with a white panel that gets screwed into a darker surrounding area. I don't think I wanna make it out of walnut, but that's a possibility. I have some at my house that I could plane. I'd like to see that first explored as 3-D printable.", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "which key route (bought switches + snap-on tops / full-size Fatar / silicone pads / reconsider harvesting)?", "words": "Whatever the design needs", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "build the first two real keys (C, C#) as the one feel check?", "words": "I don't want to build custom keys", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "flat piano tops vs maple pegs?", "words": "Show me both", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "bare vs standard printed board?", "words": "Standard (printed)", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "is ~36 mm body thickness OK?", "words": "I have no idea you tell me. How tall is op1", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "avoid the Moog look entirely?", "words": "Nods are fine but I want to see breadth of explorstion", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "bend up+down or up only?", "words": "Up and down", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "what should velocity change?", "words": "Both, with a switch", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": "self-protecting body (~+$10–20) vs separate sleeve?", "words": "Show me both", "caused": []}, {"date": "12 Nov", "iso": "2026-11-12", "time": null, "ask": null, "words": "Pause the designers on the full instrument and let's focus on the budget one for now. I want designs for the budget one and I want the enclosure to be coherent in form with some clear perspective. Design principles with a solid basis of logic in the idea of the thing. Get creative here.", "caused": []}], "rounds": [{"name": "Round 1", "date": "12 Nov", "scores": [["TY", 8], ["HY", 8], ["HU", 7], ["ON", 6]]}, {"name": "Round 2", "date": "12 Nov", "scores": [["TY", 9], ["HY", 9], ["HU", 8], ["FO", 7], ["ON", 7], ["UN", 6]]}, {"name": "Round 3", "date": "12 Nov", "scores": [["HU", 9], ["FO", 9], ["ON", 8]]}, {"name": "Round 4", "date": "12 Nov", "scores": [["HU", 9], ["FO", 7], ["ON", 8]]}, {"name": "Round 5", "date": "13 Nov", "scores": [["HU", 9], ["ON", 9], ["FO", 9]]}, {"name": "Branches round 1", "date": "13 Nov", "scores": [["CHAMBER", 8], ["RAIN", 7], ["BUTTERFLY", 6], ["DIPTYCH", 0]], "notes": {"BUTTERFLY": "retired", "DIPTYCH": "killed"}}], "versions": [{"code": "v1-1", "name": "v1.1", "date": "13 Nov", "current": true, "line": "v1, plus: FOLD stands at 120° (it was 105°) so the face catches more light; bend drawn as a joystick in every view (round opening, stem, cap, plus a callout on each B sheet); FOLD sheet D shows MIDI IN. The director held all three at 9.", "groups": [["FOLD", "C"], ["HUSH", "B"], ["ONESHEET", "B"]], "docs": ["D-003", "D-011", "D-013", "D-0 "12 Nov", "t": null, "k": "scored", "line": "Round 2 scored: six concepts", "round": "Round 2"}, {"d": "12 Nov", "t": null, "k": "scored", "line": "Round 1 scored", "round": "Round 1"}], "clouds": {"FOLD-A": {"CB": [[0.8127, 0.1779, 0.0484, 0.0684], [0.6676, 0.2189, 0.0484, 0.0821], [0.1161, 0.3284, 0.0484, 0.0821], [0.1935, 0.4105, 0.0677, 0.1095], [0.6289, 0.8347, 0.1838, 0.0958], [0.6096, 0.9441, 0.3483, 0.0547]]}, "HUSH-A": {"BA": [[0.6676, 0.1505, 0.0677, 0.0958], [0.6676, 0.2737, 0.0677, 0.0958], [0.1258, 0.3558, 0.0871, 0.1231], [0.6096, 0.9441, 0.3483, 0.0547]]}}, "docs": [{"slug": "architecture", "path": "docs/architecture.md", "title": "Architecture", "covers": "system overview, signal paths, control/data flow, power, budgets, decisions log, open items", "written": "started 2026-11-13", "stub": false, "counts": {"decided": 0, "proposed": 0, "open": 4}, "html": "<h1>Architecture<\/h1>\n<p>An analog synth voice with one small computer beside it. The <strong>sound is analog<\/strong> from the oscillators to the outputs. A <strong>Daisy Seed<\/strong> reads the keys and knobs, tunes the oscillators, speaks MIDI, and adds <strong>digital echo and reverb<\/strong> that are mixed back in.<\/p>\n<p><em>Updated 2026-11-13 · systems designer · \"Decided\" means recorded in the <a href=\"#i-R-001\">owner record<\/a>; everything else is proposed.<\/em><\/p>\n<hr />\n<h2>The device at a glance<\/h2>\n<pre><code>        ┌──────────── CONTROL ────────────┐\n keys ──┤                                 │\n knobs ─┤  muxes ─► DAISY SEED ─► DACs ───┼──► pitch, cutoff, velocity, mod CVs\n MIDI ──┤            │    ▲               │\n        └────────────┼────┼───────────────┘\n                     │    │ (tuning: counts each oscillator)\n        ┌──────────── SOUND ──────────────────────────────────────────────┐\n        │  3 oscillators ─► mixer ─► filter ─► VCA ─┬─► dry ──────────┐   │\n        │                                           │                 ▼   │\n        │                         Daisy: echo → reverb ◄─ send   OUTPUTS  │\n        │                                           └──► wet ───► (mix)   │\n        └─────────────────────────────────────────────────────────────────┘\n                                         OUTPUTS: stereo phones · stereo line out · one speaker\n<\/code><\/pre>\n<p><strong>Two rules shape everything:<\/strong>\n- the dry sound never passes through the computer;\n- the computer never flips a switch.<\/p>\n<hr />\n<h2>The blocks<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Block<\/th>\n<th>What it is<\/th>\n<th>Feature doc<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Block\">Voice<\/td>\n<td data-label=\"What it is\">3 VCOs, mixer, 4-pole ladder filter, analog contours, VCA<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-voice\">voice<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Keys<\/td>\n<td data-label=\"What it is\">25 silent Choc V2 keys, Hall-sensed velocity, printed or bought key heads<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-keys-and-velocity\">keys and velocity<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Aftertouch<\/td>\n<td data-label=\"What it is\">pressure strip under the keys, MOD / OFF / FILT<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-aftertouch\">aftertouch<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Bend and mod<\/td>\n<td data-label=\"What it is\">sprung one-axis stick, MOD knob<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-bend-and-mod\">bend and mod<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Paraphonic<\/td>\n<td data-label=\"What it is\">MONO / PARA / PARA+4<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-paraphonic\">paraphonic<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Tuning<\/td>\n<td data-label=\"What it is\">autotune, held-note correction, DRIFT<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-autotune-and-drift\">autotune and drift<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Effects<\/td>\n<td data-label=\"What it is\">echo (4 types) → reverb (4 types), wet-only return<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-effects\">effects<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Echo sync<\/td>\n<td data-label=\"What it is\">FREE / SYNC, TAP, MIDI clock<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-echo-sync\">echo sync<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Outputs and panning<\/td>\n<td data-label=\"What it is\">stereo phones and line, one speaker, dry pan, delay pan, FOLLOW<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-panning-and-stereo-outputs\">panning and stereo outputs<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">MIDI<\/td>\n<td data-label=\"What it is\">played and automated from a DAW<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-midi\">MIDI<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Power<\/td>\n<td data-label=\"What it is\">internal battery, one USB-C<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-power-and-battery\">power and battery<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Firmware and gestures<\/td>\n<td data-label=\"What it is\">updates, boot and settings gestures<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-firmware-update-and-gestures\">firmware update and gestures<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Connections<\/td>\n<td data-label=\"What it is\">jacks, USB-C, CV / gate<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-io\">I/O<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Body<\/td>\n<td data-label=\"What it is\">CATHEDRAL / FOLD enclosure<\/td>\n<td data-label=\"Feature doc\"><a href=\"#doc-enclosure\">enclosure<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2>How sound flows<\/h2>\n<ol>\n<li><strong>Oscillators → mixer → filter → VCA:<\/strong> all analog.<\/li>\n<li>After the VCA the signal splits:\n   - <strong>dry<\/strong> goes straight to the outputs;\n   - a <strong>send<\/strong> goes to the Daisy's input.<\/li>\n<li>The Daisy runs <strong>echo, then reverb<\/strong>, and returns <strong>only the effect<\/strong> (stereo).<\/li>\n<li><strong>Outputs<\/strong> mix dry + effect: stereo phones, stereo line out, and a mono mix for the speaker.<\/li>\n<\/ol>\n<p>Details: <a href=\"#doc-effects\">effects<\/a> · <a href=\"#doc-panning-and-stereo-outputs\">panning and stereo outputs<\/a><\/p>\n<h2>How control flows<\/h2>\n<ol>\n<li><strong>Keys, knobs and switches<\/strong> → multiplexers → the Daisy's converters, about 10,000 times a second.<\/li>\n<li><strong>MIDI<\/strong> (USB or TRS) → the Daisy. A DAW can move any knob marked with a MIDI dot; that knob's light shows it's held until you touch it.<\/li>\n<li><strong>The Daisy<\/strong> → DACs → pitch for each oscillator, cutoff, velocity and mod depth. It also counts each oscillator's frequency to keep it in tune.<\/li>\n<\/ol>\n<p>Details: <a href=\"#doc-midi\">MIDI<\/a> · <a href=\"#doc-autotune-and-drift\">autotune and drift<\/a><\/p>\n<hr />\n<h2>Budgets<\/h2>\n<p>One table for every shared resource.\n- <strong>Today:<\/strong> the locked spec plus aftertouch.\n- <strong>Decided:<\/strong> adds what the owner has approved since.\n- <strong>Proposed:<\/strong> adds the team's and the review's fixes.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Resource<\/th>\n<th>Capacity<\/th>\n<th>Today<\/th>\n<th>+ decided<\/th>\n<th>+ proposed<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Resource\"><strong>Mux inputs<\/strong> (keys, knobs, switches)<\/td>\n<td data-label=\"Capacity\">48 (3 muxes)<\/td>\n<td data-label=\"Today\">48<\/td>\n<td data-label=\"+ decided\"><strong>53<\/strong><\/td>\n<td data-label=\"+ proposed\"><strong>57–59<\/strong><\/td>\n<td data-label=\"Action\"><strong>Add a 4th mux → 64<\/strong> (<span class=\"st st-open\">open<\/span> item 1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Resource\"><strong>Daisy pins<\/strong><\/td>\n<td data-label=\"Capacity\">31<\/td>\n<td data-label=\"Today\">27<\/td>\n<td data-label=\"+ decided\">28 (MIDI out)<\/td>\n<td data-label=\"+ proposed\">30–31<\/td>\n<td data-label=\"Action\">tight: digipot CS, 5th DAC CS, 4053 (0 with two jacks)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Resource\"><strong>Pitch / CV DACs<\/strong><\/td>\n<td data-label=\"Capacity\">8 + 2<\/td>\n<td data-label=\"Today\">10 of 10<\/td>\n<td data-label=\"+ decided\">10<\/td>\n<td data-label=\"+ proposed\">10 + 2 (a 5th MCP4822 takes velocity and mod) + digipot<\/td>\n<td data-label=\"Action\">frees the Seed's 2 DACs: OUT1 → PARA+4 oscillator, OUT2 → <strong>PITCH CV OUT<\/strong> (<span class=\"st st-open\">open<\/span> items 3, 7)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Resource\"><strong>Codec<\/strong> (stereo in / out)<\/td>\n<td data-label=\"Capacity\">2 in, 2 out<\/td>\n<td data-label=\"Today\">all used<\/td>\n<td data-label=\"+ decided\">all used<\/td>\n<td data-label=\"+ proposed\">—<\/td>\n<td data-label=\"Action\"><strong>PARA+4 has no audio path<\/strong> (<span class=\"st st-open\">open<\/span> item 3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Resource\"><strong>Power<\/strong><\/td>\n<td data-label=\"Capacity\">22 Wh (11 Wh in FOLD-105)<\/td>\n<td data-label=\"Today\">≈ 2.0–3.6 W, ≈ 4–8 h on 22 Wh, ≈ 2–4 h on 11 Wh<\/td>\n<td data-label=\"+ decided\">+ stereo stage (few mA)<\/td>\n<td data-label=\"+ proposed\">+ speaker when loud (≈ 0.5–0.8 W, unverified)<\/td>\n<td data-label=\"Action\">count the speaker (<span class=\"st st-open\">open<\/span> item 8)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<details><summary>The 4th mux (open item 1), with the recounted allocation<\/summary>\n\n- **Part:** a 4th **CD74HC4067** sharing S0–S3 (PC9–PC12), its output on **D20 (PC1, ADC3)**. The battery divider moves from D20 onto mux D. ≈ $0.60.\n- **Conversion:** ADC3 converts **mux C then mux D** in each mux step (scan mode, 2 ranks). The keys' ADC1 + ADC2 are untouched. Eng: confirm both conversions fit the ≈ 3 µs step (UNVERIFIED; at 1 Msps each takes ≈ 1 µs).\n- **Allocation (64):**\n  - **mux A** = keys 1–16;\n  - **mux B** = keys 17–25, 4 controls, Hall-rail monitor, AT toggle, AT FSR;\n  - **mux C** = 16 controls;\n  - **mux D** = PARA, FREE / SYNC, DRY PAN, DELAY PAN, FOLLOW, OSC 3 CTL, PHONES sense, TS sense (or spare with two jacks), battery, charger STAT, VBUS, WAVE 1 (for PARA+4's matched waveform), **4 spare**.\n- **D16** stays the last direct analog spare.\n<\/details>\n\n<details><summary>What fills the mux (53 → 59)<\/summary>\n\n- **Decided additions:** PARA toggle, FREE / SYNC, DRY PAN, DELAY PAN, FOLLOW (+5).\n- **Proposed:** OSC 3 CTL read, phones-in sense, TS sense on line out, the battery divider moved onto the mux (+4), and optionally charger STAT / VBUS (+2).\n<\/details>\n\n<hr />\n<h2>Where decisions live<\/h2>\n<ul>\n<li><strong>The owner's decisions, word for word:<\/strong> <a href=\"#i-R-001\">owner record<\/a>. Nothing is \"decided\" unless it's there.<\/li>\n<li><strong>Each feature's decisions, proposals and open questions:<\/strong> its feature doc (above), always under the same headings.<\/li>\n<li><strong>Engineering sources:<\/strong><\/li>\n<li><a href=\"#i-D-019\">master spec<\/a>;<\/li>\n<li><a href=\"#i-D-032\">Daisy design<\/a>;<\/li>\n<li><a href=\"#i-D-034\">aftertouch<\/a>;<\/li>\n<li><a href=\"#i-D-040\">echo sync<\/a>;<\/li>\n<li><a href=\"#i-D-110\">CATHEDRAL<\/a>;<\/li>\n<li><a href=\"#review-2026-11-13-audio-synth-review\">expert review<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>Open items<\/h2>\n<ol>\n<li><strong>The mux is full.<\/strong> Add a 4th mux on pin D20 and move the battery reading onto it (allocation above). <em>Eng: confirm the timing.<\/em><\/li>\n<li><strong>Mono on a TS cable can't work as drawn.<\/strong> Owner's choice: two jacks (L / MONO + R) or a reworked single jack. See <a href=\"#doc-panning-and-stereo-outputs\">panning and stereo outputs<\/a>.<\/li>\n<li><strong>PARA+4 has no audio path.<\/strong> Proposed: a 5th DAC chip takes velocity and mod, freeing the Daisy's own DACs to play the 4th oscillator into the filter. No behaviour change. See <a href=\"#doc-paraphonic\">paraphonic<\/a>.<\/li>\n<li><strong>Peg keys rub the floating key strip.<\/strong> Widen the holes to ≥ 1 mm clearance (see <a href=\"#doc-keys-and-velocity\">keys and velocity<\/a>).<\/li>\n<li><strong>TAP gestures collide<\/strong> (one could open the bootloader). Split proposed in <a href=\"#doc-firmware-update-and-gestures\">firmware update and gestures<\/a>.<\/li>\n<li><strong>Stale pin table and a ghost part<\/strong> in older eng files. Mark them superseded.<\/li>\n<li><strong>Missing pieces:<\/strong> PITCH CV OUT: proposed on the freed Seed DAC OUT2 (12-bit, ≈ 1.5 cents/step over 5 V, buffered to 1 V/oct). OSC 3 CTL must be read (mux D). Keyboard tracking can't reach \"full\".<\/li>\n<li><strong>Power:<\/strong> the speaker isn't in the power budget; loudness outdoors is untested.<\/li>\n<li><strong>Pops<\/strong> in phones and line at power-on. Add an output mute.<\/li>\n<li><strong>MIDI questions for the owner<\/strong> (CC 10, effect-amount CCs, channel, extras): see <a href=\"#doc-midi\">MIDI<\/a>.<\/li>\n<\/ol>", "jump": ["The device at a glance", "The blocks", "How sound flows", "How control flows", "Budgets", "Where decisions live", "Open items"], "lead": "An analog synth voice with one small computer beside it. The sound is analog from the oscillators to the outputs. A Daisy Seed reads the keys and knobs, tunes the oscillators, speaks MIDI, and adds digital echo and reverb that are mixed bac"}, {"slug": "aftertouch", "path": "docs/features/aftertouch.md", "title": "Aftertouch", "covers": "FSR strip, floating strip C, MOD / OFF / FILT", "written": "not yet written", "stub": true, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>Aftertouch<\/h1>\n<p>Status: <strong>not yet written<\/strong> · sources: ../../eng/aftertouch.md<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To b ns", "written": "not yet written (source: ../design/branches/echo-clock.md)", "stub": true, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>Echo sync<\/h1>\n<p>Status: <strong>not yet written<\/strong> · sources: ../../design/branches/echo-clock.md<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Controls and states<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked to owner.md)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions", "Status (decided / proposed / open, item by item)"], "lead": ""}, {"slug": "effects", "path": "docs/features/effects.md", "title": "Effects", "covers": "echo (4 types), reverb (4 types), wet-only return, send gating", "written": "not yet written", "stub": false, "counts": {"decided": 12, "proposed": 2, "open": 1}, "html": "<h1>Effects<\/h1>\n<p>Status: <strong>written 2026-11-13<\/strong> (systems). Per item below. Sources:\n- <a href=\"#i-R-001\">owner record<\/a> 2026-11-12 22:30 → 11-13;\n- <a href=\"#i-D-032\">Daisy design §6<\/a>;\n- <span class=\"ref\">single-chip research §1–5<\/span>;\n- <a href=\"#i-D-031\">Daisy pin &amp; audio check<\/a>;\n- <a href=\"#i-D-019\">master spec<\/a>;\n- <a href=\"#review-2026-11-13-audio-synth-review\">expert review<\/a> items 8, 19, 21, P3, P6.<\/p>\n<h2>What it does (player's view)<\/h2>\n<ul>\n<li>An <strong>echo<\/strong> feeds a <strong>reverb<\/strong>, both digital, both with four characters.<\/li>\n<li>Turn <strong>ECHO MIX<\/strong> or <strong>REVERB MIX<\/strong> up from zero and the effect fades in under the dry sound. At zero the synth is purely analog.<\/li>\n<li>Echo: <strong>TIME<\/strong> (how far apart the repeats are), <strong>REPEATS<\/strong> (how many, up to a controlled runaway on TAPE) and <strong>TAP<\/strong>.<\/li>\n<li>Reverb: <strong>DECAY<\/strong> (how long it rings).<\/li>\n<li>Tails ring on after you lift a key.<\/li>\n<\/ul>\n<h2>Owner decisions (verbatim, linked)<\/h2>\n<ul>\n<li>\"Is there a way for us to build in some effects, mainly a delay and echo?\" (2026-11-12 22:30).<\/li>\n<li>\"I want echo and reverb\" · \"Delay and verb can be digital\" · \"I would want great models tho — would be cool if digital could do more than one type.\"<\/li>\n<li>FX controls: \"Full 8, grow the panel\".<\/li>\n<li>\"Check the pin thing. Audio feels the most important since we're introducing digital stuff\" → \"Switch to Daisy Seed\".<\/li>\n<li>15:18–15:54: stereo outputs, dry pan, delay pan, FOLLOW (see <a href=\"#doc-panning-and-stereo-outputs\">panning and stereo outputs<\/a>).<\/li>\n<\/ul>\n<h2>How it works<\/h2>\n<ul>\n<li><strong>Chip:<\/strong> Daisy Seed (STM32H750 at 400 MHz, 64 MB SDRAM, stereo codec). The same chip runs control, tuning and MIDI.<\/li>\n<li><strong>Signal path:<\/strong>\n  1. The post-VCA voice goes to a TL072 (gain to −6 dBFS peak, diode soft clip, RC anti-alias) → <strong>codec IN L<\/strong>.\n  2. In the DSP: <strong>ECHO → REVERB<\/strong> (series).\n  3. <strong>Wet only<\/strong> returns: codec OUT L / R → summing resistors → the output sums.<\/li>\n<li>The dry path is analog and never switched, so there's <strong>no comb filtering<\/strong> from converter latency (DFP §6.2).<\/li>\n<li><strong>ECHO MIX and REVERB MIX are wet levels in DSP.<\/strong> With both at 0 the codec outputs digital silence, and the instrument is electrically the analog voice alone.<\/li>\n<li><strong>Echo types:<\/strong><\/li>\n<li><strong>TAPE:<\/strong> wow / flutter, saturation, darkening repeats; runaway controlled;<\/li>\n<li><strong>BBD:<\/strong> dark, short-range character, no clock noise;<\/li>\n<li><strong>CLEAN;<\/strong><\/li>\n<li><strong>PING-PONG:<\/strong> alternates sides on stereo outputs; on the mono speaker it's CLEAN with alternating tone.<\/li>\n<li><strong>Reverb types:<\/strong><\/li>\n<li><strong>PLATE<\/strong> (Dattorro);<\/li>\n<li><strong>HALL<\/strong> (FDN / CloudSeed class);<\/li>\n<li><strong>SPRING;<\/strong><\/li>\n<li><strong>SHIMMER.<\/strong><\/li>\n<li>DECAY scales size and damping together, per type.<\/li>\n<li><strong>Stereo:<\/strong><\/li>\n<li>The echo is a mono line; <strong>DELAY PAN<\/strong> places it.<\/li>\n<li><strong>The reverbs take stereo input<\/strong> (proposed; review P6): PLATE / SPRING / SHIMMER need two input diffusers (≈ +10–15 % of one reverb's load, ESTIMATE). HALL is stereo-in already.<\/li>\n<li><strong>DSP load:<\/strong> echo + a CloudSeed-class reverb ≈ <strong>40–60 %<\/strong> at 400 MHz (eng, <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §3.4). Long buffers in SDRAM, dense taps in SRAM. The spike measures it.<\/li>\n<li><strong>Send gating (proposed; review 8):<\/strong> the input opens on <strong>gate or signal level<\/strong> (&gt; −60 dBFS at codec IN L), holds ≈ 300 ms after the signal drops, then fades over ≈ 20 ms.<\/li>\n<li>This replaces DFP's gate-only mute, which would cut echoes of a note's analog release.<\/li>\n<li>It keeps codec noise out between notes.<\/li>\n<li><strong>Protection (proposed; review 19):<\/strong><\/li>\n<li>a <strong>soft limiter<\/strong> on the wet bus before the codec (runaway TAPE into SHIMMER builds fast);<\/li>\n<li>a <strong>≈ 60–80 Hz high-pass on the send<\/strong> (VCA thump residue and low-end mud).<\/li>\n<li><strong>Low battery (proposed; review 21):<\/strong> the effects <strong>fade over ≈ 2 s<\/strong> at the cut-off, not instantly.<\/li>\n<\/ul>\n<h2>Controls and states<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th>Part<\/th>\n<th>What it does<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Control\">ECHO TYPE<\/td>\n<td data-label=\"Part\">4-way rotary (RS16211) on a resistor ladder<\/td>\n<td data-label=\"What it does\">TAPE / BBD / CLEAN / PING-PONG; click-free crossfade on change<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> (Full 8)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">ECHO TIME<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">ms in FREE, a note division in SYNC (see <a href=\"#doc-echo-sync\">echo sync<\/a>)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">ECHO REPEATS<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">feedback; controlled runaway on TAPE<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">ECHO MIX<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">echo wet level<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">REVERB TYPE<\/td>\n<td data-label=\"Part\">4-way rotary<\/td>\n<td data-label=\"What it does\">PLATE / HALL / SPRING / SHIMMER<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">REVERB DECAY<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">size and damping together<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">REVERB MIX<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">reverb wet level<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">TAP<\/td>\n<td data-label=\"Part\">momentary<\/td>\n<td data-label=\"What it does\">tap tempo / echo length (see <a href=\"#doc-echo-sync\">echo sync<\/a>)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">FREE / SYNC<\/td>\n<td data-label=\"Part\">toggle<\/td>\n<td data-label=\"What it does\">see <a href=\"#doc-echo-sync\">echo sync<\/a><\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">DELAY PAN<\/td>\n<td data-label=\"Part\">9 mm pot<\/td>\n<td data-label=\"What it does\">see <a href=\"#doc-panning-and-stereo-outputs\">panning<\/a><\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> feature<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Placement:<\/strong> CATHEDRAL layout B puts every effect control on the lid's back row (proposed, pending the owner's layout answer).<\/p>\n<h2>Edge cases<\/h2>\n<ul>\n<li><strong>Both MIXes at 0:<\/strong> digital silence out; the dry is untouched.<\/li>\n<li><strong>Changing TYPE mid-note:<\/strong> a click-free crossfade (DSP mixing allows it, DFP §6.2).<\/li>\n<li><strong>Runaway:<\/strong> TAPE REPEATS near full self-oscillates in a controlled way. The limiter (proposed) catches level build-up into a long HALL or SHIMMER.<\/li>\n<li><strong>Release tails:<\/strong> with level-based gating, echoes of an analog release survive.<\/li>\n<li><strong>Low battery:<\/strong> FX fade over 2 s (proposed); the dry keeps playing until the boost cut-off.<\/li>\n<li><strong>SOURCE \"feedback\" in the mixer:<\/strong> must be tapped from the <strong>dry VCA out, pre-FX and pre-VOLUME<\/strong> (review 21), so wet latency never enters the ladder loop. Proposed; eng to confirm the tap point.<\/li>\n<li><strong>PING-PONG + DELAY PAN:<\/strong> DELAY PAN sets the start side; no double alternation (review P3).<\/li>\n<li><strong>Mono outputs:<\/strong> the speaker gets the mono sum; PING-PONG becomes CLEAN with alternating tone.<\/li>\n<\/ul>\n<h2>Interactions with other features<\/h2>\n<ul>\n<li><strong>Echo sync:<\/strong> TIME's two scales, FREE / SYNC, TAP, MIDI clock.<\/li>\n<li><strong>Panning and stereo outputs:<\/strong> DELAY PAN, FOLLOW, the stereo-input reverbs, the mono speaker and mono-on-TS.<\/li>\n<li><strong>Autotune:<\/strong> codec IN R is the filter-calibration input; codec IN L doubles as the VCA auto-null monitor (DFP §2).<\/li>\n<li><strong>Paraphonic:<\/strong> if PARA+4 used the codec (option B in <a href=\"#doc-paraphonic\">paraphonic<\/a>), the wet would go mono. The recommended option A keeps it stereo.<\/li>\n<li><strong>Power:<\/strong> the Daisy adds ≈ 0.3–1.0 W over the Pico era (ESTIMATE). Hall gating offsets it.<\/li>\n<li><strong>MIDI:<\/strong> clock in (echo sync). FX knobs aren't MIDI-controllable today.<\/li>\n<\/ul>\n<h2>MIDI<\/h2>\n<ul>\n<li><strong>Today:<\/strong> no FX knob receives or sends MIDI (knob-only). Clock drives the echo tempo in SYNC.<\/li>\n<li><strong>Proposed (open for the owner):<\/strong> ECHO MIX → CC 103, REVERB MIX → CC 104, so a DAW can automate the effect amounts (review P8). DELAY PAN → CC 102 (proposed); DRY PAN → CC 10 (decided).<\/li>\n<\/ul>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<ul>\n<li><strong>Mux:<\/strong> 8 channels (5 pots, 2 rotaries, TAP), in the 48 baseline. FREE / SYNC and DELAY PAN on mux D (architecture).<\/li>\n<li><strong>Pins:<\/strong> codec audio pins only (dedicated).<\/li>\n<li><strong>DAC:<\/strong> codec OUT L / R (both used by the wet).<\/li>\n<li><strong>DSP:<\/strong> 40–60 % + ≈ 10–15 % of a reverb for stereo inputs (ESTIMATE).<\/li>\n<li><strong>Cost:<\/strong> FX controls +$8.21 (<a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a>); TL072s and passives small; the Daisy itself is in the main BOM.<\/li>\n<li><strong>Power:<\/strong> see Interactions.<\/li>\n<\/ul>\n<h2>Open questions (for the owner)<\/h2>\n<ol>\n<li><strong>Should a DAW be able to automate ECHO MIX and REVERB MIX<\/strong> (they'd gain a MIDI dot and the not-in-control light)?<\/li>\n<\/ol>\n<h2>Status (item by item)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Echo + reverb, digital, several great types<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Full 8 controls; Daisy Seed<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Types TAPE / BBD / CLEAN / PING-PONG and PLATE / HALL / SPRING / SHIMMER; series echo → reverb; wet-only return<\/td>\n<td data-label=\"Status\">eng design (adopted with the decisions above)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Stereo-input reverbs<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Level-based send gating; wet limiter; send high-pass; 2 s low-battery fade; SOURCE feedback tap pre-FX<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">ECHO MIX / REVERB MIX MIDI<\/td>\n<td data-label=\"Status\"><span class=\"st st-open\">open<\/span> (Q1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">DSP load, codec noise, the RS16211's height<\/td>\n<td data-label=\"Status\">to be measured on the breadboard spike<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / >\n<p>Status: <strong>partly written 2026-11-13<\/strong> (the TAP gesture split, review must-fix O5). The rest is to be written · sources: ../../eng/daisy-first-principles.md §2.4, §3.2, §5.3, §7.3; review item 6<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Controls and states<\/h2>\n<h3>Gestures, split so none collides (review must-fix, architecture open item 5)<\/h3>\n<p><strong>The collisions found:<\/strong>\n- \"hold TAP at power-on\" meant <strong>both<\/strong> full autotune and the <strong>bootloader (DFU)<\/strong>;\n- \"EMPHASIS full + hold TAP\" ran the filter calibration <strong>live<\/strong>, and EMPHASIS full is a normal playing position;\n- \"hold TAP\" also queried the battery.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Gesture<\/th>\n<th>Does<\/th>\n<th>When<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Gesture\"><strong>Hold TAP while switching on<\/strong><\/td>\n<td data-label=\"Does\">full autotune re-sweep (normally a 0.3 s verify runs instead)<\/td>\n<td data-label=\"When\">power-on<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span> (keeps eng's gesture)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Gesture\"><strong>Hold TAP + hold the bend stick fully up while switching on<\/strong><\/td>\n<td data-label=\"Does\"><strong>bootloader (firmware update over USB)<\/strong>; status light alternates red / green<\/td>\n<td data-label=\"When\">power-on<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span>. Hard to do by accident. Fallback: the Seed's own BOOT button behind the service panel<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Gesture\"><strong>EMPHASIS fully up + hold TAP while switching on<\/strong><\/td>\n<td data-label=\"Does\">filter-scale calibration<\/td>\n<td data-la
