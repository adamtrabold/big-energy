<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>( name to come ) · project site · Herbarium prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E4DF;--cell:#EFEDE9;--paper:#F8F7F4;--rule:#C4C1BA;--ink2:#5F5D58;--ink:#1B1B19;--on:#23863F;--m:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-feature-settings:"tnum";padding-bottom:24px}
a{color:inherit;text-decoration:none}
a.u,.ref{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.cap{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.ink2{color:var(--ink2)}
.rule{border-top:1px solid var(--rule)}
/* lamp */
.lampline{display:flex;align-items:center;gap:10px;min-height:20px}
.lamp{width:10px;height:10px;border-radius:50%;flex:none;transition:background 1s,box-shadow .6s,border-color 1s}
.lamp.standby{border:1.2px solid var(--ink2);background:transparent}
.lamp.on{background:var(--on);border:0}
.lamp.dip{animation:dip .6s ease-in-out}
@keyframes dip{50%{opacity:.4;box-shadow:0 0 0 6px rgba(35,134,63,.18)}}
.lamp.snapshot{width:10px;height:1.5px;border-radius:0;background:var(--rule)}
.lampline.live .cap{color:var(--ink)}
/* header */
header.band{padding:18px 0 12px}
.hgrid{display:grid;gap:10px}
.name{font-size:22px;font-weight:600;line-height:1.2;margin-top:6px}
.sub{font-size:13px;color:var(--ink2)}
.sub a{color:var(--ink);font-weight:500}
.waiting{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.waiting b{font-size:15px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:4px}
.strip a{display:block;height:20px;position:relative}
.strip a i{position:absolute;left:0;right:0;top:6px;height:6px;background:var(--rule)}
.strip a.done i,.strip a.now i{background:var(--ink)}
.strip a.now::after{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--ink)}
.strip a.early i{background:transparent;border:1px solid var(--ink2)}
.strip a span{display:none}
.stripline{font-size:12.5px;color:var(--ink2)}.stripline b{color:var(--ink);font-weight:600}
nav.filters{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:10px 0;border-top:1px solid var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav.filters a{font-size:15px;color:var(--ink2);padding-bottom:4px}
nav.filters a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
nav.filters .more{margin-left:auto;color:var(--ink);font-weight:600}
@media(min-width:1024px){
  :root{--m:48px}
  .hgrid{grid-template-columns:1.1fr .8fr 1fr;align-items:end}
  .name{font-size:26px}
  .strip a span{display:block;position:absolute;top:22px;font-size:11px;color:var(--ink2);white-space:nowrap}
  .strip a.now span,.strip a.done span{color:var(--ink)}.strip a.now span{font-weight:600}
  .strip{margin-bottom:16px}
}
/* label + slips */
.label{border-top:1px solid var(--ink);padding-top:8px}
.lh{display:flex;align-items:baseline;gap:8px;font-size:15px}
.lh b{font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block;margin-left:auto;align-self:center;flex:none}
.lf{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.slip{border:1px solid var(--rule);padding:3px 8px;font-size:12px;color:var(--ink2);margin-bottom:3px;display:flex;gap:10px}
.slip b{font-weight:500;min-width:42px}
.slip.top{background:var(--paper);color:var(--ink);font-weight:500}.slip.top b{font-weight:700}
.slip.new{animation:land .4s ease-out}
@keyframes land{from{transform:translateY(-8px);opacity:0}}
.more{font-size:12px;color:var(--ink2);padding:2px 8px}
.link{font-size:12.5px;font-weight:500}
/* landing */
.feature{display:grid;gap:14px;padding:6px 0 18px}
.feature figure{margin:0}
.feature img{width:100%;height:auto;display:block;max-height:62vh;object-fit:contain;background:var(--paper)}
.feature img.in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.side{display:flex;flex-direction:column;gap:14px}
.side .kinds{order:2}.side .glab{order:1}
@media(min-width:1024px){.side .kinds{order:1}.side .glab{order:2}}
.oneline{font-size:15px}
.since{font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:block}
.tile .box{height:86px;background:var(--cell);overflow:hidden;position:relative}
.tile .box img{width:100%;height:100%;object-fit:cover;display:block}
.tile .doc{background:var(--paper);border:1px solid var(--rule);padding:7px 9px}
.tile .doc .c{font-size:11px;font-weight:700;color:var(--ink2)}
.tile .doc .t{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .k{font-size:11px;font-weight:600;margin-top:4px}
.wavemini{position:absolute;inset:8px 8px 20px 8px;display:flex;align-items:center;gap:1px}
.wavemini i{flex:1;background:var(--ink);min-height:1px}
.tile .w{position:absolute;left:8px;bottom:4px;font-size:10.5px;font-weight:700}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){
  .feature{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:stretch}
  .feature img{max-height:calc(100vh - 260px)}
  .side{justify-content:space-between}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
/* lists */
h2.sec{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.entry .pic{aspect-ratio:16/10;background:var(--paper);overflow:hidden;display:flex;align-items:center;justify-content:center}
.entry .pic img{width:100%;height:100%;object-fit:contain}
.entry .pic.doc{display:block;border:1px solid var(--rule);padding:12px 14px}
.entry .pic.doc .t{font-weight:600;font-size:15px;line-height:1.3}
.entry .pic.doc p{font-size:13px;color:var(--ink2);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.entry .pic.test{background:var(--cell);position:relative;display:block}
.entry .label{margin-top:8px}
.dropped{opacity:.4}
.dropped:hover{opacity:.7}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1024px){.thumbs{grid-template-columns:repeat(5,1fr)}}
.thumbs a img{width:100%;aspect-ratio:1.414;object-fit:contain;background:var(--paper);display:block}
.thumbs a span{font-size:11.5px;font-weight:700;display:block;margin-top:4px}
.rows a,.rows div.r{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;align-items:baseline}
.rows .c{font-weight:600;min-width:74px}
.rows .x{margin-left:auto;font-size:12.5px;color:var(--ink2);text-align:right}
/* item */
.back{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;font-size:14px;color:var(--ink2)}
.back button{font-size:13px;color:var(--ink2)}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-bottom:30px}
@media(min-width:1024px){.item{grid-template-columns:minmax(0,1fr) 372px;gap:32px}.item .aside{align-self:end;position:sticky;bottom:72px}}
.viewer{background:var(--paper);overflow:auto;max-height:80vh;cursor:zoom-in;position:relative}
.viewer img{display:block;width:100%;height:auto}
.viewer.z{cursor:zoom-out}.viewer.z img{width:auto;max-width:none}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
.lineage{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:4px 2px}
.lineage a{flex:none;width:96px;font-size:11.5px}
.lineage a img{width:96px;height:68px;object-fit:cover;display:block;border:2px solid transparent}
.lineage a.on img{border-color:var(--ink)}
.lineage .gap{flex:none;width:58px;font-size:11.5px;color:var(--ink2);padding-top:30px;border-top:1px dashed var(--rule);margin-top:34px}
.btn{display:inline-block;border:1px solid var(--ink);padding:6px 12px;font-size:13px;font-weight:500}
/* compare */
.cmp{display:grid;gap:16px}
.cmp .pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cmp figure{margin:0;position:relative;background:var(--paper)}
.cmp figure img{display:block;width:100%;height:auto}
.cmp svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wipe{position:relative;touch-action:none;user-select:none;background:var(--paper)}
.wipe img{display:block;width:100%;height:auto;pointer-events:none}
.wipe .top{position:absolute;inset:0}
.wipe .bar{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink)}
.wipe .knob{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.toggle{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.sw{width:44px;height:22px;border:1px solid var(--ink);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw.on{background:var(--ink)}.sw.on i{left:25px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a,.chips button{border:1px solid var(--rule);padding:4px 10px;font-size:13px}
.chips .on{border-color:var(--ink);font-weight:600}
/* test */
.sound{background:var(--cell);padding:14px 16px;display:grid;grid-template-columns:48px 1fr;gap:6px 16px;align-items:center}
.play{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.play svg{width:16px;height:16px}
.wave{position:relative;height:90px;display:flex;align-items:center;gap:1px;cursor:pointer}
.wave i{flex:1;background:var(--ink);min-height:1px}
.wave .ph{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);left:0}
.sound .meta{grid-column:2;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.ab{grid-column:1/3;display:flex;gap:18px;font-size:14px;margin-top:4px}
.ab button{color:var(--ink2);padding-bottom:3px}
.ab button.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.result{font-size:15px}.result b{font-weight:700;margin-right:8px}
.plots img{width:100%;height:auto;display:block;background:#fff;margin-top:12px}
/* docs */
.doc-html{max-width:68ch;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.doc-html figure{margin:14px 0}.doc-html figure img{width:100%;height:auto;display:block;background:var(--paper)}
.doc-html figcaption{font-size:12px;font-weight:500;color:var(--ink2);margin-top:6px;line-height:1.4}
.gdoc{max-width:none}
.gcols{display:grid;grid-template-columns:minmax(0,1fr) 372px;column-gap:32px;align-items:start}
.gcols .figs figure{margin:0 0 22px}.gcols .text{position:sticky;top:60px;max-height:calc(100vh - 120px);overflow:auto}
.doc-html h1{font-size:22px;line-height:1.25;font-weight:600}
.doc-html h2{font-size:17px;font-weight:600;margin:26px 0 8px}
.doc-html h3{font-size:15px;font-weight:600}
.doc-html code{font-size:13px;background:var(--cell);padding:0 3px}
.doc-html pre{overflow:auto;background:var(--cell);padding:10px}
.tbl{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
details.jump{margin:6px 0 16px;font-size:13px}
details.jump summary{cursor:pointer;color:var(--ink2)}
details.jump a{display:block;padding:3px 0}
/* group page */
.gtop{display:grid;gap:14px;padding:4px 0 10px}
@media(min-width:1024px){.gtop{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:end}}
.gsec{display:grid;gap:12px;padding:18px 0;border-top:1px solid var(--rule)}
.gsec figure{margin:0}.gsec figure img{width:100%;height:auto;display:block;background:var(--paper)}
.gsec figcaption{font-size:11.5px;font-weight:500;color:var(--ink2);margin-top:6px}
@media(min-width:1024px){.gsec{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:start}.gsec .txt{order:2}.gsec figure{order:1}}
.note{font-size:12px;color:var(--ink2);border-left:2px solid var(--rule);padding:2px 10px;margin:10px 0}
/* decisions + history */
.dec{border-top:1px solid var(--rule);padding:12px 0}
.dec .ask{font-size:12.5px;color:var(--ink2)}
.dec .w{font-size:15px;color:var(--ink2)}
.dec.open .w{font-size:17px;font-weight:600;color:var(--ink)}
.dec .cz{font-size:12.5px;color:var(--ink2);margin-top:4px}
.dec .cz a{color:var(--ink);font-weight:600}
.dec .rowsc{margin-top:8px}
.dec .rowsc a{display:flex;gap:10px;padding:4px 0;font-size:14px}
.dec .rowsc a span:first-child{color:var(--ink2);min-width:44px}
.dec .rowsc a b{min-width:52px}
.dec .rowsc a u{text-underline-offset:3px}
.grain{display:flex;gap:22px;font-size:14px;margin:6px 0 10px}
.grain a{color:var(--ink2);padding-bottom:3px}.grain a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.ev .t{color:var(--ink2);font-size:12.5px}
.lock{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:3px 0;margin:6px 0}
.lockrule{height:8px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin:10px 0 14px}
.score{display:flex;gap:10px;font-size:14px;padding:4px 0;border-top:1px solid var(--rule)}
.score b{min-width:28px}
.vtitle{font-size:28px;font-weight:700}
.wide{max-width:900px}
/* prototype bar */
.proto{position:fixed;left:0;right:0;bottom:0;background:#D6D4CF;border-top:1px solid var(--rule);font-size:12px;z-index:20}
.proto .in{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:7px var(--m);max-width:1440px;margin:0 auto}
.proto b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;color:var(--ink2)}
.proto button{text-decoration:underline;text-underline-offset:3px;font-size:12px}
.proto button.on{font-weight:700}
.ptog{display:none;text-decoration:none!important}
@media(max-width:899px){.ptog{display:inline}.plab{display:none}.proto:not(.open) .in>*:not(.ptog){display:none}.proto .in{gap:6px 14px}}
/* status line */
.status{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.status b{color:var(--ink);font-weight:600}
/* docs + reviews */
.cards{display:grid;gap:14px;margin:6px 0 4px}
@media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
.card{display:block;background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.card .k{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.card .t{font-size:17px;font-weight:600;margin:4px 0 2px}
.card p{margin:0;font-size:13.5px;color:var(--ink2)}
.st{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 6px;line-height:18px;border:1px solid var(--ink);white-space:nowrap}
.st-decided{background:var(--ink);color:#fff}
.st-proposed{background:transparent;color:var(--ink)}
.st-open{border-style:dashed;color:var(--ink2);border-color:var(--ink2)}
.counts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}
.drow .t{font-weight:600;font-size:15px}.drow .c{font-size:13px;color:var(--ink2)}
.drow.stub .t{color:var(--ink2);font-weight:500}
@media(min-width:900px){.drow{grid-template-columns:240px minmax(0,1fr) 260px;align-items:baseline}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0 14px;align-items:center}
.doc-html pre{font-size:12.5px;line-height:1.35;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prehint{font-size:11.5px;color:var(--ink2);margin:-6px 0 12px}
.mmd{overflow-x:auto;background:#fff;padding:10px;margin:10px 0}.mmd svg{max-width:none;height:auto}
@media(max-width:599px){
 .doc-html .tbl{border-top:0;overflow:visible}
 .doc-html table,.doc-html tbody,.doc-html tr,.doc-html td{display:block;width:100%}
 .doc-html thead{display:none}
 .doc-html tr{border-top:1px solid var(--ink);padding:6px 0 8px}
 .doc-html td{border:0;padding:3px 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
 .doc-html td::before{content:attr(data-label);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
 .doc-html td[data-label=""]{display:block}.doc-html td[data-label=""]::before{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

"D-107"], "seed": "ONESHEET", "revs": [{"rev": "A", "line": "branches round 1: 6 · retired by the branches director"}], "round": "Branches round 1"}, {"code": "DIPTYCH", "title": "DIPTYCH", "rev": "A", "status": "dropped", "stage": "Concept", "date": "13 Nov", "new": true, "line": "a scientific field instrument", "lead": "DIPTYCH-standing", "images": ["DIPTYCH-standing", "DIPTYCH-standing-side-exact", "DIPTYCH-time-dial", "DIPTYCH-lid-left-graduations", "DIPTYCH-open", "DIPTYCH-closed", "DIPTYCH-top"], "docs": ["D-106", "D-105"], "seed": "FOLD", "revs": [{"rev": "A", "line": "branches round 1: killed by the branches director"}], "round": "Branches round 1"}, {"code": "FOLD", "title": "FOLD", "rev": "C", "status": "locked in v1.1", "stage": "Lock", "date": "13 Nov", "line": "FOLD-105 · a hinge · walnut + white", "lead": "FOLD-A", "images": ["FOLD-A", "FOLD-B", "FOLD-C", "FOLD-D", "FOLD-E"], "docs": ["D-011"], "legacy": true, "revs": [{"rev": "C", "line": "v1.1 · stands at 120°, joystick, MIDI IN"}, {"rev": "B", "line": "v1 · first lock"}, {"rev": "A", "line": "round 5"}]}, {"code": "HUSH", "title": "HUSH", "rev": "B", "status": "locked in v1.1", "stage": "Lock", "date": "13 Nov", "line": "nothing shouts: grey wool, natural maple, cream knobs", "lead": "HUSH-A", "images": ["HUSH-A", "HUSH-B", "HUSH-C", "HUSH-D"], "docs": ["D-013"], "legacy": true, "revs": [{"rev": "B", "line": "v1.1 · joystick in every view"}, {"rev": "A", "line": "v1 · first lock"}]}, {"code": "ONESHEET", "title": "ONE SHEET", "rev": "B", "status": "locked in v1.1", "stage": "Lock", "date": "13 Nov", "line": "one printed sheet, rings texture", "lead": "ONESHEET-A", "images": ["ONESHEET-A", "ONESHEET-B", "ONESHEET-C", "ONESHEET-D"], "docs": ["D-015"], "legacy": true, "revs": [{"rev": "B", "line": "v1.1 · joystick in every view"}, {"rev": "A", "line": "v1 · first lock"}]}, {"code": "FOLD113", "title": "FOLD113", "rev": "A", "status": "dropped", "stage": "Concept", "date": "13 Nov", "line": "FOLD at 113°, superseded by FOLD-105 in round 5", "lead": "FOLD113-A", "images": ["FOLD113-A"], "docs": [], "legacy": true, "revs": [{"rev": "A", "line": "archive"}]}, {"code": "TYPECASE", "title": "TYPE CASE", "rev": "A", "status": "dropped", "stage": "Concept", "date": "12 Nov", "line": "letterpress type case · paused after round 3", "lead": "TYPECASE-A", "images": ["TYPECASE-A"], "docs": [], "legacy": true, "revs": [{"rev": "A", "line": "archive"}]}, {"code": "HYMNAL", "title": "HYMNAL", "rev": "A", "status": "dropped", "stage": "Concept", "date": "12 Nov", "line": "cigar-box hymnal · paused after round 3", "lead": "HYMNAL-A", "images": ["HYMNAL-A"], "docs": [], "legacy": true, "revs": [{"rev": "A", "line": "archive"}]}, {"code": "UNDERGLASS", "title": "UNDER GLASS", "rev": "A", "status": "dropped", "stage": "Concept", "date": "12 Nov", "line": "parts under glass · killed in round 2", "lead": "UNDERGLASS-A", "images": ["UNDERGLASS-A"], "docs": [], "legacy": true, "revs": [{"rev": "A", "line": "archive"}]}], "items": {"D-019": {"kind": "doc", "sub": "doc", "title": "Budget variant spec", "stage": "Spec", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "rev 14 · 13 Nov · channel aftertouch with its own switch"}], "path": "eng/budget-variant.md", "html": "<h1>Budget variant (\"Little D\"): a ~$100 instrument with the Model D spirit<\/h1>\n<p>Status: rev 0, 2026-11-12; <strong>latest rev 14 (2026-11-13, owner decision: channel aftertouch with its own switch; §v1.12, <a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a>)<\/strong>; rev 13 (2026-11-13, Daisy Seed replaces the Pico 2; §v1.11); rev 12 FOLD only: <code>fold-answers.md<\/code>; rev 11 battery: <code>battery.md<\/code>. This is a <strong>separate, second instrument<\/strong> (owner: \"lets keep the expensiver one too\"). It\nshares no boards with <code>architecture-v2.md<\/code>. It does reuse ideas: autotune, background re-tune, jump-on-move,\nand the \"keys on their own strip\" rule.<\/p>\n<p>Conventions: link = price/stock read this session (2026-11-12). <strong>ESTIMATE<\/strong> = my number, not checked.\n<strong>UNVERIFIED<\/strong> = a source exists but I could not confirm the figure. [ENG] = engineering judgement.<\/p>\n<p>Constraints still in force:\n- hand-soldered through-hole only; anything SMD arrives as a ready-made module;\n- no factory assembly;\n- 25 keys minimum, feels like an instrument;\n- portable and battery-capable;\n- analog audio path, and analog wherever possible;\n- no calibration rigmarole.<\/p>\n<hr />\n<h1>PART 1: LITTLE D v1, LOCKED SPEC (rev 2, 2026-11-12; <strong>rev 8 changes marked [rev 8]<\/strong>, <strong>rev 9 marked [rev 9]<\/strong>, <strong>rev 10 marked [rev 10]<\/strong>, <strong>rev 11 marked [rev 11]<\/strong>, <strong>rev 12 marked [rev 12]<\/strong>)<\/h1>\n<p><strong>[rev 14] (2026-11-13, owner decision \"now i want it\"; detail in §v1.12 and <a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a>):<\/strong> <strong>channel aftertouch.<\/strong>\n- <strong>Sensing:<\/strong> two Interlink FSR UX 408 300 mm strips ($4.99 each), trimmed to ≈ 240 mm, form parallel pressure lanes under the two key rows. Strip C now <strong>floats<\/strong> on the lanes, held down by 4 light springs, so all key force passes through the sensors. No added key travel.\n- <strong>Height:<\/strong> <strong>+0 mm nominal<\/strong> (the stack fills the existing ≈ 8 mm under strip C).\n- <strong>Electronics:<\/strong> a divider on spare mux B channel 15; the new <strong>AFTERTOUCH toggle MOD / OFF / FILT<\/strong> on mux B channel 14. 0 new pins; mux 48/48.\n- <strong>Routing:<\/strong> MOD adds to the AS3360 A mod-depth CV, FILT adds to the CUTOFF CV. Channel pressure goes out on USB and TRS, and incoming pressure drives the same destinations.\n- <strong>Cost:<\/strong> ≈ +$18–33. The TRS MIDI out jack (owner: \"Add MIDI out\") is now counted too, +$0.50.\n- <strong>Design:<\/strong> 8 toggles; the back panel carries the key load; FOLD's base board must split.<\/p>\n<p><strong>[rev 13] (2026-11-13, owner decision; detail in §v1.11):<\/strong> the digital brain is now an <strong>Electrosmith Daisy Seed (Seed3 or 65 MB Seed2 DFM, $34.99)<\/strong>, socketed, replacing the Pico 2. It does all control duties <strong>plus the digital echo + reverb<\/strong>; the dry voice path stays analog. No SGTL5000 shield and no 74HC595 are needed. Consequences:\n- <strong>Cost ≈ +$39–50<\/strong> (USB) over rev 12 (Seed +$29.24 net; 8 FX controls, DRIFT and wet path ≈ +$10–21); <strong>+$6–12 more with a battery<\/strong> for a bigger boost. One-unit totals in §v1.11.4.\n- <strong>Power:<\/strong> ≈ 2.4–4.4 W (was 2.0–3.6). Runtime on 22.2 Wh ≈ 3.9–7.5 h; on the slim 11.1 Wh pack ≈ 1.9–3.7 h.\n- <strong>Footprint:<\/strong> 2 × 20 pins at 0.6\" row spacing (the Pico is 0.7\"), so it is a different socket. 51 × 18 mm, under the Pico's 51 × 21.\n- <strong>USB:<\/strong> the E3 pad-wiring trick (D± to Pico test pads) does not carry over as written (§v1.11.3).\n- Subsystem implementation (key scan, autotune counters, pot scan, CVs, MIDI, FX path, sequencing) is <strong>pending <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a><\/strong>. Pico-specific text below (PIO counters, Pico-sequenced enables, \"Pico-read\") is history until that lands.\n- Design-facing list: <code>daisy-switch-notes.md<\/code>.<\/p>\n<p><strong>[rev 12] (2026-11-12, <code>fold-answers.md<\/code>, FOLD only):<\/strong>\n- <strong>FOLD band pack option:<\/strong> 4 × PiShop 952540 (9.5 × 25 × 40, 750 mAh, PCM), 1S4P, 11.1 Wh. Runtime ≈ 4.5 h at 2.0 W, ≈ 2.4 h at 3.6 W. Star harness + 2 A fuse. $40.75 with the charger.\n- <strong>FOLD depth:<\/strong> set by lid board area + battery footprint, <strong>D ≥ 6 + (23,300 + A)/262<\/strong>. ≤ 90 needs no internal cell <em>and<\/em> the ladder in the base.\n- <strong>FOLD EMPHASIS can cross the hinge:<\/strong> 2-wire rheostat (SPICE: no effect on response or self-oscillation onset). The emphasis-input wire goes at the far ribbon edge, ≤ 0.1 pF to the mux selects. 40-way ribbon. Bench pass ≤ −70 dB.\n- Flat concepts unchanged.<\/p>\n<p><strong>[rev 11] (2026-11-12, <code>battery.md<\/code>):<\/strong> internal battery is now <strong>two 50 × 60 mm pouch cells in parallel (1S2P)<\/strong>, 22.2 Wh with PiShop 755060 ×2 (runtime ≈ 4.7–9 h), or 18.5 Wh with Adafruit #328 ×2 (verified in stock, ≈ 3.9–7.5 h). Same bq25185 charger/boost. LiPo line is now ≈ <strong>$38.85–40.85<\/strong> (was $21.45), so totals with LiPo ≈ +$17.4–19.4. Only the power lines below changed.<\/p>\n<p><strong>[rev 10] (2026-11-12, <code>round4-answers.md<\/code>):<\/strong>\n- <strong>Main board:<\/strong> 268 × 85 doesn't fit. It becomes ≈ 268 × 115, with 1/8 W standing resistors, top-side parts ≤ 6.5 mm and the Pico on the underside.\n- <strong>Pots:<\/strong> the Tayda A-5531 has a 40-tooth shaft, so they change to the A-5622 T18 spline (+$3.22).\n- <strong>Power:<\/strong> recounted at ≈ 2.0–3.6 W, so LiPo runtime ≈ 1.8–3.3 h. The sensor LDO is switched on last.\n- <strong>Boards:<\/strong> 67.5 in².\n- <strong>Totals:<\/strong> ≈ +$12–20.<\/p>\n<p><strong>[rev 8] (2026-11-12, <code>velocity-and-keys-v2.md<\/code>):<\/strong> velocity now sounds, selected by a LOUD / BOTH / FILT switch (≈ +$2). Keys are 25 bought Choc V2 silent switches with short pressed-on tops and a magnet over a flat SS49E; the owner won't build a key mechanism, so RAIL is out. Totals ≈ +$3.<\/p>\n<p><strong>[rev 9] (2026-11-12, <code>little-d-design-answers.md<\/code>):<\/strong> the 3\" speaker (Adafruit #1313) is 25.5 mm deep and fits no concept; replaced by a <strong>50 mm, 7.6 mm-deep Same Sky CDS-5076-1SP ($3.88)<\/strong>, no board cutout, with a lead-free keep-out on the main board underside over it. ≈ 4–6 dB quieter, less low end. Totals ≈ +$2.<\/p>\n<p>This section follows the owner decisions in <code>owner-requirements.md<\/code>, under \"budget instrument ('Little D')\ndecisions\" and the corrections after it:\n- <strong>one test unit<\/strong>;\n- <strong>quantity-1 board fabrication, no 5-board minimums<\/strong>;\n- <strong>3 VCOs<\/strong>;\n- <strong>all original waveforms<\/strong>;\n- <strong>modern pin-for-pin \"original chips\"<\/strong> (AS3046 etc.; \"i dont need vintage parts\");\n- <strong>keep the speaker<\/strong>;\n- <strong>no extra patch points<\/strong>;\n- <strong>US distributors where it helps<\/strong>;\n- <strong>keys as silent as possible<\/strong>, mechanism still open;\n- <strong>bend/mod control undecided<\/strong>: priced as options in §v1.5, not in the base total.<\/p>\n<p><strong>Part 1 supersedes Part 2 (the rev 0 tier exploration) wherever they conflict.<\/strong> Part 2 stays for the\nreasoning, the cut list and the calibration method (§4 there still applies).<\/p>\n<p>Rev 2 changes:\n- touch strips moved out of the total and into options;\n- all boards re-costed at quantity 1 with US/one-off fabs;\n- board designs cut from 5 to <strong>1<\/strong>;\n- LCSC dropped (it only made sense riding in a JLC box), so those parts now come from Tayda or US vendors.<\/p>\n<h2>v1.0 Bottom line (one unit, one-off)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Configuration<\/th>\n<th>Parts<\/th>\n<th>Board (qty 1, §v1.3)<\/th>\n<th>Shipping + duty<\/th>\n<th><strong>One-unit total<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Configuration\">v1 core, USB power bank (includes the old printed-key/Hall allowance of $22.90)<\/td>\n<td data-label=\"Parts\">$138<\/td>\n<td data-label=\"Board (qty 1, §v1.3)\">$75–130<\/td>\n<td data-label=\"Shipping + duty\">$31–43<\/td>\n<td data-label=\"One-unit total\">≈ $244–311<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Configuration\"><strong>v1, USB, K3 silent switches + SoftPot strips<\/strong> (cheapest all-bought keys and bend/mod)<\/td>\n<td data-label=\"Parts\">+$14–17<\/td>\n<td data-label=\"Board (qty 1, §v1.3)\">—<\/td>\n<td data-label=\"Shipping + duty\">—<\/td>\n<td data-label=\"One-unit total\"><strong>≈ $258–328<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Configuration\"><strong>v1, USB, K3 silent switches + real wheels<\/strong> (Doepfer pitch wheel + thumbwheel mod, §v1.5)<\/td>\n<td data-label=\"Parts\">+$25–34<\/td>\n<td data-label=\"Board (qty 1, §v1.3)\">—<\/td>\n<td data-label=\"Shipping + duty\">—<\/td>\n<td data-label=\"One-unit total\"><strong>≈ $269–345<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Configuration\">v1, USB, K1 harvested keybed + real wheels<\/td>\n<td data-label=\"Parts\">+$44–63<\/td>\n<td data-label=\"Board (qty 1, §v1.3)\">—<\/td>\n<td data-label=\"Shipping + duty\">—<\/td>\n<td data-label=\"One-unit total\">≈ $288–374<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Configuration\">Internal LiPo (recommended: \"completely portable\")<\/td>\n<td data-label=\"Parts\">+$21.45 ~~on any row~~ <strong>[rev 11] +$38.85–40.85 (2 cells + bq25185, <code>battery.md<\/code>)<\/strong><\/td>\n<td data-label=\"Board (qty 1, §v1.3)\">—<\/td>\n<td data-label=\"Shipping + duty\">—<\/td>\n<td data-label=\"One-unit total\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Superseded by §v1.10 (rev 4 clean totals).<\/strong> Owner rule (2026-11-12): <strong>knobs, keys and wheels must be real bought parts, not 3D-printed.<\/strong> The rows above\nuse the key options in §v1.4 and the bend/mod options in §v1.5.<\/p>\n<p>Add 10 % contingency for a first build (wrong parts, a re-order).<\/p>\n<p><strong>Honest read:<\/strong>\n- <strong>Revised one-unit range ≈ $245–350<\/strong>, depending on battery, bend/mod choice and which fab wins the quote.\n- <strong>The board is now the biggest single unknown, about $75–130 (ESTIMATE).<\/strong> None of the quantity-1 fabs publishes a price for a board this size without uploaded files.\n- For the record: JLC's 5-board order (≈ $30–42 including tariff, rev 1) would be about $40–90 cheaper and still means one order and one fee. The owner has declined minimums, so it is not in the totals.<\/p>\n<p>It is still about half of the full version's $490–810.<\/p>\n<p><strong>Next action (10 minutes, no design needed):<\/strong> upload a placeholder 280 × 170 mm, 2-layer outline Gerber to\nthese instant quoters and replace the board ESTIMATE with real numbers:\n- Pad2Pad\n- PCBCart\n- AtlasPCB\n- Advanced Circuits BareBones\n- Ponoko (quote by request)<\/p>\n<h2>v1.1 What of the old $150/$200 tiers is included<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Old tier item<\/th>\n<th>In v1?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Old tier item\">$150: VCO 3<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$150: tempcos ×3<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong> (with the AS3046s)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$150: pitch + mod wheels<\/td>\n<td data-label=\"In v1?\"><strong>Undecided<\/strong>: wheels, SoftPot strips or DIY copper strips are priced as options (§v1.5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$150: internal LiPo<\/td>\n<td data-label=\"In v1?\"><strong>Optional, recommended<\/strong> (+$21.45, §v1.6)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$150: 2nd MCP4822<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong> (VCO 3 + filter keytrack CV, enables filter cal)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: full waveform sets on rotary switches<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong> (all 6 per VCO; osc 3 has reverse saw in place of shark tooth, as original)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: noise/osc-3 MOD MIX crossfade<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong> (original mod path; osc 3 is the LFO, as original)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: AS3046 expo arrays<\/td>\n<td data-label=\"In v1?\"><strong>Yes<\/strong>, one per VCO<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: MCP4728 (MIDI sustain etc.)<\/td>\n<td data-label=\"In v1?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: PAM8302 louder speaker<\/td>\n<td data-label=\"In v1?\">No (LM386 + 3\" speaker kept)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: more patch points, A-440<\/td>\n<td data-label=\"In v1?\">No (owner: no extra patch points)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">$200: nicer panel<\/td>\n<td data-label=\"In v1?\">No (laser-cut ply/acrylic; owner's own walnut possible at $0 extra)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Old tier item\">rev 0 firmware LFO + LFO RATE pot<\/td>\n<td data-label=\"In v1?\"><strong>Dropped<\/strong>: osc 3 is the mod source, as on the original<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>v1.2 Locked spec<\/h2>\n<p><strong>Size<\/strong> ≈ 290 × 170 × 32 mm. Wheels, if chosen, add ≈ 40–45 mm of width (§v1.5).\n<strong>Power<\/strong> 5 V USB, ~~≈ 1.0–1.5 W [ENG]: internal 2000 mAh LiPo (≈ 5–7 h)~~ <strong>[rev 10] ≈ 2.0–3.6 W at 5 V (ESTIMATE, recount: the voice rails 1.2–1.9 W, and the sensors 0.6–1.25 W because the LDO draws 5 V × I). The internal 2000 mAh LiPo gives ≈ 1.8–3.3 h. <\/strong>[rev 11] With two 50 × 60 mm cells in parallel (22.2 Wh): ≈ 4.7–9 h, see <code>battery.md<\/code>.<strong> <\/strong>[rev 13] With the Daisy Seed and echo + reverb: ≈ 2.4–4.4 W, 22.2 Wh pack ≈ 3.9–7.5 h, §v1.11.2.<strong> The sensor LDO comes up last through an MCU-switched P-FET (boost stall)<\/strong>, or any USB power bank (no auto-off at 0.4–0.7 A).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Block<\/th>\n<th>Circuit (\"original-style chips\", modern equivalents)<\/th>\n<th>Panel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Block\">VCO 1–3<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\"><strong>AS3046 expo<\/strong> per VCO (pin-for-pin modern CA3046) + <strong>2 kΩ 3300 ppm tempco<\/strong>. Original-topology core: discrete reset and comparator. Ramp buffer is the original discrete JFET-differential topology, using <strong>hand-matched through-hole JFETs<\/strong> (Pico Idss jig). Original waveshapers (tri folder, shark/reverse-saw, 3 rectangle widths)<\/td>\n<td data-label=\"Panel\"><strong>WAVE<\/strong> 6-way rotary ×3. <strong>RANGE<\/strong> ×3 (Pico-read pots, 6 firmware detents: LO, 32'–2'). <strong>FREQ<\/strong> osc 2, osc 3 (Pico-read). <strong>OSC 3 CONTROL<\/strong> toggle (keyboard off)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Controllers<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">Firmware glide (saturating curve), master tune<\/td>\n<td data-label=\"Panel\"><strong>TUNE<\/strong>, <strong>GLIDE<\/strong> (Pico-read). <strong>MOD MIX<\/strong> pot (osc 3 ↔ noise, analog). <strong>OSC MOD<\/strong> and <strong>FILTER MOD<\/strong> toggles. Bend/mod controller: option, §v1.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Mixer<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\"><strong>Passive into the ladder input pair<\/strong> (original)<\/td>\n<td data-label=\"Panel\"><strong>OSC 1/2/3<\/strong> levels, <strong>NOISE/EXT<\/strong> level. <strong>SOURCE<\/strong> 3-way toggle: noise / ext / feedback. No per-channel on/off switches: turn the level down instead<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Filter<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">4-pole discrete ladder (hand-matched 2N3904 pairs, as the original's matched TIS97s), film caps, discrete-pair expo, original-style output stage<\/td>\n<td data-label=\"Panel\"><strong>CUTOFF<\/strong> (Pico-read, MIDI CC). <strong>EMPHASIS<\/strong>, <strong>CONTOUR AMT<\/strong>. <strong>KEYBOARD CONTROL<\/strong> 3-way toggle (off / ⅓ / ⅔)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Contours ×2<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">Original ADS topology, overshoot kept<\/td>\n<td data-label=\"Panel\"><strong>A/D/S<\/strong> ×2. <strong>DECAY<\/strong> toggle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">VCA, output<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">Discrete pair, auto-nulled. LM386 → ~~3\" speaker~~ <strong>[rev 9] 50 mm thin speaker (7.6 mm deep); main-board underside lead-free over a ≈ 54 mm circle, speaker ≥ 30 mm from ladder/expos<\/strong>; phones/line. <strong>[rev 8]<\/strong> Loudness contour passes through AS3360 half B (velocity) before the VCA; EXT LOUDNESS normal untouched<\/td>\n<td data-label=\"Panel\"><strong>VOLUME<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\"><strong>[rev 8] Velocity<\/strong><\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">Pico PWM \"VEL\" → 2-pole RC → AS3360 half B (scales loudness contour); filter = velocity offset added in firmware to the CUTOFF CV<\/td>\n<td data-label=\"Panel\"><strong>VELOCITY<\/strong> ON-OFF-ON toggle: LOUD / BOTH / FILT (read on a spare CD4067 channel)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\"><strong>[rev 14] Aftertouch<\/strong><\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">Channel pressure: 2 × FSR UX 408 lanes under a floating strip C → divider → mux B ch 15 (ADC2). Firmware gate (key bottomed), learned dead zone, auto-zero. MOD → AS3360 A mod depth; FILT → CUTOFF CV; MIDI pressure out (USB + TRS) and in. <a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a><\/td>\n<td data-label=\"Panel\"><strong>AFTERTOUCH<\/strong> ON-OFF-ON toggle: MOD / OFF / FILT (mux B ch 14)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Keys<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">~~25. Hall (default) or tactile buttons, see §v1.4~~ <strong>[rev 8]<\/strong> 25 Kailh Choc V2 silent switches soldered to the key strip, short pressed-on tops (≤ 1.75u), K&amp;J D31 magnet in each top over a flat SS49E (rest gap 5.6 mm, bottom 2.8 mm); strip on its own LD1117V33. <code>velocity-and-keys-v2.md<\/code> §2<\/td>\n<td data-label=\"Panel\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">I/O<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\"><strong>PITCH CV out, GATE out, FILTER CV in<\/strong>, EXT audio in, PHONES/LINE out, TRS MIDI in, USB-MIDI <strong>[rev 13] USB route changes, §v1.11.3; optional TRS MIDI out is free on the Seed<\/strong><\/td>\n<td data-label=\"Panel\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Digital<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">~~Pico 2 (socketed)~~ <strong>[rev 13] Daisy Seed (socketed, 2 × 20 pins), §v1.11.<\/strong> <strong>2× MCP4822<\/strong> (VCO 1–3 pitch + filter keytrack). 3× CD4067 (25 keys + 8 Pico-read pots + 2 bend/mod inputs = 35 channels)<\/td>\n<td data-label=\"Panel\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Power<\/td>\n<td data-label=\"Circuit (&quot;original-style chips&quot;, modern equivalents)\">2× MC34063 → ±12 V → 78L09/79L09 → ±9 V (rev 0 §2.4)<\/td>\n<td data-label=\"Panel\">Power switch<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Panel count:<\/strong> 23 pots (8 Pico-read), 3 rotary switches, ~~6~~ ~~7 toggles [rev 8: + VELOCITY]~~ <strong>8 toggles [rev 14: + AFTERTOUCH]<\/strong>, plus the power switch. (FX controls and DRIFT from rev 13 are additional: §v1.11.1.)<\/p>\n<p><strong>[rev 10] Boards now:<\/strong>\n- <strong>Main board ≈ 268 × 115<\/strong> (flat concepts). The design's 268 × 85 is short by ≈ 15–35 mm of depth (part-by-part courtyard tally, <code>round4-answers.md<\/code> §1).\n- <strong>Strip C is 270 × 47.<\/strong>\n- <strong>Every top-side main-board part is ≤ 6.5 mm.<\/strong> That means:\n  - 1/8 W resistors standing;\n  - DIPs soldered directly or in low-profile sockets;\n  - 5 mm electrolytics.\n- <strong>The Pico and the MC34063 inductors go on the underside<\/strong>, with a stack ≤ 8 mm.\n- <strong>FOLD's lid board (262 × 50) is ≈ 9–12k mm² short<\/strong>; see §1.4 there.<\/p>\n<p>The single-board text below is history.<\/p>\n<p><strong>One board.<\/strong> Everything goes on a <strong>single 2-layer board, ≈ 280 × 170 mm (≈ 73.8 in²)<\/strong>, covering the whole footprint:\n- <strong>Back ≈ 100 mm:<\/strong> pots, switches and jacks, with voice circuitry between them.\n- <strong>Front ≈ 70 mm:<\/strong> the rest of the voice, the Pico and the DACs, all kept to ≤ 8 mm height, with the <strong>row of Hall sensors (or tactile pads) under the keys<\/strong>. The printed keys mount above it on standoffs.\n- This replaces the 5 small boards of rev 1, so there is one order, one handling/tooling fee and no inter-board cables.\n- It also fits BareBones' 10 × 16 in maximum (<a href=\"https://advancedpcb.com/en-us/barebones-special\" rel=\"noopener\" target=\"_blank\">Advanced Circuits<\/a>).\n- The owner's earlier note that keys must not drive <em>main board<\/em> size is respected in spirit: the sensor row is a strip region of the one board, and a different key mechanism only changes that region's footprints.<\/p>\n<p><strong>Calibration:<\/strong> \"no rigmarole\" holds:\n- VCO autotune at boot, plus background re-tune;\n- VCA auto-null;\n- self-learning keys and strips;\n- automatic filter scale cal, with one optional gesture (EMPHASIS full), as rev 0 §4.<\/p>\n<h2>v1.3 One-unit BOM (one-off)<\/h2>\n<p>Prices as listed 2026-11-12, quantity 1. <strong>US<\/strong> = ships domestically.<\/p>\n<h3>Electronics<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Qty<\/th>\n<th>Unit<\/th>\n<th>Ext.<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">~~Raspberry Pi Pico 2~~ <strong>[rev 13] replaced by the Daisy Seed, §v1.11.1<\/strong><\/td>\n<td data-label=\"Qty\">~~1~~<\/td>\n<td data-label=\"Unit\">~~$5.75~~<\/td>\n<td data-label=\"Ext.\">~~$5.75~~<\/td>\n<td data-labe MR-4-R $4.13, 7.2 mm<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Subtotal<\/strong><\/td>\n<td data-label=\"Qty\"><\/td>\n<td data-label=\"Unit\"><\/td>\n<td data-label=\"Ext.\"><strong>≈ $33.4<\/strong><\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Keys and mechanics<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Ext.<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">25 magnets 5 × 2 mm (<strong>replaced by the chosen key option<\/strong>, §v1.4)<\/td>\n<td data-label=\"Ext.\">$8.00<\/td>\n<td data-label=\"Source\"><a href=\"https://themagnetbaron.com/products/10-3-16-x-1-16-disc-super-strong-rare-earth-magnets-neodymium-n35-nicuni\" rel=\"noopener\" target=\"_blank\">Magnet Baron $15.99/50<\/a> (sold out when checked), so ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">PETG (case sides only; keys are now bought parts, §v1.4)<\/td>\n<td data-label=\"Ext.\">$3.50<\/td>\n<td data-label=\"Source\">ESTIMATE. $1.50 of it was key allowance, replaced in §v1.4<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Felt/TPU stops (silence), feet, standoffs, screws<\/td>\n<td data-label=\"Ext.\">$5.00<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Laser-cut ply/acrylic top + bottom (Vector Space)<\/td>\n<td data-label=\"Ext.\">$12.00<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Subtotal<\/strong><\/td>\n<td data-label=\"Ext.\"><strong>≈ $28.5<\/strong><\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Parts total ≈ $138<\/strong> (no bend/mod controller, no battery).<\/p>\n<h3>Board: one design, quantity 1 (≈ 280 × 170 mm, 2-layer, ≈ 73.8 in²)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fab<\/th>\n<th>Origin / tariff<\/th>\n<th>What's published<\/th>\n<th>One-board cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Fab\"><strong>Advanced Circuits BareBones<\/strong><\/td>\n<td data-label=\"Origin / tariff\">USA, no tariff<\/td>\n<td data-label=\"What&#x27;s published\">Min qty 1, <strong>no soldermask or silkscreen<\/strong>, <strong>$20 handling per order<\/strong> (per the orchestrator from <a href=\"https://4pcb.com/pcb-prototype-2-4-layer-boards-pricing.html\" rel=\"noopener\" target=\"_blank\">4pcb pricing<\/a>, which now redirects to advancedpcb.com; I could not load it), size 1 × 1 in to 10 × 16 in (<a href=\"https://advancedpcb.com/en-us/barebones-special\" rel=\"noopener\" target=\"_blank\">AC BareBones<\/a>). Per-board/area price not readable<\/td>\n<td data-label=\"One-board cost\"><strong>ESTIMATE $75–130<\/strong> = board $45–90 + $20 handling + shipping $10–20. Basis: AC's full-spec \"$33 each\" special covers boards up to 60 in², minimum 3 (<a href=\"https://www.advancedpcb.com/en-us/33-each-special/\" rel=\"noopener\" target=\"_blank\">AC<\/a>), so AC prices this size class in the tens of dollars, and BareBones is their cheaper no-mask line<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fab\"><strong>Pad2Pad<\/strong><\/td>\n<td data-label=\"Origin / tariff\">Ships from Mahwah, NJ; <strong>free shipping<\/strong> in the contiguous US; no minimum (<a href=\"https://www.pad2pad.com/faq/\" rel=\"noopener\" target=\"_blank\">FAQ<\/a>)<\/td>\n<td data-label=\"What&#x27;s published\">Instant online quote, no published table<\/td>\n<td data-label=\"One-board cost\"><strong>ESTIMATE $100–200<\/strong> (typical US quick-turn qty-1 pricing for ~74 in²; no data)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fab\"><strong>PCBCart<\/strong> standard<\/td>\n<td data-label=\"Origin / tariff\"><strong>Thailand or China<\/strong> factory (<a href=\"https://www.pcbcart.com/pcb-fab/standard-pcb.html\" rel=\"noopener\" target=\"_blank\">PCBCart<\/a>), so tariff applies (China ≥ 35 % per <a href=\"https://jlcpcb.com/help/article/us-tariff-policy-faq\" rel=\"noopener\" target=\"_blank\">JLC FAQ<\/a>; Thailand lower, UNVERIFIED)<\/td>\n<td data-label=\"What&#x27;s published\">Order qty \"1pc – 10,000,000 pcs\", instant quote<\/td>\n<td data-label=\"One-board cost\"><strong>ESTIMATE $60–110<\/strong> (board $30–60 + shipping $20–35 + duty)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fab\"><strong>AtlasPCB<\/strong><\/td>\n<td data-label=\"Origin / tariff\"><strong>Origin not stated<\/strong>; the site links a \"PCB Manufacturer China\" page, so assume China tariff. DHL Express extra (<a href=\"https://atlaspcb.com/pricing/\" rel=\"noopener\" target=\"_blank\">Atlas pricing<\/a>)<\/td>\n<td data-label=\"What&#x27;s published\">Tooling and e-test included, quote by Gerber upload<\/td>\n<td data-label=\"One-board cost\"><strong>ESTIMATE $60–110<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fab\"><strong>Ponoko<\/strong><\/td>\n<td data-label=\"Origin / tariff\">\"Made in USA\", though its FAQ says facilities are \"around the globe\"; $0 setup, no MOQ (<a href=\"https://www.ponoko.com/printed-circuit-boards-fabrication-assembly\" rel=\"noopener\" target=\"_blank\">Ponoko<\/a>)<\/td>\n<td data-label=\"What&#x27;s published\">Quote by request only<\/td>\n<td data-label=\"One-board cost\">No basis. Get a quote<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fab\">OSH Park (reference)<\/td>\n<td data-label=\"Origin / tariff\">USA<\/td>\n<td data-label=\"What&#x27;s published\"><strong>$5/in² for 3 copies<\/strong> (<a href=\"https://docs.oshpark.com/services/two-layer/\" rel=\"noopener\" target=\"_blank\">OSH Park<\/a>), so a quantity-3 minimum<\/td>\n<td data-label=\"One-board cost\">$369 for this board, ruled out (minimum and price)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Provisional choice:<\/strong> BareBones at <strong>$75–130<\/strong>, the range used in the totals.\n- <strong>Trade-off:<\/strong> no soldermask means easier solder bridges on a dense hand-soldered board, and no silkscreen means you need a printed placement map. THT at 2.54 mm pitch is manageable.\n- <strong>Full-spec board instead:<\/strong> the cheapest real quote among Pad2Pad, PCBCart and Atlas wins. The quotes may come in under the ESTIMATE range.\n- <strong>Why one board:<\/strong> each quantity-1 order carries its own fixed fee or tooling. One 73.8 in² design beats rev 1's 5 designs (≈ 96 in² total, with 5 fees) on both area and fees [ENG].<\/p>\n<h3>Shipping and duty (ESTIMATE unless cited)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Order<\/th>\n<th>Shipping<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Order\">Tayda (pots, knobs, switches, passives, TL072, MC34063 ≈ $60)<\/td>\n<td data-label=\"Shipping\">$6–10 + ≈ 10 % duty ≈ $6<\/td>\n<td data-label=\"Note\"><a href=\"https://forum.pedalpcb.com/goto/post?id=311248\" rel=\"noopener\" target=\"_blank\">PedalPCB forum<\/a> (2024 rates); duty rate UNVERIFIED<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\">One US order (DigiKey or Adafruit/SparkFun): Pico, MCP4822 ×2, speaker, + LiPo/charger, + SoftPots if chosen<\/td>\n<td data-label=\"Shipping\">≈ $6–8<\/td>\n<td data-label=\"Note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\">Addicore (Hall), <strong>US<\/strong><\/td>\n<td data-label=\"Shipping\">≈ $4–6 (free over $50 per <a href=\"https://addicore.com/SS49E-Linear-Hall-Sensor-p/ad316.htm\" rel=\"noopener\" target=\"_blank\">Addicore<\/a>)<\/td>\n<td data-label=\"Note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\">AS3046 (Amplified Parts US, or Electric Druid EU + duty)<\/td>\n<td data-label=\"Shipping\">≈ $6–10<\/td>\n<td data-label=\"Note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\">MFOS tempcos, <strong>US<\/strong><\/td>\n<td data-label=\"Shipping\">≈ $3–5<\/td>\n<td data-label=\"Note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\">Board<\/td>\n<td data-label=\"Shipping\">in the board line<\/td>\n<td data-label=\"Note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Order\"><strong>Total<\/strong><\/td>\n<td data-label=\"Shipping\"><strong>≈ $31–43<\/strong><\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>v1.4 Keys (rev 4): one switch per key, owner-cut key tops<\/h2>\n<p>Owner decisions:\n- no harvested keybeds;\n- one bought switch per key;\n- key tops laser- or CNC-cut by the owner at Vector Space (material cost only).<\/p>\n<p>Options are from <code>key-sourcing.md<\/code>. Both use a <strong>key-strip PCB<\/strong> (≈ 280 × 25 mm, ≈ 10.9 in²) in the <strong>same fab order<\/strong> as the main board.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>KC: Kailh Choc V2 silent<\/strong> (Deep Sea Mini)<\/th>\n<th><strong>KH: Gateron low-profile Hall<\/strong> (HE Jade Pro class)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Switches<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\">$0.70 × 25 = <strong>$17.50<\/strong> (keeb.io, US; per <code>key-sourcing.md<\/code>)<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">$0.84 × 25 = <strong>$21.00<\/strong> (Nuphy, US; per <code>key-sourcing.md<\/code>; stock to confirm)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Sensors<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\">none (contacts)<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">30 × SS49E-class linear Hall = <strong>$11.40<\/strong> (<a href=\"https://addicore.com/SS49E-Linear-Hall-Sensor-p/ad316.htm\" rel=\"noopener\" target=\"_blank\">Addicore<\/a>). These switches are built for a PCB Hall sensor under the magnet stem; fit of a TO-92 part under a low-profile switch is UNVERIFIED, and an SOT-23 sensor would be SMD (not allowed)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Key tops<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\">2 sheets of 1/8\" cast acrylic, white + black, 5 × 10 in, <strong>$3.99 each<\/strong> (<a href=\"https://shop3duniverse.com/products/1-8-solid-cast-acrylic\" rel=\"noopener\" target=\"_blank\">3D Universe<\/a>), ≈ $8 + shipping ≈ $5 (ESTIMATE). Delrin is similar or more (ESTIMATE); makerspace scrap is $0<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Stem adapter<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\">Laser-cut cross hole in the top, or glue the top onto a bought blank cap (≈ $0.15–0.30 each, <code>key-sourcing.md<\/code>/ESTIMATE): $0–5<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Strip PCB area<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\">In the board line (§v1.10)<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Key cost<\/strong><\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\"><strong>≈ $25–36<\/strong><\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\"><strong>≈ $40–50<\/strong> (+ ≈ $5 Addicore shipping)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Velocity<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\"><strong>No<\/strong><\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\"><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Silence<\/td>\n<td data-label=\"KC: Kailh Choc V2 silent (Deep Sea Mini)\"><strong>Quietest<\/strong> (dampened both strokes)<\/td>\n<td data-label=\"KH: Gateron low-profile Hall (HE Jade Pro class)\">\"Moderately quiet\", no click<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Superseded by §v1.4b (velocity required).<\/strong> KC alone has no velocity.\nThe magnets and Hall sensors in the rev 1–3 base BOM ($20.90 including key plastic) are removed and replaced by the line above.<\/p>\n<h2>v1.4b Velocity keys, through-hole only (rev 6: owner \"i want velocity\")<\/h2>\n<p>Velocity is now required. KC (Choc without sensing) is out. Three through-hole routes:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Route<\/th>\n<th>How<\/th>\n<th>Geometry / buildability<\/th>\n<th>Silence<\/th>\n<th>Key cost<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Route\"><strong>(a) Gateron low-profile Hall switch + TO-92S SS49E<\/strong><\/td>\n<td data-label=\"How\">The switch carries its own magnet. Gateron quotes ≈ 122 G at rest to ≈ 550 G at bottom-out at the sensor in a 1.2 mm-PCB configuration (<a href=\"https://gateron.com/blog/detail/hall-sensor-magnetic-keyboard-switches\" rel=\"noopener\" target=\"_blank\">Gateron<\/a>). With SS49E sensitivity of ≈ 1.4–2.0 mV/G that is a ≈ 0.6–0.9 V swing [ENG]<\/td>\n<td data-label=\"Geometry / buildability\">The switches are designed for a <strong>surface-mount sensor under the switch<\/strong>; Gateron doesn't publish where. A TO-92S (≈ 4 × 3 × 1.5 mm) can't stand under a seated switch. The through-hole workaround is to <strong>lay it flat, face up, in a slot cut in the key-strip PCB<\/strong> (1.5 mm body in a 1.6 mm board), leads bent to pads, so its face sits about where the SMD part would. The position is UNVERIFIED and needs a 1-switch test. No ready-made \"Hall-switch sensor module\" was found<\/td>\n<td data-label=\"Silence\">\"Moderately quiet\", no click (<code>key-sourcing.md<\/code>)<\/td>\n<td data-label=\"Key cost\">$21.00 switches + $11.40 sensors + $8 acrylic + $5 shipping + $0–5 adapters = <strong>≈ $45–50<\/strong><\/td>\n<td data-label=\"Verdict\">Cheaper by ≈ $5, but the sensor position is unverified and the switches are louder. <strong>Fallback<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Route\"><strong>(b) Choc V2 silent switch for feel and return + magnet in the laser-cut key top over a TO-92 SS49E on the key strip<\/strong> (the full version's approach)<\/td>\n<td data-label=\"How\">Choc V2 is a plain mechanical switch with no magnet (only a small steel spring and contacts: a fixed offset, calibrated out). A 5 × 2 mm magnet is glued into a laser-engraved pocket under the key top, <strong>beside the switch along the key's length<\/strong> (a white key top is ≈ 50–60 mm long). The SS49E <strong>stands on the key strip<\/strong> under it, with its leads trimmed so its face sits ≈ 3.5 mm below the magnet at rest. Choc V2 travel is 2.8 mm (<code>key-sourcing.md<\/code>), so the gap goes ≈ 3.5 → 0.7 mm: a large swing, likely hundreds of gauss [ENG; verify with a test key]<\/td>\n<td data-label=\"Geometry / buildability\"><strong>All through-hole.<\/strong> No PCB slots. Sensor position is free to choose, not dictated by a switch vendor. 25 analog channels on the existing CD4067s; velocity from time-of-travel between two thresholds. Power the SS49Es at 3.3 V so the output stays inside the Pico ADC range (SS49E runs from 2.7 V; confirm on the datasheet). Long tops on a single stem may rock, so the design team needs to guide or stabilise them<\/td>\n<td data-label=\"Silence\"><strong>Quietest<\/strong>: dampened switch, contactless sensing<\/td>\n<td data-label=\"Key cost\">$17.50 switches + $11.40 sensors + ≈ $8 magnets (ESTIMATE; <a href=\"https://themagnetbaron.com/products/10-3-16-x-1-16-disc-super-strong-rare-earth-magnets-neodymium-n35-nicuni\" rel=\"noopener\" target=\"_blank\">Magnet Baron $15.99/50<\/a> sold out) + $8 acrylic + $5 shipping + $0–5 adapters = <strong>≈ $50–55<\/strong><\/td>\n<td data-label=\"Verdict\"><strong>Recommended<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Route\">(c) Dual-contact conductive-rubber strips, timed by the Pico<\/td>\n<td data-label=\"How\">Dual-contact (note + velocity) 12-note rubber strips are sold as <strong>spare parts for specific keyboards<\/strong> (e.g. a Korg/Kurzweil-family 12-note strip, price not shown: <a href=\"https://www.keyboardkountry.com/key-contact-strip-12-notes-for-triton-le-studio-88-extreme-88-some-pa-series\" rel=\"noopener\" target=\"_blank\">Keyboard Kountry<\/a>)<\/td>\n<td data-label=\"Geometry / buildability\">Contact pitch matches <em>that<\/em> keyboard (full-size octave ≈ 164 mm; our octave is ≈ 131 mm), so it doesn't fit our key pitch. Needs an interdigitated contact PCB and key levers that press the domes. It is also close to the \"harvested keybed\" route the owner ruled out<\/td>\n<td data-label=\"Silence\">Good (rubber)<\/td>\n<td data-label=\"Key cost\">Unknown<\/td>\n<td data-label=\"Verdict\"><strong>Not recommended<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Route\">(c′) Two switches per key at different heights<\/td>\n<td data-label=\"How\">—<\/td>\n<td data-label=\"Geometry / buildability\">Impractical (per brief)<\/td>\n<td data-label=\"Silence\">—<\/td>\n<td data-label=\"Key cost\">—<\/td>\n<td data-label=\"Verdict\">Rejected<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>[rev 8] Superseded by <code>velocity-and-keys-v2.md<\/code> §2:<\/strong> route (b) stays, now with short tops (no rocking), K&amp;J D31 magnets at a 5.6 / 2.8 mm rest/bottom gap (magnet face 7.6 mm above the strip at rest), flat sensors and the LDO counted. RAIL/FLOAT/COMB are out (owner: \"I don't want to build custom keys\"). Gateron route (a) remains the fallback.<\/p>\n<p><strong>Recommendation (rev 6): (b), Choc V2 silent + key-top magnet + standing TO-92 SS49E.<\/strong> It is through-hole only, the quietest of the three, uses the same sensing as the full version (one firmware), and lets us set the sensor geometry ourselves.<\/p>\n<p><strong>Before ordering the board:<\/strong> buy 2 Choc V2 + 2 Gateron low-profile Hall switches + 5 SS49E (≈ $8) and measure both setups on perfboard. If (a)'s flat-in-slot sensor reads well, it saves ≈ $5.<\/p>\n<p><strong>Rev 7 corrections (2026-11-12, <code>keys-answers.md<\/code>). These apply to every Hall route, including RAIL:<\/strong>\n- <strong>Gap.<\/strong> A 5 × 2 mm N35 magnet gives ≈ 2,100 G at a 0.7 mm gap. The SS49E at 3.3 V is linear only to ≈ 650–760 G. Use a <strong>bottom gap of ≈ 2.8 mm and a rest gap of ≈ 5.6 mm<\/strong> (≈ 470 G, ≈ 530 counts of swing). N52 gains nothing.\n- <strong>Orientation.<\/strong> The <strong>SS49E lies flat, face up<\/strong> (leads bent 90°), not standing: it senses the field perpendicular to its branded face.\n- <strong>Power.<\/strong> 25 sensors draw 150–250 mA at 3.3 V, so strip C gets <strong>its own 3.3 V LDO<\/strong> (≈ +$0.50); the Pico's 3V3 pin is limited to &lt; 300 mA. <strong>[rev 8]<\/strong> Part: LD1117V33 TO-220 from 5 V. Worst case 0.43 W, no heatsink. ≥ 10 µF output cap (UNVERIFIED). Now counted in the keys row. LiPo runtime ≈ 3.5–5 h if v1.2's power budget excluded the sensors (<code>velocity-and-keys-v2.md<\/code> §2.4).\n- <strong>Velocity.<\/strong> Use a least-squares slope fit on linearised depth. Scan at ≥ 4 kHz per key (≈ 8–10 kHz is possible).\n- ~~<strong>Velocity CV.<\/strong> Velocity has no CV destination yet: both MCP4822s are full.~~ <strong>[rev 8]<\/strong> Solved without a DAC: a PWM CV into the spare AS3360 half scales the loudness contour, and the filter gets a firmware offset on CUTOFF (<code>velocity-and-keys-v2.md<\/code> §1).<\/p>\n<h2>v1.5 Bend/mod (rev 5): cheapest bought options, incl. mini joysticks<\/h2>\n<p><strong>Electrical confirmation [ENG].<\/strong> Bend and mod both go through the Pico's ADC, via 2 channels of the CD4067 muxes (35 of 48 used; a second stick would use 37).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis<\/th>\n<th>How it works<\/th>\n<th>Extra parts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Axis\"><strong>X = pitch bend<\/strong><\/td>\n<td data-label=\"How it works\">Added digitally to the VCO pitch values before the MCP4822s, as the rev 1 strips did<\/td>\n<td data-label=\"Extra parts\">None. Spring-to-centre is mechanical on these sticks<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Axis\"><strong>Y = mod depth<\/strong><\/td>\n<td data-label=\"How it works\">Little D's mod path is analog (osc 3/noise → MOD MIX → OSC/FILTER MOD). A Pico-read controller needs a <strong>voltage-controlled depth stage<\/strong>. Adopt the full version's <strong>E1 design<\/strong>: an <strong>AS3360<\/strong> VCA (DIP-14) in the mod path after MOD MIX, CV from a Pico PWM + 2-pole RC, feedthrough auto-nulled at autotune (<code>answers-E1-E10.md<\/code>, <code>architecture-v2.md<\/code>)<\/td>\n<td data-label=\"Extra parts\"><strong>≈ +$5–8<\/strong> (AS3360 ≈ $4–6 UNVERIFIED per v2; TL072 half, RC, optional H11F1 mute)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>So a joystick works electrically <strong>once the AS3360 mod VCA is added<\/strong>. This was missing from rev 1–4 Little D costs. It applies to <strong>every Pico-read bend/mod option<\/strong> (sticks, SoftPots, thumbwheels).<\/p>\n<p>The only option that needs no VCA is a wheel pot wired <strong>passively<\/strong> into the mod path, as on the original. That gives up MIDI CC1 control of mod depth.<\/p>\n<p>A <strong>MOD DEPTH pot<\/strong> (9 mm pot + knob, ≈ $0.75, Tayda) gives latched mod. Firmware uses whichever of the pot or stick Y is higher, since a stick's Y snaps back.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Part<\/th>\n<th>Qty-1 price (US)<\/th>\n<th>Size / mounting<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Option\"><strong>M1. One mini analog stick<\/strong> (X bend, Y mod): the small \"guitar-tone-switch\"-sized lever<\/td>\n<td data-label=\"Part\"><strong>Adafruit #2765 Mini 2-Axis Analog Thumbstick<\/strong>: 2× 10 kΩ, self-centring<\/td>\n<td data-label=\"Qty-1 price (US)\"><strong>$2.50<\/strong> (<a href=\"https://www.adafruit.com/product/2765\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>, in stock)<\/td>\n<td data-label=\"Size / mounting\"><strong>17.5 × 17.4 × 12 mm, through-hole<\/strong><\/td>\n<td data-label=\"Notes\"><strong>Cheapest bought bend/mod.<\/strong> Pin pitch not listed (check the drawing). Sits on the main or key-strip PCB under a panel hole<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">M2. <strong>Two mini sticks<\/strong> (e.g. left = bend/mod, right = assignable: filter mod or glide)<\/td>\n<td data-label=\"Part\">2× Adafruit #2765<\/td>\n<td data-label=\"Qty-1 price (US)\"><strong>$5.00<\/strong><\/td>\n<td data-label=\"Size / mounting\">as above<\/td>\n<td data-label=\"Notes\">2 more ADC channels (37/48 used). Each extra CV destination beyond pitch needs its own CV path (PWM-CV); the second stick's targets are firmware-assignable<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">M3. Mini Joy-Con-style stick<\/td>\n<td data-label=\"Part\">Adafruit #5628, 2× 10 kΩ, self-centring<\/td>\n<td data-label=\"Qty-1 price (US)\">$5.95 each, sold in 2s (<a href=\"https://www.jameco.com/z/5628-Adafruit-Industries-Mini-Analog-Thumbstick-Similar-to-Joycon-Style_2525887.html\" rel=\"noopener\" target=\"_blank\">Jameco listing<\/a>)<\/td>\n<td data-label=\"Size / mounting\">2 mm pin pitch (not 0.1\")<\/td>\n<td data-label=\"Notes\">Smaller cap profile. Higher price<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">J1. PS2-size thumb stick, bare<\/td>\n<td data-label=\"Part\">SparkFun COM-09032, spring-return<\/td>\n<td data-label=\"Qty-1 price (US)\">$5.25 (<a href=\"https://www.sparkfun.com/thumb-joystick.html\" rel=\"noopener\" target=\"_blank\">SparkFun<\/a>)<\/td>\n<td data-label=\"Size / mounting\">Larger; pins not on 0.1\" (breakout optional)<\/td>\n<td data-label=\"Notes\">Bigger thumb surface<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">J2. PS2-size stick on a breakout<\/td>\n<td data-label=\"Part\">Adafruit #512 (with select button)<\/td>\n<td data-label=\"Qty-1 price (US)\">$5.95 (<a href=\"https://adafruit.com/products/512\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>)<\/td>\n<td data-label=\"Size / mounting\">Breakout board, 0.1\" header<\/td>\n<td data-label=\"Notes\">Easiest to wire. Centring not stated on page<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">J3. Adafruit 2-axis joystick module<\/td>\n<td data-label=\"Part\">Adafruit #245, 2× 10 kΩ, sprung<\/td>\n<td data-label=\"Qty-1 price (US)\">$9.95 (<a href=\"https://www.adafruit.com/products/245\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>, 40 in stock)<\/td>\n<td data-label=\"Size / mounting\">Larger module<\/td>\n<td data-label=\"Notes\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">(ALPS RKJXV1224005)<\/td>\n<td data-label=\"Part\">—<\/td>\n<td data-label=\"Qty-1 price (US)\">Not buyable: <strong>obsolete<\/strong>, \"restricted availability\" (<a href=\"https://www.mouser.com/ProductDetail/688-RKJXV1224005\" rel=\"noopener\" target=\"_blank\">Mouser<\/a>)<\/td>\n<td data-label=\"Size / mounting\">—<\/td>\n<td data-label=\"Notes\">ALPS RKJXM-class parts are digital (switch) sticks, not analog<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">B. SoftPot strips ×2<\/td>\n<td data-label=\"Part\">SparkFun SEN-08680<\/td>\n<td data-label=\"Qty-1 price (US)\">$17.90 (<a href=\"https://www.sparkfun.com/softpot-membrane-potentiometer-50mm.html\" rel=\"noopener\" target=\"_blank\">SparkFun<\/a>)<\/td>\n<td data-label=\"Size / mounting\">Flat<\/td>\n<td data-label=\"Notes\">Cheaper than any wheel<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">A2. Doepfer sprung pitch wheel + thumbwheel<\/td>\n<td data-label=\"Part\">—<\/td>\n<td data-label=\"Qty-1 price (US)\">≈ $29–35 incl. EU shipping<\/td>\n<td data-label=\"Size / mounting\">Wheels<\/td>\n<td data-label=\"Notes\">A passive in-circuit mod wheel could skip the VCA (no MIDI CC1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">A1. Two Doepfer wheels<\/td>\n<td data-label=\"Part\">—<\/td>\n<td data-label=\"Qty-1 price (US)\">≈ $41–47<\/td>\n<td data-label=\"Size / mounting\">Wheels<\/td>\n<td data-label=\"Notes\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ranking (with the +$5–8 mod VCA on the Pico-read options):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Total<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Option\">M1 mini stick<\/td>\n<td data-label=\"Total\">≈ $8–11<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">M2 two mini sticks<\/td>\n<td data-label=\"Total\">≈ $11–14<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">PS2-size sticks<\/td>\n<td data-label=\"Total\">≈ $11–15<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">SoftPots<\/td>\n<td data-label=\"Total\">≈ $24–27<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">Hybrid wheels<\/td>\n<td data-label=\"Total\">≈ $29–43<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">Two wheels<\/td>\n<td data-label=\"Total\">≈ $41–55<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pick for cost: M1, one Adafruit #2765 mini stick plus the MOD DEPTH pot.<\/strong><\/p>\n<h3>v1.5b Rev 7: bend springs back (one direction), mod stays put<\/h3>\n<p>Owner: \"joystick is great if we can go one direction\". <strong>Mod = a plain dial<\/strong> (stays put): the existing MOD DEPTH 9 mm pot + knob, ≈ $0.75 (Tayda).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Single-axis spring-return bend control<\/th>\n<th>Qty-1 price (US unless noted)<\/th>\n<th>Findings<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">1<\/td>\n<td data-label=\"Single-axis spring-return bend control\"><strong>True single-axis spring-return lever pot<\/strong><\/td>\n<td data-label=\"Qty-1 price (US unless noted)\"><strong>≈ $229+<\/strong>. ETI Systems J3R-I-10K, 1-axis, 10 kΩ, surface-mount rocker, <strong>$229.39<\/strong> (<a href=\"https://www.digikey.com/en/products/filter/joystick-potentiometers/82\" rel=\"noopener\" target=\"_blank\">DigiKey joystick-pot listing<\/a>). Novotechnik LS1 \"with return spring\" exists (<a href=\"https://datasheets.globalspec.com/ds/Novotechnik-U-S/ls1-series-with-return-spring/9e049a2e-ac62-41a0-81b6-351e138c96b8\" rel=\"noopener\" target=\"_blank\">datasheet listing<\/a>), price not shown, industrial class<\/td>\n<td data-label=\"Findings\">The cheap through-hole joystick pots found are all <strong>2-axis<\/strong>: Favor FJR10K (£2.71, 26°, <a href=\"https://www.digikey.co.uk/en/products/detail/favor-electronics/FJR10K-S1B10KD0/16627935\" rel=\"noopener\" target=\"_blank\">DigiKey UK<\/a>) and FJP10K (45°, <a href=\"https://www.digikey.ca/en/products/detail/favor-electronics/FJP10K-0118A/17737265\" rel=\"noopener\" target=\"_blank\">DigiKey<\/a>), marketplace sellers shipping in ≈ 14 days. Spring-return slide pots: none found at hobby prices<\/td>\n<td data-label=\"Verdict\"><strong>Out<\/strong>: only industrial parts, ≈ 100× the budget<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2<\/td>\n<td data-label=\"Single-axis spring-return bend control\"><strong>Adafruit #2765 mini stick, one axis used, gated by a slot in the laser-cut panel<\/strong><\/td>\n<td data-label=\"Qty-1 price (US unless noted)\"><strong>$2.50<\/strong> (<a href=\"https://www.adafruit.com/product/2765\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>; <a href=\"https://www.digikey.com/en/products/detail/adafruit-industries-llc/2765/6193582\" rel=\"noopener\" target=\"_blank\">DigiKey $2.50, 613 in stock<\/a>)<\/td>\n<td data-label=\"Findings\">Through-hole, 2× 10 kΩ, self-centring, 17.5 × 17.4 × 12 mm. <strong>Throw angle not published<\/strong> (DigiKey lists none; datasheet not read), so it's UNVERIFIED. <strong>Gate design [ENG]:<\/strong> a slot in the panel (or in a 1.5–3 mm Delrin gate plate under it) as wide as the stem plus ≈ 0.3 mm, as long as the full throw, at the stem height between body and cap. Fit the cap after the panel. Arcade \"restrictor gates\" work the same way. Gate loads are light thumb forces. The only wear point is the stick's plastic pivot rubbing the slot edge, so Delrin is the right gate material (low friction). Only one axis (X) is read; Y stays centred by the gate. <strong>Risk:<\/strong> DigiKey calls the actuator a \"puck\"; if the cap slides rather than tilts on a stem, a slot can't capture it. Check one part in hand before cutting the panel<\/td>\n<td data-label=\"Verdict\"><strong>Recommended<\/strong>: cheapest, and it gives the owner's one-direction spring-back stick<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2′<\/td>\n<td data-label=\"Single-axis spring-return bend control\">SparkFun COM-09032 thumb joystick, gated the same way<\/td>\n<td data-label=\"Qty-1 price (US unless noted)\"><strong>$5.25<\/strong> (<a href=\"https://www.sparkfun.com/thumb-joystick.html\" rel=\"noopener\" target=\"_blank\">SparkFun<\/a>), spring-return<\/td>\n<td data-label=\"Findings\">Bigger PS2-style lever with a clear stem, so it's easier to gate, but its pins are not on a 0.1\" grid<\/td>\n<td data-label=\"Verdict\">Backup if #2765 can't be gated<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">3<\/td>\n<td data-label=\"Single-axis spring-return bend control\"><strong>Spring-return rotary pot<\/strong><\/td>\n<td data-label=\"Qty-1 price (US unless noted)\">None found at qty 1<\/td>\n<td data-label=\"Findings\">Center-<em>detent<\/em> pots exist (e.g. a 9 mm center-detent pot at <a href=\"https://stompboxparts.com/potentiometers/9mm-potentiometer-center-detent\" rel=\"noopener\" target=\"_blank\">Stompbox Parts<\/a>), but a detent clicks to centre, it doesn't spring back. The cheapest real sprung rotary control is the <strong>Doepfer wheel kit<\/strong> (pot + return spring), <a href=\"https://schneidersladen.de/en/doepfer-mod-wheel-single-wheel-diy-kit\" rel=\"noopener\" target=\"_blank\">€15 incl. VAT<\/a>, ≈ $27–33 with EU shipping<\/td>\n<td data-label=\"Verdict\">Wheel fallback<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Locked bend/mod (cost):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Part\"><strong>#2765 mini stick, slot-gated to one axis (bend, springs back)<\/strong><\/td>\n<td data-label=\"Cost\">$2.50<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>MOD dial<\/strong> (stays put)<\/td>\n<td data-label=\"Cost\">$0.75<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>AS3360 mod VCA<\/strong> (needed because the dial is Pico-read, for MIDI CC1)<\/td>\n<td data-label=\"Cost\">$5–8<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\"><strong>Total<\/strong><\/td>\n<td data-label=\"Cost\"><strong>≈ $8.25–11.25<\/strong> (unchanged from rev 5)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Optional cut: wire the MOD dial <strong>passively<\/strong> into the analog mod path, as on the original, and skip the VCA. That saves <strong>$5–8<\/strong> with no sound loss, but mod depth is then not MIDI-controllable. <strong>[rev 8] The cut no longer removes the AS3360:<\/strong> its half B now carries velocity → loudness, so the saving falls to ≈ $0.<\/p>\n<h2>v1.6 Internal battery: in or out<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>USB power bank (out)<\/th>\n<th><strong>Internal LiPo (in), recommended<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Parts<\/td>\n<td data-label=\"USB power bank (out)\">$0 (owner's bank or charger)<\/td>\n<td data-label=\"Internal LiPo (in), recommended\"><strong>Adafruit bq25185 USB-C charger + 5 V boost #6106, $8.95<\/strong>, with load-sharing (plays while charging), 1 A boost (<a href=\"https://www.adafruit.com/product/6106\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>) + <strong>2000 mAh LiPo #2011, $12.50<\/strong> (<a href=\"https://adafruit.com/products/2011\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>) = <strong>$21.45<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>[rev 11] Cells<\/strong><\/td>\n<td data-label=\"USB power bank (out)\">n/a<\/td>\n<td data-label=\"Internal LiPo (in), recommended\"><strong>2 × 50 × 60 mm pouch, 1S2P, one JST-PH each, joined by a Y-harness:<\/strong> PiShop 755060 3000 mAh 7.5 mm $15.95 ea (<strong>$31.90<\/strong>, 22.2 Wh) or Adafruit #328 2500 mAh 7.3 mm $14.95 ea (<strong>$29.90<\/strong>, 18.5 Wh, in stock). With bq25185 #6106 $8.95: <strong>$40.85 / $38.85<\/strong>. Details, links, safety: <code>battery.md<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>[rev 12] FOLD band cells<\/strong><\/td>\n<td data-label=\"USB power bank (out)\">n/a<\/td>\n<td data-label=\"Internal LiPo (in), recommended\"><strong>4 × PiShop 952540, 9.5 × 25 × 40 mm, 750 mAh, PCM, JST-XH, $7.95 ea, in stock<\/strong> ($31.80, 11.1 Wh, 1S4P); star harness with a 2 A fuse, optional ≈ 1 A PTC per cell lead; XH→PH adapter; <strong>$40.75<\/strong> with #6106; runtime ≈ 4.5 h / 2.4 h; charge ≈ 3.3 h at 1 A. Thickness 9.5 is at the band limit: measure one first. <code>fold-answers.md<\/code> §1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Runtime<\/td>\n<td data-label=\"USB power bank (out)\">Depends on the bank<\/td>\n<td data-label=\"Internal LiPo (in), recommended\">~~≈ 5–7 h at 1.0–1.5 W [ENG]~~ <strong>[rev 10] ≈ 1.8–3.3 h at 2.0–3.6 W<\/strong> (single #2011). <strong>[rev 11] 1S2P 6000 mAh: ≈ 4.7–9 h; 1S2P 5000 mAh: ≈ 3.9–7.5 h; charge ≈ 6–7 h at the default 1 A.<\/strong> ~~A 3000 mAh 7.5 × 50 × 60 pouch (PiShop 755060; size UNVERIFIED) fits under the flat concepts' board: ≈ 2.7–5 h~~<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Caveats<\/td>\n<td data-label=\"USB power bank (out)\">Banks may auto-off at low draw; there's a cable hanging off it<\/td>\n<td data-label=\"Internal LiPo (in), recommended\">The boost \"stalls above ≈ 200 mA when a high-current load switches on instantly\" (Adafruit page), so the ±12 V converters need soft-start: an RC on the MC34063s, plus Pico-sequenced LM386 enable. It also means <strong>two USB ports<\/strong>: USB-C to charge, micro-USB on the Pico for MIDI. Option [ENG]: feed the Pico's VBUS into the charger's 5–18 V DC pads, so the Pico port charges too<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">\"Completely portable\"<\/td>\n<td data-label=\"USB power bank (out)\">Not really<\/td>\n<td data-label=\"Internal LiPo (in), recommended\"><strong>Yes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Recommendation: in.<\/strong> It costs ~~
