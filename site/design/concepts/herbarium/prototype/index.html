ard.<\/li>\n<li><strong>F11 Label:<\/strong> embroidered names and numerals on the skin before it's blocked? No: embroidery stretches when blocked. <strong>Embroider after blocking<\/strong>, by hand, or laser-brown the skin on the shell (the shell is flat on top). Scales on the printed tags.<\/li>\n<\/ul>\n<h2>R4 check<\/h2>\n<p>Felt deck = panel 25.5; tags flush in the felt; nothing among the knobs; no separator between pegs and knobs (the PLAY row starts 9.25 mm behind the sharp heads) ✓.<\/p>\n<h2>Cost (ESTIMATE)<\/h2>\n<p>Shell ≈ 160 cm³ ≈ 200 g ≈ $4–5; binding ring + tags ≈ $1; inserts ≈ $3; back panel $2–4; pegs + arms $4–8; <strong>skin: hood $15–35 (UNVERIFIED) or F3 12 × 24 in ≈ $25–30<\/strong>; collars from an offcut. <strong>≈ $30–55<\/strong> (the felt is most of it). Build ≈ 10–12 h printing + ≈ 4–5 h (blocking and drying ≈ 1 h hands-on plus overnight).<\/p>\n<h2>Open questions<\/h2>\n<ul>\n<li><strong>Maker/test:<\/strong> the corner blocking test (hood vs F3). Decides the default skin.<\/li>\n<li><strong>Sourcing:<\/strong> a grey wool capeline big enough (≈ 400 × 250 flat-equivalent) and its thickness (UNVERIFIED).<\/li>\n<li><strong>Eng:<\/strong> with pegs centred over stems (E-L5's \"best\" case) strip C runs y ≈ 8–56, and the main board starts at y ≈ 58: confirm the two boards fit side by side at that line (E-L9).<\/li>\n<li>Bushing height through the felt: a 9 mm pot's bushing (≈ 5 mm) must clear 2.5 shell + tag; confirm with the pot in hand.<\/li>\n<\/ul>", "lead": "Kind: a material. Pole: sauce. Rev 6, 2026-11-12 (concept round 4). Printed shell + wool felt only (the ply tray is retired). Read with ../common-how-it-works.md (rev 6) and ../../jobs.md.", "jump": ["The idea", "Design principles (each follows from the idea)", "Keys: maple pegs on Choc V2 silent", "Body", "The felt: how it wraps seamlessly", "Build and service (common §5, with these differences)", "Wear plan", "States", "Flows that differ from common", "R4 check", "Cost (ESTIMATE)", "Open questions"], "code": "D-013", "group": "HUSH"}, "D-015": {"kind": "doc", "sub": "doc", "title": "ONE SHEET · how it works", "stage": "Lock", "status": "locked in v1.1", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "versions/v1.1/one-sheet/how-it-works.md", "html": "<h1>ONE SHEET: how it works (systems)<\/h1>\n<p>Kind: <strong>an economy<\/strong>. Pole: designed for use / cost logic. <strong>Rev 4, 2026-11-12 (concept round 4).<\/strong> Printed only (the ply version is retired; its record is in rev 3's history). Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> (<strong>rev 6<\/strong>) and <code>../../jobs.md<\/code>.<\/p>\n<blockquote>\n<p><strong>Rev 7.4: PARA legend fits by mirroring AFTERTOUCH's<\/strong> (labels can't stack 3 deep there).\n- <strong>Name:<\/strong> \"PARA\", <strong>left-aligned 5.6 mm to the RIGHT of the toggle<\/strong>, in the strip between OSC 1 and OSC 2. It mirrors AFTERTOUCH's label, which sits right-aligned to the left of its own toggle.\n- <strong>Positions:<\/strong> shortened to <strong>1 · P · 4<\/strong> (MONO / PARA / PARA+4). These are the only words that change.\n- <strong>ONE SHEET:<\/strong> that strip is ≥ 8 mm tall across x 114–123 [CALC], so it takes two lines of 1.37 caps: \"PARA\" over \"1 · P · 4\".\n- <strong>HUSH:<\/strong> the tags narrow it to 4.3–5 mm, so there's room for one line only. \"1 / P / 4\" is pressed as three 1.2 mm glyphs stacked at the toggle's three throw heights (y 109 / 111.5 / 114), right beside it, and \"PARA\" follows at x ≈ 119.5–124.5 on y 111.5.<\/p>\n<p><strong>Rev 7.3 (pre-build, 2026-11-13): switch pair.<\/strong>\n- <strong>AFTERTOUCH confirmed where the visual designer placed it:<\/strong> VELOCITY's column, y 111.5, between the VOICE rows (FILTER MOD / AFTERTOUCH / VELOCITY). The two key-response switches stack.\n- <strong>Its empty mirror slot is now filled by the new PARA toggle (3-way MONO / PARA / PARA+4)<\/strong> at the oscillator-side switch column, y 111.5 (OSC MOD / PARA / OSC 3 CTL). ONE SHEET x 104.25, HUSH x 111.25; AFTERTOUCH ONE SHEET 171.75, HUSH 178.75.\n- <strong>Why:<\/strong> PARA decides how the keys are assigned to the oscillators, so it sits with the oscillator switches. AFTERTOUCH is how the keys respond, so it sits with VELOCITY. They mirror about the centre.\n- Checkers 0 violations, mirror 0.00.\n- <strong>Legend check (visual):<\/strong> PARA's three position words need the same treatment as AFTERTOUCH's label (right-aligned, left of the toggle). OSC MOD and OSC 3 CTL labels go above their toggles, mirroring VELOCITY and SOURCE.<\/p>\n<p><strong>Rev 7.2 / DRIFT (2026-11-13). Supersedes 7.1's PLAY-right and back-row text.<\/strong> Owner: \"I like the idea of drift, but I'd want it to be controllable\". DRIFT is a firmware random pitch wander; fully left = rock-steady.\n- <strong>Back row = the chain in one line<\/strong>, mirrored about the centre:\n  - <strong>DRIFT 74.5<\/strong> (source, under the FREQ column)\n  - ECHO TYPE 103.5 · ECHO TIME 123.5\n  - REVERB DECAY 152.5 · REVERB TYPE 172.5\n  - <strong>VOLUME 201.5<\/strong> (out, under the loudness column)\n  - Breaks at 89 / 138 / 187.\n- <strong>PLAY right:<\/strong> ECHO REPEATS 194 · ECHO MIX 214 · REVERB MIX 234 · <strong>TAP 256<\/strong>. TAP is played in rhythm, and it mirrors the bend stick.\n- <strong>Why:<\/strong> one added knob makes the count odd, so a lone DRIFT can't be mirrored. <strong>DRIFT ↔ VOLUME<\/strong> pairs source with output; TAP moves to the PLAY row to keep that row at 4 + 3 + 4. The checkers pass with 0 violations and mirror 0.00 in every row.\n- <strong>Cost:<\/strong> VOLUME sits on the back row (≈ 78 mm behind the PLAY row), and TAP is away from TIME. Sizes are unchanged.<\/p>\n<p><strong>Rev 5.1 (round 5 final):<\/strong>\n- <strong>Layout:<\/strong> common rev 7.1. PLAY right = REPEATS, ECHO MIX, REVERB MIX, VOLUME. FX row y 146 = ECHO TYPE, TIME | TAP | DECAY, REVERB TYPE.\n- <strong>Body 276 × 180.<\/strong> No side-wall wheel, no wall toggle.\n- <strong>Bay<\/strong> x 20–150, y 110–176.\n- <strong>Rings:<\/strong> round all 21 rotary controls, including the two TYPE rotaries. TAP is a plain smooth surround.\n- The rest of rev 5 stands (key edge A/B, two finishes).<\/p>\n<p><strong>Rev 5 (round 5, 2026-11-13). Supersedes the layout, finish and front-edge text below.<\/strong>\n- <strong>Layout and FX:<\/strong> common rev 7, the shared balanced layout.\n  - PLAY: PITCH | FILTER | FX (ECHO TIME 194, REPEATS 214, REVERB 234, FX MIX 256).\n  - VOLUME is a thumbwheel in the right wall; the FX MODE toggle sits on the rear wall.\n  - Body ≈ 276 × 178 (ESTIMATE, FX board area). The battery bay moves back with the board: x 20–150, y 108–174.\n- <strong>Finish: only two (owner loves the rings).<\/strong> The ±45° per-section sheen is retired.\n  - <strong>Rings:<\/strong> concentric first-layer rings round <strong>every rotary control<\/strong>: all knobs, CUTOFF and the stick's round gate. Outer radius <strong>9.25<\/strong> at 20 pitch (1.5 mm of smooth between neighbours, ≈ 2 mm showing past the knob skirt), and <strong>12.5 round CUTOFF<\/strong>. Rings stop 1 mm short of any toggle hole or LED.\n  - <strong>No texture:<\/strong> everything else (the face, the rear band, round the toggles and lights, the key-window border).\n  - <strong>Sections read by the flush break grooves (x 96.5 / 179.5, y 85.4) and the black section names<\/strong>, not by sheen.\n  - The director's coupon gets simpler: two patches, smooth and rings.\n- <strong>Key edge, two options<\/strong> (panel 24; whites <strong>26.5<\/strong>, sharps <strong>28.5<\/strong>; pressed whites 23.5):\n  - <strong>A, at the edge, no lip:<\/strong>\n    - The key window opens to the front between the end walls (x 3–273).\n    - Each white top has a <strong>3 mm front skirt<\/strong>. The key's front face sits 0.3 behind the front face plane; the skirt spans z 21.5–26.5 at rest.\n    - The shell's front wall under the keys drops to <strong>z 17.5<\/strong> (1 mm clear at full press).\n    - <strong>Front section:<\/strong> wall 0–17.5 → a 4 mm shadow slot (3 travel + 1) → key skirt and top 21.5–26.5. The end walls stay at 24.\n  - <strong>B, small lip:<\/strong>\n    - The front wall (y 0–2.4) rises to <strong>z 25.5<\/strong> (1 below the key surface), with an R 1.2 top.\n    - Key fronts sit at y 3, 0.6 behind it; no skirt.\n    - The keys stand 1 mm over the lip at rest and drop 2 below it at full press. The lip guards the key fronts in a bag.\n  - <strong>Both:<\/strong> body height and knob tops unchanged; the strip C spacers are 2.5 taller.<\/p>\n<p><strong>Rev 4.2: internal battery bay (owner: \"What do you mean there's no battery … we are designing this\").<\/strong>\n- <strong>Bay:<\/strong> x 20–150 × y 100–166, z 1.5–12.9 (<strong>130 × 66 × 11.4 clear<\/strong>). It sits under the main board at the rear-left, under the VOICE oscillators and the rear band, clear of the speaker.\n- <strong>Holds:<\/strong> 2 pouch cells of ≤ 9.9 thick × 50 × 60 (e.g. 2 × 3000 mAh ≈ 22 Wh, ≈ 5–10 h at eng's 2.2–4.2 W; cell choice and wiring with eng).\n- <strong>The height:<\/strong> 1.5 mm comes from a pocket in the back panel; the board's underside has a lead-free keep-out over the bay.\n- <strong>Why not under the keys:<\/strong> under strip C there's only ≈ 6.5 mm.\n- <strong>Access:<\/strong> the cells strap to the back panel's inner face on JST leads. Back panel off (8 screws underneath) → unplug → swap.<\/p>\n<p><strong>Rev 4.1 (eng round 4):<\/strong>\n- <strong>276 × 170<\/strong> (was 140). The main board needs ≈ 268 × 115, so the body grows behind the back row. Keys and rows are unchanged.\n- The rear band (y ≈ 138–167, flush) carries the name and the jack legends.\n- Knobs: 18T push-on on T18 pots (common rev 6.1).\n- Print: one piece needs a ≥ ≈ 285 × 180 bed (Voron 350); the split at x 122.5 gives 122.5 × 170 and 153.5 × 170, both ✓ on a 250 × 210 bed.\n- Filament ≈ +20 %, ≈ $5–6.<\/p>\n<\/blockquote>\n<p><strong>What changed in rev 4 (owner):<\/strong>\n- Keys to the front edge, knobs logically split (common rev 6 PLAY row + VOICE), narrower: <strong>298 × 180 → 276 × 140<\/strong>.\n- <strong>Unibody:<\/strong> \"the controls are installed from behind and then a panel screwed in on the back\". One closed-top shell, everything loaded from underneath, a back panel screwed on from underneath, <strong>no fastener on the top or walls<\/strong>. (Rev 3 had a visible seam and M3 screws on the face.)\n- No sleeve or case work this round (owner: \"Let's not worry about a case\").<\/p>\n<h2>The idea<\/h2>\n<p>The economy concept: <strong>the enclosure is as few prints as the printer allows, in one filament with one swap, and the toolpath is the finish<\/strong> (the face is printed face down; the first-layer direction turns per section, so sections read by sheen at $0, visual round 3). Rev 4 adds the owner's unibody: <strong>one shell, one face, opened only from behind.<\/strong><\/p>\n<h2>Design principles (each follows from the idea)<\/h2>\n<ol>\n<li><strong>One face, split only where the panel already breaks.<\/strong> One piece where a big enough bed exists; otherwise one joint at x = 122.5, the one break that runs through the whole panel, sitting at the bottom of the break groove. <em>Because<\/em> in an economy you don't add a line the drawing doesn't already have.<\/li>\n<li><strong>The toolpath is the finish.<\/strong> First-layer direction ±45° per section, rings under each knob (visual r3). <em>Because<\/em> the nozzle draws every line anyway; choosing its direction costs nothing. (Director: still needs the test coupon.)<\/li>\n<li><strong>Face down on smooth steel.<\/strong> <em>Because<\/em> the first layer is FDM's best surface, and it's where the legends and the finish happen.<\/li>\n<li><strong>One filament, one swap.<\/strong> Legends as cut-outs in the first 0.6 mm, filled dark by one change. <em>Because<\/em> no second process.<\/li>\n<li><strong>Opened from behind.<\/strong> Every fastener is underneath (one M3 size into brass inserts); the top carries only controls. <em>Because<\/em> the owner asked, and a kit that opens from the back keeps its face whole and reprintable.<\/li>\n<\/ol>\n<h2>Structure<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\"><strong>Outer<\/strong><\/td>\n<td data-label=\"Spec\"><strong>276 × 170<\/strong> (rev 4.1), top face at <strong>24<\/strong>; knob tops ≈ 37.5 with 18T push-on knobs; feet 6 under the back panel<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Edges<\/td>\n<td data-label=\"Spec\">outer vertical corners R 6 in plan; top edge R 2 (the print starts on this edge: a small radius prints clean face down); bottom edge plain (sits on the back panel)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Shell<\/strong><\/td>\n<td data-label=\"Spec\">one printed body: top face 2.5 solid, walls 2.4, 2 mm ribs under the face between rows (y 85.4 and between VOICE rows at y 111.5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Key window<\/td>\n<td data-label=\"Spec\">x 3–273, y 3–49.5. The front wall (y 0–2.4) stands flush with the white key surface (24): the only thing in front of the keys<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Holes<\/td>\n<td data-label=\"Spec\">pot bushings 7.5, toggles 6.5, stick slot (fore-aft) at (20, 68), LED holes; pot anti-rotation slots 1 mm deep in the underside<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Back panel<\/strong><\/td>\n<td data-label=\"Spec\">276 × 140 laser-cut 3 mm ply (or printed in 2), <strong>8 × M3 from underneath<\/strong> into inserts in the shell's bottom rim; speaker grille holes at (240, 113); feet; keyhole slot (J18)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Boards<\/td>\n<td data-label=\"Spec\">main board <strong>≈ 268 × 115<\/strong> (eng), y ≈ 52–167; strip C under the keys; I/O board inside the rear wall (common §4–5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Jacks, power<\/td>\n<td data-label=\"Spec\">I/O board, rear wall x 150–270; jack barrels flush in the wall, no outside nuts<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Battery<\/td>\n<td data-label=\"Spec\">on a strap on the back panel's inner face, under the main board's lead-free keep-out<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Layout:<\/strong> common rev 6 exactly (ONE SHEET is the common frame). Sections are separated by 0.6 × 1.2 mm sunk grooves on the break lines (flush, R4): x 122.5 full depth, y 85.4 full width, x 228 (PLAY), x 181 (VOICE).<\/p>\n<h2>Print<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\"><strong>Default if Vector Space's Voron is the 350<\/strong> (UNVERIFIED)<\/td>\n<td data-label=\"Spec\">shell in <strong>one piece<\/strong>, face down<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">TAZ 6 (280 × 280, UNVERIFIED)<\/td>\n<td data-label=\"Spec\">fits with ≈ 2 mm a side and no brim: marginal. Try only with a skirt-less, brim-less profile<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Prusa beds (≈ 250 × 210)<\/strong><\/td>\n<td data-label=\"Spec\"><strong>2 parts at x = 122.5<\/strong>: left 122.5 × 140, right 153.5 × 140 ✓. The joint sits in the break groove on the face; a 10 mm internal lap + 3 × M3 from inside; the back panel spans it. On the walls it shows as a short line on the front wall (under the key fronts) and on the rear wall<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Orientation<\/td>\n<td data-label=\"Spec\">face down on smooth PEI (the finish needs smooth, not textured), walls up, no supports. Jack holes are in the I/O board's wall cut-outs: model them teardrop-topped<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Legends<\/td>\n<td data-label=\"Spec\">layers 1–3 (0.6 mm) cream with legends cut out; M600 swap to the dark colour at layer 4<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">First-layer direction<\/td>\n<td data-label=\"Spec\">slicer modifiers per section (±45°) and per knob ring (UNVERIFIED in PrusaSlicer, director's coupon)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Inserts<\/td>\n<td data-label=\"Spec\">M3 heat-set ≈ 25: main board 10, strip C 4, I/O board 2, back panel 8, (split only) +3 lap<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Filament [CALC, ESTIMATE]<\/td>\n<td data-label=\"Spec\">face ≈ 276 × 140 × 2.5 ≈ 97 cm³ less holes ≈ 85; walls ≈ 2 × (276 + 140) × 2.4 × 21 ≈ 42; ribs/bosses ≈ 15 → ≈ 142 cm³ ≈ <strong>175–185 g ≈ $4–5<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Print time<\/td>\n<td data-label=\"Spec\">≈ 9–11 h (ESTIMATE)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>Form<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">Play<\/td>\n<td data-label=\"Form\">as is, on its feet<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Carry<\/td>\n<td data-label=\"Form\"><strong>not designed this round<\/strong> (owner: no case work yet); any bag or laptop sleeve<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Keep it out (J18)<\/td>\n<td data-label=\"Form\">keyhole slot in the back panel<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Opened (service)<\/td>\n<td data-label=\"Form\">back panel off; the face stays whole on the table, face down on a towel<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Flows that differ from common<\/h2>\n<ul>\n<li><strong>F1 Grab and play:<\/strong> out of the bag, on the table, power (rear wall), status light, play. Nothing to open.<\/li>\n<li><strong>F2 / F3:<\/strong> common rev 6 (reach 120 mm).<\/li>\n<li><strong>F4 Keep a patch:<\/strong> a printed card the size of the top face; no built-in place (inferred job, stated).<\/li>\n<li><strong>F9 Build:<\/strong> common §5 assembly order; print 1 or 2 parts.<\/li>\n<li><strong>F10 Service:<\/strong> common §5. A cracked shell is reprinted from the 3MF; part name, revision and date are printed inside the face (the file is the drawing).<\/li>\n<li><strong>F11 Label:<\/strong> all machine marks by the filament swap; hand marks optional.<\/li>\n<\/ul>\n<h2>R4 check<\/h2>\n<p>Keys 24 (sharps 26), face 24, flush front wall at 24, no rails or rims, sunk grooves only ✓.<\/p>\n<h2>Cost (ESTIMATE)<\/h2>\n<p>Filament $4–5 + inserts ≈ $2.5 + back panel (ply) $2–4 + screws $1 → <strong>≈ $10–13<\/strong>. Still the cheapest of the three.<\/p>\n<h2>Open questions<\/h2>\n<ul>\n<li><strong>Vector Space:<\/strong> is the Voron the 350, and is the TAZ 6 bed 280? (Decides one piece vs two.)<\/li>\n<li><strong>Director's coupon<\/strong> (toolpath sheen) still stands; rev 4 doesn't change it.<\/li>\n<li>E-L9 (main board ≈ 268 × 85).<\/li>\n<\/ul>", "lead": "Kind: an economy. Pole: designed for use / cost logic. Rev 4, 2026-11-12 (concept round 4). Printed only (the ply version is retired; its record is in rev 3's history). Read with ../common-how-it-works.md (rev 6) and ../../jobs.md.", "jump": ["The idea", "Design principles (each follows from the idea)", "Structure", "Print", "States", "Flows that differ from common", "R4 check", "Cost (ESTIMATE)", "Open questions"], "code": "D-015", "group": "ONESHEET"}, "D-109": {"kind": "doc", "sub": "doc", "title": "CATHEDRAL · how it looks and feels", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "design/branches/concepts/cathedral/how-it-looks-and-feels.md", "html": "<h1>CATHEDRAL: how it looks and feels (visual, rev 3)<\/h1>\n<p>Seed: CHAMBER rev 2 (<code>../chamber/<\/code>) + FOLD-105 v1.1. Owner, 14:12–14:41 (<a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>). Read with <a href=\"#i-D-110\"><code>how-it-works.md<\/code><\/a> (systems), which owns hinges, feet, plate radii, the slot, options A / B, and the key carrier and no-machining parts in §10–11. The director's steer 1 (<code>design/notes/director.md<\/code>) is applied here.<\/p>\n<p><strong>Rev 3, 2026-11-13.<\/strong> Rev 2 brought real-part keys, no spine, the confirmed fine-line texture and brass as the one metal. Rev 3 applies the director's team rulings:\n- <strong>Built into the model now<\/strong> (<code>design/concepts/_mock-src/rb.py<\/code>, class <code>Cathedral<\/code>): R 7.7 on all eight plate corners; screw-through feet at the corner screws with the axis screws flush brass; tapered-slot grilles (vesica in A, Ø 27 circle in B); the \"effects\" heading in A; <strong>the woody fine-line texture as real shallow grooves<\/strong> (§4); brass as the only visible metal; the five-colour palette; no spine. Defaults: keys B, no spine.\n- <strong>Brass shown as metal<\/strong> (ruling 9): a new ray-traced study replaces rev 2's flat-yellow key grid (§1).\n- <strong>Option B labels fixed<\/strong> (systems' check): TIME and REPEATS legends behind their knobs; \"free\" / \"sync\" 1.5 mm behind the toggle centre (0.5 left \"free\" 0.64 mm from FREQ 3). <code>branch_check.py<\/code>: A 0, B 0, TOTAL fails 0.\n- <strong>Final views are not re-rendered yet:<\/strong> they wait for the owner's layout answer (coordinator). The rev 1 renders below are marked where they're stale.<\/p>\n<h2>What CATHEDRAL does to the ideas<\/h2>\n<p><strong>One sentence: a small cathedral, an organ front for the listener, a nave for the hands, and the wood's own arches.<\/strong> It answers several of his notes at once:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>His note<\/th>\n<th>What CATHEDRAL makes of it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"His note\">\"the screen\" should have more rounding<\/td>\n<td data-label=\"What CATHEDRAL makes of it\"><strong>The grille becomes a window.<\/strong> In A, a vesica (the pointed lens of church windows) fits the band's real room. In B, a round rose window. Both use his tapered lines: shortest at the top and bottom, longest through the middle.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His note\">fine line texture \"more woody\", but subtle, not straight woodgrain<\/td>\n<td data-label=\"What CATHEDRAL makes of it\"><strong>Cathedral grain<\/strong>: woodworkers' name for the nested arches in flat-sawn wood. The case's line texture becomes arches at about the same sparse line count. The material is already the point of view.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His note\">too many colours, the brown is out of place; \"brass … reminds me of a cathedral\"<\/td>\n<td data-label=\"What CATHEDRAL makes of it\"><strong>Black and brass, the colours of an organ console's stop knobs and its brass fittings.<\/strong> Black keys join the 30 black knobs; brass joins the brass already on the case. The keys add no colour of their own, and the brown goes.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His note\">faceplate rounding inconsistent<\/td>\n<td data-label=\"What CATHEDRAL makes of it\"><strong>Every corner arched<\/strong> (R 7.7, concentric with the walnut block): the two plates read as two rounded leaves meeting at the seam.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His note\">hidden hinges; feet one with the screws; no spine<\/td>\n<td data-label=\"What CATHEDRAL makes of it\"><strong>A case with no visible hardware<\/strong> except the brass that means something: the keys, the stays, two axis screws. Knuckles gone (side pivots), feet are the screws, no spine.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Costume watch<\/strong> (the director's rule, stricter now that the word is \"cathedral\"): no gothic tracery, no pointed arches as ornament, no stained-glass colour. The vesica appears only because it's the shape that fits the band. Every curve does a job: plate corners, window, grain, key domes.<\/p>\n<hr />\n<h2>1. Key and button colours (fewer colours, no brown, real parts)<\/h2>\n<p><strong>Every option is made from parts that exist<\/strong> (systems §10). The owner is choosing between A, B and C (brass); D, E and F (birch and printed) stay as alternatives on the same carrier, described in words only. All of them share one interface: a <strong>printed carrier<\/strong> whose top cup (Ø 9.6 × 3.3) takes a <strong>9.53 × 3.2 tenon<\/strong>, the tenon of the Cherry Tree Toys 3/8\" mushroom plug. So a bought birch plug, a cast brass head and a printed head are interchangeable on the same switches, and the choice can change after the build.<\/p>\n<p><strong>What shows under each head:<\/strong> the carrier's 2.8 mm neck (Ø 11.2) and a thin dark ring of deck hole (Ø 12.0). <strong>Print the carriers in matte black.<\/strong> The neck then reads as the hole's shadow and every head seems to float a little above the deck, like a drawknob on its stem. (A one-piece printed peg has a neck in its own colour; see option F.) The felt washers on the deck are gone: the stop moved under the deck (systems §10.2).<\/p>\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-brass-keys-metal.jpg\" width=\"1400\" height=\"915\" alt=\"\" loading=\"lazy\"><figcaption>Brass as metal, ray-traced (POV-Ray: reflections and a soft studio light, which OpenSCAD can't do). The head is drawn 4.0 tall (top at deck + 6.8) because the plug's head height isn't published yet. <b>Top left (A):<\/b> brass naturals, black sharps. <b>Top right (B):<\/b> black naturals, brass sharps (recommended). <b>Bottom left (C):<\/b> all brass. <b>Bottom right:<\/b> close up, two brass sharps between black naturals. The right one is freshly mirror-polished; the left one is unlacquered after handling: dark gold-brown on the body, bright where fingers rub the crown. The walnut and joystick are simplified in this study; it's here to judge the key materials only.<\/figcaption><\/figure>\n\n<h3>My pick: B, black naturals and brass sharps<\/h3>\n<ul>\n<li><strong>Why:<\/strong> the 15 naturals are the big field, and in black they join the knobs, so the playing side reads as one black family on cream. The 10 brass sharps become the accent, the way brass fittings sit on a dark organ console, and they repeat the case's other brass (stays, axis screws). The palette stays at <strong>walnut, cream, black, red, brass<\/strong>: five, nothing new, no brown.<\/li>\n<li><strong>It keeps the light / dark split<\/strong> a player reads by, reversed like an organ. The reversed-reading question from rev 1 stays open for him.<\/li>\n<li><strong>A (brass naturals)<\/strong> puts the loudest material in the biggest field. In the study, the bright row in front pulls the eye away from CUTOFF and the knobs. I'd only pick it if he wants the keyboard to be the hero.<\/li>\n<li><strong>C (all brass)<\/strong> is the most \"cathedral\" and the most jewellery-like. The two rows then differ only by position and height, and 25 brass domes compete with the red CUTOFF. Polished, the 25 reflections make the keyboard read as a single shining field, more jewellery box than console.<\/li>\n<li><strong>D / E (birch)<\/strong> are the cheapest real route: one pack of 50 covers both rows. Birch is pale, close to the plate's cream: under a <strong>water-based, non-ambering clear<\/strong> it stays near it, and an oil finish would turn it yellow. D's black dye covers birch's blotchiness only at full black. <strong>Honest wear note:<\/strong> dye sits in the surface, so the crown of the most-played naturals will wear pale over time. A hardwax-oil topcoat slows it down.<\/li>\n<li><strong>F (printed)<\/strong> gives exact colours: black to match the knobs, the plate's own cream filament. It feels the least like an instrument (systems §10.3: cooler, slicker, lighter, faint terraces on the dome unless it's resin-printed).<\/li>\n<\/ul>\n<h3>Brass, two ways to make it (neither is machining)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Cast brass<\/strong> (3D-printed wax, lost-wax cast by a service)<\/th>\n<th><strong>Brass-filled filament<\/strong> (printed by him)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">What it is<\/td>\n<td data-label=\"Cast brass (3D-printed wax, lost-wax cast by a service)\">Real brass. Sculpteo prints the model in wax and casts it in 80/15/5 copper/zinc/tin; finishes include raw, mirror polish and gold or black rhodium plating; min wall 0.8 mm; max 125 × 125 × 100 mm; 7–9 business days; priced on upload (not checked).<\/td>\n<td data-label=\"Brass-filled filament (printed by him)\">PLA with brass powder (e.g. colorFabb brassFill; product UNVERIFIED this session). Prints dull, polishes to a soft gold with sandpaper and metal polish by hand.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">In the hand<\/td>\n<td data-label=\"Cast brass (3D-printed wax, lost-wax cast by a service)\"><strong>Cold at first touch<\/strong>, then warms. <strong>Heavy<\/strong>: a solid head ≈ 5 g [CALC: ≈ 620 mm³ × 8.5 g/cm³]; with an open cup underneath, ≈ 2.5–3 g (ESTIMATE). A printed peg is ≈ 0.8 g.<\/td>\n<td data-label=\"Brass-filled filament (printed by him)\">Cool, not cold; warms fast. Heavier than plastic but well short of metal (density UNVERIFIED). Softer edges, a satin glow, not a mirror.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Over time<\/td>\n<td data-label=\"Cast brass (3D-printed wax, lost-wax cast by a service)\"><strong>Worn shine:<\/strong> unlacquered brass tarnishes to a dark gold-brown everywhere except where fingers rub, so the crowns stay bright, like a church door handle. Lacquered, it stays bright until the lacquer wears off the crowns. Note: an all-tarnished key reads brown, the thing he called out. Keep it handled or polish it now and then.<\/td>\n<td data-label=\"Brass-filled filament (printed by him)\">Dulls slowly; re-polish by hand. Can't take a real shine back once scratched deep.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Cost<\/td>\n<td data-label=\"Cast brass (3D-printed wax, lost-wax cast by a service)\">Per-piece service price, ×10 (B) or ×25 (C): UNVERIFIED; quote by upload.<\/td>\n<td data-label=\"Brass-filled filament (printed by him)\">Pennies of filament.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Recommendation:<\/strong> <strong>cast brass for the sharps in B<\/strong> (10 pieces; the real metal is the point), mirror-polished and left unlacquered so the crowns earn their shine. The black naturals: printed matte black heads on the same carriers, or D's black-dyed birch plugs.<\/li>\n<li><strong>If he wants both rows to feel the same in the hand:<\/strong> cast all 25 in brass and have the naturals <strong>black rhodium plated<\/strong> (1 µm). Same weight and coldness on every key. 1 µm will wear through at the crowns with play, and brass will show through the black, slowly. That's either the best thing about it or a fault: his call.<\/li>\n<li><strong>⚑ Eng / systems: key mass.<\/strong> A 2.5–5 g brass head sits on a Choc V2 silent switch. Whether that spring still returns the key briskly, and whether the extra mass changes the velocity fit, is <strong>UNVERIFIED<\/strong>. Test one cast head on one switch before ordering 10–25. The hollow-cup head (≈ 2.5–3 g) is the one to try first.<\/li>\n<\/ul>\n<h3>TAP<\/h3>\n<p>TAP keeps the rule that it's made of the key material, because it's played in rhythm like a key. With B, <strong>TAP is a brass dome<\/strong> (the same cast head, on a printed cap that fits TAP's switch; part UNVERIFIED) in its black bezel. With D / E, it's a birch plug; with F, printed cream.<\/p>\n<h2>2. A vs B (the speaker and \"effects &amp; out\")<\/h2>\n<p>Layout is systems' (option B moves controls, so it needs the director, then the owner). These are just the two looks, standing at 120°.<\/p>\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-A-standing.jpg\" width=\"1400\" height=\"1011\" alt=\"\" loading=\"lazy\"><figcaption><b>Option A:<\/b> nothing moves. The band between the voice rows carries one vesica window of tapered slots, centred on the axis. The base row's heading is corrected to \"effects\", because VOLUME left that section in rev 7.2. Echo and reverb stay split between the lid's back row and the base. <i>Rendered in rev 1: it still shows the retired spine in the joint and rev 1's keys; the stays are brass, as recommended in §7.<\/i><\/figcaption><\/figure>\n\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-B-standing.jpg\" width=\"1400\" height=\"1011\" alt=\"\" loading=\"lazy\"><figcaption><b>Option B:<\/b> the lid's top row holds every effect in one line, read as the choir: drift | echo (type, time, repeats, mix, tap) | reverb (type, decay, mix) | volume. The speaker moves to the base's right end as a round rose window on the PLAY row's own line. The lid's band is left as a quiet rest. <i>Rendered in rev 1: retired spine and rev 1's keys, as in A.<\/i><\/figcaption><\/figure>\n\n<p><strong>How each looks, my read:<\/strong>\n- <strong>A<\/strong> fixes the \"odd gap\" as a picture: the band now has one centred figure instead of a grille island. It doesn't fix the split, which is his other complaint.\n- <strong>B<\/strong> looks the most resolved: each half has one job (hands' row in front, the whole sound chain behind). The rose window fills the place the FX amounts left, and the band reads as intended rest, not leftover space. Visually, B is the better CATHEDRAL. The reach cost (FX amounts ≈ 126 mm further away) is systems' and the owner's to weigh, not a look question.\n- <strong>B labels (fixed in rev 3; <code>branch_check.py<\/code> §7 on <code>Cathedral(\"B\")<\/code>: 0 collisions):<\/strong>\n  - FREE / SYNC at (96, d 69) sat on \"osc 3 ctl\". In B the band below is empty, so <strong>the V2 row's three toggle legends (osc 3 ctl, source, velocity) move under their toggles.<\/strong>\n  - The left voice rule ends at dV2 + 5.5 so it stops short of \"sync\".\n  - Systems' check found the REPEATS legend under the toggle by 1.7 mm. <strong>TIME and REPEATS legends now sit behind their knobs<\/strong> (d + 13.05, like TIME / DECAY in A).\n  - <strong>\"free\" / \"sync\" sit 1.5 mm behind the toggle centre<\/strong> (0.5 left \"free\" 0.64 mm from FREQ 3; 1.5, 2.0 and 2.5 all check 0).\n- <strong>A, a correction to systems' §2 / §5:<\/strong> a Ø 34 round window fits the band's depth but overlaps the NOISE / EXT legend and the \"mixer\" heading. <strong>The band's real clear depth between those labels is ≈ 22 mm.<\/strong> Hence the vesica: <strong>66 × 16, centred at (143, d 37.6)<\/strong>, ring clear of both labels. Open area ≈ 700 mm² vs v1.1's 900 (−22 %, acoustics UNVERIFIED).<\/p>\n<h2>2b. The speaker, round 2 (owner: no speaker on the key side, no eye shape; \"lines going up and down\", or \"a circle and maybe not centered\")<\/h2>\n<p>Systems §14: B's single effects row stays on the lid, and the speaker stays in the lid band, where v1.1 had it (P1). Nothing else moves for the speaker. The other placements are dropped at the owner's steer: the rounded rectangle (lines run sideways) and firing through the façade (P2: muffled flat on a table, and quieter for the player).<\/p>\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-speaker-options-standing.jpg\" width=\"1400\" height=\"980\" alt=\"\" loading=\"lazy\"><figcaption><b>Left, the pipe tower:<\/b> 11 vertical slots, 2 wide at 5 pitch, lengths 8 → 18 → 8, all standing on one foot line (a gable, not a lens), centred on the axis over the speaker. <b>Right, the off-centre circle:<\/b> vertical slots tapered to a circle, Ø 25 overall with its ring, at (160, d 37), 17 mm right of the axis and still over the speaker. Below each, the same band up close. Both use layout B's effects row and keys B (black naturals, brass sharps, brass TAP). <b>The base's freed right end:<\/b> the PLAY row (pitch and filter) moves 47 mm right so it's centred on the instrument's axis, with equal margins at both ends. Brass here is a tone re-map of the OpenSCAD render, not ray-traced (see §1 for the true metal look).<\/figcaption><\/figure>\n\n<p><strong>Both fit the band.<\/strong> Label check: the tower's slot tips clear \"mixer\" by 1.68 mm and \"noise / ext\" by 1.9. The circle's ring clears every label by ≥ 1.5 only in x 158–176 (my sweep), which agrees with systems' best spot. The centre is the worst spot for a circle (≈ 19 mm max). The full model check for both, with the PLAY row centred, finds 0 collisions.<\/p>\n<p><strong>My read:<\/strong>\n- <strong>The tower<\/strong> answers \"lines going up and down\" most directly, and it's the most CATHEDRAL: a small pipe tower inside, echoing the façade outside. It sits on the axis, so it keeps FOLD's \"everything single sits on x 143\" rule. It looks like a designed figure, not a hole. This is my pick.\n- <strong>The off-centre circle<\/strong> is calmer and smaller. Off-centre, it reads as placed on purpose, like a sound hole beside the mixer, not a target. The cost is the axis rule: it's the one single element off the centreline, and only 17 mm off, so it can look slightly mis-placed rather than clearly asymmetric. If he likes the circle, I'd keep it exactly where it is: it's the only place it fits.\n- <strong>Loudness:<\/strong> open area is the tower ≈ 290 mm² vs the circle ≈ 265, both ≈ 35–40 % below today's 440 (systems; loudness UNVERIFIED). Widening the tower's slots to 2.5 brings it to ≈ 340 [CALC: 136 mm of slot length × 2.5] with almost the same look.<\/p>\n<p><strong>What I put in the empty base end, and why:<\/strong> with the effects on the lid and the speaker out of the base, x 186–270 is empty. <strong>I'd re-centre the PLAY row on the axis<\/strong> (systems' option 2): the stick moves to x 72 and AMOUNT to 214, with the breaks and headings moving with them. The hands' row then sits centred under the choir, like the nave under the crossing, and the empty space becomes two equal margins instead of one hole.\n- <strong>Rejected:<\/strong> bringing VOLUME and TAP back to the base (option 1) undoes his \"together\" for the out control. The lozenge and lights (option 3) would be ornament filling a gap.\n- <strong>⚑ D+O:<\/strong> it moves controls. The stick ends up 47 mm further from the left end; with the keys running full width, that's still under the left hand.<\/p>\n<h2>3. The grille (\"the screen\")<\/h2>\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-grille-options-20px-per-mm.jpg\" width=\"1600\" height=\"429\" alt=\"\" loading=\"lazy\"><figcaption>Grille patterns, 20 px per mm. <b>Left:<\/b> the vesica, 66 × 16 (option A). <b>Middle:<\/b> tapered slots in a Ø 27 circle (option B). <b>Right:<\/b> concentric arcs in a Ø 27 circle, his \"circular\" alternative. All slots are 1.25 wide at 2.3 pitch.<\/figcaption><\/figure>\n\n<ul>\n<li><strong>Ruled (director): tapered slots (left / middle), his first option.<\/strong> Vesica 66 × 16 in A, Ø 27 circle in B. Concentric arcs are dropped. Both are in the model.<\/li>\n<li>They keep the v1.1 grille's language (horizontal bars) and simply round its silhouette.<\/li>\n<li>Outside, the façade is a tower of vertical pipes whose lengths rise toward the middle. Inside, the window is a stack of horizontal lines whose lengths rise toward the middle. Same rule, turned 90°. (That rhyme holds only if his own façade keeps vertical pipes; the slots stand on their own if it doesn't.)<\/li>\n<li><strong>Concentric arcs<\/strong> read more like a speaker cone and need bridges (four drawn) to hold the centre. They're more \"hi-fi\" than \"cathedral\".<\/li>\n<li>A thin warm-grey ring (the plate's rule colour) frames each window, so it reads as a window, not a hole pattern.<\/li>\n<\/ul>\n<h2>4. A woodier fine line texture, same subtlety<\/h2>\n<p><strong>Confirmed<\/strong> (owner 14:40: \"Engraving texture I meant fine line texture\"): it's the faint line texture on the walnut body. He liked how few lines there were; he wants them to read as wood. <strong>The pipe façade is a placeholder:<\/strong> he'll design the pipe lines himself, so nothing below judges the façade.<\/p>\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-closed-with-book.jpg\" width=\"1400\" height=\"816\" alt=\"\" loading=\"lazy\"><figcaption>Closed, seen from behind: cathedral grain at about the old line count (here a 2D post-process; the modelled grooves replace it in the next pass), four screw-feet at the corners (the case screws), two flush brass axis screws. <i>Rendered in rev 1:<\/i> the pipe façade is a placeholder for his own design, and <b>the spine shown is retired<\/b>; the back slot is waiting on systems' answer.<\/figcaption><\/figure>\n\n<figure><img data-done src=\"media/X-cathedral-img-cathedral-grain-detail.jpg\" width=\"1202\" height=\"602\" alt=\"\" loading=\"lazy\"><figcaption>Detail: the arches are low-contrast and spaced about as widely as the straight streaks were, so the grain stays ground under whatever figure goes on the lid back.<\/figcaption><\/figure>\n\n<p><strong>Built (director ruling 4), not deferred:<\/strong> real walnut would mean machining, so the printed walnut-tone body is the build, and the texture goes into the print.<\/p>\n<ul>\n<li><strong>What it is:<\/strong> sparse <strong>cathedral-grain arches<\/strong>, the nested arches of flat-sawn wood, as <strong>U-grooves 0.4 wide × 0.25 deep<\/strong> in the printed body, at about the old line count.<\/li>\n<li><strong>Base underside and lid back:<\/strong> 7 nested arches whose axis runs along the case's length. Their spacing opens out a little toward the outside, and the outer ones run off the edges as long, nearly straight lines, as on a real board.<\/li>\n<li><strong>The lid back leaves his façade field empty<\/strong> (x 30–256, d 8–86). The first arch's apex peeks into the right margin (x ≈ 262), and the arches' tails run out through the bands above and below the field. The grain frames his design without entering it.<\/li>\n<li><strong>Long sides:<\/strong> the arches' tails, one gentle line across the base's flat band (z 6.2–12.4), two on the lid's far wall above the I/O (z ≥ 13).<\/li>\n<li><strong>End faces:<\/strong> end grain, so two or three growth-ring arcs. The base's right end keeps its arcs at y &lt; 58, clear of USB-C and MIDI.<\/li>\n<li><strong>Printing it:<\/strong> grooves on the underside and lid back print face-down as clean first-layer channels. On the vertical sides they're cut across layer lines; at 0.25 deep they'll read softly, which is what he asked for (subtle). <strong>UNVERIFIED<\/strong> that 0.25 reads at arm's length: add a 60 × 40 groove patch to the next coupon print. If it's too faint, go to 0.35.<\/li>\n<li><strong>In the model:<\/strong> <code>Cathedral(grain=True)<\/code> draws them from the same polylines the body CAD will use (<code>arch_lines<\/code>, <code>side_lines<\/code>, <code>ring_arcs<\/code> in <code>rb.py<\/code>). The rev 1 images below used a 2D post-process instead. They show the idea, not the modelled grooves; the next render pass shows the real ones.<\/li>\n<li><strong>Real walnut, if it ever happens:<\/strong> cathedral figure is how flat-sawn boards look, so it costs nothing. <strong>Pick flat-sawn stock and run the arches along the case's length<\/strong>, apex toward the hinge. Quarter-sawn (straight) grain is what to avoid: that's his \"straight woodgrain would be too detailed\".<\/li>\n<li><strong>For his façade design:<\/strong> the lid back's free field is x 34.8–251.2 (systems §3), clear of the four corner feet; the two axis screws sit on x 143 at d 12 / 96; the two Ø 4 push-out holes (x 108 / 178, d 28.3) are fixed by the construction (CHAMBER rev 2 drew them as two pipe mouths). His design has to keep them, or tell systems if it moves them.<\/li>\n<\/ul>\n<h2>5. No spine<\/h2>\n<ul>\n<li><strong>Owner 14:40: \"I don't want a spine.\"<\/strong> It's gone from CATHEDRAL. The walnut-matched spine of rev 1 is withdrawn.<\/li>\n<li>What it was solving: closed, a 21.9 × 266 mm slot along the back shows the lid's V1 knobs 7 mm inside it (systems §6). <strong>Systems is answering that, and whether cables can run through the hinge.<\/strong> Visually, the slot is the one thing that would read as unfinished on an otherwise closed walnut block. If it stays open (the director's recommendation S1), finish it dark inside so it reads as a shadow line, not a hole. The black knobs inside then disappear into it.<\/li>\n<\/ul>\n<h2>6. Small things in every render (all ruled, all in the model)<\/h2>\n<ul>\n<li><strong>Hinges:<\/strong> systems' side pivots. A round \"ear\" at each rear corner inside the wall's thickness, with a flush walnut plug over the blind pin. The knuckles are gone. The leaves are hidden inside the walls, so their material doesn't show (see §7).<\/li>\n<li>Honest: the axis sits 1 mm behind the base's back face, so each ear still shows as a small round boss at the rear corners when closed, quieter than a knuckle.<\/li>\n<li><strong>Feet:<\/strong> four screw-through rubber feet (Ø 12, black, cap plug) at the corner screws; the two axis screws stay flush brass (no impost clash).<\/li>\n<li><strong>Plates:<\/strong> R 7.7 on all eight corners.<\/li>\n<li><strong>Headings:<\/strong> A reads \"effects\" (not \"effects &amp; out\"); B drops the base heading over the speaker. The lid's back row in B carries \"echo\" and \"reverb\" over their groups.<\/li>\n<\/ul>\n<h2>7. Metal: what \"brass\" is now that nothing is machined (ruled: brass is the only visible metal)<\/h2>\n<p>Rev 1's brass was cut from bar. Systems §11 made the visible metal <strong>printed 316L stainless<\/strong> (JLC3DP binder jet) or thicker PETG. Here's what that looks like, and the ruling (director 5, as recommended in rev 2).<\/p>\n<ul>\n<li><strong>Printed 316L reads as steel, not brass:<\/strong> a matte, slightly grainy mid-grey, like sintered metal, polishable to a satin silver. Beside brass keys and brass axis screws, two grey stays would be a second metal. <strong>Two metals is a palette change I'd avoid:<\/strong> with B or C keys, brass is now the instrument's one metal.<\/li>\n<li><strong>So, by part:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Seen?<\/th>\n<th>Recommend<\/th>\n<th>Looks like<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Part\">Keys (B: sharps; C: all)<\/td>\n<td data-label=\"Seen?\">always<\/td>\n<td data-label=\"Recommend\">cast brass (§1)<\/td>\n<td data-label=\"Looks like\">polished brass, worn shine on the crowns<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Lid stays (2, 3 × 8 × 44.4)<\/td>\n<td data-label=\"Seen?\">standing; as lines on the lid end faces when stowed<\/td>\n<td data-label=\"Recommend\"><strong>cast brass<\/strong> from the same service as the keys (fits 125 mm; strength of the cast part at 3 × 8: systems / eng, UNVERIFIED)<\/td>\n<td data-label=\"Looks like\">brass, matching the keys<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">…fallback<\/td>\n<td data-label=\"Seen?\"><\/td>\n<td data-label=\"Recommend\"><strong>printed PETG 5 × 8 in matte black<\/strong> (systems' option b)<\/td>\n<td data-label=\"Looks like\">black, part of the knob / foot family. Not grey.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Hinge leaves (4)<\/td>\n<td data-label=\"Seen?\">no, inside the walls<\/td>\n<td data-label=\"Recommend\"><strong>printed 316L<\/strong> (systems' option a)<\/td>\n<td data-label=\"Looks like\">invisible, so steel is fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Axis screws (2)<\/td>\n<td data-label=\"Seen?\">lid back<\/td>\n<td data-label=\"Recommend\">bought brass screws<\/td>\n<td data-label=\"Looks like\">brass<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Feet<\/td>\n<td data-label=\"Seen?\">lid back, base<\/td>\n<td data-label=\"Recommend\">bought black rubber screw-feet<\/td>\n<td data-label=\"Looks like\">black<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Part\">Façade fill<\/td>\n<td data-label=\"Seen?\">lid back<\/td>\n<td data-label=\"Recommend\">his design; brass-tone if he keeps line work<\/td>\n<td data-label=\"Looks like\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>If he'd rather go steel everywhere<\/strong> (316L stays, stainless screws, birch or printed keys): it works and suits CATHEDRAL too, since real organ façade pipes are tin, a silver-grey metal. But it doesn't go with his brass keys, so it's a fallback, not a parallel option.<\/li>\n<li><strong>The palette (director 6):<\/strong> walnut, cream, black, red CUTOFF, brass. No other colour. TAP is made of the key material.<\/li>\n<li><strong>The brass on the stays doesn't need plating or paint<\/strong> if it's cast. Plating printed 316L to look like brass is possible but it's a finish that wears off a part you handle every time you stand the lid up.<\/li>\n<\/ul>\n<h2>Open<\/h2>\n<ol>\n<li><strong>Owner (being asked now, one at a time):<\/strong> speaker: pipe tower or off-centre circle (§2b; my pick: tower), and the re-centred PLAY row (⚑); hidden pins vs cables through the hinge; the back slot; keys A / B / C (my pick: B, black naturals + cast-brass sharps; reversed reading).<\/li>\n<li><strong>Owner, after keys:<\/strong> if brass, unlacquered (crowns stay bright, the rest darkens) or lacquered (bright until it wears)?<\/li>\n<li><strong>Systems / eng:<\/strong>\n   - brass head mass (2.5–5 g) on the Choc V2 silent switch: return and velocity fit; test one hollow head first;\n   - cast-brass stays: strength at 3 × 8 (or the black PETG 5 × 8 fallback);\n   - B's base rose (Ø 27) vs the Daisy (eng).<\/li>\n<li><strong>Maker / to buy:<\/strong> one pack of Cherry Tree Toys 3/8\" birch plugs (measure head height H: it fixes the key height); one Sculpteo quote by upload (hollow-cup brass head, a stay); a groove patch (0.25 and 0.35 deep) on the next coupon; the vesica's open area (acoustics).<\/li>\n<li><strong>Re-render pass after his layout answer<\/strong> (coordinator relays it): closed, standing (chosen layout) and keys, no spine, modelled grooves, chosen key colours. The standing and closed views can then come from POV-Ray too, if the director wants the brass believable in them as well. Keep it to those three.<\/li>\n<\/ol>", "lead": "Seed: CHAMBER rev 2 (../chamber/) + FOLD-105 v1.1. Owner, 14:12–14:41 (design/owner.md). Read with how-it-works.md (systems), which owns hinges, feet, plate radii, the slot, options A / B, and the key carrier and no-machining parts in §10–1", "jump": ["What CATHEDRAL does to the ideas", "1. Key and button colours (fewer colours, no brown, real parts)", "2. A vs B (the speaker and \"effects & out\")", "2b. The speaker, round 2 (owner: no speaker on the key side, no eye shape; \"lines going up and down\", or \"a circle and maybe not centered\")", "3. The grille (\"the screen\")", "4. A woodier fine line texture, same subtlety", "5. No spine", "6. Small things in every render (all ruled, all in the model)", "7. Metal: what \"brass\" is now that nothing is machined (ruled: brass is the only visible metal)", "Open"], "code": "D-109"}, "D-110": {"kind": "doc", "sub": "doc", "title": "CATHEDRAL · how it works", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "design/branches/concepts/cathedral/how-it-works.md", "html": "<h1>CATHEDRAL: how it works (systems, turn 1, 2026-11-13)<\/h1>\n<blockquote>\n<h2>Team rulings in force (director, CATHEDRAL steer 1; these supersede the options below where they differ)<\/h2>\n<ol>\n<li><strong>All 8 plate corners R 7.7<\/strong> (§4).<\/li>\n<li><strong>Feet:<\/strong>\n   - screw-through rubber feet at the <strong>4 corner screws<\/strong> (16 / 270, d 12 and d 96), black;\n   - the <strong>2 axis screws (143, d 12 / 96) stay flush brass<\/strong>, so they don't clash with the impost line (§3).<\/li>\n<li><strong>Lid stays: cast brass<\/strong> from the keys' service (lost-wax, from a printed pattern). <strong>Fallback: matte-black PETG, 5 × 8<\/strong> (end-face groove 5.5). Never grey 316L in view.<\/li>\n<li><strong>Printed 316L steel only for the hidden hinge leaves<\/strong> (out of sight).<\/li>\n<li><strong>One key interface for every head:<\/strong>\n   - the printed carrier's <strong>Ø 9.6 × 3.3 cup<\/strong> takes a <strong>9.53 × 3.2 tenon<\/strong>;\n   - wood plug, cast-brass head, printed head and a cap on a shaft all carry that tenon, so the choice stays swappable after the build (§10.2, §13).<\/li>\n<li>Grille: tapered horizontal slots (vesica 66 × 16 in A; Ø 27 circle in B). Option A's base heading reads <strong>\"effects\"<\/strong>. Palette: walnut, cream, black, red CUTOFF, brass. Fine-line woody relief is built (visual).<\/li>\n<\/ol>\n<h3>Two buy-and-test checks for the owner (before the lid height and the key order are fixed)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Buy<\/th>\n<th>Do<\/th>\n<th>Pass / what it sets<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">T1<\/td>\n<td data-label=\"Buy\"><strong>One pack of Cherry Tree Toys 3/8\" mushroom plugs<\/strong> (birch SKU 31, https://cherrytreetoys.com/3-8-mushroom-plugs/, 50 pcs)<\/td>\n<td data-label=\"Do\">Measure, with calipers or a ruler on 5 plugs: <strong>head height H<\/strong> (top to the tenon shoulder), head Ø, tenon Ø and length<\/td>\n<td data-label=\"Pass / what it sets\">Sets the key height: head top = deck + 2.8 + H. <strong>H ≤ 4.0 → closed stays ≈ 52.7 mm<\/strong>; every mm over 4 adds a mm to the lid. Tenon ≈ 9.53 × 3.2 confirms the carrier's cup<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">T2<\/td>\n<td data-label=\"Buy\"><strong>One hollow cast-brass head<\/strong> (2.5–3 g, wall 0.8–1.0, with the 9.53 × 3.2 tenon) from the cast-brass service, <strong>one printed carrier<\/strong>, <strong>one Kailh Choc V2 silent switch<\/strong><\/td>\n<td data-label=\"Do\">Glue the head on the carrier, push it onto the switch, press and release 20 times slow and fast; listen at the top-out; compare with a bare plug on a second carrier<\/td>\n<td data-label=\"Pass / what it sets\"><strong>Pass:<\/strong> no audible top-out clack beyond the bare plug's, no wobble, no sticking. If it fails: thinner wall, or brass-look print. (Velocity calibration comes later, on the board)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Layout B label check on the render model (<code>branch_check.py<\/code> §7, rb.Cathedral(\"B\"), Kalam)<\/h3>\n<ul>\n<li><strong>Layout A:<\/strong> 0 collisions.<\/li>\n<li><strong>Layout B:<\/strong> 3 hits:<\/li>\n<li><strong>\"repeats\" overlaps the FREE / SYNC toggle by 1.7<\/strong>: REPEATS' legend sits in front of its knob, where the toggle is;<\/li>\n<li>\"repeats\" ↔ \"sync\" 1.15 (rule 1.5);<\/li>\n<li>\"free\" ↔ FREQ 3 0.64.<\/li>\n<li><strong>Fix (geometry):<\/strong><\/li>\n<li>in B, <strong>TIME's and REPEATS' legends go behind their knobs<\/strong> (the toggle sits between them, in front);<\/li>\n<li>\"free\" / \"sync\" sit <strong>0.5 behind<\/strong> the toggle centre, as CHAMBER's fix.<\/li>\n<li>Re-run after the visual designer applies it.<\/li>\n<li>The CHAMBER model in rb.py currently raises an error (<code>screw<\/code> undefined in <code>lid_back<\/code>, the visual designer's file mid-edit), so that run was skipped. The Cathedral models ran.<\/li>\n<\/ul>\n<\/blockquote>\n<p>Seed: <strong>CHAMBER rev B<\/strong> (<code>../chamber/<\/code>, director 9) <strong>+ FOLD-105 v1.1<\/strong> (<code>versions/v1.1/fold/<\/code>). Owner, 14:12–14:18 (<a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>): lock in on these two, find the middle ground, and call the point of view <strong>CATHEDRAL<\/strong>. Read with <code>design/jobs.md<\/code> rev 5, <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> rev 2 and <a href=\"#i-D-040\"><code>../../echo-clock.md<\/code><\/a>.<\/p>\n<p>Marks:\n- <strong>[CHECK]<\/strong> <code>../branch_check.py<\/code> (§8a slot, §8b push-outs, §9 option B); TOTAL fails 0.\n- <strong>[CALC]<\/strong> my arithmetic · <strong>UNVERIFIED<\/strong> · <strong>ESTIMATE<\/strong>.\n- <strong>⚑ D+O<\/strong> = moves a control or changes the spec, so it needs the director's view and then the owner's. Nothing marked ⚑ is settled.<\/p>\n<p>No images rendered (owner, 13:13).<\/p>\n<hr />\n<h2>0. What I assumed his words point at<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>His words<\/th>\n<th>What it is on the object<\/th>\n<th>Confidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"His words\">\"effects &amp; out\"<\/td>\n<td data-label=\"What it is on the object\"><strong>The base PLAY row's right section<\/strong>, whose hand-lettered heading reads \"effects &amp; out\" (x 188.5): <strong>ECHO REPEATS, ECHO MIX, REVERB MIX, TAP<\/strong>. The heading is stale: <strong>VOLUME left that section in rev 7.2<\/strong> (it's on the lid's back row now), so nothing in it is \"out\"<\/td>\n<td data-label=\"Confidence\">high (it's the only place those words are printed)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"echo and reverb controls\"<\/td>\n<td data-label=\"What it is on the object\">The lid's <strong>back row<\/strong> (d 83.85): ECHO TYPE, ECHO TIME (+ FREE / SYNC), REVERB DECAY, REVERB TYPE. Open, they sit <strong>≈ 124 mm<\/strong> behind the \"effects &amp; out\" section [CALC: open y 191.85 vs 68], across V1, the band and V2<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"the speaker placement creates an odd gap\"<\/td>\n<td data-label=\"What it is on the object\">The speaker sits under the <strong>band<\/strong> between the lid's V1 and V2 rows (d 21.9–59.45). Its grille is a 50 mm island of slots (x 118–168, d 28–46) on an otherwise empty strip<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"<strong>the screen<\/strong>\"<\/td>\n<td data-label=\"What it is on the object\"><strong>The speaker grille<\/strong> (the only screen-like part: parallel horizontal slots). Not a display: there is none, by his rule<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"faceplates\", \"front edge squared\"<\/td>\n<td data-label=\"What it is on the object\">The cream <strong>pickguard plates<\/strong>. Both have <strong>square corners on one side<\/strong>: the base plate's front corners (by the keys) and the lid plate's hinge-side corners. Their other corners are R 7.7. That's the inconsistency (<code>r5.py<\/code> <code>base_plate2d<\/code> / <code>lid_plate2d<\/code>: front radius 0)<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"protective feet\" / \"the screws that screw the case in\"<\/td>\n<td data-label=\"What it is on the object\">The <strong>4 rubber feet<\/strong> and <strong>6 brass screws<\/strong> on each half's back (CHAMBER lid: feet d 6 / 78; screws d 12 / 96 at x 16, 143, 270)<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"hinges\"<\/td>\n<td data-label=\"What it is on the object\">The <strong>knuckles<\/strong> at the rear corners (x 0–10, 276–286) on an M4 shoulder bolt<\/td>\n<td data-label=\"Confidence\">high<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"the oxblood spine\"<\/td>\n<td data-label=\"What it is on the object\">CHAMBER rev 2's flexible spine closing the hinge-side slot<\/td>\n<td data-label=\"Confidence\">certain<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2>1. Hidden hinge(s) in the gap: not possible as a hidden <em>axis<\/em>; possible as hidden <em>pins in the side walls<\/em><\/h2>\n<p><strong>Why the gap can't hide the axis (geometry, not taste):<\/strong>\n- A fold with knobs on both halves needs the axis <strong>halfway up the closed hollow<\/strong>: z 26.3 in CATHEDRAL (axis rises 1.3 for the pegs).\n- Open, that's <strong>10.7 mm above the plates<\/strong>. The seam gap lives <em>below<\/em> the plates (z 0–15.6), so a hinge hidden in it would pivot at plate level. Closed, the lid would then land on the base's knobs.\n- <strong>Concealed (Soss-type) hinges<\/strong> pivot in the gap, and their hidden state is when the two edges abut. That's FOLD's <em>open<\/em> state, so <strong>closed, their links would show across the back<\/strong>. They also need ≥ 12.7 mm of wall to mortise (UNVERIFIED for the smallest size).\n- <strong>Dual-axis (laptop 360°) hinges<\/strong> leave a gap the width of the barrel between the halves when open flat. That breaks the flush seam and R4.\n- A <strong>two-link \"book spine\"<\/strong> of rigid slats (three axes) folds into the gap, but it has 3 degrees of freedom. The lid would flop, and the closing alignment and the standing angle would be lost.<\/p>\n<p><strong>What can be hidden: the pivot pins, inside the side walls.<\/strong>\n- <strong>Proposal (box-maker's side pivot):<\/strong>\n  - Each rear corner gets a <strong>brass leaf pair inside the wall thickness (x 0–4.05 and 281.95–286)<\/strong>: a base \"ear\" leaf and a lid leaf.\n  - A <strong>blind pin<\/strong> at the axis (y 109, z 26.3) goes in from inside. The outside hole is capped flush with a walnut plug.\n  - <strong>No barrels show.<\/strong>\n- <strong>What it looks like:<\/strong>\n  - Open, the base ear rises to z ≈ 31 at the two rear corners. It reads as the start of the lid's side rim, which already rises 22 mm along the lid's sides.\n  - Closed, each end face shows one quiet half-lap joint line around a round ear, not a knuckle.\n- <strong>Rules:<\/strong>\n  - Ears and leaves stay within x ≤ 4.05, so ≥ 12 mm from RANGE 1's edge (16.05): R4's rim rule is met. On the right, KBD CTRL's edge is 267.1 → 14.9 ✓.\n  - Width unchanged (286).\n- <strong>Against the ribbon:<\/strong> the ribbon crosses the seam at x 176–227, far from the corners. <strong>Unaffected.<\/strong>\n- <strong>Against the stays:<\/strong>\n  - The stays pivot at d 30 and stow in the lid end faces at d 30–74.4; the lid leaf sits at d ≈ −8 … 2. <strong>Clear by ≥ 26 mm.<\/strong>\n  - The base ear (y ≈ 100–110, above z 15.6) sits over the base's right end-face I/O, all of which is below z 15.6 (USB-C y 90–99, z 4.8–8.2). <strong>Clear.<\/strong>\n- <strong>Parts:<\/strong>\n  - 4 brass leaves (≈ 2 mm × 10 × 20, cut from flat bar, ESTIMATE);\n  - 2 hardened pins (M3 or Ø 3 dowel, ESTIMATE);\n  - 2 walnut plugs.\n  - Leaves are bonded into slots printed in the walls.\n- <strong>Risk:<\/strong> 2 mm brass leaves in a PETG wall carry the lid's weight and the stand loads, so the pivot boss strength is <strong>UNVERIFIED<\/strong> (eng / maker: one test print). The fallback is today's knuckles (owner: \"if not these are fine\").<\/p>\n<h2>2. The speaker and the gap<\/h2>\n<p><strong>The gap isn't caused by the speaker. It's where the base's PLAY row sleeps when the lid is closed.<\/strong>\n- Closed, a lid point at d lands over base y = 108 − d. The band (d 21.9–59.45) lands over y 48.5–86.1: exactly the PLAY row (y 68, CUTOFF r 10.4).\n- <strong>The band is already as narrow as the rules allow<\/strong> [CALC from the v1.1 rows]:\n  - V1 lands behind the PLAY row (y 93.55, 7.7 clear of CUTOFF);\n  - V2 lands in front of it (y 47.15, <strong>3.0 clear<\/strong>, the rule's minimum).\n- No knob can live in it. The speaker was put there because it was the only empty, deep place.\n- <strong>So the choice is what the gap is, not whether it exists.<\/strong><\/p>\n<p><strong>Option A, no control moves: make the gap one designed thing.<\/strong>\n- The speaker stays where it is. The band becomes <strong>one full-width element<\/strong> instead of a grille island on a blank strip.\n- CATHEDRAL reading: <strong>a round \"rose window\" grille<\/strong> over the speaker's centre (Ø ≤ 34, inside the band's 37.55 depth), flanked by blind lancets or engraved arcades over the cells.\n- <strong>\"the screen\" gets its rounding<\/strong> (§5).\n- <strong>Leaves FX split. It doesn't answer his \"those should be together\".<\/strong><\/p>\n<p><strong>Option B ⚑ D+O: every effect on one row, and the speaker moves to where the FX amounts were.<\/strong>\n- <strong>Lid back row<\/strong> (d 83.85), one section, read left to right:\n  - <strong>DRIFT 33.5 | ECHO: TYPE 62.5 · TIME 82.5 · REPEATS 102.5 · MIX 122.5 · TAP 142.5 | REVERB: TYPE 171 · DECAY 191 · MIX 211 | VOLUME 240<\/strong>;\n  - breaks 48 / 156 / 225.5;\n  - <strong>FREE / SYNC at (96, d 69)<\/strong>, in front of the gap between TIME and REPEATS.\n  - <strong>[CHECK §9]: 0 violations<\/strong> (pitch, gaps, breaks, edges, far rim, closed landing over pegs). The toggle window is bigger than today's (nearest: FREQ 3 2.87, REPEATS 4.16).\n  - <strong>Labels are not yet checked:<\/strong> no model exists for B.\n  - Everything the owner called \"effects &amp; out\" now sits with echo and reverb, <strong>and VOLUME (\"out\") is there too<\/strong>.\n  - TAP sits in the echo group, because echo is the only effect that uses tempo.\n- <strong>Base PLAY row:<\/strong> PITCH (stick, MOD, TUNE, GLIDE) | FILTER (CUTOFF, EMPHASIS, AMOUNT) | <strong>the speaker<\/strong>.\n  - Its free area: x 186–270 (break 184.5 to the edge), y 55–82 (keys end 54.6; V1's closed landing starts 86.1).\n  - A <strong>round grille up to Ø 27<\/strong> centred at (228, 68), on the PLAY row's own line. CATHEDRAL reading: the rose window at the east end of the nave.\n  - Under it, the 60 × 30 speaker (or a round one ≤ Ø 36: parts UNVERIFIED).\n- <strong>The lid band<\/strong> keeps only the cells. It becomes a quiet, uninterrupted band: the gap reads as a deliberate rest, not a hole around a grille.\n- <strong>Costs, named:<\/strong>\n  1. <strong>The FX amounts leave the hands' row.<\/strong> Throwing an echo means reaching ≈ 126 mm further (open y 194 vs 68). Standing at 120°, they're the top row of the lid. This reverses v1.1's \"amounts in front, kinds behind\", which the owner saw and approved.\n  2. <strong>The base board changes<\/strong> (speaker window; the Daisy sits rear right \"on the floor in a board cutout\": a clash with the speaker is <strong>UNVERIFIED<\/strong>, eng). The lid board loses its speaker window.\n  3. Standing, a base speaker fires up, not at the player (today's lid speaker faces you). Flat or on a lap, it's about the same.\n  4. The ribbon gets simpler (the speaker leads leave the lid; VOLUME's wiper already crosses on pin 33), <strong>UNVERIFIED<\/strong> (eng).\n- Base and lid heights, depth (108) and width are unchanged. The band stays (it's the PLAY row's nest).<\/p>\n<p><strong>Option C (rejected): bring echo and reverb down to the base.<\/strong> The base has one row only. A second row grows the base deep enough to bring back FOLD-113's gap problem.<\/p>\n<p><strong>My recommendation:<\/strong> B, if the owner accepts the reach cost (1). It's the only layout that puts echo, reverb, their amounts and the output together on a FOLD, and it gives the speaker a home that isn't a gap. Otherwise A.<\/p>\n<h2>3. Feet that are also the case screws<\/h2>\n<ul>\n<li><strong>Yes:<\/strong> <strong>screw-through rubber feet<\/strong>. Each foot has a recessed metal washer; the case screw passes through the foot's centre into the brass insert, so the foot is the screw head, and a rubber cap plug closes the hole. Product family exists (recessed screw-mount bumpers); <strong>exact part UNVERIFIED<\/strong> (eng: Ø ≈ 12, ≤ 3 mm proud, M3).<\/li>\n<li><strong>Positions (lid back):<\/strong><\/li>\n<li><strong>feet at the four corner screws<\/strong> (16 / 270, d 12 and d 96): visible screws drop from 6 to 2. The flat-open support widens from d 6–78 to d 12–96;<\/li>\n<li>the two axis screws (143, d 12 / 96) stay as flush brass, or also become feet (6 feet).<\/li>\n<li>The façade field (x 34.8–251.2 at pitch 8.75) clears the corner feet.<\/li>\n<li><strong>One clash if the axis screws become feet:<\/strong> a Ø 12 foot at (143, d 12) touches the impost line at d 18. Shrink it to Ø 10, or move the impost to d 19.5.<\/li>\n<li><strong>Base underside:<\/strong> the same idea. v1.1 positions aren't restated in my docs (<strong>UNVERIFIED<\/strong>; take them from r5).<\/li>\n<li>Both halves' feet must be the same height so the open instrument sits level.<\/li>\n<\/ul>\n<h2>4. Faceplate rounding<\/h2>\n<ul>\n<li><strong>Make every corner of both cream plates R 7.7.<\/strong> That's concentric with the block's R 12 plan corners and its 4.3 wall (12 − 4.3 = 7.7).<\/li>\n<li>That means the base front corners and the lid hinge-side corners, which are square now. Open, the seam then shows two rounded leaves meeting.<\/li>\n<li><strong>Pegs clear<\/strong> [CALC]: the first natural's felt washer (Ø 14 at (17, 13.5)) reaches (10, 6.5). That's 5.57 from the corner arc centre (12, 11.7), inside the plate. The last peg mirrors it.<\/li>\n<li><strong>Lid hinge corners:<\/strong> RANGE 1's edge (x ≥ 16.05) never enters the cut-off zone (x &lt; 12). KBD CTRL likewise.<\/li>\n<li>No control moves. <strong>Graphics and enclosure only<\/strong> (visual: one parameter in <code>rrect2d<\/code>).<\/li>\n<\/ul>\n<h2>5. \"The screen\" (the speaker grille), rounded<\/h2>\n<ul>\n<li><strong>Tapered slots<\/strong> (his first option): each slot's length follows a circle, so the slots are shortest at the top and bottom and longest in the middle.<\/li>\n<li>At 2.3 mm pitch inside Ø 34 (option A) that's ≈ 14 slots; inside Ø 27 (option B), ≈ 11.<\/li>\n<li>Field area [CALC]: a Ø 34 field ≈ 910 mm², about today's 50 × 18 (900). Ø 27 ≈ 570 mm² (−37 %): quieter, <strong>UNVERIFIED<\/strong> acoustically.<\/li>\n<li><strong>Circular<\/strong> (his second): concentric arcs, or a rose of radial slots.<\/li>\n<li>Both are visual choices on fixed geometry. Systems' only rule: the open area should stay ≥ ≈ 35 % of the cone's area. CATHEDRAL makes the circle the natural pick (rose window).<\/li>\n<\/ul>\n<h2>6. If the spine goes: what it was solving<\/h2>\n<ul>\n<li><strong>The hinge-side slot<\/strong>, real since v1.1: closed, a <strong>21.9 × 266 mm opening along the back<\/strong> shows the lid's V1 knobs 7 mm inside it and lets bag grit in (J6). v1.1 accepted it as a stated weakness (J6 ◐). CHAMBER's spine closed it.<\/li>\n<li><strong>If it goes, J6 drops back to ◐.<\/strong> No rigid lip can replace it (R4, §1).<\/li>\n<li><strong>Middle ground:<\/strong> keep the function and lose the accent. The same flexible spine in a <strong>body-matched colour<\/strong> (walnut-dark bookcloth or leather, or black) reads as part of the case. The side-pivot hinge (§1) doesn't change the spine's geometry: same anchors, same 21.9 closed / 2.1 open.<\/li>\n<li><strong>Owner's call:<\/strong> no spine (slot back, as v1.1) / body-colour spine / oxblood. <strong>→ Owner 14:4x: no spine.<\/strong> See §12.2 for what answers the slot instead.<\/li>\n<\/ul>\n<h2>7. CATHEDRAL as a point of view: what changes in the structure<\/h2>\n<ul>\n<li><strong>The console inside, the organ outside, stays.<\/strong> The pipes still come from the keyboard's own 2^(−n/12) and face the listener.<\/li>\n<li><strong>The architecture becomes the reason for the rounding he asked for:<\/strong> every plate corner arched (§4), the rose-window grille (§5), the pipes' rounded mouths. The push-outs stay as the two real pipe mouths (rev 2 §R2.2).<\/li>\n<li><strong>The plan reads like a church:<\/strong><\/li>\n<li>the keyboard is the nave's long axis;<\/li>\n<li>option B's single FX row is <strong>the choir<\/strong>: everything that colours the sound, gathered in one place at the top of the standing lid;<\/li>\n<li>the band is the <strong>crossing<\/strong>, the quiet space between nave and choir;<\/li>\n<li>the base speaker is the <strong>rose window at the east end<\/strong>.<\/li>\n<li>This is a metaphor, not a constraint: none of it moves a part beyond §2's option B.<\/li>\n<li><strong>No change<\/strong> to boards (except option B's speaker windows), the Daisy, the mux plan, the battery, the stays or the I/O.<\/li>\n<\/ul>\n<h2>8. Not mine (the visual designer's), noted for completeness<\/h2>\n<p>The \"woodier\" engraving with the same amount of detail; peg / button colours (fewer, no out-of-place brown); the spine's colour if kept; the grille's pattern.<\/p>\n<h2>10. Keys, redone around real parts; and no machining anywhere (owner 14:30–14:34)<\/h2>\n<p><strong>Owner:<\/strong>\n- \"The Wooden ones you linked do not have shafts that match the prototype\";\n- \"I don't know how to machine — the keys need to be printed or purchasable\";\n- \"They can be printed externally too - I know you can get metal prints\".<\/p>\n<p><strong>What was wrong:<\/strong>\n- From HUSH v1.1 through CHAMBER, the peg was a \"1/2 in button plug\" whose shank reached down through a felt collar and the deck into an acrylic arm.\n- Stock mushroom plugs have a <strong>⅛–¼ in tenon<\/strong>, and the size names the <strong>hole, not the head<\/strong>.\n- <strong>This affects HUSH, CHAMBER / CATHEDRAL and RAIN alike<\/strong> (one key mechanism; RAIN's and HUSH's files still describe the old shank).<\/p>\n<h3>10.1 The bought part (a supplier that publishes all three dimensions)<\/h3>\n<ul>\n<li><strong>Cherry Tree Toys 3/8\" mushroom plug.<\/strong><\/li>\n<li><strong>Published dimensions:<\/strong> head (\"overall diameter\") <strong>1/2\" = 12.7 mm<\/strong>, tenon <strong>3/8\" = 9.53 mm<\/strong>, tenon length <strong>1/8\" = 3.2 mm<\/strong>, package of 50.<\/li>\n<li><strong>Species:<\/strong><\/li>\n<li>birch, SKU 31 (https://cherrytreetoys.com/3-8-mushroom-plugs/);<\/li>\n<li>oak, SKU 31-O (https://cherrytreetoys.com/3-8-oak-mushroom-plugs/), same dimensions;<\/li>\n<li>a 3/8\" <strong>cherry<\/strong> plug ($5.35 / 50, on https://cherrytreetoys.com/wood-plugs/). Its dimensions aren't published; assumed the same family, <strong>UNVERIFIED<\/strong>.<\/li>\n<li>Their only walnut mushroom plug is 1/4\" (head ≈ 3/8\", too small).<\/li>\n<li><strong>Not published anywhere I checked: head height.<\/strong> Order one pack and measure; it sets the key height below.<\/li>\n<li><strong>Others checked:<\/strong><\/li>\n<li>Craftparts publishes head 5/8\" for its 1/2\" plug, with tenon length \"typically 1/4\"\" and no tenon diameter.<\/li>\n<li>Bear Woods lists maple and walnut, says the standard tenon is 1/4\" (long-shank SKUs exist) and gives no head or tenon diameters.<\/li>\n<li>Woodpeckers and WidgetCo publish only the hole size.<\/li>\n<li>So Cherry Tree Toys is the only one with all three.<\/li>\n<li><strong>Colour note:<\/strong> the head now matches the old 12.7 mm design. Birch or oak is pale, so the reverse-walnut naturals become a stain or a printed choice, which suits his \"too many colours / brown feels out of place\" (visual).<\/li>\n<\/ul>\n<h3>10.2 The new interface: a printed keycap carries the plug (no shank through the deck)<\/h3>\n<p><strong>Printed peg carrier, one per key, PETG.<\/strong> Printed parts are now allowed; it's a keycap, not a mechanism. It does what the acrylic arm did:\n- <strong>Bottom:<\/strong> an MX cross socket onto the Choc V2 stem (the switch has an MX cross stem, <code>velocity-and-keys-v2.md<\/code> §2).\n- <strong>Arm:<\/strong> a pocket for the D31 magnet, <strong>10.5 behind the stem at the same height as v1.1<\/strong> (face 7.6 above strip C at rest). So the magnet's rest / bottom gaps (5.6 / 2.8) and the velocity fit are unchanged.\n- <strong>Top:<\/strong> a <strong>cup Ø 9.6 × 3.3 deep<\/strong> for the plug's tenon, glued with wood glue. The tenon tapers slightly (Bear Woods), so it seats tight. Cup wall 0.8 → <strong>neck Ø 11.2<\/strong>.<\/p>\n<p><strong>The deck hole clears the neck, not a shank:<\/strong> hole Ø 12.0 (0.4 a side).<\/p>\n<p><strong>The felt stop moves down, off the deck.<\/strong> A felt ring on the deck can't work any more: under a 12.7 head, an 11.2 neck leaves a 0.75 mm landing.\n- <strong>Stop:<\/strong> a <strong>bought keyboard O-ring dampener<\/strong> on the carrier's stem, or a punched felt ring (Ø 14) on the switch top. The carrier's skirt lands on it <strong>at ≈ 2.5 of the 2.8 ± 0.25 travel<\/strong>, as HUSH's collar did.\n- The O-ring / felt <strong>thickness is the tuning knob<\/strong> (≈ 0.3–0.5).\n- The fit window for velocity (15–75 % of the stroke) ends at 2.1 mm, well before the stop at 2.5 → <strong>velocity unaffected<\/strong> [CALC].\n- The Choc silent switch damps both strokes on its own; the ring keeps it off hard bottom.<\/p>\n<p><strong>Height<\/strong> (H = the plug's head height, unpublished):\n- head underside at rest = deck + <strong>2.8<\/strong> (travel to the stop + 0.3 margin);\n- head top = deck + 2.8 + H.\n- H ≈ 4 → <strong>6.8<\/strong> (v1.1 pegs 6.5: +0.3).\n- H ≈ 5 → 7.8 (+1.3, and FOLD's closed height then needs ≈ +1.3 more: ≈ 54.0) [CALC].\n- <strong>Measure H before the lid height is fixed.<\/strong><\/p>\n<p><strong>What shows:<\/strong> a 2.8 mm printed neck under each wooden head, with a dark ring of deck hole round it. CATHEDRAL reading: an organ's drawknob on its stem.<\/p>\n<p><strong>Felt:<\/strong> the punched rings only need a hand punch (bought tool), or buy pre-cut felt washers. Not machining.<\/p>\n<h3>10.3 Printed pegs (allowed now): a real option<\/h3>\n<ul>\n<li><strong>One piece per key<\/strong> (head + neck + arm + MX socket), FDM.<\/li>\n<li><strong>Orientation:<\/strong> print <strong>upright, socket down on the bed<\/strong>, so the cross socket's walls are vertical and accurate. The dome comes last, at 0.12 mm layers; its top shows faint terraces (a matte filament hides them).<\/li>\n<li>Head-down is smoother on top, but it needs supports in the socket, which spoil the fit. Rejected.<\/li>\n<li><strong>Fit:<\/strong> the MX cross needs a tolerance coupon (three sockets at −0.05 / 0 / +0.05 mm). The magnet press-fits into a printed pocket and is glued.<\/li>\n<li><strong>Feel against the wood plugs:<\/strong> printed PETG/PLA feels cooler, slicker and lighter than birch. A wood-fill or matte filament narrows the gap; it won't feel like turned wood.<\/li>\n<li><strong>What it does for his colour note:<\/strong> pegs and TAP can be the same filament, so one less colour.<\/li>\n<li><strong>Same carrier geometry as 10.2.<\/strong> The bought-plug and printed-peg versions are interchangeable on the same switches.<\/li>\n<li><strong>Externally printed<\/strong> (resin or SLS) gives a smooth dome with no terraces. Cost <strong>UNVERIFIED<\/strong>: quote by upload.<\/li>\n<\/ul>\n<h3>10.4 Options, plainly (not picking)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Head<\/th>\n<th>Who makes it<\/th>\n<th>Feel<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">A. <strong>Bought plug on a printed carrier<\/strong><\/td>\n<td data-label=\"Head\">Cherry Tree Toys 3/8\" (12.7 head, 9.53 × 3.2 tenon)<\/td>\n<td data-label=\"Who makes it\">buy plugs; print carriers<\/td>\n<td data-label=\"Feel\">turned wood<\/td>\n<td data-label=\"Notes\">head height unpublished: measure; pale species only (birch / oak / cherry)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">B. <strong>Printed peg, one piece<\/strong><\/td>\n<td data-label=\"Head\">printed<\/td>\n<td data-label=\"Who makes it\">print<\/td>\n<td data-label=\"Feel\">plastic; matte or wood-fill helps<\/td>\n<td data-label=\"Notes\">best colour control; FDM terraces on the dome<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">C. <strong>Externally printed pegs<\/strong> (resin / SLS)<\/td>\n<td data-label=\"Head\">printed<\/td>\n<td data-label=\"Who makes it\">order<\/td>\n<td data-label=\"Feel\">smooth plastic<\/td>\n<td data-label=\"Notes\">cost UNVERIFIED<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">E. <strong>Bought wood cap on a shaft<\/strong> (owner, thinking aloud: \"Premade wooden caps on a shaft that also is premade or part of the key is fine too\")<\/td>\n<td data-label=\"Head\">a turned wood knob or furniture button with a bored hole, <s
