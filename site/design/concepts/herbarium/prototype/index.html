: "CHAMBER", "src": "media/CHAMBER-closed-with-book.jpg", "thumb": "media/t/CHAMBER-closed-with-book.jpg", "w": 1400, "h": 817, "orig": "2400 × 1400", "path": "design/branches/concepts/chamber/img/chamber-closed-with-book.jpg", "code": "CHAMBER-closed-with-book"}, "CHAMBER-open": {"kind": "image", "sub": "render", "title": "Open flat: the console. Reverse peg keys (walnut naturals, maple sharps), RANGE in feet, FREE / SYNC in front of TIME.", "short": "open", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-open.jpg", "thumb": "media/t/CHAMBER-open.jpg", "w": 1400, "h": 1047, "orig": "1974 × 1476", "path": "design/branches/concepts/chamber/img/chamber-open.jpg"}], "group": "CHAMBER", "src": "media/CHAMBER-open.jpg", "thumb": "media/t/CHAMBER-open.jpg", "w": 1400, "h": 1047, "orig": "1974 × 1476", "path": "design/branches/concepts/chamber/img/chamber-open.jpg", "code": "CHAMBER-open"}, "CHAMBER-standing": {"kind": "image", "sub": "render", "title": "Standing at 120° on v1.1's brass stays, the lid face corrected to cream. The spine shows as a soft oxblood drape in the opened joint.", "short": "standing", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-standing.jpg", "thumb": "media/t/CHAMBER-standing.jpg", "w": 1400, "h": 1011, "orig": "2078 × 1501", "path": "design/branches/concepts/chamber/img/chamber-standing.jpg"}], "group": "CHAMBER", "src": "media/CHAMBER-standing.jpg", "thumb": "media/t/CHAMBER-standing.jpg", "w": 1400, "h": 1011, "orig": "2078 × 1501", "path": "design/branches/concepts/chamber/img/chamber-standing.jpg", "code": "CHAMBER-standing"}, "CHAMBER-standing-from-behind": {"kind": "image", "sub": "render", "title": "Standing, from behind: what the friend on the bench sees. 25 pipes at 8.75 pitch; the two dark mouths at x 108 / 178 are the push-out holes.", "short": "standing from behind", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-standing-from-behind.jpg", "thumb": "media/t/CHAMBER-standing-from-behind.jpg", "w": 1400, "h": 772, "orig": "1954 × 1077", "path": "design/branches/concepts/chamber/img/chamber-standing-from-behind.jpg"}], "group": "CHAMBER", "src": "media/CHAMBER-standing-from-behind.jpg", "thumb": "media/t/CHAMBER-standing-from-behind.jpg", "w": 1400, "h": 772, "orig": "1954 × 1077", "path": "design/branches/concepts/chamber/img/chamber-standing-from-behind.jpg", "code": "CHAMBER-standing-from-behind"}, "CHAMBER-reverse-pegs": {"kind": "image", "sub": "render", "title": "The reverse pegs (the proposal): walnut naturals from the body's own walnut, maple sharps, each on a 14 mm felt washer.", "short": "reverse pegs", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-reverse-pegs.jpg", "thumb": "media/t/CHAMBER-reverse-pegs.jpg", "w": 1400, "h": 924, "orig": "2400 × 1584", "path": "design/branches/concepts/chamber/img/chamber-reverse-pegs.jpg"}], "group": "CHAMBER", "src": "media/CHAMBER-reverse-pegs.jpg", "thumb": "media/t/CHAMBER-reverse-pegs.jpg", "w": 1400, "h": 924, "orig": "2400 × 1584", "path": "design/branches/concepts/chamber/img/chamber-reverse-pegs.jpg", "code": "CHAMBER-reverse-pegs"}, "CHAMBER-pegs-fallback-colours": {"kind": "image", "sub": "render", "title": "The fallback, if reversed keys bother him: maple naturals, walnut sharps. Same parts, same geometry, a normal keyboard's light / dark.", "short": "pegs fallback colours", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-pegs-fallback-colours.jpg", "thumb": "media/t/CHAMBER-pegs-fallback-colours.jpg", "w": 1400, "h": 924, "orig": "2400 × 1584", "path": "design/branches/concepts/chamber/img/chamber-pegs-fallback-colours.jpg"}], "group": "CHAMBER", "src": "media/CHAMBER-pegs-fallback-colours.jpg", "thumb": "media/t/CHAMBER-pegs-fallback-colours.jpg", "w": 1400, "h": 924, "orig": "2400 × 1584", "path": "design/branches/concepts/chamber/img/chamber-pegs-fallback-colours.jpg", "code": "CHAMBER-pegs-fallback-colours"}, "CHAMBER-pegs": {"kind": "image", "sub": "drawing", "title": "Pegs from above at native resolution (12.41 px per mm).", "short": "pegs · 1:1 at 12.41 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-pegs.jpg", "thumb": "media/t/CHAMBER-pegs.jpg", "w": 1093, "h": 695, "orig": "1093 × 695", "path": "design/branches/concepts/chamber/img/chamber-pegs-12.41px-per-mm.png"}], "group": "CHAMBER", "src": "media/CHAMBER-pegs.jpg", "thumb": "media/t/CHAMBER-pegs.jpg", "w": 1093, "h": 695, "orig": "1093 × 695", "path": "design/branches/concepts/chamber/img/chamber-pegs-12.41px-per-mm.png", "code": "CHAMBER-pegs"}, "CHAMBER-closed-front-exact": {"kind": "image", "sub": "drawing", "title": "Closed, exact front elevation: 52.7 mm with the pegs inside (v1.1 FOLD: 50.1).", "short": "closed front exact", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-closed-front-exact.jpg", "thumb": "media/t/CHAMBER-closed-front-exact.jpg", "w": 1600, "h": 289, "orig": "4424 × 798", "path": "design/branches/concepts/chamber/img/chamber-closed-front-exact.png"}], "group": "CHAMBER", "src": "media/CHAMBER-closed-front-exact.jpg", "thumb": "media/t/CHAMBER-closed-front-exact.jpg", "w": 1600, "h": 289, "orig": "4424 × 798", "path": "design/branches/concepts/chamber/img/chamber-closed-front-exact.png", "code": "CHAMBER-closed-front-exact"}, "CHAMBER-range-feet": {"kind": "image", "sub": "drawing", "title": "RANGE in feet, the one serif on the panel: 16' and 8' low, 32' and 4' higher, lo and 2' beside the end ticks.", "short": "range feet · 1:1 at 12.41 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-range-feet.jpg", "thumb": "media/t/CHAMBER-range-feet.jpg", "w": 918, "h": 446, "orig": "918 × 446", "path": "design/branches/concepts/chamber/img/chamber-range-feet-12.41px-per-mm.png"}], "group": "CHAMBER", "src": "media/CHAMBER-range-feet.jpg", "thumb": "media/t/CHAMBER-range-feet.jpg", "w": 918, "h": 446, "orig": "918 × 446", "path": "design/branches/concepts/chamber/img/chamber-range-feet-12.41px-per-mm.png", "code": "CHAMBER-range-feet"}, "CHAMBER-time-dial": {"kind": "image", "sub": "drawing", "title": "TIME's two scales (inner milliseconds, outer note divisions as marks) and the FREE / SYNC toggle in front, in his FOLD hand.", "short": "time dial · 1:1 at 12.41 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-time-dial.jpg", "thumb": "media/t/CHAMBER-time-dial.jpg", "w": 919, "h": 620, "orig": "919 × 620", "path": "design/branches/concepts/chamber/img/chamber-time-dial-12.41px-per-mm.png"}], "group": "CHAMBER", "src": "media/CHAMBER-time-dial.jpg", "thumb": "media/t/CHAMBER-time-dial.jpg", "w": 919, "h": 620, "orig": "919 × 620", "path": "design/branches/concepts/chamber/img/chamber-time-dial-12.41px-per-mm.png", "code": "CHAMBER-time-dial"}, "CHAMBER-top": {"kind": "image", "sub": "drawing", "title": "Open, exact top view, 12.41 px per mm: a reference for measuring, not \"real size\" on a screen.", "short": "top · 1:1 at 12.41 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-top.jpg", "thumb": "media/t/CHAMBER-top.jpg", "w": 1600, "h": 1225, "orig": "3600 × 2757", "path": "design/branches/concepts/chamber/img/chamber-top-12.41px-per-mm.png"}], "group": "CHAMBER", "src": "media/CHAMBER-top.jpg", "thumb": "media/t/CHAMBER-top.jpg", "w": 1600, "h": 1225, "orig": "3600 × 2757", "path": "design/branches/concepts/chamber/img/chamber-top-12.41px-per-mm.png", "code": "CHAMBER-top"}, "D-102": {"kind": "doc", "sub": "doc", "title": "CHAMBER · how it looks and feels", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2"}], "path": "design/branches/concepts/chamber/how-it-looks-and-feels.md", "html": "<h1>CHAMBER: how it looks and feels (visual)<\/h1>\n<p>Seed: FOLD-105 (v1.1). Kind: an instrument case. <strong>Point of view: closed, it's an organ case; open, it's a console.<\/strong> Emotion: joy. Read with <a href=\"#i-D-101\"><code>how-it-works.md<\/code><\/a> (systems rev 2) and <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> (rev 2).<\/p>\n<p><strong>Rev 2, 2026-11-13 (round 1 scored 8; the director's six fixes).<\/strong> Supersedes rev 1. Images are in <code>img/<\/code>, made by <code>design/concepts/_mock-src/rb.py<\/code> (models) and <code>figs_rb.py<\/code> (web figures). All type is now <strong>Kalam<\/strong> (installed by systems), not the stand-in. Only images the fixes needed were re-rendered (owner: \"dont render a bunch of images unnecessarily\").<\/p>\n<h2>What changed in rev 2 (the director's fixes)<\/h2>\n<ol>\n<li><strong>The standing lid face reads cream.<\/strong> OpenSCAD's fixed light renders a face turned away from it as grey. The standing renders now lift the lid plate's median back to the intended cream, as v1.1's sheet E did. It's a render correction, not a design change: the real plate is cream (#f1ebdd).<\/li>\n<li><strong>The hinge-side slot is closed: a bookcloth spine<\/strong> (systems R2.1).\n   - Taut when closed, it becomes the case's back panel.\n   - Open flat, it folds into the seam gap (nothing above the plates).\n   - Standing, it shows as a soft drape in the opened joint behind the PLAY row.\n   - <strong>Colour: oxblood bookcloth (#6b2c23).<\/strong> That's the cloth an organ case shows behind its façade pipes, and it's the one warm note between the walnut and the brass.<\/li>\n<li><strong>Fallback key colours drawn<\/strong> (maple naturals, walnut sharps), so his answer on reversed keys can't sink the concept. The geometry is identical; only the bought plugs swap.<\/li>\n<li><strong>Push-outs become pipe mouths<\/strong> (systems R2.2):\n   - façade pitch 10 → <strong>8.75<\/strong>;\n   - pipes at x 108 and 178 stand on the board bridges, and their mouths are real Ø 4 holes at d 28.3;\n   - two pipes really speak, so the decoration does a job.<\/li>\n<\/ol>\n<p>Also: PARA \"mono / para / +4\" above its toggle (accepted); Kalam everywhere.\n5. <strong>Artefacts fixed:<\/strong>\n   - the white streak on the walnut pegs was a hairline crack between two touching meshes; each head is now one hull;\n   - the pale band on the base front was OpenSCAD's near clipping plane cutting the base in the close-up. The camera moved back; there was never geometry there.\n6. <strong>Walnut button plugs: sourced<\/strong> (below), with the stained-maple fallback priced.<\/p>\n<p><strong>Legend and tick collisions: 0<\/strong> in <code>branch_check.py<\/code> §7 (Kalam, measured on the render model), including the v1.1-inherited ones. Branch-only fixes, with the locks untouched:\n- \"free\" / \"sync\" sit 0.5 behind the toggle centre;\n- any knob tick that ran under a toggle nut (spec nut, 9.2 across corners) is dropped;\n- type-name rows: inner 3.4 → 3.8, outer 6.5 → 7.2;\n- RANGE \"lo\" / \"2'\" sit at ±138°, r 10.4 (clear of \"range\");\n- \"velocity\" sits 7.7 above its toggle;\n- the STATUS legend moves <em>beside<\/em> its hood, not above.<\/p>\n<h2>The three states, in the order you use them<\/h2>\n<p>Closed, you carry the façade. Flat, it's just a console and the façade is face down. Standing, the façade faces the listener and the console faces you.<\/p>\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-closed-with-book.jpg\" width=\"1400\" height=\"817\" alt=\"CHAMBER closed beside a hardback, seen from behind: façade of brass line pipes on walnut, an oxblood spine closing the back\" loading=\"lazy\"><\/span><figcaption>Closed, beside a 400-page hardback: real walnut, seen from behind so the pipes stand upright. The oxblood bookcloth spine now closes the hinge side. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-open.jpg\" width=\"1400\" height=\"1047\" alt=\"CHAMBER open flat: cream pickguards, black knobs, walnut and maple peg keys\" loading=\"lazy\"><\/span><figcaption>Open flat: the console. Reverse peg keys (walnut naturals, maple sharps), RANGE in feet, FREE / SYNC in front of TIME. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-standing.jpg\" width=\"1400\" height=\"1011\" alt=\"CHAMBER standing at 120 degrees on brass stays, cream lid face\" loading=\"lazy\"><\/span><figcaption>Standing at 120° on v1.1's brass stays, the lid face corrected to cream. The spine shows as a soft oxblood drape in the opened joint. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-standing-from-behind.jpg\" width=\"1400\" height=\"772\" alt=\"CHAMBER standing, seen from behind: the walnut lid back with 25 brass line pipes\" loading=\"lazy\"><\/span><figcaption>Standing, from behind: what the friend on the bench sees. 25 pipes at 8.75 pitch; the two dark mouths at x 108 / 178 are the push-out holes. · render<\/figcaption><\/figure>\n\n<h2>Keys<\/h2>\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-reverse-pegs.jpg\" width=\"1400\" height=\"924\" alt=\"Close-up of the reverse peg keys: walnut naturals, maple sharps on felt washers\" loading=\"lazy\"><\/span><figcaption>The reverse pegs (the proposal): walnut naturals from the body's own walnut, maple sharps, each on a 14 mm felt washer. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-pegs-fallback-colours.jpg\" width=\"1400\" height=\"924\" alt=\"Close-up of the fallback peg colours: maple naturals, walnut sharps\" loading=\"lazy\"><\/span><figcaption>The fallback, if reversed keys bother him: maple naturals, walnut sharps. Same parts, same geometry, a normal keyboard's light / dark. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-pegs.jpg\" width=\"1093\" height=\"695\" alt=\"Top-view detail of the peg keys with a 10 mm scale bar\" loading=\"lazy\"><\/span><figcaption>Pegs from above at native resolution (12.41 px per mm). · drawing<\/figcaption><\/figure>\n\n<h2>Details<\/h2>\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-closed-front-exact.jpg\" width=\"1600\" height=\"289\" alt=\"Exact front elevation of CHAMBER closed, dimensioned 52.7 mm high\" loading=\"lazy\"><\/span><figcaption>Closed, exact front elevation: 52.7 mm with the pegs inside (v1.1 FOLD: 50.1). · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-range-feet.jpg\" width=\"918\" height=\"446\" alt=\"Detail of the three RANGE knobs with foot markings in a serif\" loading=\"lazy\"><\/span><figcaption>RANGE in feet, the one serif on the panel: 16' and 8' low, 32' and 4' higher, lo and 2' beside the end ticks. · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-time-dial.jpg\" width=\"919\" height=\"620\" alt=\"Detail of the TIME knob with its two scales and the FREE / SYNC toggle in front\" loading=\"lazy\"><\/span><figcaption>TIME's two scales (inner milliseconds, outer note divisions as marks) and the FREE / SYNC toggle in front, in his FOLD hand. · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/CHAMBER-top.jpg\" width=\"1600\" height=\"1225\" alt=\"CHAMBER open, orthographic top view\" loading=\"lazy\"><\/span><figcaption>Open, exact top view, 12.41 px per mm: a reference for measuring, not \"real size\" on a screen. · drawing<\/figcaption><\/figure>\n\n<h2>Principles (each follows from the idea)<\/h2>\n<ol>\n<li><strong>The façade is the instrument's own scale.<\/strong>\n   - 25 pipes, one per key, C to C: lengths 66 × 2^(−n/12) mm, the longest four times the shortest.\n   - The organ builders' tower: the tallest on the axis, then alternating outward.\n   - Two of them speak (their mouths are the push-out holes).\n   - <em>Because<\/em> decoration that comes from the keyboard's numbers is information, not costume.<\/li>\n<li><strong>Line, not picture.<\/strong>\n   - Single 0.6 mm engraved lines with a brass-tone fill: conical foot, mouth, body, flat top. No shading, no fake 3D, no tracery.\n   - <em>Because<\/em> brass on dark walnut turns steampunk the moment it's drawn as an object.<\/li>\n<li><strong>Outside dark, inside light; the keys rhyme with both.<\/strong> Dark walnut with light lines outside; a light plate with dark knobs inside. The keys sit between.<\/li>\n<li><strong>Brass is the case hardware; cloth is its back.<\/strong> Brass stays, pins and screws (the d 12 screws sit on the façade's plinth band as rivets). The oxblood spine closes the case like a book's.<\/li>\n<li><strong>Serif only where the organ speaks.<\/strong> RANGE in feet and the nameplate; everything else in his FOLD hand (Kalam).<\/li>\n<\/ol>\n<h2>Look (spec for the build)<\/h2>\n<ul>\n<li><strong>Body:<\/strong><\/li>\n<li>walnut-tone wood-fill PETG first (#6b4429, matte); his planed walnut later, oiled;<\/li>\n<li>halves 286 × 108; closed 52.7 (lid walls +2.6).<\/li>\n<li><strong>Façade (lid back):<\/strong><\/li>\n<li>25 pipes, pitch 8.75, field x 34.8–251.2;<\/li>\n<li>feet on an impost line at d 18, a plinth line at d 10, tops up to d 84;<\/li>\n<li>lines 0.6 wide, brass-tone fill; impost and plinth lines run x 30–256;<\/li>\n<li><strong>the mouths of the pipes at x 108 and 178 are through-holes, Ø 4, at d 28.3<\/strong> (the push-outs);<\/li>\n<li>feet: dark rubber, front pair at d 6, rear pair at d 78;<\/li>\n<li>first build: a printed relief (0.4 proud) with brass-tone wax fill; real-walnut version: engraved and filled.<\/li>\n<li><strong>Spine:<\/strong> oxblood bookcloth on a 0.8 TPU core, x 10.5–275.5, glued to the base's rear-top edge and the lid's hinge edge, up over the lid plate's edge so no white line shows when closed. Flex life UNVERIFIED (systems).<\/li>\n<li><strong>Pickguards:<\/strong> v1.1 cream (#f1ebdd), 45° bevel, black Kalam legends, warm-grey rules.<\/li>\n<li><strong>Keys:<\/strong><\/li>\n<li>proposal: walnut naturals, maple sharps;<\/li>\n<li>fallback: maple naturals, walnut sharps;<\/li>\n<li>12.7 button plugs on HUSH's arms, 14 mm felt washers, tops 6.5 above the plate;<\/li>\n<li>the key window closes into a deck.<\/li>\n<li><strong>RANGE feet:<\/strong> EB Garamond 1.2 (positions above).<\/li>\n<li><strong>Section names:<\/strong> oscillators and contours at dV1 + 17.5 (clear of the feet labels); mixer stays at + 11.3, under the grille.<\/li>\n<li><strong>FREE / SYNC:<\/strong> black FOLD toggle at lid (133, d 70.6); \"free\" / \"sync\" beside it, 0.5 behind its centre.<\/li>\n<li><strong>TIME:<\/strong> inner ms ticks, outer division marks (tick / dot = dotted / triangle = triplet), over ±135°, no numbers. DIPTYCH's numbered red/black dial is a donor if the director wants numbers.<\/li>\n<li><strong>Name:<\/strong> a blank 16 × 5 lozenge on the axis at d 94.6.<\/li>\n<li><strong>Status:<\/strong> hooded LED; legend beside it.<\/li>\n<\/ul>\n<h2>Walnut button plugs (fix 6)<\/h2>\n<ul>\n<li><strong>1/2\" walnut button plugs<\/strong> are a stock part:<\/li>\n<li><a href=\"https://woodpeckerscrafts.com/products/1-2-walnut-button-plug\" rel=\"noopener\" target=\"_blank\">Woodpeckers<\/a>: $0.35 each, $0.32 at 25+;<\/li>\n<li><a href=\"https://www.zoro.com/midwest-fastener-12-walnut-wood-round-head-screw-hole-buttons-100pk-08944/i/G102512583/\" rel=\"noopener\" target=\"_blank\">Midwest Fastener via Zoro<\/a>: $43.55 per 100, mushroom / round head.<\/li>\n<li>CHAMBER needs 15 walnut + 10 maple; with spares, ≈ $8–10 for the walnut at the 25+ price.<\/li>\n<li><strong>UNVERIFIED:<\/strong> neither page states shank diameter or length, so fit on HUSH's arm needs one sample in hand.<\/li>\n<li><strong>Fallback:<\/strong> maple plugs stained dark. Same plug as the sharps, plus a walnut-tone oil stain ($0–10). It reads less like the body's walnut, and the stain wears at the touch point.<\/li>\n<\/ul>\n<h2>Motion and feedback<\/h2>\n<ul>\n<li>Pegs: ≈ 2.5 mm onto felt, silent. Both colourings feel the same.<\/li>\n<li>Lid: v1.1 brass stays (a firm click at the stop). The spine gives a soft cloth sound when it pulls taut closed.<\/li>\n<li>Echo tempo: v1.1's tempo flash on the one status light (H7), with echo-clock.md's lock / loss flashes.<\/li>\n<\/ul>\n<h2>Still open<\/h2>\n<ul>\n<li><strong>Owner:<\/strong> reversed keys, or the fallback (both drawn).<\/li>\n<li><strong>Eng / maker:<\/strong><\/li>\n<li>spine flex life;<\/li>\n<li>the ribbon's loop sharing the seam gap (systems);<\/li>\n<li>engraved / relief fill on wood-fill PETG (coupon);<\/li>\n<li>plug shank fit.<\/li>\n<li><strong>Closed from the front<\/strong>, the pipes point toward you (their feet are at the hinge so they stand upright when it stands). Accepted as the price of facing the listener.<\/li>\n<\/ul>", "lead": "Seed: FOLD-105 (v1.1). Kind: an instrument case. Point of view: closed, it's an organ case; open, it's a console. Emotion: joy. Read with how-it-works.md (systems rev 2) and ../common-how-it-works.md (rev 2).", "jump": ["What changed in rev 2 (the director's fixes)", "The three states, in the order you use them", "Keys", "Details", "Principles (each follows from the idea)", "Look (spec for the build)", "Walnut button plugs (fix 6)", "Motion and feedback", "Still open"], "group": "CHAMBER", "code": "D-102"}, "D-101": {"kind": "doc", "sub": "doc", "title": "CHAMBER · how it works", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2"}], "path": "design/branches/concepts/chamber/how-it-works.md", "html": "<h1>CHAMBER: how it works (systems)<\/h1>\n<p>Seed: <strong>FOLD-105<\/strong> (v1.1). Kind: an instrument case. Point of view (director, turn 3): <strong>closed it's an organ case; open it's a console.<\/strong> Emotion: joy. Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>, <a href=\"#i-D-011\"><code>versions/v1.1/fold/how-it-works.md<\/code><\/a> (rev 5.7) and <code>design/jobs.md<\/code> rev 5.<\/p>\n<p><strong>Rev 2, 2026-11-13 (round 1 scored 8; director's fixes).<\/strong> Supersedes rev 1 where they differ. Numbers marked [CHECK] are from <code>../branch_check.py<\/code> §7, §8a and §8b.<\/p>\n<blockquote>\n<h3>R2.1 The hinge-side slot is real, and a spine closes it [CHECK §8a]<\/h3>\n<ul>\n<li><strong>Real, by design since v1.1<\/strong> (<code>fold/how-it-works.md<\/code>, \"Closed from the back\"). The lid has no wall on its hinge edge, because open, a wall there would stand between the PLAY row and V1. That breaks the owner's \"nothing raised among the knobs\" (R4).<\/li>\n<li>In CHAMBER the slot grows with the lid walls: <strong>21.9 mm tall × 266 wide<\/strong> (x 10–276, between the knuckles). Closed: base plate z 15.6, lid plate z 37.5. The rims land on the base plate at z 15.5, because the hinge axis rises 1.3 to z 26.3, as rb.py already has.<\/li>\n<li><strong>A rigid spine wall or lid lip can't work.<\/strong> Fixed, it stands 22 mm above the plates when open. Folded flat, it lies on the plate. Either way it breaks R4.<\/li>\n<li><strong>Fix: a flexible spine, the way a book closes<\/strong> (FOLD already \"folds like a book\").<\/li>\n<li>A strip of bookcloth or thin leather on a 0.8 mm TPU core, <strong>21.9 mm wide, x 10.5–275.5<\/strong>.<\/li>\n<li>Glued along the base's rear-top edge (y 108, z 15.6) and the lid's hinge-top edge (open y 110, z 15.1).<\/li>\n<li><strong>Closed:<\/strong> the two edges are 21.9 apart, so the spine is taut and closes the back. It becomes the organ case's back panel; colour is the visual designer's call.<\/li>\n<li><strong>Open flat:<\/strong> the edges are 2.1 apart, so the spine folds down into the 2.0 mm seam gap as a loop ≈ 9.9 deep (to z ≈ 5.7). <strong>Nothing above the plates: R4 holds.<\/strong><\/li>\n<li><strong>Standing (120°):<\/strong> 12.7 apart, so ≈ 9 mm of slack shows as a soft drape in the opened gap behind the PLAY row, like a book's joint.<\/li>\n<li><strong>Eng / maker:<\/strong><\/li>\n<li>the hinge ribbon's rolling loop shares that gap at x 176–227. Route the loop inboard of the spine; v1.1's TPU flap over the ribbon becomes part of the spine;<\/li>\n<li>a doubled 0.8 mm TPU loop in a 2.0 mm gap is tight;<\/li>\n<li>flex life of a TPU or leather spine is <strong>UNVERIFIED<\/strong> (bookbinding precedent only).<\/li>\n<li>Cost ≈ $2–5 (ESTIMATE).<\/li>\n<\/ul>\n<h3>R2.2 Push-out holes [CHECK §8b]<\/h3>\n<ul>\n<li><strong>The visual designer's d 90 clears the d 96 screws<\/strong> (27.8 mm from the nearest), the pipes and the feet. <strong>But inside the lid it lands in the wrong place.<\/strong><\/li>\n<li>The pin passes the lid back and meets the main board's underside behind the <strong>ECHO TYPE / REVERB TYPE rotary switches' solder tails<\/strong> (centres d 83.85; body ≥ 16 mm, ESTIMATE, so tails to d ≈ 92).<\/li>\n<li>It also lands 1 mm from the far-wall I/O board (d 92–104).<\/li>\n<li>Pushing on solder tails: <strong>rejected.<\/strong><\/li>\n<li><strong>Why v1.1 put them at (110 / 176, d 54):<\/strong> that's the bare board bridges between the cell and speaker windows (x 103–113, 173–183, in the band d 21.9–59.45). CHAMBER's pipes sit there now.<\/li>\n<li><strong>Proposal: the push-outs become the mouths of two pipes.<\/strong><\/li>\n<li>Façade pitch <strong>10 → 8.75<\/strong>, so pipes 7 and 8 stand at <strong>x 108 / 178<\/strong>, on the bridges.<\/li>\n<li>Their mouths (d 27–29.6) become <strong>real Ø 4 holes at (108, d 28.3) and (178, d 28.3)<\/strong>.<\/li>\n<li>Checked: screws 33.9 clear, feet 63.6, on the bare bridges, ≥ 5 mm past the V1 toggle bodies (ESTIMATE, d ≤ 21).<\/li>\n<li>New field at pitch 8.75: x 34.8–251.2, 2.35 between pipes. Feet and screws still clear [CHECK].<\/li>\n<li>Two pipes really speak with a mouth, and the decoration does a job. <strong>Visual: redraw at pitch 8.75.<\/strong><\/li>\n<\/ul>\n<h3>R2.3 Legends and ticks, measured on the render model in Kalam [CHECK §7]<\/h3>\n<ul>\n<li><strong>Kalam Bold is now installed<\/strong> (<code>~/.local/share/fonts/kalam/<\/code>, OFL, from the google/fonts repo on raw.githubusercontent.com). The checker measures the final font, not the stand-in.<\/li>\n<li>With the stand-in (DkgHandwriting), CHAMBER showed 53 hits. <strong>In Kalam: no overlaps, 17 near-misses under the rules, 9 of them already in locked v1.1.<\/strong><\/li>\n<li><strong>Visual: re-render with Kalam now.<\/strong><\/li>\n<li><strong>New in CHAMBER, and the geometry fix for each:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Hit<\/th>\n<th>Measured<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Hit\">\"free\" ↔ OSC 2 knob<\/td>\n<td data-label=\"Measured\">1.42 (rule 1.5)<\/td>\n<td data-label=\"Fix\">set \"free\" / \"sync\" <strong>0.5 behind<\/strong> the toggle centre → 1.92 / 1.88; toggle gap stays 1.6<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">\"sync\" ↔ NOISE/EXT knob<\/td>\n<td data-label=\"Measured\">1.38<\/td>\n<td data-label=\"Fix\">as above<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">OSC 2's +50° tick / NOISE/EXT's −50° tick ↔ FREE/SYNC nut<\/td>\n<td data-label=\"Measured\"><strong>0.29<\/strong> (rule 0.5)<\/td>\n<td data-label=\"Fix\"><strong>drop these two ticks too<\/strong> (OSC 2 keeps −150 −100 −50 100 150; NOISE keeps −150 −100 50 100 150)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">\"range\" ↔ \"lo\" / \"2'\" (RANGE 1 and 3 feet)<\/td>\n<td data-label=\"Measured\">1.18 / 1.29 (rule 1.5)<\/td>\n<td data-label=\"Fix\">put \"lo\" / \"2'\" at ±152° r 10.8, or \"range\" 0.4 lower<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">\"velocity\" ↔ VEL nut<\/td>\n<td data-label=\"Measured\">1.34<\/td>\n<td data-label=\"Fix\">its above-legend at 7.7 from centre (was 7.4)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">\"spring\" ↔ \"shimmer\" (REVERB TYPE fan)<\/td>\n<td data-label=\"Measured\">1.36<\/td>\n<td data-label=\"Fix\">outer fan row 6.5 → 6.8 (both fans)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- <strong>Inherited from v1.1, also in the locked model (low priority, reported):<\/strong><\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- \"clean\" ↔ \"ping-pong\" 1.20;<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- fan names ↔ their detent ticks 0.70–0.89;<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- ±100° ticks ↔ OSC MOD / FILTER MOD / OSC 3 CTL nuts 0.40;<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- \"status\" ↔ its LED 1.25.<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- <strong>Render note:<\/strong> <code>ld.toggle<\/code> draws every toggle nut Ø 6. The spec's nut is ≈ 9.2 across corners, and the checker uses that. So ticks that look clear in the render sit under the real nut. Real-size nuts would make the 3/4s honest.<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Hit\">- <strong>PARA \"mono / para / +4\"<\/strong> above its toggle: <strong>passes<\/strong> in Kalam. Accepted, as the owner and director did.<\/td>\n<td data-label=\"Measured\"><\/td>\n<td data-label=\"Fix\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>R2.4 Unchanged from rev 1<\/h3>\n<p>Pegs and closed height (+2.6 → ≈ 52.7); the feet at d 6; the lozenge for the name; the states table. The <strong>fallback colouring (maple naturals, walnut sharps)<\/strong> is geometry-identical: only the bought plugs swap.<\/p>\n<\/blockquote>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (systems first).<\/strong> Numbers marked [CHECK] come from <code>../branch_check.py<\/code> §4b and §6.<\/p>\n<h2>1. What changes from FOLD-105, and what doesn't<\/h2>\n<p><strong>Unchanged:<\/strong> both boards, every control position, the Daisy in the base, the slim battery and speaker in the lid band, the hinge and the 40-way ribbon, the brass stays (120°, 44.4 mm, tip ≈ 6.8 N), the I/O (audio/CV jacks + power on the lid's far wall; MIDI IN/OUT + USB-C on the base's right end face), the walnut block + white pickguard construction, screws from the back.<\/p>\n<p><strong>Changes (the outside only, plus the shared FREE / SYNC toggle):<\/strong>\n1. <strong>Reverse peg keys:<\/strong> walnut naturals, maple sharps (§2).\n2. <strong>Lid walls +2.6 mm<\/strong> for peg clearance when closed (§3).\n3. <strong>The façade on the lid back<\/strong> (§4).\n4. <strong>The two front lid-back feet move<\/strong> from d 30 to d 6 (§4).\n5. <strong>RANGE scales in feet<\/strong> (32' … 2'), serif. Graphics only; the RANGE positions are already in feet in the spec.\n6. <strong>FREE / SYNC<\/strong> at lid (133, d 70.6), a black FOLD toggle, legends beside it in the v1.1 type (\"free\" left, \"sync\" right). Serif stays on RANGE and the name only (director).<\/p>\n<h2>2. Keys: reverse pegs on FOLD (J1, J21)<\/h2>\n<ul>\n<li><strong>Part and mechanism:<\/strong> HUSH's, unchanged in principle: 1/2 in (12.7 mm) mushroom button plugs on laser-cut acrylic arms, each <strong>centred over its Choc V2 stem<\/strong>, D31 magnet 10.5 behind the stem over the SS49E (HUSH rev, eng E-L5). Naturals walnut, sharps maple: both are bought button plugs (walnut plugs: availability UNVERIFIED; maple is HUSH's).<\/li>\n<li><strong>Positions (edge A, HUSH's edge-A geometry):<\/strong> naturals at <strong>y 13.5<\/strong>, x 17 + 18n (FOLD keys start x 8); sharps at <strong>y 36<\/strong>, on the white boundaries in piano positions.<\/li>\n<li><strong>Bottom stop:<\/strong> a <strong>14 mm punched felt washer<\/strong> in a 1 mm counterbore in the base pickguard (HUSH used 19 mm collars in felt; 14 mm keeps each washer inside its 18 mm pitch with 4 mm of print between). Head underside 2.5 above the washer at rest; head top <strong>6.5 above the plate<\/strong> (z 22.1) [CHECK].<\/li>\n<li><strong>Strip C moves to HUSH's peg layout<\/strong> (y ≈ 2–50). Strip C is its own board, so the main board is unchanged, <strong>but<\/strong> FOLD's base board must start behind y ≈ 52. <strong>Eng to confirm<\/strong> against the PLAY row's pots (CUTOFF at y 68, r 10.4).<\/li>\n<li><strong>Rule notes:<\/strong> pegs stand 6.5 proud, so the team's R4 \"whites within ≈ 3 mm of the panel\" doesn't hold (HUSH precedent; the owner loves those pegs). The owner's own rule (\"nothing raised between keys and controls\") holds: pegs are the keys.<\/li>\n<li><strong>Owner question (open):<\/strong> reversed colours vs sight-reading.<\/li>\n<\/ul>\n<h2>3. Closed height with pegs [CHECK]<\/h2>\n<ul>\n<li>Closed, <strong>14 lid items land over a peg<\/strong> (V2 and back-row knobs, and the FREE / SYNC toggle).<\/li>\n<li>To keep v1.1's 2.0 mm clearance over a peg head: <strong>lid walls +2.6 mm → closed ≈ 52.7 mm<\/strong> (v1.1 ≈ 50.1). The director's estimate was +4 (≈ 54); the check gives +2.6.<\/li>\n<li>Conservative: toggles are counted at knob height, as in v1.1. Real toggle lever height: <strong>UNVERIFIED<\/strong> (the part isn't chosen).<\/li>\n<li>A pocket in the lid can't help: what lands over the pegs is knobs, not plate.<\/li>\n<li><strong>Open state unaffected:<\/strong> the stand, the stays and the tip figure don't change (+2.6 mm of lid wall moves the lid's centre of gravity by &lt; 1.5 mm [CALC]).<\/li>\n<\/ul>\n<h2>4. The façade (lid back) [CHECK]<\/h2>\n<p><strong>The order of use is the concept<\/strong> (director): closed → you carry the façade (it's the top of the bar); flat (180°) → it's face-down on its feet, and the instrument is just a console; standing (120°) → the façade faces the listener and the console faces you.<\/p>\n<p><strong>Geometry (proposal, the visual designer draws it):<\/strong>\n- <strong>25 pipes, one per key, C to C over 2 octaves: length = L × 2^(−n/12), so the longest is 4× the shortest.<\/strong> L = 66 mm → 66 … 16.5 mm.\n- <strong>Organ-builders' tower:<\/strong> the longest on the axis (x 143), then alternating outward; pitch 10 → field x 18–268.\n- <strong>Pipe feet on one impost line at d 18<\/strong>; tops reach d 84 at the centre.\n- <strong>Screws:<\/strong> the v1.1 back screws at d 12 (x 16, 143, 270) sit on the impost line, under the pipe feet (the director's \"impost rivets\"). The d 96 screws sit above the tallest top. Clear [CHECK].\n- <strong>Feet: clash.<\/strong> v1.1's front pair of lid-back feet (r 6 at x 40 / 246, d 30) land on pipes. <strong>Move them to d 6<\/strong>, under the impost line [CHECK clear]. The rear pair (d 78) is clear. Flat-open support spans d 6–78 instead of 30–78: fine.\n- <strong>No holes in the façade:<\/strong> engraved / filled, or a printed relief in the first build. No acoustic or water path.\n- <strong>Wood-fill PETG engraving with brass-tone fill reads?<\/strong> <strong>UNVERIFIED<\/strong> (eng / maker: a coupon).<\/p>\n<h2>5. Name<\/h2>\n<ul>\n<li>The organ nameboard sits just above the keys. <strong>On FOLD the strip above the keys is ≈ 3 mm tall<\/strong> (sharps end y 54.6; CUTOFF's edge y 57.6, EMPHASIS's 60.55) [CALC]: too small for a cartouche.<\/li>\n<li><strong>Use the v1.1 blank lozenge on the lid axis<\/strong> (behind TAP's lid line, 32 × 6). Standing, it sits above the console, where a nameboard reads. Leave it blank until the owner names it (director).<\/li>\n<\/ul>\n<h2>6. States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What it is<\/th>\n<th>Systems notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>Closed<\/strong><\/td>\n<td data-label=\"What it is\">the organ case: façade on top, ≈ 286 × 108 × <strong>52.7<\/strong><\/td>\n<td data-label=\"Systems notes\">pegs under the lid with 2.0 clear; stays flush in the lid end faces (v1.1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Carried<\/strong><\/td>\n<td data-label=\"What it is\">a bar under the arm or in a bag, façade out<\/td>\n<td data-label=\"Systems notes\">nothing proud; feet are flush rubber (≤ 0.6 proud, v1.1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Flat (180°)<\/strong><\/td>\n<td data-label=\"What it is\">a console on the table; façade face-down on 4 feet<\/td>\n<td data-label=\"Systems notes\">front feet at d 6 now<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Standing (120°)<\/strong><\/td>\n<td data-label=\"What it is\">façade to the listener, console to you<\/td>\n<td data-label=\"Systems notes\">v1.1 stays unchanged: tip ≈ 6.8 N. The lid speaker faces you<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Outdoors<\/strong><\/td>\n<td data-label=\"What it is\">park bench / grass<\/td>\n<td data-label=\"Systems notes\">slim pack ≈ 1.9–3.9 h [CALC]; status light under a hood (common §3); PETG / wood-fill PETG in sun; the friend across the bench sees the façade (J22g)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>7. Jobs this concept leans on (coverage comes at the 9+ check)<\/h2>\n<p>J20 (case and console), J21 (reverse pegs), J22 (bar carry, façade for the friend), J23–J27 (FREE / SYNC + firmware, shared), J28 (FOLD internals unchanged).<\/p>\n<h2>8. Can't verify here<\/h2>\n<p>Walnut button-plug supply · engraved fill on wood-fill PETG · real toggle lever height (closed clearance) · strip C vs base board line · sun readability of the hooded LED · outdoor speaker level.<\/p>", "lead": "Seed: FOLD-105 (v1.1). Kind: an instrument case. Point of view (director, turn 3): closed it's an organ case; open it's a console. Emotion: joy. Read with ../common-how-it-works.md, versions/v1.1/fold/how-it-works.md (rev 5.7) and design/jo", "jump": ["1. What changes from FOLD-105, and what doesn't", "2. Keys: reverse pegs on FOLD (J1, J21)", "3. Closed height with pegs [CHECK]", "4. The façade (lid back) [CHECK]", "5. Name", "6. States", "7. Jobs this concept leans on (coverage comes at the 9+ check)", "8. Can't verify here"], "group": "CHAMBER", "code": "D-101"}, "RAIN-arms-length": {"kind": "image", "sub": "render", "title": "Arm's length (the director's test: calm or not?). Every element's rings die out about 7 mm from its skirt, leaving still pools in the big rear and corner areas; the wide lanes between sections draw the map. Warm stone, two stone-grey key rows, one mustard leaf.", "short": "arms length", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-arms-length.jpg", "thumb": "media/t/RAIN-arms-length.jpg", "w": 1167, "h": 889, "orig": "1167 × 889", "path": "design/branches/concepts/rain/img/rain-arms-length.jpg"}], "group": "RAIN", "src": "media/RAIN-arms-length.jpg", "thumb": "media/t/RAIN-arms-length.jpg", "w": 1167, "h": 889, "orig": "1167 × 889", "path": "design/branches/concepts/rain/img/rain-arms-length.jpg", "code": "RAIN-arms-length"}, "RAIN-close": {"kind": "image", "sub": "render", "title": "Close (rendered before R1, which changed only the outer edge, out of this frame): deep rings hug every knob and toggle, then open out and go shallow before the still band. Words sit on smooth lily pads.", "short": "close", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-close.jpg", "thumb": "media/t/RAIN-close.jpg", "w": 1400, "h": 942, "orig": "2400 × 1615", "path": "design/branches/concepts/rain/img/rain-close.jpg"}], "group": "RAIN", "src": "media/RAIN-close.jpg", "thumb": "media/t/RAIN-close.jpg", "w": 1400, "h": 942, "orig": "2400 × 1615", "path": "design/branches/concepts/rain/img/rain-close.jpg", "code": "RAIN-close"}, "RAIN-ring-pitch-045-06-09": {"kind": "image", "sub": "drawing", "title": "Ring pitch, left to right: 0.45 (v1.1's first-layer rings, the ones he loved: slicer fill, impossible per cell); 0.6 (modelled grooves, needs a 0.25–0.3 nozzle: systems R2.2); 0.9 (modelled grooves on the standard 0.4 nozzle, as drawn).", "short": "ring pitch 045 06 09 · 1:1 at 40 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-ring-pitch-045-06-09.jpg", "thumb": "media/t/RAIN-ring-pitch-045-06-09.jpg", "w": 1600, "h": 613, "orig": "3760 × 1440", "path": "design/branches/concepts/rain/img/rain-ring-pitch-045-06-09-40px-per-mm.png"}], "group": "RAIN", "src": "media/RAIN-ring-pitch-045-06-09.jpg", "thumb": "media/t/RAIN-ring-pitch-045-06-09.jpg", "w": 1600, "h": 613, "orig": "3760 × 1440", "path": "design/branches/concepts/rain/img/rain-ring-pitch-045-06-09-40px-per-mm.png", "code": "RAIN-ring-pitch-045-06-09"}, "RAIN-time-and-pads": {"kind": "image", "sub": "drawing", "title": "TIME, FREE / SYNC and the lily pads from above at native resolution (12.70 px per mm): the 1.0 band inside the echo section, the 3.0 band to its neighbours.", "short": "time and pads · 1:1 at 12.70 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-time-and-pads.jpg", "thumb": "media/t/RAIN-time-and-pads.jpg", "w": 990, "h": 736, "orig": "990 × 736", "path": "design/branches/concepts/rain/img/rain-time-and-pads-12.70px-per-mm.png"}], "group": "RAIN", "src": "media/RAIN-time-and-pads.jpg", "thumb": "media/t/RAIN-time-and-pads.jpg", "w": 990, "h": 736, "orig": "990 × 736", "path": "design/branches/concepts/rain/img/rain-time-and-pads-12.70px-per-mm.png", "code": "RAIN-time-and-pads"}, "RAIN-pegs": {"kind": "image", "sub": "drawing", "title": "The stepping stones: pegs on felt washers in two warm stone greys, rippled like everything else (12.70 px per mm). Rendered before R1: here the rings still reach the front edge; they now fade into a 1.5 mm still margin.", "short": "pegs · 1:1 at 12.70 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-pegs.jpg", "thumb": "media/t/RAIN-pegs.jpg", "w": 1016, "h": 838, "orig": "1016 × 838", "path": "design/branches/concepts/rain/img/rain-pegs-12.70px-per-mm.png"}], "group": "RAIN", "src": "media/RAIN-pegs.jpg", "thumb": "media/t/RAIN-pegs.jpg", "w": 1016, "h": 838, "orig": "1016 × 838", "path": "design/branches/concepts/rain/img/rain-pegs-12.70px-per-mm.png", "code": "RAIN-pegs"}, "RAIN-top": {"kind": "image", "sub": "drawing", "title": "Exact top view, 12.70 px per mm: a reference for measuring, not \"real size\" on a screen. Rendered before R1 (the edge is now a still margin; only the arm's-length view was re-rendered, as asked).", "short": "top · 1:1 at 12.70 px/mm", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/RAIN-top.jpg", "thumb": "media/t/RAIN-top.jpg", "w": 1600, "h": 1052, "orig": "3555 × 2337", "path": "design/branches/concepts/rain/img/rain-top-12.70px-per-mm.png"}], "group": "RAIN", "src": "media/RAIN-top.jpg", "thumb": "media/t/RAIN-top.jpg", "w": 1600, "h": 1052, "orig": "3555 × 2337", "path": "design/branches/concepts/rain/img/rain-top-12.70px-per-mm.png", "code": "RAIN-top"}, "D-104": {"kind": "doc", "sub": "doc", "title": "RAIN · how it looks and feels", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2"}], "path": "design/branches/concepts/rain/how-it-looks-and-feels.md", "html": "<h1>RAIN: how it looks and feels (visual)<\/h1>\n<p>Seed: ONE SHEET (v1.1, 276 × 180). Kind: a landscape. <strong>Point of view: every control is a drop on still water; its rings spread and fade, and the still water between them draws the panel's map.<\/strong> Rule: <em>everything that breaks the surface ripples.<\/em> Emotion: calm. Read with <a href=\"#i-D-103\"><code>how-it-works.md<\/code><\/a> (systems rev 2) and <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a> (rev 2).<\/p>\n<p><strong>Rev 2.2, 2026-11-13 (R1 as the director meant it: every element's rings die out about 7 mm from its skirt, leaving still pools beyond; the outline is also still).<\/strong> Supersedes rev 1. Images in <code>img/<\/code> (from <code>_mock-src/rb.py<\/code> + <code>figs_rb.py<\/code>). The ring field is computed from the real layout. Only the images the fixes needed were re-rendered.<\/p>\n<h2>What changed in rev 2 (the director's fixes)<\/h2>\n<ol>\n<li><strong>The ripples decay.<\/strong> Built the way a face-down print can make it (systems R2.2):\n   - near each stone, <strong>deep rings (0.4) at 0.9 pitch<\/strong>, at least 2–3 hugging every element;\n   - further out, <strong>shallow rings (0.2) at 1.8 pitch<\/strong>;\n   - then smooth water up to the band.\n   - The depth step and the opening spacing <em>are<\/em> the decay. Still two finishes (smooth, rings).<\/li>\n<li><strong>Sections are wider still bands:<\/strong>\n   - <strong>1.0 mm inside a section, 3.0 between sections.<\/strong> Each cell's edges are pulled back by half the band toward that neighbour.\n   - Sections are the v1.1 map: keys; PLAY pitch / filter / fx; VOICE oscillators / mixer / contours; back row drift / echo / reverb / volume. FREE / SYNC belongs to echo.\n   - The wide bands now read as lanes of still water between the sections. The seams draw the map.<\/li>\n<li><strong>Warm palette, off concrete:<\/strong>\n   - shell pale warm stone #ddd3c1;\n   - deep rings #b9ab93, shallow rings #cbbfaa;\n   - pegs two warm stone greys (#aaa192 / #6e675b);\n   - the one mustard leaf (CUTOFF) kept, no second accent.\n   - <strong>R1 (director): no exception at the edge.<\/strong> The fade finishes everywhere: the panel's outline is a 1.5 mm still band, like the 3.0 seams between sections (half of it each side). The rings die out before the chamfer, so the shell's edge reads as the pond's still margin.\n   - <strong>The vertical walls can't carry modelled rings:<\/strong> printed face down, their surface is layer lines. They're the warm stone, and their own fine horizontal ripple is the layer lines.<\/li>\n<li><strong>Legends: 0 collisions<\/strong> in <code>branch_check.py<\/code> §7, inherited v1.1 ones included. Branch-only fixes:\n   - type-name rows raised (inner 3.8, outer 6.6);\n   - ticks under toggle nuts dropped;\n   - \"FREE\" / \"SYNC\" 0.5 behind the toggle centre;\n   - STATUS beside its hood;\n   - the back row says ECHO TYPE / REVERB TYPE in front, TIME / DECAY behind (no headings in RAIN).<\/li>\n<li><strong>Pitch compare, three ways:<\/strong> the drawing below. The words are here, not in it.<\/li>\n<li><strong>Re-rendered at arm's length and close.<\/strong><\/li>\n<\/ol>\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-arms-length.jpg\" width=\"1167\" height=\"889\" alt=\"RAIN at arm's length: warm stone panel, rings fading round every control, still-water lanes between sections, one mustard knob\" loading=\"lazy\"><\/span><figcaption>Arm's length (the director's test: calm or not?). Every element's rings die out about 7 mm from its skirt, leaving still pools in the big rear and corner areas; the wide lanes between sections draw the map. Warm stone, two stone-grey key rows, one mustard leaf. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-close.jpg\" width=\"1400\" height=\"942\" alt=\"RAIN close-up: deep rings hugging each knob and toggle, fading outward, words on smooth lily pads\" loading=\"lazy\"><\/span><figcaption>Close (rendered before R1, which changed only the outer edge, out of this frame): deep rings hug every knob and toggle, then open out and go shallow before the still band. Words sit on smooth lily pads. · render<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-ring-pitch-045-06-09.jpg\" width=\"1600\" height=\"613\" alt=\"Three ring patches around the same knob, ring pitch 0.45, 0.6 and 0.9 mm, with a 10 mm scale bar\" loading=\"lazy\"><\/span><figcaption>Ring pitch, left to right: 0.45 (v1.1's first-layer rings, the ones he loved: slicer fill, impossible per cell); 0.6 (modelled grooves, needs a 0.25–0.3 nozzle: systems R2.2); 0.9 (modelled grooves on the standard 0.4 nozzle, as drawn). · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-time-and-pads.jpg\" width=\"990\" height=\"736\" alt=\"Top-view detail around TIME, FREE / SYNC and DECAY, rings and lily pads, 10 mm scale bar\" loading=\"lazy\"><\/span><figcaption>TIME, FREE / SYNC and the lily pads from above at native resolution (12.70 px per mm): the 1.0 band inside the echo section, the 3.0 band to its neighbours. · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-pegs.jpg\" width=\"1016\" height=\"838\" alt=\"Top-view detail of the stepping-stone pegs with fading rings\" loading=\"lazy\"><\/span><figcaption>The stepping stones: pegs on felt washers in two warm stone greys, rippled like everything else (12.70 px per mm). Rendered before R1: here the rings still reach the front edge; they now fade into a 1.5 mm still margin. · drawing<\/figcaption><\/figure>\n\n<figure><span class=\"ref\"><img data-done src=\"media/RAIN-top.jpg\" width=\"1600\" height=\"1052\" alt=\"RAIN orthographic top view\" loading=\"lazy\"><\/span><figcaption>Exact top view, 12.70 px per mm: a reference for measuring, not \"real size\" on a screen. Rendered before R1 (the edge is now a still margin; only the arm's-length view was re-rendered, as asked). · drawing<\/figcaption><\/figure>\n\n<h2>Principles<\/h2>\n<ol>\n<li><strong>Everything that breaks the surface ripples.<\/strong> Knobs, CUTOFF, the TYPE switches, toggles, the stick, TAP, the status hood, the 25 pegs and FREE / SYNC.<\/li>\n<li><strong>Ripples lose amplitude.<\/strong> Deep and close near the stone, shallow and open further out, then still. <em>Because<\/em> real water does, and because a uniform field read as crazed stone at arm's length (round 1).<\/li>\n<li><strong>The still water is the map.<\/strong> A narrow still band between two controls of one section, a wide one between sections. No grooves, no headings.<\/li>\n<li><strong>Words float on lily pads:<\/strong> smooth rounded pads (0.85 margin, R 1.2) cut out of the field.<\/li>\n<li><strong>One leaf.<\/strong> CUTOFF in mustard is the only colour.<\/li>\n<\/ol>\n<h2>Look (spec for the build)<\/h2>\n<ul>\n<li><strong>Shell:<\/strong> warm stone PETG (#ddd3c1 drawn), face down on smooth PEI. One filament, one swap (legends dark #2e2924, Inter SemiBold caps 1.9).<\/li>\n<li><strong>Rings:<\/strong> modelled grooves 0.45 wide.<\/li>\n<li><strong>Deep zone:<\/strong> 0.4 deep at 0.9 pitch. It reaches at least 2.4 mm past the ring start, or half the way to the band, whichever is larger.<\/li>\n<li><strong>Shallow zone:<\/strong> 0.2 deep at 1.8 pitch, ending short of the band by 14 % of the span.<\/li>\n<li><strong>Reach (R1):<\/strong> deep rings stop 3.5 mm past the ring start, shallow rings 7.0 mm past it. Beyond that, whatever the cell size, it's a still pool. No long straight hatching in the big rear and corner cells.<\/li>\n<li>Ring starts:<ul>\n<li>knobs 7.75;<\/li>\n<li>CUTOFF 10.9;<\/li>\n<li>toggles and hood 3.7;<\/li>\n<li>stick 9.3;<\/li>\n<li>TAP 7.6;<\/li>\n<li>pegs 7.3.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Bands:<\/strong> 1.0 inside a section, 3.0 between, 1.5 at the panel's outline (power diagram weighted by ring start, each edge pulled back by half its band; the outline counts as an edge, R1).<\/li>\n<li><strong>Knobs:<\/strong> cream KN1250; CUTOFF mustard 1083 (#c9a032).<\/li>\n<li><strong>Pegs:<\/strong> HUSH's 12.7 button plugs in two warm stone greys on 14 mm felt washers; whites y 14, sharps y 36.5; width stays 276.<\/li>\n<li><strong>FREE / SYNC:<\/strong> one more stone; \"FREE\" / \"SYNC\" beside it on pads.<\/li>\n<li><strong>TIME:<\/strong> two scales over ±135° (ticks inner, division marks outer). No numbers. DIPTYCH's numbered dial is available as a donor.<\/li>\n<li><strong>Status:<\/strong> hooded LED, legend beside it.<\/li>\n<li><strong>Sound (optional):<\/strong> a soft \"drop\" at power-on (firmware, $0; power-off is impossible on the hard switch).<\/li>\n<\/ul>\n<h2>Honest read of the round-2 renders<\/h2>\n<ul>\n<li><strong>Arm's length:<\/strong> the crazed-stone look is gone. What reads now is soft rings round each control and pale lanes between the sections. It's calmer, and the map is visible. It's still the busiest of the concepts: the rear band (type names, jack pads, the back row) carries the most texture. Renders flatten sheen, so the coupon under a tree is still the real test.<\/li>\n<li><strong>Close:<\/strong> the best it has looked; the rings now \"land\" on each control.<\/li>\n<li><strong>0.9 vs 0.45:<\/strong> coarser, shown honestly side by side. 0.6 needs a finer nozzle.<\/li>\n<\/ul>\n<h2>Open<\/h2>\n<ul>\n<li><strong>The coupon:<\/strong> deep + shallow rings, a 1.0 and a 3.0 band, a lily pad, at 0.9 pitch, seen under a tree. Does a 0.2-deep ring read at all (systems: UNVERIFIED)?<\/li>\n<li>A 0.25–0.3 nozzle at Vector Space for 0.6 pitch (systems: UNVERIFIED).<\/li>\n<li>One-piece print on a 350 bed (the field must be unbroken).<\/li>\n<\/ul>", "lead": "Seed: ONE SHEET (v1.1, 276 × 180). Kind: a landscape. Point of view: every control is a drop on still water; its rings spread and fade, and the still water between them draws the panel's map. Rule: everything that breaks the surface ripples", "jump": ["What changed in rev 2 (the director's fixes)", "Principles", "Look (spec for the build)", "Honest read of the round-2 renders", "Open"], "group": "RAIN", "code": "D-104"}, "D-103": {"kind": "doc", "sub": "doc", "title": "RAIN · how it works", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2"}], "path": "design/branches/concepts/rain/how-it-works.md", "html": "<h1>RAIN: how it works (systems)<\/h1>\n<blockquote>\n<p><strong>2026-11-13, keys:<\/strong> the peg mount is redone in <a href=\"#i-D-110\"><code>../cathedral/how-it-works.md<\/code><\/a> §10. Stock plugs have ⅛–¼ in tenons; the 1/2 in size is the hole, not the head. The same carrier, stop and options apply here. Rev 2's shank-through-the-deck description is superseded.<\/p>\n<\/blockquote>\n<p>Seed: <strong>ONE SHEET<\/strong> (v1.1, 276 × 180). Kind: a landscape. Point of view: <strong>every control is a drop on still water; its rings spread until they meet the next drop's, and the meeting lines draw the panel's map.<\/strong> Rule: <em>everything that breaks the surface ripples.<\/em> Emotion: calm. Read with <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>, <a href=\"#i-D-015\"><code>versions/v1.1/one-sheet/how-it-works.md<\/code><\/a>, <a href=\"#i-D-003\"><code>versions/v1.1/common-how-it-works.md<\/code><\/a> and <code>design/jobs.md<\/code> rev 5.<\/p>\n<p><strong>Rev 2, 2026-11-13 (round 1 scored 7; director's fixes).<\/strong> Numbers marked [CHECK] are from <code>../branch_check.py<\/code> §7 (the current <code>rb.rain()<\/code> model, legends measured with OpenSCAD).<\/p>\n<blockquote>\n<h3>R2.1 Legend and tick collisions, as the model stands now [CHECK §7]<\/h3>\n<ul>\n<li><strong>No legend overlaps.<\/strong> The director's REVERB TYPE ↔ VELOCITY and ECHO TYPE ↔ OSC 3 CTL clashes don't appear in today's <code>rb.rain()<\/code>; they were fixed in parallel.<\/li>\n<li><strong>One branch-new hit:<\/strong> OSC 2's +50° tick and NOISE/EXT's −50° tick sit <strong>0.05 mm<\/strong> from the FREE / SYNC nut (rule 0.5; real nut ≈ 9.2 across corners). <strong>Drop both<\/strong> (same fix as CHAMBER).<\/li>\n<li><strong>Inherited from v1.1 (in the locked ONE SHEET too):<\/strong><\/li>\n<li>STATUS ↔ MOD MIX legend 1.38;<\/li>\n<li>STATUS ↔ its LED 1.33;<\/li>\n<li>±100° ticks ↔ OSC MOD / FILTER MOD / OSC 3 CTL nuts 0.22.<\/li>\n<li><strong>Re-run the checker after every legend move.<\/strong> Ripple decay and wider section bands move the lily pads, not the legends, so the counts should hold.<\/li>\n<\/ul>\n<h3>R2.2 Making the decaying ripples (director fix 1), from what a printer can do<\/h3>\n<ul>\n<li>First layers face down at 0.2 mm, with a 0.4 nozzle:<\/li>\n<li><strong>depth has only two steps<\/strong> (0.4 → 0.2 → 0);<\/li>\n<li><strong>a groove can't be narrower than one line<\/strong> (≈ 0.4).<\/li>\n<li>So \"amplitude decays toward the seam\" has to be built from:\n  1. <strong>ring spacing that opens up<\/strong> toward the seam, e.g. pitch 0.9 at the stone → ≈ 1.8 at the outer third, then none;\n  2. the <strong>depth step<\/strong> (0.4 near the stone, 0.2 outside);\n  3. the last ring stopping short of the seam, so the still band is smooth.<\/li>\n<\/ul>\n<p>Still two finishes (smooth / rings). The coupon decides whether 0.2-deep rings read at all (<strong>UNVERIFIED<\/strong>).\n- <strong>Wider section bands (fix 2):<\/strong>\n  - a power diagram with weights set so a seam between sections is ≈ 3× one inside (e.g. still band ≈ 1.0 inside a section, ≈ 3.0 between);\n  - the bands are where the rings stop, not extra grooves.\n  - Check after: every legend's lily pad still sits inside its own cell (the visual designer's code computes the pads).\n- <strong>Pitch compare (fix 5):<\/strong> 0.45 is v1.1's first-layer line pitch (rings from the slicer's concentric fill, impossible per Voronoi cell). Modelled grooves can go to ≈ 0.8–0.9 at a 0.4 nozzle (groove + land ≥ 2 lines). <strong>A 0.6 pitch would need a 0.25–0.3 nozzle: a nozzle swap at Vector Space (UNVERIFIED that they have one).<\/strong><\/p>\n<\/blockquote>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (systems first).<\/strong><\/p>\n<h2>1. What changes from ONE SHEET, and what doesn't<\/h2>\n<p><strong>Unchanged:<\/strong> the shell's outline and heights (276 × 180, deck z 24); the main board and every control; the I/O board on the rear wall; the speaker (bottom-firing at (240, 113)); the battery; the back panel and its 8 screws; the two finishes (smooth and rings, the owner's rule).<\/p>\n<p><strong>Changes:<\/strong>\n1. <strong>The ring field runs to every edge<\/strong>, including the side walls' top chamfer. Section grooves and section headings go: <strong>the Voronoi seams are the section marks<\/strong> (director: \"Courage!\").\n2. <strong>Rings are modelled geometry, not a slicer pattern<\/strong> (§3).\n3. <strong>Peg keys as stepping stones<\/strong>; the key window becomes a deck (§2).\n4. <strong>FREE / SYNC<\/strong> at (128.0, 132.7): one more stone, so it ripples. Legends beside it (common §2). With no headings in RAIN, common §2's MIXER move doesn't arise.\n5. <strong>Legends on smooth \"lily pads\"<\/strong> cut out of the ring field.<\/p>\n<h2>2. Keys: pegs on ONE SHEET (J1, J21) [CHECK]<\/h2>\n<ul>\n<li><strong>Mechanism:<\/strong> HUSH's: 1/2 in button plugs on acrylic arms, centred over the Choc V2 stems, magnet 10.5 behind. Whites at x 12 + 18n (HUSH x − 7). Two stone greys (white / sharp distinction kept, director).<\/li>\n<li><strong>Width:<\/strong> the visual designer's \"+8 mm\" assumed HUSH's 19 mm felt collar. Checked:<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bottom stop<\/th>\n<th>Last peg to the outside<\/th>\n<th>To the flat (R 2 edge)<\/th>\n<th>Width needed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Bottom stop\">HUSH's 19 mm felt collar<\/td>\n<td data-label=\"Last peg to the outside\">2.5<\/td>\n<td data-label=\"To the flat (R 2 edge)\">0.5<\/td>\n<td data-label=\"Width needed\"><strong>+5 mm (281)<\/strong> for ≥ 3 mm on the flat<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Bottom stop\"><strong>14 mm felt washer (pick)<\/strong><\/td>\n<td data-label=\"Last peg to the outside\">5.0<\/td>\n<td data-label=\"To the flat (R 2 edge)\"><strong>3.0<\/strong><\/td>\n<td data-label=\"Width needed\"><strong>276, unchanged<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Bottom stop\">head only<\/td>\n<td data-label=\"Last peg to the outside\">5.65<\/td>\n<td data-label=\"To the flat (R 2 edge)\">3.65<\/td>\n<td data-label=\"Width needed\">276<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pick: the 14 mm washer<\/strong> in a 1 mm counterbore, ringed by ripples. ONE SHEET stays 276 wide.\n- <strong>Edge A with pegs:<\/strong> the washer would allow whites at y ≈ 9, but <strong>strip C sets the limit<\/strong>: in HUSH it reaches ≈ 11.5 in front of the white stems (stems y 13.5, strip C from y ≈ 2), and ONE SHEET's front wall is 2.4 thick. So whites at <strong>y ≈ 14<\/strong> (head front ≈ 7.65 from the front face) and sharps at y ≈ 36.5 [CALC]. That's HUSH's edge A, essentially.\n- <strong>The key window closes into a printed deck with 25 holes<\/strong>, one per peg shank, each with its own ring field. Hole size as HUSH (<strong>UNVERIFIED<\/strong>: shank Ø not restated in HUSH's file).\n- <strong>Strip C moves to peg positions<\/strong> (stems under the pegs: strip C ≈ y 2.4–50.5 [CALC from HUSH]). The main board must start behind it. <strong>Eng (E-L9 again).<\/strong>\n- <strong>Height:<\/strong> heads 6.5 proud (R4's \"≈ 3 mm\" doesn't hold; HUSH precedent). The body height is unchanged; the heads rise above the deck.\n- <strong>Bag (J6):<\/strong> the owner deferred case work for ONE SHEET. With pegs 6.5 proud, a bag's side loads land on the pegs and arms (pressed down they're harmless when off; sideways is untested). <strong>Risk, UNVERIFIED<\/strong>; a sleeve would fix it, but that's the owner's deferred topic.<\/p>\n<h2>3. Making the rings (J11)<\/h2>\n<ul>\n<li>A slicer's concentric pattern follows a region's outline, so a Voronoi cell would get polygon rings (visual's finding, agreed). <strong>Model the grooves<\/strong>: each groove ≈ 0.45 wide at ≥ 0.9 pitch, 0.2–0.4 deep, in the first layers printed face down, generated per control as circles clipped to that control's Voronoi cell. OpenSCAD can do it (the cells' intersection is cheap); the face is ≈ 276 × 180 of grooves, so render time is long but bounded (<strong>UNVERIFIED<\/strong>).<\/li>\n<li><strong>The print split (common §5, x 122.5) loses its hiding place.<\/strong> In v1.1 the joint sits in the bottom of the x 122.5 groove; RAIN has no grooves. Options:\n  1. <strong>Print in one piece<\/strong> on a 350 bed (Voron 350 at Vector Space, <strong>UNVERIFIED<\/strong>). Recommended: the field must be unbroken.\n  2. Split along a <strong>Voronoi seam<\/strong> (a jagged lap joint). It hides, but the cut path is irregular and the lap is harder to make.<\/li>\n<li><strong>The ring coupon<\/strong> (smooth + rings, already pending for ONE SHEET) now also decides RAIN's pitch and look. The director wants it seen under a tree.<\/li>\n<\/ul>\n<h2>4. Power-on, not power-off<\/h2>\n<p>The director's \"a drop when you close it\" can't happen at power-off: the hard switch kills the Daisy instantly. <strong>A single soft \"drop\" when the status light reaches ready<\/strong> (firmware, $0, off by a key combo) is the honest version. Optional, not part of the concept test.<\/p>\n<h2>5. States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What it is<\/th>\n<th>Systems notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>Closed<\/strong><\/td>\n<td data-label=\"What it is\">n/a: ONE SHEET has nothing to close<\/td>\n<td data-label=\"Systems notes\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Carried<\/strong><\/td>\n<td data-label=\"What it is\">in a bag<\/td>\n<td data-label=\"Systems notes\">pegs exposed (risk above); jacks on the rear wall; the power switch is recessed (H7)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Flat<\/strong><\/td>\n<td data-label=\"What it is\">on a table, a lap, a bench<\/td>\n<td data-label=\"Systems notes\">as ONE SHEET; pegs at the front edge<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Standing<\/strong><\/td>\n<td data-label=\"What it is\">n/a (no stand; J18 optional, not taken)<\/td>\n<td data-label=\"Systems notes\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Outdoors<\/strong><\/td>\n<td data-label=\"What it is\">grass, bench, dappled shade<\/td>\n<td data-label=\"Systems notes\">the speaker fires down into the grass (weak outdoors, UNVERIFIED); status light hood (common §3); legends on lily pads: readable in sun <strong>to be proven<\/strong> by a render and the coupon<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Can't verify here<\/h2>\n<p>The ring pitch's look at 0.9 vs v1.1's 0.45 · Voron 350 availability · peg shank hole · strip C vs the main board · peg survival in a bag · lily-pad legibility in sun · render time of the full grooved face.<\/p>", "lead": "> 2026-11-13, keys: the peg mount is redone in ../cathedral/how-it-works.md §10. Stock plugs have ⅛–¼ in tenons; the 1/2 in size is the hole, not the head. The same carrier, stop and options apply here. Rev 2's shank-through-the-deck descri", "jump": ["1. What changes from ONE SHEET, and what doesn't", "2. Keys: pegs on ONE SHEET (J1, J21) [CHECK]", "3. Making the rings (J11)", "4. Power-on, not power-off", "5. States", "6. Can't verify here"], "group": "RAIN", "code": "D-103"}, "BUTTERFLY-the-look": {"kind": "image", "sub": "render", "title": "BUTTERFLY: the look, bone print beside oiled walnut", "short": "the look", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-the-look.jpg", "thumb": "media/t/BUTTERFLY-the-look.jpg", "w": 1400, "h": 874, "orig": "2267 × 1416", "path": "design/branches/concepts/butterfly/img/butterfly.jpg"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-the-look.jpg", "thumb": "media/t/BUTTERFLY-the-look.jpg", "w": 1400, "h": 874, "orig": "2267 × 1416", "path": "design/branches/concepts/butterfly/img/butterfly.jpg", "code": "BUTTERFLY-the-look"}, "BUTTERFLY-from-behind": {"kind": "image", "sub": "render", "title": "From behind: the walnut top overhangs the printed rear wall, the jacks sheltered under its live edge", "short": "from behind", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-from-behind.jpg", "thumb": "media/t/BUTTERFLY-from-behind.jpg", "w": 1400, "h": 845, "orig": "2400 × 1448", "path": "design/branches/concepts/butterfly/img/butterfly-from-behind.jpg"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-from-behind.jpg", "thumb": "media/t/BUTTERFLY-from-behind.jpg", "w": 1400, "h": 845, "orig": "2400 × 1448", "path": "design/branches/concepts/butterfly/img/butterfly-from-behind.jpg", "code": "BUTTERFLY-from-behind"}, "BUTTERFLY-joint": {"kind": "image", "sub": "render", "title": "The joint and the butterfly key, close", "short": "joint", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-joint.jpg", "thumb": "media/t/BUTTERFLY-joint.jpg", "w": 1400, "h": 841, "orig": "2400 × 1441", "path": "design/branches/concepts/butterfly/img/butterfly-joint.jpg"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-joint.jpg", "thumb": "media/t/BUTTERFLY-joint.jpg", "w": 1400, "h": 841, "orig": "2400 × 1441", "path": "design/branches/concepts/butterfly/img/butterfly-joint.jpg", "code": "BUTTERFLY-joint"}, "BUTTERFLY-on-the-wall": {"kind": "image", "sub": "render", "title": "On the wall, tree side up: a straight elevation", "short": "on the wall", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-on-the-wall.jpg", "thumb": "media/t/BUTTERFLY-on-the-wall.jpg", "w": 1400, "h": 1110, "orig": "2400 × 1902", "path": "design/branches/concepts/butterfly/img/butterfly-on-the-wall.jpg"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-on-the-wall.jpg", "thumb": "media/t/BUTTERFLY-on-the-wall.jpg", "w": 1400, "h": 1110, "orig": "2400 × 1902", "path": "design/branches/concepts/butterfly/img/butterfly-on-the-wall.jpg", "code": "BUTTERFLY-on-the-wall"}, "BUTTERFLY-rear-section": {"kind": "image", "sub": "drawing", "title": "Section through the rear band: 6 mm walnut in a rebate over the printed apron, screws in slotted holes, v1.1 jacks below (24 px per mm)", "short": "rear section · 1:1 at 24 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-rear-section.jpg", "thumb": "media/t/BUTTERFLY-rear-section.jpg", "w": 1600, "h": 640, "orig": "2400 × 960", "path": "design/branches/concepts/butterfly/img/butterfly-rear-section-24px-per-mm.png"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-rear-section.jpg", "thumb": "media/t/BUTTERFLY-rear-section.jpg", "w": 1600, "h": 640, "orig": "2400 × 960", "path": "design/branches/concepts/butterfly/img/butterfly-rear-section-24px-per-mm.png", "code": "BUTTERFLY-rear-section"}, "BUTTERFLY-joint-top": {"kind": "image", "sub": "drawing", "title": "The joint from above, native resolution (11.49 px per mm)", "short": "joint top · 1:1 at 11.49 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-joint-top.jpg", "thumb": "media/t/BUTTERFLY-joint-top.jpg", "w": 873, "h": 849, "orig": "873 × 849", "path": "design/branches/concepts/butterfly/img/butterfly-joint-top-11.49px-per-mm.png"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-joint-top.jpg", "thumb": "media/t/BUTTERFLY-joint-top.jpg", "w": 873, "h": 849, "orig": "873 × 849", "path": "design/branches/concepts/butterfly/img/butterfly-joint-top-11.49px-per-mm.png", "code": "BUTTERFLY-joint-top"}, "BUTTERFLY-time-dial": {"kind": "image", "sub": "drawing", "title": "TIME's two scales and FREE / SYNC, ONE SHEET style (11.49 px per mm)", "short": "time dial · 1:1 at 11.49 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-time-dial.jpg", "thumb": "media/t/BUTTERFLY-time-dial.jpg", "w": 896, "h": 585, "orig": "896 × 585", "path": "design/branches/concepts/butterfly/img/butterfly-time-dial-11.49px-per-mm.png"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-time-dial.jpg", "thumb": "media/t/BUTTERFLY-time-dial.jpg", "w": 896, "h": 585, "orig": "896 × 585", "path": "design/branches/concepts/butterfly/img/butterfly-time-dial-11.49px-per-mm.png", "code": "BUTTERFLY-time-dial"}, "BUTTERFLY-top": {"kind": "image", "sub": "drawing", "title": "BUTTERFLY true-scale top view: 11.49 px per mm", "short": "top · 1:1 at 11.49 px/mm", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1", "src": "media/BUTTERFLY-top.jpg", "thumb": "media/t/BUTTERFLY-top.jpg", "w": 1600, "h": 1120, "orig": "3218 × 2252", "path": "design/branches/concepts/butterfly/img/butterfly-top-11.49px-per-mm.png"}], "group": "BUTTERFLY", "src": "media/BUTTERFLY-top.jpg", "thumb": "media/t/BUTTERFLY-top.jpg", "w": 1600, "h": 1120, "orig": "3218 × 2252", "path": "design/branches/concepts/butterfly/img/butterfly-top-11.49px-per-mm.png", "code": "BUTTERFLY-top"}, "D-108": {"kind": "doc", "sub": "doc", "title": "BUTTERFLY · how it looks and feels", "stage": "Concept", "status": "dropped", "date": "13 Nov", "revs": [{"rev": "A", "line": "branches round 1"}], "path": "design/branches/concepts/butterfly/how-it-looks-and-feels.md", "html": "<h1>BUTTERFLY: how it looks and feels (visual)<\/h1>\n<p>Seed: ONE SHEET (v1.1, 276 × 180). Kind: furniture. <strong>Point of view: from tool to tree, front to back.<\/strong> Exact at the playing edge, free at the rear. Emotion: longing. Flat keys (the set's non-peg answer). Read with <a href=\"#i-D-107\"><code>how-it-works.md<\/code><\/a> (systems rev 1) and <a href=\"#i-D-003\"><code>../common-how-it-works.md<\/code><\/a>.<\/p>\n<p><strong>Rev 1, 2026-11-13, concept turn 1 (visual).<\/strong> Images in <code>img/<\/code> (from <code>_mock-src/rb.py<\/code> + <code>figs_rb.py<\/code>).<\/p>\n<h2>Images<\/h2>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-the-look.jpg\" width=\"1400\" height=\"874\" alt=\"BUTTERFLY: the look, bone print beside oiled walnut\" loading=\"lazy\"><\/span><figcaption>BUTTERFLY: the look, bone print beside oiled walnut · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-from-behind.jpg\" width=\"1400\" height=\"845\" alt=\"From behind: the walnut top overhangs the printed rear wall, the jacks sheltered under its live edge\" loading=\"lazy\"><\/span><figcaption>From behind: the walnut top overhangs the printed rear wall, the jacks sheltered under its live edge · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-joint.jpg\" width=\"1400\" height=\"841\" alt=\"The joint and the butterfly key, close\" loading=\"lazy\"><\/span><figcaption>The joint and the butterfly key, close · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-on-the-wall.jpg\" width=\"1400\" height=\"1110\" alt=\"On the wall, tree side up: a straight elevation\" loading=\"lazy\"><\/span><figcaption>On the wall, tree side up: a straight elevation · render<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-rear-section.jpg\" width=\"1600\" height=\"640\" alt=\"Section through the rear band: 6 mm walnut in a rebate over the printed apron, screws in slotted holes, v1.1 jacks below (24 px per mm)\" loading=\"lazy\"><\/span><figcaption>Section through the rear band: 6 mm walnut in a rebate over the printed apron, screws in slotted holes, v1.1 jacks below (24 px per mm) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-joint-top.jpg\" width=\"873\" height=\"849\" alt=\"The joint from above, native resolution (11.49 px per mm)\" loading=\"lazy\"><\/span><figcaption>The joint from above, native resolution (11.49 px per mm) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-time-dial.jpg\" width=\"896\" height=\"585\" alt=\"TIME's two scales and FREE / SYNC, ONE SHEET style (11.49 px per mm)\" loading=\"lazy\"><\/span><figcaption>TIME's two scales and FREE / SYNC, ONE SHEET style (11.49 px per mm) · drawing<\/figcaption><\/figure>\n<figure><span class=\"ref\"><img src=\"media/BUTTERFLY-top.jpg\" width=\"1600\" height=\"1120\" alt=\"BUTTERFLY true-scale top view: 11.49 px per mm\" loading=\"lazy\"><\/span><figcaption>BUTTERFLY true-scale top view: 11.49 px per mm · drawing<\/figcaption><\/figure>\n<h2>Systems' changes: I accept them<\/h2>\n<ul>\n<li><strong>The walnut is a 6 mm top laid in a rebate over the printed apron, with the v1.1 jacks below it<\/strong> (systems §3).<\/li>\n<li>It's better furniture than my drilled rail: a tabletop over an apron is the honest version.<\/li>\n<li>The jacks sheltered under a live edge, \"like a drawer under a tabletop\", is a nicer detail than holes in wood.<\/li>\n<li><strong>The joint at y 165<\/strong>, not my y 160: the type names would have been cut.<\/li>\n<li><strong>End match, not bookmatch<\/strong>, and the butterfly genuinely holding an end butt: accepted. The precedent is unverified, and I say so.<\/li>\n<\/ul>\n<h2>Principles<\/h2>\n<ol>\n<li><strong>Precision runs from front to back.<\/strong> The key edge is exact; the face is exact and printed; the joint is exact and shown; the rear is the tree's own edge. One sentence, every line.<\/li>\n<li><strong>The joint is the only ornament, and it works.<\/strong> One straight joint, one butterfly across the leaves' end butt on the axis. Nothing else is added.<\/li>\n<li><strong>Two materials, honestly next to each other.<\/strong>\n   - Matte <strong>bone<\/strong> PETG (#e2dacb drawn; the director suggested stone/bone against walnut) and oiled walnut.\n   - No faux-wood print anywhere.\n   - <em>Because<\/em> real wood makes glossy cream look like plastic. Matte bone looks like a deliberate partner, as plaster does next to oak.<\/li>\n<li><strong>Lighter than it looks.<\/strong> 6 mm of walnut (≈ 25–30 g, systems ESTIMATE) on a hollow shell. It should surprise in the hand.<\/li>\n<li><strong>It lives on the wall.<\/strong> Tree side up, like a small shelf.<\/li>\n<\/ol>\n<h2>Look<\/h2>\n<ul>\n<li><strong>Shell:<\/strong> v1.1 ONE SHEET in matte bone, two finishes (smooth, rings in #c9bfac), v1.1 grooves and type, edge A keys.<\/li>\n<li>The MIXER heading sits at y 136 (common §2 fix 3).<\/li>\n<li><strong>Walnut top:<\/strong> two leaves, resawn from one offcut and end-flipped, so the live edge mirrors about x 138 (end match).<\/li>\n<li>Oiled. A pale sapwood band (#b98f62) is kept along the edge. The top edge is eased by hand.<\/li>\n<li>Overhang behind the printed rear wall: 0–12. I drew a gentle <strong>crown on the axis<\/strong> so POWER can be engraved behind the butterfly. With a real offcut, pick one whose edge crowns near the middle, or engrave POWER at y 178.<\/li>\n<li><strong>The butterfly:<\/strong> <strong>16 × 8<\/strong> (I shrank it from 20 × 10 so it clears the PHONES legend by ≈ 1.6), bog oak / wenge, inlaid 3 mm across x 138, y 168.5–176.5.<\/li>\n<li><strong>Jack legends:<\/strong> laser-engraved into the walnut (Inter Bold 1.5, dark), located from the straight joint (one fence). The ticks behind them point down to the ports.<\/li>\n<li><strong>FREE / SYNC:<\/strong> v1.1 ONE SHEET style at (128, 132.7), \"FREE\" / \"SYNC\" beside it.<\/li>\n<li><strong>TIME:<\/strong> two scales, marks only (as CHAMBER). TIME and DECAY legends behind.<\/li>\n<li><strong>Status light:<\/strong> hooded.<\/li>\n<\/ul>\n<h2>Motion and feedback<\/h2>\n<ul>\n<li>As v1.1 ONE SHEET.<\/li>\n<li>The walnut is the one part you touch that isn't a control. Carrying it, your fingers land on the live edge. It should feel like a stair rail: oiled, warm, rounded by hand.<\/li>\n<\/ul>\n<h2>What it had to prove (director)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Must prove<\/th>\n<th>Where<\/th>\n<th>Status, my honest read<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Must prove\">(a) printed cream beside real walnut looks intended, not a kit<\/td>\n<td data-label=\"Where\"><code>butterfly.jpg<\/code>, <code>butterfly-joint.jpg<\/code><\/td>\n<td data-label=\"Status, my honest read\">In the renders, matte bone beside a strip of oiled walnut reads intended: the bone is the \"plaster\", the walnut the \"shelf\". <strong>A render can't prove this:<\/strong> sheen and plastic-ness are material facts. A bone PETG print next to a real oiled offcut on his bench is the test.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(b) depth cost<\/td>\n<td data-label=\"Where\"><code>butterfly-top-…png<\/code>, section<\/td>\n<td data-label=\"Status, my honest read\">The printed body stays 180; overall 180–192 with the live edge (≤ 12, systems).<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(c) slotted screws, jig<\/td>\n<td data-label=\"Where\"><code>butterfly-rear-section-24px-per-mm.png<\/code><\/td>\n<td data-label=\"Status, my honest read\">Drawn: screws up through the rebate floor in front-to-back slots. Legends located from the joint (one fence).<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Must prove\">(d) the cleat, hanging, tree side up<\/td>\n<td data-label=\"Where\"><code>butterfly-on-the
