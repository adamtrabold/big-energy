n<\/ul>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked to owner.md)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions", "Status (decided / proposed / open, item by item)"], "lead": "- Every power-on gesture is checked once at boot. Live, TAP only taps or (held) shows the battery. - Settings live in flash."}, {"slug": "io", "path": "docs/features/io.md", "title": "I/O", "covers": "jacks, USB-C, CV / gate, EXT in, jack switching, mutes", "written": "not yet written", "stub": true, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>I/O<\/h1>\n<p>Status: <strong>not yet written<\/strong> · sources: ../../eng/budget-variant.md, ../../versions/v1.1/fold/how-it-works.md<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Controls and states<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player ed": 27, "open": 6}, "html": "<h1>MIDI<\/h1>\n<p>Status: <strong>written 2026-11-13<\/strong> (systems). Per item: decided / proposed / open (§10). Sources:\n- owner record <a href=\"#i-R-001\"><a href=\"#i-R-001\"><code>../../design/owner.md<\/code><\/a><\/a>;\n- <a href=\"#i-D-032\"><a href=\"#i-D-032\"><code>../../eng/daisy-first-principles.md<\/code><\/a><\/a> §3.2, §5 (DFP);\n- <a href=\"#i-D-034\"><a href=\"#i-D-034\"><code>../../eng/aftertouch.md<\/code><\/a><\/a> §4.2;\n- <a href=\"#i-D-019\"><a href=\"#i-D-019\"><code>../../eng/budget-variant.md<\/code><\/a><\/a>;\n- <a href=\"#i-D-040\"><a href=\"#i-D-040\"><code>../../design/branches/echo-clock.md<\/code><\/a><\/a>;\n- <a href=\"#i-D-110\"><a href=\"#i-D-110\"><code>../../design/branches/concepts/cathedral/how-it-works.md<\/code><\/a><\/a> §15;\n- expert review <a href=\"#review-2026-11-13-audio-synth-review\"><a href=\"#review-2026-11-13-audio-synth-review\"><code>../../design/reviews/2026-11-13-audio-synth-review.md<\/code><\/a><\/a> items 9, 11, 13–15, 18, 21, P8.<\/p>\n<p><strong>Organising principle (owner):<\/strong> design for <strong>being played and automated from a DAW<\/strong> (or another device). It is <strong>not a MIDI controller<\/strong>. Sending is a \"free extras\" section: explored only where it costs nothing and creates no echo loops.<\/p>\n<h2>What it does (player's view)<\/h2>\n<ul>\n<li>Plug the rear USB-C into a computer (class-compliant USB-MIDI, no driver), or a TRS MIDI cable into MIDI IN.<\/li>\n<li>From the DAW you can:<\/li>\n<li><strong>play it<\/strong> (notes, velocity, pitch bend, mod, pressure);<\/li>\n<li><strong>automate the knobs that carry a MIDI dot<\/strong>;<\/li>\n<li><strong>lock its echo to the DAW's tempo<\/strong>.<\/li>\n<li>The panel stays honest: a knob the DAW is holding lights the <strong>not-in-control<\/strong> light until you move it.<\/li>\n<li>The instrument keeps working fully on its own, with no MIDI at all.<\/li>\n<\/ul>\n<h2>Owner decisions (verbatim, linked)<\/h2>\n<ul>\n<li>2026-11-12, \"Decisions already made\": \"MIDI: USB-MIDI + 3.5 mm TRS MIDI in; MIDI-controllable params per eng; <strong>knob-only controls send no MIDI; MIDI never flips switches<\/strong>.\" \"mod depth MIDI-controllable (jump-on-move).\"<\/li>\n<li>2026-11-13: \"Add MIDI out\" (TRS MIDI OUT jack). Aftertouch: \"i think it needs its own switch but yes now i want it\". Recorded as \"sent over MIDI out too\".<\/li>\n<li>2026-11-13 11:58: echo sync option \"B\" (FREE / SYNC; tempo from MIDI clock, USB or TRS, if present).<\/li>\n<li>2026-11-13 15:44: \"Yea sure on midi\" → the pan <strong>receives CC 10<\/strong>.<\/li>\n<li>2026-11-13 16:21: \"sorry i didnt mean is usbmidi capable of send, but rather are we already doing send. if we do send then we gotta think about ALL of the features, and this is pretty definitively not a midi controller. though if it's free it could be.\"<\/li>\n<li>2026-11-13 (latest): \"the workflow im much more interested in is controlling it from another device or mainly a DAW. im not so worried about using it as a controller for other things. but if it's free we could explore it\"<\/li>\n<\/ul>\n<h2>How it works<\/h2>\n<ul>\n<li><strong>Transports:<\/strong><\/li>\n<li>USB-MIDI on the Seed's own port (rear USB-C, DFP §5.3 U1);<\/li>\n<li>TRS MIDI IN through a 6N138 on USART1 RX (D14);<\/li>\n<li>TRS MIDI OUT on USART1 TX (D13, type A).<\/li>\n<li><strong>Both inputs merge into one stream.<\/strong> Same channel rules; clock from either (USB wins while ticking; <a href=\"#i-D-040\"><code>echo-clock.md<\/code><\/a>).<\/li>\n<li><strong>Parsing:<\/strong> the control loop at 1 kHz; notes and clock with ≤ 1 ms latency [ENG]. Running status handled; active sensing ignored (proposed).<\/li>\n<li><strong>Parameters:<\/strong><\/li>\n<li>a MIDI value is applied through the same path as the knob: the knob's firmware value, smoothed;<\/li>\n<li>the knob goes \"not in control\" (<strong>jump-on-move<\/strong>, decided);<\/li>\n<li>moving it &gt; 1.5 % takes it back.<\/li>\n<li><strong>What's sent today:<\/strong> <strong>only channel pressure<\/strong> (aftertouch §4.2: on change, ≤ every 5 ms, a final 0 on release, all switch positions, can be disabled).<\/li>\n<li>Nothing else is specified to send.<\/li>\n<li><strong><code>design/jobs.md<\/code> F7 step 7 (\"knobs send CC out over USB\") was a team inference, not an owner decision.<\/strong> It's superseded by this doc; the owner's stance governs.<\/li>\n<\/ul>\n<h2>Controls and states<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Message (in)<\/th>\n<th>What it does<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Message (in)\"><strong>Note on / off<\/strong> (+ velocity)<\/td>\n<td data-label=\"What it does\">plays the voice like a key. <strong>MIDI and the keys share one note pool.<\/strong> MONO: low-note priority, single trigger, legato glide as with keys. PARA: allocated as the keys are<\/td>\n<td data-label=\"Status\">notes in <span class=\"st st-decided\">decided<\/span> (locked spec); priority = eng default (<strong><span class=\"st st-proposed\">proposed<\/span><\/strong> as the rule); merge <strong><span class=\"st st-proposed\">proposed<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\">Note numbers<\/td>\n<td data-label=\"What it does\">key 1 of the 25 = <strong>MIDI 48 (C3)<\/strong> at RANGE 8'. Notes outside the keyboard still play, up to the VCOs' range, and are octave-folded beyond it<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>Velocity<\/strong><\/td>\n<td data-label=\"What it does\">the same velocity CV (Seed DAC) through the VELOCITY toggle (LOUD / BOTH / FILT), same curve as the keys. Release velocity ignored<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span> (keys' path <span class=\"st st-decided\">decided<\/span>)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>Pitch bend<\/strong> (14-bit)<\/td>\n<td data-label=\"What it does\"><strong>added to the bend stick<\/strong> (both centred → 0), clamped. Default <strong>±2 semitones<\/strong>; <strong>RPN 0<\/strong> (bend sensitivity) sets 0–12<\/td>\n<td data-label=\"Status\">in: <span class=\"st st-proposed\">proposed<\/span> (review 21: \"not stated\")<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>CC 1 mod<\/strong><\/td>\n<td data-label=\"What it does\">mod depth (the MOD knob's value), jump-on-move<\/td>\n<td data-label=\"Status\"><strong><span class=\"st st-decided\">decided<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>Channel pressure<\/strong><\/td>\n<td data-label=\"What it does\">through the AFTERTOUCH switch: max(local, MIDI); decays to 0 50 ms after the last note-off<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> feature; behaviour eng (rev 14)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\">Poly pressure<\/td>\n<td data-label=\"What it does\">maps the sounding note's pressure to the same path<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span> (eng: $0)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>CC 64 sustain<\/strong><\/td>\n<td data-label=\"What it does\">holds the gate (MONO) / allocations (PARA) while down. Common from DAWs and pedals<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>Clock / START / STOP<\/strong><\/td>\n<td data-label=\"What it does\">echo tempo in SYNC (option B). START: no effect; STOP: tails ring; loss 500 ms → hold tempo<\/td>\n<td data-label=\"Status\"><strong><span class=\"st st-decided\">decided<\/span><\/strong> (option B); details <a href=\"#i-D-040\"><code>echo-clock.md<\/code><\/a> (<span class=\"st st-proposed\">proposed<\/span>)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\">CC 120 all sound off<\/td>\n<td data-label=\"What it does\">release all notes <strong>and<\/strong> fade the wet in 50 ms (immediate silence)<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\"><strong>CC 121 reset all controllers<\/strong><\/td>\n<td data-label=\"What it does\">bend → centre, pressure → 0, sustain off, <strong>and every knob back in panel control<\/strong> (LED off). It does <strong>not<\/strong> set MOD to 0<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\">CC 123 all notes off<\/td>\n<td data-label=\"What it does\">release all notes; tails ring<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Message (in)\">Program change, song position, SysEx<\/td>\n<td data-label=\"What it does\">ignored (no recall: owner, \"i dont think recall is important\")<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The MIDI-dot parameters (receive CC, jump-on-move, engraved dot):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Knob<\/th>\n<th>CC (proposal)<\/th>\n<th>Why this number<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Knob\">MOD<\/td>\n<td data-label=\"CC (proposal)\"><strong>1<\/strong><\/td>\n<td data-label=\"Why this number\">the mod wheel<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> (CC 1 per eng)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">GLIDE<\/td>\n<td data-label=\"CC (proposal)\">5<\/td>\n<td data-label=\"Why this number\">portamento time<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">CUTOFF<\/td>\n<td data-label=\"CC (proposal)\">74<\/td>\n<td data-label=\"Why this number\">\"brightness\": what DAWs and controllers default to for cutoff<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">TUNE<\/td>\n<td data-label=\"CC (proposal)\">20<\/td>\n<td data-label=\"Why this number\">undefined range (no GM default can grab it)<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">FREQ 2 / FREQ 3<\/td>\n<td data-label=\"CC (proposal)\">21 / 22<\/td>\n<td data-label=\"Why this number\">undefined<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">RANGE 1 / 2 / 3<\/td>\n<td data-label=\"CC (proposal)\">23 / 24 / 25<\/td>\n<td data-label=\"Why this number\">undefined. <strong>If RANGE becomes a detented 6-way rotary (review 13), it's a switch: MIDI never flips switches, so drop these<\/strong><\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span> / <span class=\"st st-open\">open<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\"><strong>DRY PAN<\/strong><\/td>\n<td data-label=\"CC (proposal)\"><strong>10<\/strong> (<span class=\"st st-decided\">decided<\/span>) — see the CC 10 problem below<\/td>\n<td data-label=\"Why this number\">owner <span class=\"st st-decided\">decided<\/span> CC 10 for \"the pan\"<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span>, with an <span class=\"st st-open\">open<\/span> question<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">DELAY PAN<\/td>\n<td data-label=\"CC (proposal)\">102<\/td>\n<td data-label=\"Why this number\">undefined<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Knob\">ECHO MIX / REVERB MIX<\/td>\n<td data-label=\"CC (proposal)\">103 / 104<\/td>\n<td data-label=\"Why this number\">review P8: DAW users automate effect <em>amounts<\/em> more than pans. <strong>Owner's call to add them<\/strong> (it moves them into the marked set)<\/td>\n<td data-label=\"Status\"><span class=\"st st-open\">open<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Channel:<\/strong>\n- <strong>Proposed:<\/strong> receive on <strong>channel 1 by default<\/strong> (not omni), so other tracks on the same interface don't play it.\n- Set it with a <strong>power-on key combo<\/strong>: hold the lowest key at power-on, then press key n for channel n (keys 1–16); key 17 = omni. Stored in flash. It doesn't use TAP, whose gestures already collide (architecture O5).\n- The same channel applies to USB and TRS.<\/p>\n<h2>Edge cases (the DAW user's list)<\/h2>\n<ol>\n<li><strong>DAW and knob disagree.<\/strong>\n   - Last message wins (jump-on-move). An incoming CC grabs the knob and lights the LED; moving the knob &gt; 1.5 % takes it back.\n   - <strong>While DAW automation is playing<\/strong>, every new automation value grabs it again: the DAW wins until automation stops. That's normal hardware behaviour.\n   - <strong>Proposed option:<\/strong> after a take-back, the knob holds control for 1 s against automation, so a quick override sticks. Owner's call.<\/li>\n<li><strong>Project load.<\/strong> DAWs often send a burst on load or transport start: CC 121, CC 7, <strong>CC 10 = 64<\/strong>, CC 1 = 0, bend centre, then automation chase.\n   - CC 121 → every knob back to the panel (above).\n   - CC 7 → ignored (VOLUME is analog).\n   - Chased automation values → grab their knobs (intended).\n   - <strong>CC 10 = 64 would silently centre DRY PAN<\/strong> even if the user never automated it (review 15).\n   - <strong>Open, for the owner:<\/strong> keep CC 10 (the LED shows it, a nudge takes it back), or move DRY PAN to an undefined CC (e.g. 105), with an option for CC 10.\n   - <strong>Proposed recommendation:<\/strong> undefined CC by default. It avoids a pan that moves on its own every time a project opens.<\/li>\n<li><strong>DAW echo / MIDI thru.<\/strong> Only matters if the instrument <strong>sends<\/strong> (free extras). See there: local off and echo suppression.<\/li>\n<li><strong>Notes doubled.<\/strong> Keys play the voice locally. If the DAW also records and echoes them back, you hear doubles. That only happens if notes are sent (free extras), so local off belongs with that extra.<\/li>\n<li><strong>Stuck notes:<\/strong> the gate releases on CC 123 / 120, on a USB disconnect, and on clock STOP if sustain is held.<\/li>\n<li><strong>PARA from a DAW:<\/strong>\n   - chords allocate like keys;\n   - oscillators set to zero in the mixer are silent;\n   - OSC 3 in LFO mode (OSC 3 CTL, review 11) is excluded, which means firmware must read OSC 3 CTL;\n   - review 18's PARA behaviour applies (RANGE 1 for all, retrigger on new notes: proposed).<\/li>\n<li><strong>Pitch CV out from DAW notes<\/strong> (review 9): carries the MONO note, or the lowest note in PARA; it includes bend and glide (proposed). It needs its DAC channel (architecture §5.3).<\/li>\n<\/ol>\n<h2>Interactions with other features<\/h2>\n<ul>\n<li><strong>Echo sync:<\/strong> clock in from either transport (<a href=\"#i-D-040\"><code>echo-clock.md<\/code><\/a>). TAP is ignored for tempo while the clock runs.<\/li>\n<li><strong>Aftertouch:<\/strong> pressure in and out (above).<\/li>\n<li><strong>Bend and mod:<\/strong> the stick and PB sum; MOD and CC 1 share jump-on-move.<\/li>\n<li><strong>Panning:<\/strong> DRY PAN (digipot, so MIDI-able) and DELAY PAN (DSP).<\/li>\n<li><strong>FOLLOW<\/strong> is a switch: never flipped by MIDI.<\/li>\n<li><strong>Paraphonic:<\/strong> shared allocation for keys and MIDI.<\/li>\n<li><strong>Gestures:<\/strong> the channel combo avoids TAP (architecture O5).<\/li>\n<li><strong>Power:<\/strong> USB-MIDI works on battery. Charging and MIDI share the one USB-C (decided).<\/li>\n<li><strong>Recording:<\/strong> the <strong>primary way to record this instrument into a DAW is its stereo line out (audio)<\/strong>, decided stereo. MIDI recording of a performance is an extra (below).<\/li>\n<\/ul>\n<h2>MIDI — free extras (sending), each off by default<\/h2>\n<p>Owner: send only \"if it's free\"; sending means thinking about every feature. Each extra costs <strong>$0 in parts<\/strong> (USB-MIDI and TRS OUT already exist) and is firmware only. Each has a loop risk, named.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Extra<\/th>\n<th>What it gives a DAW user<\/th>\n<th>Loop / risk, and its guard<\/th>\n<th>Recommendation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Extra\">X1 Channel pressure out<\/td>\n<td data-label=\"What it gives a DAW user\">already in the eng spec (aftertouch §4.2)<\/td>\n<td data-label=\"Loop / risk, and its guard\">none on its own<\/td>\n<td data-label=\"Recommendation\"><strong>keep as specified<\/strong> (<span class=\"st st-decided\">decided<\/span> feature), with its setting to disable<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Extra\">X2 Performance out: notes + velocity + bend + CC 1 + sustain<\/td>\n<td data-label=\"What it gives a DAW user\">record his playing as MIDI in the DAW<\/td>\n<td data-label=\"Loop / risk, and its guard\">DAW thru doubles the notes → needs <strong>local off<\/strong> (CC 122 in, plus a setting). With local off, the keys only send; the DAW plays the voice back<\/td>\n<td data-label=\"Recommendation\"><span class=\"st st-proposed\">proposed<\/span>, <strong>off by default<\/strong>; only with local off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Extra\">X3 Knob CCs out (the MIDI-dot knobs)<\/td>\n<td data-label=\"What it gives a DAW user\">record knob moves as automation<\/td>\n<td data-label=\"Loop / risk, and its guard\">the DAW echoes them back and grabs the knob → <strong>ignore an incoming CC equal to one sent in the last 200 ms<\/strong> (review 14)<\/td>\n<td data-label=\"Recommendation\"><span class=\"st st-proposed\">proposed<\/span>, off by default<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Extra\">X4 Clock out from TAP<\/td>\n<td data-label=\"What it gives a DAW user\">drive a drum machine from TAP (park)<\/td>\n<td data-label=\"Loop / risk, and its guard\">two clock masters with a DAW → send only when <strong>no clock is being received<\/strong><\/td>\n<td data-label=\"Recommendation\"><span class=\"st st-proposed\">proposed<\/span>, off by default<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Extra\">X5 Soft thru (TRS IN → TRS OUT)<\/td>\n<td data-label=\"What it gives a DAW user\">chain gear<\/td>\n<td data-label=\"Loop / risk, and its guard\">a USB → TRS loop if the DAW also echoes → thru TRS only, never USB → TRS<\/td>\n<td data-label=\"Recommendation\"><span class=\"st st-proposed\">proposed<\/span>, off by default<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Extra\">— SysEx settings / backup<\/td>\n<td data-label=\"What it gives a DAW user\">—<\/td>\n<td data-label=\"Loop / risk, and its guard\">not free (a protocol and a page to design)<\/td>\n<td data-label=\"Recommendation\">not <span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Settings for the extras:<\/strong> power-on key combos, as for the channel (not TAP). Exact keys proposed with the gestures doc.<\/p>\n<h2>Budget<\/h2>\n<ul>\n<li><strong>Pins:<\/strong> D13 (TRS OUT), D14 (TRS IN), the Seed USB port: all already allocated (architecture §5.2). <strong>Mux: 0. DAC: 0.<\/strong><\/li>\n<li><strong>Cost:<\/strong> $0 beyond decided parts (6N138 + TRS jacks: eng BOM). <strong>Power:<\/strong> negligible.<\/li>\n<li><strong>Firmware:<\/strong> the parser, the CC map, jump-on-move (exists), channel select, RPN 0, and the extras.<\/li>\n<\/ul>\n<h2>Open questions (for the owner, one at a time)<\/h2>\n<ol>\n<li><strong>DRY PAN on CC 10<\/strong> (your decision) vs an undefined CC, given that DAWs send CC 10 = 64 on project load and would centre it on their own. Recommendation: undefined CC.<\/li>\n<li><strong>ECHO MIX and REVERB MIX as MIDI-dot knobs<\/strong> (CC 103 / 104) so a DAW can automate the effect amounts? (Review P8.)<\/li>\n<li><strong>Default channel 1<\/strong> with a power-on channel combo, or <strong>omni<\/strong>?<\/li>\n<li><strong>The free extras:<\/strong> any of X2–X5 wanted at all? (X1 pressure-out is already in the spec.)<\/li>\n<li><strong>Automation vs the knob:<\/strong> last message wins (standard), or the knob holds 1 s after you grab it?<\/li>\n<li>(From the review) If RANGE becomes a detented rotary, it leaves the MIDI set. OK?<\/li>\n<\/ol>\n<h2>Status (item by item)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">USB-MIDI + TRS IN; TRS OUT exists<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Knob-only controls send no MIDI; MIDI never flips switches<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">CC 1 → mod depth, jump-on-move<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Clock in → echo (option B)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Pan receives CC 10 (now DRY PAN)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span>; reconsideration <span class=\"st st-open\">open<\/span> (Q1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Channel pressure out (+ in)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> feature; behaviour eng<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Not a MIDI controller; send only if free; DAW-first<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> (stance)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Note merge, priority, note mapping, velocity path, PB ±2 + RPN 0, CC 64, CC 120 / 121 / 123 behaviour<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">CC map (5, 74, 20–25, 102–105)<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Channel default + combo<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span> / <span class=\"st st-open\">open<\/span> (Q3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Extras X2–X5<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span>, off by default / <span class=\"st st-open\">open<\/span> (Q4)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">jobs.md F7 step 7 (knobs send)<\/td>\n<td data-label=\"Status\">superseded by this doc<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked)", "How it works", "Controls and states", "Edge cases (the DAW user's list)", "Interactions with other features", "MIDI — free extras (sending), each off by default", "Budget", "Open questions (for the owner, one at a time)", "Status (item by item)"], "lead": "Organising principle (owner): design for being played and automated from a DAW (or another device). It is not a MIDI controller. Sending is a \"free extras\" section: explored only where it costs nothing and creates no echo loops."}, {"slug": "panning-and-stereo-outputs", "path": "docs/features/panning-and-stereo-outputs.md", "title": "Panning and stereo outputs", "covers": "dry pan, delay pan, FOLLOW, stereo phones / line, mono-on-TS, speaker sum", "written": "not yet written (source: cathedral §15)", "stub": false, "counts": {"decided": 4, "proposed": 4, "open": 4}, "html": "<h1>Panning and stereo outputs<\/h1>\n<p>Status: <strong>written 2026-11-13<\/strong> (systems). Per item below. Sources:\n- <a href=\"#i-R-001\">owner record<\/a> 15:18–15:54;\n- <a href=\"#i-D-110\">CATHEDRAL §15<\/a>;\n- <a href=\"#i-D-032\">Daisy design §6<\/a>;\n- <a href=\"#review-2026-11-13-audio-synth-review\">expert review<\/a> items 2, 3, 7, 16, 17, P3, P5, P6.<\/p>\n<h2>What it does (player's view)<\/h2>\n<ul>\n<li><strong>Headphones and line out are stereo.<\/strong> The echo and reverb spread left and right; the speaker plays one mono mix.<\/li>\n<li><strong>DRY PAN<\/strong> moves the synth itself left or right on the stereo outputs.<\/li>\n<li><strong>DELAY PAN<\/strong> moves the echo separately.<\/li>\n<li><strong>FOLLOW<\/strong> makes the echo track the dry pan.<\/li>\n<li><strong>A mono cable in LINE OUT<\/strong> still gets the whole sound.<\/li>\n<\/ul>\n<h2>Owner decisions (verbatim, linked)<\/h2>\n<ul>\n<li>15:22 \"Stereo phones is fine but I need to pan the signal into the effects\" → stereo phones, <strong>one speaker<\/strong>.<\/li>\n<li>15:23 \"Stereo line out\" → <strong>stereo line out<\/strong> (TRS).<\/li>\n<li>15:24 \"Left channel should be mono tho if stereo isn't plugged in\" → <strong>a TS cable carries L + R on the tip<\/strong> (requirement).<\/li>\n<li>15:44 \"Yea sure on midi\" → the pan <strong>receives CC 10<\/strong>.<\/li>\n<li>15:53 \"No the pan would be audio signal. Basically I'd like to pan just the delay separately from the full dry but also I'd like to be able to have the pan signals sync\" → <strong>a dry pan and a separate delay pan<\/strong>, with a link.<\/li>\n<li>15:54 \"Follow dry\" → linked = <strong>the delay follows the dry, same side<\/strong>.<\/li>\n<\/ul>\n<h2>How it works<\/h2>\n<pre><code>voice (mono, analog) ─► DRY PAN (dual digital pot, analog audio) ─► L sum / R sum ─► VOLUME (dual) ─┬─► PHONES (TRS, headphone driver)\n        └─ FX send (placed where the dry sits, in DSP) ─► reverb in (stereo)                      ├─► LINE OUT (TRS, line driver)\n           └─► ECHO ─► DELAY PAN (DSP; = DRY PAN when FOLLOW) ─┬─► L / R sums                     └─► (L+R)/2 ─► LM386 ─► speaker\n                                                               └─► reverb in (stereo)\nreverb out (stereo) ─► L / R sums\n<\/code><\/pre>\n<ul>\n<li><strong>Summing:<\/strong> two output summing nodes (one TL072): dry × pan + wet L / wet R. Wet only from the codec, no dry copy.<\/li>\n<li><strong>DRY PAN:<\/strong> the knob is a plain pot the Daisy reads. A <strong>dual digital pot<\/strong> (MCP4251-103, UNVERIFIED part) forms two complementary dividers, L = a, R = 1 − a (<strong>constant sum<\/strong>). The audio stays analog (no converter); eng confirms headroom at 5 V (AC-coupled, mid-rail bias) and that it's acceptable in the \"never switched\" dry path.<\/li>\n<li><strong>DELAY PAN:<\/strong> in DSP. It places the echo's output on the outputs <strong>and<\/strong> where it enters the reverb.<\/li>\n<li>The reverbs take <strong>stereo input<\/strong>: PLATE / SPRING / SHIMMER get two input diffusers, ≈ +10–15 % of one reverb's load (ESTIMATE; spike measures it).<\/li>\n<li><strong>FOLLOW:<\/strong> a 2-way toggle. FOLLOW = the delay pan takes the dry pan's value; OFF = its own knob.<\/li>\n<li><strong>The voice's send into the effects follows DRY PAN<\/strong> (merged; no separate send pan). Review P1 found a separate send pan mostly inaudible.<\/li>\n<li><strong>VOLUME:<\/strong> a dual-gang 9 mm pot (part and T18 spline UNVERIFIED; cheap gangs mis-track at low settings: a known trade).<\/li>\n<li><strong>Phones:<\/strong> a stereo headphone driver (NJM4556A class, UNVERIFIED). <strong>Line:<\/strong> a stereo line driver with <strong>470 Ω–1 kΩ build-out resistors<\/strong> (review 2).<\/li>\n<li><strong>Speaker:<\/strong> the LM386 fed (L + R)/2.<\/li>\n<\/ul>\n<h2>Controls and states<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th>Range / positions<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Control\"><strong>DRY PAN<\/strong><\/td>\n<td data-label=\"Range / positions\">full L ↔ full R<\/td>\n<td data-label=\"Notes\">centre detent if a 9 mm detent pot exists in T18 (UNVERIFIED), else a firmware dead zone ±3 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\"><strong>DELAY PAN<\/strong><\/td>\n<td data-label=\"Range / positions\">full L ↔ full R<\/td>\n<td data-label=\"Notes\">inactive while FOLLOW is on<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\"><strong>FOLLOW<\/strong><\/td>\n<td data-label=\"Range / positions\">OFF / FOLLOW<\/td>\n<td data-label=\"Notes\">a switch: MIDI never flips it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">PHONES jack<\/td>\n<td data-label=\"Range / positions\">TRS stereo, <strong>switched<\/strong> (speaker mute)<\/td>\n<td data-label=\"Notes\">review 16<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Control\">LINE OUT<\/td>\n<td data-label=\"Range / positions\">TRS stereo (see the <span class=\"st st-open\">open<\/span> question on jacks)<\/td>\n<td data-label=\"Notes\">mono-on-TS required<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Placement (proposed, CATHEDRAL layout B effects row):<\/strong> … ECHO MIX · <strong>DELAY PAN<\/strong> | REVERB … | <strong>DRY PAN<\/strong> · VOLUME, with FOLLOW in front between DRY PAN and VOLUME. [CHECK]: 0 violations; label check pending the model.<\/p>\n<h2>Edge cases<\/h2>\n<ul>\n<li><strong>Speaker:<\/strong> constant-sum laws, so moving either pan doesn't change the speaker's level.<\/li>\n<li><strong>Mono (TS) cable in LINE OUT:<\/strong> must carry L + R on the tip. <strong>The circuit drawn in CATHEDRAL §15.4 can't work<\/strong> (review 2). The choice between two working fixes is the owner's (open questions).<\/li>\n<li><strong>Mono (TS) plug in PHONES:<\/strong> you hear L only. A dry panned right is quiet there. Accepted: TS headphones are rare, and a 32 Ω load can't be sensed.<\/li>\n<li><strong>Balanced inputs<\/strong> (most audio interfaces' TRS line inputs) hear <strong>L − R<\/strong>: the centred dry cancels and only the effects' stereo difference is left (review 3).<\/li>\n<li>Print <strong>\"stereo · unbalanced\"<\/strong> by the jack.<\/li>\n<li>Put a <strong>3.5 mm TRS → 2 × TS cable<\/strong> in the build list.<\/li>\n<li><strong>PING-PONG + DELAY PAN:<\/strong> PING-PONG already alternates. DELAY PAN sets <strong>which side it starts on<\/strong>; it doesn't add a second alternation (review P3).<\/li>\n<li><strong>Power-on pops:<\/strong> phones and line get a <strong>shunt mute<\/strong> held at reset and released after boot calibration + 200 ms. It shares the LM386 enable pin (review 7).<\/li>\n<li><strong>Ground loop<\/strong> with USB-MIDI and line out into one computer: footprints for a ferrite on USB shield/ground; the line-out ground goes to the analog star; the manual says \"run on battery or use an isolator to record\" (review 17, UNVERIFIED).<\/li>\n<\/ul>\n<h2>Interactions with other features<\/h2>\n<ul>\n<li><strong>Effects:<\/strong> stereo-input reverbs; the echo stays a mono line, and its pan decides where it sits.<\/li>\n<li><strong>MIDI:<\/strong> DRY PAN receives CC 10 (decided; see the CC 10 problem in <a href=\"#doc-midi\">MIDI<\/a>); DELAY PAN receives CC 102 (proposed).<\/li>\n<li><strong>Echo sync:<\/strong> none (no tempo auto-pan; the owner said the pans are audio).<\/li>\n<li><strong>Power:<\/strong> the headphone driver draws quiescent current all the time unless it's switched by the PHONES jack's switch (review).<\/li>\n<li><strong>Enclosure:<\/strong> FOLD's far wall carries PHONES and LINE OUT; one more hole if the owner picks two line jacks.<\/li>\n<\/ul>\n<h2>MIDI<\/h2>\n<ul>\n<li>DRY PAN: <strong>receive CC 10<\/strong> (decided), jump-on-move, possible because the digipot is set by the Daisy.<\/li>\n<li>DELAY PAN: <strong>receive CC 102<\/strong> (proposed).<\/li>\n<li>FOLLOW: none (a switch).<\/li>\n<li>Sending: open (see <a href=\"#doc-midi\">MIDI<\/a>).<\/li>\n<\/ul>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<ul>\n<li><strong>Mux:<\/strong> +3 (DRY PAN, DELAY PAN, FOLLOW), +1 PHONES sense, +1 TS sense (0 with two jacks). See <a href=\"#doc-architecture\">architecture<\/a>.<\/li>\n<li><strong>Pins:<\/strong> +1 digipot chip-select; +1 74HC4053 control (0 with two jacks). Output mute shares D12.<\/li>\n<li><strong>DAC:<\/strong> 0 (the digipot isn't a DAC channel).<\/li>\n<li><strong>Cost (ESTIMATE, UNVERIFIED):<\/strong> stereo stage ≈ $3–5; pans, FOLLOW and digipot ≈ $4; 74HC4053 ≈ $0.50 or a second jack ≈ $0.50; mute ≈ $0.30.<\/li>\n<li><strong>Power:<\/strong> a few mA.<\/li>\n<\/ul>\n<h2>Open questions (for the owner)<\/h2>\n<ol>\n<li><strong>Line out with a mono cable: two jacks or one?<\/strong>\n   - <strong>Two jacks, \"L / MONO\" and \"R\":<\/strong> the standard synth way. Plug one cable into L / MONO and you get everything; plug two and you get stereo. It always works, never pops, needs no electronics or firmware, and avoids the silent-on-an-interface problem. <strong>Costs one more hole on the back wall<\/strong> (not a patch point, just an output).\n   - <strong>One stereo jack, made to sense a mono plug:<\/strong> a reworked circuit with a tiny bias voltage and a switch chip that folds right into left. It keeps one hole, but needs a bench test before we trust it, and a stereo cable into a balanced interface input can still go quiet.\n   - <strong>Recommendation:<\/strong> two jacks.<\/li>\n<li><strong>Should plugging into LINE OUT mute the speaker?<\/strong> Most players expect yes, to avoid feedback through a PA.<\/li>\n<li><strong>DRY PAN on CC 10:<\/strong> DAWs send CC 10 = 64 when a project opens, which would centre it on its own. Keep CC 10, or use an undefined CC? (Also asked in <a href=\"#doc-midi\">MIDI<\/a>.)<\/li>\n<\/ol>\n<h2>Status (item by item)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Stereo phones, stereo line out, one speaker<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">TS cable → L + R on the tip (line out)<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> requirement; <strong>method <span class=\"st st-open\">open<\/span><\/strong> (Q1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Dry pan + separate delay pan; FOLLOW = same side<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Pan receives CC 10<\/td>\n<td data-label=\"Status\"><span class=\"st st-decided\">decided<\/span> (reconsideration <span class=\"st st-open\">open<\/span>, Q3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Digipot dry pan, DSP delay pan, constant-sum laws, send follows dry<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">FOLLOW as a 2-way toggle; placement<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Stereo-input reverbs<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Switched PHONES jack mutes the speaker; output shunt mute; 470 Ω–1 kΩ build-outs; \"stereo · unbalanced\" label + Y cable<\/td>\n<td data-label=\"Status\"><span class=\"st st-proposed\">proposed<\/span><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">LINE OUT mutes the speaker<\/td>\n<td data-label=\"Status\"><span class=\"st st-open\">open<\/span> (Q2)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions (for the owner)", "Status (item by item)"], "lead": "Placement (proposed, CATHEDRAL layout B effects row): … ECHO MIX · DELAY PAN | REVERB … | DRY PAN · VOLUME, with FOLLOW in front between DRY PAN and VOLUME. [CHECK]: 0 violations; label check pending the model."}, {"slug": "paraphonic", "path": "docs/features/paraphonic.md", "title": "Paraphonic", "covers": "MONO / PARA / PARA+4, allocation, the digital 4th oscillator", "written": "not yet written", "stub": false, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>Paraphonic<\/h1>\n<p>Status: <strong>partly written 2026-11-13<\/strong> (the PARA+4 audio path, review must-fix O3). The rest is to be written · sources: ../../design/owner.md (2026-11-13 paraphonic entries), ../../design/reviews/2026-11-13-audio-synth-review.md items 4, 18<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<h3>The PARA+4 audio path (review must-fix, architecture open item 3)<\/h3>\n<p><strong>Problem:<\/strong>\n- PARA+4 (approved) uses a <strong>digital 4th oscillator<\/strong> on the Daisy.\n- Both codec outputs are the stereo wet return, which joins <strong>after<\/strong> the VCA and filter.\n- So the 4th note has no way into the analog filter and VCA. As drawn, it can't sound like the other three.<\/p>\n<p><strong>Options:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Route<\/th>\n<th>Behaviour change<\/th>\n<th>Cost / budget<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>A. A dedicated DAC for the 4th oscillator (recommended)<\/strong><\/td>\n<td data-label=\"Route\">Move <strong>velocity and mod-depth CVs<\/strong> onto a <strong>5th MCP4822<\/strong> (both are slow CVs). That frees the <strong>Seed's two internal 12-bit DACs<\/strong> (DAC1_OUT1 / OUT2, DMA-driven at 48 kHz). DAC1_OUT1 then plays the band-limited 4th oscillator → RC reconstruction filter → a fixed resistor into the <strong>ladder's input summing node in the base<\/strong> (after the hinge ribbon, so no ribbon change)<\/td>\n<td data-label=\"Behaviour change\"><strong>none<\/strong>: effects stay stereo, NOISE / EXT stays free. Its level is set in firmware to match a full-up oscillator; the mixer pots don't control it (they're analog, and the firmware can't see them)<\/td>\n<td data-label=\"Cost / budget\">+1 MCP4822 (≈ $4, UNVERIFIED) + 1 chip-select pin. Pins go to 30–31 of 31 (fine if line out uses two jacks, which frees the 4053 pin). Seed DAC quality ≈ 11 ENOB (ESTIMATE): fine for an oscillator that goes through the filter<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">B. Codec OUT R → the NOISE / EXT input<\/td>\n<td data-label=\"Route\">a 74HC4053 steers OUT R to the mixer's EXT input while PARA+4 is on; the wet return goes mono (OUT L to both sums)<\/td>\n<td data-label=\"Behaviour change\"><strong>yes:<\/strong> effects go mono in PARA+4 and SOURCE must sit on EXT. <strong>Owner<\/strong><\/td>\n<td data-label=\"Cost / budget\">+1 4053 section, 1 control pin<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">C. Make the toggle 2-way (MONO / PARA) until a path exists<\/td>\n<td data-label=\"Route\">—<\/td>\n<td data-label=\"Behaviour change\"><strong>yes:<\/strong> PARA+4 disappears. <strong>Owner<\/strong><\/td>\n<td data-label=\"Cost / budget\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Recommendation: A.<\/strong>\n- It keeps the approved behaviour exactly, with no mono effects and no taken input.\n- It costs one bought chip and one pin.\n- Eng confirms: the DMA load at 48 kHz on DAC1, and the reconstruction filter. The 4th oscillator needs a band-limited (PolyBLEP) waveform, matched to WAVE 1's position read by the firmware (UNVERIFIED that WAVE 1 is read; add it to the mux if not).\n- <strong>Bonus:<\/strong> DAC1_OUT2 is freed too. Proposed for <strong>PITCH CV OUT<\/strong> (no channel today; review 9): 12-bit, ≈ 1.5 cents/step over 5 V [CALC], buffered and scaled to 1 V/oct.\n- <strong>Status: proposed<\/strong> (no owner decision needed unless he objects to the cost).<\/p>\n<h2>Controls and states<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked to owner.md)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions", "Status (decided / proposed / open, item by item)"], "lead": "Options:"}, {"slug": "power-and-battery", "path": "docs/features/power-and-battery.md", "title": "Power and battery", "covers": "LiPo, charger, boost, rails, gauge, runtime, Hall gating", "written": "not yet written", "stub": true, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>Power and battery<\/h1>\n<p>Status: <strong>not yet written<\/strong> · sources: ../../eng/battery.md, ../../eng/daisy-first-principles.md §7<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Controls and states<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked to owner.md)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions", "Status (decided / proposed / open, item by item)"], "lead": ""}, {"slug": "voice", "path": "docs/features/voice.md", "title": "Voice", "covers": "3 VCOs, mixer, ladder filter, contours, VCA, SOURCE, KBD CTRL", "written": "not yet written", "stub": true, "counts": {"decided": 0, "proposed": 0, "open": 0}, "html": "<h1>Voice<\/h1>\n<p>Status: <strong>not yet written<\/strong> · sources: ../../eng/budget-variant.md, ../../eng/daisy-first-principles.md<\/p>\n<h2>What it does (player's view)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Owner decisions (verbatim, linked to owner.md)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>How it works<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Controls and states<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Edge cases<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Interactions with other features<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>MIDI<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Budget (pins / mux / DAC / power / cost)<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Open questions<\/h2>\n<p><em>To be written.<\/em><\/p>\n<h2>Status (decided / proposed / open, item by item)<\/h2>\n<p><em>To be written.<\/em><\/p>", "jump": ["What it does (player's view)", "Owner decisions (verbatim, linked to owner.md)", "How it works", "Controls and states", "Edge cases", "Interactions with other features", "MIDI", "Budget (pins / mux / DAC / power / cost)", "Open questions", "Status (decided / proposed / open, item by item)"], "lead": ""}], "docsIndex": {"intro": "<p>Owner (2026-11-13 16:21, <a href=\"#i-R-001\"><code>../design/owner.md<\/code><\/a>): \"we need on that site architectural documentation and clear docs for each featureset. lets start defining this stuff and writing it down 1 by 1 in an easily delineated fashion, so we can make sure the architectural decisions are sound across the device.\"<\/p>\n<p><strong>How these docs work:<\/strong>\n- <strong><a href=\"#doc-architecture\"><code>architecture.md<\/code><\/a><\/strong> is the whole device on one page: signal paths, control and data flow, power, <strong>one recounted budget table<\/strong> (pins, mux, DACs, power), the decisions log and the open items.\n- <strong><code>features/<\/code><\/strong> has one file per feature set, all with the <strong>same headings<\/strong> (template below). They're written one at a time; a stub says \"not yet written\".\n- <strong>Status words are strict.<\/strong> Only a decision recorded in <a href=\"#i-R-001\"><code>../design/owner.md<\/code><\/a> is <strong>decided<\/strong>. Anything the team proposes is <strong>proposed<\/strong> until he answers. Unknowns are <strong>open<\/strong>.\n- Sources are linked, not copied: eng files in <code>../eng/<\/code>, design files in <code>../design/<\/code>.<\/p>", "template": "<h2>Template (every feature doc uses these headings, in this order)<\/h2>\n<pre><code># &lt;Feature set&gt;\nStatus: decided / proposed / open (per item below) · last updated &lt;date&gt; · sources: &lt;links&gt;\n\n## What it does (player's view)\n## Owner decisions (verbatim, linked to owner.md)\n## How it works\n## Controls and states\n## Edge cases\n## Interactions with other features\n## MIDI\n## Budget (pins / mux / DAC / power / cost)\n## Open questions\n## Status (decided / proposed / open, item by item)\n<\/code><\/pre>"}, "reviews": [{"slug": "2026-11-13-audio-synth-review", "path": "design/reviews/2026-11-13-audio-synth-review.md", "title": "Audio / synth review — the whole instrument, plus §15 stereo and pan (2026-11-13)", "date": "2026-11-13", "score": "6 / 10", "lead": "Independent critic, audio engineer / synth designer hat. Reports to the owner; decides nothing. Read: design/owner.md, HANDOFF.md, eng/budget-variant.md, eng/daisy-first-principles.md, eng/single-chip-research.md, eng/aftertouch.md, eng/eff", "html": "<h1>Audio / synth review — the whole instrument, plus §15 stereo and pan (2026-11-13)<\/h1>\n<p>Independent critic, audio engineer / synth designer hat. Reports to the owner; decides nothing.\nRead: <a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>, <code>HANDOFF.md<\/code>, <a href=\"#i-D-019\"><code>eng/budget-variant.md<\/code><\/a>, <a href=\"#i-D-032\"><code>eng/daisy-first-principles.md<\/code><\/a>, <code>eng/single-chip-research.md<\/code>, <a href=\"#i-D-034\"><code>eng/aftertouch.md<\/code><\/a>, <code>eng/effects.md<\/code>, <a href=\"#i-D-040\"><code>design/branches/echo-clock.md<\/code><\/a>, <a href=\"#i-D-110\"><code>design/branches/concepts/cathedral/how-it-works.md<\/code><\/a> (including the §15.5 \"two pans\" draft that appeared while I was reviewing), <a href=\"#i-D-003\"><code>versions/v1.1/common-how-it-works.md<\/code><\/a>. No web checks were needed; nothing below depends on a datasheet figure I didn't already have from the files. Items I reasoned out but couldn't confirm against a part or a bench are marked <strong>UNVERIFIED<\/strong>.<\/p>\n<p>Severity: <strong>MUST<\/strong> = will break, sound wrong or contradict itself if built as written. <strong>SHOULD<\/strong> = will surprise a player or cost you later. <strong>NICE<\/strong> = worth doing.<\/p>\n<hr />\n<h2>Score<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Score<\/th>\n<th>Based on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"What\"><strong>The instrument as specified (voice, control, MIDI, power, FX)<\/strong><\/td>\n<td data-label=\"Score\"><strong>6 / 10<\/strong><\/td>\n<td data-label=\"Based on\">eng spec (budget-variant rev 14, daisy-first-principles §0–§9, aftertouch), echo-clock option B, v1.1 common panel, cathedral §10 keys and §15<\/td>\n<\/tr>\n<tr>\n<td data-label=\"What\">§15 stereo outputs + mono sensing + pans, as drafted<\/td>\n<td data-label=\"Score\">5 / 10<\/td>\n<td data-label=\"Based on\">cathedral §15.1–§15.5<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The core is genuinely good: a faithful Model D voice, a dry path that is analog and never switched, a wet-only return (the right call, no comb filtering), coarse + fine pitch DACs with the TIM5 closed loop, filter calibration on the spare codec input, and a FREE / SYNC behaviour table that already handles clock loss, STOP and two transports. That's a 9 voice. It's held at 6 by a set of fixable holes: the control scanner is already full and four new controls were added on top, one stereo circuit can't work as written, PARA+4 has no way to be heard, and a few gestures and parts contradict each other. Fix the MUST items and this is an 8.<\/p>\n<hr />\n<h2>Gotchas and nonsense, most important first<\/h2>\n<h3>1. The mux is full, and four or more new controls were added on top — MUST<\/h3>\n<ul>\n<li><strong>What:<\/strong> <code>aftertouch.md<\/code> §2 counts the three 16-channel muxes at <strong>48 / 48, 0 spare<\/strong> after aftertouch. Since then: PARA toggle (+1), FREE / SYNC (+1), FX PAN / VOICE PAN (+1), ECHO PAN (+1), the TS-sense line on LINE OUT (+1), and OSC 3 CTL, which the firmware has to read (item 11, +1). That's <strong>≈ 54 of 48<\/strong>. <a href=\"#i-D-040\"><code>echo-clock.md<\/code><\/a> §4 says \"46 / 48\" and cathedral §15.4 says \"eng to confirm\": both use stale counts.<\/li>\n<li><strong>Why it matters:<\/strong> no free channel means no FREE / SYNC, no pan and no PARA, or a board respin.<\/li>\n<li><strong>Fix:<\/strong> add a <strong>4th CD74HC4067<\/strong> sharing S0–S3 (≈ $0.60, +16 channels). Put it on <strong>D20 (PC1, ADC3)<\/strong> and move the battery divider onto one of its channels. ADC3 then converts two channels per step (mux C and mux D). That keeps the key ADCs (1 + 2) untouched and leaves D16 free as the last spare. (Running two ranks on ADC3 is standard STM32 practice, but eng should confirm the timing inside the 3 µs step: <strong>UNVERIFIED<\/strong>.) Then recount every channel in one table.<\/li>\n<\/ul>\n<h3>2. The TS-cable sensing on LINE OUT (§15.4) can't work as drawn, and the obvious repair thumps — MUST<\/h3>\n<ul>\n<li><strong>What:<\/strong> the ring is driven by an op-amp through ≈ 100 Ω, and a 1 MΩ pull-up to 3.3 V is meant to read \"≈ 3.3 V with an empty jack\". But a 100 Ω source holds the ring at the op-amp's DC level (≈ 0 V); the pull-up moves it by about 0.3 mV. <strong>It reads \"TS\" all the time.<\/strong> It only works with a series coupling cap between driver and jack. Then that cap sits charged to 3.3 V, and plugging a TRS cable into a mixer dumps a <strong>3.3 V step into the mixer's right input<\/strong>, louder than line level. That's a thump on every plug-in.<\/li>\n<li><strong>Second problem:<\/strong> with a TS plug the ring is shorted to the sleeve while the right driver keeps driving it (the dry voice is analog in both summing nodes, so muting the Daisy's wet R doesn't silence it). Through 100 Ω a TL072 sits in current limit. That's distortion, ground current shared with the tip's return (crosstalk and noise on the mono signal), and wasted battery.<\/li>\n<li><strong>Fixes (pick one):<\/strong><\/li>\n<li><strong>(a) Most reliable: two jacks, L / MONO and R<\/strong> (the standard synth convention). The R jack's switch normals R into L's summing node when nothing is in R. Analog, no firmware, no pops. It adds one hole on the far wall. That's your call against \"no new jacks\", but it isn't a patch point.<\/li>\n<li>(b) Keep one TRS jack, but bias the ring at ≤ 50–100 mV (not 3.3 V) so the plug-in step is ≈ 30 dB smaller. Use ≥ 470 Ω–1 kΩ build-out resistors on both line outputs. When TS is sensed, <strong>cut the R driver<\/strong> with the 74HC4053 (which also handles the mono sum). Bench it: <strong>UNVERIFIED<\/strong>.<\/li>\n<li>Either way, line outputs want <strong>≈ 470 Ω–1 kΩ<\/strong> series resistance, not 100 Ω. Line inputs are ≥ 10 kΩ, so nothing is lost.<\/li>\n<\/ul>\n<h3>3. A stereo TRS line out into a balanced input goes nearly silent — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> most audio interfaces and mixers take <strong>balanced TRS<\/strong> on their line inputs. A 3.5 mm TRS → 1/4\" TRS cable sends L to hot and R to cold. The input hears <strong>L − R<\/strong>. The dry voice is identical in both channels, so it <strong>cancels completely<\/strong>; only the stereo differences in the effects remain. Even a firmware \"mono\" mode (L = R) gives total silence. The TS sensing can't detect this case: the ring isn't grounded.<\/li>\n<li><strong>Why it matters:<\/strong> \"I plugged it into my interface and only hear a thin reverb\" is the first support call every stereo-mini-jack synth gets.<\/li>\n<li><strong>Fix:<\/strong> print \"stereo · unbalanced\" by the jack. Put a <strong>3.5 mm TRS → 2 × TS (Y) cable<\/strong> in the build list and the manual. Fix (a) in item 2 avoids this problem completely.<\/li>\n<\/ul>\n<h3>4. PARA+4's digital 4th oscillator has no audio path — MUST<\/h3>\n<ul>\n<li><strong>What:<\/strong> the owner approved \"PARA+4 uses the Daisy's digital 4th osc\". But both codec outputs are now the <strong>stereo wet return<\/strong>, which enters <strong>after<\/strong> the VCA and the filter. No eng file specifies a route for a Daisy oscillator into the analog mixer and ladder. As things stand, a 4th note would bypass the filter and envelope, or steal a wet channel (and stereo with it).<\/li>\n<li><strong>Fix (decide one):<\/strong><\/li>\n<li>(a) Route the 4th oscillator through <strong>codec OUT R into the NOISE / EXT input<\/strong>, with SOURCE on EXT, so the real ladder filters it. The wet return then goes mono while PARA+4 is on. Say so on the panel or in the manual.<\/li>\n<li>(b) Use the Seed's internal DAC. Both channels are already taken (velocity, mod depth), so this needs a re-plan.<\/li>\n<li>(c) Drop PARA+4 to PARA until the path exists. The toggle's third position would then do nothing, so pick a 2-way or relabel.<\/li>\n<\/ul>\n<h3>5. The peg-key necks and the floating key strip fight each other — MUST<\/h3>\n<ul>\n<li><strong>What:<\/strong> for aftertouch, strip C floats and \"can shift ±0.5 mm\". Aftertouch §8.4 requires <strong>≥ 1 mm clearance<\/strong> around key tops, and \"nothing in the shell may touch strip C or the keys\". Cathedral §10.2 gives the peg neck a deck hole of <strong>Ø 12.0 around an Ø 11.2 neck: 0.4 mm a side<\/strong>.<\/li>\n<li><strong>Why it matters:<\/strong> the necks will rub the deck. That steals force from the pressure lanes (aftertouch reads low and differs key to key), adds friction that changes velocity, and will squeak.<\/li>\n<li><strong>Fix:<\/strong> deck hole ≥ <strong>Ø 13.2<\/strong> (neck + 2 × 1.0), or slim the neck. Check that the 12.7 head still covers the larger hole (it doesn't: Ø 13.2 &gt; 12.7, so a dark ring shows). Alternatively, centre the strip with a positive locator that doesn't carry vertical load.<\/li>\n<\/ul>\n<h3>6. TAP gestures collide; one could drop you into the bootloader — MUST (DFU) / SHOULD (the rest)<\/h3>\n<ul>\n<li><strong>What:<\/strong><\/li>\n<li>DFP §2.3 says \"hold TAP at power-on\" triggers a full autotune re-sweep. §5.3 uses a \"TAP-at-power-on gesture\" for <strong>reset-to-bootloader (DFU)<\/strong>. <strong>Same gesture, two very different results.<\/strong><\/li>\n<li>\"Hold TAP\" also queries the battery (§7.3).<\/li>\n<li>\"EMPHASIS full + hold TAP\" runs the filter calibration. EMPHASIS fully up is a normal playing position (self-oscillating filter). Holding TAP to check the battery while playing that patch would start a filter cal mid-song.<\/li>\n<li>Velocity curve and aftertouch span settings are also \"hold-TAP combinations\".<\/li>\n<li>In SYNC, TAP is also played in rhythm.<\/li>\n<li><strong>Fix:<\/strong><\/li>\n<li>Give DFU a gesture nobody does by accident: e.g. hold TAP <strong>and<\/strong> move the bend stick to the top at power-on, or use the Seed's internal BOOT button behind the service panel.<\/li>\n<li>Keep autotune on \"hold TAP at power-on\".<\/li>\n<li>Make filter cal a power-on gesture too (EMPHASIS full + hold TAP <strong>at power-on<\/strong>), not a live one.<\/li>\n<li>Battery query: double-tap-and-hold, or show it on the status light at boot.<\/li>\n<\/ul>\n<h3>7. Pops: phones and line are unmuted at power-on, power-off and during the boot VCA null — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> only the speaker has a mute (LM386 enable, sequenced by the Daisy). The new stereo headphone driver and line drivers run from the ±9 V rails, which ramp up through the MC34063s. The boot routine also <strong>deliberately steps the VCA's CV<\/strong> to null its thump (DFP §2.2). All of that reaches phones and line.<\/li>\n<li><strong>Why it matters:<\/strong> a loud thump in headphones at every power-on, and into a mixer or PA.<\/li>\n<li><strong>Fix:<\/strong> a shunt mute (2 small-signal BJTs or a 4053 section) on phones L / R and line L / R, held muted by a pull-down at reset, released by the Daisy after boot calibration plus ≈ 200 ms. Use the same control as the LM386 enable. Mute again on the low-battery cut. Cost ≈ $0.30.<\/li>\n<\/ul>\n<h3>8. The \"gate-aware\" FX input mute will chop release tails — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> DFP §6.2 mutes the effects input when no gate is on, to keep the codec's noise out. But the loudness contour's decay and release are <strong>analog pots the Daisy doesn't read<\/strong>. After the key lifts, the dry note keeps sounding; the send closes at gate-off, so the echo of that tail is missing, and the reverb on a plucked note cuts short.<\/li>\n<li><strong>Fix:<\/strong> gate the send on <strong>signal level<\/strong> at codec IN L (which it already samples): open on gate or signal &gt; threshold, hold ≈ 300 ms after the signal falls below −60 dBFS, then fade over ≈ 20 ms. No new parts.<\/li>\n<\/ul>\n<h3>9. PITCH CV OUT has no DAC channel — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> the jack is in the locked I/O (\"PITCH CV out, GATE out, FILTER CV in\"). The rev 0 spec gave it an MCP4822 channel. In DFP §4.3 all eight MCP4822 channels are assigned (coarse + fine × 3, keytrack, CUTOFF) and the pitch out isn't mentioned.<\/li>\n<li><strong>Fix:<\/strong> share the <strong>keytrack channel<\/strong> (MCP #4 A), buffered and scaled to 1 V/oct ahead of the KBD CTRL toggle. Define:<\/li>\n<li>whether it includes glide and bend (it should);<\/li>\n<li>which note it carries in PARA (lowest, matching low-note priority);<\/li>\n<li>its resolution: ≈ 1.2–1.5 cents per step over a 5 V span (<strong>[CALC]<\/strong>). That's fine for notes, slightly steppy on slow glides into another synth.<\/li>\n<\/ul>\n<h3>10. Ghost parts and conflicting pin tables — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong><\/li>\n<li>Cathedral §15.4 drives the 74HC4053 from \"1 GPIO via the 74HC595 latch\". There is <strong>no 595<\/strong> in the Daisy design (DFP §0: \"74HC595 / expander: not needed\").<\/li>\n<li><a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> §v1.11.6 still lists the sensor-LDO enable on D23 and the LM386 enable on D22. DFP §9 makes <strong>D22 / D23 the Seed's DAC outputs<\/strong> (mod depth, velocity) and moves those enables to D18 / D12.<\/li>\n<li>DFP §3.2's mux layout overcounts by 2 (aftertouch §2 says so).<\/li>\n<li><strong>Why it matters:<\/strong> if someone captures the schematic from budget-variant, the LDO enable lands on a DAC pin.<\/li>\n<li><strong>Fix:<\/strong> mark §v1.11.6 superseded by DFP §9. For the 4053, use D29 or D30 (free under USB plan U1). Publish one corrected pin and mux table (with item 1).<\/li>\n<\/ul>\n<h3>11. OSC 3 CONTROL has to be read by the firmware, and it isn't — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> VCO 3's pitch is now entirely digital: RANGE 3, FREQ 3, the key note, glide, bend and drift are summed in firmware into one coarse + fine DAC pair. So \"keyboard off\" can only happen in firmware. An analog toggle can't remove the key note from a DAC value without also killing RANGE 3 and FREQ 3, which you need to set the LFO rate. PARA also needs to know whether osc 3 is a voice or the LFO. The toggle isn't in any mux list.<\/li>\n<li><strong>Fix:<\/strong> read OSC 3 CTL on a mux channel (counted in item 1). In LFO mode, firmware drops the key note, bend and glide from VCO 3 and excludes osc 3 from PARA allocation.<\/li>\n<\/ul>\n<h3>12. KEYBOARD CONTROL can't reach full tracking — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> budget-variant §v1.2 gives the filter keytrack toggle \"off / ⅓ / ⅔\". The Model D has two switches (⅓ and ⅔) that together give <strong>full<\/strong>. Full tracking is what makes a self-oscillating filter playable as a fourth, in-tune sine voice: a classic Model D move, and the automatic filter-scale cal exists precisely to make it accurate.<\/li>\n<li><strong>Fix:<\/strong> relabel and re-resistor the 3-way as <strong>off / ½ / full<\/strong> (or ⅔ / full). Same part, two resistor values.<\/li>\n<\/ul>\n<h3>13. RANGE knobs have \"firmware detents\" but no physical ones — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> RANGE × 3 are plain pots mapped to 6 zones. A player can't feel 16' from 8'. In the dark, or outdoors, you will land between zones and be an octave off. With jump-on-move from MIDI, the knob can point at 8' while 2' sounds.<\/li>\n<li><strong>Fix:<\/strong> use the same RS16211 rotary as WAVE (6 positions, stop) on a resistor ladder into the same mux channel: ≈ +$1.21 × 3, 0 pins. Drop RANGE from the MIDI-controllable set (it's a switch now: \"MIDI never flips switches\").<\/li>\n<\/ul>\n<h3>14. MIDI echo from a DAW will knock knobs out of control — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> marked knobs <strong>send<\/strong> their CC when moved. Most DAWs echo incoming MIDI back out to the instrument (MIDI thru / track monitoring). Per the jump-on-move rule, an incoming CC puts the knob \"not in control\" and lights the LED. So every knob you turn hands itself to MIDI, has to move 1.5 % to take back control, and steps. No <strong>local off<\/strong> is specified either, so notes double through the DAW.<\/li>\n<li><strong>Fix:<\/strong><\/li>\n<li>Ignore an incoming CC that matches what this knob sent in the last ≈ 200 ms.<\/li>\n<li>Add a <strong>local off<\/strong> setting (a hold-TAP combination or a CC 122 receive).<\/li>\n<li>Optionally add \"receive CC only on channel X\".<\/li>\n<\/ul>\n<h3>15. CC 10 is the wrong number for VOICE / FX PAN — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> CC 10 is the standard channel pan. Many DAWs send CC 10 = 64 (and CC 7) when a project loads or on a reset, which grabs the knob without the player touching it. Sending CC 10 out when the knob moves will pan the next synth on TRS out, or the DAW track itself.<\/li>\n<li><strong>Fix:<\/strong> use an undefined CC, as already proposed for ECHO PAN (CC 102). For example, CC 103 for VOICE PAN, or drop VOICE PAN (§15 section below).<\/li>\n<\/ul>\n<h3>16. Plugging in phones may no longer mute the speaker; LINE OUT's effect on the speaker is undefined — SHOULD<\/h3>\n<ul>\n<li><strong>What:<\/strong> rev 0 used a switched phones jack to mute the speaker. §15.4 suggests a plain TRS PCB jack (\"switches aren't needed\") as \"the same part as PHONES\" (<strong>UNVERIFIED<\/strong> part). Nothing says whether plugging into LINE OUT mutes the speaker. Into a PA, a live speaker can feed back through a vocal mic.<\/li>\n<li><strong>Fix:<\/strong> use a <strong>switched<\/strong> TRS jack for PHONES (its switch tells the Daisy, or cuts the LM386 input). Decide LINE OUT: mute the speaker or not (most players expect yes). Only one switched jack needs to tell the Daisy.<\/li>\n<\/ul>\n<h3>17. Ground loop and switcher noise when USB and LINE OUT go to the same computer — SHOULD (UNVERIFIED)<\/h3>\n<ul>\n<li><strong>What:<\/strong> USB-MIDI from a laptop plus line out into that laptop's interface is a classic ground loop. The MC34063 switchers (≈ 30–100 kHz) and the boost add whine on the shared ground.<\/li>\n<li><strong>Fix:<\/strong> mention it in the manual (run on battery, or use a USB isolator while recording). Keep the line-out ground return at the analog star. Leave footprints for a ferrite on the USB shield/ground.<\/li>\n<\/ul>\n<h3>18. Paraphonic mode surprises a player — SHOULD (behaviour to define, mostly docs)<\/h3>\n<ul>\n<li>The mixer levels are analog pots the firmware can't see. <strong>A note allocated to an oscillator that's turned down is silent<\/strong>, so chords lose notes depending on knob positions.<\/li>\n<li>\"RANGE kept\" plus per-oscillator WAVE means each note of a chord can play in a different octave and a different waveform, depending on which oscillator it lands on.<\/li>\n<li>OSC MOD on in PARA means FM between chord notes: clangy.<\/li>\n<li>Shared single-trigger envelopes mean a note added late to a decayed chord (SUSTAIN at 0) is silent.<\/li>\n<li>Velocity in PARA re-scales the whole chord's loudness on each new note.<\/li>\n<li><strong>Fix:<\/strong><\/li>\n<li>In PARA, firmware uses <strong>RANGE 1 for all oscillators<\/strong> (RANGE 2 / 3 ignored), and retriggers the contours on each new note-on.<\/li>\n<li>The manual says \"set OSC 1–3 levels equal for chords\".<\/li>\n<li>Exclude osc 3 when OSC 3 CTL is off (item 11).<\/li>\n<\/ul>\n<h3>19. Runaway feedback and shimmer can clip the codec — NICE<\/h3>\n<ul>\n<li>TAPE REPEATS \"to controlled runaway\" into a long HALL or SHIMMER builds level fast. Add a soft limiter on the wet bus before the DAC (firmware), and a <strong>≈ 60–80 Hz high-pass on the send<\/strong>. That removes VCA thump residue and low-end mud from repeats and the reverb.<\/li>\n<\/ul>\n<h3>20. The speaker will be quiet in a park, and its draw isn't in the power budget — NICE / SHOULD<\/h3>\n<ul>\n<li>An LM386 on 5 V into a 50–60 mm driver gives a few hundred mW at best (<strong>UNVERIFIED<\/strong> at this load). The grille open area is down 35–40 % (cathedral §14). The power table carries \"LM386, mux, DACs, MIDI, LEDs ≈ 0.07–0.35 W\", but loud speaker playback alone is likely ≈ 0.5–0.8 W at the 5 V rail <strong>[ENG]<\/strong>, against an already thin 1 A boost.<\/li>\n<li>Count it. Consider the PAM8302 class-D module (ready-made, rev 0 priced it at $3.95): it's more efficient and louder. Bench the loudness with the real grille before the lid is fixed.<\/li>\n<\/ul>\n<h3>21. Smaller items — NICE<\/h3>\n<ul>\n<li><strong>SOURCE \"feedback\":<\/strong> say where it's tapped. It should be the <strong>dry VCA out, pre-FX and pre-VOLUME<\/strong>. If it's taken after the output mixer, the digital wet and its latency enter the ladder loop and the feedback changes with VOLUME and the pans.<\/li>\n<li><strong>Velocity → FILT<\/strong> is a step added to the CUTOFF CV at note-on. On legato or overlapping notes that's an audible jump in the previous tail. Slew it ≈ 2–5 ms.<\/li>\n<li><strong>Bend:<\/strong> range not specified (suggest ±2 semitones, settable), and pitch bend in / out over MIDI isn't stated.<\/li>\n<li><strong>FOLD hinge ribbon:<\/strong> stereo adds wet R, VOLUME's second gang, a line R driver, the sense line and a mute line. Recount the ribbon pins.<\/li>\n<li><strong>Low battery:<\/strong> \"at 3.3 V mutes the FX\". Fade them over ≈ 2 s instead; a sudden dry room mid-song sounds like a fault.<\/li>\n<li><strong>Reach:<\/strong> in layout B, REPEATS and VOLUME sit on the lid's top row. When a TAPE echo runs away, you want both under your hand. A player's note, not a rule.<\/li>\n<li><strong>Dual-gang 9 mm VOLUME:<\/strong> cheap gangs mis-track at low settings, which shifts the stereo image. It's fine as a known trade; the part in T18 is <strong>UNVERIFIED<\/strong>.<\/li>\n<li><strong>Headphone driver<\/strong> draws quiescent current all the time, not \"only with phones in\", unless it's switched.<\/li>\n<\/ul>\n<hr />\n<h2>§15 stereo and the pan redesign (\"pan the delay into the reverb separately from the dry signal… and sync that\")<\/h2>\n<p>The §15.5 draft (two pans, ECHO PAN becomes a synced auto-pan when FREE / SYNC is on \"sync\") is a reasonable first reading. As a player and DSP designer I see these problems:<\/p>\n<p><strong>P1. One of the two pans will barely be heard — SHOULD.<\/strong> TAPE, BBD and CLEAN are mono delay lines, so whatever VOICE PAN does to the echo's input is summed away, and ECHO PAN then decides where the repeats sit. VOICE PAN is left placing the voice's direct send into the reverb. A reverb smears its input position (a plate or spring heavily so), so on most settings VOICE PAN moves almost nothing. A knob that seems to do nothing is worse than no knob.\n→ <strong>Drop VOICE PAN.<\/strong> The voice enters both effects centred. Use the freed slot to bring <strong>TAP back into the FX row<\/strong>, where it belongs with FREE / SYNC and TIME.<\/p>\n<p><strong>P2. An auto-pan whose rate equals the echo division lands the repeats wherever your note happened to start — SHOULD.<\/strong> With the pan swinging once per two repeats, repeat k sits at ±sin(φ₀), where φ₀ is the swing's phase when you played the note. Play on the swing's zero-crossing and every repeat sits in the <strong>centre<\/strong>; play a quarter-cycle later and they alternate hard left and right. So the effect depends on timing you can't hear or see.\n→ Do the movement <strong>per pass, inside the feedback loop<\/strong>: each repeat steps to the mirror position of the last one, starting from the knob's side. That's deterministic, always in time (it rides the echo's own clock, synced or free), and gives exactly the \"delay bouncing across, blooming into the reverb\" result.<\/p>\n<p><strong>P3. It collides with the PING-PONG type — MUST (define it).<\/strong> PING-PONG already alternates sides every repeat. Add an auto-pan that also flips every repeat and the two cancel: <strong>all repeats land on one side.<\/strong>\n→ Pick one meaning:\n- <strong>Recommended:<\/strong> the movement <em>is<\/em> PING-PONG. In PING-PONG, ECHO PAN sets the start side and the width. In TAPE / BBD / CLEAN, ECHO PAN is a still position.\n- This needs <strong>no switch and no FREE / SYNC coupling<\/strong>. The movement is synced whenever TIME is synced (to clock or TAP) and free when TIME is free. The owner gets \"panned delay into the reverb\" (any type) and \"moving delay in time\" (PING-PONG) from <strong>one knob<\/strong>.\n- Cost: movement comes with PING-PONG's clean voicing. A firmware option could give PING-PONG the tape wear (darkening, wow) so a moving tape echo exists too: <strong>NICE<\/strong>.<\/p>\n<p><strong>P4. Riding FREE / SYNC couples two unrelated decisions — SHOULD.<\/strong> Under the draft, a synced echo can't sit still off to one side (the most common dub use: echo on the left, voice in the middle), and in the park in FREE mode you can't get movement. Flipping FREE / SYNC also silently changes what the pan knob does. That's the hidden-mode problem echo-clock.md §3 rejected option A for.\n→ P3's mapping removes the coupling. If the owner really wants a slow, sweeping auto-pan (a bar-length LFO, not per repeat), that's a different effect and honestly needs its own STILL / MOVE toggle. That toggle needs the 4th mux (item 1) and a slot.<\/p>\n<p><strong>P5. A constant-sum law makes a moving pan pulse on headphones — NICE.<\/strong> Constant sum (−6 dB at centre) is right for a <em>static<\/em> pan heard on the mono speaker. A pan that moves dips about 3 dB in power each time it crosses the centre: a tremolo at twice the pan rate on phones. With P2's stepped repeats, each repeat sits still, so the problem mostly goes away. If any continuous motion stays, use a −4.5 dB compromise law for it (the speaker sum then wobbles ≈ ±1.5 dB, which is barely audible).<\/p>\n<p><strong>P6. The reverb must take stereo input — agree.<\/strong> The draft is right: a Dattorro plate sums its input. Without separate input diffusers on PLATE / SPRING / SHIMMER, \"pan the delay into the reverb\" does nothing on three of four types. Budget it (≈ +10–15 % of one reverb, per the draft, <strong>UNVERIFIED<\/strong> until the spike measures it).<\/p>\n<p><strong>P7. \"Separately from the dry signal\" — ask what he means — SHOULD.<\/strong> If he expects to pan the <strong>dry voice<\/strong> too: it's mono analog after the VCA, so it needs a passive pan pot into the two summing nodes (≈ $0.60, no MIDI). It only affects phones and line; the speaker is mono. Ask one question: \"Do you want the dry voice movable left / right, or is centred fine?\"<\/p>\n<p><strong>P8. MIDI for the pans.<\/strong> ECHO PAN on CC 102 is fine. Move VOICE PAN off CC 10 (item 15), or drop it (P1). If ECHO MIX and REVERB MIX aren't MIDI-controllable but a pan is, players will find that backwards. Automating the effect <em>amounts<\/em> is the more common need. Consider giving the two MIX knobs CCs as well (owner's call; it doesn't break \"knob-only controls send no MIDI\", it just moves them into the marked set).<\/p>\n<p><strong>P9. Mono sum and TS behaviour hold up.<\/strong> Static pans vanish into the speaker's mono sum and the TS-mono tip with no level change. That's correct and a good reason for constant sum. Item 2 still has to be fixed for the TS path to exist at all.<\/p>\n<hr />\n<h2>Numbered suggestions<\/h2>\n<ol>\n<li>Add a 4th CD74HC4067 on D20 (ADC3), move the battery divider onto it, and publish one recounted mux table (item 1). <strong>MUST<\/strong><\/li>\n<li>Replace the TS ring-sense with L / MONO + R jacks, or re-do it with a low bias, build-out resistors and an R-driver cut; bench it before layout (item 2). <strong>MUST<\/strong><\/li>\n<li>Give PARA+4 an audio path (codec R → EXT input through the ladder; wet goes mono in PARA+4), or make the toggle 2-way until it has one (item 4). <strong>MUST<\/strong><\/li>\n<li>Widen the peg deck holes to ≥ 1 mm clearance per side, or slim the neck, to match the floating strip (item 5). <strong>MUST<\/strong><\/li>\n<li>Split the TAP-at-power-on gesture: autotune ≠ DFU. Make filter cal a power-on-only gesture (item 6). <strong>MUST<\/strong><\/li>\n<li>Pan design: drop VOICE PAN; keep one ECHO PAN (still position for TAPE / BBD / CLEAN); make PING-PONG the moving, always-in-time type with ECHO PAN as start side and width; apply the movement per pass in the loop; stereo-input diffusers on every reverb type; bring TAP back to the FX row (§15 P1–P6). <strong>SHOULD<\/strong><\/li>\n<li>Ask the owner whether the dry voice should be pannable (P7). <strong>SHOULD<\/strong><\/li>\n<li>Output mute on phones and line, held at reset and through boot calibration (item 7). <strong>SHOULD<\/strong><\/li>\n<li>Level-based (not gate-based) FX send gating with a hold and a fade (item 8). <strong>SHOULD<\/strong><\/li>\n<li>Assign PITCH CV OUT to the keytrack DAC channel and define glide, bend and PARA behaviour (item 9). <strong>SHOULD<\/strong><\/li>\n<li>Read OSC 3 CTL in firmware; KBD CTRL off / ½ / full; RANGE on detented 6-way rotaries (items 11–13). <strong>SHOULD<\/strong><\/li>\n<li>MIDI hygiene: ignore echoed CCs, add local off, take pan off CC 10 (items 14–15). <strong>SHOULD<\/strong><\/li>\n<li>Switched PHONES jack for speaker mute; decide whether LINE OUT mutes the speaker; print \"stereo · unbalanced\" and add a TRS → 2 × TS cable to the build list (items 3, 16). <strong>SHOULD<\/strong><\/li>\n<li>Fix the stale 74HC595 reference and mark budget-variant §v1.11.6 superseded by DFP §9 (item 10). <strong>SHOULD<\/strong><\/li>\n<li>Define PARA: RANGE 1 for all, retrigger on new notes, exclude osc 3 in LFO mode; manual note on mixer levels (item 18). <strong>SHOULD<\/strong><\/li>\n<li>Wet-bus soft limiter, a send high-pass, a 2 s FX fade on low battery, a slewed velocity cutoff step (items 19, 21). <strong>NICE<\/strong><\/li>\n<li>Add speaker draw to the power budget, bench loudness with the real grille, and consider the PAM8302 module (item 20). <strong>NICE / SHOULD<\/strong><\/li>\n<li>Recount the FOLD hinge ribbon for the stereo lines (item 21). <strong>SHOULD<\/strong> if FOLD is built.<\/li>\n<\/ol>", "jump": ["Score", "Gotchas and nonsense, most important first", "§15 stereo and the pan redesign (\"pan the delay into the reverb separately from the dry signal… and sync that\")", "Numbered suggestions"]}], "updated": {"when": "13 Nov 16:46", "what": "Docs: effects feature doc (decided / proposed / open)"}, "waiting": {"intro": "<p>Decisions only you can make, newest first. The team keeps working around them; each answer unblocks the part named. When you answer in chat, the orchestrator records it in the owner record and removes it from here.<\/p>", "items": [{"n": "1", "title": "CATHEDRAL speaker grille: tower or circle", "unblocks": "the final CATHEDRAL renders and the director's score.", "html": "<p><strong>Unblocks:<\/strong> the final CATHEDRAL renders and the director's score.\n<strong>Context:<\/strong> you rejected the speaker on the key side and the eye shape, and asked for vertical lines or an off-centre circle. Both sit in the lid band, with the effects together on the lid's top row (layout B).<\/p>\n<ul>\n<li><strong>Tower:<\/strong> vertical slots stepping 8 → 18 → 8 mm, like a row of organ pipes. <em>Visual designer's pick.<\/em><\/li>\n<li><strong>Off-centre circle:<\/strong> Ø 25 mm, 17 mm right of the axis, vertical slots inside. It only fits in that one spot.<\/li>\n<\/ul>\n<p>Both clear every label, and both open about the same area (≈ 265–290 mm², about a third less than today; loudness not yet checked).<\/p>\n<figure><a href=\"media/X-cathedral-img-cathedral-speaker-options-standing.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/X-cathedral-img-cathedral-speaker-options-standing.jpg\" width=\"1400\" height=\"980\" alt=\"Left: slot tower. Right: off-centre circle. Close-ups below. Not scored; keys shown as a colour swap onl
