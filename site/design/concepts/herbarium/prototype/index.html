 Pegs on FOLD might give an \"organ like\" feel. He said that's an example, not an official direction.\n- Inspiration sources: principles of furniture design (he mentioned a book called \"principles of design\"; which book isn't confirmed), instruments, tools, artistic forms and emotion.\n- \"i want to take this to the park and be inspired\": playing it outdoors, away from a desk, is a use the design should serve and inspire.\n- The echo must sync to MIDI tempo when MIDI clock is present. (The spec already parses USB and TRS MIDI clock into the FX tempo. What the controls do under clock isn't designed yet; the systems designer defines it.)\n- All earlier owner rules and the locked spec still bind the branches unless he changes them.\n2026-11-13 11:58 Q: echo sync — A (automatic, hidden hold-TAP + turn-TIME override, $0) or B (FREE / SYNC toggle by TIME, ≈ $1)? → Owner: \"B\"\nDECISION: add a FREE / SYNC toggle near TIME (design/branches/echo-clock.md option B). FREE: TIME ≈ 20 ms–2 s, clock ignored. SYNC: TIME picks a note division; tempo from MIDI clock (USB or TRS) if present, else TAP. Applies to whichever concept is built (and the branches). Placement is the designers' call per concept.<\/p>\n<p>2026-11-13 12:33 Owner (verbatim): \"why make anything on a3 at all? im not in europe and im not printing\"\nRecorded as: drop A3 as the default format for mocks and sheets. Nothing is printed; images are viewed on screen (phone first, per the site's J14). The format is the designers' call, made for on-screen viewing. Locked versions stay as they are.\n2026-11-13 12:39 Owner (verbatim): \"dont do phone first -- do images that will be great on the site that i can view responsively\"\nRecorded as: CORRECTION to 12:33 — not phone-first. Images are made to look great on the project site and to work responsively across screen sizes (phone through desktop).\n2026-11-13 12:41 Owner (verbatim): \"i really only want images for things that need to be images -- text should be html and stuff\"\nRecorded as: images only for what has to be visual (renders, drawings, diagrams, plots). Text (principles, specs, notes, labels, tables, scores) is real HTML on the site, not baked into images. This retires the \"sheet\" format (text plus pictures in one image) for new work.<\/p>\n<p>2026-11-13 13:13 Owner (verbatim): \"dont render a bunch of images unnecessarily\"\nRecorded as: render an image only when it is needed to judge or show something; no image sets made by habit, no pictures of web pages.<\/p>\n<h2>2026-11-13 14:12–14:18 — CHAMBER + FOLD, toward CATHEDRAL<\/h2>\n<p>Owner (verbatim, 14:12): \"i want to lock in on cathedral and fold right now. what are the differences between them so i can find the best middle ground\"\n(Orchestrator read \"cathedral\" as CHAMBER and sent the differences table.)\nOwner (verbatim, 14:18): \"i'm not sure i like the oxblood spine, it feels unnecessary. also the hunges on this... is there any way we could do a more hidden hinge or hidden hinges in the gap? if not these are fine. i also want to work on the speaker placement and design metaphors a bit.. the speaker palcement creates an odd gap between some of the elements, and the effects &amp; out is real far from echo and reveb controls... those should be together. i also wonder if the protective feet couldn't be one with the screws that screw the case in so they aren't visible. i'd like the engraving texture in the case to be more \"woody\" but i do like the subtlety and relative detail (eg. number of lines and shapes... straight woodgrain would be too detailed imo). i also want to make sure the rounding of the faceplates is consistent... the front edge is squared unnecessarily. and i want to make sure that the color of the pegs and buttons go together better... i feel like there are too many colors, and the brown feels out of place. explore options there. i wish the screen had more elements of rounding... either tapered shape of lines (so top and bottom are smallest, next in is longer, next in is longer, etc) or circular. i think 'cathedral' is a better POV than chamber. see how that affects the ideas\"\nRecorded as:\n- FOCUS: CHAMBER and FOLD v1.1 only; find the middle ground. Rename the point of view CATHEDRAL (instead of CHAMBER) and let that reshape the ideas.\n- Oxblood spine: probably unnecessary — not sure he likes it.\n- Hinges: explore a more hidden hinge, or hidden hinges in the gap; if not possible, current hinges are fine.\n- Speaker placement: creates an odd gap between elements; rework placement and the design metaphors around it.\n- FX &amp; OUT (the FX output/jack area) is too far from the ECHO and REVERB controls; they should be together. (Exact meaning of \"effects &amp; out\" to be confirmed by the team from the panel.)\n- Feet: could the protective feet be one with the case screws so neither is visible?\n- Engraving on the case: more \"woody\", keep the subtlety and amount of detail (number of lines/shapes); straight woodgrain would be too detailed.\n- Faceplates: rounding must be consistent; the front edge is squared unnecessarily.\n- Colours: pegs and buttons should go together better; too many colours; the brown feels out of place. Explore options.\n- \"the screen\": wants more rounding — tapered lines (shortest at top and bottom, longer toward the middle) or circular. (\"Screen\" most likely the speaker grille; the team confirms.)<\/p>\n<p>2026-11-13 14:30–14:32 Owner asked (verbatim): \"Are these pegs sourceable?\" / \"What about the brass ones?\" / \"The Wooden ones you linked do not have shafts that match the prototype\"\nRecorded as: the peg keys as drawn (HUSH, CHAMBER, CATHEDRAL, RAIN) assume a plug shank that stock button plugs do not have. The peg mount must be redesigned around a real, buyable part with known head and tenon sizes, or the peg approach revisited.<\/p>\n<p>2026-11-13 14:33 Owner (verbatim): \"I don’t know how to machine — the keys need to be printed or purchasable\"\nRecorded as: NO MACHINING by the owner. Keys (and key tops) must be 3D-printed or bought. This RELAXES the earlier \"keys must be real bought parts, never printed\" rule: printed key tops are now allowed. It also bears on any part the design has him cut or drill from stock (e.g. brass stays and hinge leaves cut from flat bar): those must become bought or printed parts too. Laser cutting at Vector Space was allowed earlier and was not mentioned here.\n2026-11-13 14:34 Owner (verbatim): \"They can be printed externally too - I know you can get metal prints\"\nRecorded as: external print services are allowed, including metal printing (e.g. printed brass or steel parts ordered from a service). Parts may be printed by him or ordered printed.\n2026-11-13 14:40 Owner (verbatim): \"I don’t want a spine can we route cables through a hinge. Engraving texture I meant fine line texture — I’ll probably do a design for the pipe lines. And what about brass and black keys? Or all brass? Could 3d print and reminds me of a cathedral\"\nRecorded as:\n- NO SPINE. Asks whether the cables (the hinge ribbon) can route through a hinge. (Implies the back slot question needs another answer.)\n- \"Engraving texture\" = the fine line texture on the case (walnut body), not the pipe lines. The OWNER will likely design the pipe lines himself; the team leaves the façade line design to him (placeholder only).\n- KEYS: explore brass + black keys, or all brass. Could be 3D printed (metal printing is allowed); brass reminds him of a cathedral.\n2026-11-13 14:41 Owner (verbatim): \"Premade wooden caps on a shaft that also is premade or part of the key is fine too just thinking\"\nRecorded as: also acceptable — bought wooden caps on a shaft that is either bought or part of the (printed) key. Thinking out loud; an option, not a decision.<\/p>\n<p>2026-11-13 15:07 (layout decision) Owner (verbatim): \"I don’t like the speaker on the key side but I also don’t like the eye shape\"\nRecorded as: neither speaker solution. Rejects B's round speaker at the base (key side) AND A's lens (\"eye\") window in the band. He did not reject B's effects grouping; his earlier ask that FX sit with echo/reverb stands. A third speaker answer is needed.\n2026-11-13 15:12 Owner (verbatim): \"I like the idea of the lines going up and down vs sideways. Or we could go back to a circle and maybe not centered?\"\nRecorded as: grille in the lid band (P1 area implied): prefers VERTICAL lines (up and down) over horizontal. Alternative: a circle, possibly off-centre. Both open.\n2026-11-13 15:18 Owner (verbatim): \"Also occurs to me that the verb and delay are stereo…should we have two? Also is there stereo output?\"\nRecorded as: asks whether to have two speakers (stereo) given stereo reverb/delay, and whether there is a stereo output. (Spec today: one mono PHONES/LINE jack via the LM386 and one speaker; the Daisy codec is stereo; stereo phones was noted as an optional wiring choice.) Grille choice (tower vs circle) still pending.\n2026-11-13 15:22 Owner (verbatim): \"Stereo phones is fine but I need to pan the signal into the effects\"\nRecorded as: DECISION — stereo phones: yes (one speaker; second speaker not taken). Line out stereo: not stated. NEW REQUEST: a way to pan the (mono) synth signal into the stereo effects. How (a pan control, its range, digital or analog, placement) is for the team; it likely adds a control.\n2026-11-13 15:23 Owner (verbatim): \"Stereo line out\"\nRecorded as: DECISION — line out is stereo too (TRS). Stereo phones + stereo line out, one speaker.\n2026-11-13 15:24 Owner (verbatim): \"Left channel should be mono tho if stereo isn’t plugged in\"\nRecorded as: REQUIREMENT — with a mono (TS) cable plugged in, the left/tip output carries the full mono sum (L+R), not just the left channel. Applies to the stereo outputs.\n2026-11-13 15:44 Owner (verbatim): \"Yea sure on midi. And is it sending the delay through the pan too or just the dry\"\nRecorded as: DECISION — FX PAN receives MIDI pan (CC 10). Asked what the pan affects; answered: it pans the signal going INTO the echo and reverb (so the delay and reverb come out from that side); the dry voice is not panned and stays centred.\n2026-11-13 15:50 Owner (verbatim): \"Run this all through a dedicated audio engineer / synth expert for gotchas and unexpected functionality that doesn’t make sense\"\nRecorded as: an independent expert review (audio engineer / synth designer) of the whole instrument's audio, control and MIDI behaviour, including today's additions. Reports to the owner; decides nothing. MIDI pan \"send\" question still open.\n2026-11-13 15:50 Owner (verbatim): \"I think I’d like to pan the delay into the reverb separately from the dry signal but also would want to be able to sync that\"\nRecorded as: wants the DELAY panned into the REVERB separately from the dry signal's pan, and wants that pan to be syncable (most likely a tempo-synced auto-pan; being confirmed). Supersedes the single FX PAN design as stated.\n2026-11-13 15:53 Owner (verbatim): \"No the pan would be audio signal. Basically I’d like to pan just the delay separately from the full dry but also I’d like to be able to have the pan signals sync\"\nRecorded as: NOT a tempo auto-pan. Wants two audio pans: (1) the full DRY signal panned on the outputs, (2) the DELAY panned separately; plus the option to have the two pans \"sync\" — most likely linked so they move together (exact meaning being confirmed).\n2026-11-13 15:54 Owner (verbatim): \"Follow dry\"\nRecorded as: DECISION — when the pans are synced/linked, the delay pan FOLLOWS the dry pan (same direction). MIDI send question (knobs receive-only? keys send notes?) still open.<\/p>\n<h2>2026-11-13 16:18–16:21 — expert review follow-up, MIDI, architecture docs<\/h2>\n<p>Owner (verbatim, 16:18): \"yes but first walk me through the midi implementation\" (yes = send the expert review's fixes to the team).\nOwner (verbatim, 16:21): \"heres what im thinking -- we need on that site architectural documentation and clear docs for each featureset. lets start defining this stuff and writing it down 1 by 1 in an easily delineated fashion, so we can make sure the architectural decisions are sound across the device. sorry i didnt mean is usbmidi capable of send, but rather are we already doing send. if we do send then we gotta think about ALL of the features, and this is pretty definitively not a midi controller. though if it's free it could be.\"\nRecorded as:\n- NEW WORK: architecture documentation plus one clear doc per feature set, written one at a time, clearly separated, so architectural decisions can be checked as sound across the whole device. These docs live on the project site.\n- MIDI stance: \"pretty definitively not a midi controller\". Sending MIDI means thinking about ALL features, so send only \"if it's free\". Today the spec sends only channel pressure (aftertouch); notes and knobs sending is not specified.\n- The expert review's fixes go to the team.\n2026-11-13 16:22 Owner (verbatim): \"the workflow im much more interested in is controlling it from another device or mainly a DAW. im not so worried about using it as a controller for other things. but if it's free we could explore it\"\nRecorded as: PRIMARY MIDI WORKFLOW = the instrument is CONTROLLED from another device, mainly a DAW (MIDI in). Using it as a controller for other gear is secondary; explore sending only where it is free.<\/p>\n<p>2026-11-13 16:23 Owner (verbatim): \"im going to put the github on github pages so i can easily access it from there instead of here. i want all review and logs and documents there, not here\"\nRecorded as: the owner will publish the repo with GitHub Pages and view everything there. ALL reviews, logs and documents go in the repo (and so on the Pages site), not as files sent in chat. Hosting for the project site moves from the claude.ai artifact to GitHub Pages (static; it updates when sessions commit and push).\n2026-11-13 16:24 Owner (verbatim): \"ok thats fine if its not private\"\nRecorded as: DECISION — a public GitHub Pages site is fine (anyone with the address can see it). Hosting: GitHub Pages from the repo root or a GitHub Action (not /docs).<\/p>\n<p>2026-11-13 16:28–16:29 Owner (verbatim): \"re: architecture i think the way its organized is just unclear. have the systems designer take a look. is it up on pages right now? do that first\" · \"i dont want a bunch of .md docs, i want this stuff on website\"\nRecorded as: (1) put the site on GitHub Pages first — done as far as a session can: build pushed to branch gh-pages; turning Pages on is blocked from sessions (owner does it in Settings → Pages). (2) The architecture doc's organisation is unclear — systems designer to rework it. (3) Docs, architecture and reviews must be ON THE WEBSITE (rendered pages), not markdown files he has to open. Markdown stays only as the source the site builds from.\n2026-11-13 16:40 Owner (verbatim): \"gh pages is fine\"\nRecorded as: DECISION — the site keeps deploying from the gh-pages branch. Sessions rebuild and push it after changes (site/publish.sh).<\/p>\n<p>2026-11-13 16:43 Owner (verbatim), on the live site: \"every page here needs a point i literally have no idea what im looking at in \"latest\" for example. and where do i see the grille options and all of the other options\"\nRecorded as: every page must state its point (what it is and why you are here) up front; \"Latest\" does not make sense to him. The site must show the open decisions waiting on him, with their options (e.g. the grille options) and images, in one obvious place.<\/p>", "lead": "On hush and one sheet — I'd like the enclosure to be as \"unibody\" (on each half with fold) as possible. Screws in the back instead of front, etc, where panels need to be installed. Hush should be more rounded around the edges, organically, ", "jump": ["2026-11-12 — start of Little D design work", "Decisions already made that bind Little D (from the shared history; see eng/budget-variant.md)", "2026-11-12 — owner answers (asked one at a time at the owner's request: \"Also ask me open qs one at a time\")", "2026-11-12 — owner feedback on round-1 sheets (seen marked rough)", "2026-11-12 — after seeing the four 9s (HUSH, FOLD, TYPE CASE, HYMNAL)", "2026-11-12 22:30 — owner feedback on round 4", "2026-11-13 11:47 — branched creative rounds (the request is back on)", "2026-11-13 14:12–14:18 — CHAMBER + FOLD, toward CATHEDRAL", "2026-11-13 16:18–16:21 — expert review follow-up, MIDI, architecture docs"], "code": "R-001"}, "R-002": {"kind": "record", "sub": "record", "title": "Director scores, rounds 1–5", "stage": "Concept", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "design/scores.md", "html": "<h1>Little D: director scores<\/h1>\n<h2>Round 1: concepts (2026-11-12)<\/h2>\n<p>Basis: for each concept I read <code>how-it-works.md<\/code>, <code>how-it-looks-and-feels.md<\/code>, and sheet A (the look). I also read TYPE CASE sheet C (the section) and ONE SHEET sheet D (the nest), plus <a href=\"#i-D-003\"><code>common-how-it-works.md<\/code><\/a>, the new owner answers in <a href=\"#i-R-001\"><code>owner.md<\/code><\/a>, and <code>eng/velocity-and-keys-v2.md<\/code>. Scores are on the idea and how it fits the product and the brand, not on polish. They're <strong>provisional<\/strong>: there's no brand yet, and the owner has said he has to see mocks to know which look appeals.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Score<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\"><strong>TYPE CASE<\/strong><\/td>\n<td data-label=\"Score\"><strong>8<\/strong><\/td>\n<td data-label=\"Verdict\">Fix and keep. Closest to a 9.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>HYMNAL (cigar-box fork)<\/strong><\/td>\n<td data-label=\"Score\"><strong>8<\/strong><\/td>\n<td data-label=\"Verdict\">Fix and keep. The best \"vibe\" picture in the set.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>HUSH<\/strong><\/td>\n<td data-label=\"Score\"><strong>7<\/strong><\/td>\n<td data-label=\"Verdict\">Fix and keep. The most distinct form; cost is the blocker.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>ONE SHEET<\/strong><\/td>\n<td data-label=\"Score\"><strong>6<\/strong><\/td>\n<td data-label=\"Verdict\"><strong>Replace<\/strong> with UNDER GLASS (below). Its making rules survive as an option.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Nothing passes at 9 this round.<\/strong> The fixes are specific and small for three of the four. One fast round, then the owner sees them.<\/p>\n<hr />\n<h3>Rulings asked for<\/h3>\n<p><strong>R1. The lip rule (H3) is retired as a mechanical rule.<\/strong> With bought Choc V2 switches, the lip no longer stops or carries the keys. \"The lip is the spine\" is no longer true, and keeping it would be decoration. It's replaced by <strong>H3′, the key edge:<\/strong>\n- Wherever the keys meet the body, the edge comes from the concept's idea: rail, edging, skin or glass.\n- It hides the switch housings and the back of strip C.\n- It keeps the key tops from snagging in carry.\n- A side section is still required, but now only as a fit check (heights, switch, top, magnet over a flat sensor). It's no longer the place the idea has to be argued.\n- TYPE CASE (rail), HYMNAL (edging) and HUSH (felt deck as the bottom stop) already meet H3′. ONE SHEET's \"lip as a key-name ruler\" was the weakest answer: an engraved strip with no job.<\/p>\n<p><strong>R2. Knob gaps: 4 mm is rejected.<\/strong> A Tayda KN1250 (14.9 mm) at 19 mm pitch leaves 4.1 mm between knobs. You'll catch the neighbour on every turn, and the mocks look crowded (section IV most of all).\n- <strong>Keep the KN1250.<\/strong> It's priced, it's stocked in colours, and it's the one family across the set.\n- <strong>Minimum left-right pitch is 20 mm<\/strong> (5 mm gap) everywhere.\n- <strong>The played row in IV gets 24 mm<\/strong> (≈ 9 mm gaps): CUTOFF, EMPHASIS, CONTOUR AMT.\n- Take the width from the six 9 mm section gaps (down to 6 mm; TYPE CASE keeps 9 where it has walls).\n- The front-back pitch (23 mm) is fine.\n- If IV still won't fit, move the velocity toggle to the back row. Don't shrink the knob.<\/p>\n<p><strong>R3. Thickness, against the owner's \"~36 body / ≤ 40 to knob tops\".<\/strong> ONE SHEET (27) and HUSH (30) meet it. HYMNAL meets it: 37 box, 40 closed. TYPE CASE's 40 rim is a 40 body: inside the ceiling, but chunky (see its fixes). <strong>All four assume eng's thin-speaker answer (E-L2).<\/strong> Eng has to answer it before round 2, or every number moves by 3 mm.<\/p>\n<hr />\n<h3>TYPE CASE: 8<\/h3>\n<p>Seen: sheet A (3/4 and carry view), sheet C (section).<\/p>\n<p><strong>What's right.<\/strong> Every principle follows from the idea, and the idea follows from the job: the walls are structure, section grouping and blind-findable boundaries at once.\n- The rim protects with no lid and no sleeve.\n- The ink-dyed floors engraved back to pale wood give legends with no second process (H6, beautifully).\n- The cards in the front rail are the owner's hand, swappable.\n- It's the designed-for-use pole done properly, at about the $12 line.<\/p>\n<p><strong>Likely owner objections<\/strong>\n1. \"It's thick: a wooden tray.\" The rim is 40 and the low key step makes it read taller at the back. <strong>Likely.<\/strong>\n2. The knobs look crammed (R2). <strong>Likely.<\/strong>\n3. The cards read as blank grey stickers in the mock, so the label idea doesn't land in the picture.\n4. \"Looks like a craft box\" if the rim corners and proportions get lazy. The mock currently passes.<\/p>\n<p><strong>Fixes<\/strong>\n1. Apply R2. Re-render IV with the 24 mm played row.\n2. Bring the rim to <strong>≤ 38<\/strong>: knob tops are 38, so the rim can sit level with the knob tops (systems' original intent), not 2 mm above. Chamfer or round the outer top edge 1–2 mm so the tray reads lighter.\n3. Render the cards with real content: numeral + name, letterpress-black on white. Make them big enough to read in the 3/4 view.\n4. Show the worst knob next to a wall with a thumb, at real size (director push 3, still outstanding).\n5. State the cost at ≤ $15 with India ink as the default (it is already, nearly).<\/p>\n<h3>HYMNAL (cigar-box fork): 8<\/h3>\n<p>Seen: sheet A (open 3/4 and closed).<\/p>\n<p><strong>What's right.<\/strong>\n- The strongest single picture in the set: lid up as a desk with the patch chart, front down as a palm rest, a labelled box closed.\n- The cigar-box lineage is the right argument for a cheap home-built instrument.\n- The patch chart in the lid answers \"no recall\" for a songwriter.\n- A self-protecting box that hides everything, keys included.\n- The raised lid behind the keys is a fair Model D nod, earned by the box rather than copied.<\/p>\n<p><strong>Likely owner objections<\/strong>\n1. <strong>Cost.<\/strong> Enclosure ≈ $15–34 <strong>plus $29.85 of stabilisers<\/strong> for piano tops. Against \"250 feels high\" that's a probable no. <strong>Likely.<\/strong>\n2. Retro costume: red knobs + cedar + a script label + cream edging push the whole thing toward novelty. Principle 4 says \"new on the panel\", but the panel is also red and cream. <strong>Possible.<\/strong>\n3. Tobacco connotation of \"cigar box\": minor, but worth naming.\n4. Three hinges plus a ribbon plus an elastic band is creeping toward rigmarole.<\/p>\n<p><strong>Fixes<\/strong>\n1. <strong>Default to short tops<\/strong> like the others. Show piano-length tops as a clearly labelled \"+$30\" variant in a small inset, not as the concept.\n2. <strong>Lean enclosure as the default:<\/strong> oil, not shellac; a cloth-tape flap hinge for the drop front. Target ≤ $20 and state it.\n3. <strong>Make the panel genuinely modern.<\/strong> Neutral or black knobs with the cream CUTOFF hero; red only for numerals. The box carries the warmth.\n4. The label is a placeholder for the owner's own design: render it as clearly his (plain blank-label border + \"your title here\" treatment, or his hand-lettering if we have a sample). No borrowed script.\n5. Show how the drop front stays shut in carry (it's held by the lid? say so).<\/p>\n<h3>HUSH: 7<\/h3>\n<p>Seen: sheet A (3/4 and rolled parcel).<\/p>\n<p><strong>What's right.<\/strong>\n- The best-grounded idea (silence → felt), and it produces the most distinct object in the set: maple pegs rising through grey felt are unlike anything else here, and unlike any synth.\n- Felt as the bottom stop is a real job under the bought-switch route.\n- It's where the owner's Critter &amp; Guitari reference belongs.<\/p>\n<p><strong>Likely owner objections<\/strong>\n1. <strong>Cost: ≈ $59–63 on wool, $30–40 on blend<\/strong>, against a $12 line. <strong>Likely.<\/strong> This is what stops it reaching 9.\n2. Grime and pilling, durability.\n3. Do pegs play like an instrument? Velocity on round pegs on Choc switches is untested.\n4. The rolled state goes over 40 (41–42) and only protects against snags, not crushing.\n5. The birch hard plates look patchy (II's big plate especially); felt + birch + white Delrin + cream knobs is one material too many.<\/p>\n<p><strong>Fixes<\/strong>\n1. <strong>Cost-bounded version as the default: enclosure ≤ $30.<\/strong> Felt only on the visible deck and panel skin (one to two 12 × 12 sheets). Make the roll flap an optional extra, priced. Without the flap the carry state is the owner's own sleeve, which he's said is fine to show. If ≤ $30 is impossible, say what is possible.\n2. One hard material only: birch plates <em>or<\/em> white Delrin, not both. Make the plates smaller and regular (a ring per scale, not one big panel).\n3. Eng check: does the peg head landing on felt before the switch bottoms change the velocity reading or the travel? Answer in the concept.\n4. Show a palm strip and peg-collar wear plan in one small inset (replaceable parts).<\/p>\n<h3>ONE SHEET: 6, replace<\/h3>\n<p>Seen: sheet A (3/4 and in a sleeve), sheet D (the nest).<\/p>\n<p><strong>What's right.<\/strong>\n- Honest, the cheapest ($7–12), the thinnest (27).\n- The nest is real and well drawn.\n- It's the only concept that is the owner's first concern.<\/p>\n<p><strong>Why it can't get to 9.<\/strong>\n- The idea doesn't produce a form you can see. In the 3/4 it's a plain birch slab with cream knobs: the default DIY laser look I warned about in the jam, and visually almost the same object as TYPE CASE without the walls.\n- The story (the nest) lives on the bottom and in a separate sheet.\n- All-birch key tops lose the white/black distinction (sharps marked by a dot), which costs playing, and ply cross pockets risk splitting.\n- The lip is a ruler with no job (R1).\n- Against the owner's new \"I want to see breadth of exploration\", two wood-and-cream slabs in a set of four is a likely objection.\n- I proposed it, and it was my favourite. That's more reason, not less, to cut it.<\/p>\n<p><strong>What survives:<\/strong> \"one sheet, nest engraved on the bottom, everything marked in the cutting pass, recut from the file\" becomes an <strong>optional making rule<\/strong> any ply concept can adopt (TYPE CASE most naturally).<\/p>\n<p><strong>Replacement: UNDER GLASS<\/strong> (from jam Turn 2, now much stronger).\n- The owner chose a <strong>standard printed board<\/strong> (solder mask + silkscreen), so the board is worth seeing.\n- A clear acrylic top, <strong>reverse-painted<\/strong> by the owner, frames windows onto the parts worth seeing (VCO cores, the ladder).\n- Bought aluminium U-channel rails front and back.\n- It's the <strong>sleeve-body<\/strong> concept the owner asked to see alongside the self-protecting ones.\n- It's a different material, colour and character from the three warm ones: gloss, dark, technical.\n- Same rules as the others: R1–R3, short tops, enclosure ≤ $20, a 3/4 picture at the same standard. <strong>Use a different knob colour<\/strong> (black or white) so the set doesn't read as one cream family.<\/p>\n<hr />\n<h3>Set-level objection (all concepts)<\/h3>\n<p><strong>Breadth.<\/strong> All four share one footprint, one panel layout and (three of four) one cream knob. The owner asked for breadth. The shared panel is right: it's forced by fit, and his ask is about the enclosure. But the pictures have to differ more than the shells do:\n- different knob colours per concept;\n- different camera states (a closed or carried state as the main picture where it's the idea, as HYMNAL does);\n- UNDER GLASS replacing ONE SHEET.<\/p>\n<h3>Did the work change since last score?<\/h3>\n<p>First scoring round. Nothing to compare.<\/p>\n<h3>Next<\/h3>\n<p>One fast fix round: TYPE CASE, HYMNAL and HUSH fixes, plus UNDER GLASS new, against R1–R3. Eng answers E-L2 (thin speaker) in parallel. I score again. Anything at 9 goes to the owner. Given his impatience, aim for all four together in one sheet set.<\/p>\n<hr />\n<h2>Round 2: six concepts (2026-11-12)<\/h2>\n<p><strong>Basis.<\/strong>\n- For each concept I read <code>how-it-looks-and-feels.md<\/code> and sheet A, and skimmed <code>how-it-works.md<\/code> for numbers. I also read <a href=\"#i-D-003\"><code>common-how-it-works.md<\/code><\/a> (rev 5), <code>common-looks-and-feels.md<\/code>, and the full <a href=\"#i-R-001\"><code>owner.md<\/code><\/a>.\n- <strong>FOLD<\/strong> is scored on the drawn sheet (closed ≈ 48) <em>and<\/em> the pending systems fix (closed ≈ 51, CUTOFF clears D♯ with a lid 3 mm deeper).\n- The owner has already seen the round-2 A sheets unscored.<\/p>\n<p><strong>The owner's new bar.<\/strong> He said: \"this is going to be the real instrument… the most interesting thing overall.\" So the test this round is no longer just \"coherent and cheap\". It's whether each concept is the most interesting version of itself. His three new rules are now non-negotiable:\n- nothing raised among the knobs;\n- nothing raised between the keys and the controls;\n- tactile separation only if it doesn't get in the way.<\/p>\n<p>All six concepts comply.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Score<\/th>\n<th>Changed since R1?<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\"><strong>TYPE CASE<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed since R1?\">Yes, substantially<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>HYMNAL<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed since R1?\">Yes, substantially<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>HUSH<\/strong> (printed + felt)<\/td>\n<td data-label=\"Score\"><strong>8<\/strong><\/td>\n<td data-label=\"Changed since R1?\">Yes<\/td>\n<td data-label=\"Verdict\">One fix (colour), then it goes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>FOLD<\/strong> (new)<\/td>\n<td data-label=\"Score\"><strong>7<\/strong><\/td>\n<td data-label=\"Changed since R1?\">New<\/td>\n<td data-label=\"Verdict\">Fixes below<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>ONE SHEET<\/strong> (printed)<\/td>\n<td data-label=\"Score\"><strong>7<\/strong><\/td>\n<td data-label=\"Changed since R1?\">New material, same idea<\/td>\n<td data-label=\"Verdict\">Fixes below<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>UNDER GLASS<\/strong> (new)<\/td>\n<td data-label=\"Score\"><strong>6<\/strong><\/td>\n<td data-label=\"Changed since R1?\">New<\/td>\n<td data-label=\"Verdict\"><strong>Kill.<\/strong> It can't reach 9; the owner didn't ask for it<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Rulings<\/h3>\n<ul>\n<li><strong>R5. Breadth through knob colour is relaxed.<\/strong> Round 1 I asked for a different knob colour per concept, to break the sameness. It worked as a device, but now it's forcing colours against their concepts (HUSH's yellow). From here on, <strong>each concept's knob colour must follow from its idea<\/strong>. Repeating a colour is fine. Breadth now comes from material and form, which the set has.<\/li>\n<li><strong>R6. Six is too many to put in front of the owner.<\/strong> UNDER GLASS goes, which leaves five, all of which he asked for or liked.<\/li>\n<li><strong>R2 and R4 are satisfied everywhere.<\/strong> Pitch is ≥ 20 mm, IV's played row is 25/24, there's ≥ 7 mm to a section break, and keys and panel are flush.<\/li>\n<\/ul>\n<hr />\n<h3>TYPE CASE: 9 (goes to the owner)<\/h3>\n<p>Seen: sheet A, the 3/4 view and the rear carry view.<\/p>\n<p><strong>Why 9.<\/strong> It took the owner's divider complaint and turned it into a better version of its own idea.\n- The walls still exist and still stiffen the case, but they're <strong>sunk rules<\/strong>: the printer's other meaning of a rule, a strip set <em>in<\/em> the forme. That's more type-case than the raised version was, not less.\n- Everything follows from one idea: ink-dyed floors engraved back to pale wood (one process, H6); red knobs because letterpress is black and red; one cream \"odd sort\" as the CUTOFF hero; cards flat in the front rail as the owner's hand.\n- The cheeks and rear rail rise only to CUTOFF's height (36.7), and the front is open for the hands.\n- Cost ≈ $10–15, the lowest of the self-protecting bodies.\n- All five round-1 fixes are done.<\/p>\n<p><strong>Likely owner objections<\/strong> (none likely enough to hold it back)\n- \"The open front is weak in a bag.\" It's stated plainly on the sheet. Possible, not likely: the knobs sit at or below the rim, so a flat bag side bridges the cheeks.\n- \"Red knobs are loud.\" That's a taste call. It's argued from the idea, and the owner can swap colours with no other change.\n- \"Can I feel a 1 mm groove at speed?\" The fallback is 1.5 mm, free.<\/p>\n<p><strong>What I'd tell the owner:<\/strong> this is the designed-for-use answer: the best-organised panel in the set, the best for finding sections blind, the cheapest self-protecting body, and his hand on the cards.<\/p>\n<h3>HYMNAL: 9 (goes to the owner)<\/h3>\n<p>Seen: sheet A, open 3/4 view, closed view, and the piano-top variant inset.<\/p>\n<p><strong>Why 9.<\/strong> All five round-1 fixes landed, and in landing they made the idea cleaner.\n- Short tops are the default; the piano variant is an honest +$30 inset.\n- The lean box comes in at ≈ $15–20, or ≈ $5–10 on his own walnut offcuts.\n- The panel is now modern: birch, white knobs, red only for numerals.\n- The label is a blank waiting for his lettering.\n- A batten under the lid holds the front shut, and the elastic band is gone.\n- It closes at 38.\n- The idea is the most <em>personal<\/em> in the set: the cheap home-built instrument in its own box, with the patch chart in the lid for a songwriter who has no recall. It's the most fun object to open.<\/p>\n<p><strong>Likely owner objections<\/strong>\n- \"The panel is a bit plain now.\" My own round-1 push made it plain. It's the right trade (the box carries the warmth), but he may want more inside. Possible, not likely. If he does, the cheap answer is TYPE CASE's sunk grooves and ink floors inside the HYMNAL box. That's a combination for him to request, not a flaw.\n- \"A lid standing behind the back row.\" It's behind the controls, not between keys and controls, and at ≈ 104° it doesn't crowd the back-row knobs. Not raised in the sense he meant.\n- The tobacco connotation is now invisible: nothing on the sheet says \"cigar\".<\/p>\n<p><strong>What I'd tell the owner:<\/strong> this is the one with the most character and story. It's his label, his walnut, and his patches in the lid.<\/p>\n<h3>HUSH (printed + felt): 8<\/h3>\n<p>Seen: sheet A, 3/4 view, flap parcel, and the wear-plan inset.<\/p>\n<p><strong>What's right.<\/strong>\n- The printed shell does exactly what he hoped: the felt hides the print and its seam, so printing is the <em>right<\/em> way to make this one, not a cheap substitute.\n- One felt sheet covers the top; the wear parts (palm strip, punched collars) come from its offcut.\n- One hard material (a printed tag per knob).\n- Eng confirmed the felt bottom stop sits outside the velocity window.\n- The flat deck with maple pegs rising through felt is still the most distinct form in the set.<\/p>\n<p><strong>What stops a 9: the yellow knobs.<\/strong> HUSH is the concept called <em>hush<\/em>, and its loudest colour is on 26 knobs. Lemon-ish yellow on grey felt also reads as a toy, which works against \"feel like an instrument\". It came from a random draw, but it fails my own test: unexpected has to serve the idea. Under R5 the fix is free. <strong>Owner objection likely.<\/strong><\/p>\n<p><strong>Other objections (possible):<\/strong>\n- Cost ≈ $31–41 printed is over the old $30 target. But he asked for the printed version, and the ply tray (≈ $27–30) is shown as the alternative. That's his call, made with full information.\n- Playing pegs is still unproven by hand.<\/p>\n<p><strong>Fixes<\/strong>\n1. <strong>Cream knobs<\/strong> (or natural/white). Grey felt, maple pegs, cream knobs: everything quiet, and CUTOFF told apart by size and its red line. Re-render sheet A.\n2. Put the ply-tray cost (≈ $27–30) and the printed cost side by side in the cost line, so the choice reads at a glance.<\/p>\n<p>Only fix 1 is needed for a 9.<\/p>\n<h3>FOLD (new): 7<\/h3>\n<p>Seen: sheet A, open 3/4 view, closed block, and the side inset. Pending: closed grows to ≈ 51.<\/p>\n<p><strong>What's right.<\/strong>\n- It's exactly the form he asked for: two parts, controls on the top part, a white panel screwed into a dark surround, printable first, walnut later.\n- It opens to 180°, so it obeys his flat rule better than the old CASE lid at 15°.\n- Hinges at the corners keep a barrel out of the hand's path.\n- The split hides in a mullion.\n- The lowest playing surface in the set (knob tops ≈ 28).\n- Self-protecting with no case.<\/p>\n<p><strong>Likely owner objections<\/strong>\n1. <strong>\"I said <em>a<\/em> white panel.\"<\/strong> Five plates with dark mullions read as rack modules or a eurorack row, not one white panel in a dark frame. It's the clearest gap between his words and the sheet. <strong>Likely.<\/strong>\n2. <strong>Closed ≈ 51 mm<\/strong>, against his ≤ 40 working target, and a 298 × 106 × 51 block looks like a brick or pencil case. <strong>Likely.<\/strong> It's the honest price of stacking knobs on keys, but he hasn't agreed to pay it.\n3. <strong>The open base reads half-empty:<\/strong> the dark palm-rest band in front of the keys (≈ 38 mm deep) with a small blank plate looks like unused space. Possible.\n4. The ribbon across the hinge and the knuckles standing 4 mm proud at the corners: possible, minor.<\/p>\n<p><strong>Fixes<\/strong>\n1. <strong>One white panel, made in two plates<\/strong> that meet at the x = 121 split (the print split has to stay, so make it a single hairline joint, not a mullion). This is the owner's words taken literally. If the sections need feeling, use sunk printed grooves as in ONE SHEET. Show the five-plate version only as a small inset.\n2. <strong>Redraw at the real closed height (≈ 51)<\/strong>, and say it in the facts line next to HYMNAL's 38. Also show the realistic floor (≈ 44 with a 2 mm panel, a 1.6 mm lid back and a sunk mid row) so the owner can choose.\n3. <strong>Give the palm rest a job and a surface.<\/strong> It's where the hands rest, so finish it like that: a textured print, or a separate walnut-ready insert (his planed walnut can start <em>here<\/em>, cheaply). Put the name plate on it. Don't leave a black void.\n4. Re-render with the closed block beside something familiar for scale (a hardback book), because closed is the state that sells a fold.\n5. Knob colour by R5: blue on white is fine if it's argued. Otherwise black knobs on the white panel read as the instrument-classic answer. Visual decides, with a reason.<\/p>\n<h3>ONE SHEET (printed): 7<\/h3>\n<p>Seen: sheet A, 3/4 view, sleeve view, and the bed inset.<\/p>\n<p><strong>What's right.<\/strong>\n- The owner asked for this version, and it's well made: one cream filament, faces printed on the bed so they come out satin, one swap for the legends.\n- One seam that lands on a section break.\n- One screw size.\n- The cheapest (≈ $10–13) and the thinnest (24).\n- Of the set, it's closest to a finished consumer product.<\/p>\n<p><strong>Why 7.<\/strong> The same blocker as round 1, smaller. \"The bed is the sheet / the file is the drawing\" is a good idea about <em>making<\/em>, but the object doesn't show it: what you see is a clean cream slab. Against the owner's \"most interesting thing overall\" and \"clear perspective\" it's the plain one. A plain baseline is legitimate, and I won't mark down the conventional answer for being conventional. But it isn't yet the <em>best<\/em> conventional answer: that's TYPE CASE, which is as organised, nearly as cheap, and has a point of view.<\/p>\n<p><strong>Likely owner objections<\/strong>\n- \"It's nice but generic.\" <strong>Likely<\/strong>, given his last message.\n- The deck seam and the screws on the face. Possible.<\/p>\n<p><strong>Fixes<\/strong> (choose 1 or 2; don't do both)\n1. <strong>Make the print the visible idea.<\/strong> Print-native surface and form that ply or a mould couldn't make: for example a fine printed rib texture as the section-separation field, or two-colour face-down printing where each section is a different shade from the same swap. The face should say \"printed\" the way TYPE CASE's says \"type case\".\n2. <strong>Or own the baseline:<\/strong> retitle it as the plain, cheapest, thinnest reference, and say so on the sheet. Then I'll score it as that, and the owner sees it as the control in the set, not a contender.<\/p>\n<h3>UNDER GLASS (new): 6, kill<\/h3>\n<p>Seen: sheet A, 3/4 view at playing-eye height, and the sleeve view.<\/p>\n<p><strong>Why it can't reach 9.<\/strong>\n- The idea (\"the circuit is the specimen\") depends on seeing the circuit. The windows are 16 mm deep, and parallax hides most of them from a playing position, so what's left reads as a black synth with two small dark slots.\n- Strengthening it means bigger windows, which fights the panel layout.\n- It's over cost ($26–45), and the weakest on blind finding.\n- The owner never asked for it: it was my replacement for ONE SHEET, and he has since reinstated ONE SHEET and added FOLD.\n- With five concepts he asked for or liked, a sixth he didn't ask for dilutes his attention.<\/p>\n<p><strong>What survives:<\/strong> \"show the voice\" could come back later as a small window in FOLD's lid or a clear plate in TYPE CASE, if he ever asks.<\/p>\n<hr />\n<h3>What keeps blocking 9 (across rounds)<\/h3>\n<ol>\n<li><strong>Cost against vibe:<\/strong> round 1 HYMNAL and HUSH; round 2 resolved for HYMNAL, priced openly for HUSH. Mostly fixed by making the lean version the default.<\/li>\n<li><strong>Ideas that live in the making, not the object:<\/strong> ONE SHEET (both rounds), UNDER GLASS. <em>Why it keeps happening:<\/em> economy and process ideas are logical (the owner asked for logic), but logic about <em>how it's made<\/em> doesn't produce a <em>form<\/em> unless someone forces it onto the surface. I proposed ONE SHEET in round 1 and it's my own blind spot.<\/li>\n<li><strong>Breadth devices overriding the idea<\/strong> (new: the yellow). A device I added for set-level breadth beat a concept's own logic. Fixed by R5.<\/li>\n<\/ol>\n<h3>Did the work change?<\/h3>\n<p>Yes, for all three survivors from round 1: real fixes, not re-renders. TYPE CASE (dividers sunk, rim, cards) and HYMNAL (short tops, lean box, modern panel, blank label) changed enough to go from 8 to 9. HUSH changed (print, cost, one hard material, wear plan) but gained the yellow, so it stays at 8.<\/p>\n<h3>Next<\/h3>\n<ul>\n<li><strong>To the owner now:<\/strong> TYPE CASE and HYMNAL, with the reasoning above.<\/li>\n<li><strong>One quick round:<\/strong> HUSH (fix 1), FOLD (fixes 1–4), ONE SHEET (fix 1 or 2). HUSH should pass with only its colour fix.<\/li>\n<li><strong>Owner questions to carry with the two passes:<\/strong>\n  1. Would you accept ≈ 44–51 mm closed for a fold, against ≈ 38 for HYMNAL?\n  2. Of WALLOP and the other names in <code>naming.md<\/code>, do any feel right?<\/li>\n<\/ul>\n<hr />\n<h2>Round 3: HUSH, FOLD, ONE SHEET (2026-11-12)<\/h2>\n<p>Basis: round-3 sheet A for each concept, plus the latest section of <code>notes/visual.md<\/code>.<\/p>\n<p><strong>Correction to the coordinator's note:<\/strong> HUSH went to <strong>cream<\/strong> knobs, not black. Black went to FOLD.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Score<\/th>\n<th>Changed?<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\"><strong>HUSH<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes: cream knobs, new principle \"Nothing shouts\", costs side by side<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>FOLD<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes: one white panel, black knobs, walnut palm rest, closed at 51 shown beside a book<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong>, with one stated engineering item<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>ONE SHEET<\/strong><\/td>\n<td data-label=\"Score\"><strong>8<\/strong><\/td>\n<td data-label=\"Changed?\">Yes: \"the toolpath is the finish\"<\/td>\n<td data-label=\"Verdict\">One more step (below)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>HUSH: 9<\/h3>\n<ul>\n<li>The only blocker in round 2 was the yellow. It's fixed, and fixed with an argument: \"Nothing shouts\" means every colour is near its material's own (grey wool, maple, cream ABS), with red thread and CUTOFF's line as the only accents.<\/li>\n<li>That's now the most internally consistent concept in the set: silence as the material, the colour and the stop.<\/li>\n<li>The cost choice is in one line: printed ≈ $31–41, ply tray ≈ $27–30.<\/li>\n<li><strong>Possible owner objections<\/strong> (none likely enough to hold it back):<\/li>\n<li>Pegs aren't proven by hand yet.<\/li>\n<li>Felt will wear. The wear plan answers this.<\/li>\n<li><strong>For the owner:<\/strong> the most distinctive object of the five. Pegs rising through felt look like no synth, and the material that makes it quiet is the thing you see and touch.<\/li>\n<\/ul>\n<h3>FOLD: 9<\/h3>\n<ul>\n<li>It's his remembered picture made real: a white panel in a dark surround, black knobs, walnut where the hands rest. Each of the fixes reads as a principle, not a patch:<\/li>\n<li>one panel, made as two plates only because of the bed;<\/li>\n<li>\"knobs take the other half's colour\";<\/li>\n<li>\"wood where the hands rest\" (his planed walnut starts as a $0 palm rest).<\/li>\n<li>It opens flat (his rule), and closed it guards itself.<\/li>\n<li>The 12 mm panel shift is a good catch: closed, every knob now lands over a white key or the walnut, never a sharp.<\/li>\n<li><strong>Likely-or-possible owner objection: 51 mm closed<\/strong>, 13 mm thicker than a hardback and over the ≈ 40 target. I'm calling it possible, not likely: it's the honest price of the fold he asked for, the sheet shows it plainly against HYMNAL's 38 and a book, and the floor (≈ 44 with 10.45 mm knobs, ≈ 47 with these black knobs) is stated. His call, made with full information.<\/li>\n<li><strong>Must-fix before handoff (engineering, doesn't change the concept or the look):<\/strong> closed, <strong>TUNE collides with the bend stick<\/strong> (≈ 4.5 mm). The remedy is a ≈ 6 mm well under the stick column, or a lower stick cap. Systems also has to confirm three things:\n  1. the 12 mm shift;\n  2. that the pots have 6 mm 18T knurled shafts for the black knobs;\n  3. the black knobs' price.<\/li>\n<li><strong>Tell the owner plainly:<\/strong> one closing clearance is still being solved, and the fix is invisible.<\/li>\n<\/ul>\n<h3>ONE SHEET (printed): 8<\/h3>\n<ul>\n<li><strong>What changed:<\/strong> this is the fix I asked for. The printing is now on the face: the first-layer direction turns per section (±45°), rings sit under every knob, and on smooth PEI it reads as sheen. It costs $0, ply or a mould can't do it, and the concept finally has a point of view you can see.<\/li>\n<li><strong>Why not 9 yet:<\/strong> the whole idea rests on an effect nobody has seen.<\/li>\n<li>The render draws the lines <strong>2.5× coarser than real<\/strong>.<\/li>\n<li>Per-region first-layer direction through PrusaSlicer modifiers is unverified.<\/li>\n<li>How strongly cream PETG shows sheen is unknown.<\/li>\n<li><strong>Likely owner objection:<\/strong> \"Will it really look like that?\" If the real lines (0.45 mm) read faintly, he's looking at the plain slab again.<\/li>\n<\/ul>\n<p><strong>Fixes<\/strong>\n1. <strong>Print one test coupon:<\/strong> about 80 × 80 mm, three regions (+45°, −45°, rings), smooth PEI, the chosen filament. Photograph it under a raking light and put the photo on sheet A. That's about an hour of printing, and it settles the slicer question at the same time.\n2. Until the coupon exists, label the render's line pitch as exaggerated, as the inset already does, and add one true-scale swatch.<\/p>\n<p>If the coupon reads, it's a 9 without redrawing. If it doesn't, the concept falls back to the plain baseline and I'd drop it from the set.<\/p>\n<h3>What kept blocking 9 (now)<\/h3>\n<ul>\n<li>Yellow on HUSH: my breadth device (R5): resolved.<\/li>\n<li>FOLD's gap between the owner's words and the sheet: resolved.<\/li>\n<li><strong>Only ONE SHEET is left, still on the same root cause:<\/strong> an idea about making that has to be <em>shown<\/em>, not asserted.<\/li>\n<\/ul>\n<h3>To the owner now<\/h3>\n<p><strong>TYPE CASE, HYMNAL, HUSH and FOLD (all 9).<\/strong> ONE SHEET follows once the coupon is done.<\/p>\n<p><strong>Questions to carry with them:<\/strong>\n1. FOLD at 51 closed (≈ 44–47 floor) against HYMNAL's 38: worth it for the fold?\n2. Names (<code>naming.md<\/code>).<\/p>\n<hr />\n<h2>Round 4: HUSH, FOLD, ONE SHEET (2026-11-12)<\/h2>\n<p>Basis: round-4 sheet A for each concept; FOLD's and HUSH's <code>how-it-works.md<\/code> for EMPHASIS and the felt blocking; the latest <code>notes/visual.md<\/code>; and <a href=\"#i-R-001\"><code>owner.md<\/code><\/a>'s newest section.<\/p>\n<p><strong>The owner's new brief:<\/strong>\n- unibody, screws from the back;\n- HUSH organically rounded so the felt wraps seamlessly;\n- FOLD back to the walnut + white Proof look, with rounded edges, a flat top and bottom, and block + pickguard construction;\n- HUSH and ONE SHEET loaded from behind;\n- keys right to the front edge, knobs logically split, a bit narrower;\n- no case work;\n- an internal battery is required.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Score<\/th>\n<th>Changed?<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\"><strong>HUSH<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes, rebuilt to the brief<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong> (one maker test named)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>FOLD<\/strong><\/td>\n<td data-label=\"Score\"><strong>7<\/strong><\/td>\n<td data-label=\"Changed?\">Yes, rebuilt, but the brief's own complaint has moved mid-deck<\/td>\n<td data-label=\"Verdict\">Fixes below<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>ONE SHEET<\/strong><\/td>\n<td data-label=\"Score\"><strong>8<\/strong><\/td>\n<td data-label=\"Changed?\">Yes, unibody, keys to the front<\/td>\n<td data-label=\"Verdict\">Same single blocker as round 3: the coupon<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>HUSH: 9<\/h3>\n<ul>\n<li>It meets every line of the brief, and each one reads as part of the idea, not a patch:<\/li>\n<li>a rounded pebble, so one felt skin wraps with no edge (\"One skin, no edges\");<\/li>\n<li>pegs start at the brow of the front curve, so the keys meet the edge;<\/li>\n<li>every screw is underneath (\"Shut from below\"), and opening the back never releases the skin;<\/li>\n<li>the battery bay is under the main board;<\/li>\n<li>290 wide.<\/li>\n<li>The new move (section names and the jack legend blind-pressed into the felt with a hot brass die: letterpress with no ink) is the best thing in the set this round. It came from a real random draw, and it serves \"Nothing shouts\".<\/li>\n<li><strong>Possible owner objections:<\/strong><\/li>\n<li>Cost, now ≈ $30–55 with the felt the unverified part.<\/li>\n<li>Pegs still not tried by hand.<\/li>\n<\/ul>\n<p>Neither is likely enough to hold it back: he has seen the costs every round and keeps choosing HUSH.\n- <strong>Must test before handoff (doesn't change the concept): steam-blocking the felt over the printed shell.<\/strong> Steam is ~100 °C. PLA softens near 60 °C and PETG near 80 °C, so blocking directly on the shell can warp it. Systems' one-evening corner test has to answer this. If the shell moves, block over a separate form (a second, sacrificial print, or a wooden or plaster block from the same model), then fit the dried skin to the real shell. Systems also has two clearances to fix: the I/O board in the straight rear run (x ≈ 60–230), and the speaker at x ≤ 243.\n- <strong>For the owner:<\/strong> the quietest-looking and most distinctive of the three. One seamless grey skin, maple pegs at the edge, names pressed into the wool, and nothing to catch, pick at or see screwed.<\/p>\n<h3>FOLD: 7<\/h3>\n<p><strong>What's right.<\/strong>\n- The Proof colourway is back: walnut-tone, cream pickguard, black knobs, red CUTOFF.\n- The block + pickguard construction is his guitar idea taken literally.\n- \"The swap draws the pickguard's line\" (a white-over-black bevel for $0) is a lovely detail.\n- Keys run to a 4 mm rim.\n- Closed, it's a flat-topped walnut bar.<\/p>\n<p><strong>Rulings.<\/strong>\n1. <strong>The mid-deck gap is a blocker (visual's flag, upheld).<\/strong> Open, it's 286 × 234, with ≈ 119 mm of mostly empty cream between the PLAY row and the VOICE front row, and 210 mm from the key front to the back row (the flat concepts are at 123). That's the owner's own complaint (\"extra space… that's awkward\") moved from in front of the keys to the middle of the deck. <strong>Likely objection → under 9.<\/strong>\n   - The gap isn't forced by folding. In rev 4 the halves were 86 deep. They grew to 116 to fit the battery.\n   - <strong>Fix: put the battery back inside the existing ≈ 31 mm lid band<\/strong> as slim pouch cells laid along x, for example two or three cells of the ≈ 8 × 30 × 40 mm class (≈ 1000 mAh each; eng to choose and verify). The band is ≈ 286 wide with no pots under it.\n   - Return the halves to ≈ 86–90 mm, which removes the base's empty rear strip.\n   - <strong>Target:<\/strong> PLAY row → VOICE front row ≤ ≈ 60 mm; open depth ≤ ≈ 185.\n   - If eng proves that impossible, show the owner both versions (battery and 234 deep, or slimmer cells and less runtime) as his decision.\n2. <strong>CUTOFF and EMPHASIS belong together.<\/strong> They're the most-played pair on the instrument. Splitting them across the hinge (EMPHASIS on the lid, with a printed \"emphasis is on the lid\" ring) is clever labelling of a usability loss. <strong>Eng question:<\/strong> can EMPHASIS live in the base PLAY row next to CUTOFF, with its two or three conductors in the ribbon (a screened pair), given that it's in the ladder's feedback path? If yes, move it. If no, this is an owner decision: tell him plainly.\n3. <strong>Section names all black, not ochre.<\/strong> One swap is the rule. Ochre costs a second swap and adds nothing Proof needs.<\/p>\n<p><strong>Fixes<\/strong>\n1. Ruling 1 (battery in the band, halves ≈ 86–90, gap ≤ ≈ 60).\n2. Ruling 2 (EMPHASIS next to CUTOFF if eng allows).\n3. Ruling 3 (black names).\n4. Keep the signal map only if a strip survives fix 1. Don't keep a strip to hold the map.<\/p>\n<h3>ONE SHEET: 8 (unchanged)<\/h3>\n<ul>\n<li><strong>Changed work:<\/strong> unibody closed-top shell, opened from below, keys to a 2.4 mm front wall, 276 wide, rear jack legend, battery under the board. The true-scale swatch is now on the sheet (round-3 fix 2 done). It all meets the brief.<\/li>\n<li><strong>The score doesn't move because the blocker didn't.<\/strong> The coupon still isn't printed, and the concept's idea (the toolpath is the finish) still rests on an unseen effect plus unverified PrusaSlicer modifiers. The sheet now says this honestly, which is right. <strong>Likely owner objection:<\/strong> \"Will it look like that?\"<\/li>\n<li><strong>Fix:<\/strong> print the ≈ 80 × 80 coupon (+45 / −45 / rings, smooth PEI, the chosen filament). Photograph it in raking light and put it on sheet A. It reads → 9. It doesn't → this is the plain baseline, and I'd drop it.<\/li>\n<\/ul>\n<h3>What keeps blocking 9 (across rounds)<\/h3>\n<ul>\n<li><strong>ONE SHEET<\/strong> (rounds 1–4): an idea about making that has to be <em>shown<\/em>. Only a physical print can settle it now, and no further drawing will help.<\/li>\n<li><strong>FOLD<\/strong> (round 4): fixing one owner constraint (internal battery) quietly re-broke another (no awkward space). <em>Why it keeps happening:<\/em> the fold couples the depths of the two halves, so any addition to one half shows up twice. Every FOLD change needs the open-depth check.<\/li>\n<\/ul>\n<h3>To the owner now<\/h3>\n<p><strong>HUSH (9).<\/strong> FOLD and ONE SHEET come back after the fixes above (FOLD: a redraw; ONE SHEET: one print).<\/p>\n<hr />\n<h2>Round 5: HUSH, ONE SHEET, FOLD-105 (FOLD-113 for context) (2026-11-13)<\/h2>\n<p>Basis: round-5 sheet A for each concept, FOLD-105's sheet E (standing), the latest section of <code>notes/visual.md<\/code>, and <a href=\"#i-R-001\"><code>owner.md<\/code><\/a> from \"2026-11-12 22:30\" on.<\/p>\n<p><strong>What the owner added since round 4:<\/strong>\n- FOLD feels unbalanced;\n- ONE SHEET finish reduced to smooth + rings only (\"I love the rings texture\");\n- digital echo + reverb on a Daisy Seed: great models, several types, the full 8 controls (\"grow the panel\");\n- key edge A (keys at the edge, raised) vs B (a small lip): show both;\n- front views;\n- a controllable DRIFT;\n- FOLD's lid stands at one fixed angle, blending into the case;\n- MIDI OUT;\n- aftertouch with its own switch.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Score<\/th>\n<th>Changed?<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\"><strong>HUSH<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong> after the shared label pass (S1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>ONE SHEET<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong> after S1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\"><strong>FOLD-105<\/strong><\/td>\n<td data-label=\"Score\"><strong>9<\/strong><\/td>\n<td data-label=\"Changed?\">Yes<\/td>\n<td data-label=\"Verdict\"><strong>Goes to the owner<\/strong> after S1. One engineering must-fix<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\">FOLD-113<\/td>\n<td data-label=\"Score\">—<\/td>\n<td data-label=\"Changed?\">—<\/td>\n<td data-label=\"Verdict\"><strong>Not shown as an option.<\/strong> It fails the gap (75.45 vs ≈ 60). It's only there to explain the choice<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>S1: one shared fix before anything is sent (mechanical, ≈ 30 min, no re-score needed)<\/h3>\n<p>The new back row (DRIFT | ECHO TYPE, TIME | REVERB DECAY, TYPE | VOLUME) and the middle-column toggles have <strong>colliding legends<\/strong> in all three renders: \"DECAY / REVERB TYPE\", \"ECHO TY…\" cut off by a knob, VELOCITY/SOURCE stacked, and ONE SHEET's MIXER heading crowding REVERB DECAY. The owner reads mocks closely; he asked for front views to see the details. Fix in the shared layout:\n- Under a section heading, use short labels: <strong>echo<\/strong> with type · time; <strong>reverb<\/strong> with decay · type.\n- Keep ≥ 1.5 mm clear between any two legends and between any legend and a knob skirt.\n- If that isn't enough, use the owner's licence (\"grow the panel\") to add up to ≈ 10 mm of depth.<\/p>\n<p>The visual designer applies it to all three A and D sheets and checks crops. I'll check only that, and won't re-score.<\/p>\n<h3>HUSH: 9<\/h3>\n<ul>\n<li>Every new ask lands inside the idea. The TYPE switches' names sit on a printed \"bib\" because felt can't hold a fine mark. TAP is a maple peg because it's tapped like a key. Both edges (A at the edge, B with the felt brow) are shown, and front views are on D.<\/li>\n<li>The layout is mirrored about the centre, in three columns, with the back row as the signal chain. It's busier than round 4, because nine controls were added, but it's ordered.<\/li>\n<li><strong>Possible owner objections:<\/strong><\/li>\n<li>density;<\/li>\n<li>pegs stand 6.5 mm proud (more than the 2–3 he imagined), but D shows this and A argues it (\"leaned into\").<\/li>\n<li><strong>Must-test before handoff<\/strong> (carried from round 4): steam-blocking felt over the printed shell, now including edge A's r 4 front.<\/li>\n<li><strong>For the owner:<\/strong> still the most distinctive object. The added effects and controls didn't break its calm.<\/li>\n<\/ul>\n<h3>ONE SHEET: 9<\/h3>\n<ul>\n<li><strong>What changed and why it now passes:<\/strong> the owner cut the finish to the one effect he loves: \"still water, ripples where it turns\". There's one rule (if it turns, it ripples), it's free, and it's printable.<\/li>\n<li><strong>Ruling: the test coupon moves from blocking a 9 to a check before the build.<\/strong><\/li>\n<li>The owner has seen the rings and chosen them.<\/li>\n<li>A concentric bottom pattern is a standard, plainly visible FDM finish on smooth PEI. That's far safer than round 3–4's ±45° sheen, which was the effect I doubted.<\/li>\n<li>The only thing unverified is applying it per region. The fallback, if PrusaSlicer modifiers won't do it, is separate volumes in the 3MF, each with its own bottom pattern. That route is standard.<\/li>\n<li>Edge A (skirted keys to the front) and edge B (2.4 mm wall) are both shown. The concept stays the cheapest (≈ $10–13).<\/li>\n<li><strong>Possible objection:<\/strong> it's the plainest form of the three. It's the economy concept, and it's now the best version of that.<\/li>\n<\/ul>\n<h3>FOLD-105: 9<\/h3>\n<ul>\n<li><strong>Every round-4 blocker is fixed:<\/strong><\/li>\n<li>the gap is 54.45 mm (≤ 60), with open depth 218;<\/li>\n<li>EMPHASIS sits beside CUTOFF in the base;<\/li>\n<li>section names are black (one swap).<\/li>\n<li><strong>The owner's \"not balanced\"<\/strong> is answered with a visible system, not taste: three columns whose rules line up across the seam, and one centre axis carrying everything single (EMPHASIS, status, grille, name), marked by a brass pin like a boat's centreline. The base holds the amounts you play during a note (TAP mirrors the bend stick); the lid holds the voice, and its back row is the chain.<\/li>\n<li><strong>The standing lid<\/strong> blends in, as he asked: two brass flat stays live flush in the lid's end faces (the same brass as the back screws, like a writing box's lid stay). It stands at 105°, so it leans back onto its stays rather than balancing over the hinge. There's nothing to bolt on and nothing proud when it's flat or closed.<\/li>\n<li><strong>Possible owner objections:<\/strong><\/li>\n<li>50 mm closed (he has seen it every round);<\/li>\n<li>the standing lid adds 53 mm behind the base.<\/li>\n<\/ul>\n<p>Neither is likely enough to hold it back.\n- <strong>Engineering must-fix before handoff (doesn't change the look):<\/strong> the right stay's groove (d 30–82.4) runs through the lid-wall jacks and USB-C (d 15–85). Prefer moving <strong>the I/O to the lid's left end face<\/strong>, which keeps the brass stays symmetrical. Otherwise raise the jacks above the groove. Systems also confirms the AFTERTOUCH toggle placement (the visual designer put it at d 26, behind FILTER MOD) and where the Daisy Seed goes.\n- <strong>FOLD-113:<\/strong> don't offer it. It buys 22.2 Wh against 11.1 Wh (≈ 9 h against ≈ 4.5 h), but it re-opens the awkward gap (75.45 mm) the owner already objected to. If he asks for longer runtime, the answer is a larger-capacity cell of the same footprint, not deeper halves.<\/p>\n<h3>What kept blocking 9 (and how it ended)<\/h3>\n<ul>\n<li><strong>ONE SHEET<\/strong> (rounds 1–4: an idea that had to be shown): resolved when the owner chose the one effect that is certain to read, and kept the uncertain part to a build-stage check.<\/li>\n<li><strong>FOLD<\/strong> (coupled depths): resolved by fitting slim cells in the band. <strong>Keep the open-depth check on every future FOLD change.<\/strong><\/li>\n<li><strong>New, set-wide:<\/strong> adding features (FX ×8, DRIFT, aftertouch, MIDI out) makes label collisions in the shared layout. Every feature added from now on needs a legend-clearance check, not just knob pitch.<\/li>\n<\/ul>\n<h3>To the owner<\/h3>\n<p>HUSH, ONE SHEET and FOLD-105, all at 9, once S1 is applied.<\/p>\n<p><strong>Questions to carry:<\/strong>\n1. Key edge A or B, per concept, from the front views.\n2. Names (<code>naming.md<\/code>): still open.<\/p>\n<h2>Branches — concept round 1 (2026-11-13, design director, new)<\/h2>\n<ul>\n<li>CHAMBER (FOLD, organ case): <strong>8<\/strong>. Objections: standing lid renders grey; hinge-side slot shows knobs when closed; reversed key colours unconfirmed by owner; 52.7 mm closed. Fixes 1–6 in design/notes/director.md.<\/li>\n<li>RAIN (ONE SHEET, pond after rain): <strong>7<\/strong>. Objections: seams read as cracked stone at arm's length; drab all-grey; seams don't group sections; legend collisions; grooves coarser than v1.1 rings. Fixes 1–6.<\/li>\n<li>BUTTERFLY (ONE SHEET, tool to tree): <strong>6<\/strong>. Retired, not replaced: the idea lives in a 15 mm strip; reads \"ONE SHEET with a plank\".<\/li>\n<li>DIPTYCH (FOLD, pocket sundial): killed before scoring (cords tip at 0.8 N; the fix is worse than v1.1 stays; re-skin without cords). Its TIME dial is free for any branch.<\/li>\n<li>Killed in jam: PIERCED, GROUND.<\/li>\n<li>Nothing at 9; nothing to the owner. Round 2: CHAMBER and RAIN.<\/li>\n<\/ul>\n<h2>Branches — concept round 2 (2026-11-13, design director)<\/h2>\n<ul>\n<li>CHAMBER: <strong>9<\/strong> (was 8). Work really changed: cream standing lid, oxblood cloth spine closes the hinge-side slot, normal key colours drawn, push-out holes as pipe mouths, Kalam, artefacts fixed. Coverage: passes every job. → owner.<\/li>\n<li>RAIN: <strong>9 conditional on R1<\/strong>, then withheld at the R1 check: far rings still read as hatching at the rear corners and behind the back row. R1 clarified (stop rings ~6–8 mm out). Checked by eye, no re-score.<\/li>\n<li>RAIN: R1 confirmed by eye → <strong>9<\/strong>. Watch: at arm's length it now reads closer to v1.1 ONE SHEET. → owner.<\/li>\n<\/ul>", "lead": "Basis: for each concept I read how-it-works.md, how-it-looks-and-feels.md, and sheet A (the look). I also read TYPE CASE sheet C (the section) and ONE SHEET sheet D (the nest), plus common-how-it-works.md, the new owner answers in owner.md,", "jump": ["Round 1: concepts (2026-11-12)", "Round 2: six concepts (2026-11-12)", "Round 3: HUSH, FOLD, ONE SHEET (2026-11-12)", "Round 4: HUSH, FOLD, ONE SHEET (2026-11-12)", "Round 5: HUSH, ONE SHEET, FOLD-105 (FOLD-113 for context) (2026-11-13)", "Branches — concept round 1 (2026-11-13, design director, new)", "Branches — concept round 2 (2026-11-13, design director)"], "code": "R-002"}, "R-003": {"kind": "record", "sub": "record", "title": "Versions", "stage": "Lock", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "VERSIONS.md", "html": "<h1>Versions<\/h1>\n<p>Each locked set lives in <code>versions/&lt;name&gt;/<\/code> and is never edited afterwards. Work in progress lives in <code>design/<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Version<\/th>\n<th>Date<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Version\"><strong>v1.1<\/strong> (current)<\/td>\n<td data-label=\"Date\">2026-11-13<\/td>\n<td data-label=\"What it is\">v1, plus: FOLD stands at 120° (it was 105°) so the face catches more light; bend drawn as a joystick in every view (round opening, stem, cap, plus a callout on each B sheet); FOLD sheet D shows MIDI IN. The director held all three at 9.<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Version\">v1<\/td>\n<td data-label=\"Date\">2026-11-13<\/td>\n<td data-label=\"What it is\">First official lock: HUSH, ONE SHEET and FOLD after round 5, all scored 9.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The concept \"FOLD\" is the FOLD-105 variant on the sheets. FOLD-113 was dropped (it's in <code>archive/fold-superseded/<\/code>).<\/p>\n<p>Each version folder holds every concept's sheets (A–D; FOLD also has E), its how-it-works and looks-and-feels docs, the shared docs, the owner record, scores and team notes as they stood at the lock, and the engineering spec of the time (<a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a>).<\/p>", "lead": "Each locked set lives in versions/<name>/ and is never edited afterwards. Work in progress lives in design/.", "jump": [], "code": "R-003"}, "R-004": {"kind": "record", "sub": "record", "title": "Owner record (the project site)", "stage": "Concept", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "site/design/owner.md", "html": "<h1>Owner record: the project site (landing page + versions + live work)<\/h1>\n<p>Authoritative, verbatim, newest at the bottom.<\/p>\n<h2>2026-11-13 11:51 — start<\/h2>\n<p>Owner (verbatim): \"rather than interact through here, i'd like to interact through a web interface that is built on the fly for the versioning and serves as a landing page for the project. can you have a team spec this out? it should live update there as things from here are made and explored, and i want to be able to see the history and versions and see anything that's created (explorations, mocks, layotus, diagrams, etc). it should be shareable and minimal ui in the style of dieter rams / braun\"\nRecorded as:\n- A web interface as the project's landing page and the place he interacts with the work, \"rather than interact through here\".\n- Built on the fly for the versioning; live-updates as work is made and explored in sessions.\n- Must show history, versions, and everything created: explorations, mocks, layouts, diagrams, etc.\n- Shareable.\n- Minimal UI in the style of Dieter Rams / Braun.\n- Ask: a team SPECS it out (concept phase first; build after approval).\n- Open: how much interaction he means (viewing only, or also giving feedback and answering questions there).<\/p>\n<h2>2026-11-13 11:52 — interaction depth answered<\/h2>\n<p>Owner (verbatim): \"chatting here is fine; i just want there to be a site for me to view all the stuff from the team / the versions / the tests / etc as we get further down the build chain\"\nRecorded as:\n- VIEWING site. Conversation and decisions stay in chat; the site doesn't need to take feedback or decisions.\n- Must show: everything from the team, the versions, the tests, and more as the project moves down the build chain (spec, BOM, breadboard tests, boards, prints, assembly).<\/p>\n<h2>2026-11-13 12:06 — sharing<\/h2>\n<p>Q: who gets the link; hide owner notes and scores from outside viewers? → Owner (verbatim): \"anyone that gets the link is fine to see everything\"\nDECISION: one view for everyone; nothing hidden from link holders (owner record, scores, notes all visible).\nOwner (verbatim): \"it is primarily me\"\nRecorded as: the main viewer is the owner himself; design for him first.<\/p>\n<h2>2026-11-13 12:13 — on J14 (phone)<\/h2>\n<p>Owner (verbatim): \"why would i need to read an a3 sheet properly on my phone? i just need to see everything properly on my phone.\"\nRecorded as: J14 is broadened — EVERYTHING on the site must be properly viewable on a phone (sheets, diagrams, docs, tests, records). A3 sheets aren't a special job; they're one case of it. Don't over-invest in a sheet-specific reading mode.<\/p>\n<p>2026-11-13 12:33 Owner (verbatim): \"why make anything on a3 at all? im not in europe and im not printing\"\nRecorded as: drop A3 as the default format for mocks and sheets. Nothing is printed; images are viewed on screen (phone first, per the site's J14). The format is the designers' call, made for on-screen viewing. Locked versions stay as they are.\n2026-11-13 12:39 Owner (verbatim): \"dont do phone first -- do images that will be great on the site that i can view responsively\"\nRecorded as: CORRECTION to 12:33 — not phone-first. Images are made to look great on the project site and to work responsively across screen sizes (phone through desktop).\n2026-11-13 12:41 Owner (verbatim): \"i really only want images for things that need to be images -- text should be html and stuff\"\nRecorded as: images only for what has to be visual (renders, drawings, diagrams, plots). Text (principles, specs, notes, labels, tables, scores) is real HTML on the site, not baked into images. This retires the \"sheet\" format (text plus pictures in one image) for new work.<\/p>\n<h2>2026-11-13 13:13 — on the review images<\/h2>\n<p>Owner (verbatim), seeing E Herbarium as frame images: \"i dont understand why is this an image and not a webpage\"\nRecorded as: site concepts are shown to the owner as working web prototypes, not pictures of screens. E Herbarium is being built as a clickable prototype (throwaway, real content) for his review. Approval still pending.<\/p>\n<p>2026-11-13 13:13 Owner (verbatim): \"dont render a bunch of images unnecessarily\"\nRecorded as: render an image only when it is needed to judge or show something; no image sets made by habit, no pictures of web pages.<\/p>\n<h2>2026-11-13 13:20<\/h2>\n<p>Owner (verbatim): \"prototypes should go on that webpage i am having you build -- whats the status on that\"\nRecorded as: prototypes (web or otherwise) are a kind of item the site hosts and shows. Status asked.<\/p>\n<h2>2026-11-13 13:43 — on the published prototype<\/h2>\n<p>Owner (verbatim): \"is this site on github or justhere\" (answered: hosted on claude.ai; source in the repo)\nOwner (verbatim): \"i dont understand the nav here\"\nRecorded as: the Herbarium prototype's navigation (all · stage · kind · version · decisions · history, plus \"+ n more\") does not make sense to him. Specifics asked.<\/p>\n<p>2026-11-13 16:23 Owner (verbatim): \"im going to put the github on github pages so i can easily access it from there instead of here. i want all review and logs and documents there, not here\"\nRecorded as: the owner will publish the repo with GitHub Pages and view everything there. ALL reviews, logs and documents go in the repo (and so on the Pages site), not as files sent in chat. Hosting for the project site moves from the claude.ai artifact to GitHub Pages (static; it updates when sessions commit and push).\n2026-11-13 16:24 Owner (verbatim): \"ok thats fine if its not private\"\nRecorded as: DECISION — a public GitHub Pages site is fine (anyone with the address can see it). Hosting: GitHub Pages from the repo root or a GitHub Action (not /docs).<\/p>\n<p>2026-11-13 16:28–16:29 Owner (verbatim): \"re: architecture i think the way its organized is just unclear. have the systems designer take a look. is it up on pages right now? do that first\" · \"i dont want a bunch of .md docs, i want this stuff on website\"\nRecorded as: (1) put the site on GitHub Pages first — done as far as a session can: build pushed to branch gh-pages; turning Pages on is blocked from sessions (owner does it in Settings → Pages). (2) The architecture doc's organisation is unclear — systems designer to rework it. (3) Docs, architecture and reviews must be ON THE WEBSITE (rendered pages), not markdown files he has to open. Markdown stays only as the source the site builds from.\n2026-11-13 16:40 Owner (verbatim): \"gh pages is fine\"\nRecorded as: DECISION — the site keeps deploying from the gh-pages branch. Sessions rebuild and push it after changes (site/publish.sh).<\/p>\n<p>2026-11-13 16:43 Owner (verbatim), on the live site: \"every page here needs a point i literally have no idea what im looking at in \"latest\" for example. and where do i see the grille options and all of the other options\"\nRecorded as: every page must state its point (what it is and why you are here) up front; \"Latest\" does not make sense to him. The site must show the open decisions waiting on him, with their options (e.g. the grille options) and images, in one obvious place.\n2026-11-13 16:44 Owner (verbatim): \"FYI i have another agent running htis through impeccable to make it look better\"\nRecorded as: another agent (outside this session) is restyling the site with Impeccable at the same time. Coordinate: pull before editing, keep this team's site changes to content and structure, commit small and often, and publish only from main.\n2026-11-13 16:45 Owner (verbatim): \"yeah i dont need a latest feed. what i need to decide is valuable. architecture is valuable. featureset is valuable. history is valuable.\"\nRecorded as: DROP the Latest feed. The site's valuable parts, in his words: what he needs to decide; architecture; feature sets; history.\n2026-11-13 16:46 Owner (verbatim): \"put whatever else i do need in there too im not listing everything. im sure there will need to be one for the parts modeling and physical architecture diagrams... the boards and schematics... parts list... etc etc\"\nRecorded as: the four sections are a floor, not the full list. Add every section the build will need, e.g. physical design (enclosure, 3D models, physical architecture diagrams), electronics (boards, schematics), parts list (BOM), tests. The team decides the set and shows empty sections honestly as \"not yet\".<\/p>", "lead": "2026-11-13 12:33 Owner (verbatim): \"why make anything on a3 at all? im not in europe and im not printing\" Recorded as: drop A3 as the default format for mocks and sheets. Nothing is printed; images are viewed on screen (phone first, per the", "jump": ["2026-11-13 11:51 — start", "2026-11-13 11:52 — interaction depth answered", "2026-11-13 12:06 — sharing", "2026-11-13 12:13 — on J14 (phone)", "2026-11-13 13:13 — on the review images", "2026-11-13 13:20", "2026-11-13 13:43 — on the published prototype"], "code": "R-004"}, "CHAMBER-closed-with-book": {"kind": "image", "sub": "render", "title": "Closed, beside a 400-page hardback: real walnut, seen from behind so the pipes stand upright. The oxblood bookcloth spine now closes the hinge side.", "short": "closed with book", "stage": "Concept", "status": "exploring", "date": "13 Nov", "revs": [{"rev": "B", "line": "round 2", "src": "media/CHAMBER-closed-with-book.jpg", "thumb": "media/t/CHAMBER-closed-with-book.jpg", "w": 1400, "h": 817, "orig": "2400 × 1400", "path": "design/branches/concepts/chamber/img/chamber-closed-with-book.jpg"}], "group"
