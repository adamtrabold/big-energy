port<\/td>\n<td data-label=\"U1: rear USB-C → Seed&#x27;s own port (pick)\"><strong>Yes<\/strong> (libDaisy reset-to-bootloader, triggered by a TAP-at-power-on gesture)<\/td>\n<td data-label=\"U2: rear USB-C → D29/D30\">No: the update needs the internal port (open the back)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Header pins<\/td>\n<td data-label=\"U1: rear USB-C → Seed&#x27;s own port (pick)\"><strong>0<\/strong>; D29/D30 freed<\/td>\n<td data-label=\"U2: rear USB-C → D29/D30\">2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Risk<\/td>\n<td data-label=\"U1: rear USB-C → Seed&#x27;s own port (pick)\">Enumeration without VBUS on the Seed's connector (VBUS-sense setting UNVERIFIED). Bench check; if needed, feed Seed VBUS from the breakout through a Schottky<\/td>\n<td data-label=\"U2: rear USB-C → D29/D30\">Low<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>5.4 TRS MIDI<\/h3>\n<ul>\n<li><strong>In:<\/strong> 6N138 → <strong>D14 PB7 USART1_RX<\/strong>. PB7 is 5 V-tolerant (Seed DS p. 2: only header pins 24, 25, 28, 29 and 30 are 3.3 V-only), so the opto can pull up to 3.3 or 5 V.<\/li>\n<li><strong>Out (optional):<\/strong> <strong>D13 PB6 USART1_TX<\/strong>, with 2 series resistors to a TRS-A jack.<\/li>\n<li>≈ +$0.30.<\/li>\n<li><strong>Owner decision:<\/strong> it's an extra jack, and the owner said \"no extra patch points beyond pitch CV/gate out + filter CV in\". USB-MIDI already sends.<\/li>\n<li><strong>Clock / sync:<\/strong> both transports are parsed on the control path and feed the FX tempo. 0 pins.<\/li>\n<\/ul>\n<p><strong>Recommendation:<\/strong> U1. <strong>Cost:<\/strong> ≈ $3.45 + a $2–3 cable (ESTIMATE). <strong>Against the Pico era:<\/strong> the same E3 idea (Pico test pads ↔ Seed port), and no BOOTSEL pinhole needed: the Seed's own BOOT/RESET buttons are inside for recovery. <strong>Risk:<\/strong> L–M (VBUS sense, ESD as E3).<\/p>\n<hr />\n<h2>6. Effects architecture<\/h2>\n<h3>6.1 What the job needs<\/h3>\n<ul>\n<li>Echo (4 types) and reverb (4 types) of \"great models\".<\/li>\n<li><strong>The dry path analog and never switched.<\/strong><\/li>\n<li>Wet noise inaudible (<a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §3.2).<\/li>\n<li>Tails ring after the VCA closes.<\/li>\n<li>Speaker, phones and line all get the effects.<\/li>\n<\/ul>\n<h3>6.2 Signal path [ENG]<\/h3>\n<pre><code>VCA out ─┬─────────────── dry (analog, never switched) ─────────────► OUTPUT MIXER ─► VOLUME ─► LM386 / phones / line\n         ├► TL072: gain to −6 dBFS peak, diode soft-clip, RC AA ─► codec IN L ─┐\nladder ──┴► (pre-VCA tap) TL072 buffer ───────────────────────────► codec IN R ─┤ (filter cal only)\n                                                                               ▼\n                                           DSP: input mute (gate-aware) → ECHO → REVERB → wet L/R (no dry copy)\n                                                                               ▼\n                                    codec OUT L/R ─► RC ─► fixed summing R ─► OUTPUT MIXER (mono sum to speaker/line;\n                                                                                 stereo to phones optional)\n<\/code><\/pre>\n<p><strong>Rules:<\/strong>\n- <strong>The wet return contains only effect signal.<\/strong> If the DSP passed any dry, its ≈ 1–2 ms converter + block latency would comb-filter against the analog dry. ECHO MIX and REVERB MIX are wet levels in DSP.\n- <strong>With both mixes at 0 the codec outputs digital silence<\/strong>, and the instrument is electrically the analog-only voice.\n- <strong>Levels:<\/strong>\n  - The Seed's input is AC-coupled, 3.6 Vpp (≈ 1 Vrms) full scale, 30 kΩ; its output is 0 dBFS = 1 Vrms from 100 Ω (Seed DS pp. 2–3, 6, 8). That's pre-Seed3 data; TAC5242 levels are per <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §3.1.\n  - Scale the hottest patch to −6 dBFS.\n  - The output summing resistor sets the wet ceiling at ≈ dry level.\n- <strong>Latency:<\/strong> wet only. Irrelevant for echo and reverb.\n- <strong>Mix in DSP vs analog pots:<\/strong> DSP mixing wins. It needs no extra pots in the audio path, allows equal-power mixing, click-free type crossfades and MIDI-synced repeats, and lets the gate-aware input mute (noise only enters while notes sound).\n- <strong>Grounding:<\/strong> the Seed's AGND (pin 20) goes to the analog star. \"AGND must be connected to DGND\" (Seed DS p. 6), so make that one join under the Seed.<\/p>\n<p><strong>DSP budget and memory:<\/strong> unchanged from <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §3.4: echo + CloudSeed-class reverb ≈ 40–60 % at 400 MHz, with long buffers in SDRAM and dense taps in SRAM.<\/p>\n<p><strong>Risk:<\/strong> L. <strong>Cost:<\/strong> as <code>single-chip-research.md<\/code> §5.3 (TL072s, passives), plus 1 TL072 half for R.<\/p>\n<hr />\n<h2>7. Power and battery<\/h2>\n<h3>7.1 Daisy draw [ESTIMATE; measure on the spike]<\/h3>\n<ul>\n<li><strong>H750 core:<\/strong> run mode at 400 MHz from flash with cache on is <strong>105 mA typ with peripherals off, 160 mA with all on<\/strong>. Sleep is 31 mA; Stop is 1.4–2.85 mA (H750 DS Tables 29, 33, 34, rev Y).<\/li>\n<li><strong>SDRAM + codec + regulator:<\/strong> ≈ 30–80 mA (ESTIMATE; no Seed figure published, Seed DS p. 2 lists none).<\/li>\n<li><strong>Seed total ≈ 110–220 mA at 3.3 V.<\/strong><\/li>\n<li>If the Seed's regulator is linear from VIN (UNVERIFIED), that's <strong>0.55–1.1 W at 5 V<\/strong>; if it's a switcher, ≈ 0.4–0.8 W.<\/li>\n<li>Against the Pico's 0.1–0.15 W: <strong>Δ ≈ +0.3–1.0 W.<\/strong><\/li>\n<li><strong>Runtime<\/strong> on the 22.2 Wh pack (<code>battery.md<\/code>), [CALC, ∝ 1/P]:<\/li>\n<li>9.0 h → 6.0–7.8 h at the 2.0 W end;<\/li>\n<li>4.7 h → 3.7–4.3 h at the 3.6 W end.<\/li>\n<\/ul>\n<h3>7.2 Daisy-native savings<\/h3>\n<ol>\n<li><strong>Stay at 400 MHz<\/strong> (no 480 \"boost\"). The DSP estimates fit with headroom.<\/li>\n<li><strong>WFI between audio blocks.<\/strong> Sleep draws 31 mA against ≈ 105 mA running. At ≈ 50 % DSP load, ≈ −30 mA (ESTIMATE).<\/li>\n<li><strong>48 kHz, not 96.<\/strong><\/li>\n<li><strong>Hall group gating (§1.5): −0.45 to −0.95 W.<\/strong> That alone offsets the Seed.<\/li>\n<li>Not Daisy-specific, but cheap: a ready-made 3.3 V buck for the Hall rail instead of the LD1117 saves ≈ 0.2–0.4 W (<code>round4-answers.md<\/code> §3.1).<\/li>\n<\/ol>\n<p><strong>Sleep modes:<\/strong> the instrument has a hard power switch, so true standby would need a soft-latch power circuit. Not worth it for one unit [ENG]. Idle behaviour = WFI, plus LEDs dimmed after a few minutes.<\/p>\n<h3>7.3 Battery gauge and charge state<\/h3>\n<ul>\n<li><strong>Cell voltage:<\/strong> 100 k / 100 k + 100 nF divider → <strong>D20 (PC1, ADC3 direct)<\/strong>, oversampled ×256.<\/li>\n<li>The firmware compensates for load: it knows its own state (sensors gated, audio level).<\/li>\n<li>It shows % on the status LED (hold-TAP query), warns at ≈ 3.5 V, and at ≈ 3.3 V mutes the FX and flashes before the boost's undervoltage cutoff.<\/li>\n<li><strong>≈ $0.05.<\/strong><\/li>\n<li><strong>Optional:<\/strong><\/li>\n<li><strong>charger STAT → D29<\/strong> (Adafruit #6106 STAT pad availability UNVERIFIED);<\/li>\n<li><strong>VBUS-present → D30<\/strong> via a divider.<\/li>\n<\/ul>\n<p>That gives \"charging / charged / on USB\" indication. The charger itself stays autonomous (bq25185 settings are fixed by resistors).\n- <strong>The Seed can't manage charging, and shouldn't:<\/strong> the bq25185 board does it safely in hardware. The Seed's job is monitoring and power sequencing:\n  - sensor-LDO enable on D18, last;\n  - LM386 enable on D12.<\/p>\n<p><strong>Risk:<\/strong> M (the Seed's draw is the biggest unknown left). <strong>Gate:<\/strong> measure it on the spike before freezing the battery choice.<\/p>\n<hr />\n<h2>8. What else gets better or simpler<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Change<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Boot time<\/td>\n<td data-label=\"Change\">Autotune + key tables in QSPI flash (8 MB on module): boot in ≈ 0.5 s, with a 3-point verify in the background<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">DRIFT<\/td>\n<td data-label=\"Change\">Random walk on the fine DACs inside the TIM5 loop. Per-VCO independent; DRIFT = 0 is truly locked<\/td>\n<td data-label=\"Cost\">$0 (needs §4)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Mod-VCA (AS3360 A) feedthrough null<\/td>\n<td data-label=\"Change\">Step the mod-depth CV with OSC MOD on and read the VCO pitch shift on TIM5. Optional, replaces an ADC-sense path<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">74HC595 / expander<\/td>\n<td data-label=\"Change\">Not needed (as in the straight port)<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Glide<\/td>\n<td data-label=\"Change\">Firmware saturating curve, now at fine-DAC resolution: no stepping<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Firmware LFO, noise, envelopes<\/td>\n<td data-label=\"Change\"><strong>Stay analog<\/strong> (owner). Not proposed<\/td>\n<td data-label=\"Cost\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">14-bit MIDI CC and high-res velocity<\/td>\n<td data-label=\"Change\">Free with §1/§3 resolution<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Seed internal op-amps/comparators (OPAMP1 on PC4/PA7, COMP1 on PB1/PC4, H750 DS Table 7)<\/td>\n<td data-label=\"Change\">Not used: those pins are mux inputs<\/td>\n<td data-label=\"Cost\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2>9. Revised pin allocation (Daisy Seed, header pin in brackets)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Seed pin<\/th>\n<th>MCU<\/th>\n<th>Function<\/th>\n<th>Use<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\ -label=\"Use\">Mux B: keys 17–25 + 7 controls/monitor<\/td>\n<td data-label=\"Note\">3.3 V-only pin; mux at 3.3 V<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D18 [25]<\/td>\n<td data-label=\"MCU\">PA7<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">Sensor-LDO P-FET enable (pull-down = off at reset)<\/td>\n<td data-label=\"Note\">3.3 V-only pin, output<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D19 [26]<\/td>\n<td data-label=\"MCU\">PA6<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">\"Not in control\" LED<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D20 [27]<\/td>\n<td data-label=\"MCU\">PC1<\/td>\n<td data-label=\"Function\"><strong>ADC3<\/strong> (INP11)<\/td>\n<td data-label=\"Use\">Battery voltage (direct)<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D21 [28]<\/td>\n<td data-label=\"MCU\">PC4<\/td>\n<td data-label=\"Function\"><strong>ADC1<\/strong> (INP4)<\/td>\n<td data-label=\"Use\">Mux A: keys 1–16<\/td>\n<td data-label=\"Note\">Dual-simultaneous with ADC2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D22 [29]<\/td>\n<td data-label=\"MCU\">PA5<\/td>\n<td data-label=\"Function\"><strong>DAC1_OUT2<\/strong><\/td>\n<td data-label=\"Use\">Mod-depth CV → AS3360 A<\/td>\n<td data-label=\"Note\">3.3 V-only pin, output<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D23 [30]<\/td>\n<td data-label=\"MCU\">PA4<\/td>\n<td data-label=\"Function\"><strong>DAC1_OUT1<\/strong><\/td>\n<td data-label=\"Use\">Velocity CV → AS3360 B<\/td>\n<td data-label=\"Note\">3.3 V-only pin, output<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D24 [31]<\/td>\n<td data-label=\"MCU\">PA1<\/td>\n<td data-label=\"Function\">TIM5_CH2<\/td>\n<td data-label=\"Use\">VCO 2 count<\/td>\n<td data-label=\"Note\">100 k + clamp to 3.3 V<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D25 [32]<\/td>\n<td data-label=\"MCU\">PA0<\/td>\n<td data-label=\"Function\">TIM5_CH1<\/td>\n<td data-label=\"Use\">VCO 1 count<\/td>\n<td data-label=\"Note\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D26 [33]<\/td>\n<td data-label=\"MCU\">PD11<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">Gate out (and internal gate)<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D27 [34]<\/td>\n<td data-label=\"MCU\">PG9<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">Status LED red<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D28 [35]<\/td>\n<td data-label=\"MCU\">PA2<\/td>\n<td data-label=\"Function\">TIM5_CH3<\/td>\n<td data-label=\"Use\">VCO 3 count<\/td>\n<td data-label=\"Note\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D29 [36]<\/td>\n<td data-label=\"MCU\">PB14<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">Charger STAT (<strong>optional<\/strong>)<\/td>\n<td data-label=\"Note\">Freed by USB plan U1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">D30 [37]<\/td>\n<td data-label=\"MCU\">PB15<\/td>\n<td data-label=\"Function\">GPIO<\/td>\n<td data-label=\"Use\">VBUS present (<strong>optional<\/strong>)<\/td>\n<td data-label=\"Note\">\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">Audio in L/R [16/17]<\/td>\n<td data-label=\"MCU\">codec<\/td>\n<td data-label=\"Function\">—<\/td>\n<td data-label=\"Use\">L = FX send (post-VCA); R = ladder tap (filter cal)<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">Audio out L/R [18/19]<\/td>\n<td data-label=\"MCU\">codec<\/td>\n<td data-label=\"Function\">—<\/td>\n<td data-label=\"Use\">Wet L/R → output mixer<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">AGND [20]<\/td>\n<td data-label=\"MCU\">—<\/td>\n<td data-label=\"Function\">—<\/td>\n<td data-label=\"Use\">Analog star<\/td>\n<td data-label=\"Note\">Join DGND once under the Seed<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Seed pin\">Seed USB port<\/td>\n<td data-label=\"MCU\">OTG FS<\/td>\n<td data-label=\"Function\">—<\/td>\n<td data-label=\"Use\">Rear USB-C D± via a cut cable (no VBUS)<\/td>\n<td data-label=\"Note\">USB-MIDI + DFU<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tally:<\/strong>\n- <strong>27 required.<\/strong>\n- <strong>3 optional:<\/strong> D13 MIDI out, D29 STAT, D30 VBUS detect.\n- <strong>1 spare:<\/strong> D16.\n- Mux channels: <strong>46 of 48.<\/strong><\/p>\n<hr />\n<h2>10. Breadboard spike (re-aimed; ≈ 2 evenings, parts reused in the build)<\/h2>\n<p>Parts: Seed, 3× CD74HC4067, 4 SS49E + 4 D31 magnets + 2 Choc V2, 2× MCP4822, a 74HC139 + 2N3906, a function generator, the scope.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Test<\/th>\n<th>Pass<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">1<\/td>\n<td data-label=\"Test\">Timer-paced scan: CC1 → DMA → GPIOC BSRR, CC2 → ADC1+2 dual + ADC3, 4× oversampling, 10 kHz frame<\/td>\n<td data-label=\"Pass\">Scope S0: jitter &lt; 0.5 µs. Zero DMA overruns while the DSP runs echo + plate at 48 kHz<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2<\/td>\n<td data-label=\"Test\">Hall noise: SS49E at rest and at mid travel, 1× vs 4× vs 16× oversampling<\/td>\n<td data-label=\"Pass\">Noise ≤ 3 LSB12 RMS at 4× (confirms the velocity estimate)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">3<\/td>\n<td data-label=\"Test\"><strong>SS49E power-on time:<\/strong> step its supply through a 2N3906<\/td>\n<td data-label=\"Pass\">Settles to 0.1 % in ≤ 50 µs → fit the gating<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">4<\/td>\n<td data-label=\"Test\">Velocity: Choc + D31, LS-slope fit, 20 soft-to-hard strikes<\/td>\n<td data-label=\"Pass\">Monotonic, repeatable ±1 step at a fixed press<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">5<\/td>\n<td data-label=\"Test\">Damper \"squeeze\" travel at bottom-out<\/td>\n<td data-label=\"Pass\">Report counts (aftertouch decision)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">6<\/td>\n<td data-label=\"Test\">TIM5 ×3 on the function generator, 0.1 Hz – 15 kHz, with audio running<\/td>\n<td data-label=\"Pass\">Error &lt; 0.05 cent after 50 ms averaging<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">7<\/td>\n<td data-label=\"Test\">Coarse + fine MCP4822 into a summer; TIM5 measures a test VCO (or the generator's VCO input)<\/td>\n<td data-label=\"Pass\">Fine step ≈ 0.04 cent; the loop holds ±0.1 cent for 10 min<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">8<\/td>\n<td data-label=\"Test\">Codec R: a sine plus two square \"VCOs\" summed; the DSP finds the sine frequency<\/td>\n<td data-label=\"Pass\">Error &lt; 1 cent at 100 Hz – 5 kHz<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">9<\/td>\n<td data-label=\"Test\">Codec L thump servo against a stepped DC offset<\/td>\n<td data-label=\"Pass\">Residual step &lt; 0.5 mV equivalent<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">10<\/td>\n<td data-label=\"Test\">USB U1: Seed port fed by a cut cable without VBUS; enumerate on macOS, Windows, Linux; DFU via the TAP gesture<\/td>\n<td data-label=\"Pass\">Enumerates; flashes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">11<\/td>\n<td data-label=\"Test\"><strong>Seed current<\/strong> at 5 V VIN: idle, echo + plate, echo + CloudSeed; 400 vs 480 MHz; WFI on/off<\/td>\n<td data-label=\"Pass\">Record it. Feeds the battery choice<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">12<\/td>\n<td data-label=\"Test\">Codec noise with the TL072 level stage (from <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §4)<\/td>\n<td data-label=\"Pass\">Wet floor ≤ −95 dB re −6 dBFS peak (PCM3060)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pass all → lock this design for schematic capture.<\/strong> If test 3 fails, drop the gating (leave the footprints).<\/p>\n<hr />\n<h2>11. Simplified block diagram<\/h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph Keys[&quot;Key strip&quot;]\n    H[25x SS49E Hall&lt;br/&gt;4 power groups] --&gt; MA[74HC4067 A]\n    H --&gt; MB[74HC4067 B]\n  end\n  subgraph Panel\n    P[Pots, rotaries,&lt;br/&gt;toggles, TAP, DRIFT] --&gt; MC[74HC4067 C]\n    P -.-&gt; MB\n  end\n  subgraph Seed[&quot;Daisy Seed (STM32H750 + codec)&quot;]\n    ADC12[ADC1+ADC2&lt;br/&gt;dual simultaneous]\n    ADC3[ADC3]\n    T5[TIM5 CH1-3&lt;br/&gt;capture]\n    SPI[SPI1]\n    DAC[DAC1 OUT1/2]\n    PWM[TIM3 PWM]\n    COD[Codec&lt;br/&gt;in L/R, out L/R]\n    USB[USB FS port]\n    UART[USART1]\n    DSP[[Echo + Reverb DSP&lt;br/&gt;SDRAM]]\n  end\n  MA --&gt; ADC12\n  MB --&gt; ADC12\n  MC --&gt; ADC3\n  BAT[Cell divider] --&gt; ADC3\n  SEL[S0-S3 via DMA] --&gt; MA &amp; MB &amp; MC\n  SEL --&gt; DEC[74HC139] --&gt; H\n  SPI --&gt; D4[4x MCP4822&lt;br/&gt;coarse+fine x3,&lt;br/&gt;keytrack, CUTOFF]\n  D4 --&gt; V[3 VCOs analog]\n  D4 --&gt; F[Ladder filter]\n  DAC --&gt; VCA2[AS3360&lt;br/&gt;velocity + mod depth]\n  PWM --&gt; VCA[VCA balance]\n  V --&gt;|squares| T5\n  V --&gt; MIX[Mixer] --&gt; F --&gt; VCAo[VCA] --&gt; OUT[Output mixer&lt;br/&gt;VOLUME, LM386]\n  F --&gt;|pre-VCA tap| COD\n  VCAo --&gt;|FX send| COD\n  COD &lt;--&gt; DSP\n  COD --&gt;|wet only| OUT\n  RUSB[Rear USB-C] --&gt;|D+/D-| USB\n  RUSB --&gt;|VBUS| CHG[bq25185 charger&lt;br/&gt;+ 5 V boost] --&gt; Seed\n  TRS[TRS MIDI in] --&gt; UART\n<\/code><\/pre>\n<hr />\n<h2>12. Changes to make elsewhere<\/h2>\n<ul>\n<li><strong><a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §1.4:<\/strong> superseded by §9 here. The filter counter moves to codec R; the CV plan moves to §4; USB moves to U1.<\/li>\n<li><strong><a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> §v1.2 Digital row:<\/strong><\/li>\n<li>4× MCP4822 (coarse/fine);<\/li>\n<li>CD74HC4067 ×3;<\/li>\n<li>Seed DACs for velocity and mod depth;<\/li>\n<li>CUTOFF on MCP #4.<\/li>\n<li><strong>BOM:<\/strong> ≈ +$11–15.<\/li>\n<li><strong><code>velocity-and-keys-v2.md<\/code> §1:<\/strong> VEL CV moves from PWM to Seed DAC1_OUT1 (same RC/TL072 stage, lower corner allowed). The CUTOFF channel is resolved.<\/li>\n<li><strong>Power (<code>round4-answers.md<\/code> §3.1, <code>battery.md<\/code>):<\/strong><\/li>\n<li>add the Seed's measured draw;<\/li>\n<li>gating credit if test 3 passes.<\/li>\n<li><strong>Design team:<\/strong><\/li>\n<li>no panel change, except an optional MIDI OUT jack (owner decision);<\/li>\n<li>the rear USB-C stays a single port.<\/li>\n<\/ul>", "lead": "Status: rev 0, 2026-11-13. Answers the owner (design/owner.md, after \"Switch to Daisy Seed\"): \"Also the key thing you need to port - go back to first principles and see if there's a better way with Daisy seed. Do this with all the things Da", "jump": ["0. Bottom line", "1. Key sensing + velocity", "2. Autotune and pitch measurement", "3. Pot and switch scanning", "4. CV generation", "5. MIDI and USB", "6. Effects architecture", "7. Power and battery", "8. What else gets better or simpler", "9. Revised pin allocation (Daisy Seed, header pin in brackets)", "10. Breadboard spike (re-aimed; ≈ 2 evenings, parts reused in the build)", "11. Simplified block diagram", "12. Changes to make elsewhere"], "code": "D-032", "causedBy": "Also the key thing you need to port - go back to first principles and see if there's a better way with Daisy seed. Do this with all the things Daisy seed affects"}, "D-034": {"kind": "doc", "sub": "doc", "title": "Aftertouch", "stage": "Spec", "status": "current", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "eng/aftertouch.md", "html": "<h1>Little D: channel aftertouch (pressure lanes under a floating key strip)<\/h1>\n<p>Status: rev 0, 2026-11-13. Answers the owner (<a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>, last entry): \"i think it needs its own switch but yes now i want it\". Recorded as: add channel aftertouch, sensed under a compliantly mounted key strip, with its <strong>own<\/strong> destination switch (separate from VELOCITY LOUD/BOTH/FILT), sent on MIDI out.<\/p>\n<p>Builds on <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> rev 0 (Daisy pin table §9, mux scan §1/§3, CVs §4), <code>velocity-and-keys-v2.md<\/code> rev 1 (keys, velocity routing) and <a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> rev 13. Conventions as there: a link means I read it this session; <strong>ESTIMATE<\/strong> = my number; <strong>UNVERIFIED<\/strong> = a source exists but I couldn't confirm the figure; [ENG] = engineering judgement; [CALC] = arithmetic.<\/p>\n<hr />\n<h2>0. Bottom line<\/h2>\n<ul>\n<li><strong>Sensing:<\/strong> two <strong>Interlink FSR UX 408, 300 mm<\/strong> strips ($4.99 each, solder tabs, <a href=\"https://www.interlinkelectronics.com/products/fsr-ux-408-300mm-length\" rel=\"noopener\" target=\"_blank\">Interlink<\/a>), trimmed to ≈ 240 mm. One lane runs under each key row (whites, sharps) and they're <strong>wired in parallel<\/strong>, so their conductances add.<\/li>\n<li><strong>Mechanism:<\/strong> strip C stops being screwed tight. It <strong>floats on the two lanes<\/strong>. Four springs at the existing bosses push it down with a light, fixed preload (≈ 4 N in total). Because the lanes are the <strong>only<\/strong> thing holding strip C up, the lanes carry the whole force of every key wherever you press. Pressure after bottom-out reaches the sensors with <strong>no extra key travel<\/strong>: the stack moves ≈ 10–50 µm at 20 N (ESTIMATE).<\/li>\n<li><strong>Added height under the keys: 0 mm nominal.<\/strong> The lane stack (≈ 8.1 mm) fills the ≈ 8 mm of air that's already under the raised strip C (<code>round4-answers.md<\/code> §1.3). The key surface stays at z 24. If the real gap is short, a thinner base strip makes it up, and keys rise only by any shortfall below 7.6 mm.<\/li>\n<li><strong>Electronics:<\/strong> a divider (FSRs to the sensor rail, 10 k to ground, 100 nF) feeds <strong>spare mux B channel 15 → ADC2<\/strong>, and the toggle is a resistor ladder on <strong>mux B channel 14<\/strong>. <strong>0 new header pins<\/strong>; D16 stays spare. The FSR is sampled at the 8–10 kHz frame, averaged to 1 kHz, and smoothed with τ ≈ 10 ms.<\/li>\n<li><strong>False triggers:<\/strong> pressure is <strong>forced to 0 unless a key is bottomed<\/strong> (the Halls know). Above that there's a <strong>self-learning dead zone<\/strong> sitting over normal holding force, a 30 ms blank after each note-on, and auto-zero whenever no key is held. Moving the instrument with no key down can't trigger it. A bump with a key held stays under the dead zone (≈ 1 N per g against ≈ 1.5 N, ESTIMATE).<\/li>\n<li><strong>Routing:<\/strong> an ON-OFF-ON toggle, <strong>MOD / OFF / FILT<\/strong>:<\/li>\n<li>MOD adds to the mod-depth CV (AS3360 A, Seed DAC1_OUT2), so it's vibrato when OSC MOD is on. Default: full pressure = +50 % of the MOD range.<\/li>\n<li>FILT adds to the CUTOFF CV (MCP4822 #4 B). Default: full pressure = +2 octaves.<\/li>\n<li>Channel pressure always goes out on USB-MIDI and TRS out, in every switch position. Incoming channel pressure drives the same destinations: max(local, MIDI).<\/li>\n<li><strong>Cost ≈ +$18–33<\/strong> (ESTIMATE; the spread is mostly shipping and the silicone). Power ≈ 1 mW. Pins +0, mux channels 46 → <strong>48 of 48<\/strong>. Risk: <strong>M<\/strong> (FSR repeatability and creep, whether the UX strip can be trimmed, force bypass). All of it gets tested on the breadboard spike (§6) before layout.<\/li>\n<\/ul>\n<hr />\n<h2>1. Sensing<\/h2>\n<h3>1.1 What the job needs<\/h3>\n<ul>\n<li>One number, <strong>total key force beyond normal playing<\/strong>, the same wherever on the keyboard you press (channel aftertouch on a mono synth).<\/li>\n<li>Range ≈ 1–20 N on top of the bottom-out holding force. Bandwidth ≈ 20 Hz (pressure gestures are slow). Latency ≤ 20 ms.<\/li>\n<li>No change to the bought Choc V2 key feel. No user calibration. Through-hole or a ready-made part. Fits under the keys.<\/li>\n<\/ul>\n<h3>1.2 Options (US, qty 1)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Part / price<\/th>\n<th>For<\/th>\n<th>Against<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Option\"><strong>A. 2 × FSR UX 408, 300 mm, parallel lanes<\/strong><\/td>\n<td data-label=\"Part / price\">$4.99 each, solder tabs, active width 10.2 mm, 0.41 mm thick, \"switch travel 0.15 mm\" (<a href=\"https://www.interlinkelectronics.com/products/fsr-ux-408-300mm-length\" rel=\"noopener\" target=\"_blank\">Interlink 300 mm<\/a>). Series range 0.5–150 N (<a href=\"https://www.interlinkelectronics.com/products/fsr-ux-408\" rel=\"noopener\" target=\"_blank\">UX 408<\/a>)<\/td>\n<td data-label=\"For\">Cheap, thin (fits the existing gap), solderable tabs, two lanes so the sum is position-independent (§1.3)<\/td>\n<td data-label=\"Against\">Typical FSR behaviour: ±2 % single-part and ±6 % part-to-part repeatability, ≈ +10 % hysteresis, creep under load (400-series datasheet, <a href=\"https://static.rapidonline.com/pdf/78-4000.pdf\" rel=\"noopener\" target=\"_blank\">Rapid PDF<\/a>). The 300 mm part is <strong>312.7 mm overall<\/strong>, longer than the ≈ 271 mm shell interior, so it <strong>must be trimmed<\/strong>. The FSR 408 \"can be cut down to a very short length\" (<a href=\"https://www.digikey.de/de/product-highlight/i/interlink/fsr-408-strip-force-sensing-resistor\" rel=\"noopener\" target=\"_blank\">DigiKey<\/a>); that this holds for the <strong>UX<\/strong> line is UNVERIFIED (spike §6 test A1)<\/td>\n<td data-label=\"Verdict\"><strong>Pick<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">B. Original FSR 408 (24\")<\/td>\n<td data-label=\"Part / price\">SparkFun SEN-09674 <strong>$30.95<\/strong>, \"only 3 left\", 100 g–10 kg (<a href=\"https://sparkfun.com/products/9674\" rel=\"noopener\" target=\"_blank\">SparkFun<\/a>); Adafruit #1071 $19.95 <strong>no longer stocked<\/strong> (<a href=\"https://www.adafruit.com:443/products/1071\" rel=\"noopener\" target=\"_blank\">Adafruit<\/a>)<\/td>\n<td data-label=\"For\">Proven, trimmable<\/td>\n<td data-label=\"Against\">2 × $31. Crimped tabs, can't be soldered (Adafruit warns it melts)<\/td>\n<td data-label=\"Verdict\">Fallback if UX trimming fails<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">C. Pressure-sensitive film (Velostat/Linqstat) + copper-tape electrodes<\/td>\n<td data-label=\"Part / price\">Adafruit sheet, 11 × 11\", 0.1 mm, <strong>$4.90<\/strong> (<a href=\"https://reach.dog/shop/kjdelectronics/products/adafruit-pressure-sensitive-conductive-sheet\" rel=\"noopener\" target=\"_blank\">reseller listing<\/a>)<\/td>\n<td data-label=\"For\">Cheapest, cut to any length<\/td>\n<td data-label=\"Against\">DIY sensor, with larger drift, hysteresis and humidity sensitivity than an FSR [ENG]. Hand-made electrodes<\/td>\n<td data-label=\"Verdict\">Second fallback: same lanes, same firmware<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">D. 4 load cells under the strip mounts + HX711<\/td>\n<td data-label=\"Part / price\">HX711 board <strong>$9.95<\/strong>, <strong>10 or 80 SPS<\/strong> (<a href=\"https://www.adafruit.com/product/5974\" rel=\"noopener\" target=\"_blank\">Adafruit 5974<\/a>), plus 4 bar cells (ESTIMATE $5–10 each)<\/td>\n<td data-label=\"For\">True force sum, linear, low drift<\/td>\n<td data-label=\"Against\">Bar cells plus mounting ≈ 10–15 mm tall (ESTIMATE): <strong>no room<\/strong>. 80 SPS = 12.5 ms per sample, before smoothing. 2 GPIO. ≈ $30–50<\/td>\n<td data-label=\"Verdict\">Rejected<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">E. Hall displacement (a spare SS49E watching the strip sink into foam)<\/td>\n<td data-label=\"Part / price\">$0 (5 spare SS49E)<\/td>\n<td data-label=\"For\">Free<\/td>\n<td data-label=\"Against\">Needs ≈ 0.3 mm of soft travel (a mushy key feel) and a rigid strip. Hall offset drift is the same size as the signal<\/td>\n<td data-label=\"Verdict\">Rejected<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Option\">F. Hall \"squeeze\" of the Choc damper<\/td>\n<td data-label=\"Part / price\">$0<\/td>\n<td data-label=\"For\">Free<\/td>\n<td data-label=\"Against\">Damper squish ≈ 0.1–0.3 mm, not repeatable (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §1.4)<\/td>\n<td data-label=\"Verdict\">Still an experiment only (spike test 5)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1.3 Why two lanes, and why strip C must float<\/h3>\n<ul>\n<li><strong>Statics:<\/strong> if strip C is held up <em>only<\/em> by the lanes, the sum of the lane forces equals the applied key force, whichever key is pressed and however much strip C flexes. Two FSRs in parallel give a total conductance ≈ G₁(F₁) + G₂(F₂), roughly ∝ F₁ + F₂ in the FSR's near-linear conductance region [ENG]. So the reading is position-independent to first order.<\/li>\n<li><strong>One lane would not do it.<\/strong> A single line support plus anything passive splits the force by leverage. The sharps' row would read ≈ ¼–½ of the whites' [CALC from the 47 mm strip geometry]. Firmware could correct per key, because the Halls know which key is down, but that's the fallback (§7), not the plan.<\/li>\n<li><strong>Anything else touching strip C steals force.<\/strong> That includes rigid screws, key tops rubbing the window, a taut harness and felt. Strip C must touch <strong>only<\/strong> the lanes and the springs.<\/li>\n<li><strong>Feel:<\/strong> the lanes are stiff. Silicone or foam strips 1.6 mm thick and 6 mm wide over ≈ 2 × 240 mm ≈ 2,900 mm² move ≈ 10–50 µm at 20 N, depending on the material (ESTIMATE). Pressing harder adds <strong>no perceptible key travel<\/strong>; the FSR senses force, not travel. The compliant layer is there to <strong>spread<\/strong> the load along the FSR (FSRs read concentrated loads inconsistently) and to soak up ±0.1 mm of flatness error. It isn't there to give.<\/li>\n<\/ul>\n<h3>1.4 Mechanical stack (flat concepts, at each lane; z from the outside of the back panel)<\/h3>\n<pre><code> z 24.0  ─ white key surface (unchanged)\n          Choc V2 + top\n z 12.7  ─ strip C top          ┌── spring (≈1 N) in a Ø7 counterbore in each boss pushes strip C down\n z 11.1  ─ strip C underside ───┤   M3 screw from below + nylon sleeve through a Ø6 hole: strip floats, ±0.5 mm lateral\n          pressure rib, 3 mm acrylic × 6 mm, epoxied to a lead-free lane on strip C's underside (clears 1.5 mm lead tails)\n z  8.1  ─ actuator: 1.6 mm (1/16&quot;) soft silicone (30–40A) or PORON strip, 6 mm wide (narrower than the 10.2 mm active width)\n z  6.5  ─ FSR UX 408, trimmed to ≈ 240 mm active, on thin transfer tape\n z  6.0  ─ base strip, 3 mm laser-cut acrylic × 16 mm, glued to the back panel (flat ≤ 0.1 mm over 240 mm)\n z  3.0  ─ back panel inner face (the reference; it takes the load straight to the feet)\n z  0    ─ back panel outside, feet\n<\/code><\/pre>\n<ul>\n<li><strong>Height budget [CALC]:<\/strong> 3 + 0.46 + 1.6 + 3 = <strong>8.06 mm<\/strong> against ≈ 8 mm of existing air under strip C (keys at 24, strip on spacers; <code>round4-answers.md<\/code> §1.3). Trim at assembly by choosing the base strip's thickness: base = gap − 5.06 mm (2 or 3 mm acrylic, plus 0.5 mm shims). The rib must stay ≥ 2.5 mm to clear the lead tails, so <strong>keys rise only if the gap is &lt; 7.6 mm<\/strong>, and only by the shortfall.<\/li>\n<li><strong>Lanes:<\/strong> two lanes, one under each key row (≈ y 12 and y 38 on strip C, ESTIMATE), each 6 mm wide on strip C's underside with <strong>no through-hole leads or vias<\/strong>, within ≤ 8 mm of the row's switch centreline. Active length ≈ 240 mm, centred. End keys sit a few mm past the lane ends, but their force still goes into the lanes through strip C (§1.3).<\/li>\n<li><strong>Clamping the FSR:<\/strong><\/li>\n<li>Each FSR is bonded to its base strip with thin transfer tape (e.g. 3M 467-class, ESTIMATE).<\/li>\n<li>The cut end is sealed with Kapton tape.<\/li>\n<li>The solder-tab end sits <strong>outside<\/strong> the rib's footprint (the rib stops 5 mm short) and is held by a small acrylic clip.<\/li>\n<li>Two thin wires run in a slack loop from the tabs up to pads on strip C. Both FSRs go in parallel at strip C.<\/li>\n<li><strong>Retention and preload:<\/strong><\/li>\n<li>The 4 existing shell bosses keep their M3 inserts. Each screw (still from below) passes through a <strong>nylon sleeve<\/strong> in a Ø 6 hole in strip C and tightens against the sleeve, so strip C isn't clamped.<\/li>\n<li>A <strong>light compression spring<\/strong> (≈ 0.5 N/mm, ≈ 2 mm compressed ≈ 1 N, from an assortment, ESTIMATE) sits in a Ø 7 × 2.5 counterbore in each boss face and presses strip C down.<\/li>\n<li>Preload ≈ 4 N plus strip weight ≈ 0.8 N (ESTIMATE). That keeps the FSR above its ≈ 0.5 N onset, so pressure starts smoothly, and stops rattle.<\/li>\n<li>Spring force changes ≈ 0.03 N over the ≈ 50 µm the strip moves, so the springs don't bypass load [CALC].<\/li>\n<li><strong>Load path:<\/strong> finger → strip C → lanes → back panel → feet → table. <strong>The shell and bosses no longer carry key load.<\/strong> Put 2 of the feet under the key zone near the lane ends.<\/li>\n<\/ul>\n<hr />\n<h2>2. Electronics<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Design<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Divider<\/td>\n<td data-label=\"Design\">Both FSRs in parallel, from the <strong>sensor-LDO 3.3 V rail, upstream of any Hall-gating PNP<\/strong> (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §1.5), to node P. <strong>R_M = 10 k<\/strong> P → GND (bench-pick 4.7–47 k in test A2). <strong>100 nF<\/strong> film at P. V_P rises with force; ≤ 0.33 mA, ≈ 1 mW<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Ratiometric<\/td>\n<td data-label=\"Design\">The FSR rail is the Hall rail. The existing Hall-rail monitor channel corrects supply drift against the Seed's ADC reference, the same way as for the keys (§1.4 there)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">ADC input<\/td>\n<td data-label=\"Design\"><strong>Mux B channel 15 → ADC2 (D17 / PB1)<\/strong>. <strong>No new header pin.<\/strong> P is low-impedance at the mux (100 nF reservoir against 4 pF + mux C), so charge-sharing error is ≈ 0.05 % [CALC]. <strong>D16 stays spare<\/strong> (comparator / VCA-sense fallback). Putting the FSR on D16 instead would need an injected conversion inside the ADC1+2 dual-mode paced scan, which risks timing skew on velocity. Not worth it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Toggle<\/td>\n<td data-label=\"Design\">ON-OFF-ON sub-mini, 3-step resistor ladder → <strong>mux B channel 14<\/strong>, read like VELOCITY: ±⅓-step windows, 20 ms debounce<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Mux tally<\/td>\n<td data-label=\"Design\"><a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §3.1 lists 20 controls + the Hall-rail monitor = 21 + 25 keys = <strong>46<\/strong>. Its §3.2 layout (\"mux B 9–15 = 6 controls + monitor\") overcounts by 2. Correct allocation: mux C = 16 controls; mux B 0–8 keys 17–25, 9–12 controls, 13 Hall-rail monitor, <strong>14 AT toggle, 15 FSR<\/strong>. <strong>48 of 48 used, 0 spare<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Harness<\/td>\n<td data-label=\"Design\">+1 wire (node P) if the muxes stay on the main board. Whether the 2 × 14 strip-C header has a free pin is UNVERIFIED (check at capture). Local if the muxes move onto strip C<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Scan and smoothing<\/td>\n<td data-label=\"Design\">Sampled every frame (8–10 kHz, 4× hardware oversampling) → box average to 1 kHz → linearising LUT (FSR conductance from V_P) → detection logic (§3.2) → 1-pole τ ≈ 10 ms → slew limit (full scale ≥ 30 ms) → destinations at 1 kHz. Resolution ≈ 14 bits after averaging [CALC as §3.2 there], far beyond 7-bit pressure<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2>3. Firmware: calibration and rejecting false triggers<\/h2>\n<h3>3.1 Auto-zero (no user step)<\/h3>\n<ul>\n<li><strong>Boot:<\/strong> after the sensor LDO enables (last in sequence) plus 200 ms, average 0.5 s with no key down → baseline F₀. If a key is down at boot, wait for release.<\/li>\n<li><strong>Running:<\/strong> whenever no key has been bottomed for ≥ 0.5 s, F₀ tracks slowly (τ ≈ 5 s). Steps &gt; 2 N with no key down (a knock, being set down) are ignored for 1 s, not tracked. This absorbs preload creep, temperature, orientation (strip weight × cos tilt) and FSR drift.<\/li>\n<li><strong>Full scale:<\/strong> a fixed default span of <strong>8 N<\/strong> above the dead zone (ESTIMATE, a firm press), with a mild curve (γ ≈ 1.5) so light pressure stays subtle. Span and curve are settings (hold-TAP gesture or MIDI, like the velocity curve). Nothing to set up.<\/li>\n<\/ul>\n<h3>3.2 Gating and dead zone<\/h3>\n<ol>\n<li><strong>Key-held gate:<\/strong> output = 0 unless at least one key's Hall depth is ≥ 0.9 (bottomed). That covers all handling, lifting and tilting with no key down.<\/li>\n<li><strong>Dead zone above normal holding:<\/strong> T = max(1.5 N, 1.3 × the rolling median of (F − F₀) measured 150–300 ms after each note-on, over the last 32 notes), plus 0.5 N for each extra held key. It <strong>learns the player's resting weight<\/strong> automatically. Pressure P = clamp(((F − F₀ − T) / 8 N)^γ, 0, 1).<\/li>\n<li><strong>Strike blanking:<\/strong> for 30 ms after any note-on, P is held at its previous value, so the bottom-out impact spike (a few ms, ESTIMATE) never reads as pressure. A re-strike under held pressure doesn't glitch.<\/li>\n<li><strong>Sustain:<\/strong> P must stay above 0 for ≥ 20 ms before it leaves 0 (rejects bumps), then the τ 10 ms smoother and the slew limit apply.<\/li>\n<li><strong>Bumps with a key held:<\/strong> the strip and keys weigh ≈ 80–100 g (ESTIMATE), so a 1 g jolt ≈ ±1 N. That's inside the 1.5 N minimum dead zone, and the 20 ms sustain catches the rest.<\/li>\n<li><strong>Release:<\/strong> when the last key releases, P ramps to 0 in 20 ms and a final MIDI pressure of 0 is sent.<\/li>\n<\/ol>\n<hr />\n<h2>4. Routing<\/h2>\n<h3>4.1 Switch (its own toggle, separate from VELOCITY)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Position<\/th>\n<th>Destination<\/th>\n<th>Default depth (settings)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Position\"><strong>MOD<\/strong> (up)<\/td>\n<td data-label=\"Destination\">Added to the <strong>mod-depth CV<\/strong>: Seed DAC1_OUT2 (D22) → AS3360 half A, the same stage the MOD dial and CC1 drive. depth = clamp(MOD dial + 0.5 · P, 0, 1)<\/td>\n<td data-label=\"Default depth (settings)\">Full pressure = <strong>+50 % of MOD range<\/strong> (0–100 %)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position\"><strong>OFF<\/strong> (centre)<\/td>\n<td data-label=\"Destination\">No sound change. MIDI pressure is still sent<\/td>\n<td data-label=\"Default depth (settings)\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Position\"><strong>FILT<\/strong> (down)<\/td>\n<td data-label=\"Destination\">Added to the <strong>CUTOFF CV<\/strong>: MCP4822 #4 ch B. cutoff = knob/CC + velocity offset + 2 oct · P, clamped<\/td>\n<td data-label=\"Default depth (settings)\">Full pressure = <strong>+2 octaves<\/strong> (0–4 oct)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Why OFF in the centre, not BOTH:<\/strong> there's no AT amount knob, so OFF is the only way to play without pressure effects. A centre-off ON-OFF-ON is the natural part. BOTH could be a firmware option that turns OFF into BOTH, but it isn't the default.<\/li>\n<li><strong>Legend:<\/strong> MOD adds <em>modulation amount<\/em>. It's vibrato when OSC MOD is on with osc 3 as the LFO, and a filter wobble when FILTER MOD is on, both set by the existing toggles and MOD MIX. \"MOD\" is the honest legend; \"VIB\" matches the owner's wording. <strong>Owner/design to choose.<\/strong><\/li>\n<li><strong>Interactions:<\/strong><\/li>\n<li>The closed-loop pitch trim freezes on period variance (<a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §2.3), so AT vibrato can't fight it.<\/li>\n<li>The §v1.5b passive-MOD-dial cut would also remove AT → MOD.<\/li>\n<li>Velocity stays latched per note; pressure is continuous. The two add on CUTOFF.<\/li>\n<li>MIDI never flips the switch (owner rule).<\/li>\n<\/ul>\n<h3>4.2 MIDI<\/h3>\n<ul>\n<li><strong>Out:<\/strong> channel pressure (Dn) on USB-MIDI and TRS out (owner: \"Add MIDI out\"). 7-bit, sent on change, at most once every 5 ms, a final 0 on release. Sent in <strong>all<\/strong> switch positions, so Little D works as a pressure controller. Can be disabled in settings.<\/li>\n<li><strong>In:<\/strong> channel pressure drives the same destination through the same switch: P_eff = max(P_local, P_MIDI). P_MIDI decays to 0 over 50 ms after the last MIDI note-off, so a stuck value can't hang. Optional: polyphonic pressure (An) for the sounding note maps to the same path ($0).<\/li>\n<\/ul>\n<hr />\n<h2>5. Cost, power, pins<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Cost<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">2 × FSR UX 408, 300 mm, solder tabs<\/td>\n<td data-label=\"Cost\">$9.98<\/td>\n<td data-label=\"Source\"><a href=\"https://www.interlinkelectronics.com/products/fsr-ux-408-300mm-length\" rel=\"noopener\" target=\"_blank\">Interlink store, $4.99<\/a>. DigiKey also lists UX 408 parts (34-00158 at €8.45 on <a href=\"https://www.digikey.fr/en/products/detail/interlink-electronics/34-00158/16803578\" rel=\"noopener\" target=\"_blank\">digikey.fr<\/a>, length not shown; US price UNVERIFIED)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Shipping from Interlink (or $0 if bought on the DigiKey order)<\/td>\n<td data-label=\"Cost\">$0–12<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Sub-mini ON-OFF-ON toggle<\/td>\n<td data-label=\"Cost\">$0.80–1.00<\/td>\n<td data-label=\"Source\">ESTIMATE, as the VELOCITY toggle (<code>velocity-and-keys-v2.md<\/code> §1.5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">R_M, ladder resistors, 100 nF film<\/td>\n<td data-label=\"Cost\">$0.15<\/td>\n<td data-label=\"Source\">Tayda, ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Actuator strip: 1/16\" soft silicone or PORON sheet, cut to 2 × 6 mm strips<\/td>\n<td data-label=\"Cost\">$4–8<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">4 springs (assortment allocation), 4 nylon sleeves, transfer tape<\/td>\n<td data-label=\"Cost\">$2–4<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Acrylic ribs, base strips, tab clips<\/td>\n<td data-label=\"Cost\">$0<\/td>\n<td data-label=\"Source\">Vector Space scrap, laser-cut<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Total<\/strong><\/td>\n<td data-label=\"Cost\"><strong>≈ +$18–33<\/strong><\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Power:<\/strong> ≤ 1 mW. CPU: negligible (one channel already in the scan).<\/li>\n<li><strong>Pins:<\/strong> 0 new header pins. Mux 46 → 48 of 48. D16 is the last analog spare.<\/li>\n<li><strong>Board:<\/strong> strip C needs two 6 mm lead-free lanes, 4 Ø 6 holes (were M3 clearance) and 2 FSR pads. Area should be unchanged (UNVERIFIED until placement).<\/li>\n<\/ul>\n<hr />\n<h2>6. Breadboard spike additions (≈ +1 evening; joins <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §10)<\/h2>\n<p>Rig: a scrap 270 × 47 strip of 1.6 mm perfboard or FR4 carrying 4 Choc V2 + tops (2 front row, 2 rear row, at both ends and the middle), the two lanes on a flat acrylic base, 4 sleeves + springs, the Seed reading the divider through a CD74HC4067 channel. Use 0.5 / 1 / 2 kg weights (water bottles) on the key tops.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Test<\/th>\n<th>Pass<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">A1<\/td>\n<td data-label=\"Test\"><strong>Trim one UX 408<\/strong> to 240 mm, seal the end. Force/resistance against an untrimmed one, per unit length<\/td>\n<td data-label=\"Pass\">Within ±10 %; no open circuit after 1,000 presses<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A2<\/td>\n<td data-label=\"Test\">Force → counts, 0–20 N, at 6 key positions (both rows, ends and middle); pick R_M<\/td>\n<td data-label=\"Pass\">Position spread ≤ ±20 % of reading; monotonic; ≥ 500 counts span<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A3<\/td>\n<td data-label=\"Test\">Actuator material: 40A silicone vs PORON<\/td>\n<td data-label=\"Pass\">Pick the one with the smaller A2 spread<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A4<\/td>\n<td data-label=\"Test\"><strong>False triggers:<\/strong> 2 min of normal playing (staccato, legato, ff strikes) with the firmware gate on<\/td>\n<td data-label=\"Pass\">Zero pressure output above 2 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A5<\/td>\n<td data-label=\"Test\"><strong>Handling:<\/strong> with no key held, lift, set down hard, knock the case, tilt 45°; then repeat holding one key lightly<\/td>\n<td data-label=\"Pass\">0 output with no key held; &lt; 10 % transient with a key held<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A6<\/td>\n<td data-label=\"Test\">Creep: hold 5 N for 60 s; release; re-zero<\/td>\n<td data-label=\"Pass\">Reading drifts &lt; 10 %; baseline returns within 1 s of release<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A7<\/td>\n<td data-label=\"Test\">Latency: force step → MIDI pressure out (scope on the TRS out)<\/td>\n<td data-label=\"Pass\">≤ 20 ms to 90 %<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">A8<\/td>\n<td data-label=\"Test\">Feel: compare key bottom-out with the strip floating vs rigidly screwed<\/td>\n<td data-label=\"Pass\">No difference noticed (blind, owner)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Gate:<\/strong> A1 fails → buy the original FSR 408 (option B). A2 spread &gt; ±20 % → per-key gain table from the Halls (§7). A4/A5 fail → raise the dead-zone floor and sustain time before changing hardware.<\/p>\n<hr />\n<h2>7. Risks<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>Level<\/th>\n<th>Mitigation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Risk\">FSR repeatability, hysteresis, creep (±6 % part-to-part, ≈ 10 % hysteresis per the 400-series datasheet)<\/td>\n<td data-label=\"Level\">M<\/td>\n<td data-label=\"Mitigation\">Auto-zero, learned dead zone, a soft curve; aftertouch is a gesture, not a measurement. Spike A2/A6<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">UX 408 not trimmable, or the cut end delaminates<\/td>\n<td data-label=\"Level\">M<\/td>\n<td data-label=\"Mitigation\">Spike A1 first. Fallback: SparkFun FSR 408 ($30.95 each, crimped tabs → clamp connector) or the Velostat lane<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>Force bypass:<\/strong> anything but the lanes touching strip C (key tops on the window edge, a taut harness, HUSH felt on peg shanks)<\/td>\n<td data-label=\"Level\">M<\/td>\n<td data-label=\"Mitigation\">Strip C touches only lanes + springs; ≥ 1 mm clear around key tops in the window; slack harness loop; HUSH felt hole clearance (already ≥ 0.5 mm radial)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Strip C layout can't fit two lead-free 6 mm lanes in 47 mm<\/td>\n<td data-label=\"Level\">M<\/td>\n<td data-label=\"Mitigation\">Check at placement. Fallback: one centred lane plus a per-key gain table (Halls know the key), or a rigid aluminium carrier under strip C (costs height)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Back panel not flat or stiff enough under the keys<\/td>\n<td data-label=\"Level\">L–M<\/td>\n<td data-label=\"Mitigation\">3 mm acrylic base strips; feet under the lane ends; flatness ≤ 0.1 mm over 240 mm<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Mux full (48/48)<\/td>\n<td data-label=\"Level\">L<\/td>\n<td data-label=\"Mitigation\">D16 remains as a direct ADC input for any later analog need<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">FSR temperature effect on gain<\/td>\n<td data-label=\"Level\">L<\/td>\n<td data-label=\"Mitigation\">Offset handled by auto-zero; gain change UNVERIFIED; acceptable for a gesture control<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2>8. Design-facing constraints (for the design team)<\/h2>\n<ol>\n<li><strong>Height under the keys: +0 mm nominal.<\/strong> The ≈ 8 mm under strip C is now <strong>occupied<\/strong> by two lanes (one under each key row). Keys stay at z 24. Only if the measured gap is &lt; 7.6 mm do the keys rise, by the shortfall (≤ ≈ 0.5 mm expected). <code>round4-answers.md<\/code>'s optional \"muxes + LD1117 under strip C\" now fits only in the band between the lanes, parts ≤ 5 mm. Prefer the main board.<\/li>\n<li><strong>New toggle: AFTERTOUCH (or PRESSURE), MOD · OFF · FILT<\/strong> (or VIB · OFF · FILT, owner's choice). Same sub-mini body as the others, so <strong>8 toggles<\/strong> (was 7). Logical spot: beside VELOCITY as a \"keyboard response\" pair, but a <strong>separate<\/strong> switch. Same body-height check as the other toggles (<a href=\"#i-D-019\"><code>budget-variant.md<\/code><\/a> §v1.8, rev 10).<\/li>\n<li><strong>The back panel becomes structural under the key zone<\/strong> (HUSH, ONE SHEET): flat, with 2 acrylic base strips glued on, and 2 of the feet under the lane ends. It's still screwed from underneath (no visible change). With the back panel off, strip C just hangs on its 4 screws.<\/li>\n<li><strong>Strip C floats.<\/strong> The 4 bosses become retention posts: a <strong>Ø 7 × 2.5 mm spring counterbore<\/strong> in each boss face, strip C holes Ø 6. Screws are still from below. Keep <strong>≥ 1 mm clearance between key tops and the key-window edges<\/strong> all round (strip C can shift ±0.5 mm). Nothing in the shell may touch strip C or the keys.<\/li>\n<li><strong>FOLD:<\/strong> the 270 × 78 base board (keys + PLAY strip on one board, <code>round4-answers.md<\/code> §1.4) <strong>must split<\/strong> into a floating key strip and a fixed PLAY board (fixed pots can't float). Add a short ribbon between them. The printed base floor under the keys must be flat (glue in a 3 mm acrylic base strip).<\/li>\n<li><strong>Panel/legend:<\/strong> \"AFTERTOUCH\" or \"PRESSURE\", positions MOD/OFF/FILT. No new jack: MIDI out already carries it.<\/li>\n<\/ol>", "lead": "Status: rev 0, 2026-11-13. Answers the owner (design/owner.md, last entry): \"i think it needs its own switch but yes now i want it\". Recorded as: add channel aftertouch, sensed under a compliantly mounted key strip, with its own destination", "jump": ["0. Bottom line", "1. Sensing", "2. Electronics", "3. Firmware: calibration and rejecting false triggers", "4. Routing", "5. Cost, power, pins", "6. Breadboard spike additions (≈ +1 evening; joins `daisy-first-principles.md` §10)", "7. Risks", "8. Design-facing constraints (for the design team)"], "code": "D-034", "causedBy": "i think it needs its own switch but yes now i want it"}, "D-003": {"kind": "doc", "sub": "doc", "title": "Common how it works (as locked in v1.1)", "stage": "Lock", "status": "locked in v1.1", "date": "13 Nov", "revs": [{"rev": "A", "line": "13 Nov"}], "path": "versions/v1.1/common-how-it-works.md", "html": "<h1>The budget instrument: what HUSH, FOLD and ONE SHEET share (systems)<\/h1>\n<p>Status: <strong>rev 6, 2026-11-12 (concept round 4).<\/strong> Active: HUSH, FOLD, ONE SHEET. TYPE CASE and HYMNAL are paused; their own files keep the rev 5 numbers (298 × 180, common layout with the stick column), and nothing here applies to them.<\/p>\n<p><strong>Why rev 6.<\/strong> The owner (newest in <code>../owner.md<\/code>):\n- \"the knob layout is adding extra space in front of the keyboard that's awkward, I like the keys right up to the edge, so rework the knobs to be logically split, and maybe it could get a bit narrower\"\n- \"I'd like the enclosure to be as 'unibody' … as possible. Screws in the back instead of front\"\n- \"One sheet and hush feel like the controls are installed from behind and then a panel screwed in on the back\"\n- FOLD: \"a hollowed out block that the face plate with filters and keys get installed in, sort of like a guitar with pickguard\"; \"screw placement is malleable but yes screw from back is ideal\".<\/p>\n<p>What made the space. In FOLD it was the 38 mm palm rest: the lid had to be 106 deep for three rows of knobs, so the base was 106 deep too, and keys only need ≈ 50. In the flat concepts it was the 180 mm footprint: an empty band (y 52–78) between keys and knobs, plus rows set further back than they needed to be. Both came from the knob layout, as the owner said.<\/p>\n<p>Read with <code>../jobs.md<\/code>. Each concept's <code>how-it-works.md<\/code> states only where it departs from this.<\/p>\n<blockquote>\n<h2>Rev 7.4: PARA legend fits by mirroring AFTERTOUCH's (labels can't stack 3 deep there)<\/h2>\n<ul>\n<li><strong>Name:<\/strong> \"PARA\", <strong>left-aligned 5.6 mm to the RIGHT of the toggle<\/strong>, in the strip between OSC 1 and OSC 2. It mirrors AFTERTOUCH's label, which sits right-aligned to the left of its own toggle.<\/li>\n<li><strong>Positions:<\/strong> shortened to <strong>1 · P · 4<\/strong> (MONO / PARA / PARA+4). These are the only words that change.<\/li>\n<li><strong>ONE SHEET:<\/strong> that strip is ≥ 8 mm tall across x 114–123 [CALC], so it takes two lines of 1.37 caps: \"PARA\" over \"1 · P · 4\".<\/li>\n<li><strong>HUSH:<\/strong> the tags narrow it to 4.3–5 mm, so there's room for one line only. \"1 / P / 4\" is pressed as three 1.2 mm glyphs stacked at the toggle's three throw heights (y 109 / 111.5 / 114), right beside it, and \"PARA\" follows at x ≈ 119.5–124.5 on y 111.5.<\/li>\n<\/ul>\n<h2>Rev 7.3 (pre-build, 2026-11-13): switch pair<\/h2>\n<ul>\n<li><strong>AFTERTOUCH confirmed where the visual designer placed it:<\/strong> VELOCITY's column, y 111.5, between the VOICE rows (FILTER MOD / AFTERTOUCH / VELOCITY). The two key-response switches stack.<\/li>\n<li><strong>Its empty mirror slot is now filled by the new PARA toggle (3-way MONO / PARA / PARA+4)<\/strong> at the oscillator-side switch column, y 111.5 (OSC MOD / PARA / OSC 3 CTL). ONE SHEET x 104.25, HUSH x 111.25; AFTERTOUCH ONE SHEET 171.75, HUSH 178.75.<\/li>\n<li><strong>Why:<\/strong> PARA decides how the keys are assigned to the oscillators, so it sits with the oscillator switches. AFTERTOUCH is how the keys respond, so it sits with VELOCITY. They mirror about the centre.<\/li>\n<li>Checkers 0 violations, mirror 0.00.<\/li>\n<li><strong>Legend check (visual):<\/strong> PARA's three position words need the same treatment as AFTERTOUCH's label (right-aligned, left of the toggle). OSC MOD and OSC 3 CTL labels go above their toggles, mirroring VELOCITY and SOURCE.<\/li>\n<\/ul>\n<h2>Rev 7.2 / DRIFT (ONE SHEET x; HUSH + 7), 2026-11-13. Supersedes 7.1's PLAY-right and back-row text. Owner: \"I like the idea of drift, but I'd want it to be controllable\". DRIFT is a firmware random pitch wander; fully left = rock-steady.<\/h2>\n<ul>\n<li><strong>Back row = the chain in one line<\/strong>, mirrored about the centre:<\/li>\n<li><strong>DRIFT 74.5<\/strong> (source, under the FREQ column)<\/li>\n<li>ECHO TYPE 103.5 · ECHO TIME 123.5<\/li>\n<li>REVERB DECAY 152.5 · REVERB TYPE 172.5<\/li>\n<li><strong>VOLUME 201.5<\/strong> (out, under the loudness column)<\/li>\n<li>Breaks at 89 / 138 / 187.<\/li>\n<li><strong>PLAY right:<\/strong> ECHO REPEATS 194 · ECHO MIX 214 · REVERB MIX 234 · <strong>TAP 256<\/strong>. TAP is played in rhythm, and it mirrors the bend stick.<\/li>\n<li><strong>Why:<\/strong> one added knob makes the count odd, so a lone DRIFT can't be mirrored. <strong>DRIFT ↔ VOLUME<\/strong> pairs source with output; TAP moves to the PLAY row to keep that row at 4 + 3 + 4. The checkers pass with 0 violations and mirror 0.00 in every row.<\/li>\n<li><strong>Cost:<\/strong> VOLUME sits on the back row (≈ 78 mm behind the PLAY row), and TAP is away from TIME. Sizes are unchanged.<\/li>\n<\/ul>\n<h2>Rev 7.1 (round 5 final, 2026-11-13): FULL FX (owner: \"Full 8, grow the panel\"). SUPERSEDES REV 7'S FX AND VOLUME TEXT<\/h2>\n<ul>\n<li><strong>Chip:<\/strong> Pico 2 core 1 + Teensy Audio Shield (eng <code>single-chip-research.md<\/code>). <strong>Controls:<\/strong> echo TYPE (4-way rotary), TIME, REPEATS, ECHO MIX, reverb TYPE (4-way rotary), DECAY, REVERB MIX, TAP.<\/li>\n<li><strong>The split rule: amounts in front, kinds and times behind.<\/strong><\/li>\n<li><strong>PLAY row, right section (\"how much\", played during a note):<\/strong> ECHO REPEATS 194 · ECHO MIX 214 · REVERB MIX 234 · <strong>VOLUME 256 (back on the panel)<\/strong>. ONE SHEET x; HUSH + 7.<\/li>\n<li>The PITCH ↔ AMOUNT mirror holds (the stick 22 pitch ↔ VOLUME).<\/li>\n<li>The rev 7 side-wall wheel and wall MODE toggle are <strong>dropped<\/strong>.<\/li>\n<li><strong>FX row, its own section (\"what kind, how long\"): a third panel row at y 146<\/strong>, 23 behind the VOICE back row, centred on the axis:<\/li>\n<li>ECHO TYPE 90.5 · ECHO TIME 110.5 | <strong>TAP 138 (on the axis: it's shared)<\/strong> | REVERB DECAY 165.5 · REVERB TYPE 185.5. ONE SHEET x; HUSH + 7.<\/li>\n<li><strong>Mirror meaning:<\/strong> TYPE ↔ TYPE, TIME ↔ DECAY (each effect's time scale).<\/li>\n<li><strong>Own breaks at x 125 / 151<\/strong> (HUSH 132 / 158), isolating TAP. The VOICE's vertical breaks (96.5 / 179.5) stop at the VOICE back row.<\/li>\n<li><strong>Balance:<\/strong> the deck becomes three full columns (PLAY + VOICE) on a centred FX \"plinth\" behind them, and the empty rear corners frame it.<\/li>\n<li>TAP: a 12 mm momentary cap (part UNVERIFIED). The TYPE rotaries are RS16211 (body height risk as with WAVE).<\/li>\n<li><strong>Checked:<\/strong> <code>_mock-src/flat_r5_check.py<\/code>, 0 violations, mirror 0.00 in all four rows.<\/li>\n<li><strong>New sizes<\/strong> (rows unchanged; growth at the back; board ≈ 268 × 122 with the shield, ESTIMATE):<\/li>\n<li><strong>ONE SHEET 276 × 180<\/strong> (FX edge 153.45, rear band 26.5 for jack legends and name);<\/li>\n<li><strong>HUSH 290 × 186<\/strong> (FX edge + 12 flat inset = 165.45; rear band for the pressed jack legend).<\/li>\n<li>Body heights and knob tops unchanged.<\/li>\n<li><strong>Mux (eng §5):<\/strong> 8 new channels, ≈ 45 of 48.<\/li>\n<li><strong>Key-edge options A/B unchanged<\/strong> (see each concept's file).<\/li>\n<\/ul>\n<h2>Rev 7 (round 5, 2026-11-13): one balanced layout for all three, and an FX group. SUPERSEDES §1–2 BELOW FOR HUSH AND ONE SHEET<\/h2>\n<p><strong>Why:<\/strong>\n- Owner: FOLD \"doesn't feel balanced yet\"; \"Is there a way for us to build in some effects, mainly a delay and echo?\"; then \"I want echo and reverb\".\n- Common rev 6 had no room for an FX group: its PLAY row was full, and its VOICE rows had holes in different places.\n- FOLD rev 5.1's balanced layout fits the flat frames unchanged, with <strong>0 violations<\/strong>: <code>_mock-src/flat_r5_check.py<\/code>. So <strong>all three concepts now share one layout.<\/strong> The balance logic (B1–B7) is in <a href=\"#i-D-011\"><code>fold/how-it-works.md<\/code><\/a> §1.<\/p>\n<p><strong>Frames:<\/strong>\n- ONE SHEET x = FOLD x − 5 (centre 138);\n- HUSH x = FOLD x + 2 (centre 145).<\/p>\n<p>Rows stay at y 68 / 100 / 123, the horizontal break at 85.4, and the keys as before. Every row mirrors about the centre (worst offset 0.00).<\/p>\n<p><strong>ONE SHEET x<\/strong> (HUSH: + 7):\n- <strong>Vertical breaks: x 96.5 / 179.5 in all rows<\/strong> (HUSH 103.5 / 186.5). The old 122.5 / 228 / 181 are retired.\n- <strong>PLAY y 68:<\/strong>\n  - <strong>PITCH:<\/strong> BEND stick 20, MOD 42, <strong>TUNE 62<\/strong>, GLIDE 82\n  - <strong>FILTER:<\/strong> CUTOFF 114, <strong>EMPHASIS 138<\/strong>, CONTOUR AMT 162; lights not-in-control (126, 81) and status (150, 81)\n  - <strong>FX:<\/strong> <strong>ECHO TIME 194, ECHO REPEATS 214, REVERB 234, FX MIX 256<\/strong>\n- <strong>VOICE, x for both rows:<\/strong> 18.5 / 38.5 / 58.5 / 78.5 | 104.25 t / 118 / 138 / 158 / 171.75 t | 197.5 / 217.5 / 237.5 / 257.5 t\n  - <strong>Front (y 100):<\/strong> RANGE 1–3, FREQ 2 | OSC MOD, OSC 1, OSC 3, MOD MIX, FILTER MOD | F ATTACK, F DECAY, F SUSTAIN, KBD CTRL\n  - <strong>Back (y 123):<\/strong> WAVE 1–3, FREQ 3 | OSC 3 CTL, OSC 2, NOISE/EXT, SOURCE, VEL | L ATTACK, L DECAY, L SUSTAIN, DECAY\n- <strong>Moved from rev 6:<\/strong>\n  - TUNE goes to the PLAY row;\n  - MOD MIX and the four set-before-playing switches (OSC MOD, FILTER MOD, KBD CTRL, VEL) go to the VOICE;\n  - reach stick → CUTOFF drops to 94.<\/p>\n<p><strong>FX group: echo + reverb (chip research pending; plan for 4–5 controls)<\/strong>\n- <strong>On the face: the PLAY row's right section, 4 knobs.<\/strong> ECHO TIME, ECHO REPEATS, REVERB (size/decay), FX MIX, in signal order: echo feeds the reverb, then the mix.\n  - The FX group sits under the hand, because throwing an echo or swelling a reverb is played.\n  - It mirrors the PITCH group.\n- <strong>VOLUME leaves the face.<\/strong> It becomes <strong>a thumbwheel in the right end wall<\/strong>, just behind the keys (ONE SHEET: right wall at y ≈ 60–75, z ≈ 12, slot 4 × 16; HUSH: punched through the felt).\n  - It sits next to the right hand, the way portable gear does it.\n  - This is the trade that keeps 4 + 3 + 4 balanced and gives the FX 4 face slots. The thumbwheel pot part is <strong>UNVERIFIED<\/strong> (eng).\n- <strong>The FX MODE toggle (ECHO / BOTH / REVERB, if the chip needs one)<\/strong> goes <strong>on the rear wall with the jacks and the power switch<\/strong>, where the set-and-forget choices live.\n- <strong>If research lands on 5 knobs:<\/strong> no legal face slot is left. The trades, in order of preference:\n  1. a dual-concentric FX MIX: inner = echo level, outer = reverb level (part UNVERIFIED in 9 mm T18);\n  2. REPEATS doubles as reverb decay in REVERB mode;\n  3. a third rear row in the rear band (HUSH and ONE SHEET only). It's centred, ±2 slots about the centre, but it breaks consistency with FOLD and adds depth.\n- <strong>If research lands on 3:<\/strong> leave the 234 slot blank; don't reflow the row.\n- <strong>Board (eng <code>effects.md<\/code> §2.5):<\/strong>\n  - The PT2399 alone adds ≈ +1,600–2,000 mm², ≈ +6–8 mm of depth at the back. Reverb adds more (pending).\n  - So the bodies grow at the back only: ONE SHEET ≈ 276 × 178, HUSH ≈ 290 × 184 (ESTIMATE). Keys and rows don't move.\n  - Keep the PT2399 / reverb chip ≥ 30 mm from the ladder, the expos and the Hall harness.<\/p>\n<p><strong>Key-edge options (owner wants to see both; keys must be \"somewhat raised so you can feel them\"):<\/strong> each concept's file gives its geometry. Both options raise the white key surface to <strong>2.5 above the panel<\/strong>, with sharps a further 2: strip C on spacers 2.5 mm taller (R4: ≤ 3 ✓).<\/p>\n<p><strong>Rev 6.1, same day: eng round-4 answers applied<\/strong> (<code>/home/claude/model-d/eng/round4-answers.md<\/code>). Supersedes the numbers below where they differ:\n- <strong>Main board needs ≈ 268 × 115<\/strong> (dense build: 1/8 W standing resistors, top parts ≤ 6.5 mm, Pico on the underside, ≤ 8 mm stack), not 268 × 85. As §3 said it would, <strong>the body grows at the back; rows and keys don't move.<\/strong>\n  - <strong>ONE SHEET 276 × 170. HUSH 290 × 176.<\/strong>\n  - The extra ≈ 30 mm sits behind the VOICE back row (last knob edge y 130.45 → back edge 170): a flush <strong>rear band<\/strong> for the name/wordmark and jack legends. No controls go there, and it's behind the hands, not in front of the keys.\n  - If eng's mux-on-strip-C saving works at layout (≈ 268 × 100), it drops to ≈ 155 deep.\n- <strong>Knobs:<\/strong> pots become <strong>Tayda A-5622 T18 spline<\/strong> ($0.59). Knobs are <strong>18T push-on, 14.5 × 13.5<\/strong>. KN1250 is a round-bore set-screw knob, so it's out on these shafts. Knob tops rise ≈ 3 mm: ONE SHEET ≈ 37.5, HUSH ≈ 39 (≤ 40 ✓, tight). Cream 18T push-on knobs for HUSH and ONE SHEET: availability UNVERIFIED (visual/eng). The RS16211 WAVE panel hole is <strong>9.5 mm<\/strong>; its shaft is 6 mm spline (18T likely).\n- <strong>Height risk (eng):<\/strong> the WAVE rotary body (Ø 16) and the toggle bodies may be &gt; 7 mm under the shell. Measure them before freezing panel z; if they're taller, they need a board cutout or a local spacer.\n- <strong>Speaker:<\/strong> ladder, expo pair and emphasis loop must stay <strong>≥ 55 mm from the speaker centre<\/strong> (240, 113). The natural ladder spot (x 135–180, y 75–100) gives ≈ 38 mm edge clearance ✓. The LM386 goes by VOLUME.\n- <strong>Power:<\/strong> recounted at ≈ 2.0–3.6 W, so an internal #2011 lasts ≈ 1.8–3.3 h. Optional 3000 mAh pouch under the main board (eng §3.1). FOLD defaults to a USB power bank.<\/p>\n<\/blockquote>\n<p>Coordinates: origin at the <strong>front-left outer corner<\/strong>, x right, y away from the player, z up from the table (bottom face = 0). mm. <strong>[ENG]<\/strong> eng figure, <strong>[CALC]<\/strong> mine, <strong>ESTIMATE<\/strong> unpriced, <strong>UNVERIFIED<\/strong> source exists but figure not checked.<\/p>\n<hr />\n<h2>1. The logical split: a PLAY row and the VOICE<\/h2>\n<p><strong>Rule (rev 6): the row nearest the keys is the PLAY row — everything the left hand works while the right hand plays. Behind it, the VOICE: the patch, left → right in signal order.<\/strong><\/p>\n<ul>\n<li><strong>PLAY row<\/strong>, read left → right as <strong>pitch → tone → level<\/strong>:<\/li>\n<li><strong>P1 Pitch &amp; modulation:<\/strong> BEND stick, MOD dial, MOD MIX, OSC MOD and FILTER MOD toggles, GLIDE. (The Model D's own \"controllers\" group: the wheel, its routing and glide, together.)<\/li>\n<li><strong>P2 Tone:<\/strong> CUTOFF (hero), EMPHASIS, CONTOUR AMT, KBD CTRL toggle, VEL toggle (velocity → loudness / both / filter: it sits between tone and level, which is what it switches between).<\/li>\n<li><strong>P3 Level:<\/strong> VOLUME, status light.<\/li>\n<li><strong>VOICE<\/strong>, two rows, read section by section left → right, <strong>front then back in each column<\/strong>:<\/li>\n<li><strong>II Oscillators:<\/strong> TUNE; then a column per VCO: RANGE (front), WAVE (back); then a FREQ column (FREQ 2 front, FREQ 3 back); OSC 3 CONTROL toggle beside FREQ 3.<\/li>\n<li><strong>III Mixer:<\/strong> OSC 1 / OSC 2, OSC 3 / NOISE·EXT, SOURCE toggle beside NOISE.<\/li>\n<li><strong>IV Contours:<\/strong> filter contour A D S (front row), loudness contour A D S (back row), DECAY toggle.<\/li>\n<\/ul>\n<p><strong>Why this split (reasons, not looks):<\/strong>\n1. <strong>It frees the front.<\/strong> The bend stick and MOD dial move out of the key zone into the PLAY row, so the keys run the full width and right to the front edge. Nothing sits beside or in front of the keys.\n2. <strong>It narrows the instrument.<\/strong> The 22 mm stick column is gone: the body is the keys plus walls. ONE SHEET 298 → <strong>276<\/strong> wide.\n3. <strong>It shortens the reach.<\/strong> Stick → CUTOFF was ≈ 196 mm; now <strong>120 mm<\/strong> [CALC]. The left hand never crosses the right.\n4. <strong>For FOLD it is the fold line<\/strong> (FOLD file): the PLAY row lives in the base with the keys; the VOICE goes on the lid. That is what removes the palm rest.<\/p>\n<p><strong>What it gives up:<\/strong> the strict Model D left-to-right panel sentence (controllers · oscillators · mixer · modifiers · output across one panel). The VOICE keeps signal order; the PLAY row pulls the hand controls out of it. TUNE moves into the oscillator section, where it acts.<\/p>\n<h2>2. Plan and coordinates (ONE SHEET frame: 276 wide)<\/h2>\n<p>HUSH uses the same layout shifted <strong>+7 in x<\/strong> (body 290); FOLD <strong>+5 in x<\/strong> (286) and its own y for the VOICE (FOLD file). Every number below was checked by script (no rule violation): knob pitch ≥ 20, 24 between CUTOFF / EMPHASIS / CONTOUR AMT, ≥ 7 mm from any knob edge to a section break, ≥ 3 mm from a toggle nut to a break, ≥ 10 mm from any control's edge to the outer body edge.<\/p>\n<p><strong>Parts used for the check:<\/strong> KN1250 knob 14.9 dia; CUTOFF Tayda 1083 20.8; toggle nut ≈ 9.2 across corners; stick cap ≤ 12 (check #2765 in hand); status LED 5 mm, \"not in control\" LED 3 mm.<\/p>\n<h3>Keys<\/h3>\n<ul>\n<li>25 Choc V2 silent, short tops (eng S1). 15 whites at 18 mm pitch, <strong>x 3–273<\/strong>.<\/li>\n<li><strong>Whites y 3–33<\/strong> (30 × 17.2). <strong>Sharps y 35–49<\/strong> (16 × 14, rear row, +2 mm). Key fronts <strong>3 mm<\/strong> from the front face: just the shell's front wall, flush with the key surface (it protects the key fronts in a bag and is the \"unibody\" edge). No palm rest, no deck, no band.<\/li>\n<\/ul>\n<h3>Rows<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Row<\/th>\n<th>y<\/th>\n<th>Content<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Row\">PLAY<\/td>\n<td data-label=\"y\"><strong>68<\/strong><\/td>\n<td data-label=\"Content\">sections P1 / P2 / P3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Row\">horizontal break<\/td>\n<td data-label=\"y\"><strong>85.4<\/strong><\/td>\n<td data-label=\"Content\">flush, full width (sunk groove; in FOLD the hinge seam)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Row\">VOICE front<\/td>\n<td data-label=\"y\"><strong>100<\/strong><\/td>\n<td data-label=\"Content\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Row\">VOICE back<\/td>\n<td data-label=\"y\"><strong>123<\/strong><\/td>\n<td data-label=\"Content\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Row\">last knob edge<\/td>\n<td data-label=\"y\">130.45<\/td>\n<td data-label=\"Content\">+ 10 to the edge → ONE SHEET depth <strong>140<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Sharps end 49 → CUTOFF's front edge 57.6 (8.6 mm clear), the other PLAY knobs 60.55 (11.5 clear).<\/p>\n<h3>PLAY row (y 68)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>x<\/th>\n<th>Control<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"x\">20<\/td>\n<td data-label=\"Control\"><strong>BEND stick<\/strong> (#2765)<\/td>\n<td data-label=\"Notes\">fore-aft gate slot along y, up and down, springs to centre; Delrin gate<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">42<\/td>\n<td data-label=\"Control\">MOD dial<\/td>\n<td data-label=\"Notes\">thumb on the stick, fingers on MOD<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">62<\/td>\n<td data-label=\"Control\">MOD MIX<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">78<\/td>\n<td data-label=\"Control\">OSC MOD toggle<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">92<\/td>\n<td data-label=\"Control\">FILTER MOD toggle<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">108<\/td>\n<td data-label=\"Control\">GLIDE<\/td>\n<td data-label=\"Notes\">MIDI dot<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>122.5<\/strong><\/td>\n<td data-label=\"Control\"><strong>break P1 | P2<\/strong><\/td>\n<td data-label=\"Notes\">continues straight back through the VOICE as the II | III break<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>140<\/strong><\/td>\n<td data-label=\"Control\"><strong>CUTOFF<\/strong> (1083 hero)<\/td>\n<td data-label=\"Notes\">MIDI dot<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">(152, 79)<\/td>\n<td data-label=\"Control\">\"not in control\" light<\/td>\n<td data-label=\"Notes\">behind and right of CUTOFF<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">164<\/td>\n<td data-label=\"Control\">EMPHASIS<\/td>\n<td data-label=\"Notes\">24 from CUTOFF<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">188<\/td>\n<td data-label=\"Control\">CONTOUR AMT<\/td>\n<td data-label=\"Notes\">24<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">204<\/td>\n<td data-label=\"Control\">KBD CTRL toggle<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">220<\/td>\n<td data-label=\"Control\">VEL toggle (LOUD / BOTH / FILT)<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>228<\/strong><\/td>\n<td data-label=\"Control\"><strong>break P2 | P3<\/strong><\/td>\n<td data-label=\"Notes\">PLAY row only<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">243<\/td>\n<td data-label=\"Control\">VOLUME<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">262<\/td>\n<td data-label=\"Control\">status light<\/td>\n<td data-label=\"Notes\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>VOICE (front y 100, back y 123)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>x<\/th>\n<th>Front (100)<\/th>\n<th>Back (123)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"x\">18.5<\/td>\n<td data-label=\"Front (100)\">TUNE (MIDI dot)<\/td>\n<td data-label=\"Back (123)\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">38.5<\/td>\n<td data-label=\"Front (100)\">RANGE 1<\/td>\n<td data-label=\"Back (123)\">WAVE 1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">58.5<\/td>\n<td data-label=\"Front (100)\">RANGE 2<\/td>\n<td data-label=\"Back (123)\">WAVE 2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">78.5<\/td>\n<td data-label=\"Front (100)\">RANGE 3<\/td>\n<td data-label=\"Back (123)\">WAVE 3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">98.5<\/td>\n<td data-label=\"Front (100)\">FREQ 2<\/td>\n<td data-label=\"Back (123)\">FREQ 3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">114.5<\/td>\n<td data-label=\"Front (100)\">—<\/td>\n<td data-label=\"Back (123)\">OSC 3 CONTROL toggle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>122.5<\/strong><\/td>\n<td data-label=\"Front (100)\"><strong>break II | III<\/strong><\/td>\n<td data-label=\"Back (123)\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">137<\/td>\n<td data-label=\"Front (100)\">OSC 1<\/td>\n<td data-label=\"Back (123)\">OSC 2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">157<\/td>\n<td data-label=\"Front (100)\">OSC 3<\/td>\n<td data-label=\"Back (123)\">NOISE / EXT<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">173<\/td>\n<td data-label=\"Front (100)\">—<\/td>\n<td data-label=\"Back (123)\">SOURCE toggle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\"><strong>181<\/strong><\/td>\n<td data-label=\"Front (100)\"><strong>break III | IV<\/strong><\/td>\n<td data-label=\"Back (123)\">VOICE only<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">197<\/td>\n<td data-label=\"Front (100)\">filter ATTACK<\/td>\n<td data-label=\"Back (123)\">loudness ATTACK<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">217<\/td>\n<td data-label=\"Front (100)\">filter DECAY<\/td>\n<td data-label=\"Back (123)\">loudness DECAY<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">237<\/td>\n<td data-label=\"Front (100)\">filter SUSTAIN<\/td>\n<td data-label=\"Back (123)\">loudness SUSTAIN<\/td>\n<\/tr>\n<tr>\n<td data-label=\"x\">253<\/td>\n<td data-label=\"Front (100)\">—<\/td>\n<td data-label=\"Back (123)\">DECAY toggle<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Counts:<\/strong> 26 round controls (25 + MOD) ✓, <strong>7 toggles<\/strong> ✓, bend stick ✓.<\/li>\n<li><strong>MIDI dots<\/strong> (F7): RANGE ×3, FREQ ×2, TUNE, GLIDE, CUTOFF, MOD.<\/li>\n<li><strong>Breaks:<\/strong> one horizontal (y 85.4) and three vertical (x 122.5 through everything; 228 in PLAY; 181 in VOICE). All flush (rule R4).<\/li>\n<li><strong>Edges:<\/strong> leftmost control edge 11.05 (TUNE), rightmost 264.5 (status light), last knob edge y 130.45.<\/li>\n<li><strong>F3 reach:<\/strong> stick (20, 68) → CUTOFF (140, 68) = <strong>120 mm<\/strong> [CALC].<\/li>\n<\/ul>\n<h3>Outer sizes (rev 6 vs rev 5)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>rev 5<\/th>\n<th><strong>rev 6<\/strong><\/th>\n<th>Why the difference between them<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Concept\">ONE SHEET<\/td>\n<td data-label=\"rev 5\">298 × 180<\/td>\n<td data-label=\"rev 6\"><strong>276 × 170<\/strong> (rev 6.1; 140 before eng)<\/td>\n<td data-label=\"Why the difference between them\">keys + 2.4 walls; rows pulled up behind the keys; +30 at the back for the main board (eng)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\">HUSH<\/td>\n<td data-label=\"rev 5\">298 × 180<\/td>\n<td data-label=\"rev 6\"><strong>290 × 176<\/strong> (rev 6.1)<\/td>\n<td data-label=\"Why the difference between them\">the felt's 12 mm round-over: pegs and knobs must sit on the flat; +32 at the back for the board<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\">FOLD (closed)<\/td>\n<td data-label=\"rev 5\">298 × 106 × 51<\/td>\n<td data-label=\"rev 6\"><strong>286 × 100 × ≈ 50<\/strong> (rev 6.1; 86 before eng)<\/td>\n<td data-label=\"Why the difference between them\">the lid's side rims need ≥ 12 mm from knob edges; +14 per half for the lid board<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Concept\">FOLD (open)<\/td>\n<td data-label=\"rev 5\">298 × 212<\/td>\n<td data-label=\"rev 6\"><strong>286 × 202<\/strong><\/td>\n<td data-label=\"Why the difference between them\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Boards (eng question E-L9)<\/h2>\n<ul>\n<li><strong>Main board<\/strong> under the panel: about <strong>268 × 85<\/strong> (y ≈ 52–137) in the flat concepts, down from 280 × 100 (≈ 35 in², −19 %). It now also carries the stick and MOD (both are in the panel), so <strong>E-L1 closes<\/strong>: nothing hangs off strip C except keys.<\/li>\n<li><strong>Strip C<\/strong> under the keys only, 270 wide, y ≈ 3–50.<\/li>\n<li><strong>E-L9 (eng):<\/strong> does the voice fit on ≈ 268 × 85? If not, the body grows at the <strong>back<\/strong> (rows unchanged; the extra depth goes behind the back row, where it costs nothing at the keys). FOLD has its own split (FOLD file).<\/li>\n<\/ul>\n<h2>4. Heights and section<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>z<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Part\">Back panel (bottom)<\/td>\n<td data-labe
