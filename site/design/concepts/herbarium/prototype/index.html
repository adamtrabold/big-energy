$21.45~~ <strong>[rev 11] $38.85–40.85 with the two-cell bay<\/strong>, rides on the same Adafruit order, and is the only way to meet the owner's\n\"completely portable\".<\/p>\n<h2>v1.7 Remaining ESTIMATE items<\/h2>\n<p><strong>The board: $75–130, the largest unknown.<\/strong> Replace it with real instant quotes (see \"Next action\" in §v1.0).<\/p>\n<p><strong>Priced, but the figure carries a caveat:<\/strong>\n- AS3046 DIP: EUR price converted, and the US price is not shown.\n- MCP4822: priced at TME; US price assumed similar.\n- Magnets: sold out at the cited price.\n- The PCB-mount rotary version: assumed the same price.<\/p>\n<p><strong>Pure ESTIMATE:<\/strong>\n- tempcos (MFOS shows no price);\n- Tayda TL072 and MC34063;\n- CD4067;\n- 2N3906;\n- JFET bag;\n- caps, diodes, LEDs;\n- sockets and headers;\n- power passives;\n- 6N138 set;\n- power switch;\n- PETG, felt, hardware and laser-cut materials;\n- all shipping except Tayda's;\n- Tayda duty rate;\n- the bend/mod option C and the wheel spring.<\/p>\n<h2>v1.8 New risks<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>L<\/th>\n<th>Mitigation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Risk\">One-board design: a single layout error means re-fabbing the whole board<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Full netlist cross-check against the CA-72 reference (v1 §7.0), ERC/DRC, and a 1:1 paper print to test-fit parts before ordering<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">No soldermask (if BareBones) on a dense board<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Generous pad spacing, wider clearances; or pick a full-spec quantity-1 quote<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Components under the keys must stay ≤ 8 mm<\/td>\n<td data-label=\"L\">L–M<\/td>\n<td data-label=\"Mitigation\">Low-profile electrolytics, nothing tall in the front region; check in a 3D model<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">AS3046 DIP availability in the US<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Order early; the CA3046 is pin-compatible if Tayda restocks ($1.10); Electric Druid has 350<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">bq25185 boost stall at power-up<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Soft-start the MC34063s and sequence the loads (§v1.6)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 9]<\/strong> Speaker/battery height under the main board<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">7.6 mm speaker + 0.5 mm air: no THT lead tails over the speaker (≈ 54 mm keep-out) or the battery (<code>little-d-design-answers.md<\/code> §1.3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 9]<\/strong> UNDER GLASS only: window band (y 80–96) holds 3 × AS3046 + tempcos and the ladder<\/td>\n<td data-label=\"L\">L–M<\/td>\n<td data-label=\"Mitigation\">Parts ≤ 6.5 mm seated; tempco bonded to its chip; LD1117, MC34063s, 78L/79L09, LM386 ≥ 25 mm and key harness/CD4067s/Pico ≥ 20–25 mm from windows; strip-C connector not under a window (§2 there)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 9]<\/strong> HUSH only: felt gripping the moving peg shank<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Uneven velocity and slow return; holes clear the shank ≥ 0.5 mm radial (§3.4 there)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Matched JFETs for the discrete ramp buffer<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Pico Idss jig with a bag of 10; fallback is the LSK489 (+$38)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 10]<\/strong> WAVE rotary (Ø 16) and sub-mini toggle <strong>body heights<\/strong> vs the 7 mm under-panel space<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Measure one of each before freezing panel z. If &gt; 7 mm: a board cutout with flying leads, or a local spacer (<code>round4-answers.md<\/code> §5)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 10]<\/strong> FOLD lid board ≈ 9–12k mm² short<\/td>\n<td data-label=\"L\">H (FOLD)<\/td>\n<td data-label=\"Mitigation\">Design picks: deeper halves, a stacked lid board, or a digital board under the keys (§1.4 there)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 10]<\/strong> FOLD: EMPHASIS across the hinge ribbon picks up scan-rate tones<\/td>\n<td data-label=\"L\">M (FOLD)<\/td>\n<td data-label=\"Mitigation\">Keep EMPHASIS on the ladder's half. If it must cross: low-Z drive, series R at the ladder, ground guards, 40-way ribbon, bench test first<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 10]<\/strong> Boost stall with 0.4–0.7 A total load<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Sensor LDO switched on last (P-FET), MC34063 soft-start<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 12]<\/strong> FOLD depth set by lid board area, not only the battery<\/td>\n<td data-label=\"L\">H (FOLD)<\/td>\n<td data-label=\"Mitigation\">D ≥ 6 + (23,300 + A)/262 mm. With the ladder in the lid: 95 (no cell), 113 (slim 4-cell), 121 (22 Wh). With the ladder in the base: 87 / 105 / 113. Rev 4.2's lid board recounts at ≈ 20,260 mm² (&lt; 21,500): recount (<code>fold-answers.md<\/code> §1.3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 13]<\/strong> Seed module height and USB-connector position unverified; a stock socket stack may exceed the 8 mm underside limit<\/td>\n<td data-label=\"L\">M–H<\/td>\n<td data-label=\"Mitigation\">Buy one, measure, before freezing z and the rear edge (§v1.11.3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 13]<\/strong> Boost headroom: 4.4 W ≈ 0.88 A at 5 V against the bq25185 board's 1 A boost<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Measure real draw in the spike; a 3.3 V buck for the sensor LDO saves ≈ 0.2–0.4 W; fallback a ≥ 2 A boost module (+$6–12)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 13]<\/strong> Seed supply (2026 production pause reported, price rise Nov 1)<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Check stock before order; Seed3 and Seed2 DFM are pin-compatible<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 14]<\/strong> FSR repeatability/creep; UX 408 trimmability UNVERIFIED<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Auto-zero + learned dead zone; spike test A1 trims one first; fallback SparkFun FSR 408 ($30.95) or a Velostat lane (<a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a> §7)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 14]<\/strong> Force bypass: anything but the lanes touching the floating strip C (key tops on the window, taut harness, felt)<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">≥ 1 mm key-top clearance in the window, slack harness, nothing in the shell touching strip C<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 14]<\/strong> Strip C may not fit two 6 mm lead-free lanes; FOLD's single base board can't float<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Check at placement (fallback: one lane + per-key gain from the Halls); FOLD splits keys from the PLAY board<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\"><strong>[rev 12]<\/strong> FOLD EMPHASIS in the base: scan-tone pickup on the emphasis-input wire<\/td>\n<td data-label=\"L\">M (FOLD)<\/td>\n<td data-label=\"Mitigation\">Supersedes the rev 10 row's premise: it's a 2-wire rheostat between low-Z nodes, and SPICE shows no response or onset change. The emphasis-input wire goes at the far ribbon edge with ground each side, ≤ 0.1 pF to S0–S3 (SPICE: −70 dB). 40-way ribbon. Bench pass ≤ −70 dB re note. Fallback: a separate 5-way cable, or EMPHASIS back in the lid (<code>fold-answers.md<\/code> §2)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>v1.9 Cost-cut ladder toward ≈ $200 (one unit; rev 3, final numbers in §v1.10)<\/h2>\n<p><strong>Baseline (rev 3, all bought keys, knobs and wheels):<\/strong> v1 on a USB power bank, <strong>K3 silent switches<\/strong>, and <strong>A2 hybrid wheels<\/strong>.\nThat is <strong>≈ $269–345, midpoint ≈ $307<\/strong>. The internal LiPo would add +$21.45 on top of every line below. Printed knobs, keys and wheels are no longer allowed, so that cut is gone.<\/p>\n<p>Ranked from most dollars per least pain. <strong>Sound?<\/strong> says whether the cut changes the sound or tuning.<\/p>\n<h3>No sound impact<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Cut<\/th>\n<th>Saves<\/th>\n<th>What's lost<\/th>\n<th>Sound?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">1<\/td>\n<td data-label=\"Cut\"><strong>Shrink the board to the control area only (≈ 280 × 100 mm, 43 in², down from 74 in²).<\/strong> The 25 Hall sensors move to a strip of Tayda stripboard under the keys (≈ $2–3, ESTIMATE), with a 28-wire harness to a header<\/td>\n<td data-label=\"Saves\"><strong>$16–34<\/strong> with K1; <strong>≈ $3–27<\/strong> with K2/K3, which still need a small key-strip PCB in the same order (board area at the ESTIMATE rate of $0.61–1.22/in², from §v1.3)<\/td>\n<td data-label=\"What&#x27;s lost\">About 1–2 h of extra wiring. One more mechanical part to mount<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">1b<\/td>\n<td data-label=\"Cut\"><em>Alternative to 1, going further:<\/em> <strong>voice-only board (≈ 190 × 100 mm, 30 in²)<\/strong>. All pots, switches and jacks mount on the laser-cut panel and are wired to the board. Keys on stripboard<\/td>\n<td data-label=\"Saves\"><strong>$19–46<\/strong> net (after ≈ $5 wire + $3 stripboard)<\/td>\n<td data-label=\"What&#x27;s lost\">About 4–6 h of wiring (≈ 110 wires) and more chances of wiring errors. A small hum/noise risk on the mixer and ladder lines, so keep those pots closest to the board. Makes cut 7 possible<\/td>\n<td data-label=\"Sound?\">No, if wired short<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2<\/td>\n<td data-label=\"Cut\"><strong>SoftPot strips (B) instead of the A2 hybrid wheels<\/strong><\/td>\n<td data-label=\"Saves\">≈ $11–17<\/td>\n<td data-label=\"What&#x27;s lost\">Strips instead of wheels; the owner prefers wheels. Saves the EU shipment<\/td>\n<td data-label=\"Sound?\">No (playing feel only)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">3<\/td>\n<td data-label=\"Cut\"><strong>Consolidate vendors to about 3 shipments<\/strong>: Tayda, one US distributor order (Pico, MCP4822, speaker, Hall if stocked; ESTIMATE), and the AS3046 source. Drop separate Adafruit/SparkFun/Addicore boxes<\/td>\n<td data-label=\"Saves\">≈ $5–10 (ESTIMATE)<\/td>\n<td data-label=\"What&#x27;s lost\">Fewer price choices; some items may cost a little more at the consolidated vendor<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">4<\/td>\n<td data-label=\"Cut\"><strong>Cheaper enclosure<\/strong>: makerspace scrap acrylic/ply, the owner's walnut offcuts, or a printed shell<\/td>\n<td data-label=\"Saves\">≈ $5–10 (ESTIMATE)<\/td>\n<td data-label=\"What&#x27;s lost\">Finish<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">5<\/td>\n<td data-label=\"Cut\"><strong>Bulk magnets<\/strong> (only if K2 or Hall keys are used)<\/td>\n<td data-label=\"Saves\">≈ $2–4 (ESTIMATE)<\/td>\n<td data-label=\"What&#x27;s lost\">—<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">6<\/td>\n<td data-label=\"Cut\"><strong>100k Tayda pots ($0.45) for contour A/D in place of 1 MΩ ($1.29)<\/strong>, with contour timing scaled in the circuit<\/td>\n<td data-label=\"Saves\">$3.36<\/td>\n<td data-label=\"What&#x27;s lost\">Needs the contour ranges re-checked in sim. No loss if done right [ENG]<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">7<\/td>\n<td data-label=\"Cut\">(Only with 1b) <strong>solder-lug toggles<\/strong> at $0.44 in place of PCB toggles at $0.80 (<a href=\"https://www.taydaelectronics.com/mini-toggle-switch-spdt-on-off-on-mts-103-c1.html\" rel=\"noopener\" target=\"_blank\">Tayda<\/a>)<\/td>\n<td data-label=\"Saves\">$2.16<\/td>\n<td data-label=\"What&#x27;s lost\">—<\/td>\n<td data-label=\"Sound?\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">—<\/td>\n<td data-label=\"Cut\"><strong>Power-rail simplification<\/strong><\/td>\n<td data-label=\"Saves\"><strong>&lt; $2<\/strong>: not worth it<\/td>\n<td data-label=\"What&#x27;s lost\">The two MC34063s plus regulators cost ≈ $2.60 in total. Two 9 V batteries would save ≈ $2 but lose USB power and add consumables<\/td>\n<td data-label=\"Sound?\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\"><\/td>\n<td data-label=\"Cut\"><strong>Running total after 1–6<\/strong> (K3; cut 5 n/a)<\/td>\n<td data-label=\"Saves\"><strong>−$27–67<\/strong><\/td>\n<td data-label=\"What&#x27;s lost\"><\/td>\n<td data-label=\"Sound?\"><strong>≈ $242–278, midpoint ≈ $260<\/strong> (the board saving in cut 1 scales with the board price)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Sound or tuning impact (in order of least audible)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Cut<\/th>\n<th>Saves<\/th>\n<th>What's lost<\/th>\n<th>Sound?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">8<\/td>\n<td data-label=\"Cut\"><strong>Drop the 3 tempcos<\/strong> (and the MFOS shipment)<\/td>\n<td data-label=\"Saves\">≈ $11–13<\/td>\n<td data-label=\"What&#x27;s lost\">Timbre is unchanged. Tuning drifts more for the first minutes after a cold start and on room-temperature swings; background re-tune corrects only held notes. A re-tune button press may be needed after warm-up<\/td>\n<td data-label=\"Sound?\">Tuning stability<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">9<\/td>\n<td data-label=\"Cut\"><strong>TL072 ramp buffer instead of the discrete matched-JFET buffer<\/strong><\/td>\n<td data-label=\"Saves\">≈ $2, plus the JFET matching step<\/td>\n<td data-label=\"What&#x27;s lost\">The CA3046-era board's slightly curved ramp (\"has some curve to it\", v1 §1.2) becomes the linear ramp of later boards. Subtle<\/td>\n<td data-label=\"Sound?\">Subtle timbre<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">10<\/td>\n<td data-label=\"Cut\"><strong>Drop the 2nd MCP4822<\/strong>. VCO 3 shares VCO 2's DAC channel, plus its own analog FREQ offset; filter keytrack comes from a Pico PWM-CV<\/td>\n<td data-label=\"Saves\">≈ $4<\/td>\n<td data-label=\"What&#x27;s lost\">VCO 3's tracking can't be corrected separately, so detune against VCO 1/2 grows across the keyboard (a few cents per octave [ENG]). Filter keytrack becomes slightly noisier and the automatic filter-scale cal is lost<\/td>\n<td data-label=\"Sound?\">Tuning<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">✗<\/td>\n<td data-label=\"Cut\">Tactile keys<\/td>\n<td data-label=\"Saves\">$10–17<\/td>\n<td data-label=\"What&#x27;s lost\">Cheap tactile switches click, which breaks the owner's \"as silent as possible\"<\/td>\n<td data-label=\"Sound?\"><strong>Not recommended<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">✗<\/td>\n<td data-label=\"Cut\">Cutting VCO 3, waveforms, a contour, or the speaker<\/td>\n<td data-label=\"Saves\">—<\/td>\n<td data-label=\"What&#x27;s lost\">Owner decisions / spirit<\/td>\n<td data-label=\"Sound?\">Not offered<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\"><\/td>\n<td data-label=\"Cut\"><strong>Running total after 1–10<\/strong><\/td>\n<td data-label=\"Saves\"><strong>−$44–86<\/strong><\/td>\n<td data-label=\"What&#x27;s lost\"><\/td>\n<td data-label=\"Sound?\"><strong>≈ $225–261, midpoint ≈ $243<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>How close to $200 (rev 3, bought keys, knobs and wheels)<\/h3>\n<ul>\n<li><strong>Bought keys and wheels add ≈ $25–60<\/strong> over the printed versions, depending on the K and A/B options.<\/li>\n<li><strong>Keeping the sound exactly (cuts 1–6, with SoftPots): about $260 at the midpoint, range $242–278.<\/strong><\/li>\n<li><strong>With real wheels (no cut 2): about $274 at the midpoint.<\/strong><\/li>\n<li><strong>Accepting cuts 8–10 (tuning stability, subtle ramp shape): about $243 at the midpoint, range $225–261.<\/strong><\/li>\n<li><strong>~$200 is no longer reachable<\/strong> with the current owner rules (3 VCOs, all waveforms, AS3046, bought keys/wheels, qty-1 boards) unless the board quote lands well below its ESTIMATE.<\/li>\n<li><strong>The remaining big levers are owner decisions, not engineering:<\/strong><\/li>\n<li>a 5-piece JLC board order: −$40–90;<\/li>\n<li>K3 over K1 keys: about −$20–30 (K1 is already excluded from the baseline);<\/li>\n<li>SoftPots over wheels: −$11–17.<\/li>\n<\/ul>\n<h2>v1.10 Clean one-unit totals (rev 4): the numbers to show the owner<\/h2>\n<p>Assumptions:\n- one unit, quantity-1 boards;\n- all knobs, keys and controllers are bought parts;\n- 3 VCOs, all waveforms, AS3046 + tempcos as locked in §v1.2;\n- USB power bank (add <strong>+$21.45<\/strong> for the internal LiPo, §v1.6).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>(a) Cheapest that keeps the sound<\/th>\n<th>(b) + tuning cuts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Line\">Core parts (§v1.3 $138, minus the old key allowance $20.90; <strong>[rev 9]<\/strong> + $1.93 thin speaker)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">$117.10 <strong>→ $119.03<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\">$117.10 <strong>→ $119.03<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">No-sound cuts: 100k contour pots (−$3.36), scrap/offcut enclosure (−$5–10)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">−$8.36 to −$13.36<\/td>\n<td data-label=\"(b) + tuning cuts\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Keys: <strong>[rev 8] K-v2<\/strong>: 25 Choc V2 silent soldered to the strip, short pressed-on tops, K&amp;J D31 magnets, flat SS49E, LD1117V33 (<code>velocity-and-keys-v2.md<\/code> §2.5). <strong>$38–43<\/strong> on scrap acrylic. ~~Lean RAIL alternative~~ (out: owner-built mechanism)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">~~$50–55~~ <strong>$51–56<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\">~~$50–55~~ <strong>$51–56<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>[rev 8] Velocity routing<\/strong>: LOUD/BOTH/FILT toggle, TL072, PWM RC passives (AS3360 half already counted)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\"><strong>≈ $2<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\"><strong>≈ $2<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Bend/mod: <strong>#2765 mini stick slot-gated to one axis<\/strong> (bend, springs back) $2.50 + <strong>MOD dial<\/strong> $0.75 + <strong>AS3360 mod VCA<\/strong> $5–8 (§v1.5b)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">$8.25–11.25<\/td>\n<td data-label=\"(b) + tuning cuts\">$8.25–11.25<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>Boards: main ≈ 280 × 100 mm (43.4 in²) + key strip 280 × 25 mm (10.9 in²), one qty-1 order<\/strong> (BareBones-class: 54.3 in² at the ESTIMATE $0.61–1.22/in² + $20 handling + $10–20 shipping). <strong>[rev 10] main 268 × 115 (47.8 in²) + strip C 270 × 47 (19.7 in²) = 67.5 in²<\/strong><\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">~~$63–106~~ <strong>$71–122<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\">~~$63–106~~ <strong>$71–122<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>[rev 10]<\/strong> T18 spline pots (+$3.22), sensor-LDO P-FET (+≈ $0.30)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">+$3.52<\/td>\n<td data-label=\"(b) + tuning cuts\">+$3.52<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Shipping + duty, ≈ 5 vendors (Tayda, one US distributor, AS3046 source, MFOS, Addicore for the Hall sensors)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">$30–39<\/td>\n<td data-label=\"(b) + tuning cuts\">$27–34 (no MFOS)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Tuning cuts: no tempcos (−$7.50), TL072 ramp buffer (−$2), no 2nd MCP4822 (−$3.99)<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">—<\/td>\n<td data-label=\"(b) + tuning cuts\">−$13.49<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>One-unit total (velocity keys)<\/strong><\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">~~≈ $255–320~~ ~~[rev 8] ≈ $258–323~~ ~~[rev 9] ≈ $260–325~~ <strong>[rev 10] ≈ $272–345 (midpoint ≈ $308)<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\">~~≈ $239–302~~ ~~[rev 8] ≈ $242–305~~ ~~[rev 9] ≈ $244–307~~ <strong>[rev 10] ≈ $256–327 (midpoint ≈ $291)<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>[rev 13] Daisy Seed + FX (§v1.11.4)<\/strong><\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\"><strong>≈ $311–395 (USB); ≈ $356–448 with the 22.2 Wh pack<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\"><strong>≈ $295–377 (USB); ≈ $340–430 with the pack<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">With internal LiPo<\/td>\n<td data-label=\"(a) Cheapest that keeps the sound\">~~≈ $276–341~~ ~~≈ $279–344~~ ~~[rev 9] ≈ $281–346~~ ~~[rev 10] ≈ $293–366 (runtime ≈ 1.8–3.3 h)~~ <strong>[rev 11] ≈ $311–386 (two-cell 1S2P, runtime ≈ 3.9–9 h)<\/strong><\/td>\n<td data-label=\"(b) + tuning cuts\">~~≈ $260–323~~ ~~≈ $263–326~~ ~~[rev 9] ≈ $265–328~~ ~~[rev 10] ≈ $277–348~~ <strong>[rev 11] ≈ $295–368<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Variants (add to either column):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Change<\/th>\n<th>Δ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Change\">Gateron Hall route (a) instead of (b), if the test passes<\/td>\n<td data-label=\"Δ\">≈ −$5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\"><strong>[rev 8]<\/strong> Scrap acrylic key tops<\/td>\n<td data-label=\"Δ\">≈ −$13<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\"><strong>[rev 8]<\/strong> Long piano whites + Choc V2 stabilisers (S2)<\/td>\n<td data-label=\"Δ\">+$29.85<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\"><strong>[rev 8]<\/strong> Velocity → filter <em>contour amount<\/em> via a 2nd AS3360 (instead of cutoff offset)<\/td>\n<td data-label=\"Δ\">+$5–7<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\">Two mini sticks (M2) instead of one<\/td>\n<td data-label=\"Δ\">+$2.50<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\">SoftPot strips instead of the mini stick<\/td>\n<td data-label=\"Δ\">+$15.40<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Change\">Real wheels (A2 / A1) instead of the mini stick (VCA kept, for MIDI CC1)<\/td>\n<td data-label=\"Δ\">+$26–33 / +$38–45<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Where the range comes from:<\/strong> about $43 of the ≈ $67 spread is the unquoted board ($63–106).\nUpload placeholder 280 × 100 and 280 × 25 mm outlines to the quantity-1 fabs (Pad2Pad, PCBCart, AtlasPCB, BareBones, Ponoko) to collapse it.<\/p>\n<p><strong>[rev 8]:<\/strong> velocity now sounds (switchable) and keys are all bought with minimal assembly, for ≈ +$3: <strong>≈ $258–323<\/strong>, or <strong>≈ $242–305<\/strong> with tuning cuts. Internal-LiPo runtime may drop to ≈ 3.5–5 h once the 0.5–0.8 W sensor load is counted.<\/p>\n<p><strong>Honest bottom line (rev 6, velocity required):<\/strong> the cheapest build that keeps the Model D sound is <strong>≈ $255–320<\/strong>. With tuning-stability cuts it is <strong>≈ $239–302<\/strong>. Velocity costs ≈ $25–30 over the non-velocity keys. About $200 is only reachable at the low end of the board quote with the tuning cuts taken.<\/p>\n<h2>v1.11 Rev 13: Daisy Seed as the digital brain (owner decision, 2026-11-13)<\/h2>\n<p>Sources: <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> (rev 0), <code>single-chip-research.md<\/code> (rev 0), <code>round4-answers.md<\/code> §3, <code>battery.md<\/code>, <code>fold-answers.md<\/code>, <code>answers-E1-E10.md<\/code> E3. Conventions as above. <strong>Pending <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a><\/strong>: key scan, autotune counting, pot scan, CVs, MIDI, FX signal path, power sequencing. Items marked \"provisional\" come from <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> and may change there.<\/p>\n<h3>v1.11.1 What changes in the BOM<\/h3>\n<p>Rev 12 never carried the SGTL5000 shield or 74HC595 (they existed only in <code>single-chip-research.md<\/code>). Against rev 12 the swap is:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Δ cost<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Line\">Pico 2 removed<\/td>\n<td data-label=\"Δ cost\">−$5.75<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>Daisy Seed, 65 MB (Seed3 TAC5242 or Seed2 DFM PCM3060), pre-soldered headers<\/strong><\/td>\n<td data-label=\"Δ cost\">+$34.99<\/td>\n<td data-label=\"Note\">$34.99 from Nov 1 per <a href=\"https://forum.pedalpcb.com/threads/free-stock-price-tracker-for-daisy-seeds-heads-up-prices-change-nov-1.30660/latest\" rel=\"noopener\" target=\"_blank\">PedalPCB tracker, Oct 26<\/a>. Thonk lists the 65 MB at £31 ex VAT, in stock (<a href=\"https://www.thonk.co.uk/shop/electrosmith-daisy-seed\" rel=\"noopener\" target=\"_blank\">Thonk<\/a>). Avoid used Rev 5 (WM8731)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">2 × 20 socket strips for the Seed (replace the Pico headers in the $3 line)<\/td>\n<td data-label=\"Δ cost\">≈ +$0.50 (ESTIMATE)<\/td>\n<td data-label=\"Note\">0.6\" row spacing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">FX wet path: 2 TL072, level/AA/recon passives (no 595, no shield)<\/td>\n<td data-label=\"Δ cost\">≈ +$1.50 (ESTIMATE)<\/td>\n<td data-label=\"Note\"><code>single-chip-research.md<\/code> §5.3 less the shield<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">FX panel controls, <strong>owner-approved \"Full 8, grow the panel\"<\/strong> (<a href=\"#i-R-001\"><code>design/owner.md<\/code><\/a>): 5 pots + knobs ($4.45), 2 four-way rotaries + knobs ($3.26), TAP ($0.50)<\/td>\n<td data-label=\"Δ cost\">+$8.21<\/td>\n<td data-label=\"Note\"><code>single-chip-research.md<\/code> §5.2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>DRIFT knob<\/strong> (owner: controllable drift; firmware slow random pitch wander per oscillator, 0 = steady): 1 pot + knob; mux channel, no GPIO<\/td>\n<td data-label=\"Δ cost\">+$0.89<\/td>\n<td data-label=\"Note\">Placement is the design team's; mux use ≈ 46 of 48<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>Bigger 5 V boost<\/strong> (battery builds only; flag below)<\/td>\n<td data-label=\"Δ cost\">+$6–12 (ESTIMATE, part not identified)<\/td>\n<td data-label=\"Note\">The bq25185 board's boost is 1 A and 4.4 W is ≈ 0.88 A. Fix: keep the bq25185 for charging and add a ≥ 2 A 5 V boost module fed from the cells (no ≥ 2 A load-sharing Adafruit board found; the PowerBoost 1000C is also 1 A)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Extra board area (§v1.11.5)<\/td>\n<td data-label=\"Δ cost\">≈ +$0.50–1.00<\/td>\n<td data-label=\"Note\">at $0.61–1.22/in²<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\">Seed shipping (separate vendor)<\/td>\n<td data-label=\"Δ cost\">+$0–6 (ESTIMATE)<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Line\"><strong>Δ vs rev 12<\/strong><\/td>\n<td data-label=\"Δ cost\"><strong>≈ +$39–50 on USB power; ≈ +$45–62 with a battery (boost swap)<\/strong><\/td>\n<td data-label=\"Note\">vs the Pico + shield FX plan: ≈ +$16–20, matching the +$19 in <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Optional, not counted: TRS MIDI out (jack + 2 resistors, ≈ +$0.50), free on the Seed (provisional pin D13).<\/p>\n<h3>v1.11.2 Power budget and runtime (all ESTIMATE; measure in the spike)<\/h3>\n<p>No official Seed current figure was found (the vendor pages and datasheet text I could read give none). <code>single-chip-research.md<\/code> carries ≈ 0.4–0.8 W at 5 V.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Load (at 5 V)<\/th>\n<th>Rev 12<\/th>\n<th>Rev 13<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Load (at 5 V)\">±9 V voice<\/td>\n<td data-label=\"Rev 12\">1.2–1.9 W<\/td>\n<td data-label=\"Rev 13\">1.2–1.9 W (+ ≈ 0.1 W for 2 FX TL072)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Load (at 5 V)\">25 SS49E via LD1117<\/td>\n<td data-label=\"Rev 12\">0.6–1.25 W<\/td>\n<td data-label=\"Rev 13\">0.6–1.25 W<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Load (at 5 V)\">Digital brain<\/td>\n<td data-label=\"Rev 12\">Pico 0.1–0.15 W<\/td>\n<td data-label=\"Rev 13\"><strong>Seed 0.4–0.8 W<\/strong> (codec, 400 MHz M7, SDRAM)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Load (at 5 V)\">LM386, mux, DACs, MIDI, LEDs<\/td>\n<td data-label=\"Rev 12\">≈ 0.07–0.35 W<\/td>\n<td data-label=\"Rev 13\">same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Load (at 5 V)\"><strong>Total<\/strong><\/td>\n<td data-label=\"Rev 12\"><strong>2.0–3.6 W<\/strong><\/td>\n<td data-label=\"Rev 13\"><strong>≈ 2.4–4.4 W<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Runtime = 90 % of nominal Wh ÷ (load ÷ boost efficiency; 90 % at 2.4 W, 85 % at 4.4 W), same method as <code>battery.md<\/code>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Pack<\/th>\n<th>Usable<\/th>\n<th>2.4 W<\/th>\n<th>4.4 W<\/th>\n<th>Rev 12 (2.0 / 3.6 W)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Pack\"><strong>22.2 Wh<\/strong> (2 × PiShop 755060, 1S2P)<\/td>\n<td data-label=\"Usable\">20.0 Wh<\/td>\n<td data-label=\"2.4 W\"><strong>≈ 7.5 h<\/strong><\/td>\n<td data-label=\"4.4 W\"><strong>≈ 3.9 h<\/strong><\/td>\n<td data-label=\"Rev 12 (2.0 / 3.6 W)\">9.0 / 4.7 h<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pack\">18.5 Wh (2 × Adafruit #328)<\/td>\n<td data-label=\"Usable\">16.6 Wh<\/td>\n<td data-label=\"2.4 W\">≈ 6.2 h<\/td>\n<td data-label=\"4.4 W\">≈ 3.2 h<\/td>\n<td data-label=\"Rev 12 (2.0 / 3.6 W)\">7.5 / 3.9 h<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Pack\"><strong>Slim 11.1 Wh<\/strong> (FOLD: 4 × PiShop 952540, 1S4P)<\/td>\n<td data-label=\"Usable\">10.0 Wh<\/td>\n<td data-label=\"2.4 W\"><strong>≈ 3.7 h<\/strong><\/td>\n<td data-label=\"4.4 W\"><strong>≈ 1.9 h<\/strong><\/td>\n<td data-label=\"Rev 12 (2.0 / 3.6 W)\">4.5 / 2.4 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>About −17 % across the board. Notes:\n- <strong>Boost headroom:<\/strong> 4.4 W is ≈ 0.88 A at 5 V against the board's 1 A boost rating: too thin. <strong>Fix: a ≥ 2 A 5 V boost module, ≈ +$6–12 (ESTIMATE).<\/strong> Pack current at end of discharge ≈ 1.7 A (≈ 0.43 A per 750 mAh slim cell, ≈ 0.6 C; the cell PCM rating is unknown).\n- <strong>Where the watts are:<\/strong> the SS49E LDO (5 V × I) is the biggest single item. A 3.3 V buck in place of the LD1117 saves ≈ 0.2–0.4 W [ENG], recovering most of the Seed's cost in runtime. Pending first-principles.\n- <strong>Thermal:<\/strong> ≈ 0.4–0.8 W in 51 × 18 mm with no heatsink. Not large, but a warm spot: keep it ≥ 30 mm from the ladder, AS3046s and tempcos, as the Pico was (<code>little-d-design-answers.md<\/code> \"Digital noise\"). Seed temperature ratings are UNVERIFIED.\n- <strong>Sequencing:<\/strong> the Seed boots through the Electrosmith bootloader; boot-to-main time is unmeasured. The sensor-LDO enable must default off at reset (provisional: D23/PA4, defined low, so no 595 hazard).\n- The Seed's 3V3 output rating is not stated (UNVERIFIED): keep the key strip on its own LD1117V33 and draw only the MCP4822s and mux logic from the Seed.<\/p>\n<h3>v1.11.3 USB: does the single rear USB-C from E3 still work?<\/h3>\n<p>E3 (<code>answers-E1-E10.md<\/code>) is the <strong>full instrument's<\/strong> plan: a USB-C breakout on the rear edge, VBUS to the charger, <strong>D± wired to the Pico 2 test pads TP2/TP3<\/strong>. Little D's own §v1.6 plan was two ports (USB-C charger plus the Pico's micro-USB). The pad trick goes away:\n1. <strong>The Seed has no test pads for D±.<\/strong> Its USB is a connector on the module (Seed3 USB-C, earlier Seeds micro-USB; physical position and height <strong>not found, UNVERIFIED<\/strong>). That port carries MIDI <strong>and<\/strong> the DFU/bootloader.\n2. The header exposes USB HS D−/D+ on <strong>D29/D30<\/strong> (provisional spare pins), so a rear breakout <em>could<\/em> feed the Seed over the header, with VBUS to the charger only. Whether libDaisy and the bootloader run MIDI and DFU on those pins is <strong>UNVERIFIED<\/strong> (not read this session).\n3. <strong>Do not join the breakout's VBUS to the Seed.<\/strong> Seed power arrives on VIN (4–17 V per vendor pages). How the module combines USB 5 V with VIN is not documented in what I read (UNVERIFIED), so back-powering is a real risk, as E3 found for the Pico.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>How<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>A. One rear USB-C via D29/D30<\/strong> (E3 adapted)<\/td>\n<td data-label=\"How\">Breakout D± to D29/D30, VBUS to the charger only<\/td>\n<td data-label=\"Verdict\">One user-facing port, but <strong>the spike must confirm MIDI on those pins<\/strong>, and firmware update still needs the module's own port<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>B. Seed's own connector is the data port<\/strong><\/td>\n<td data-label=\"How\">Module connector faces the rear edge, or a short USB-C extension to a panel receptacle. Charger keeps its own USB-C<\/td>\n<td data-label=\"Verdict\">No unknowns and DFU-friendly, but <strong>two rear ports<\/strong> and the connector position drives the board edge<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>C. Two ports, as §v1.6 already said<\/strong><\/td>\n<td data-label=\"How\">Same as B<\/td>\n<td data-label=\"Verdict\">Baseline fallback<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Recommendation (provisional):<\/strong> plan the rear-edge geometry for <strong>B<\/strong>, keep D29/D30 free for <strong>A<\/strong>, and let the spike decide. Either way the design team must hold a <strong>service opening for the module's connector<\/strong> (or an extension cable). E3's one-port promise no longer holds automatically.<\/p>\n<h3>v1.11.4 Cost totals (one unit, rev 13)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Config<\/th>\n<th>Rev 12 range<\/th>\n<th><strong>Rev 13 range<\/strong><\/th>\n<th>Midpoint<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Config\">(a) cheapest that keeps the sound, USB power<\/td>\n<td data-label=\"Rev 12 range\">$272–345<\/td>\n<td data-label=\"Rev 13 range\"><strong>≈ $311–395<\/strong><\/td>\n<td data-label=\"Midpoint\">≈ $353<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(b) + tuning cuts, USB power<\/td>\n<td data-label=\"Rev 12 range\">$256–327<\/td>\n<td data-label=\"Rev 13 range\"><strong>≈ $295–377<\/strong><\/td>\n<td data-label=\"Midpoint\">≈ $336<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(a) with the 22.2 Wh pack (rev 11: $311–386)<\/td>\n<td data-label=\"Rev 12 range\">—<\/td>\n<td data-label=\"Rev 13 range\"><strong>≈ $356–448<\/strong> (incl. bigger boost)<\/td>\n<td data-label=\"Midpoint\">≈ $402<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(b) with the 22.2 Wh pack (rev 11: $295–368)<\/td>\n<td data-label=\"Rev 12 range\">—<\/td>\n<td data-label=\"Rev 13 range\"><strong>≈ $340–430<\/strong> (incl. bigger boost)<\/td>\n<td data-label=\"Midpoint\">≈ $385<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The slim 11.1 Wh pack ($40.75 with the charger) changes the battery line, not this delta. The board quote remains the largest unknown.<\/p>\n<h3>v1.11.5 Board area and footprint<\/h3>\n<ul>\n<li><strong>Module:<\/strong> 51 × 18 mm (the 51 and 18 appear among the dimensions on the datasheet drawing, but I could not read their labels, so this is <strong>not independently confirmed<\/strong>). 2 × 20 pins at 2.54 mm pitch; <strong>15.24 mm (0.6\") row spacing<\/strong> per the datasheet landing pattern (read via a text summary; confirm on the drawing). The Pico 2 is 51 × 21 with 17.78 mm (0.7\") rows, so <strong>this is not a drop-in socket<\/strong>.<\/li>\n<li><strong>Height:<\/strong> the drawing lists 8.4 and 8 mm but I could not tell which dimension each is. Seated height and connector height are <strong>UNVERIFIED<\/strong>. The flat concepts allow a <strong>≤ 8 mm underside stack<\/strong> (<code>round4-answers.md<\/code> §1.3; a standard 8.5 mm female header already failed for the Pico), and a Seed in a header socket probably stacks higher. Measure one before freezing z. Fallbacks: low-profile machine-pin sockets, or solder directly (gives up \"socketed\").<\/li>\n<li><strong>Courtyard:<\/strong> Seed 918 mm² (Pico 1,070), ≈ 1,100–1,200 with keep-out for the USB end. Net ≈ −150 mm² on its own.<\/li>\n<li><strong>Added by the FX decision:<\/strong> 8 panel controls ≈ 1,375 mm² (5 pots × 125, 2 rotaries × 325, button ≈ 100) plus wet-path analog ≈ 600–800 mm². Rev 12's 19,500 mm² becomes <strong>≈ 21,500–21,700 mm²<\/strong>, which at 65–75 % fill is ≈ 29–33k mm² against 30,800 on 268 × 115, so the main board likely grows to <strong>≈ 268 × 120–126<\/strong> [CALC].<\/li>\n<li><strong>FOLD:<\/strong> anything placed on the lid board costs ≈ 1 mm of depth per 262 mm² (rev 12 formula); ≈ +2,000 mm² in the lid ≈ +8 mm. Put the Seed and wet path in the base.<\/li>\n<\/ul>\n<h3>v1.11.6 Pin allocation (provisional, from <a href=\"#i-D-031\"><code>daisy-pin-and-audio-check.md<\/code><\/a> §1.4; pending first-principles)<\/h3>\n<p>26 of 31 header GPIO used, 5 spare, no expander. The codec, SDRAM and QSPI use no header pins.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Function<\/th>\n<th>Provisional pins<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Function\">VCO 1/2/3 count + filter-scale count<\/td>\n<td data-label=\"Provisional pins\">D25, D24, D28, D16 (TIM5 CH1–4, 32-bit)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">PWM CVs (VCA balance, mod depth, velocity)<\/td>\n<td data-label=\"Provisional pins\">D4 (TIM3_CH3), D9 (CH1), D18 (CH2)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">SPI to 2 × MCP4822 (SCK, MOSI, CS1, CS2)<\/td>\n<td data-label=\"Provisional pins\">D8, D10, D7, D0<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">CD4067 selects S0–S3 (all port C)<\/td>\n<td data-label=\"Provisional pins\">D2, D1, D6, D3<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">Mux outputs → ADC<\/td>\n<td data-label=\"Provisional pins\">D15, D20, D21<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">TRS MIDI in / (optional) out<\/td>\n<td data-label=\"Provisional pins\">D14 / D13 (USART1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">Gate out, LEDs, LM386 enable, sensor-LDO enable<\/td>\n<td data-label=\"Provisional pins\">D26, D27/D5, D19, D22, D23<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\">Audio in/out (codec)<\/td>\n<td data-label=\"Provisional pins\">header pins 16–19, AGND pin 20<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Function\"><strong>Spare<\/strong><\/td>\n<td data-label=\"Provisional pins\">D11, D12 (I2C1), D17 (A2), D29, D30 (USB HS; spare unless USB option A)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Constraints that stand regardless: libDaisy owns TIM2 (use TIM5 for the counters); its default TIM3 CH2 pin is the on-board LED (name PA7 explicitly); its ADC mux helper handles 8 channels and 3 selects, so a 4-select CD4067 scan is custom code.<\/p>\n<h3>v1.11.7 Pre-layout breadboard spike (replaces <code>single-chip-research.md<\/code> §6)<\/h3>\n<p>One evening; parts are reused in the build. Pass numbers are my proposals.\n1. <strong>Four TIM5 input-capture counters<\/strong> on function-generator squares (10 Hz–20 kHz): error ≤ 0.1 cent at 20 kHz with audio running; no missed edges.\n2. <strong>Timer-driven CD4067 mux scan<\/strong>, 48 positions at ≥ 4 kHz/key (≈ 192 ksps), DMA-stepped selects on port C; scan-period jitter ≤ 2 µs at S0, with and without audio.\n3. <strong>Plate reverb (Dattorro) + tape echo<\/strong> together (then a long hall if wanted): zero underruns.\n4. <strong>Codec noise<\/strong> through the synth's level stage: idle, FX input muted, and worst case (tape repeats near runaway + long tail). Pass: typical ≤ −95 dB re full scale (PCM3060-class predicts ≈ −98 / −88 worst, TAC5242 ≈ −108 / −98). Record which codec the board has.\n5. <strong>CPU load<\/strong> (DWT cycle counter): &lt; 50 % at 400 MHz with everything running.\n6. <strong>Also measure:<\/strong> 5 V current at idle and full load (feeds §v1.11.2); seated height in the candidate socket; USB connector position; USB-MIDI via the module port and, if wanted, D29/D30; boot-to-main time and the LDO-enable state at reset; 3V3 current drawn.<\/p>\n<p><strong>Gate:<\/strong> pass → lock the Seed and start layout. Noise fail → try the other codec variant. Timing fail → pending first-principles redesign.<\/p>\n<h2>v1.12 Rev 14: channel aftertouch (owner decision, 2026-11-13)<\/h2>\n<p>Detail, sources and test plan: <a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a> rev 0. Summary:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Rev 14<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Sensor<\/td>\n<td data-label=\"Rev 14\">2 × Interlink FSR UX 408 300 mm ($4.99 each, solder tabs), trimmed to ≈ 240 mm (trimming UX parts is UNVERIFIED; spike A1), one lane under each key row, wired in parallel so the reading is the total force wherever you press<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Mechanics<\/td>\n<td data-label=\"Rev 14\">Strip C floats on the lanes (acrylic pressure rib → 1.6 mm soft silicone/PORON → FSR → acrylic base strip on the back panel); 4 springs (≈ 1 N each) at the existing bosses; screws through nylon sleeves. Stack ≈ 8.06 mm in the existing ≈ 8 mm gap: <strong>+0 mm<\/strong> key height nominal. Key load now goes to the back panel and feet<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Electronics<\/td>\n<td data-label=\"Rev 14\">FSRs from the sensor-LDO rail, 10 k + 100 nF → <strong>mux B ch 15 (ADC2)<\/strong>; toggle ladder → <strong>mux B ch 14<\/strong>. 0 header pins; mux 46 → <strong>48/48<\/strong>; D16 stays spare. 8–10 kHz → 1 kHz → τ 10 ms<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Firmware<\/td>\n<td data-label=\"Rev 14\">Output only while a key is bottomed (Hall); learned dead zone above holding force; 30 ms strike blank; auto-zero with no keys held; full scale 8 N default<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Routing<\/td>\n<td data-label=\"Rev 14\"><strong>MOD / OFF / FILT<\/strong> toggle. MOD: + up to 50 % mod depth (Seed DAC1_OUT2 → AS3360 A). FILT: + up to 2 octaves on CUTOFF (MCP4822 #4 B). MIDI channel pressure out (USB + TRS) in all positions; MIDI pressure in → same path, max(local, MIDI)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Power<\/td>\n<td data-label=\"Rev 14\">≈ 1 mW<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Cost<\/strong><\/td>\n<td data-label=\"Rev 14\"><strong>≈ +$18–33<\/strong> (FSRs $9.98, shipping $0–12, toggle, silicone, springs; acrylic $0 on scrap). Plus TRS MIDI out now owner-approved: <strong>+$0.50<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Totals (one unit, rev 14 = rev 13 + $18.5–33.5) [CALC]:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Config<\/th>\n<th>Rev 13<\/th>\n<th><strong>Rev 14<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Config\">(a) cheapest that keeps the sound, USB power<\/td>\n<td data-label=\"Rev 13\">$311–395<\/td>\n<td data-label=\"Rev 14\"><strong>≈ $330–429<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(b) + tuning cuts, USB power<\/td>\n<td data-label=\"Rev 13\">$295–377<\/td>\n<td data-label=\"Rev 14\"><strong>≈ $314–411<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(a) with the 22.2 Wh pack<\/td>\n<td data-label=\"Rev 13\">$356–448<\/td>\n<td data-label=\"Rev 14\"><strong>≈ $375–482<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Config\">(b) with the 22.2 Wh pack<\/td>\n<td data-label=\"Rev 13\">$340–430<\/td>\n<td data-label=\"Rev 14\"><strong>≈ $359–464<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Design-facing:<\/strong> 8 toggles (new AFTERTOUCH, legend MOD or VIB is the owner's call); ≥ 1 mm key-top clearance in the key window; Ø 7 spring counterbores in the 4 strip-C bosses; the back panel is flat and structural under the keys, with 2 feet under the lane ends; FOLD's base board splits into a floating key strip and a fixed PLAY board. <a href=\"#i-D-034\"><code>aftertouch.md<\/code><\/a> §8.<\/p>\n<p><strong>Spike:<\/strong> tests A1–A8 (≈ +1 evening) join <a href=\"#i-D-032\"><code>daisy-first-principles.md<\/code><\/a> §10.<\/p>\n<hr />\n<h1>PART 2: REV 0 EXPLORATION (tiers, cut list, calibration)<\/h1>\n<p>Kept for reasoning. Superseded by Part 1 where they conflict. §4 calibration still applies.<\/p>\n<h2>0. Bottom line<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>One-off (you build 1, pay for minimum board orders and 3 shipments)<\/th>\n<th>Per unit when 5 are built (boards and shipping split 5 ways)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>\"$100\" tier<\/strong> (spec §2)<\/td>\n<td data-label=\"One-off (you build 1, pay for minimum board orders and 3 shipments)\"><strong>≈ $125–150<\/strong><\/td>\n<td data-label=\"Per unit when 5 are built (boards and shipping split 5 ways)\"><strong>≈ $95–110<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">\"$150\" tier<\/td>\n<td data-label=\"One-off (you build 1, pay for minimum board orders and 3 shipments)\">≈ $175–195<\/td>\n<td data-label=\"Per unit when 5 are built (boards and shipping split 5 ways)\">≈ $140–155<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">\"$200\" tier<\/td>\n<td data-label=\"One-off (you build 1, pay for minimum board orders and 3 shipments)\">≈ $230–255<\/td>\n<td data-label=\"Per unit when 5 are built (boards and shipping split 5 ways)\">≈ $190–205<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Full version (architecture-v2)<\/td>\n<td data-label=\"One-off (you build 1, pay for minimum board orders and 3 shipments)\">$490–810<\/td>\n<td data-label=\"Per unit when 5 are built (boards and shipping split 5 ways)\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Honest answer: $100 per unit holds when you build a small batch (or sell it as a kit). The first single unit\ncosts about $125–150.<\/strong> The parts themselves come to about $88. What pushes a one-off past $100 is fixed cost:\n- a minimum board order of 5;\n- three vendor shipments;\n- the 35 % JLC DDP tariff.<\/p>\n<p>That fixed cost is about $40–55, and no circuit cut removes it. Cutting circuits until a one-off hits $100 means\ndropping things that are the spirit, such as the second VCO or real keys (§1.3). <strong>The real floor for a single\nunit that keeps the spirit is about $120.<\/strong><\/p>\n<hr />\n<h2>1. What \"the spirit\" is<\/h2>\n<h3>1.1 Essential: keep, even at $100<\/h3>\n<p>Ranked by how much of the sound and feel it carries (from <code>architecture.md<\/code> §1.9):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Element<\/th>\n<th>Why it's the spirit<\/th>\n<th>Cost to keep<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"#\">1<\/td>\n<td data-label=\"Element\"><strong>Transistor ladder, 24 dB/oct, self-oscillating<\/strong><\/td>\n<td data-label=\"Why it&#x27;s the spirit\">It <em>is<\/em> the Moog tone<\/td>\n<td data-label=\"Cost to keep\">Discrete matched 2N3904s at $0.02 each. Nearly free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">2<\/td>\n<td data-label=\"Element\"><strong>Passive mixer into the ladder's input pair (overdrive)<\/strong> and the <strong>feedback trick<\/strong><\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Overdrive comes from the input pair's tanh, not from an op-amp (CA-72 model, v1 §1.4)<\/td>\n<td data-label=\"Cost to keep\">3 pots, resistors, one switch position. Nearly free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">3<\/td>\n<td data-label=\"Element\"><strong>Contour overshoot (\"punch\")<\/strong><\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Lightner: attack overshoots sustain max (v1 §1.6)<\/td>\n<td data-label=\"Cost to keep\">Resistor ratios, so free if we keep the contour topology<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">4<\/td>\n<td data-label=\"Element\"><strong>≥ 2 free-running, detunable VCOs<\/strong><\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Beating and thickness. One VCO is a different instrument<\/td>\n<td data-label=\"Cost to keep\">≈ $5 per VCO<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">5<\/td>\n<td data-label=\"Element\"><strong>Panel-as-patch<\/strong>: a pot for every main parameter, no menus<\/td>\n<td data-label=\"Why it&#x27;s the spirit\">The \"immediacy\"<\/td>\n<td data-label=\"Cost to keep\">Pots $0.45 plus knobs $0.30 each, about $0.75 per control<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">6<\/td>\n<td data-label=\"Element\"><strong>Glide, low-note priority, single trigger<\/strong><\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Model D playing style<\/td>\n<td data-label=\"Cost to keep\">Firmware, so free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">7<\/td>\n<td data-label=\"Element\"><strong>Keys with travel<\/strong>, not pads<\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Owner: \"feel like an instrument\"<\/td>\n<td data-label=\"Cost to keep\">≈ $15 (Hall + magnets + printed keys)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"#\">8<\/td>\n<td data-label=\"Element\"><strong>Osc-as-modulator<\/strong> (osc 3 → LO, keyboard off)<\/td>\n<td data-label=\"Why it&#x27;s the spirit\">Model D's mod source, and audio-rate FM<\/td>\n<td data-label=\"Cost to keep\">One switch + resistor on VCO 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1.2 Cut list with sound cost<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Cut<\/th>\n<th>Saves<\/th>\n<th>Sound / feel cost<\/th>\n<th>Decision at $100<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Cut\">3 → 2 VCOs<\/td>\n<td data-label=\"Saves\">≈ $5–9 (TL072, pairs, cap, 2 pots, switch, knobs, DAC channel)<\/td>\n<td data-label=\"Sound / feel cost\">Less \"wall\" on bass and no 3-osc chords. VCO 2 doubles as the mod oscillator, so detuned-pair <em>or<\/em> osc-FM, not both at once<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong>. Back at $150<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Osc 3 as LFO-only<\/td>\n<td data-label=\"Saves\">—<\/td>\n<td data-label=\"Sound / feel cost\">Superseded: VCO 2 has a LO/keyboard-off switch (the Model D behaviour), and the Pico adds a firmware triangle LFO as an analog CV<\/td>\n<td data-label=\"Decision at $100\">Firmware LFO <strong>added<\/strong> for free<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Fixed waveforms (saw / square / narrow pulse on a 3-way toggle, not 6-way rotary)<\/td>\n<td data-label=\"Saves\">≈ $2 per VCO, plus panel area<\/td>\n<td data-label=\"Sound / feel cost\">Lose triangle and shark-tooth. Saw and pulse are ~90 % of Model D use [ENG]<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">One shared contour (instead of filter + loudness)<\/td>\n<td data-label=\"Saves\">≈ $4–5<\/td>\n<td data-label=\"Sound / feel cost\">Large. No filter sweeps over a held, steady level, and plucks with long tails go. Very Model D-defining<\/td>\n<td data-label=\"Decision at $100\"><strong>Keep both<\/strong> (they're cheap)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Fewer pots (≈ 23 → 18)<\/td>\n<td data-label=\"Saves\">≈ $4<\/td>\n<td data-label=\"Sound / feel cost\">Lose separate osc-2/3 freq, mod-mix crossfade, and the keyboard-control 1/2 split<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut to 18<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Pitch and mod wheels<\/td>\n<td data-label=\"Saves\">≈ $2 plus printed parts<\/td>\n<td data-label=\"Sound / feel cost\">Bends via MIDI only. Mod depth is a pot<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong>. Back at $150<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">MIDI CC beyond notes<\/td>\n<td data-label=\"Saves\">$0<\/td>\n<td data-label=\"Sound / feel cost\">—<\/td>\n<td data-label=\"Decision at $100\"><strong>Keep<\/strong>: USB-MIDI is the Pico's own port. CC covers cutoff, glide, osc-2 detune, LFO rate/depth and octave (every Pico-read pot), with jump-on-move<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">TRS MIDI in (6N138)<\/td>\n<td data-label=\"Saves\">≈ $1.5<\/td>\n<td data-label=\"Sound / feel cost\">—<\/td>\n<td data-label=\"Decision at $100\"><strong>Keep<\/strong> (cheap)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Autotune<\/td>\n<td data-label=\"Saves\">$0 parts (firmware + 1 divider per VCO)<\/td>\n<td data-label=\"Sound / feel cost\">—<\/td>\n<td data-label=\"Decision at $100\"><strong>Keep<\/strong>. Without it you need trimmers plus tempcos, which breaks \"no rigmarole\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Tempco resistors<\/td>\n<td data-label=\"Saves\">≈ $5–8 (3300 ppm, price UNVERIFIED)<\/td>\n<td data-label=\"Sound / feel cost\">Without them, about 12 cents/°C at 3 octaves above the calibration point [ENG]. Background re-tune absorbs it during held notes, and the first minute after a cold start may wander<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong>. Back at $150<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Built-in speaker<\/td>\n<td data-label=\"Saves\">≈ $2.20 (LM386 + speaker)<\/td>\n<td data-label=\"Sound / feel cost\">—<\/td>\n<td data-label=\"Decision at $100\"><strong>Keep<\/strong> (owner: \"incredible\")<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Internal LiPo + charger<\/td>\n<td data-label=\"Saves\">≈ $23–32<\/td>\n<td data-label=\"Sound / feel cost\">You need a USB power bank or cable. Some banks auto-off below ~50–100 mA. Our ~150 mA idle should hold, but that is ESTIMATE<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong>: power from any USB power bank. Back at $150<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Rails from a charge pump (ICL7660)<\/td>\n<td data-label=\"Saves\">—<\/td>\n<td data-label=\"Sound / feel cost\">20 mA class (<a href=\"https://www.digikey.com.mx/en/products/detail/analog-devices-inc-maxim-integrated/ICL7660CPA/1303023\" rel=\"noopener\" target=\"_blank\">DigiKey listing<\/a>), too weak for ~25–35 mA rails. ±4 V would starve the ladder's headroom and the noise junction<\/td>\n<td data-label=\"Decision at $100\"><strong>Rejected<\/strong>. Use 2× MC34063 DIP (§2.4)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">±9 V from two 9 V batteries<\/td>\n<td data-label=\"Saves\">≈ $3<\/td>\n<td data-label=\"Sound / feel cost\">Works and sounds right, but has 2 non-rechargeable consumables, no USB-only operation, and a battery door<\/td>\n<td data-label=\"Decision at $100\"><strong>Rejected<\/strong> (fallback only)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Capacitive PCB pads instead of keys<\/td>\n<td data-label=\"Saves\">≈ $12<\/td>\n<td data-label=\"Sound / feel cost\">Stylophone feel, no travel, no velocity. Fails \"feel like an instrument\"<\/td>\n<td data-label=\"Decision at $100\"><strong>Rejected<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">Stylus / resistor strip<\/td>\n<td data-label=\"Saves\">≈ $14<\/td>\n<td data-label=\"Sound / feel cost\">Novelty; not a keyboard<\/td>\n<td data-label=\"Decision at $100\"><strong>Rejected<\/strong><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">PCB sandwich enclosure (panel PCB + bottom PCB)<\/td>\n<td data-label=\"Saves\">—<\/td>\n<td data-label=\"Sound / feel cost\">Large PCBs (&gt;100 × 100 mm) leave JLC's $2 tier. Three 280 × 180 mm boards would cost about $100–160 per order (ESTIMATE). Laser-cut ply/acrylic at Vector Space costs ≈ $10, and the owner can hand-paint it<\/td>\n<td data-label=\"Decision at $100\"><strong>Rejected<\/strong>: makerspace laser-cut panel; all circuit boards ≤ 100 × 100 mm<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Cut\">16-bit DACs<\/td>\n<td data-label=\"Saves\">≈ $25<\/td>\n<td data-label=\"Sound / feel cost\">12-bit MCP4822 gives ≈ 1.8 cents/step over 6 octaves. Dither plus a post-filter hides the stepping on slow glides [ENG]<\/td>\n<td data-label=\"Decision at $100\"><strong>Cut<\/strong> to 12-bit<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1.3 What a \"true one-off $100\" would cost in spirit<\/h3>\n<p>Cuts that would bring a single unit to about $105–115 (still not $100, because of fixed costs):\n- drop the loudness contour (gate-only VCA, −$4);\n- wire solder-lug toggles instead of PCB toggles (−$3);\n- remove the speaker (−$2);\n- remove TRS MIDI (−$1.5).<\/p>\n<p>Not recommended: the second contour and the speaker are spirit and joy for $6.<\/p>\n<hr />\n<h2>2. Spec: \"$100\" tier<\/h2>\n<p><strong>Size<\/strong> ≈ 285 × 160 × 30 mm. Width matches the OP-1 class; depth is 1.6× the OP-1's.\n<strong>Weight<\/strong> ≈ 0.6–0.8 kg (ESTIMATE). <strong>Power<\/strong> 5 V USB, ≈ 0.75–1.5 W (ESTIMATE).<\/p>\n<h3>2.1 Voice (all analog, through-hole)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Block<\/th>\n<th>Circuit<\/th>\n<th>Controls<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Block\">VCO 1<\/td>\n<td data-label=\"Circuit\">Saw core: 2N3904 expo pair (matched and thermally glued), TL072 summer + integrator, 2N3906 reset; pulse from comparator thresholds<\/td>\n<td data-label=\"Controls\"><strong>WAVE<\/strong> 3-way toggle: saw / square / narrow pulse. <strong>OCTAVE<\/strong> pot (Pico-read, 5 detents in firmware)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">VCO 2<\/td>\n<td data-label=\"Circuit\">Same circuit<\/td>\n<td data-label=\"Controls\"><strong>WAVE<\/strong> toggle. <strong>FREQ<\/strong> pot (Pico-read: ±7 semitones plus fine; detune). <strong>LO<\/strong> toggle: keyboard off, sub-audio range, so it becomes a mod oscillator (Model D osc-3 behaviour)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Noise<\/td>\n<td data-label=\"Circuit\">Reverse-biased 2N3904 E-B junction off the +12 V pre-rail, TL072 gain stage, pink-ish filter<\/td>\n<td data-label=\"Controls\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Mixer<\/td>\n<td data-label=\"Circuit\"><strong>Passive<\/strong>: pot + resistor per channel into the ladder input pair (Model D topology, v1 §1.4)<\/td>\n<td data-label=\"Controls\"><strong>OSC 1<\/strong>, <strong>OSC 2<\/strong>, <strong>NOISE/EXT<\/strong> pots. <strong>SOURCE 3<\/strong> 3-way toggle: noise / ext in / <strong>feedback<\/strong> (output normalled back into the ext preamp)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Ext preamp<\/td>\n<td data-label=\"Circuit\">TL072, gain ≈ 100, into the mixer bus; overload LED<\/td>\n<td data-label=\"Controls\">(shares the NOISE/EXT pot)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Filter<\/td>\n<td data-label=\"Circuit\">4-pole <strong>2N3904 ladder<\/strong> (5 pairs, Vbe-matched from a bag of 100), film caps, TL072 differential output. Expo on a matched pair. CV sum = cutoff + keytrack + contour + mod + <strong>FILTER CV jack<\/strong><\/td>\n<td data-label=\"Controls\"><strong>CUTOFF<\/strong> (Pico-read, so MIDI CC). <strong>EMPHASIS<\/strong> (in circuit). <strong>CONTOUR AMT<\/strong> (in circuit). <strong>KEYTRACK<\/strong> toggle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Contours ×2<\/td>\n<td data-label=\"Circuit\">Model D ADS topology (cap, switch transistors, TL072), with the <strong>overshoot ratio kept<\/strong><\/td>\n<td data-label=\"Controls\">Filter <strong>A/D/S<\/strong>, Loudness <strong>A/D/S<\/strong> (A and D on 1 MΩ pots). <strong>DECAY<\/strong> toggle (release = decay, as original)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">VCA<\/td>\n<td data-label=\"Circuit\">Discrete 2N3904 differential pair (Model D style). Balance is auto-nulled at boot by a Pico PWM-CV (v1 §3.1 method)<\/td>\n<td data-label=\"Controls\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Mod<\/td>\n<td data-label=\"Circuit\">Source toggle: <strong>firmware LFO<\/strong> (Pico PWM, triangle, as analog CV) / <strong>VCO 2<\/strong>. Destination 3-way: pitch / off / filter<\/td>\n<td data-label=\"Controls\"><strong>MOD AMT<\/strong> (in circuit). <strong>LFO RATE<\/strong> (Pico-read)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Glide<\/td>\n<td data-label=\"Circuit\">Firmware, emulating the saturating S/H curve (v1 §1.8)<\/td>\n<td data-label=\"Controls\"><strong>GLIDE<\/strong> (Pico-read)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Block\">Output<\/td>\n<td data-label=\"Circuit\">LM386 → speaker. Phones jack switch mutes the speaker; phones/line from the same LM386 via a series R<\/td>\n<td data-label=\"Controls\"><strong>VOLUME<\/strong> (in circuit)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Controls: 18 pots<\/strong> (5 Pico-read: OCTAVE, OSC 2 FREQ, CUTOFF, LFO RATE, GLIDE; 13 in-circuit) and <strong>8 toggles<\/strong>.\nPlus a power switch and 3 LEDs (power, overload, \"knob not in control\" for the Pico-read pots; the owner was open to that light).<\/p>\n<p><strong>Jacks (7):<\/strong>\n- PHONES/LINE out\n- EXT audio in\n- FILTER CV in\n- PITCH CV out (1 V/oct, buffered MCP4822 channel)\n- GATE out\n- TRS MIDI in\n- USB (the Pico's own micro-USB) for power + USB-MIDI. That is micro-USB, not USB-C. A USB-C THT receptacle doesn't really exist. A USB-C breakout module would add ≈ $3 (ESTIMATE) and would split power from the MIDI port, so I left it out.<\/p>\n<h3>2.2 Digital (one ready-made module)<\/h3>\n<ul>\n<li><strong>Raspberry Pi Pico 2<\/strong>, socketed.<\/li>\n<li><strong>MCP4822<\/strong> (DIP-8, 12-bit dual, internal 2.048 V ref) for the VCO 1 and VCO 2 pitch CVs.<\/li>\n<li>Pico PWM, with 2-pole RC filters and TL072 buffers, for: cutoff CV, LFO CV, VCA balance. These aren't pitch-critical.<\/li>\n<li><strong>2× CD4067<\/strong> (DIP-24) read 25 key sensors plus the 5 Pico-read pots (32 channels, 2 spare) into 2 ADC pins.\n  The 3rd ADC pin watches the VCA output for the auto-null.<\/li>\n<li>GPIO budget [ENG]: SPI DAC 3, mux select 4, mux ADC 2 + 1, VCO count inputs 2, PWM 3, gate out 1, MIDI RX 1, LEDs 2, spare ≈ 4.<\/li>\n<\/ul>\n<h3>2.3 Keys<\/h3>\n<ul>\n<li>25 keys, 15 white at ≈ 18.7 mm pitch across 280 mm, so near full size.<\/li>\n<li><strong>3D-printed one-piece flexure key combs<\/strong> (PETG, makerspace). No springs, felt end-stops, ≈ 6 mm travel.<\/li>\n<li>A 5 × 2 mm magnet under each key. <strong>SS49E-class linear Hall sensors<\/strong> (TO-92S, through-hole) sit on <strong>3 identical 95 × 20 mm strips<\/strong>\n  (9 positions each, 8 used on two strips), and a 14-pin ribbon runs to the main board.<\/li>\n<li>Linear sensing gives <strong>velocity<\/strong> (time between two thresholds). Firmware learns each key's min/max as you play, so no per-key trimming.<\/li>\n<li>Honest feel: better than pads or tact switches and silent, but not a sprung keybed. This is the cheapest thing that passes \"instrument\".<\/li>\n<\/ul>\n<h3>2.4 Power<\/h3>\n<ul>\n<li>USB 5 V (power bank, phone charger or laptop) → LC filter.<\/li>\n<li><strong>MC34063 boost → +12 V<\/strong> and <strong>MC34063 inverter → −12 V<\/strong> (DIP-8, through-hole inductors and Schottkys).<\/li>\n<li>Then <strong>78L09 / 79L09 → ±9 V<\/strong> for the voice.<\/li>\n<li>The +12 V pre-rail also feeds the noise junction. LM386 and Pico run on the 5 V.<\/li>\n<li>Rail estimate ≈ 25–35 mA each (9× TL072 at ≈ 2.5 mA, plus ladder bias and discretes) [ENG].<\/li>\n<li>Switching ripple needs SPICE and layout care: keep the 34063s at the board edge away from the VCO cores, and post-LDO. <strong>Risk M.<\/strong><\/li>\n<\/ul>\n<h3>2.5 Boards and enclosure<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Board<\/th>\n<th>Size<\/th>\n<th>Contents<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Board\">A: VCOs + digital<\/td>\n<td data-label=\"Size\">≤ 100 × 100<\/td>\n<td data-label=\"Contents\">2 VCOs, Pico socket, MCP4822, muxes, MIDI, power<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Board\">B: mixer + filter<\/td>\n<td data-label=\"Size\">≤ 100 × 100<\/td>\n<td data-label=\"Contents\">mixer, ext preamp, noise, ladder, filter CV<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Board\">C: contours + VCA + out<\/td>\n<td data-label=\"Size\">≤ 100 × 100<\/td>\n<td data-label=\"Contents\">2 contours, VCA, LM386, jacks<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Board\">D: key strip ×3 (one design)<\/td>\n<td data-label=\"Size\">95 × 20<\/td>\n<td data-label=\"Contents\">9 Hall positions + header<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A, B and C sit side by side (≈ 290 mm) under a <strong>laser-cut 3 mm ply or acrylic top panel<\/strong>. Pots are soldered to the boards and poke through the panel; the owner can hand-paint or engrave the labels. There is a ply bottom, and the sides are printed or ply. All of it is made at Vector Space.<\/p>\n<hr />\n<h2>3. Bottom-up BOM (\"$100\" tier)<\/h2>\n<p>Prices as listed 2026-11-12 at quantity 1 unless noted.<\/p>\n<h3>3.1 Electronics<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Qty<\/th>\n<th>Unit<\/th>\n<th>Ext.<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">Raspberry Pi Pico 2<\/td>\n<td data-label=\"Qty\">1<\/td>\n<td data-label=\"Unit\">$5.75<\/td>\n<td data-label=\"Ext.\">$5.75<\/td>\n<td data-label=\"Source\"><a href=\"https://www.sparkfun.com/raspberry-pi-pico-2.html\" rel=\"noopener\" target=\"_blank\">SparkFun DEV-26124, in stock<\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">MCP4822-E/P 12-bit dual DAC, DIP-8<\/td>\n<td data-label=\"Qty\">1<\/td>\n<td data-label=\"Unit\">$3.99<\/td>\n<td data-label=\"Ext.\">$3.99<\/td>\n<td data-label=\"Source\"><a href=\"https://www.tme.com/us/en-us/details/mcp4822-e_p/d-a-converters-integrated-circuits/microchip-technology/\" rel=\"noopener\" target=\"_b ource\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Speaker, 3\" 8 Ω 1 W<\/td>\n<td data-label=\"Qty\">1<\/td>\n<td data-label=\"Unit\">$1.95<\/td>\n<td data-label=\"Ext.\">$1.95<\/td>\n<td data-label=\"Source\"><a href=\"https://www.adafruit.com/categories/271\" rel=\"noopener\" target=\"_blank\">Adafruit #1313<\/a> (thin 1.5\" #1891 $1.75 if depth is tight)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Panel subtotal<\/strong><\/td>\n<td data-label=\"Qty\"><\/td>\n<td data-label=\"Unit\"><\/td>\n<td data-label=\"Ext.\"><strong>≈ $26.8<\/strong><\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.3 Keys and mechanics<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Ext.<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">25× 5 × 2 mm N35 magnets<\/td>\n<td data-label=\"Ext.\">$8.00<\/td>\n<td data-label=\"Source\"><a href=\"https://themagnetbaron.com/products/10-3-16-x-1-16-disc-super-strong-rare-earth-magnets-neodymium-n35-nicuni\" rel=\"noopener\" target=\"_blank\">Magnet Baron $15.99/50<\/a> (sold out when checked; bulk Amazon packs likely cheaper, ESTIMATE)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">PETG for key combs + case sides (≈ 150 g)<\/td>\n<td data-label=\"Ext.\">$3.00<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Felt, rubber feet, M3 standoffs/screws<\/td>\n<td data-label=\"Ext.\">$5.00<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Laser-cut 3 mm ply/acrylic top + bottom (makerspace)<\/td>\n<td data-label=\"Ext.\">$10.00<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Mechanics subtotal<\/strong><\/td>\n<td data-label=\"Ext.\"><strong>≈ $26<\/strong><\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Parts total ≈ $87.6.<\/strong><\/p>\n<h3>3.4 Boards (JLCPCB)<\/h3>\n<ul>\n<li>JLC 2-layer ≤ 100 × 100 mm is <strong>$2 per 5 pcs<\/strong> (<a href=\"https://highway.hackclub.com/guides/JLC-cost-optimizing\" rel=\"noopener\" target=\"_blank\">Hack Club JLC guide<\/a>).\n  Boards over 100 mm in any dimension \"may get you out of the standard … pricing\" (<a href=\"https://pol1.lr.ggtyler.dev/r/synthdiy/comments/1hue1ge/jlcpcb_size_thresholds_for_pricing\" rel=\"noopener\" target=\"_blank\">r/synthdiy<\/a>).<\/li>\n<li>JLC's US DDP tariff is <strong>35 % minimum<\/strong> (Section 301 25 % + Section 122 10 %; total range 35–92.5 %)\n  (<a href=\"https://jlcpcb.com/help/article/us-tariff-policy-faq\" rel=\"noopener\" target=\"_blank\">JLC tariff FAQ<\/a>).<\/li>\n<li>I'm assuming the $2 tier applies to each of 4 designs; confirm with placeholder Gerbers.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>One-off order<\/th>\n<th>Per unit if 5 built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Item\">A, B, C ×5 each, $2 per design<\/td>\n<td data-label=\"One-off order\">$6.00<\/td>\n<td data-label=\"Per unit if 5 built\">(5 sets, so $1.20)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Key strip D: need 3 per unit, so order 5 (1 unit) or 15 (5 units)<\/td>\n<td data-label=\"One-off order\">$2.00<\/td>\n<td data-label=\"Per unit if 5 built\">≈ $1.00 (15 pcs ≈ $5, ESTIMATE)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">Shipping: economy line ≈ $8–12 (ESTIMATE); DHL ≈ $18 (<a href=\"https://pamfinds.pages.dev/guides/pcb-tariffs-us-makers-2026/\" rel=\"noopener\" target=\"_blank\">pamfinds<\/a>)<\/td>\n<td data-label=\"One-off order\">$10–18<\/td>\n<td data-label=\"Per unit if 5 built\">$2–4<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">LCSC parts merged into the same shipment (TL072, Hall, MC34063), extra weight<\/td>\n<td data-label=\"One-off order\">≈ $3<\/td>\n<td data-label=\"Per unit if 5 built\">≈ $1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\">35 % DDP on boards + LCSC goods (≈ $16 of goods)<\/td>\n<td data-label=\"One-off order\">≈ $6<\/td>\n<td data-label=\"Per unit if 5 built\">≈ $1.5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Item\"><strong>Boards total<\/strong><\/td>\n<td data-label=\"One-off order\"><strong>≈ $27–35<\/strong><\/td>\n<td data-label=\"Per unit if 5 built\"><strong>≈ $6–9<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.5 Shipping split (other vendors)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Vendor<\/th>\n<th>Goods<\/th>\n<th>Shipping<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Vendor\">Tayda (Thailand)<\/td>\n<td data-label=\"Goods\">≈ $45<\/td>\n<td data-label=\"Shipping\">$6–10 (users report $6 UPS Express on ~$100, often $0.99 promos on large orders)<\/td>\n<td data-label=\"Source\"><a href=\"https://forum.pedalpcb.com/goto/post?id=311248\" rel=\"noopener\" target=\"_blank\">PedalPCB forum, Dec 2024<\/a>; 2026 rates ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Vendor\">Import duty on the Tayda order<\/td>\n<td data-label=\"Goods\">—<\/td>\n<td data-label=\"Shipping\">≈ $4–5 (≈ 10 %, ESTIMATE; de minimis status and rate UNVERIFIED)<\/td>\n<td data-label=\"Source\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Vendor\">SparkFun or Adafruit (Pico, speaker)<\/td>\n<td data-label=\"Goods\">≈ $8<\/td>\n<td data-label=\"Shipping\">≈ $6–10<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Vendor\">TME (MCP4822), or move it to LCSC<\/td>\n<td data-label=\"Goods\">$4<\/td>\n<td data-label=\"Shipping\">$0–10<\/td>\n<td data-label=\"Source\">Move it to LCSC to save the shipment<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Vendor\">Magnets (Amazon)<\/td>\n<td data-label=\"Goods\">—<\/td>\n<td data-label=\"Shipping\">$0<\/td>\n<td data-label=\"Source\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Vendor\"><strong>Shipping + duty<\/strong><\/td>\n<td data-label=\"Goods\"><\/td>\n<td data-label=\"Shipping\"><strong>≈ $16–30<\/strong> one-off; ≈ $4–6/unit across 5<\/td>\n<td data-label=\"Source\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.6 Total<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>One-off<\/th>\n<th>Per unit, 5 built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Parts<\/td>\n<td data-label=\"One-off\">$88<\/td>\n<td data-label=\"Per unit, 5 built\">$85 (small bulk breaks)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Boards<\/td>\n<td data-label=\"One-off\">$27–35<\/td>\n<td data-label=\"Per unit, 5 built\">$6–9<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Shipping + duty<\/td>\n<td data-label=\"One-off\">$16–30<\/td>\n<td data-label=\"Per unit, 5 built\">$4–6<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Total<\/strong><\/td>\n<td data-label=\"One-off\"><strong>≈ $131–153<\/strong> (call it <strong>$125–150<\/strong>)<\/td>\n<td data-label=\"Per unit, 5 built\"><strong>≈ $95–100<\/strong> (call it <strong>$95–110<\/strong> with contingency)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Contingency: plan +10 % for wrong parts and a second Tayda order (common on a first build).<\/p>\n<hr />\n<h2>4. Calibration: \"no rigmarole\" still holds<\/h2>\n<ul>\n<li><strong>No trimmers anywhere.<\/strong><\/li>\n<li><strong>VCOs<\/strong>: each VCO's square goes through a 100 k + 1N4148 clamp into a Pico GPIO, and a PIO reciprocal counter measures it (v1 §3.1).\n  At power-on (≈ 2–3 s) the firmware steps the MCP4822 across the range and builds a per-VCO octave table. That absorbs:<\/li>\n<li>unmatched expo pairs;<\/li>\n<li>missing tempcos;<\/li>\n<li>op-amp offsets;<\/li>\n<li>DAC INL.<\/li>\n<\/ul>\n<p>Background re-tune trims offset during held notes, without locking the VCOs together.\n  Without tempcos, expect some wander in the first minute after a cold start, plus re-tunes on big temperature swings [ENG].\n- <strong>VCA thump<\/strong>: auto-nulled at boot by the PWM balance CV, watching the VCA output on the 3rd ADC.\n- <strong>Hall keys<\/strong>: self-learning min/max per key.\n- <strong>Transistor matching<\/strong>: the Pico doubles as a Vbe matching jig. Firmware mode plus a socket on board A: insert each 2N3904, and it reports bins. That is a one-time build step, not ongoing calibration.\n- <strong>Filter tracking<\/strong>: one optional gesture (EMPHASIS full, hold a button). The ladder output is already wired to a count input via the same divider trick.\n  Without it, keytrack is about right (fixed resistor, ±10 % [ENG]). This is the one place the $100 tier falls a little short of zero-rigmarole. It matches open question Q4 in v2.<\/p>\n<hr />\n<h2>5. Tiers: what each buys back<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>Adds (vs. the tier below)<\/th>\n<th>Delta<\/th>\n<th>Source / note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Tier\"><strong>$150<\/strong><\/td>\n<td data-label=\"Adds (vs. the tier below)\"><strong>Internal LiPo<\/strong>: 2000 mAh (<a href=\"https://adafruit.com/products/2011\" rel=\"noopener\" target=\"_blank\">Adafruit #2011, $12.50<\/a>) + USB-C charger (<a href=\"https://www.adafruit.com/products/4410\" rel=\"noopener\" target=\"_blank\">Adafruit #4410, $5.95<\/a>; load-sharing not stated, so diode power-path ESTIMATE) + 5 V boost (≈ $5, UNVERIFIED); or PowerBoost 1000C, load-sharing, $19.95 (v2 §1)<\/td>\n<td data-label=\"Delta\">+$23–32<\/td>\n<td data-label=\"Source / note\">Runtime at ≈ 1 W: ≈ 6 h [ENG]<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\"><strong>VCO 3<\/strong> (true 3-osc Model D stack; VCO 2/3 detune and osc-3-as-LFO at the same time) + 2nd MCP4822 (VCO 3 + clean filter CV)<\/td>\n<td data-label=\"Delta\">+$10<\/td>\n<td data-label=\"Source / note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\"><strong>Tempcos ×3<\/strong> (stable from cold)<\/td>\n<td data-label=\"Delta\">+$5–8<\/td>\n<td data-label=\"Source / note\">price UNVERIFIED (<a href=\"https://musicfromouterspace.com/analogsynth_new/ELECTRONIC_PARTS/MFTEMPCO3300.php\" rel=\"noopener\" target=\"_blank\">MFOS<\/a>)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\"><strong>Pitch + mod wheels<\/strong> (printed wheels on 9 mm pots)<\/td>\n<td data-label=\"Delta\">+$2–3<\/td>\n<td data-label=\"Source / note\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\">Extra shipping (Adafruit order)<\/td>\n<td data-label=\"Delta\">+$0–8<\/td>\n<td data-label=\"Source / note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><strong>$200<\/strong><\/td>\n<td data-label=\"Adds (vs. the tier below)\">Full waveform sets (tri / shark / saw / 3 pulses) on rotary switches; noise/osc-3 <strong>mod mix<\/strong> crossfade as original<\/td>\n<td data-label=\"Delta\">+$8–12<\/td>\n<td data-label=\"Source / note\">ESTIMATE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\">AS3046 expo arrays (as the full version) instead of hand-matched pairs<\/td>\n<td data-label=\"Delta\">+$9–15<\/td>\n<td data-label=\"Source / note\">price UNVERIFIED (v2 §3)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\">MCP4728 quad DAC (<a href=\"https://www.adafruit.com/product/4470\" rel=\"noopener\" target=\"_blank\">Adafruit #4470, $7.50<\/a>, v2 §1): MIDI-controllable sustain ×2 + loudness CV<\/td>\n<td data-label=\"Delta\">+$7.50<\/td>\n<td data-label=\"Source / note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\">PAM8302 class-D (<a href=\"https://adafruit.com/products/2130\" rel=\"noopener\" target=\"_blank\">$3.95<\/a>, v2 §1) + enclosed speaker (<a href=\"https://www.adafruit.com/categories/271\" rel=\"noopener\" target=\"_blank\">Adafruit #3351 $3.95<\/a>): louder<\/td>\n<td data-label=\"Delta\">+$8<\/td>\n<td data-label=\"Source / note\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Tier\"><\/td>\n<td data-label=\"Adds (vs. the tier below)\">More patch points (loudness CV in, osc mod in), A-440, a nicer panel (walnut or fiber-laser-marked aluminium at Vector Space)<\/td>\n<td data-label=\"Delta\">+$10–20<\/td>\n<td data-label=\"Source / note\">ESTIMATE<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Beyond $200 you are rebuilding the full version. Its extra $300–600 goes to:\n- 16-bit DACs;\n- proper ±10 V isolated rails;\n- full Model D control set (≈ 40 controls);\n- full eurorack I/O;\n- a larger battery;\n- a refined enclosure.<\/p>\n<hr />\n<h2>6. Risks specific to the budget variant<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>L<\/th>\n<th>Mitigation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Risk\">MC34063 switching noise (≈ 30–100 kHz) leaks into the VCOs/ladder<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">LC filter + 78L/79L post-regulation, edge placement, ground pour; footprint for a fallback isolated DC-DC (Mean Well DCWN03E-12, $10.93, v2 §1)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Power bank auto-off at low current<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">~150 mA draw is likely enough (ESTIMATE); otherwise a firmware \"keep-alive\" load pulse, or the $150 LiPo tier<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">JLC $2 tier may not apply to every design in one order<\/td>\n<td data-label=\"L\">L–M<\/td>\n<td data-label=\"Mitigation\">Quote placeholder Gerbers before layout. Worst case +$5–10<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">12-bit pitch stepping on slow glides<\/td>\n<td data-label=\"L\">L<\/td>\n<td data-label=\"Mitigation\">Dither + post-DAC RC; upgrade path is 2× MCP4822 coarse/fine<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Risk\">Printed flexure keys feel cheap or fatigue<\/td>\n<td data-label=\"L\">M<\/td>\n<td data-label=\"Mitigation\">Print test combs early (PETG vs. TPU hinge); keys are a separate strip, so you can swap the
