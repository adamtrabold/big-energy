<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Energy · project site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEBEB;--cell:#F3F3F3;--paper:#FBFBFB;--rule:#C6C6C6;--ink2:#5A5A5A;--ink:#1A1A1A;--on:#23863F;--m:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:24px}
.status,.stripline,.ev,.score,.tbl,.slip,.rows{font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
a.u,.ref{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.cap{font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.ink2{color:var(--ink2)}
.rule{border-top:1px solid var(--rule)}
/* lamp */
.lampline{display:flex;align-items:center;gap:10px;min-height:20px}
.lamp{width:10px;height:10px;border-radius:50%;flex:none;transition:background 1s,box-shadow .6s,border-color 1s}
.lamp.standby{border:1.2px solid var(--ink2);background:transparent}
.lamp.on{background:var(--on);border:0}
.lamp.dip{animation:dip .6s ease-in-out}
@keyframes dip{50%{opacity:.4;box-shadow:0 0 0 6px rgba(35,134,63,.18)}}
.lamp.snapshot{width:10px;height:1.5px;border-radius:0;background:var(--rule)}
.lampline.live .cap{color:var(--ink)}
/* header */
header.band{padding:18px var(--m) 12px}
.hgrid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.name{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.sub{font-size:13px;color:var(--ink2)}
.sub a{color:var(--ink);font-weight:500}
.waiting{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.waiting b{font-size:15px;font-weight:600}
.sig{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--on);margin-right:7px;vertical-align:2px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:4px}
.strip a{display:block;height:20px;position:relative}
.strip a i{position:absolute;left:0;right:0;top:6px;height:6px;background:var(--rule)}
.strip a.done i,.strip a.now i{background:var(--ink)}
.strip a.now::after{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--ink)}
.strip a.early i{background:transparent;border:1px solid var(--ink2)}
.strip a span{display:none}
.stripline{font-size:12.5px;color:var(--ink2)}.stripline b{color:var(--ink);font-weight:600}
nav.filters{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:10px 0;border-top:1px solid var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
@media(max-width:599px){nav.filters{flex-wrap:wrap;gap:4px 18px;white-space:normal}}
nav.filters a{font-size:15px;color:var(--ink2);padding-bottom:4px}
nav.filters a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
nav.filters .more{margin-left:auto;color:var(--ink);font-weight:600}
@media(min-width:1024px){
  :root{--m:48px}
  .hgrid{grid-template-columns:minmax(0,1fr) auto;align-items:end}
  .waiting{justify-self:end}
  .name{font-size:26px}
  .strip a span{display:block;position:absolute;top:22px;left:0;right:0;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip a.now span,.strip a.done span{color:var(--ink)}.strip a.now span{font-weight:600}
  .strip{margin-bottom:16px}
}
/* label + slips */
.label{border-top:1px solid var(--ink);padding-top:8px}
.lh{display:flex;align-items:baseline;gap:8px;font-size:15px}
.lh b{font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block;margin-left:auto;align-self:center;flex:none}
.lf{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.slip{border:1px solid var(--rule);padding:3px 8px;font-size:12px;color:var(--ink2);margin-bottom:3px;display:flex;gap:10px}
.slip b{font-weight:500;min-width:42px}
.slip.top{background:var(--paper);color:var(--ink);font-weight:500}.slip.top b{font-weight:700}
.slip.new{animation:land .4s ease-out}
@keyframes land{from{transform:translateY(-8px);opacity:0}}
.more{font-size:12px;color:var(--ink2);padding:2px 8px}
.link{font-size:12.5px;font-weight:500}
/* landing */
.feature{display:grid;gap:14px;padding:6px 0 18px}
.feature figure{margin:0}
.feature img{width:100%;height:auto;display:block;max-height:62vh;object-fit:contain;background:var(--paper)}
.feature img.in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.side{display:flex;flex-direction:column;gap:14px}
.side .kinds{order:2}.side .glab{order:1}
@media(min-width:1024px){.side .kinds{order:1}.side .glab{order:2}}
.oneline{font-size:15px}
.since{font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:block}
.tile .box{height:86px;background:var(--cell);overflow:hidden;position:relative}
.tile .box img{width:100%;height:100%;object-fit:cover;display:block}
.tile .doc{background:var(--paper);border:1px solid var(--rule);padding:7px 9px}
.tile .doc .c{font-size:11px;font-weight:700;color:var(--ink2)}
.tile .doc .t{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .k{font-size:11px;font-weight:600;margin-top:4px}
.wavemini{position:absolute;inset:8px 8px 20px 8px;display:flex;align-items:center;gap:1px}
.wavemini i{flex:1;background:var(--ink);min-height:1px}
.tile .w{position:absolute;left:8px;bottom:4px;font-size:10.5px;font-weight:700}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){
  .feature{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:stretch}
  .feature img{max-height:calc(100vh - 260px)}
  .side{justify-content:space-between}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
/* lists */
h2.sec{font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.entry .pic{aspect-ratio:16/10;background:var(--paper);overflow:hidden;display:flex;align-items:center;justify-content:center}
.entry .pic img{width:100%;height:100%;object-fit:contain}
.entry .pic.doc{display:block;border:1px solid var(--rule);padding:12px 14px}
.entry .pic.doc .t{font-weight:600;font-size:15px;line-height:1.3}
.entry .pic.doc p{font-size:13px;color:var(--ink2);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.entry .pic.test{background:var(--cell);position:relative;display:block}
.entry .label{margin-top:8px}
.dropped{opacity:.62}
.dropped:hover{opacity:.7}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1024px){.thumbs{grid-template-columns:repeat(5,1fr)}}
.thumbs a img{width:100%;aspect-ratio:1.414;object-fit:contain;background:var(--paper);display:block}
.thumbs a span{font-size:11.5px;font-weight:700;display:block;margin-top:4px}
.rows a,.rows div.r{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;align-items:baseline}
.rows .c{font-weight:600;min-width:74px}
.rows .x{margin-left:auto;font-size:12.5px;color:var(--ink2);text-align:right}
/* item */
.back{display:flex;justify-content:space-between;align-items:center;padding:14px var(--m) 10px;font-size:14px;color:var(--ink2)}
.back button{font-size:13px;color:var(--ink2)}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-bottom:30px}
@media(min-width:1024px){.item{grid-template-columns:minmax(0,1fr) 372px;gap:32px}.item .aside{align-self:end;position:sticky;bottom:72px}}
.viewer{background:var(--paper);overflow:auto;max-height:80vh;cursor:zoom-in;position:relative}
.viewer img{display:block;width:100%;height:auto}
.viewer.z{cursor:zoom-out}.viewer.z img{width:auto;max-width:none}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
.lineage{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:4px 2px}
.lineage a{flex:none;width:96px;font-size:11.5px}
.lineage a img{width:96px;height:68px;object-fit:cover;display:block;border:2px solid transparent}
.lineage a.on img{border-color:var(--ink)}
.lineage .gap{flex:none;width:58px;font-size:11.5px;color:var(--ink2);padding-top:30px;border-top:1px dashed var(--rule);margin-top:34px}
.btn{display:inline-block;border:1px solid var(--ink);padding:6px 12px;font-size:13px;font-weight:500}
/* compare */
.cmp{display:grid;gap:16px}
.cmp .pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cmp figure{margin:0;position:relative;background:var(--paper)}
.cmp figure img{display:block;width:100%;height:auto}
.cmp svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wipe{position:relative;touch-action:none;user-select:none;background:var(--paper)}
.wipe img{display:block;width:100%;height:auto;pointer-events:none}
.wipe .top{position:absolute;inset:0}
.wipe .bar{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink)}
.wipe .knob{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.toggle{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.sw{width:44px;height:22px;border:1px solid var(--ink);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw.on{background:var(--ink)}.sw.on i{left:25px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a,.chips button{border:1px solid var(--rule);padding:4px 10px;font-size:13px}
.chips .on{border-color:var(--ink);font-weight:600}
/* test */
.sound{background:var(--cell);padding:14px 16px;display:grid;grid-template-columns:48px 1fr;gap:6px 16px;align-items:center}
.play{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.play svg{width:16px;height:16px}
.wave{position:relative;height:90px;display:flex;align-items:center;gap:1px;cursor:pointer}
.wave i{flex:1;background:var(--ink);min-height:1px}
.wave .ph{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);left:0}
.sound .meta{grid-column:2;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.ab{grid-column:1/3;display:flex;gap:18px;font-size:14px;margin-top:4px}
.ab button{color:var(--ink2);padding-bottom:3px}
.ab button.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.result{font-size:15px}.result b{font-weight:700;margin-right:8px}
.plots img{width:100%;height:auto;display:block;background:#fff;margin-top:12px}
/* docs */
.doc-html{max-width:68ch;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.doc-html figure{margin:14px 0}.doc-html figure img{width:100%;height:auto;display:block;background:var(--paper)}
.doc-html figcaption{font-size:12px;font-weight:500;color:var(--ink2);margin-top:6px;line-height:1.4}
.gdoc{max-width:none}
.gcols{display:grid;grid-template-columns:minmax(0,1fr) 372px;column-gap:32px;align-items:start}
.gcols .figs figure{margin:0 0 22px}.gcols .text{position:sticky;top:60px;max-height:calc(100vh - 120px);overflow:auto}
.doc-html h1{font-size:22px;line-height:1.25;font-weight:600}
.doc-html h2{font-size:17px;font-weight:600;margin:26px 0 8px}
.doc-html h3{font-size:15px;font-weight:600}
.doc-html code{font-size:13px;background:var(--cell);padding:0 3px}
.doc-html pre{overflow:auto;background:var(--cell);padding:10px}
.tbl{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
details.jump{margin:6px 0 16px;font-size:13px}
details.jump summary{cursor:pointer;color:var(--ink2)}
details.jump a{display:block;padding:3px 0}
/* group page */
.gtop{display:grid;gap:14px;padding:4px 0 10px}
@media(min-width:1024px){.gtop{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:end}}
.gsec{display:grid;gap:12px;padding:18px 0;border-top:1px solid var(--rule)}
.gsec figure{margin:0}.gsec figure img{width:100%;height:auto;display:block;background:var(--paper)}
.gsec figcaption{font-size:11.5px;font-weight:500;color:var(--ink2);margin-top:6px}
@media(min-width:1024px){.gsec{grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:start}.gsec .txt{order:2}.gsec figure{order:1}}
.note{font-size:12px;color:var(--ink2);border-left:2px solid var(--rule);padding:2px 10px;margin:10px 0}
/* decisions + history */
.dec{border-top:1px solid var(--rule);padding:12px 0}
.dec .ask{font-size:12.5px;color:var(--ink2)}
.dec .w{font-size:15px;color:var(--ink)}
.dec.open .w{font-size:17px;font-weight:600;color:var(--ink)}
.dec .cz{font-size:12.5px;color:var(--ink2);margin-top:4px}
.dec .cz a{color:var(--ink);font-weight:600}
.dec .rowsc{margin-top:8px}
.dec .rowsc a{display:flex;gap:10px;padding:6px 0;font-size:14px}
.dec .rowsc a span:first-child{color:var(--ink2);min-width:44px}
.dec .rowsc a b{min-width:52px}
.dec .rowsc a u{text-underline-offset:3px}
.grain{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:14px;margin:6px 0 10px}
.grain a{color:var(--ink2);padding-bottom:3px;white-space:nowrap}.grain a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.ev .t{color:var(--ink2);font-size:12.5px}
.lock{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:3px 0;margin:6px 0}
.lockrule{height:8px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin:10px 0 14px}
.score{display:flex;gap:10px;font-size:14px;padding:4px 0;border-top:1px solid var(--rule)}
.score b{min-width:28px}
.vtitle{font-size:28px;font-weight:700}
.wide{max-width:900px}
.wrap.wide{margin-left:max(0px,calc((100% - 1440px)/2));margin-right:auto}
/* prototype bar */
.proto{position:fixed;left:0;right:0;bottom:0;background:#D6D6D6;border-top:1px solid var(--rule);font-size:12px;z-index:20}
.proto .in{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:7px var(--m);max-width:1440px;margin:0 auto}
.proto b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;color:var(--ink2)}
.proto button{text-decoration:underline;text-underline-offset:3px;font-size:12px}
.proto button.on{font-weight:700}
.ptog{display:none;text-decoration:none!important}
@media(max-width:899px){.ptog{display:inline}.plab{display:none}.proto:not(.open) .in>*:not(.ptog){display:none}.proto .in{gap:6px 14px}}
/* physical: case index + gallery */
.cases{display:grid;grid-template-columns:minmax(0,1fr);gap:26px 22px}
@media(min-width:700px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}.cases.big{grid-template-columns:minmax(0,1fr)}}
.case{display:block}.case .cimg{background:var(--paper);aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cases.big .case .cimg{aspect-ratio:auto;max-height:70vh}.cases.big .case img{max-height:70vh;width:auto;max-width:100%}
.case img{width:100%;height:100%;object-fit:contain;display:block}
.cmeta{display:flex;gap:10px;align-items:baseline;margin-top:8px;font-size:17px}.cmeta b{font-weight:700}
.cst{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--rule);padding:1px 6px;vertical-align:middle}
.cline{font-size:14px;margin:2px 0}
.case.gone .cimg{opacity:.55}
.gallery{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin:10px 0 8px}
@media(min-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery figure:first-child{grid-column:1/3}}
.gallery figure{margin:0}.gallery img{width:100%;height:auto;display:block;background:var(--paper)}
.gallery figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px}
.gdocd{border-top:1px solid var(--rule);padding:10px 0}.gdocd summary{cursor:pointer;font-weight:600}
.nofig figure{display:none}
/* page point, waiting list, about */
.sub a,.back a,.back button,[data-copy],.link a,.dec .cz a,h2.sec a{display:inline-block;padding-top:5px;padding-bottom:5px;margin-top:-5px;margin-bottom:-5px}
.purpose{font-size:15px;margin:14px 0 16px;max-width:70ch}
.wlist{margin:0 0 10px;padding-left:22px}.wlist li{padding:6px 0;border-top:1px solid var(--rule)}
.wsec{border-top:1.5px solid var(--ink);padding-top:10px;margin-top:26px}.wsec h2{font-size:19px;font-weight:600;margin:0 0 6px}
.about{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}.about b{color:var(--ink);font-weight:600}
/* status line */
.status{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(72ch,100%)}
.status b{color:var(--ink);font-weight:600}
/* docs + reviews */
.cards{display:grid;gap:14px;margin:6px 0 4px}
@media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
.card{display:block;background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.card .k{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.card .t{font-size:17px;font-weight:600;margin:4px 0 2px}
.card p{margin:0;font-size:13.5px;color:var(--ink2)}
.st{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:0 6px;line-height:18px;border:1px solid var(--ink);white-space:nowrap}
.st-decided{background:var(--ink);color:#fff}
.st-proposed{background:transparent;color:var(--ink)}
.st-open{border-style:dashed;color:var(--ink2);border-color:var(--ink2)}
.counts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}
.drow .t{font-weight:600;font-size:15px}.drow .c{font-size:13px;color:var(--ink2)}
.drow.stub .t{color:var(--ink2);font-weight:500}
@media(min-width:900px){.drow{grid-template-columns:240px minmax(0,1fr) 260px;align-items:baseline}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0 14px;align-items:center}
.doc-html pre{font-size:12.5px;line-height:1.35;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prehint{font-size:11.5px;color:var(--ink2);margin:-6px 0 12px}
.mmd{overflow-x:auto;background:#fff;padding:10px;margin:10px 0}.mmd svg{max-width:none;height:auto}
@media(max-width:599px){
 .doc-html .tbl{border-top:0;overflow:visible}
 .doc-html table,.doc-html tbody,.doc-html tr,.doc-html td{display:block;width:100%}
 .doc-html thead{display:none}
 .doc-html tr{border-top:1px solid var(--ink);padding:6px 0 8px}
 .doc-html td{border:0;padding:3px 0 3px 106px;position:relative}
 .doc-html td::before{content:attr(data-label);position:absolute;left:0;width:96px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
 .doc-html td[data-label=""]{padding-left:0}.doc-html td[data-label=""]::before{display:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const I = D.items, G = {}; D.groups.forEach(g => G[g.code] = g);
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ------- state */
const S = {lamp:"standby", signedOut:false, sim:null, justNow:false, dip:false};
// "since you last looked": entries carry a seq (higher = newer). First visit: no marks.
const ENTRIES = [ // newest first: groups and loose items (a group appears once)
  "g:CHAMBER","i:P-001","g:RAIN","g:BUTTERFLY","g:DIPTYCH","i:T-004","i:T-005","i:T-003","i:T-001","i:T-002","i:T-006","i:T-007",
  "i:D-034","i:D-032","i:D-031","i:D-019","g:FOLD","g:HUSH","g:ONESHEET","i:D-003","g:FOLD113","g:TYPECASE","g:HYMNAL","g:UNDERGLASS"];
const SEQ = {}; ENTRIES.forEach((e,i) => SEQ[e] = ENTRIES.length - i);
const MAXSEQ = ENTRIES.length;
let lastSeen = parseInt(store.get("herb-lastSeen") || "", 10);
const firstVisit = isNaN(lastSeen);
if (firstVisit) { lastSeen = MAXSEQ; }
window.addEventListener("pagehide", () => store.set("herb-lastSeen", String(MAXSEQ)));
if (firstVisit) store.set("herb-lastSeen", String(MAXSEQ));
const unseen = e => SEQ[e] > lastSeen;
const unseenCount = () => ENTRIES.filter(e => visible(e) && unseen(e)).length;
const visible = e => !(S.sim === "before" && e === "g:CHAMBER");

/* ------- small builders */
const statusLine = it => [it.sub === "doc" ? "doc" : it.sub, (it.stage + (it.early ? " (early)" : "")), it.status].join(" · ");
function slips(revs, max, justNow){
  let h = "";
  revs.slice(0, max).forEach((r,i) => {
    const line = (i === 0 && justNow) ? "just now · " + r.line : r.line;
    h += `<div class="slip${i===0?" top":""}${i===0&&justNow?" new":""}"><b>rev ${esc(r.rev)}</b><span>${esc(line)}</span></div>`;
  });
  if (revs.length > max) h += `<div class="more">+ ${revs.slice(max).map(r=>"rev "+r.rev).join(", ")}</div>`;
  return h;
}
function label(o){ // {code,title,fields,revs,max,dot,justNow,extra}
  return `<div class="label"><div class="lh"><b>${esc(o.code)}</b><span>${esc(o.title||"")}</span>${o.dot?'<i class="dot" title="new since you last looked"></i>':""}</div>
  <div class="lf">${esc(o.fields)}</div>${slips(o.revs||[], o.max||2, o.justNow)}${o.extra||""}</div>`;
}
function glabel(g, opts){
  opts = opts || {};
  const seed = g.seed ? `<div class="link" style="margin-top:6px"><a class="u" href="#g-${g.seed}">grew from ${esc(G[g.seed].title)} · v1.1 (legacy sheets)</a></div>` : "";
  const n = g.images.length, nd = g.docs.length;
  return label({code:g.title, title:"rev " + g.rev, fields:`concept group · ${n} image${n==1?"":"s"} · ${nd} doc${nd==1?"":"s"} · ${g.stage} · ${g.status}`,
    revs:g.revs, max:opts.max||2, dot:opts.dot, justNow:opts.justNow, extra:seed});
}
const img = (m, cls, alt) => `<img ${cls?`class="${cls}"`:""} src="${m.thumb && cls==="th" ? m.thumb : m.src}" width="${m.w}" height="${m.h}" alt="${esc(alt||"")}" loading="lazy">`;
function waveBars(peaks, n){
  const step = peaks.length / n; let h = "";
  for (let i=0;i<n;i++){ const p = peaks[Math.floor(i*step)]; h += `<i style="height:${Math.max(1,p*100).toFixed(1)}%"></i>`; }
  return h;
}
function updatedLine(){
  const u = D.updated || {};
  return `<div class="status" title="${esc(u.what)}">Updated <b>${esc(u.when)}</b> · ${esc(u.what)}</div>`;
}
const SECTIONS = [ // build-chain order; the site's whole structure
  ["decide","#home","To decide"],["architecture","#doc-architecture","Architecture"],["features","#features","Features"],
  ["physical","#physical","Physical"],["electronics","#electronics","Electronics"],["parts","#parts","Parts"],["tests","#tests","Tests"],["history","#history","History"]];
function header(sel){
  const n = (D.waiting && D.waiting.items.length) || 0;
  return `<header class="band wrap"><div class="hgrid">
    <div><div class="name">${esc(D.project.name)}</div>
      <div class="sub">${esc(D.project.line)} · <a class="u" href="#version-v1-1">v1.1 locked</a></div></div>
  </div></header>
  <div class="wrap"><nav class="filters">${SECTIONS.map(([k,h,t])=>`<a href="${h}" class="${k===sel?"on":""}">${k==="decide"&&n?'<i class="sig" aria-hidden="true"></i>':""}${t}${k==="decide"&&n?" ("+n+")":""}</a>`).join("")}</nav></div>`;
}
function point(t){ return `<p class="purpose">${esc(t)}</p>`; }
function about(){
  return `<footer class="wrap about"><div class="cap">Where things live</div><p>
    <b>To decide</b> ← design/decisions-open.md · <b>Architecture</b> ← docs/architecture.md · <b>Features</b> ← docs/features/ ·
    <b>Physical</b> ← design/branches/concepts/ (now), design/concepts/, versions/, archive/; 3D models later in design/models/ ·
    <b>Electronics</b> ← eng/, eng/sim/; boards and schematics later in eng/boards/ · <b>Parts</b> ← eng/cost-estimate.md, eng/key-sourcing.md; the BOM later in eng/bom/ ·
    <b>Tests</b> ← owner checks in the CATHEDRAL doc; bench results later in eng/tests/, print checks in design/prints/ ·
    <b>History</b> ← design/owner.md, VERSIONS.md, design/scores.md, design/reviews/.
    Markdown is the source; site/publish.sh rebuilds this site from the repo.</p></footer>`;
}
function notYet(what, when, where){ return `<div class="drow stub"><span class="t">${esc(what)}</span><span class="c">Not yet: arrives ${esc(when)}.</span></div>`; }
function docRow(code, note){ const it = I[code]; if (!it) return ""; return `<a class="drow" href="#i-${code}"><span class="t">${esc(it.title)}</span><span class="c">${esc(note || it.lead || "")}</span></a>`; }
function groupRow(gc, note){ const g = G[gc]; if (!g) return ""; const m = g.lead && I[g.lead];
  return `<a class="drow${g.status==="dropped"?" dropped":""}" href="#g-${gc}"><span class="t">${esc(g.title)} <span class="ink2" style="font-weight:400">rev ${esc(g.rev)}</span></span><span class="c">${esc(note || g.line)}</span><span class="ink2" style="font-size:13px">${esc(g.status)}${m?" · "+g.images.length+" images":""}</span></a>`; }
function vWaiting(){
  const W = D.waiting || {items:[]};
  return header("decide") + `<main class="wrap wide">${updatedLine()}${point("Decisions only you can make. Each says what it unblocks, the options, and what the team recommends. Answer in chat; the team records it and removes it here.")}
    ${W.items.length ? `<ol class="wlist">${W.items.map(it=>`<li><a href="#wait-${it.n}"><b>${esc(it.title)}</b>${it.unblocks?`<span class="ink2"> · unblocks ${esc(it.unblocks)}</span>`:""}</a></li>`).join("")}</ol>` : "<p>Nothing is waiting on you.</p>"}
    ${W.items.map(it=>`<section class="wsec" id="wait-${it.n}"><h2>${esc(it.n)}. ${esc(it.title)}</h2><div class="doc-html">${it.html}</div></section>`).join("")}
  </main>${about()}`;
}
function vFeatures(){
  const feats = D.docs.filter(d => d.slug !== "architecture");
  const row = d => `<a class="drow${d.stub?" stub":""}" href="#doc-${d.slug}"><span class="t">${esc(d.title)}</span><span class="c">${esc(d.covers)}</span><span>${d.stub ? '<span class="ink2" style="font-size:13px">not yet written</span>' : counts(d.counts)}</span></a>`;
  return header("features") + `<main class="wrap wide" style="max-width:1100px">${point("How the instrument works, one feature set per page, with what's decided and what's still open.")}
    <div class="ink2" style="font-size:13px">${feats.filter(d=>!d.stub).length} of ${feats.length} written</div>${LEGEND}
    ${feats.filter(d=>!d.stub).map(row).join("")}${feats.filter(d=>d.stub).map(row).join("")}</main>${about()}`;
}
function caseCard(gc){
  const g = G[gc]; if (!g || !g.lead) return "";
  const m = I[g.lead];
  return `<a class="case${g.status==="dropped"?" gone":""}" href="#g-${gc}">
    <div class="cimg"><img src="${m.src}" width="${m.w}" height="${m.h}" alt="${esc(g.title)}" loading="lazy"></div>
    <div class="cmeta"><b>${esc(g.title)}</b><span class="cst">${esc(g.statusLabel || g.status)}</span></div>
    <div class="cline">${esc(g.line)}</div><div class="ink2" style="font-size:12.5px">${g.images.length} image${g.images.length==1?"":"s"}${g.docs.length?" · "+g.docs.length+" doc"+(g.docs.length>1?"s":""):""}</div></a>`;
}
function vPhysical(){
  const sec = (t, list, big) => `<h2 class="sec">${t}</h2><div class="cases${big?" big":""}">${list.map(caseCard).join("")}</div>`;
  return header("physical") + `<main class="wrap">${point("Every case version, with pictures. Tap one to see all its images large, then its docs.")}
    ${sec("Current", ["CATHEDRAL"], true)}
    ${sec("Branches it grew from", ["CHAMBER","RAIN"])}
    ${sec("Locked in v1.1", ["FOLD","ONESHEET","HUSH"])}
    ${sec("Dropped branches", ["BUTTERFLY","DIPTYCH"])}
    ${sec("Earlier concepts", ["FOLD113","TYPECASE","HYMNAL","UNDERGLASS"])}
    ${sec("Full instrument (paused)", ["FULLCASE","FULLDOCK","FULLDISH","FULLMOTTO","FULLSLAB"])}
    <h2 class="sec">Not yet</h2>${notYet("Physical architecture diagrams","at Handoff, once CATHEDRAL is chosen","docs/physical/ (markdown + images)")}${notYet("3D models (STL / STEP) and print files","at the Prints stage","design/models/")}
  </main>${about()}`;
}
function vElectronics(){
  const eng = D.order.filter(c => I[c].path && I[c].path.startsWith("eng/") && I[c].kind !== "test" && !["E-cost-estimate","E-key-sourcing"].includes(c));
  const tests = D.order.filter(c => I[c].kind === "test");
  return header("electronics") + `<main class="wrap wide" style="max-width:1100px">${point("The electronics: the spec, the engineering notes behind it, and the circuit simulations with their plots and sounds.")}
    <h2 class="sec">Boards and schematics</h2>${notYet("Board layouts and schematics","after Handoff (layout starts after the breadboard spike)","eng/boards/ (KiCad files + exported PDFs and PNGs)")}
    <h2 class="sec">Simulations</h2>${tests.map(c=>`<a class="drow" href="#i-${c}"><span class="t">${esc(c)} · ${esc(I[c].title)}</span><span class="c">${esc(I[c].line)}</span><span><b>${esc(I[c].result)}</b>${I[c].audio?' <span class="ink2" style="font-size:13px">· has sound</span>':""}</span></a>`).join("")}
    <h2 class="sec">Spec and engineering notes</h2>${eng.map(c=>docRow(c)).join("")}
  </main>${about()}`;
}
function vParts(){
  return header("parts") + `<main class="wrap wide" style="max-width:1100px">${point("What it's made of: the parts list with links and prices, and the cost so far.")}
    <h2 class="sec">Parts list (BOM)</h2>${notYet("Bill of materials with links and prices","at the BOM stage, after Handoff","eng/bom/ (bom.csv + bom.md)")}
    <h2 class="sec">Cost and sourcing so far</h2>${docRow("E-cost-estimate")}${docRow("E-key-sourcing")}
  </main>${about()}`;
}
function vTests(){
  return header("tests") + `<main class="wrap wide" style="max-width:1100px">${point("Checks on real parts: things for you to buy and try, breadboard results and test prints.")}
    <h2 class="sec">For you to buy and test</h2>${D.ownertests ? `<div class="doc-html" style="max-width:none">${D.ownertests}</div><p class="hint">From the <a class="u" href="#i-D-110">CATHEDRAL how-it-works doc</a>.</p>` : "<p class='ink2'>Nothing right now.</p>"}
    <h2 class="sec">Breadboard</h2>${notYet("Breadboard results (photos, scope plots, recordings)","at the Breadboard stage: the Daisy spike comes first","eng/tests/")}
    <h2 class="sec">Prints</h2>${notYet("Test prints and fit checks","at the Prints stage","design/prints/")}
    <p class="hint" style="margin-top:16px">Circuit simulations are under <a class="u" href="#electronics">Electronics</a>.</p>
  </main>${about()}`;
}
function vHistoryHub(tab){
  const tabs = [["decisions","Decisions"],["versions","Versions"],["reviews","Reviews"],["day","By day"],["round","By round"]];
  const nav = `<div class="grain">${tabs.map(([k,t])=>`<a class="${k===tab?"on":""}" href="#history-${k}">${t}</a>`).join("")}</div>`;
  let body = "";
  if (tab === "decisions") body = decisionsBody();
  else if (tab === "versions") body = D.versions.map(v => `<div class="lockrule"></div><div class="lh"><a href="#version-${v.code}"><b style="font-size:20px">${v.name}</b></a><span class="ink2">${v.date}${v.current?" · current":""}</span></div><p>${esc(v.line)} <a class="u" href="#version-${v.code}">What's in it ›</a></p>`).join("");
  else if (tab === "reviews") body = D.reviews.map(r=>`<a class="drow" href="#review-${r.slug}"><span class="t">${esc(r.title)}</span><span class="c">${esc(r.lead)}</span><span class="ink2" style="font-size:13px">${esc(r.date)}${r.score?" · "+esc(r.score):""}</span></a>`).join("") || "<p class='ink2'>No reviews yet.</p>";
  else body = historyBody(tab);
  const P_ = {decisions:"Everything you've decided, in your words, and what it changed.", versions:"Locked sets of the design. A version never changes.", reviews:"Independent reviews of the design and what they found. Reviewers decide nothing.", day:"What happened, day by day.", round:"Each design round and how the concepts scored."};
  return header("history") + `<main class="wrap wide">${point("What happened and why: your decisions, the locked versions and the reviews.")}${nav}<p class="ink2" style="margin:0 0 10px">${esc(P_[tab])}</p>${body}</main>${about()}`;
}
function entry(e){
  const [t, code] = e.split(":");
  const dot = unseen(e);
  if (t === "g"){
    const g = G[code], m = I[g.lead];
    return `<a class="entry${g.status==="dropped"?" dropped":""}" href="#g-${code}"><div class="pic">${img(m,"th",g.title)}</div>${glabel(g,{max:1,dot})}</a>`;
  }
  const it = I[code];
  let pic;
  if (it.kind === "test") pic = `<div class="pic test"><div class="wavemini">${it.audio ? waveBars(it.audio[Object.keys(it.audio)[0]].peaks, 60) : ""}</div>${it.audio?"":`<img src="${it.plots[0].thumb}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff">`}<span class="w" style="position:absolute;left:10px;bottom:6px;font-size:11px;font-weight:700">${esc(it.result)}</span></div>`;
  else if (it.kind === "prototype") pic = `<div class="pic doc"><div class="t">${esc(it.title)}</div><p>${esc(it.lead)}</p></div>`;
  else pic = `<div class="pic doc"><div class="t">${esc(it.title)}</div><p>${esc(it.lead)}</p></div>`;
  return `<a class="entry${it.status==="dropped"?" dropped":""}" href="#i-${code}">${pic}${label({code, title:"", fields:statusLine(it), revs:it.revs, max:1, dot})}</a>`;
}

/* ------- views */
function vHome(){
  const newest = S.sim === "before" ? G.RAIN : G.CHAMBER;
  const lead = I[newest.lead];
  const justNow = S.justNow && newest.code === "CHAMBER";
  const dot = unseen("g:" + newest.code) || justNow;
  const n = unseenCount();
  const since = n ? `+ ${n} new since you last looked ›` : `Everything, newest first ›`;
  const tile = (href, box, k) => `<a class="tile" href="${href}"><div class="box">${box}</div><div class="k">${k}</div></a>`;
  const T4 = I["T-004"], D32 = I["D-032"], P1 = I["P-001"], rainLead = I[G.RAIN.lead];
  const tiles = [
    tile("#i-" + rainLead.code, img(rainLead,"th","RAIN"), "image · " + esc(rainLead.code)),
    tile("#i-D-032", `<div class="doc" style="height:100%"><div class="c">D-032</div><div class="t">${esc(D32.title)}</div></div>`, "doc · 13 Nov"),
    tile("#i-T-004", `<div class="wavemini">${waveBars(T4.audio.golden.peaks, 40)}</div><span class="w">${esc(T4.result)}</span>`, "test · T-004 " + esc(T4.title)),
    tile("#i-P-001", `<div class="doc" style="height:100%"><div class="c">P-001</div><div class="t">${esc(P1.title)}</div></div>`, "prototype · this page"),
  ].join("");
  return header("latest") + `<main class="wrap">
    <section class="feature">
      <a href="#g-${newest.code}"><figure><img class="in" src="${lead.src}" width="${lead.w}" height="${lead.h}" alt="${esc(newest.title)} · ${esc(lead.title)}"></figure></a>
      <div class="side">
        <div class="kinds"><div class="cap" style="margin-bottom:8px">Newest of each kind</div><div class="tiles">${tiles}</div></div>
        <div class="glab">${glabel(newest,{max:2,dot,justNow})}
          <div class="oneline" style="margin-top:10px">${esc(newest.line)}</div>
          <div class="since" style="margin-top:12px"><a href="#f-all">${since}</a></div></div>
      </div>
    </section>
    ${docCards()}
    <h2 class="sec">Everything, newest first</h2>
    <div class="grid">${ENTRIES.filter(visible).filter(e => e !== "g:" + newest.code).map(entry).join("")}</div>
  </main>`;
}
function docCards(){
  const ds = D.docs, written = ds.filter(d => !d.stub).length, feats = ds.filter(d => d.slug !== "architecture");
  const r = D.reviews[0];
  return `<div class="cards">
    <a class="card" href="#docs"><div class="k">Docs</div><div class="t">Architecture and ${feats.length} feature sets</div><p>${written} of ${ds.length} written · each item marked decided, proposed or open</p></a>
    ${r ? `<a class="card" href="#reviews"><div class="k">Reviews</div><div class="t">${esc(r.title.split(" — ")[0])}</div><p>${esc(r.date)}${r.score ? " · " + esc(r.score) : ""} · ${D.reviews.length} review${D.reviews.length>1?"s":""}</p></a>` : ""}
  </div>`;
}
function counts(c){
  return `<span class="counts">${c.decided?`<span class="st st-decided">decided ${c.decided}</span>`:""}${c.proposed?`<span class="st st-proposed">proposed ${c.proposed}</span>`:""}${c.open?`<span class="st st-open">open ${c.open}</span>`:""}</span>`;
}
const LEGEND = `<div class="legend"><span><span class="st st-decided">decided</span> recorded in the owner record</span><span><span class="st st-proposed">proposed</span> the team's, waiting on you</span><span><span class="st st-open">open</span> unknown or unchosen</span></div>`;
function vDocs(){
  const arch = D.docs.find(d => d.slug === "architecture"), feats = D.docs.filter(d => d.slug !== "architecture");
  const row = d => `<a class="drow${d.stub?" stub":""}" href="#doc-${d.slug}"><span class="t">${esc(d.title)}</span><span class="c">${esc(d.covers)}</span><span>${d.stub ? '<span class="ink2" style="font-size:13px">not yet written</span>' : counts(d.counts)}</span></a>`;
  return header("docs") + `<main class="wrap wide" style="max-width:1100px">
    <div class="lh" style="margin:12px 0 4px"><b style="font-size:24px;font-weight:600">Docs</b><span class="ink2" style="margin-left:auto;font-size:13px">${D.docs.filter(d=>!d.stub).length} of ${D.docs.length} written</span></div>
    <div class="doc-html">${D.docsIndex.intro}</div>${LEGEND}
    <h2 class="sec">The whole device</h2>${row(arch)}
    <h2 class="sec">Feature sets</h2>${feats.filter(d=>!d.stub).map(row).join("")}${feats.filter(d=>d.stub).map(row).join("")}
    ${D.docsIndex.template ? `<details class="jump" style="margin-top:20px"><summary>How every feature doc is laid out</summary><div class="doc-html">${D.docsIndex.template}</div></details>` : ""}
  </main>`;
}
function jumpList(j){ return (j && j.length > 3) ? `<details class="jump"><summary>Contents (${j.length})</summary>${j.map(h=>`<a href="#" data-h="${esc(h)}">${esc(h)}</a>`).join("")}</details>` : ""; }
function vDocPage(slug){
  const d = D.docs.find(x => x.slug === slug); if (!d) return vMissing(slug);
  const i = D.docs.indexOf(d), prev = D.docs[i-1], next = D.docs[i+1];
  const arch = d.slug === "architecture";
  return header(arch ? "architecture" : "features") + `<div class="wrap">${point(arch ? "How the whole instrument fits together: signal paths, control and data, power, budgets, and what's decided or still open." : "One feature set: what it does, your decisions, how it works, and what's still open.")}</div><div class="back wrap">${arch?"<span></span>":'<a href="#features">‹ Features</a>'}<button data-copy="1">copy link</button></div><main class="wrap item">
    <article class="doc-html" id="doc">${d.stub?`<p><b>Not written yet.</b>${d.covers?` It will cover ${esc(d.covers)}.`:""}</p>`:jumpList(d.jump)+d.html}
      <div class="chips" style="margin-top:28px">${prev?`<a href="#doc-${prev.slug}">‹ ${esc(prev.title)}</a>`:""}${next?`<a href="#doc-${next.slug}">${esc(next.title)} ›</a>`:""}</div></article>
    <div class="aside"><div class="label"><div class="lh"><b>${esc(d.title)}</b></div><div class="lf">doc · ${esc(d.written)}</div>${d.stub?"":counts(d.counts)}</div>${d.stub?"":LEGEND}</div></main>`;
}
function vReviews(){
  return header("reviews") + `<main class="wrap wide"><div class="lh" style="margin:12px 0 10px"><b style="font-size:24px;font-weight:600">Reviews</b><span class="ink2" style="margin-left:auto;font-size:13px">independent critics · they decide nothing</span></div>

function vCompare(code, a, b){

function scallop(x, y, w, h){
  const b = 9; let d = `M${x.toFixed(1)},${y.toFixed(1)}`;
  const edge = (x0,y0,x1,y1) => { const L = Math.hypot(x1-x0,y1-y0), n = Math.max(1, Math.round(L/(b*2))); for (let i=1;i<=n;i++){ d += ` A${b},${b} 0 0 1 ${(x0+(x1-x0)*i/n).toFixed(1)},${(y0+(y1-y0)*i/n).toFixed(1)}`; } };
  edge(x,y,x+w,y); edge(x+w,y,x+w,y+h); edge(x+w,y+h,x,y+h); edge(x,y+h,x,y);
  return `<path d="${d}" fill="none" stroke="#1A1A1A" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`;
}

/* ------- router */
let audio = null, raf = 0;
function route(){
  const h = (location.hash || "#home").slice(1);
  let html, m;
  if (h === "" || h === "home") html = vWaiting();
  else if ((m = h.match(/^wait-(\d+)$/))) { html = vWaiting(); setTimeout(() => { const e = document.getElementById("wait-" + m[1]); if (e) e.scrollIntoView(); }, 30); }
  else if (h === "features" || h === "docs") html = vFeatures();
  else if (h === "physical") html = vPhysical();
  else if (h === "electronics") html = vElectronics();
  else if (h === "parts") html = vParts();
  else if (h === "tests") html = vTests();
  else if (h === "history") html = vHistoryHub("decisions");
  else if ((m = h.match(/^history-(decisions|versions|reviews)$/))) html = vHistoryHub(m[1]);
  else if (h === "reviews") html = vHistoryHub("reviews");
  else if ((m = h.match(/^f-(\w+)$/))) html = vFilter(m[1]);
  else if ((m = h.match(/^s-(\w+)$/))) html = vStage(m[1]);
  else if (h === "decisions") html = vDecisions();
  else if (h === "docs") html = vDocs();
  else if ((m = h.match(/^doc-([\w-]+)$/))) html = vDocPage(m[1]);
  else if (h === "reviews") html = vReviews();
  else if ((m = h.match(/^review-([\w-]+)$/))) html = vReview(m[1]);
  else if ((m = h.match(/^history-(day|round)$/))) html = vHistoryHub(m[1]);
  else if (h === "history-version") html = vHistoryHub("versions");
  else if ((m = h.match(/^version-([\w-]+)$/))) html = vVersion(m[1]);
  else if ((m = h.match(/^g-([\w]+)$/))) html = vGroup(m[1]);
  else if ((m = h.match(/^compare-([\w-]+?)(?:-rev-(\w)-(\w))?$/))) html = vCompare(m[1], m[2], m[3]);
  else if ((m = h.match(/^i-([\w-]+?)(?:-rev-(\w))?$/))) html = vItem(m[1], m[2]);
  else html = vMissing(h);
  if (audio){ audio.pause(); cancelAnimationFrame(raf); }
  $app.innerHTML = html;
  wire();
}
function rerender(keepScroll){ const y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ------- wiring per view */
function wire(){
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    try { navigator.clipboard.writeText(location.href).then(() => { b.textContent = "copied"; }, () => { b.textContent = "copy the address bar"; }); } catch(e){ b.textContent = "copy the address bar"; }
  });
  const v = document.getElementById("viewer"); if (v) v.onclick = () => v.classList.toggle("z");
  document.querySelectorAll("[data-h]").forEach(a => a.onclick = ev => { ev.preventDefault();
    const t = [...document.querySelectorAll("#doc h1,#doc h2,#doc h3")].find(x => x.textContent.trim() === a.dataset.h); if (t) t.scrollIntoView(); });
  const chg = document.getElementById("chg"); if (chg) chg.onclick = () => { S.changes = !S.changes; rerender(true); };
  wireCompare(); wireSound(); wireGroup(); wirePre();
}
let mermaidP = null;
function wirePre(){
  const mm = document.querySelectorAll("pre code.language-mermaid");
  if (mm.length){
    mm.forEach(c => { const d = document.createElement("div"); d.className = "mmd"; d.dataset.src = c.textContent; d.textContent = c.textContent; c.parentNode.replaceWith(d); });
    if (!mermaidP) mermaidP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    mermaidP.then(() => { window.mermaid.initialize({startOnLoad:false, theme:"neutral", fontFamily:"Inter, system-ui, sans-serif", securityLevel:"strict"});
      document.querySelectorAll(".mmd").forEach((d, i) => { window.mermaid.render("m" + Date.now() + i, d.dataset.src).then(r => { d.innerHTML = r.svg; }, () => {}); }); }, () => {});
  }
  document.querySelectorAll(".doc-html pre").forEach(p => {
    let fs = 12.5;
    while (p.scrollWidth > p.clientWidth + 1 && fs > 9.5){ fs -= 0.5; p.style.fontSize = fs + "px"; }
    if (p.scrollWidth > p.clientWidth + 1 && !(p.nextElementSibling && p.nextElementSibling.classList.contains("prehint"))){
      const h = document.createElement("div"); h.className = "prehint"; h.textContent = "Wide diagram: scroll sideways →"; p.after(h);
    }
  });
}
function wireGroup(){
  const d = document.querySelector(".gdoc"); if (!d || !window.matchMedia("(min-width: 1024px)").matches) return;
  const figs = document.createElement("div"), text = document.createElement("div");
  figs.className = "figs"; text.className = "text doc-html";
  [...d.children].forEach(el => (el.tagName === "FIGURE" ? figs : text).appendChild(el));
  d.classList.add("gcols"); d.appendChild(figs); d.appendChild(text);
}
let rz = 0, wasWide = window.matchMedia("(min-width: 1024px)").matches;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const w = window.matchMedia("(min-width: 1024px)").matches; if (w !== wasWide){ wasWide = w; rerender(true); } else wireCompare(); }, 200); });
function wireCompare(){
  const pair = document.getElementById("pair"), wipe = document.getElementById("wipe"); if (!pair) return;
  const wide = window.matchMedia("(min-width: 900px)").matches;
  pair.style.display = wide ? "grid" : "none"; wipe.style.display = wide ? "none" : "block";
  document.getElementById("wipehint").style.display = wide ? "none" : "block";
  const top = document.getElementById("wtop"), bar = document.getElementById("wbar"), knob = document.getElementById("wknob");
  const set = f => { f = Math.min(1, Math.max(0, f)); top.style.clipPath = `inset(0 ${(100 - f*100).toFixed(2)}% 0 0)`; bar.style.left = knob.style.left = (f*100).toFixed(2) + "%"; };
  set(.5);
  let drag = false;
  const at = e => { const r = wipe.getBoundingClientRect(); set((e.clientX - r.left) / r.width); };
  wipe.addEventListener("pointerdown", e => { drag = true; wipe.setPointerCapture(e.pointerId); at(e); });
  wipe.addEventListener("pointermove", e => { if (drag) at(e); });
  wipe.addEventListener("pointerup", () => drag = false);
}
function fmt(t){ const m = Math.floor(t/60), s = t - m*60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }
function wireSound(){
  const box = document.getElementById("sound"); if (!box) return;
  const it = I[box.dataset.code], vars = Object.keys(it.audio);
  let cur = vars[0];
  if (!audio) audio = new Audio();
  audio.src = it.audio[cur].src; audio.preload = "auto";
  const play = document.getElementById("play"), ph = document.getElementById("ph"), tm = document.getElementById("tm"), wave = document.getElementById("wave"), pk = document.getElementById("pk");
  const icon = p => play.innerHTML = p ? '<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" fill="#1A1A1A"/><rect x="9.5" y="2" width="3.5" height="12" fill="#1A1A1A"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M3 1 L14 8 L3 15 Z" fill="#1A1A1A"/></svg>';
  const tick = () => { const d = audio.duration || it.audio[cur].dur; ph.style.left = (100 * audio.currentTime / d).toFixed(2) + "%"; tm.textContent = fmt(audio.currentTime) + " / " + d.toFixed(2); if (!audio.paused) raf = requestAnimationFrame(tick); };
  play.onclick = () => { if (audio.paused) audio.play().then(() => { icon(true); tick(); }, () => {}); else { audio.pause(); icon(false); } };
  audio.onended = () => { icon(false); tick(); };
  wave.onclick = e => { const r = wave.getBoundingClientRect(); const d = audio.duration || it.audio[cur].dur; audio.currentTime = d * (e.clientX - r.left) / r.width; tick(); };
  box.querySelectorAll("[data-var]").forEach(b => b.onclick = () => {
    if (b.dataset.var === cur) return;
    const t = audio.currentTime, playing = !audio.paused; cur = b.dataset.var;
    box.querySelectorAll("[data-var]").forEach(x => x.classList.toggle("on", x === b));
    audio.src = it.audio[cur].src;
    audio.addEventListener("loadedmetadata", function f(){ audio.removeEventListener("loadedmetadata", f); audio.currentTime = Math.min(t, audio.duration - 0.01); if (playing) audio.play().then(tick, () => {}); else tick(); });
    wave.querySelectorAll("i").forEach((el, i, all) => { const p = it.audio[cur].peaks[Math.floor(i * it.audio[cur].peaks.length / all.length)]; el.style.height = Math.max(1, p * 100).toFixed(1) + "%"; });
    pk.textContent = it.audio[cur].peak_v != null ? "peak " + it.audio[cur].peak_v.toFixed(2) + " V" : "";
  });
  icon(false);
}

route();
})();
