    <feComposite in="na" in2="SourceGraphic" operator="in" result="nm"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="nm"/></feMerge></filter>
  <filter id="grainf" x="0" y="0" width="100%" height="100%">
